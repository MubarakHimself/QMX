  - id: DEC-0375
    title: "Cut: a Trading-desk execution tool, \"paper only\" included"
    statement: "QMA would ship a Trading-desk execution tool, including a 'paper only' variant. This is CUT: QMA's money-path output is never an order; L36 puts nothing above a bot on the market, and paper is an account role on a real venue, not a sandbox. No execution tool exists at any account role. This Cut is the ground for the AD-16/AD-28 money-path reachability barrier (DEC-0341): the act-level deny-list refuses every order/binding/sizing/promotion act at the Tool Registry, and placement refuses any environment or edge that could reach the trading node."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329); binds L36 and L39 and is enforced by AD-16 and AD-28 (DEC-0341)."
    sources: [EXT-2400, EXT-2416]
    component: null
    tags: [cut, dead]
    reason: "QMA's money-path output is never an order; L36 puts nothing above a bot on the market, and paper is an account role on a real venue"
  - id: DEC-0376
    title: "Cut: git-branch-per-parameter-mutation as the lineage mechanism"
    statement: "QMA would use a git branch per parameter mutation as its lineage mechanism. This is CUT: QMA uses content-addressed resolved config for parameter lineage (AD-14 content-addressed candidates with lineage edges); git is used only when code changes, not for every parameter variant."
