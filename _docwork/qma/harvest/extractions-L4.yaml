    authority: rider
  - id: EXT-2381
    type: decision
    summary: "RETIRED NAMES recorded (spine Vocabulary table): 'Quantum Mind' (dictation error) -> QuantMind Agents; 'Steward' (options-sheet draft) -> Quant; 'QMX Backtesting Framework' -> QMB; 'QMX Event Ledger' -> the event journal; 'Bot' in the agentic sense -> Quant (Bot stays the platform's trading-strategy instance); 'Context Engine' -> Context Compiler; 'Knowledge Base' -> Knowledge / KnowledgeSource; 'Kanban' -> Task Graph; and 'Backtesting Service' is the analysis-backtest plugin's daemon-half adapter (one qmb door per environment, no scheduler/parallelism/run ledger), never a second backtesting engine and never QMA re-specifying QMB."
