  - id: DEC-0368
    title: "Cut: relay, signing and public-messaging protocols as the bus transport"
    statement: "QMA's Agent Bus would use relay, signing and public-messaging protocols as its transport. This is CUT: that is sovereign multi-tenant messaging for strangers; a single-operator daemon's durable, addressed, non-authoritative bus (AD-20) needs none of it."
    status: dead
