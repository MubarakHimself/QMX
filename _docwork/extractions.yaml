  - id: EXT-2441
    type: decision
    summary: "FRESH START — the operator ruled a clean-slate restart for the agentic system, deleted the workroom/agentic-system-planning folder himself to the Recycle Bin, and fixed the ChatGPT design transcript as the highest authority (only the agentic-system-planning folder removed; the rest of the workroom stays). His stated reason is that the old workroom material would 'poison' the design. This is the source of the brief's rule that the deleted folder is NOT an input and nothing may be salvaged from it unless the transcript says the same."
    quote: "So take it as a fresh start. In fact, you can delete most of it. I don't really believe I might use it. I really don't. [...] I deleted it manually. Yep, move to recycle bin. [...] just take what is in the transcript as the highest authority. [...] I've only removed the f the agentic system planning folder, but the rest are there"
