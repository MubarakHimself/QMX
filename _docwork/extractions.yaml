  - id: EXT-2147
    type: decision
    summary: "SPINE ASSUMPTION REGISTER A1-A47 - every without-operator call this sitting made, each individually overturnable, each cited from the rule that depends on it. The register's authority is the memlog's RULING ENTRIES AS AMENDED (the operator-rulings entry, then the operator-amendments entry, then the GATE-2 rulings entry, in that order of accretion), not the earlier cheap-veto register entry which predates them and still frames A1/A10/A17/A26 as open; the spine's table is the CURRENT RECONCILED VIEW, and where it disagrees with a ruling entry the ruling entry governs. A1 RULED and NARROWED (no operator command line; qmn survives as the package and import CODE NAME only, the name itself left unruled, a rename mechanical). A8 RETIRED at the reviewer gate (the dead-zone width carries no node posture and no default; the disagreeing evidence is recorded unmerged). A10 RULED (the soak IS the full first-deploy warm-up week, unattended, on the demo account, live binding at its end). A17 RULED (Forex Factory's free weekly file the sole V1 source, no paid fallback ever, a second free source or an agent-scraped JSON in CT-15 shape as the later path, refresh cadence configurable, personal-use posture recorded). A26 RULED (promotion and activation are two separate acts, each a click, the precondition battery silent and server-side). The remaining rows proceed on recommendation: A2 nothing published to any index; A3 evidence tier and passive hub as directory trees on the same VPS; A4 the constructed compose-fingerprint-seal ceremony with no hot reload; A5 crash-loop evidence value 3 boots in 60 s; A6 maximum slice latency and accumulator bound as node values; A7 KSA levels adopted from the GitBook with a blank matrix cell blocking live; A9 the ratchet's minimum step as an improvement threshold sited as origination policy; A11 demo-account drift alarms rather than halts during the soak; A12 unexplained live drift stands entries down rather than flattening; A13 floating