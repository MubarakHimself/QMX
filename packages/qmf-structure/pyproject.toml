[project]
name = "qmf-structure"
version = "0.1.0"
description = "QMX-owned causal chart-object families under the CT-17 lifecycle law."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "qmf-core",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace submodule. Dot notation tells uv_build the module lives at
# src/qmf/structure/ with NO src/qmf/__init__.py anywhere in the distribution.
module-name = "qmf.structure"

[tool.uv.sources]
qmf-core = { workspace = true }
