# QMF V1 uv-workspace root.
#
# Two things live in this one file and MUST NOT be confused:
#
#   1. THE SSSF FACTORY-GATE STAMP (the original contents of this file). The
#      factory's merge gate re-runs three commands against every branch:
#          uv run --project <tree> --group dev ruff check .
#          uv run --project <tree> --group dev mypy adws
#          uv run --project <tree> --group dev pytest -q adws/tests
#      That gate is FAIL-CLOSED: a command that cannot run reads RED. Its
#      contract is the `[dependency-groups] dev` list and the `adws/tests`
#      pytest wiring below. Both are preserved verbatim in intent — the `dev`
#      group keeps every tool and library the gate needs, and
#      `[tool.pytest.ini_options] testpaths = ["adws/tests"]` is unchanged.
#
#   2. THE QMF WORKSPACE (added by Story 1.1). `[tool.uv.workspace]` declares
#      the seven roster packages under packages/ and the first extension under
#      extensions/. The canonical toolchain and the `poe` task surface (Tier-1
#      `check`, plus `check-integration` and `check-release`) gate the QMF code.
#
# The two coexist deliberately: the SSSF commands target `adws`, the `poe`
# tasks target `packages/ + extensions/ + tools/`, and neither weakens the
# other. `name`/`version` remain placeholders; nothing reads them.

[project]
name = "sssf-project"
version = "0.1.0"
description = "A project the Super Simple Software Factory was stamped into; also the QMF V1 uv-workspace root"
# The factory-stamp floor stays >=3.10 (the SSSF root is not a QMF package, and
# keeping this floor keeps ruff's inferred target at py310 so `adws` lints
# byte-identically to baseline). The actual CPython 3.14 pin (AR-04) lives in
# `.python-version` and in every member's own `requires-python = ">=3.14,<3.15"`;
# the workspace resolves and runs on 3.14 accordingly.
requires-python = ">=3.10"
# The same libraries every adws/*.py declares in its own PEP 723 header.
# Declared here too because adws/tests/ imports adw_modules directly, so `uv run
# --group dev pytest` needs them importable.
dependencies = ["pydantic", "python-dotenv", "pyyaml", "rich"]

[tool.uv]
# Provision the `dev` group by default for every `uv run` / `uv sync` in this
# workspace. The QMF Tier-1 gate runs as `uv run poe check`, and `poe` — like
# ruff, pyright and pytest — ships only in `[dependency-groups] dev`. Pinning
# dev as the default group guarantees a freshly cut worktree installs `poe`
# without an explicit `--group dev`, so `uv run poe check` never fails to spawn
# it. Belt-and-suspenders over uv's implicit dev default: explicit here so the
# gate cannot regress on a uv-default change. `--group scan` still adds skylos
# on top (default groups stay enabled alongside an added group), so the
# separate scan lane is unaffected.
#
# `store-engines` is provisioned by default too (Story 3.1). qmf-data is the
# first roster package to declare third-party RUNTIME dependencies (pyarrow +
# duckdb, the CT-11/CT-09 store engines) — declared ONLY in
# packages/qmf-data/pyproject.toml. The QMF suites import `qmf.*` from src via
# the pytest `pythonpath`, but those two engine libraries must physically be in
# the environment for `qmf.data.store` to import at test time. Installing the
# qmf-data workspace member (below) pulls them in, so a freshly cut worktree
# running `uv run poe check` has Parquet + DuckDB present without ever naming the
# engine libs outside qmf-data. The SSSF `dev` group and the adws pytest wiring
# are untouched.
#
# `calendar-tzdata` follows the same pattern for the off-roster
# qmf-calendar-forex extension (Story 4.1): its pinned `tzdata` is declared only
# in the extension's own pyproject, and installing the workspace member pulls
# that pin into the gate environment so import-time TZPATH verification can run
# under `poe test` without weakening `dev` or the adws pytest wiring.
#
# `venue-proto` follows the SAME pattern for qmf-venue (Story 8.2; DEC-0141): its
# pinned `protobuf` runtime is declared only in the venue's own pyproject, and
# installing the workspace member pulls that pin into the gate environment so
# `qmf.venue.proto` (which imports `google.protobuf` to compile the pinned Spotware
# release IN-HOUSE) imports at test time under `poe test`. Kept out of `dev` so the
# SSSF factory-gate contract stays byte-stable; protobuf stays declared only in
# qmf-venue and never leaks into another package.
# `indicators-talib` follows the SAME pattern for qmf-indicators (Story 7.2;
# DEC-0127): its pinned `ta-lib==0.7.1` canonical arithmetic reference is declared
# only in the indicators' own pyproject, and installing the workspace member pulls
# that pin (which ships a wheel-bundled C library on this tier-1 OS) into the gate
# environment so `qmf.indicators` can assert the reference-configuration record at
# import under `poe test`. Kept out of `dev` so the SSSF factory-gate contract stays
# byte-stable; ta-lib stays declared only in qmf-indicators and never leaks into
# another package.
default-groups = ["dev", "store-engines", "calendar-tzdata", "venue-proto", "indicators-talib", "qml-lib", "qmb-lib", "qa-suites"]

[tool.uv.workspace]
# The QMF distribution units. Seven roster packages (SemVer lockstep) under
# packages/, off-roster extensions (own SemVer ladders) under extensions/, and
# application-layer products (own SemVer, display-only) at the repo root — qml
# is the bot-authoring library (Story 11.1; DEC-0180); qmb is the
# experimentation/backtesting library plus CLI (Story 13.1; DEC-0167). Neither
# is a roster package.
members = ["packages/*", "extensions/*", "qml", "qmb"]

[tool.uv.sources]
# The qmf-data workspace member, referenced by the store-engines group below so
# its runtime engine deps (pyarrow, duckdb) land in the gate environment. The
# engine libraries themselves stay declared only in qmf-data's own pyproject.
qmf-data = { workspace = true }
# The qmf-calendar-forex workspace member, referenced by calendar-tzdata below so
# its pinned tzdata lands in the gate environment (Story 4.1; DEC-0106).
qmf-calendar-forex = { workspace = true }
# The qmf-venue workspace member, referenced by venue-proto below so its pinned
# protobuf runtime lands in the gate environment (Story 8.2; DEC-0141). The
# protobuf library itself stays declared only in qmf-venue's own pyproject.
qmf-venue = { workspace = true }
# The qmf-indicators workspace member, referenced by indicators-talib below so its
# pinned ta-lib canonical arithmetic reference lands in the gate environment (Story
# 7.2; DEC-0127). The ta-lib library itself stays declared only in qmf-indicators.
qmf-indicators = { workspace = true }
# The qml application-layer member, referenced by qml-lib below so `import qml`
# resolves in the gate environment (Story 11.1; DEC-0180). qml declares no
# third-party runtime dependency of its own.
qml = { workspace = true }
# The qmb application-layer member, referenced by qmb-lib below so `import qmb`
# and the `qmb` CLI resolve in the gate environment (Story 13.1; DEC-0167).
# click and optuna are declared only in qmb's own pyproject.
qmb = { workspace = true }

[dependency-groups]
# THE GATE'S CONTRACT — plus the QMF canonical toolchain, one environment for
# both gates. The last four (pydantic, python-dotenv, pyyaml, rich) and mypy /
# types-PyYAML are the SSSF factory-gate essentials and MUST stay: adws/tests/
# imports adw_modules, which imports them, and the gate runs `mypy adws`.
#
# The pinned QMF toolchain (AD-3/AD-4; DEC-0101/0102) is added on top: ruff,
# pyright (strict), pytest 9.x, poethepoet, and pytest-cov. Exact pins give
# byte-identical results on every machine; the committed uv.lock nails the rest.
dev = [
    # SSSF factory-gate essentials (do not remove)
    "mypy",
    "types-PyYAML",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "rich",
    # QMF canonical toolchain (AR-11)
    "ruff==0.16.3",
    "pyright==1.1.411",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "poethepoet==0.48.0",
]

# The QMF store engines, provisioned by default (see `default-groups` above).
# This group installs the qmf-data workspace member, which transitively brings in
# pyarrow + duckdb — the CT-11/CT-09 store engines qmf-data.store imports. Kept
# out of `dev` so the SSSF factory-gate contract in `dev` stays byte-stable, and
# named here so a reader sees exactly why the workspace installs a member package
# (Story 3.1; DEC-0117).
store-engines = ["qmf-data"]

# The independent QA verification suites (`qa/tests`, the separate `qa-verify`
# gate; 2026-08-27 QA phase) use hypothesis for their property layers. It was
# ad-hoc-installed during the QA phase and pruned by the next `uv sync`;
# declared here so the gate always runs. Kept out of `dev` so the SSSF
# factory-gate contract stays byte-stable.
qa-suites = ["hypothesis>=6,<7"]

# The forex calendar's pinned tzdata, provisioned by default. Installs the
# qmf-calendar-forex workspace member so `tzdata==2025.2` is present for
# import-time TZPATH / tzdb verification under `poe test`. Kept out of `dev` so
# the SSSF factory-gate contract stays byte-stable (Story 4.1; DEC-0106).
calendar-tzdata = ["qmf-calendar-forex"]

# The venue transport's pinned protobuf runtime, provisioned by default. Installs
# the qmf-venue workspace member so `protobuf==7.36.0` is present for the in-house
# proto compilation `qmf.venue.proto` performs under `poe test`. Kept out of `dev`
# so the SSSF factory-gate contract stays byte-stable, and named here so a reader
# sees exactly why the workspace installs the venue member (Story 8.2; DEC-0141).
venue-proto = ["qmf-venue"]

# The indicators' pinned canonical arithmetic reference, provisioned by default.
# Installs the qmf-indicators workspace member so `ta-lib==0.7.1` is present for the
# import-time reference-configuration assertion `qmf.indicators` performs under
# `poe test`. Kept out of `dev` so the SSSF factory-gate contract stays byte-stable,
# and named here so a reader sees exactly why the workspace installs the indicators
# member (Story 7.2; DEC-0127).
indicators-talib = ["qmf-indicators"]

# The qml bot-authoring library, provisioned by default. Installs the qml workspace
# member so `import qml` resolves under `poe test` / `poe types` without adding a
# third-party pin — qml consumes only qmf-core, qmf-registry, and qmf-risk (Story
# 11.1; DEC-0180). Kept out of `dev` so the SSSF factory-gate contract stays
# byte-stable.
qml-lib = ["qml"]

# The qmb experimentation/backtesting library plus CLI, provisioned by default.
# Installs the qmb workspace member so `import qmb` and the `qmb` console script
# resolve under `poe test` / `poe types`. click==8.4.2 and optuna==4.9.0 are
# declared only in qmb's own pyproject (Story 13.1; DEC-0168). Kept out of `dev`
# so the SSSF factory-gate contract stays byte-stable.
qmb-lib = ["qmb"]

# skylos is SEPARATE from `dev`, and not because it is optional - because it
# does not install everywhere. It depends on tree-sitter-dart-orchard, which
# publishes an sdist only and needs an MSVC toolchain to build on Windows; one
# shared group would take ruff, pytest and mypy down with it on every
# `uv sync`. adw_modules/quality.py treats every uv provisioning failure from
# this group as TOOL UNAVAILABLE ("incomplete"), never as a pass or a fail.
scan = ["skylos"]

[tool.pytest.ini_options]
# SSSF contract: a bare `pytest` (and the gate's `pytest -q adws/tests`) targets
# the factory suite. `poe test` passes `packages extensions qml qmb` explicitly,
# which overrides this default and collects the QMF package suites plus qml/qmb.
testpaths = ["adws/tests"]
# QMF package sources on the import path, so `qmf.*` resolves from src/ without
# an install at Tier 1 (additive; adws/tests never import qmf and are unaffected).
pythonpath = [
    "packages/qmf-core/src",
    "packages/qmf-registry/src",
    "packages/qmf-data/src",
    "packages/qmf-indicators/src",
    "packages/qmf-structure/src",
    "packages/qmf-venue/src",
    "packages/qmf-risk/src",
    "extensions/qmf-calendar-forex/src",
    "qml/src",
    "qmb/src",
    # Workspace tools (the tier-1 static scanners) import as top-level modules so
    # `poe test-tools` can measure their coverage (Story 1.7).
    "tools",
]

[tool.mypy]
# SSSF gate: `mypy adws` only. QMF workspace code is type-checked by pyright
# (strict) via `poe types`; mypy stays scoped to the factory machinery.
python_version = "3.10"
files = ["adws"]
# adw_data/ is runtime session output and stamped prompt files, not source.
exclude = "adws/adw_data"

[tool.ruff]
# adw_data/ holds runtime session output and the stamped prompt/config files,
# copied verbatim from the skill template - not source this project owns.
# recorder/ is the SSSF status-dashboard tooling stamped in at baseline; it is
# not QMF roster code and not linted here (the same "scope to shipped code"
# posture the CI applies to the AI-defect scanner).
# tools/tests/fixtures/ holds deliberately-broken sample modules (money-path
# float violations) that the money-path scanner parses as data — not shipped
# code, so it is neither linted nor type-checked (Story 1.7).
# qmx-agents/ is a nested uv workspace with its own SemVer ladder, lockfile, and
# quality surface (Story 40.1; AR-Q01/AR-Q11). Parent ruff must not own it —
# QMA pins ruff 0.16.5 while this workspace pins 0.16.3.
extend-exclude = ["adws/adw_data", "recorder", "tools/tests/fixtures", "qmx-agents"]
line-length = 100

[tool.ruff.lint]
# A REAL rule set for the shipped QMF workspace (packages/, extensions/, tools/).
# This block previously carried no `select`, so ruff ran only its E4/E7/E9/F
# defaults while the `ignore`/`per-file-ignores` below referenced rules (PLW1510,
# S101) that were never enabled — the gate read far stronger than it was. The
# families below are the pragmatic strong set; the noisy design-threshold and
# false-positive-prone rules are held out in `ignore` with a reason each, and adws
# (read-only factory machinery, see per-file-ignores) is kept at its baseline.
select = ["E", "W", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF", "PL"]
ignore = [
    # every subprocess call inspects returncode itself - explicit check= is noise here
    "PLW1510",
    # S603 flags EVERY subprocess call as "untrusted input"; ours use fixed argv
    # (sys.executable + literal args), so it fires everywhere with no actionable signal.
    "S603",
    # RUF002 flags intentional typographic/mathematical Unicode in docstrings (en
    # dashes in prose, the set-union symbol ∪ in registry records); "fixing" them
    # would corrupt the notation. RUF001/RUF003 stay on for identifiers/comments.
    "RUF002",
    # PLR design-threshold heuristics — magic-value comparisons and the too-many-*
    # counts (returns, branches, arguments, statements, positional args) — are
    # arbitrary thresholds that bury real signal. Held out; the rest of PL stays on.
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# adws/ is the SSSF factory machinery and is READ-ONLY in this worktree, yet the
# SSSF merge gate runs `ruff check .` over the WHOLE tree. Exempt adws from every
# family newly enabled above (everything beyond ruff's E4/E7/E9/F + F baseline) so
# it keeps linting byte-identically to baseline and the root gate stays green with
# zero adws edits. Only adds the carve-out; nothing here weakens packages/ code.
"adws/**" = ["E1", "E2", "E3", "E5", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF", "PL"]
# Tests assert (S101 is the whole point of a test); use fake tokens/secrets as
# fixtures (S105/S106/S107); and do deliberate local imports to exercise import-time
# behaviour (PLC0415). Test files may also reach into a package's private benchmark
# module (`_bench`) to exercise the harness.
"packages/*/tests/*" = ["S101", "S105", "S106", "S107", "PLC0415"]
"extensions/*/tests/*" = ["S101", "S105", "S106", "S107", "PLC0415"]
"qml/tests/*" = ["S101", "S105", "S106", "S107", "PLC0415"]
"qmb/tests/*" = ["S101", "S105", "S106", "S107", "PLC0415"]
"tools/tests/*" = ["S101", "S105", "S106", "S107", "PLC0415"]
# Example scripts use `assert` as a teaching/verification device (like a doctest —
# it shows the reader the expected result); they carry no other carve-out.
"packages/*/examples/*" = ["S101"]
"extensions/*/examples/*" = ["S101"]
"qml/examples/*" = ["S101"]
"qmb/examples/*" = ["S101"]
# QMB composition-root sandbox runner: stdlib process management (B-5).
# Dynamically-evasive bots are out of V1 scope; this is not a restricted interpreter.
"qmb/src/qmb/host/runner.py" = ["S404"]
# QMB orchestrator is the one impure owner of stdlib process-per-run spawn (B-5).
"qmb/src/qmb/orchestrator/*" = ["S404"]

[tool.pyright]
# Strict, workspace-wide over the QMF code (AR-11). adws is mypy's job, not
# pyright's, so it is not included here.
include = ["packages", "extensions", "qml", "qmb", "tools"]
# Pin the analysis platform to the ratified tier-1 OS (AR-04/AR-23: Windows).
# The orchestrator's process-watch seam uses the Windows process APIs
# (ctypes.WinDLL); pinning makes the battery CI job on a Linux runner render
# the same byte-identical verdict the tier-1 machine renders (AR-11), instead
# of failing on platform-conditional stdlib surface.
pythonPlatform = "Windows"
# The deliberately-broken money-path fixtures are scanner input data, not code to
# type-check (Story 1.7); the rest preserves pyright's default exclusions.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "tools/tests/fixtures"]
extraPaths = [
    "packages/qmf-core/src",
    "packages/qmf-registry/src",
    "packages/qmf-data/src",
    "packages/qmf-indicators/src",
    "packages/qmf-structure/src",
    "packages/qmf-venue/src",
    "packages/qmf-risk/src",
    "extensions/qmf-calendar-forex/src",
    "qml/src",
    "qmb/src",
    # Workspace tools import as top-level modules (see pytest pythonpath above).
    "tools",
]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.skylos]
# Skylos scans the repository ROOT and subtracts by NAME. This is deliberately not
# an include-list: a top-level folder a later epic adds (qmb/, qml/, ...) is in
# scope the moment it lands, with no config edit. Languages are auto-detected by
# file extension in one pass, so the TypeScript and Rust that arrive later are
# covered the same way — no language is named anywhere, on purpose.
#
# This block is the single source of scope truth. The CI workflow passes no
# `--exclude` of its own, and a local `skylos .` resolves this same file by walking
# up from the scan path, so CI and a developer's machine cannot drift apart.
#
# What is subtracted, and why: the non-code trees — transcripts, planning material,
# HTML artifacts, prose — which are noise to a code scanner and a false-positive
# farm for a secret scanner; plus `adws`, the software-factory machinery, held
# completely out of scope so no agent in any lane ever "fixes" the factory while
# chasing a Skylos alert.
#
# Matching semantics (skylos/core/file_discovery.py::should_exclude_path): a
# pattern with no slash and no wildcard matches a path COMPONENT at any depth,
# which is exactly the by-name behaviour this list wants.
#
# THIS LIST IS ENFORCED TWICE, and it has to be. Skylos honours it in file
# discovery, but its prompt-injection pass also probes a hard-coded set of
# high-priority locations — "", "docs", "prompt(s)", "config(s)", ".github" — for
# AGENTS.md / CLAUDE.md / README.md, and that probe reads no exclude list at all
# (skylos/analyzer.py). Run 32567871620 failed on docs/AGENTS.md for exactly that
# reason, with "docs" sitting right here. So the CI job READS this list and
# physically prunes those trees from its disposable checkout before scanning —
# the only thing that binds for every pass. Passing --exclude on the CLI does not
# help: it feeds the same set the probe ignores. This list stays the one source
# of truth; CI derives from it, and a local `skylos .` still reads it directly.
exclude = [
    "adws",          # software-factory machinery — never touched by a scan-driven fix
    "_bmad",         # BMad planning machinery — same ruling as adws
    "qa",            # the independent QA verification corpus (2026-08-27 phase): per-epic
                     # suites, trace artifacts and the qa-verify runner — verification
                     # machinery, not shipped code; the OR-10 gate numbers were ruled over
                     # the shipped tree, which this corpus deliberately sits outside
    "recorder",      # standalone operator tool, outside the QMF roster gates
    "archive",       # retired material
    "workroom",      # working notes
    "docs",          # the knowledge base (prose, not code)
    "_bmad-output",  # planning artifacts
    "_docwork",      # documentation-factory scratch
    "tracker",       # run tracking
    "queue",         # agent briefs
    "specs",         # specification prose
    "app_docs",      # transcripts and HTML artifacts
    "qmx-agents",    # nested QMA uv workspace — own lockfile and quality surface (Story 40.1)
]

# ONE rule is switched off, and only because it cannot read this project's
# manifests. SKY-D223 ("undeclared import") looks for a dependency in
# [project.dependencies] / [project.optional-dependencies] of the FIRST manifest it
# finds walking up from the scan root, and stops there
# (dependency_hallucination.py::_collect_declared_deps). It therefore cannot see
# PEP 735 `[dependency-groups]`, where this workspace declares pytest and the whole
# toolchain, nor the uv-workspace MEMBER manifests, where qmf-data declares pyarrow
# and duckdb. Everything it flagged here — pytest x20, pyarrow, duckdb — is in fact
# declared, just somewhere this version does not look, so its verdict on this repo
# is systematically wrong rather than occasionally noisy. It also reads imports by
# regex over raw text rather than by AST, so the prose "…creates no import edge…"
# in a docstring was reported as an undeclared module named `edge`.
#
# SKY-D222, the hallucinated-dependency check, stays fully ON — it is the AI-defect
# protection this gate exists for. It is not silenced anywhere; it is instead TAUGHT
# our own package names through the derived SKYLOS_PRIVATE_DEPS_ALLOW list the CI job
# builds from the workspace layout (see .github/workflows/skylos.yml).
ignore = ["SKY-D223"]

[tool.skylos.gate]
# Fail-closed on real defects: every bucket below is a hard zero, so a single
# finding fails the job. `max_critical` and `max_secrets` are additionally
# non-relaxable in Skylos itself (gatekeeper.py::_non_relaxable_gate_limit caps
# them at 0 whatever this file says); the rest are set to 0 here explicitly, well
# under the tool's looser defaults (max_security 10, max_high 5).
fail_on_critical = true
max_critical = 0
max_high = 0
max_security = 0
max_reliability = 0
max_secrets = 0
max_dependency_vulnerabilities = 0
max_ai_defects = 0
# `strict` deliberately stays false. Setting it true would REPLACE every threshold
# above with a single "any issue at all" check, folding dead code and quality
# heuristics into the same verdict and collapsing the named failure reasons into
# one line. Per-bucket zeros block just as hard and say why.
strict = false
# RATCHET GATE, by operator ruling OR-10a/b (2026-08-27). The quality and dead-code
# families were ANNOTATE-ONLY through the build — max_quality was a 1000000 sentinel and
# max_dead_code stayed unset (disabled) — because both are opinion about module structure:
# SKY-Q502 "god file candidate" on the ratified 100%-branch exact.py/chrono.py (CT-01/CT-02),
# SKY-Q702 "low cohesion" on SecretValue, SKY-Q301 "cyclomatic complexity 26" on
# persistence.py, plus the SKY-L0xx/C3xx/P4xx families. Splitting those modules to satisfy a
# line-count default would be a design change made for a scanner's benefit, which we are not
# doing, so none of them ever blocks on structure alone.
#
# The QA phase priced the whole repo at HEAD (baseline run 33039677890 @ 2c8d495): 4,084
# gate-counted quality findings and 79 dead-code findings. OR-10a/b turns that price into a
# floor — NEVER WORSE THAN TODAY. The gate fails the instant a change pushes either family
# above its baseline, and the two numbers RATCHET DOWN as families are genuinely worked off,
# never up. It gates on the COUNTS only, never on the overall letter grade (NFR-02 / AR-11:
# a deterministic, mechanically-checkable bar, not a subjective grade).
#
# Both limits must be ints: gatekeeper.py::_safe_gate_limit replaces any non-int with the
# tool's default of 10, and `_append_threshold_reason` only compares when the limit is an int.
# Lower them freely as the families clear (4084 -> ... -> 0); only max_critical/max_secrets are
# additionally capped at 0 by Skylos itself.
max_quality = 4084
# Dead code holds ONE finding of headroom over the 79-finding baseline: seven qmf-* packages
# export a public API nothing internal consumes yet — the classic library false-positive shape
# for a dead-code detector — so the floor is 80 (never worse than today), ratcheting down as the
# [[tool.skylos.dead_code.entrypoints]] / whitelist escape hatches retire the real positives.
max_dead_code = 80
#
# The escape hatches for a genuine false positive in any family remain
# [tool.skylos.whitelist], [[tool.skylos.dead_code.entrypoints]] and an inline
# `# skylos: ignore[RULE]`.

[tool.poe.tasks]
# The canonical QMF commands (AR-11), byte-identical on every machine. ruff /
# ruff-format / pyright / pytest target the shipped workspace (packages/,
# extensions/, qml/, qmb/, tools/); the SSSF gate independently covers adws.
fmt = "ruff format packages extensions qml qmb tools"
fmt-check = "ruff format --check packages extensions qml qmb tools"
lint = "ruff check packages extensions qml qmb tools"
types = "pyright"
test = "pytest packages extensions qml qmb --cov=qmf --cov=qml --cov=qmb --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80"
qa-verify = "python qa/run_qa_verify.py"
# Mechanical per-package + contract-module enforcement on top of the aggregate floor
# above: reads the coverage.json `test` writes and fails the gate if any package drops
# below 80% or exact.py/chrono.py drop below 100% branch (AR-20; M1).
cov-report = "python tools/coverage_report.py"
# The workspace tools (tier-1 static scanners + gate helpers) carry their own suite and
# their own 80% package coverage floor, scoped to the tool modules (Story 1.7, 1.8;
# M1/M7/M9; AR-20).
test-tools = "pytest tools/tests --cov=money_path_scan --cov=ambient_scan --cov=secret_scan --cov=mock_data_scan --cov=coverage_report --cov=workspace_meta --cov-branch --cov-report=term-missing --cov-fail-under=80"
secret-scan = "python tools/secret_scan.py"
# Tier-1 static scanner: fails closed on any binary float on the money path
# (NFR-02 enforcing FR-001; CT-01, DEC-0105).
money-path-scan = "python tools/money_path_scan.py"
# Tier-1 static scanner: fails closed on any read of the system clock or other ambient
# nondeterminism below the composition root (NFR-02 enforcing FR-002; CT-02, AR-16).
ambient-scan = "python tools/ambient_scan.py"
# Tier-1 static scanner: fails closed on mock, placeholder or fabricated data in
# shipped source, so constructed stand-in data can never reach a release.
mock-data-scan = "python tools/mock_data_scan.py"
build-all = "uv build --all-packages"
# Tier-2 isolated-install smoke: builds each package wheel, installs it alone with only
# its declared deps into a throwaway env, and imports its qmf.* module — so an undeclared
# import fails the isolated build, and no wheel ships qmf/__init__.py (AR-06/AR-18; M9).
isolated-build = "python tools/isolated_build_check.py"

[tool.poe.tasks.check]
# Tier 1 — every factory work unit. Format, lint, strict types, unit tests +
# coverage floor, the workspace-tool suite, the money-path float scanner (NFR-02
# enforcing FR-001), the ambient-nondeterminism scanner (NFR-02 enforcing FR-002),
# the mock-data scanner (no constructed stand-in data ships), and the secret-scan gate
# (AR-24). `cov-report` enforces the per-package + contract-module
# coverage floors on the JSON `test` writes (M1). Fail-closed: any nonzero step fails the gate.
sequence = ["fmt-check", "lint", "types", "test", "cov-report", "test-tools", "money-path-scan", "ambient-scan", "mock-data-scan", "secret-scan"]
default_item_type = "ref"

[tool.poe.tasks.check-integration]
# Tier 2 — landing into integration. Tier 1, a build of every workspace package, and
# the isolated-install smoke that installs each package alone and imports it so an
# undeclared import actually fails the isolated build (AR-06/AR-18; M9).
sequence = ["check", "build-all", "isolated-build"]
default_item_type = "ref"

[tool.poe.tasks.check-release]
# Tier 3 — ship. Tier 2 today; the clean-install smoke on both tier-1 OSes is
# added once a remote exists (AR-23: Ubuntu tier-1 stays untested until then).
sequence = ["check-integration"]
default_item_type = "ref"
