    formula: null
    units: null
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0105
    configurable: false
    notes: "Money, Price, and Quantity are whole-number integer counts at a declared scale; binary floating point is banned on the money path (DEC-0105, AD-7)."

  - name: money_decimal_scale
    symbol: null
    value: declared-per-value
    formula: null
    units: decimal-places
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0105
    configurable: false
    notes: "Scale is declared per value on Money(currency, scale); foreign scales are stored verbatim as evidence, never rescaled (DEC-0105, AD-7)."

  - name: price_decimal_scale
    symbol: null
    value: declared-per-value
    formula: null
    units: decimal-places
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0105
    configurable: false
    notes: "Scale is declared per value on Price(instrument, scale) — a price is an instrument-tagged ratio, never tagged with a single currency; foreign venue scales are stored verbatim (DEC-0105, AD-7)."

  - name: quantity_decimal_scale
    symbol: null
    value: declared-per-value
    formula: null
    units: decimal-places
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0105
    configurable: false
    notes: "Scale is declared per value on Quantity(unit, scale) with an opaque unit (lot, share, coin, contract); foreign scales are stored verbatim (DEC-0105, AD-7)."

  - name: money_rounding_mode
    symbol: null
    value: explicit-at-named-boundaries
    formula: null
    units: null
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0105
    configurable: false
    notes: "Rounding occurs only at named conversion boundaries (the venue adapter boundary is one) with an explicitly stated rounding mode; mixed-scale arithmetic auto-promotes losslessly or refuses (DEC-0105, AD-7)."

  - name: timestamp_precision
    symbol: null
    value: int64-utc-nanoseconds
    formula: null
    units: null
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0106
    configurable: false
    notes: "Every stored timestamp is int64 UTC nanoseconds since the Unix epoch (POSIX, no-leap-second); all nanosecond arithmetic is checked (DEC-0106, AD-8)."

  - name: timestamp_valid_range
    symbol: null
    value: "1677..2262"
    formula: null
    units: null
    type: string
    component: COMP-QMF-CORE
    decision: DEC-0106
    configurable: false
    notes: "int64 UTC ns representable range; overflow is a checked invalid-input refusal, never a wrap (DEC-0106, AD-8)."

  - name: forex_rollover
    symbol: null
    value: "17:00 America/New_York"
    formula: null
    units: null
    type: string
    component: COMP-QMF-CORE
    decision: DEC-0106
    configurable: false
    notes: "Accounting rollover of QMF's own first forex market-hours calendar; operator-adopted and independent of venue bars. GAP-0037 verification completed 2026-08-20 (DEC-0135): the venue's actual daily-bar boundary is measured per broker, never assumed equal to this rule, so this rollover stays QMF's accounting rule regardless of what a venue slices (DEC-0106, DEC-0135, AD-8)."

  - name: instrument_identity_shape
    symbol: null
    value: "(venue, opaque-venue-symbol)"
    formula: null
    units: null
    type: string
    component: COMP-QMF-CORE
    decision: DEC-0107
    configurable: false
    notes: "Instrument identity is (venue, the venue's own symbol); the symbol is opaque and never parsed; aliases and renames are separate dated records (DEC-0107, AD-9)."

  - name: canonical_hash_algorithm
    symbol: null
    value: "fp1:sha256"
    formula: null
    units: null
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0108
    configurable: false
    notes: "The fp1 recipe hashed with SHA-256, emitted fp1:sha256:<hex>; the single implementation lives only in qmf-core; recipe upgrades mint fp2 and old fingerprints stay valid forever (DEC-0108, AD-10)."

  - name: contract_version_syntax
    symbol: null
    value: "per-contract-integer-format-version; packages semver-lockstep-0.x"
    formula: null
    units: null
    type: string
    component: COMP-QMF-CORE
    decision: DEC-0103
    configurable: false
    notes: "Two ladders: every serialized contract carries its own integer format version stamped into each artifact; code packages use SemVer in lockstep, 0.x until the V1 blueprint ships (DEC-0103, AD-5)."

  - name: typed_refusal_codes
    symbol: null
    value: [invalid-input, unsupported-capability, unavailable-dependency, stale-evidence, policy-rejection, transient-venue-failure, storage-failure]
    formula: null
    units: null
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0109
    configurable: false
    notes: "Seven refusal categories, each carrying machine-readable context and retryability; categories are addable in later versions, never redefined (DEC-0109, AD-11)."

  - name: result_identity_key
    symbol: null
    value: "(producer-contract-identity, producer-contract-format-version, input-fingerprints, evidence-time-range, computation-identity, evidence-class, world)"
    formula: null
    units: null
    type: string
    component: COMP-QMF-CORE
    decision: DEC-0110
    configurable: false
    notes: "The result label is the result's identity — producer contract identity, producer contract format version, input fingerprints, evidence time range, computation identity, evidence class, and world; human display names live outside identity; the occurrence record is separate provenance (DEC-0110, DEC-0131, AD-12)."

