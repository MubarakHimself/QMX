# QMX variables registry — machine-readable schema for every configurable value.
#
# Per-variable schema fields: name, symbol, value, formula, units, type,
# component, decision, configurable, notes; value: null requires a gap id.
# Values are referenced by name from prose, never restated as literals (L38).
#
# NODE-INCREMENT SCHEMA ADDITIONS (2026-08-29; DEC-0254, DEC-0256, TN-18/DEC-0203):
#   value_status_required — the registry is the SCHEMA HALF: this flag declares
#     whether a variable may ever stand at provisional-evidence. The PER-VALUE
#     value-status (blank | provisional-evidence | ratified) does NOT live here;
#     it lives on the resolved node-config artifact's row for every value,
#     Book-declared values included, the compiler propagating it onto generated
#     fragments. A value-status countersign is a journaled powers-channel act
#     under the operator principal, refused without the variable's evidence
#     citation by fp1, one variable per call (DEC-0254, DEC-0202). A
#     provisional-evidence value that gates live money blocks role=live exactly
#     as a blank does; the soak gate requires at least a provisional-evidence
#     value for everything a TN-23 checklist item exercises (DEC-0203, DEC-0208).
#   owner_scope — who declares the resolved value: node | book | bot | bms |
#     node-and-book | node-and-bms | node-and-ops | venue (DEC-0256).
#   blank_effect — what an absent (blank) or provisional value costs, from the
#     three-way partition blocks-boot | blocks-role-live | blocks-soak; a row may
#     carry more than one, and blocks-soak is ALSO a generated property of any
#     variable a TN-23 checklist item exercises (DEC-0203, DEC-0256).
# Node-minted rows carry evidence values in notes only, never as a ratified
# constant in value: (L38, DEC-0256). Alert-class membership is NOT a registry
# row — FAILURES.md's notification-tier column is its sole home (DEC-0200,
# DEC-0256).
