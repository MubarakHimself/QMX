[project]
name = "qmf-calendar-forex"
version = "0.1.0"
description = "The first market-hours calendar extension. Off-roster, on its own SemVer ladder, with tzdata pinned."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# tzdata pin change is at least a minor SemVer bump on THIS extension's ladder
# (AR-27); do not bump the package version unless the pin actually changes.
dependencies = [
    "qmf-core",
    "tzdata==2025.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace submodule. Dot notation tells uv_build the module lives at
# src/qmf/calendar_forex/ with NO src/qmf/__init__.py anywhere in the distribution.
module-name = "qmf.calendar_forex"

[tool.uv.sources]
qmf-core = { workspace = true }
