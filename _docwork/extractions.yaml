    type: decision
    summary: "REVIEWER GATE RUN (six parallel lenses on the draft spine; first run lost three seats to a connection drop, resumed with cache): rubric 3C/8H/13M/4L (CONDITIONAL PASS); adversarial 7C/15H/10M/4L (CONDITIONAL PASS); parent-consistency 4C/15H/24M/9L (DO NOT RATIFY AS-IS); inputs-reconcile 0C/2H/5M/8L (PASS WITH CHANGES); ops-security 1C/7H/7M/2L (CHANGES REQUESTED); currency 0C/1H/1M/4L (PASS - every pin current and primary-sourced; proto tag 91 confirmed newest). CONVERGENT CRITICALS, the reason each gate ruling changed behaviour: kill-line input series undefined; backup key VPS-minted and host-sealed (dies with the host); drain made self-clearing against AD-36 never-auto; netting-or-hedging never modelled; the second-command-line question settled locally against a CLOSED PRD row; four blanket command-pipe blocks against L39; stand-down disarms the operator's flatten; one cTID credential refreshed per connection; Book mode and seat state owned twice (sealed config versus folds); command ordinal conflated with the journal sequence; the KSA fold could decay through a clocked reconcile; equity and drift arithmetic domain undeclared under epsilon 0. All closable at desk; none needed the operator except the Q1 rewrite."
