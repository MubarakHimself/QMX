ledger:

  - id: DEC-0211
    title: "Operator ruling R1 — the trading node has no operator command line"
    statement: "The trading node ships NO operator command line and no typed operator door of its own. Its control surface is the desktop UI over the node's doors — the in-process Python API, the localhost HTTP evidence read channel and the unix-socket powers action channel — and the node-to-UI connection reuses the same logic the agentic system will use: 'I believe it is the same setting or the same logic behind even the agentic system'; 'So it means that killing and all that, typing commands and whatnot most likely is going to be controlled via a UI. So there is nothing like commands or anything. Okay, it's a user interface on the desktop application as per the overall architecture.' The stated priority is 'Okay, first, make the trading node work. Make sure it can execute.' CONSEQUENCES, all applied at desk: the typed command-line door (the sitting's Door 2) is DELETED from TN-17 (DEC-0202); the command-line reconciliation note is WITHDRAWN from TN-1 (DEC-0186) because PRD FR-046, DEC-0159 and DEC-0185 Ruling C — qmb is the platform's single command-line surface — now stand unchallenged; deployment and provisioning become an OPERATIONS TOOLKIT of just node-... recipes (install, switch, rollback, the secrets provisioning wizard, the data bootstrap, replay, config init / validate / explain, notify test, hub publish, the on-demand restore rehearsal), which is DevOps tooling and never a trading control and never a product command line. The package, distribution and import name qmn is a CODE NAME only: the operator declined to rule the product name — 'That question is not for this layer' — so a rename is mechanical, and /opt/qmx, /var/lib/qmx, the qmx service account and the qmx/* credential labels are platform names that do not move."
    status: ratified
    rationale: "Dictated by the operator in the single AskUserQuestion round of 2026-08-28 in answer to Q1, which the first gate had rewritten from 'what is the node named' to 'may a second command exist at all' (memlog line 46 ruling 5). His answer went past all three offered options: no command line at all. Applied at desk by the amendments entry (memlog line 49) and carried into the spine's 'Operator rulings 2026-08-28' section. TRANSCRIPT-FIDELITY NOTES from the SRC-12 scan, recorded so no absorbing doc repeats them: the enumeration 'status / kill everything / resolve a stuck order / promote' attached to R1 is the ASKING agent's wording inside the question, not the operator's (scan D7) — his own words are 'killing and all that, typing commands and whatnot', and the hedge 'most likely' sits immediately before the flat 'So there is nothing like commands or anything'; the memlog and spine capitalise 'There' and drop the leading 'So' (scan D10); the verbatim sentence 'a very separate system, like how big tech teams work', which the spine attaches to the operations toolkit, was said in the transcript of the DevOps LAYER OR LENS as a whole (scan D8); and 'That question is not for this layer' is tied in the transcript to the node-command half of the bundled question, so 'the operator declined to rule the name' is a defensible inference rather than a direct refusal to name (scan D9) — the brief's instruction to record the declined naming stands, with the referent noted. Rests on A1, RULED and NARROWED by this ruling, and on A23, whose command-line half is ruled away."
    sources: [EXT-2126, EXT-2132, EXT-2160, EXT-2167, EXT-2131, EXT-2150]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, operator-ruling, r1, doors, operations-toolkit, naming, no-command-line]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-48"

  - id: DEC-0212
    title: "Operator ruling R2 — the soak is one full unattended week, with a separate zero-authority observability stack"
    statement: "The soak IS the ratified first-deploy warm-up week in full — not its first two days — run UNATTENDED on the demo account, with the live binding taken at its end and the TN-23 acceptance checklist unchanged: 'So, for me, I think two days to a week unattended to... I think a week is enough and sufficient.' The operator's stated reason for the week is coverage: 'Because I'm sure in a trading week, we should be able to get a news week, we should be able to get some few things here and there.' Tracking through that week is mandatory and is his own requirement: 'but remember, I did request for the DevOps lens, which means we need to be tracking... tracking to make sure things are up, you know, what happened, logging so that we catch bugs, we catch errors, and we know what's going on.' He named Prometheus and Grafana himself. APPLIED: TN-15 (DEC-0200) ships an OBSERVABILITY STACK as a SEPARATE zero-authority system — a compose file under qmn/deploy/observability/, its own unit under a distinct non-qmx account, its own storage quota, every port bound to loopback, scraping /metrics and reading node logs through a dedicated read-only journal namespace, and a declared fourth secret holder that holds nothing the node holds; containers are permitted for THIS stack only and the node runs and passes without it. The node's own half is the exporters and the dashboard-as-code seeds. He also named a future dedicated monitoring agent — 'I'm going to have a dedicated agent, I believe it's the Hammers agent. Don't worry about it, we shall set it up' — which is a deferred later consumer of that stack, never an authority over the node."
    status: ratified
    rationale: "Dictated in answer to Q2 of the 2026-08-28 round; applied at desk to TN-9 (DEC-0194) and TN-15 (DEC-0200) by the amendments entry (memlog line 49) and reaffirmed in the spine's rulings section. It RULES A10 and it supersedes the operator's own kickoff milestone text ('the first milestone is the node running paper mode on a demo account for ~2 days'), so the kickoff wording is superseded history (scan U8). TRANSCRIPT-FIDELITY DEFECT, the most serious the scan found and corrected here: the memlog and the spine both quote the operator as saying 'I know what you're talking about' about a Prometheus/Grafana-class stack, presenting him as familiar with it. He said the opposite about himself, and the phrase was addressed TO the agent: 'I don't know if you set it up or you've considered it Prometheus, Grafana. I know how DevOps work, I'm not so technical, I don't know what all that is, but you know what I'm talking about.' (scan D1). Absorbing docs must never present the operator as claiming familiarity with the stack; the naming of Prometheus and Grafana IS his and the tracking mandate is unaffected. The 'Hammers agent' survives only in the memlog and is dropped by the spine (scan U5) — it is carried here so absorption does not lose it. Depends on A10 (RULED), A21, A35 and A42 (proceed-on-recommendation), and on A47, which lets the live connection open for sensing and recording only during the week."
    sources: [EXT-2127, EXT-2132, EXT-2161, EXT-2131, EXT-2147]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, operator-ruling, r2, soak, observability-stack, devops, transcript-correction]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-48"

  - id: DEC-0213
    title: "Operator ruling R3 — promotion is a click, activation is a second act, the battery runs silently"
    statement: "Promotion and activation are TWO SEPARATE HUMAN ACTS, each a click on the user interface: 'So, two separate acts. Promotion is just a simple click because promotion, I'm going to be looking at the results, how it performed.' Promotion rests on backtest evidence the operator has already reviewed — 'the whole point of promotion is based off backtesting' — so the node runs the precondition battery SILENTLY, server-side, against fresh state and against that reviewed evidence, and the operator sees results, never machinery; activation is the separate second act that starts the binding. The agentic system's own pre-promotion paper period is explicitly out of this layer's scope: 'most boats [bots] paper trade before they even come back for promotion. Okay, so that doesn't concern you because it's part of the agentic system and it will come later. For you, you're focusing on live trading.' APPLIED into TN-20 (DEC-0205), whose API exposes both acts, and into TN-17 (DEC-0202), whose powers channel carries them under the operator principal only. The operator's recollection in the same turn — 'not every bot starts trading right away. I do recall there is some sort of warm-up period, unless I'm wrong' — is answered here rather than left open: the inherited AD-32 admission row is registration linters, technical demo or paper shakedown and one operator signature, with NO probation and NO paper-performance gate, so there is no per-bot post-promotion warm-up in V1; the warm-up he remembers is the deploy-level first-deploy warm-up week of TN-9 (DEC-0194, R2)."
    status: ratified
    rationale: "Dictated in answer to Q3 of the 2026-08-28 round, RULING A26, and applied at desk into TN-20's wording. TRANSCRIPT-FIDELITY DEFECT recorded: the memlog and spine present 'A simple click on the user interface... two separate acts.' as one quotation; it is a SPLICE that does not occur contiguously (scan D2) — the transcript has, separately, 'But promotion is more like a click on the user interface to be like, okay, now this can go to the live trading node' and later 'So, two separate acts. Promotion is just a simple click...', with a capitalised 'A' added. The substance is correct; the composite quotation is not used here. A second defect: 'focus on live trading' is a paraphrase inside quotation marks (scan D4) — the transcript reads 'For you, you're focusing on live trading.' The scan's one REAL CARRY GAP (U1) is closed by the last sentence of the statement: neither the memlog nor the spine answered the operator's post-promotion warm-up recollection, and the memlog folded it into his different sentence about the agentic system's pre-promotion paper period. Rests on A26 (RULED) and on the inherited AD-32 admission row."
    sources: [EXT-2128, EXT-2132, EXT-2162, EXT-2131]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, operator-ruling, r3, promotion, activation, admission, transcript-correction]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-48"

  - id: DEC-0214
    title: "Operator ruling R4 — no paid news, ever; Forex Factory's free weekly file is the sole source"
    statement: "The node never pays for news data: 'I'm not paying for bloody news, I really don't think I will. To be honest, I won't pay for news. That's the first thing I have to be clear on. I will not pay for news. Let's use the free version.' Forex Factory's free weekly file is the SOLE V1 news-calendar source and NO paid fallback slot exists anywhere — the slot the sitting had recommended is deleted from TN-13 (DEC-0198) and no registry row is minted for it. Because all three sessions are traded, timeliness matters, so news_calendar_refresh_cadence is minted configurable (evidence: every 2 h and before each session open, inside the free feed's roughly 2-downloads-per-5-minutes budget, with a declared per-firing retry count and backoff inside the same budget), and fail-closed on a failed refresh stands: news_calendar_max_staleness is a per-decision-cycle precondition that refuses entries on a stale news calendar, so a silently dead calendar timer needs no separate signal. The later fallback path is the operator's own proposal — a second FREE source, or 'a cron job that scrapes these websites or an agent on a weekly basis that scrapes the information and updates it in JSON format' delivered in the same CT-15 intake shape: 'Now, the later versions, yes, no, we're going to iterate.' The legal archiving posture for the feed stays an OPEN OPERATOR ITEM recorded as personal use, exactly as Dukascopy was."
    status: ratified
    rationale: "Dictated in answer to Q4 of the 2026-08-28 round, RULING A17 and going past the offered options, which had all carried a paid tier. Applied at desk into TN-13 by the amendments entry (memlog line 49); GATE-2 ruling 7 (memlog line 51) then added that news-calendar revisions may only WIDEN or ADD an in-force or same-day window automatically, that news-calendar CODE identity is sealed into composition_fp while news-calendar DATA snapshots are frontier-read observations, and that the recorder's retry policy lives inside the provider budget. It also disposes PRD section 10 row 14, whose owner column reads 'Operator ruling at node/ops' (DEC-0239). TRANSCRIPT-FIDELITY NOTE: the memlog and spine quote 'later versions, yes, we're going to iterate' — the transcript reads 'Now, the later versions, yes, no, we're going to iterate', a dropped mid-sentence self-correction with no change of meaning (scan D5). His three-session timeliness rationale and the scraping idea are carried, not invented."
    sources: [EXT-2129, EXT-2132, EXT-2163, EXT-2131, EXT-2156]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, operator-ruling, r4, news-calendar, forex-factory, personal-use]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-48"

  - id: DEC-0215
    title: "Also ruled from the same round — the UI, MIS training, extensibility, alpha decay, QMF portability"
    statement: "Five further calls came out of the same 2026-08-28 dictated round and are applied above. (a) THE UI WILL EXIST and the node is designed with it in mind everywhere — 'I think you might need to consider the fact that the UI is going to exist... now that you know, consider it in almost everything' — with the node as one surface inside that UI (the operator's own word for it is a banned term in this corpus and is never reused in prose); he leaned to no dedicated page and then hedged: 'It's not a, it doesn't have its own page or something. Okay, I think it might. I think it might... Okay, I'm not certain yet.' Every operator moment (kill switch pressed, news window in force, stuck UNKNOWN, promotion, activation, resurrect) becomes a behaviour-driven UI story at the later UI sitting, rendered from TN-17's read models and powers; nothing about the doors changes for it. His own reason for deferring the UI is that it is too large to build alongside the node — 'we are trying to be efficient with our resources' — and that the node is back-end heavy while the user interface is less. (b) MIS MODELS DO NOT EXIST AND MUST BE TRAINED — 'the models in the MIS need to be trained' — by download, clean, train, shadow-roll, run either as a script he runs on his own laptop or by agents in a sandbox over hours, sequenced last because 'once we finish documenting epics and stories and all that, the coding part is mostly 99% autonomous... So which means the last part should be about the MIS.' The SHADOW-LANE SEAM is V1 node work (TN-19, DEC-0204): candidate labeler registration at the root, a shadow snapshot stream to its own manifest prefix under shadow_composition_fp, and a comparison read model, never a live consumer. The TRAINING plus SHADOW ROLLOUT itself is a named follow-on epic after the paper milestone; Kronos-class pretrained candidates — 'I know some models like Kronos are on GitHub, so that changes things' — are candidates only, and a recovered or pre-trained model carries NO authority without fresh ratification. (c) EXTENSIBILITY IS A REQUIREMENT: 'I want to build this system to be extensible because remember, we have to make sure that I can add new books, I can add new BMSs, I can add new versions actually of all the above. I can add bots, obviously.' Adding a Book, a BMS, a bot or a new version of any is registry plus roster config plus a restart at a safe point, NEVER code (TN-18 DEC-0203, TN-22 DEC-0207). (d) ALPHA DECAY stays at AD-41 primitives — 'If we haven't, leave it for now.' (e) QMF PORTABILITY is not this layer's concern — 'because QMF we made it portable, unless I recall properly, but it is bloody portable. And if it isn't, that doesn't concern you.'"
    status: ratified
    rationale: "All five are the operator's own volunteered statements inside the same dictated dumps that produced R1-R4, recorded in the memlog's operator-rulings entry (line 48) and carried into the spine's 'Also ruled from the same round' paragraph. (a) reverses his own kickoff non-negotiable 'No UI in this phase. UI comes after the agentic system' — the supersession is his, not the sitting's (scan U8), and the sizing rationale (scan U2) and the back-end-heavy scope statement (scan U3) are carried here because the spine dropped them entirely. TRANSCRIPT-FIDELITY DEFECT: the memlog and spine render 'it might have its own page... I'm not certain yet' as contiguous; it is RECONSTRUCTED (scan D3) and reverses his lean while keeping the uncertainty, so the verified wording is used above. The naming remark (scan U9) is honoured by paraphrase only. (b) is why TN-19's seam is built now and the ML half deferred, and why the Deferred table's MIS row is a named epic; (d)'s quote is capitalised 'If' in the transcript and lowercased mid-sentence by the spine (scan D10); (e) is not a verbatim quotation in the form the spine gives it, and his not-my-concern disposition is conditional on the portability being false (scan D6). Depends on A25 (MIS consumers are the Book door and the KSA only, bots never) and A24 (no hot-apply of settings in V1), both proceed-on-recommendation."
    sources: [EXT-2130, EXT-2132, EXT-2164, EXT-2165, EXT-2166, EXT-2167, EXT-2148]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, operator-ruling, also-ruled, ui, mis, extensibility, alpha-decay, transcript-correction]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-48"

  - id: DEC-0216
    title: "Gate ruling 1 — the kill-line input series"
    statement: "The kill line is declared by the Book definition and evaluated PER BINDING against that binding's virtual-ledger equity, marked to the latest observed price of its own virtual positions (realized plus unrealized of those positions), on every slice carrying a fill or a price update on an instrument the binding holds and at each accounting rollover. Venue equity (balance plus unrealized, converted_by=venue, exact integers at the account money exponent) is the BMS and account view and the reconciliation counterpart — never the per-Book breach series. book_capital (period-open, EXCLUDING unrealized) is the sizing ladder's input only. ONE variable carries the floor: the ratified registry key kill_line_capital_floor IS AD-40's loss_floor and the node mints no second name. A breach flattens and stands down THAT BINDING only."
    status: ratified
    rationale: "A convergent critical across the six first-gate lenses: the kill line had no defined input series, so three plausible series (venue equity, book_capital, virtual-ledger equity) could each have been implemented and each would breach at a different instant. Naming the series makes the floor arithmetic rather than aspiration, and confining the breach to one binding keeps a per-Book control from becoming an account-wide one. AMENDS TN-8 (DEC-0193) and TN-25 (DEC-0210), and fixes the counterpart role of venue equity used by TN-10 (DEC-0195); parent finding H9 is applied through it. It is also the ruling that forces the kill_line_capital_floor = loss_floor parent annotation (DEC-0255)."
    sources: [EXT-2133, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-1, kill-line, virtual-ledger, tn-8, tn-25]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0217
    title: "Gate ruling 2 — backup payload-key custody and the host-loss rehearsal"
    statement: "The CT-14 backup payload key is generated at provisioning ON THE WORKSTATION, escrowed in Windows Credential Manager under qmx/backup-payload-key plus one operator-held offline copy, and delivered to the VPS as a bootstrap credential. The VPS-minted KEK protects rotated session material ONLY. A host-loss restore rehearsal — clean host plus the escrowed key and nothing else — runs once before the live milestone and after every rebuild, and that rehearsal is what MEASURES the recovery time objective. A VPS-loss runbook is minted with its ordered steps: procure, bootstrap, provision, re-authorize cTrader because the stored refresh token is spent, restore with the escrowed key, replay check."
    status: ratified
    rationale: "A convergent critical: the drafted design minted the backup payload key on the VPS and sealed it with the host key, so the backup died with the host it was meant to survive — the one failure the backup exists for. Moving custody to the workstation with an offline copy, and proving it with a clean-host rehearsal, turns a claimed recovery objective into a measured one. AMENDS TN-12 (DEC-0197) and TN-13 (DEC-0198), and adds the runbook obligation TN-16 (DEC-0201) ships. It is the parent-annotation source for the CT-14 custody item (DEC-0252). Depends on A16 and A18, both proceed-on-recommendation."
    sources: [EXT-2133, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-2, backup, key-custody, restore-drill, tn-12, tn-13]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0218
    title: "Gate ruling 3 — never-auto predicates, and node stand-down as a lifecycle state"
    statement: "AD-36's never-auto predicates hold verbatim: suspend_new and drain are never-auto, and flatten is scope-flat-at-reconciled. The SIGTERM stop is a boot-epoch LIFECYCLE state, not a CT-30 action. The clock no-new-entry band is a per-decision-cycle precondition, never a standing action. NODE STAND-DOWN (crash loop, halt band, preflight failure) is a node lifecycle state entered automatically and left ONLY by an operator resurrect act through the powers door, journaled as an operator control action at global scope. The KSA fold is MONOTONE within a level epoch and lowers only on an operator resume. The standing-intent machinery covers amend_protection and the CT-23 protective closes."
    status: ratified
    rationale: "A convergent critical: the draft made drain self-clearing, which contradicts AD-36's never-auto predicate, and it left the node's own stand-down without a named exit, so a 3am crash loop could have ended with a silent automatic resume. Making stand-down a lifecycle state with one operator-signed exit, and keeping the KSA fold monotone within a level epoch, prevents a clocked reconcile from quietly de-escalating protection. AMENDS TN-7 (DEC-0192), TN-4 (DEC-0189), TN-8 (DEC-0193), TN-14 (DEC-0199) and TN-17 (DEC-0202). Later modified by GATE-2 rulings 3 and 4 (memlog line 51, DEC-0236): stand-down refuses ENTRY intents only whatever the author, and resurrect is journaled under a declared AD-21 node_resurrect control-action EVENT subtype rather than any CT-30 kind (DEC-0249)."
    sources: [EXT-2133, EXT-2139, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-3, never-auto, stand-down, resurrect, ksa-fold, tn-4, tn-7]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0219
    title: "Gate ruling 4 — netting or hedging is a measured venue fact, never an assumption"
    statement: "netting | hedging is a MEASURED-AT-CONNECTION CT-18 field. A bind-time shared-flatten signature is required, with one-Book-per-netted-account as the default. Scope resolution reads the position model BEFORE dispatch and REFUSES rather than widens — a close scoped to one Book on a netted account never silently closes another Book's exposure. Where CT-18 declares netting, the fill-to-virtual-position ATTRIBUTION DECLARATION is mandatory: absent, it is a bind-time policy rejection, never a trade-time discovery and never an implementer's default."
    status: ratified
    rationale: "A convergent critical: the account position model was never modelled at all, so every scope-resolution and flatten path was written as though hedging were universal; on a netted account that silently converts one Book's flatten into an account-wide one. Refusing rather than widening keeps the failure loud. AMENDS TN-11 (DEC-0196), TN-6 (DEC-0191), TN-22 (DEC-0207) and TN-25 (DEC-0210). Later strengthened by GATE-2 ruling 15 (memlog line 51, DEC-0236): the attribution declarations across every binding on one account must be jointly exhaustive and disjoint, a PARTITION proved at compile, an invalid input refusal otherwise."
    sources: [EXT-2133, EXT-2140, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-4, netting, hedging, attribution, tn-11, tn-22, tn-25]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0220
    title: "Gate ruling 5 — the second command-line question, surfaced at the gate and OVERTAKEN by R1"
    statement: "AS RULED AT THE GATE: the second-command-line question was restated as a DECLARED RECONCILIATION NOTE in TN-1's L30 shape — PRD FR-046 and DEC-0185 Ruling C name qmb the platform's single command-line surface, the node appeared to need an operator-typed door on the VPS, the conflict was SURFACED and never settled locally — and operator Q1 was rewritten to ask whether a second command may exist at all: (a, recommended) qmn as the node's own command on the VPS; (b) a qmb node group through a separate proxy distribution over the HTTP door; (c) API plus HTTP doors only, with no command line. OVERTAKEN THE SAME DAY: the operator ruled option (c) and further — no operator command line at all (R1, DEC-0211, memlog line 48) — so the reconciliation note was WITHDRAWN at desk (memlog line 49) and no conflict remains. What survives from this ruling is its blast-radius finding: /opt/qmx and the qmx/* credential labels are PLATFORM names and stay, while the distribution name, the import name, the just node-... recipe prefix and the qmn_ metric prefix are ONE identifier set that moves together on any rename."
    status: ratified
    rationale: "The gate's contribution was procedural and correct: a child spine had settled a question against a CLOSED PRD row on its own authority, and the lens caught it. Refusing to settle it locally is what put it to the operator, and his answer went past the option set. AMENDS TN-1 (DEC-0186) and TN-17 (DEC-0202), and is SUPERSEDED IN ITS RECOMMENDATION by DEC-0211: the memlog's pre-ruling 'qmn command' and 'Door 2' text is superseded history and is never presented as current. Recorded here because the blast-radius clause is still live law for any future rename."
    sources: [EXT-2133, EXT-2126, EXT-2144, EXT-2150]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-5, command-line, superseded, tn-1, tn-17]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0221
    title: "Gate ruling 6 — entry-side-only blocks (L39 exit preservation)"
    statement: "Every block the node can raise on a command stream — startup gating, rotation-store failure, an unpersistable sink, a partial write, an outstanding UNKNOWN, stand-down — refuses place_order and RISK-INCREASING amend_protection only, and NEVER a cancel, a close, a close_all or a risk-non-increasing amend. Where the venue path is unavailable, a protective command becomes a STANDING INTENT. In stand-down, operator protective commands and the standing-intent dispatcher always pass: 'reachable' means enactable, not merely addressable."
    status: ratified
    rationale: "A convergent critical: four blanket command-pipe blocks had been drafted, each of which would have disarmed the operator's own flatten at the exact moment it was needed — the precise move L39 (DEC-0150) forbids. AMENDS TN-6 (DEC-0191), TN-7 (DEC-0192), TN-10 (DEC-0195) and TN-4 (DEC-0189). MODIFIED by GATE-2 ruling 1 (memlog line 51, DEC-0236), which carved out the one exception the parent already licenses: AD-27's per-command UNKNOWN block is AD-36's ONE non-control block, so on that (VenueId, account) stream every command is refused including protection, a refused protective act stands as a journaled protection intent re-decided on resolution, and only resolve_unknown clears it — this is the uncertainty law, not a minted control-action kind, so DEC-0150's ban on minting a blanket command-pipe block is honoured, and TN-23 and TN-24(c) were corrected to say so."
    sources: [EXT-2134, EXT-2139, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-6, l39, exit-preservation, standing-intent, tn-6, tn-7]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0222
    title: "Gate ruling 7 — credential rotation is scoped by credential reference, not by connection"
    statement: "At most ONE refresh is in flight PER CREDENTIAL REFERENCE, owned by the connection manager as a whole rather than by any single connection. The roster declares whether the demo and live environments share one cTID credential. An authentication failure attributable to a rotation in flight is RETRY-AFTER-REFRESH, never an UNKNOWN."
    status: ratified
    rationale: "A convergent critical: the draft refreshed one cTID credential once per connection, so two connections sharing a credential would race each other's rotation and spend the refresh token, and the resulting auth failure would have been minted as an UNKNOWN — blocking a whole command stream over a bookkeeping fault. AMENDS TN-12 (DEC-0197) and TN-11 (DEC-0196). NARROWED by GATE-2 ruling 8 (memlog line 51, DEC-0236): retry-after-refresh applies ONLY to requests carrying no command identity (auth, subscription, heartbeat, gap replay, read-back); commands are never retried — UNKNOWN past wire handoff, a veto-path refusal before it. Depends on A16, proceed-on-recommendation."
    sources: [EXT-2134, EXT-2139, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-7, secrets, rotation, credential-reference, tn-11, tn-12]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0223
    title: "Gate ruling 8 — config carries eligibility and identity only; runtime state is a fold"
    statement: "The resolved node-config NEVER carries runtime state. Book mode, binding state, seat state, standing intents, the KSA level, bench counts, exposure and budgets are FOLDS over journals. A paper flip, an activation and a benching mint RECORDS, never config versions. docs/registry/variables.yaml declares SCHEMA only — unit-kind, flags, owner scope, admission_impact, evidence values — and the resolved config artifact is the sole home of resolved values."
    status: ratified
    rationale: "A convergent critical: Book mode and seat state were owned twice, once in a sealed config version and once as a journal fold, so a restart could resurrect a stale mode and silently re-arm a benched seat. One owner per fact removes the ambiguity, and it is what makes the crash-never-resets-safety-counters invariant true (there are no counters, only projections). AMENDS TN-18 (DEC-0203) and the fold vocabulary of TN-10 (DEC-0195). EXTENDED by GATE-2 rulings 30 and 22 (memlog line 51, DEC-0236): the config compile has FOUR layers (roster, BMS fragment, Book fragment, node defaults) with the invocation layer deleted, and the per-value value-status lives on the resolved artifact's row with value_status_required as the registry's schema half (DEC-0254). Depends on A24, proceed-on-recommendation."
    sources: [EXT-2134, EXT-2140, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-8, config, folds, registry-schema, tn-18]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0224
    title: "Gate ruling 9 — the command ordinal and the journal sequence are two different counters"
    statement: "The COMMAND ORDINAL is monotone, never reused across the life of a (VenueId, account) stream, with a durable high-water mark recovered BEFORE the sequencers open. The JOURNAL SEQUENCE is gapless per writer and boot epoch. They are distinct counters and neither substitutes for the other. clientMsgId is carried by a DURABLE COMMAND-ID-BINDING RECORD persisted BEFORE submission — the V1 path, because a 100-character field cannot be a total injection of the identity. The SUBMISSION DEADLINE starts at WIRE HANDOFF, never at mint. Pacer wait is a local queue with its own bound and a veto-path refusal, never an UNKNOWN."
    status: ratified
    rationale: "A convergent critical: conflating the ordinal with the journal sequence would have made a gapless-per-writer stream and a never-reused-per-account stream the same object, which they cannot both be across boot epochs, and would have broken recovery of the outstanding-command set. Starting the deadline at wire handoff is what keeps a local queue wait from manufacturing UNKNOWNs, which are the most expensive state the node has. AMENDS TN-5 (DEC-0190), TN-6 (DEC-0191) and the boot-epoch stamping of TN-2 (DEC-0187)."
    sources: [EXT-2134, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-9, counters, command-ordinal, journal-sequence, tn-5, tn-6]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0225
    title: "Gate ruling 10 — the equity and drift arithmetic domain is exact scaled integers"
    statement: "All equity and drift arithmetic is EXACT SCALED-INTEGER arithmetic at the ACCOUNT MONEY EXPONENT. Each figure is decoded at its OWN declared exponent and then exactly re-scaled; a figure that cannot be scaled, or that arrives without an exponent, REFUSES. An epsilon of 0 is a statement about that domain and about nothing else."
    status: ratified
    rationale: "A convergent critical: the drift comparison declared epsilon 0 while the arithmetic domain was undeclared, so an epsilon-0 comparison over floats would have alarmed on rounding noise or, worse, compared two figures decoded at different exponents. Declaring the domain is what makes 'residual is exactly zero or it is drift' a usable rule. AMENDS TN-10 (DEC-0195), TN-11 (DEC-0196) and TN-25 (DEC-0210). EXTENDED by GATE-2 ruling 19 (memlog line 51, DEC-0236): no float on the money path at all — venue money and volume decode from wire integers at their declared exponent, a money field arriving as a float is refused, and the only sanctioned float crossings are non-money wire floats (execution prices per CT-18's declared class) and the declared comparison-rule quantize."
    sources: [EXT-2134, EXT-2140, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-10, money-domain, exact-integers, drift, tn-10, tn-25]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0226
    title: "Gate ruling 11 — supervision mechanics and the definition of a safe point"
    statement: "The doors (evidence channel, preflight-status view, resurrect) BIND BEFORE PREFLIGHT. A boot-attempt record is the FIRST durable write. The crash-loop fold counts attempts BY STAGE. A preflight failure boots into STAND-DOWN-ALIVE; only a failure that prevents the doors from binding exits non-zero. READY=1 and WATCHDOG=1 are owned by the supervisor and door layer over the raw sd_notify protocol on a stdlib AF_UNIX datagram socket (no python-systemd), never by the domain loop. StartLimitBurst is above K with StartLimitIntervalSec at or above T; TimeoutStopSec is at or above the declared drain window. A SAFE POINT is: between slices, with suspend_new enforced, with every command terminal or UNKNOWN-minted, and with sinks flushed. Shutdown mints an UNKNOWN for every in-flight command, bounded by the drain window, then exits non-zero if the drain is unreached."
    status: ratified
    rationale: "Without this, a node that failed preflight would have died silently on an unattended VPS with no door to ask why, and the operator's only recourse would have been a console the node does not have (R1). Binding the doors first is what makes 'stand-down-alive' a real state rather than a name. AMENDS TN-4 (DEC-0189), TN-2 (DEC-0187) and TN-17 (DEC-0202). REFINED by GATE-2 ruling 5 (memlog line 51, DEC-0236): a detected preflight REFUSAL never exits, the crash-loop fold counts only failures that DO exit (door-binding failure, unhandled death after boot), and a requested restart exits code 75 under RestartForceExitStatus=75 / SuccessExitStatus=75 and never advances (K,T). Depends on A5, proceed-on-recommendation."
    sources: [EXT-2135, EXT-2139]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-11, supervision, safe-point, stand-down-alive, tn-2, tn-4]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0227
    title: "Gate ruling 12 — a fixed qmx service account and three named secret holders"
    statement: "All four units run under a FIXED User=qmx service account, not DynamicUser. Every writable tree lives under /var/lib/qmx/{rooms,evidence,hub-inbox,hub-published,archive,state,staging} with ProtectSystem=strict plus ReadWritePaths=/var/lib/qmx. Each unit receives ONLY its own credentials through LoadCredentialEncrypted, with systemd-creds encrypt --with-key=host pinned. There are THREE NAMED SECRET HOLDERS and no others: the connection manager (venue session material), the backup unit (the payload key plus bucket credentials for one run), and the observability path (the notification token)."
    status: ratified
    rationale: "DynamicUser was drafted as hardening but it cannot own persistent state across boots, which is exactly what the rooms, the evidence tier and the state tree are; the fix trades one hardening knob for a design that can actually recover. Naming the holders bounds the secret surface to something a reviewer can count. AMENDS TN-16 (DEC-0201), TN-12 (DEC-0197) and the tree layout of TN-3 (DEC-0188); it is the source of assumption A31. EXTENDED by GATE-2 ruling 13 (memlog line 51, DEC-0236): the observability stack runs under its OWN distinct non-qmx account and its credentials are a DECLARED FOURTH secret holder that holds nothing the node holds."
    sources: [EXT-2135, EXT-2139, EXT-2138]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-12, service-account, systemd, secret-holders, tn-12, tn-16]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0228
    title: "Gate ruling 13 — the node mints VenueClientPort; qmf-venue is not amended by a child"
    statement: "The node mints its OWN qmn.venue.VenueClientPort over the CT-19/CT-20 shapes, because qmf-venue exposes no VenuePort, OrderPort or VenueAdapter seam at integration@ef9bb25. AS RULED AT THE GATE it had TWO V1 implementations — the cTrader client and the replay adapter — and qmf-venue is NOT amended: realizing the seam inside qmf-venue is recorded as a CANDIDATE AD-28 parent annotation (DEC-0242), never a child's call. MODIFIED by GATE-2 ruling 6 (memlog line 51, DEC-0236): the port has THREE V1 implementations — the cTrader client, the replay adapter and the FEAT-0023 CONFORMANCE DOUBLE — and the implementation is selected by (world, VenueId), with world=replay selecting the replay implementation for every venue, a replay composition resolving no credential, holding no venue secret and opening no socket (preflight proves it)."
    status: ratified
    rationale: "The parts-bin inventory established the ground truth that no injectable port exists in qmf-venue today, so AD-28's 'one neutral port' is presently a contract statement rather than a Protocol; the node needs a seam now and may not amend a parent by assertion, so it mints its own and records the alternative for the parent to rule. AMENDS TN-11 (DEC-0196) and the two-phase wiring of TN-2 (DEC-0187); it is the source of assumption A36. The third implementation added by line 51 (6) is what makes the venue conformance double a first-class V1 artifact rather than a test fixture."
    sources: [EXT-2135, EXT-2139, EXT-2145, EXT-2152]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-13, venue-port, ad-28, conformance-double, tn-11]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0229
    title: "Gate ruling 14 — replay reads through one sanctioned cross-world import port"
    statement: "A NAMED ONE-WAY REPLAY IMPORT PORT is the single sanctioned cross-world read: it reads SEALED live-world observations from the evidence tier, so a hot-room purge never orphans replay. Replay artifacts are world=replay and are NEVER ledgered — a replay run is not a B-3/B-4 governed run — and the decision diff is an UNGOVERNED diagnostic report. world is a component of the bot-state scope."
    status: ratified
    rationale: "AD-19's cross-world read refuses by default, so replay either needed a sanctioned door or would have grown an unsanctioned one; naming the port keeps the refusal intact everywhere else and keeps replay output out of the governed record where it could be mistaken for evidence. AMENDS TN-21 (DEC-0206) and the tier roles of TN-3 (DEC-0188); it is the source of assumption A33. EXTENDED by GATE-2 rulings 6 and 26 (memlog line 51, DEC-0236): a replay run is a stdlib process-per-job OUTSIDE the node process with disjoint replay WriterIds, and the import port reads the named sealed-archive room role (DEC-0253)."
    sources: [EXT-2135, EXT-2139, EXT-2140]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-14, replay, import-port, world, tn-3, tn-21]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0230
    title: "Gate ruling 15 — SQS reaches the door only inside the signal snapshot, and the baseline is keyed"
    statement: "SQS reaches the Book door ONLY inside the per-instant SIGNAL SNAPSHOT. Every producer feeding that snapshot reads AS OF THE SLICE FRONTIER, never wall-now. The labelers are CT-16 configured producers under AD-24, HEAVY BY DEFAULT until the rung baseline exists and only then eligible for a proven light claim; until then the snapshot is fanned out with staleness stamps and consumed under a declared maximum age. The SQS baseline is keyed (VenueId, environment, instrument), and a DEMO-CONDITIONED BASELINE NEVER SATISFIES A role=live BINDING."
    status: ratified
    rationale: "Without the snapshot boundary, an MIS producer reading wall-clock time inside a slice would have made the decision path non-reproducible and quietly non-deterministic in replay; without the environment key, a baseline learned on demo spreads would have authorised live sizing. The environment key is also what makes A47's sensing-only live connection necessary — the live baselines have to accumulate before the live bind. AMENDS TN-19 (DEC-0204) and TN-8 (DEC-0193). EXTENDED by GATE-2 rulings 14 and 17 (memlog line 51, DEC-0236): candidate labelers enter a separate shadow_composition_fp and are never counted toward max_slice_latency, and the heavy snapshot's maximum age IS decision_freshness_bound with no second bound, a labeler that cannot publish inside it publishing not_ready. Depends on A25."
    sources: [EXT-2135, EXT-2139, EXT-2140]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-15, sqs, mis, signal-snapshot, baseline, tn-8, tn-19]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0231
    title: "Gate ruling 16 — value-status, and the pre-SOAK ruling"
    statement: "Every node variable carries a VALUE-STATUS in blank | provisional-evidence | ratified. A PROVISIONAL value that gates live money BLOCKS role=live EXACTLY AS A BLANK DOES, until an operator countersign through the powers channel. The soak requires at least PROVISIONAL values for everything its acceptance checklist exercises — a PRE-SOAK ruling, not a pre-live one."
    status: ratified
    rationale: "L29 says a provisional recommendation grants no live-money authority, but the registry could only express configurable-versus-not, so a recorded evidence number and a ratified constant were indistinguishable to any consumer — the exact gap PRD section 6 names in its own words. The pre-SOAK half matters because the checklist exercises mechanisms whose variables would otherwise be blank, leaving the mechanism inert during the very week that is supposed to prove it. AMENDS TN-18 (DEC-0203), TN-17 (DEC-0202) and TN-20 (DEC-0205); it is the source of assumption A34 and of the value_status_required parent annotation (DEC-0254). REFINED by GATE-2 ruling 22 (memlog line 51, DEC-0236): value-status lives on the RESOLVED CONFIG ARTIFACT's row for every value including Book-declared ones, the compiler propagates it onto generated fragments, and a countersign mints a new config version and is REFUSED without the variable's evidence citation by fp1, one variable per call."
    sources: [EXT-2136, EXT-2140, EXT-2145, EXT-2154]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-16, value-status, pre-soak, l29, tn-17, tn-18]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0232
    title: "Gate ruling 17 — TN-25 minted: the accounting boundary and the virtual ledger"
    statement: "A twenty-fifth rule was MINTED at the gate: the accounting boundary and the virtual ledger, living in qmn/ledger. The node RUNS the accounting period; the period is named by an account-scoped AD-8 day-boundary calendar declared and never inferred; each binding's virtual ledger is an append-only record stream in the exact scaled-integer domain at the account money exponent; venue position and virtual (Book) position are two folds named apart with every risk record declaring which it references; rollover, sweep and re-seed are operator-signed journaled treasury boundary acts that never touch positions and never re-base a frozen R; state_carry rides every binding the node mints."
    status: ratified
    rationale: "The gate found the accounting period, the two position folds and the money-boundary acts scattered across TN-8, TN-10 and TN-24 with no single owner, which is how a bookkeeping fault becomes a market action — the exact thing the spine says it prevents. Minting TN-25 gives the money-path law one home. It creates DEC-0210 and AMENDS TN-8 (DEC-0193), TN-10 (DEC-0195) and TN-24 (DEC-0209). Depends on A13 (floating P&L is an explained component and is never swept), proceed-on-recommendation."
    sources: [EXT-2136, EXT-2138]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-17, tn-25, virtual-ledger, accounting-boundary]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0233
    title: "Gate ruling 18 — the alert allow-list gains a silent-degradation class, a dead-man's switch and a liveness digest"
    statement: "The ratified notification allow-list gains ONE CLASS: 'the node has stopped accepting entries or cannot persist evidence for a reason that is not a KSA escalation' — covering the clock-band no-new-entry state, live-drift stand-down, a failed news-calendar refresh, a degraded or dead canonical feed, a backup or restore-drill failure, and the disk-headroom trip. It gains an EXTERNAL DEAD-MAN'S SWITCH (a heartbeat to an off-VPS watcher, Healthchecks/ntfy-class, configured by reference) and a LIVENESS DIGEST that survives go-live."
    status: ratified
    rationale: "PRD section 3's closed allow-list covers money boundaries and protection escalation but not silence: an unattended node that had stopped accepting entries, or could not persist evidence, for a non-KSA reason would emit nothing at all, and the operator's only signal would be an absence he cannot see. A dead node cannot alarm about itself, which is why the switch is external. AMENDS TN-15 (DEC-0200) and TN-23 (DEC-0208); it is the source of assumption A35. CONSTRAINED by GATE-2 rulings 31 and 34 (memlog line 51, DEC-0236): the widening is recorded as a PROPOSED PRD AMENDMENT rather than applied by assertion (DEC-0257), and FAILURES.md's notification-tier column is the SOLE home of alert-class membership, so the registry membership row is withdrawn."
    sources: [EXT-2136, EXT-2140, EXT-2155, EXT-2145]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-18, alerts, silent-degradation, dead-mans-switch, tn-15]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0234
    title: "Gate ruling 19 — powers authentication over a unix socket with SO_PEERCRED"
    statement: "The POWERS channel is served over a UNIX DOMAIN SOCKET with SO_PEERCRED. The peer credential is RECORDED alongside the claimed signer and MUST be the declared operator principal; over SSH that is the forwarded socket's sshd user. The EVIDENCE channel stays localhost HTTP."
    status: ratified
    rationale: "An action channel authenticated only by reaching localhost is authenticated by nothing on a host where a second account exists; SO_PEERCRED at least proves which account is acting and records it beside the claimed signer. Its honest limit is recorded as a named residual risk: SO_PEERCRED proves an account, not a human (A32). AMENDS TN-17 (DEC-0202). EXTENDED by GATE-2 ruling 11 (memlog line 51, DEC-0236): the socket is /run/qmn/powers.sock, owner qmx:qmxops, mode 0660, RuntimeDirectory-created, with TWO declared peer principals by uid and neither of them the qmx service account — the operator principal (every power) and the ops principal (notify_test, restore_drill_run, config_validate, hub_publish and evidence reads only) — every trading, protection, promotion, activation, settings, resurrect, attestation and countersign power refused to the ops principal BY THE TRANSPORT, preflight refusing to boot if any unit runs under an operator-principal uid, and the powers list CLOSED (A40)."
    sources: [EXT-2136, EXT-2139, EXT-2147]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-19, powers-channel, so-peercred, principals, tn-17]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0235
    title: "Gate ruling 20 — the paper ledger runs, so the kill line is drillable before live"
    statement: "The PAPER LEDGER RUNS: frozen starting balance plus realized plus unrealized of the paper virtual positions, so a paper capital floor is evaluable rather than notional. An OPERATOR-SIGNED SYNTHETIC BREACH DRILL is part of the soak. CLOSING CLAUSE OF THE FIRST GATE, recorded with this ruling: every other reviewer finding, at every severity across all six lenses, is applied as its review states it; the parent finding M9 uses 'quiesced' for the session sense of drain; the parent finding H9 is applied through gate ruling 1 (DEC-0216)."
    status: ratified
    rationale: "Without a running paper ledger the kill line — the one control that flattens without waiting for a human — would first execute in production on real money, untested. A signed synthetic breach during the soak week is the cheapest possible rehearsal of the most expensive path. AMENDS TN-9 (DEC-0194), TN-8 (DEC-0193) and TN-25 (DEC-0210). It is also why paper is not exempt from the virtual-ledger law: the paired demo binding keeps its own ledger and a reset mints an operator-signed paper_epoch boundary record."
    sources: [EXT-2136, EXT-2137]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-ruling, gate-46-20, paper-ledger, kill-line-drill, soak, tn-8, tn-9]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-46"

  - id: DEC-0236
    title: "The 34 GATE-2 rulings, applied at desk by residual fix pass 2 (TN ids stable)"
    statement: "The five-lens validation re-gate over the amended spine produced 34 orchestrator rulings, every one applied at desk with the TN ids unchanged. (1) AD-27's per-command UNKNOWN block is the ONE non-control block, refusing every command on that stream, protection included, with the refused protective act standing as a journaled intent cleared only by resolve_unknown. (2) Protective-stop ATTACHMENT AT PLACEMENT is written into the order path, entry-relative for MARKET orders, an unsupported-capability refusal where the venue does not declare it. (3) Node stand-down refuses ENTRY intents only, whatever the author — every risk-non-increasing act passes. (4) resurrect journals as an AD-21 control-action EVENT subtype node_resurrect, never a CT-30 action kind. (5) A detected preflight refusal never exits; the crash-loop fold counts only failures that DO exit; a requested restart exits code 75 and never advances (K,T). (6) VenueClientPort is selected by (world, VenueId) and has THREE V1 implementations, with replay running process-per-job outside the node. (7) News-calendar revisions may only WIDEN or ADD automatically; narrowing or removal is an operator act or waits for the superseded window's end. (8) Retry-after-refresh applies only to requests carrying no command identity; commands are never retried. (9) The DELEGATED IMPURITY clause: qmf-venue's connection manager holds socket, session and the single venue secret on the injected loop, and the async conformance test is amended to exempt qmf.venue.connection BY NAME. (10) Reconciliation compares TWO residuals SEPARATELY — quantity and cash — and unrealized P&L is a mark that is never reconciled. (11) The powers socket is /run/qmn/powers.sock with TWO declared peer principals and a CLOSED powers list. (12) /opt/qmx is immutable per-commit trees plus a current symlink flipped atomically at restart. (13) The observability stack gets its own unit, account, quota, loopback binding and a declared FOURTH secret holder. (14) Candidate labelers enter a separate shadow_composition_fp, off the trading path, on their own bound. (15) Attribution declarations on a netted account must be a PARTITION proved at compile. (16) Timer units compose from the config version the RUNNING node sealed; unreadable both ways means refuse and alarm. (17) The benchmark harness never runs concurrently with a slice-driving node; governor budgets are soak-blocking. (18) The workstation installation is PROVISIONING-ONLY and enforced by the composition root, the secret store and two tier-1 checks. (19) NO FLOAT ON THE MONEY PATH at all; a money field arriving as a float is refused. (20) Blanks PARTITION three ways — blocks-boot, blocks-role-live, blocks-soak — with blocks-soak GENERATED from the checklist. (21) A protection intent the journal room cannot take goes to a reserved extent, and failing that is recorded UNDELIVERABLE and alarmed. (22) value-status lives on the RESOLVED CONFIG ARTIFACT's row, and a countersign is refused without the variable's evidence citation. (23) SEAT CONTAINMENT: the door layer's slice-progress watch stops the keepalive and lets systemd restart; seat_reinstate is quarantine's only exit. (24) The KSA level is folded PER ENFORCEMENT SCOPE, effective level being the most restrictive covering scope. (25) A reserved SUPERVISOR WriterId owns the boot-attempt and lifecycle stream. (26) The evidence tier instantiates a named SEALED-ARCHIVE room role per world, read by replay and backup. (27) Position and balance READ-BACKS are CT-20 observation kinds under the existing seven journal types. (28) drain_window and watchdog_interval are minted, and TimeoutStopSec and WatchdogSec are RENDERED from them. (29) just is pinned and registered as an external tool; the bootstrap installs uv, CPython, just and the stack's container runtime. (30) TN-18's config compile has FOUR layers; the invocation layer is deleted. (31) The PRD section 3 allow-list widening is recorded as a PROPOSED AMENDMENT, surfaced not settled. (32) The soak runs on the DEMO binding while the live connection opens for SENSING AND RECORDING ONLY, so a late approval delays go-live and never the week. (33) No scale-in over VIRTUAL positions, close_partial refused, an absent-or-terminal subject resolving without submission, arbitration strictly by rank. (34) FAILURES.md's notification-tier column is the SOLE home of alert-class membership. CLOSING CLAUSE: every other re-gate finding of every severity is applied as its review states it; the Inherited Invariants shadow-lane row is corrected to 'seam built now, ML half deferred'; the assumption register's authority line points at the ruling entries as amended."
    status: ratified
    rationale: "Residual fix pass 2 applied all 107 re-gate findings at desk under these 34 rulings; no ruling needed the operator and no TN id moved, so every TN decision DEC-0186..DEC-0210 stands as minted and is read AS AMENDED by this entry. The re-gate itself ran five fresh lenses over the amended 950-line spine (parent-consistency 2C/8H/16M/4L, adversarial 7C/12H/10M/4L, rubric plus ambiguity 4C/10H, operator-reconcile 0C/1H/1M/4L confirming all four operator rulings applied faithfully, and a fix-regression lens finding every fix-pass row present), and a final certification seat then blocked on four leftover highs and ten lows, all fourteen closed at desk with slice_watch_trip_multiple, shadow_lane_publish_bound, news_recorder_max_attempts and backoff, and r_unit_price_recompute_cadence minted with blank-effect tags. Rulings 9, 26, 27 and 31 are the ones that generate parent annotations rather than node rules, and are minted individually at DEC-0243, DEC-0253, DEC-0247 and DEC-0257. Adds assumptions A40 through A47, all proceed-on-recommendation."
    sources: [EXT-2139, EXT-2140, EXT-2141, EXT-2142]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, gate-2-rulings, umbrella, residual-fix-pass-2, re-gate]
    date: 2026-08-28
    spine_ref: "SRC-11:.memlog.md#line-51"

  - id: DEC-0237
    title: "KSA vocabulary re-ratified into docs/ from the GitBook baseline; the effect matrix is node severity policy"
    statement: "The Kill Switch Authority vocabulary is RE-RATIFIED into docs/ from the GitBook baseline, where it existed authoritatively under L37 but had never been carried into docs/ (a grep for the level names returns zero hits there). FIVE LEVELS, FIXED AND UNEDITABLE: GREEN | YELLOW | ORANGE | RED | BLACK. FOUR TRIGGER CLASSES, ADDABLE BUT NEVER REDEFINED: scheduled_news | black_swan | connectivity | unknown_state. Automatic transitions are ESCALATE-ONLY, and de-escalation from A1 is HUMAN-ONLY. The trigger-to-level-to-effect MATRIX is the node's SEVERITY POLICY: its SHAPE is closed by TN-7 (DEC-0192) — which effect a severity carries is the node's to choose, as DEC-0150 already reserved to it — while its VALUES stay OPEN under GAP-0050, and a BLANK or PROVISIONAL-EVIDENCE cell BLOCKS LIVE MONEY exactly as any other live-gating blank does (DEC-0231). Because the soak's acceptance checklist exercises the matrix, the values carry a PRE-SOAK ruling and not merely a pre-live one: at least provisional values must exist for whatever the checklist exercises, ratified through the settings surface and recorded as a config version, or the mechanism sits inert through the very week meant to prove it."
    status: ratified
    rationale: "Adjudication correction 7 settled that the five levels, four trigger classes, escalate-only transitions and A1 human de-escalation live ONLY in the GitBook baseline; under L37 that baseline is authoritative for risk and live-trading content, so the node adopts them explicitly rather than inventing a second vocabulary, and the documentation factory carries them into docs/ where every consumer can read them. ID CORRECTION SURFACED HERE: the spine cites GAP-0015 for the matrix VALUES, but catalog GAP-0015 is the lineage-edges gap answered 2026-08-20 by DEC-0114 — the correct id is the newly minted GAP-0050, and GAP-0015 is not touched. The spine's phrase 'GAP-0015 shape closed' therefore reads as: the matrix SHAPE is closed by TN-7 under GAP-0050's heading. Depends on A7 (KSA levels adopted from the GitBook, a blank matrix cell blocking live) and on DEC-0049's inform-versus-pause posture, which the ksa_detector_posture row carries as a configurable value."
    sources: [EXT-2144, EXT-2145, EXT-2148, EXT-2136]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, ksa, gitbook-baseline, effect-matrix, gap-0050, pre-soak, l37]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0238
    title: "PRD section 6 mined node doctrine ratified by adoption"
    statement: "Every [MINED] item of PRD section 6's Phase-2 node doctrine, carried there 'to ratify at node planning', is RATIFIED BY ADOPTION — each named here with the TN decision that adopts it. (a) STARTUP AND RECOVERY ORDERING: a deterministic cold-start preflight gate before any state mutation (host, disk, network and pinned-version checks, fail-closed with a typed failure id), then a fixed per-Book order — connect, reconnect gap recovery committing recovered fills before reporting healthy, missed-rollover catch-up with the boundary equity reconstructed from journals and the sweep journaled as a correction-style append, protection-state projection rebuilt from journals, readiness gates, and only then the sequencer accepting intents — adopted by TN-10 (DEC-0195) with the preflight half in TN-4 (DEC-0189). (b) THE NO-SAFETY-COUNTERS INVARIANT: a crash never resets safety counters because there are none, only journal projections — adopted by TN-10 (DEC-0195) and hardened by gate ruling 8 (DEC-0223). (c) EXPLAINED DRIFT, NEVER RAW EQUALITY: divergence decomposes into journaled components and only the residual is drift; unexplained live drift halts trading and a restart is not permission to resume, a fresh reconciliation review is; the paper and demo binding is excluded from the live drift check — adopted by TN-10 (DEC-0195), with the PRD's three verdicts superseded by the corpus's FOUR (DEC-0258) and the residuals split into quantity and cash by GATE-2 ruling 10 (DEC-0236). (d) STATE INDEPENDENCE AND READ PROVENANCE from the console spine: safety, execution readiness, connection, reconciliation, data freshness, lifecycle and sync are INDEPENDENT states that never collapse into one health colour, requested protection state displays separately from enforcement completion, and every important read reveals authority source, source time, receive time and watermark — adopted by TN-15 (DEC-0200) and TN-17 (DEC-0202), which build the read models now so the later UI sitting needs no door change. (e) RATE LIMITS AS A DESIGN INPUT: one connection pool per account binding, per-account command affinity, token-bucket limiting and protocol-level caps per connection, so synchronized bursts need sharding or a shared bucket — the same seam that later carries multi-account load balancing — adopted by TN-6 (DEC-0191) and TN-22 (DEC-0207). (f) FAIL-CLOSED STAND-DOWN IS AN ALIVE STATE: past a crash-loop threshold the process boots into stand-down, sequencers refuse and journal, adapter connections quiesce and drain, and the operator-powers surface keeps serving so resurrection stays reachable; a protection transition counts as enforced only after the account's connections have quiesced and drained — adopted by TN-4 (DEC-0189) and TN-7 (DEC-0192). (g) MIS PUBLICATION AND SHADOW-ROLLOUT SHAPE: candidate labeler and model versions run as near-real-time replay over the captured canonical feed, off the hot path, to their own manifest prefix, never to live consumers, evaluated over one full affected-Book cycle; promotion is ratification, version bump, re-certification; a recovered or pre-trained model carries no authority without fresh ratification; training is an offline job that may seed its RNG provided the seed is recorded, while the no-ambient-randomness invariant binds the live runtime — the SEAM adopted by TN-19 (DEC-0204) as V1 work, the ML half deferred to the named training epic (DEC-0215). (h) THE ALWAYS-ON EVIDENCE TIER as a placement and authority boundary — explicitly not a database server and not a second writer, with the hot path never blocking on it, sync one-way, watermarked, idempotent, resumable and verify-before-purge, recovery re-requests carrying watermarks only, and the ONE reverse crossing being the click-gated promotion pull — adopted by TN-3 (DEC-0188), TN-13 (DEC-0198) and TN-20 (DEC-0205). (i) SETTINGS ARE EVIDENCE-SCOPED, NOT A BOOLEAN: three scopes render distinctly (system settings, component settings from the registry, instance values), a non-configurable value renders read-only, a null renders unresolved rather than as an editable default, measured or provisional values never masquerade as settings, a provisional value requires an explicit operator countersign before live, and a value fixed within an active cycle is not editable mid-cycle — adopted by TN-18 (DEC-0203), and the PRD's own named gap ('variables.yaml carries configurable but no value-status field') is closed by DEC-0231 and DEC-0254."
    status: ratified
    rationale: "PRD section 6 tagged this doctrine [MINED] and explicitly deferred its ratification to node planning; this sitting IS that planning, so each item is ratified by being adopted into a TN rule rather than restated as a second law. Naming the adopting decision beside each item is what keeps the PRD row and the node rule from drifting apart later. Two items are adopted WITH CORRECTIONS the corpus forced: the PRD's three reconciliation verdicts become four (adjudication correction 1), and the PRD's drift decomposition is narrowed so that unrealized P&L is never a term in either residual (TN-24(f), TN-25, GATE-2 ruling 10) — a mark is not a fact and marks are never reconciled. The console-spine half is adopted now, not later, because the doors are built now."
    sources: [EXT-2153, EXT-2154, EXT-2144, EXT-2140]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, prd-section-6, mined-doctrine, ratified-by-adoption, startup, drift, evidence-tier]
    date: 2026-08-28
    spine_ref: "_bmad-output/planning-artifacts/prds/prd-QMX-2026-08-21/prd.md#section-6"

  - id: DEC-0239
    title: "PRD section 10 open items rows 12-15 — dispositions at the node sitting"
    statement: "The four PRD open-item rows the node sitting owns are DISPOSED as follows, each quoted with the owner its disposition column carries. ROW 12, disposition 'Node planning' — the node-phase position-safety cluster, 'four questions neither old build nor corpus closed': (a) whether a breakeven exit or a forced flat counts toward sizing (the row's own wording uses a disposition term the corpus vocabulary now bans; the node's word is exit disposition) — CLOSED by TN-24(e) (DEC-0209): one disposition vocabulary serves both rules, breakevens NEVER count under any q and are recorded as their own clustering metric, scratches and partial losses do not count by default and count only where the Book's declared per-family q reaches them (A29); (b) 'position fate at money boundaries — how unrealized P&L enters a sweep (boundaries leave positions alone; the accounting is unstated)' — CLOSED by TN-24(f) and TN-25 (DEC-0209, DEC-0210): a money-accounting boundary is NEVER itself a flatten trigger, floating P&L is an explained named component of the equity narrative, is never swept, never becomes cash on a boundary and is never a term in either reconciliation residual (A13); (c) 'dynamic SL/TP grammar — Book grammar, BMS as config authority', in the node's vocabulary the dynamic protective-order grammar — CLOSED by TN-24(g) (DEC-0209): V1 dynamic protection is the breakeven ratchet ONLY, and a bot-proposed tighten is bounded risk-non-increasing, names a direction and a bound rather than a price, and is never refused on the command path; (d) 'an amendment idempotency threshold (UI-editable) suppressing tick-storm duplicate amends' — CLOSED as amend_min_improvement, minted per Book as the ratchet's ORIGINATION threshold inside exit_policy, an AUTHORING RULE and NEVER a command-path gate or a suppression (A9). ROW 13, disposition 'Architecture' — 'is atomic dual-write a journal-path requirement, and does it constrain the seam? Corpus wins pending a ruling' — CLOSED by TN-24(h) (DEC-0209) WITHOUT minting a global rule: every decision-plus-evidence write declares atomic or ordered-with-recovery per CT-20's modes, evidence-first ordering always, and a partial write is a storage failure that blocks ENTRIES ONLY; no global dual-write atomicity rule is minted, so the corpus indeed wins. ROW 14, disposition 'Operator ruling at node/ops' — the news-provider selection evidence for DEC-0119, 'recorded as input, not a choice' — CLOSED by operator ruling R4 (DEC-0214): Forex Factory's free weekly file is the sole V1 source and the row's impact-carrying paid fallbacks are refused outright. ROW 15, disposition 'Input to FR-042 epics' — the deep-history acquisition evidence — CARRIED, NOT CLOSED HERE: TN-24(i) records Dukascopy with TrueFX and HistData as recorded companions, explicitly NOT node-blocking, and the row stays an input to the FR-042 epics as its own disposition column says."
    status: ratified
    rationale: "The PRD parked these four rows with named owners and this sitting holds three of those owners; row 15's owner is the FR-042 epics, so it is carried forward rather than absorbed. Recording the closures against the PRD row numbers is what lets a later reader see that the open-items table has actually shrunk rather than been quietly dropped. Row 12(a) and 12(c) are restated in the corpus's vocabulary because the PRD row's own wording uses two banned terms; the substance is unchanged. Depends on A29 and A13, both proceed-on-recommendation and both individually overturnable."
    sources: [EXT-2156, EXT-2129]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, prd-section-10, open-items, position-safety, atomicity, news-provider, deep-history, tn-24]
    date: 2026-08-28
    spine_ref: "_bmad-output/planning-artifacts/prds/prd-QMX-2026-08-21/prd.md#section-10-rows-12-15"

  - id: DEC-0240
    title: "Ticket 006 disposition — the trendbar price basis is measured per broker, not pinned from the web"
    statement: "Ticket 006's question, are cTrader trendbars BID- or mid-derived, is disposed PARTIAL: the POLICY is fully ratified and the FACT stays second-hand until the node measures it. POLICY: venue_trendbar_price_basis carries NO VALUE and is annotated measured-per-broker; the adapter measures the actual bar price basis per broker at FIRST CONNECTION and re-verifies with a continuous background monitor, storing the result as per-broker configuration with its reconciliation evidence attached. The first-connection verification suite already names the check and its refusal: 'Bar-basis reconciliation | Reconcile trendbar OHLC against explicitly-BID/ASK tick history per broker and symbol class; record the verified quote side (DEC-0135). | A failed bar-basis reconciliation refuses bar evidence.' WEB EVIDENCE, GRADED HONESTLY: there is NO official documentation page stating the basis; the only statement is a Spotware moderator on the official community forum — 'It is not possible to get trendbars based on ask prices' — with the thread confirming the prices are bid-based. GRADE: SECONDARY (a vendor moderator, not a documentation page), consistent with cTrader charts being bid-based by default, and it CHANGES NOTHING because the corpus already refuses to hardcode it; the adjudicator's cross-cut instruction is explicit — do not upgrade the forum finding into a pin. WHAT THE BACKTEST-TO-LIVE COMPARISON MUST ASSUME MEANWHILE: NOTHING. Until the reconciliation passes, venue-native bars are ungoverned observations never assumed aligned and bar evidence is refused; backtests run on Dukascopy tick data carrying both sides, so the honest INTERIM posture is to build every backtest-to-live comparison on TICKS rather than bars, and to treat any bar-derived series as provisional until the per-broker basis is recorded with its evidence (A15)."
    status: ratified
    rationale: "This honours DEC-0135's standing adapter obligation as its parent: bundle B already DEMOTED the BID-derived-trendbar claim to 2013-forum grade and ruled it NEVER hardcoded, with the adapter measuring the actual daily boundary and bar price basis per broker at first connection and re-verifying continuously. A newer web finding of the same or lower grade cannot promote a demoted claim into a constant, so the ticket closes by confirming the existing obligation rather than by adding a value. The tick-based interim comparison is assumption A15, proceed-on-recommendation and individually overturnable; it costs nothing and a wrong basis assumption would quietly shift every compared entry price. The measurement itself lands in TN-11 (DEC-0196) as one of the five first-connection checks that gate the first command and any evidence-bearing decode."
    sources: [EXT-2157, EXT-2147]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, ticket-006, trendbar, venue-facts, dec-0135, a15, secondary-evidence]
    date: 2026-08-28
    spine_ref: "SRC-11:inputs/corpus-verdicts-B.md#QB11"

  - id: DEC-0241
    title: "Parent annotation — L30 annotated at source: qmn.venue is the sanctioned qmf-venue import boundary [APPLIED]"
    statement: "APPLIED. L30 is annotated AT SOURCE in docs/constitution.md, alongside its existing 2026-08-21 roster-scope annotation, to record that the trading node's composition root is the ONE sanctioned importer and wirer of qmf-venue, and that the writable boundary of that sanction is the qmn.venue SUBPACKAGE rather than the root module alone: duty scheduling, the verification-suite runner, the CT-18 fills and the error-map rows import qmf-venue there, every other qmn module receives VenueClientPort and CT-19/CT-20 shapes only, and the L30 default-deny lint is written against that boundary. qmb and qml KEEP THEIR BAN. Adding any other edge is a spine amendment."
    status: ratified
    rationale: "L30's scope annotation reads 'applications still never import qmf-venue', while AD-28 requires SOMEONE to construct the adapter and the node is the only composition root in the platform — a genuine conflict between two ratified parent rules, not a node preference. The node refused to settle it by assertion at the first gate and surfaced it instead; the documentation factory annotates the constitution at source, which is where a constitutional exception belongs, and the subpackage boundary is what keeps the exception narrow enough to lint. The dependency-direction rule stands unchanged in every other respect: qmn depends on the QMF roster, on qmb, on qml and on registered extensions, and NOTHING imports qmn."
    sources: [EXT-2145, EXT-2158, EXT-2139]
    authority: rider
    component: COMP-QMF-CORE
    tags: [trading-node, parent-annotation, applied, l30, constitution, qmf-venue, import-boundary]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0242
    title: "Parent annotation — AD-28 candidate: realize VenueClientPort inside qmf-venue [RECORDED-NOT-APPLIED]"
    statement: "RECORDED-NOT-APPLIED. It is recorded as a CANDIDATE AD-28 parent annotation that AD-28's 'one neutral port' is TODAY a contract statement rather than an injectable Protocol — qmf-venue exposes no VenuePort, OrderPort or VenueAdapter seam at integration@ef9bb25 — and that realizing the seam INSIDE qmf-venue is the alternative to what the node did. That realization is a PARENT AMENDMENT and never a child's call, so it is not applied by this increment. WHAT THE NODE DID INSTEAD, and what the epics build: the node mints qmn.venue.VenueClientPort over the CT-19/CT-20 shapes with THREE V1 implementations — the cTrader client, the replay adapter and the FEAT-0023 conformance double — selected by (world, VenueId)."
    status: ratified
    rationale: "The parts-bin inventory of integration@ef9bb25 is the ground truth here: the seam does not exist, so the node either mints one or invents an import path L30 forbids. Minting its own port is the reversible choice — if the parent later realizes the seam in qmf-venue, the node's three implementations move behind it without a change of shape — while amending AD-28 by assertion would not be. Rests on A36 (a node-minted port rather than a seam realized in qmf-venue), proceed-on-recommendation and individually overturnable; gate ruling 13 (DEC-0228) is where it was decided and GATE-2 ruling 6 (DEC-0236) is where the third implementation and the (world, VenueId) selection were added."
    sources: [EXT-2145, EXT-2135, EXT-2139, EXT-2152]
    authority: rider
    component: COMP-QMF-VENUE
    tags: [trading-node, parent-annotation, recorded-not-applied, ad-28, venue-port, a36]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0243
    title: "Parent annotation — the qmf-venue async-conformance exemption for qmf.venue.connection [APPLIED as a declared exemption]"
    statement: "APPLIED AS A DECLARED EXEMPTION. The QMF async conformance test, which bans async across the roster, is amended to EXEMPT qmf.venue.connection BY NAME, landed in the same increment as the cTrader transport. This is THE ONE DELEGATED IMPURITY in the platform: qmf-venue's ConnectionManager holds the socket, the session and the single in-memory venue secret value on the loop THE NODE INJECTS, together with the Clock and the SecretStore the node injects; it owns no loop and schedules nothing itself, so AD-15's 'the application owns all concurrency' is preserved in substance while the socket lives where the transport does. IF THE PARENT REFUSES THE EXEMPTION, the transport increment lands in qmn.venue.ctrader instead — and THE EPICS MAY NOT CHOOSE between the two."
    status: ratified
    rationale: "AD-15 and L30 together would otherwise force one of two bad outcomes: a roster package quietly holding a loop it does not own, or a second cTrader client inside the node duplicating the connection manager the tracker already rules is the sole session owner. Naming the exemption at a single module makes the impurity auditable rather than ambient, and stating the fallback removes the one decision an epic must never make on its own. Rests on A37 (the transport increment lands in qmf-venue, completing its existing connection manager) — flagged at the fix pass as a PARENT-LOCUS cheap veto, so overturning it moves the transport into qmn.venue.ctrader with no other change. GATE-2 ruling 9 (DEC-0236) is where the clause was written."
    sources: [EXT-2145, EXT-2139, EXT-2147]
    authority: rider
    component: COMP-QMF-CORE
    tags: [trading-node, parent-annotation, applied, ad-15, async-conformance, delegated-impurity, a37]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0244
    title: "Parent annotation — SessionTopology connection count derived from the roster [APPLIED as a qmf-venue increment item]"
    statement: "APPLIED AS AN ITEM OF THE SAME qmf-venue INCREMENT THAT CARRIES THE TRANSPORT. SessionTopology ships required_connection_count = 2 as a ClassVar, which NO soak-week roster naming only the demo pair can satisfy. The relaxation: the connection count is DERIVED FROM THE ROSTER — one connection per (venue, environment) pair the roster names — rather than fixed as a class constant."
    status: ratified
    rationale: "Without this the soak cannot start at all: the week runs on the demo binding alone (R2, DEC-0212) while the live connection opens for sensing and recording only once credentials land (A47), so a hard-coded count of two would refuse the very topology the ratified milestone requires. Deriving the count from the roster also makes the multi-account and multi-broker seam of TN-22 (DEC-0207) work without a second amendment. Surfaced by the final certification seat, which found the roster could not express a sensing-only live connection; closed at desk with the sensing-only roster entries minted. Rests on A37 alongside the transport, and on A47."
    sources: [EXT-2145, EXT-2142, EXT-2140]
    authority: rider
    component: COMP-QMF-VENUE
    tags: [trading-node, parent-annotation, applied, session-topology, roster, soak, a37, a47]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0245
    title: "Parent annotation — the stale qmf-venue README is corrected [APPLIED as a factory correction item]"
    statement: "APPLIED AS A FACTORY CORRECTION ITEM, in documentation only. packages/qmf-venue/README.md lines 10-13 still read 'Scaffold (Story 1.1)...' while the code at integration@ef9bb25 carries the ConnectionManager, the in-house proto tag-91 compilation and the CT-18..CT-21 surface. The documentation factory corrects the README text. THE DOCUMENTATION INCREMENT DOES NOT EDIT CODE: nothing here changes a line of qmf-venue."
    status: ratified
    rationale: "Anyone scoping node work from that README sizes it badly wrong — it reads as an empty scaffold when qmf-venue is one of the two most complete packages in the parts-bin inventory (9,180 LOC and 407 tests), and the mis-sizing would land straight in the epics. It is recorded as a ledger decision rather than a silent edit so the correction is traceable to the sitting that found it. This is the one item in the parent-annotations group that touches no rule and no contract."
    sources: [EXT-2145, EXT-2152]
    authority: rider
    component: COMP-QMF-VENUE
    tags: [trading-node, parent-annotation, applied, documentation-correction, readme, parts-bin]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0246
    title: "Parent annotation — the Records-streams to CT-13 bridge through CT-25 projection names [APPLIED]"
    statement: "APPLIED. The five legacy Records streams — veto_ledger, trade_journal, book_journal, ksa_audit_log and correlation_ledger — survive as CT-25 PROJECTION NAMES ONLY, over AD-21's seven journal event types, through CT-25's ONE VERSIONED MAPPING TABLE. NO SECOND EVENT CATALOG is created, and no eighth journal event type is minted."
    status: ratified
    rationale: "The node's observability and audit surface has to speak the five stream names the operator and the GitBook baseline already use, while AD-21's seven event types are fixed and CT-25 already owns exactly one versioned mapping table for this purpose. Routing the names through that table keeps one catalog of facts and one catalog of projections, so a reader can always ask which of the seven a given line actually is. Absorbed into TN-15 (DEC-0200) as the logging-and-journal vocabulary the lens pages render."
    sources: [EXT-2145]
    authority: rider
    component: COMP-QMF-REGISTRY
    tags: [trading-node, parent-annotation, applied, ct-13, ct-25, records-streams, journals]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0247
    title: "Parent annotation — CT-20 mapping rows for position and balance read-back observations [APPLIED]"
    statement: "APPLIED. Two rows are added to CT-20's versioned mapping table: (position read-back) maps to observation, and (balance read-back) maps to observation. The node therefore adds observation KINDS and NO JOURNAL TYPE — AD-21's seven event types are untouched, there is no eighth type and no second event catalog."
    status: ratified
    rationale: "The node must journal what it reads back from the venue — positions and balances are the reconciliation counterpart and the equity-derivation input — and the only two ways to do that are a new journal type (which AD-21 forbids) or a new observation kind routed through CT-20's existing mapping table (which CT-20 exists to allow). Choosing the mapping table is what keeps reconciliation evidence inside the same seven-type discipline as everything else. GATE-2 ruling 27 (DEC-0236) is where it was decided; it feeds TN-13 (DEC-0198) and TN-15 (DEC-0200)."
    sources: [EXT-2145, EXT-2140]
    authority: rider
    component: COMP-QMF-VENUE
    tags: [trading-node, parent-annotation, applied, ct-20, observations, read-back, ad-21]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0248
    title: "Parent annotation — CT-20 lifecycle-stop as a candidate fourth UNKNOWN trigger [RECORDED-NOT-APPLIED]"
    statement: "RECORDED-NOT-APPLIED. AD-27's UNKNOWN observation carries a trigger drawn from timeout | transport-error | disconnect. TN-4's shutdown contract mints an UNKNOWN per in-flight command at SIGTERM, and the node ORDERS THAT MINT AFTER SESSION CLOSE so that disconnect applies honestly rather than approximately. lifecycle-stop is recorded as a CANDIDATE FOURTH TRIGGER, which would let the mint precede session close; UNTIL THE PARENT RULES IT, TN-4's ordering stands and nothing changes."
    status: ratified
    rationale: "The node needed an honest trigger value for shutdown-minted UNKNOWNs and had two options: widen the parent's closed trigger set by assertion, or order its own shutdown so an existing trigger is literally true. It took the second, which costs one ordering constraint and no parent amendment, and recorded the first for the parent to rule at its leisure. This is the same posture the sitting took for AD-28 (DEC-0242) and CT-30 (DEC-0249): a child never widens a closed vocabulary."
    sources: [EXT-2145]
    authority: rider
    component: COMP-QMF-VENUE
    tags: [trading-node, parent-annotation, recorded-not-applied, ct-20, ad-27, unknown-trigger, tn-4]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0249
    title: "Parent annotation — node_resurrect is an AD-21 control-action EVENT subtype, not a CT-30 action kind [APPLIED]"
    statement: "APPLIED. Node stand-down is a LIFECYCLE STATE and not a CT-30 control, but its exit must journal somewhere, so a declared node subtype node_resurrect is recorded under AD-21's control action EVENT TYPE — operator signer, global scope — the same pattern AD-21 already licenses for the sealed period's one final look. NO CT-30 ACTION KIND IS MINTED: CT-30's vocabulary is addable-never-redefined and a child may not add to it by assertion. Were a real CT-30 kind wanted instead, it would need never-auto as its satisfaction predicate and a row in CT-30's pinned authority-to-close-reason table; this sitting does not propose one."
    status: ratified
    rationale: "Gate ruling 3 (DEC-0218) made node stand-down a lifecycle state with exactly one exit — an operator resurrect through the powers door — and an unjournalled operator act is not an option in a system whose whole evidence discipline is journal-first. Filing it as an EVENT subtype rather than a control kind keeps CT-30's closed vocabulary closed while still producing a signed, scoped, auditable record. GATE-2 ruling 4 (DEC-0236) is where the subtype was named; it binds TN-4 (DEC-0189) and TN-17 (DEC-0202)."
    sources: [EXT-2145, EXT-2139]
    authority: rider
    component: COMP-QMF-RISK
    tags: [trading-node, parent-annotation, applied, ct-30, ad-21, node-resurrect, lifecycle]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0250
    title: "Parent annotation — CT-30 satisfaction-predicate declarations per matrix cell [APPLIED]"
    statement: "APPLIED. The node DECLARES a CT-30 satisfaction predicate PER EFFECT-MATRIX CELL, rather than leaving 'when is this control satisfied' to whichever implementation lands first. AD-36's predicates hold verbatim as the floor: suspend_new and drain are NEVER-AUTO, and flatten is scope-flat-at-reconciled. A protection transition counts as ENFORCED only after the account's connections have quiesced and drained. The no-pending-orders-at-reconciled-verdict condition is EXPRESSIBLE in the matrix cell, so a cell that needs it can say so."
    status: ratified
    rationale: "DEC-0150 gave the node the authority to choose which effect a severity carries and simultaneously forbade QMF a contract that cannot express that choice; the missing half was the predicate that says when the chosen effect is DONE. Declaring it per cell is what stops a drain from appearing satisfied while orders are still resting, and it is what makes the KSA fold's monotonicity meaningful. Gate ruling 3 (DEC-0218) supplied the never-auto floor, GATE-2 ruling 33 (DEC-0236) supplied the expressibility clause, and PRD section 6's 'enforced only after connections have quiesced and drained' is adopted here (DEC-0238(f)). Binds TN-7 (DEC-0192)."
    sources: [EXT-2140, EXT-2133, EXT-2153]
    authority: rider
    component: COMP-QMF-RISK
    tags: [trading-node, parent-annotation, applied, ct-30, satisfaction-predicate, ad-36, ksa]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0251
    title: "Parent annotation — the node's CT-24 and CT-28 disposition and state_carry usage, with no format change [APPLIED]"
    statement: "APPLIED, WITH NO FORMAT CHANGE TO EITHER CONTRACT. The node USES CT-24's transitions and CT-28's binding preconditions as they stand: seat quarantine and the operator-signed seat_reinstate are each their own CT-24 transition; CT-28 refuses a live binding without a rung baseline on this deployment tuple, which is why VPS procurement gates the SOAK's start while Spotware approval and live KYC gate GO-LIVE only. state_carry RIDES EVERY BINDING THE NODE MINTS — a paper flip, a kill-line stand-down return, an activation, a BMS re-version, and any config version whose diff touches a Book- or BMS-identity-bearing field — mandatory and non-defaultable, PER COUNTER (ledger, cycle, budget, bench_counter, exposure), each carry | reset, with ABSENT being an invalid input refusal; carry is legal only where a human-signed carries-ledger edge accompanies it, continues-performance asserts a track record and moves no money, and neither edge is ever inferred from the other."
    status: ratified
    rationale: "The node is the first system to actually mint bindings at runtime, so it is the first consumer that can get state_carry wrong; recording its usage explicitly is what keeps a paper flip or a stand-down return from silently carrying a loss budget or a bench counter it should have reset. No format change is proposed because none is needed — the contracts already express everything the node does, which is itself the finding worth recording. Binds TN-19 (DEC-0204), TN-22 (DEC-0207) and TN-25 (DEC-0210); GATE-2 ruling 23 (DEC-0236) supplied the seat_reinstate transition."
    sources: [EXT-2140, EXT-2148, EXT-2147]
    authority: rider
    component: COMP-QMF-RISK
    tags: [trading-node, parent-annotation, applied, ct-24, ct-28, state-carry, bindings, seats]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0252
    title: "Parent annotation — CT-14 backup payload-key custody, the two restore timers, and the host-loss rehearsal [APPLIED]"
    statement: "APPLIED. The CT-14 backup PAYLOAD KEY is generated at provisioning ON THE WORKSTATION, escrowed in Windows Credential Manager under qmx/backup-payload-key plus ONE operator-held OFFLINE copy, and delivered to the VPS as a bootstrap credential; the VPS-minted KEK protects rotated session material only. backup_payload_key_custody is a registry row that carries the ESCROW RULE itself rather than a blank. TWO RESTORE TIMERS ship: qmn-restore-sample.timer NIGHTLY and qmn-restore-full.timer MONTHLY. The HOST-LOSS REHEARSAL — a clean host plus the escrowed key and nothing else — is the operator-signed restore_drill_run power, runs once before the live milestone and after every rebuild, and is what MEASURES the recovery time objective."
    status: ratified
    rationale: "Gate ruling 2 (DEC-0217) found the drafted key VPS-minted and host-sealed, so it died with the host it existed to survive; moving custody off the host is the whole point, and a rehearsal from a clean host is the only way a claimed recovery objective becomes a measured one. The two timers separate cheap continuous assurance (a nightly sample) from the expensive full proof (a monthly restore), so neither is skipped for the other. Rests on A18, proceed-on-recommendation. GATE-2 ruling 16 (DEC-0236) named the timers and their compose-from-the-running-node's-sealed-config rule; binds TN-12 (DEC-0197) and TN-13 (DEC-0198)."
    sources: [EXT-2145, EXT-2133, EXT-2139, EXT-2146]
    authority: rider
    component: COMP-QMF-DATA
    tags: [trading-node, parent-annotation, applied, ct-14, backup, key-escrow, restore-drill, rto]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0253
    title: "Parent annotation — AD-19 gains an eighth room role, sealed-archive [APPLIED]"
    statement: "APPLIED. AD-19's seven room-roles per world gain an EIGHTH: sealed-archive, instantiated PER WORLD in the evidence tier, under the SAME retention, backup and migration law as the other seven. It is the named target of the one-way evidence sync, and it is read by the REPLAY IMPORT PORT and by the BACKUP. A hot-room purge has two preconditions and both must hold: a verified copy in sealed-archive AND a verified off-host copy."
    status: ratified
    rationale: "The one-way sync needed a target that is neither a hot room (which is purged) nor the bucket (which is off-host and not readable at slice speed), and both replay and backup need to read that target by name; without an eighth role the node would have had to overload one of the seven and quietly change its retention meaning. The final certification seat caught this presented as one of AD-19's existing seven with no annotation at all, and it was closed at desk by minting the annotation properly. Rests on A44, proceed-on-recommendation. GATE-2 ruling 26 (DEC-0236) is where the purge precondition was written; binds TN-3 (DEC-0188), TN-13 (DEC-0198) and TN-21 (DEC-0206)."
    sources: [EXT-2145, EXT-2142, EXT-2140, EXT-2147]
    authority: rider
    component: COMP-QMF-DATA
    tags: [trading-node, parent-annotation, applied, ad-19, sealed-archive, room-roles, a44]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0254
    title: "Parent annotation — value_status_required minted as a registry schema field; value-status lives on the resolved value [APPLIED]"
    statement: "APPLIED. docs/registry/variables.yaml gains a NEW SCHEMA FIELD, value_status_required, which declares WHETHER A VARIABLE MAY EVER STAND AT provisional-evidence. The PER-VALUE value-status in blank | provisional-evidence | ratified does NOT live in the registry: it lives on the RESOLVED CONFIG ARTIFACT's row for every value, Book-declared values included, with the compiler propagating it onto generated fragments. The reason is structural — value-status is a property of a RESOLVED VALUE, not of a schema; were it a registry field, the countersign that flips it would be a git edit plus a deploy rather than a journaled powers call revalidated at click time. A COUNTERSIGN mints a new config version like any settings edit, is journaled, is made THROUGH THE POWERS CHANNEL under the operator principal, and is REFUSED WITHOUT THE VARIABLE'S EVIDENCE CITATION by fp1, ONE VARIABLE PER CALL. A provisional-evidence value that gates live money BLOCKS role=live exactly as a blank does until that countersign lands."
    status: ratified
    rationale: "PRD section 6 names this gap in its own words — 'docs/registry/variables.yaml carries configurable but no value-status field: the terminal cannot decide editability from data until it does' — and L29 already forbids a provisional recommendation from carrying live-money authority; without the field, a recorded evidence number and a ratified constant are indistinguishable to every consumer, including the later UI. Splitting the schema half from the per-value half is what keeps the countersign a live, journaled, evidence-bearing act instead of a commit. Rests on A34, whose stale register row the final certification seat caught and refreshed. Gate ruling 16 (DEC-0231) and GATE-2 ruling 22 (DEC-0236) are its two decision points; binds TN-17 (DEC-0202), TN-18 (DEC-0203) and TN-20 (DEC-0205)."
    sources: [EXT-2145, EXT-2136, EXT-2140, EXT-2154, EXT-2142]
    authority: rider
    component: COMP-QMF-REGISTRY
    tags: [trading-node, parent-annotation, applied, registry-schema, value-status, countersign, a34, l29]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0255
    title: "Parent annotation — kill_line_capital_floor IS AD-40's loss_floor: one variable, one name [APPLIED]"
    statement: "APPLIED. AD-40 states that loss_floor 'is the same number the kill line names — one value, one name', and the corpus now carries both spellings. The annotation records that kill_line_capital_floor (docs/registry/variables.yaml line 548) is the CANONICAL REGISTRY KEY and that loss_floor is AD-40's PROSE NAME for the same row. THE NODE MINTS NO SECOND NAME."
    status: ratified
    rationale: "Two spellings for one money figure is exactly the fault that produces two implementations and two different breach instants, and this figure is the one that flattens a binding without waiting for a human. Fixing the canonical key in the registry and demoting the other to prose costs nothing and removes the ambiguity permanently. Decided as part of gate ruling 1 (DEC-0216), which also fixed the series the floor is evaluated against; binds TN-8 (DEC-0193) and TN-25 (DEC-0210)."
    sources: [EXT-2145, EXT-2133]
    authority: rider
    component: COMP-QMF-RISK
    tags: [trading-node, parent-annotation, applied, ad-40, kill-line, loss-floor, registry-key]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0256
    title: "The registry mint table — every node-minted row configurable, unit-kinded, owner-scoped and blank-effect tagged [APPLIED]"
    statement: "APPLIED. Every row of the spine's registry mint table is minted into docs/registry/variables.yaml as configurable: true, each carrying a UNIT-KIND, an OWNER SCOPE (node, Book, BMS, bot, ops, or a pair of those), a value_status_required flag, and EVIDENCE VALUES ONLY — never a ratified constant. The registry row is the SCHEMA; the resolved value and its value-status live only in the node-config artifact (DEC-0254). EVERY ROW CARRIES A BLANK-EFFECT TAG from the three-way partition blocks-boot | blocks-role-live | blocks-soak, and blocks-soak is additionally a GENERATED property of any variable a TN-23 checklist item exercises, so a row may carry it ON TOP of its own tag. The blocks-boot set is the mechanisms that cannot run without a value: submission_deadline, accumulator_bound, max_slice_latency, local_queue_bound, node_crash_loop_max_boots (K), node_crash_loop_window (T), drain_window, watchdog_interval, slice_watch_trip_multiple, shadow_lane_publish_bound, news_recorder_max_attempts and news_recorder_backoff. The blocks-role-live set is the money gates: the KSA effect matrix and detector posture, the protection-window widths, the seven sqs_* keys, news_calendar_max_staleness, the ratchet parameters, the loss thresholds and amend_min_improvement, decision_freshness_bound, the reconciliation and pacing cadences, the clock bands, venue_d1_reverification_cadence, news_calendar_provider_primary and news_calendar_refresh_cadence, r_unit_price_recompute_cadence, bot_state_snapshot_cadence, accounting_period_calendar_identity, seat_callback_deadline and seat_memory_ceiling. The blocks-soak set is the operational rows: the backup objectives, retention, verification cadence, provider and payload-key custody; hot_room_retention_window, disk_headroom_min and vps_disk_budget with its named line items; the operator-log retention window and journald size cap; the dead-man's-switch endpoint, cadence and token reference; evidence_channel_budget; and the governor CPU and memory budgets. TWO EXPLICIT NON-ROWS: no paid news fallback slot is minted anywhere (R4, DEC-0214), and ALERT-CLASS MEMBERSHIP IS NOT A REGISTRY ROW — FAILURES.md's notification-tier column is its sole home. TimeoutStopSec and WatchdogSec are RENDERED into the unit file from drain_window and watchdog_interval by node-install, never hand-authored."
    status: ratified
    rationale: "L38 and DEC-0157 make configurable mean UI-editable at platform level, and L38's second half makes every recorded number evidence rather than a ratified constant, so the node cannot ship a single hard-coded operational value; the mint table is that rule discharged variable by variable. The blank-effect partition is what turns 'this value is missing' from an implementation detail into a stated, testable refusal at exactly one of three moments — boot, live binding, or the soak gate — and generating blocks-soak from the TN-23 checklist rather than enumerating it means the tag cannot drift as the checklist grows. Rests on A45, proceed-on-recommendation; GATE-2 ruling 20 (DEC-0236) fixed the partition, GATE-2 ruling 34 withdrew the alert-membership row, and the final certification seat added the last four rows with their tags. Binds TN-18 (DEC-0203) and every TN that mints a value."
    sources: [EXT-2146, EXT-2140, EXT-2142, EXT-2136]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, parent-annotation, applied, registry, variables, blank-effect, l38, a45]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#new-registry-variables-to-mint"

  - id: DEC-0257
    title: "Parent annotation — PRD section 3 notification allow-list widening [PROPOSED; ratified by this increment by default, cheap veto]"
    statement: "PROPOSED AS A PRD AMENDMENT, surfaced by the sitting and not settled by it. PRD section 3 declares a CLOSED, RATIFIED allow-list covering money boundaries and protection escalation. It does NOT cover SILENT DEGRADATION: an unattended node that has stopped accepting entries, or cannot persist evidence, for a reason that is not a KSA escalation emits NOTHING AT ALL. The proposed widening adds (a) a THIRD RATIFIED CLASS — 'the node has stopped accepting entries or cannot persist evidence for a reason that is not a KSA escalation', enumerated in TN-15 as the clock-band no-new-entry state, live-drift stand-down, a failed news-calendar refresh, a degraded or dead canonical feed, a backup or restore-drill failure, and the disk-headroom trip; (b) an EXTERNAL DEAD-MAN'S SWITCH, a heartbeat to an off-VPS watcher configured by reference; and (c) a LIVENESS DIGEST that survives go-live. THIS INCREMENT RATIFIES IT BY DEFAULT under the cheap-veto posture: the operator overturns it in one line and the node then ships the mechanisms with the notification half withheld. The two-plane rule is untouched — authoritative records and notification delivery stay separate layers, losing a notification never erases the underlying evidence, and the notification channel is never a permission path back into live trading."
    status: ratified
    rationale: "Widening a closed ratified allow-list by assertion is EXACTLY the move TN-1 refused for L30 and TN-11 refused for AD-28, and the node binds PRD section 3 in its own Inherited Invariants table — so the sitting proposed rather than applied. It is nonetheless a real hole: PRD section 3's own unattended doctrine says notifications must never create intraday decision loops, and a node that has silently stopped trading creates the worst decision loop of all, the one where the operator finds out days later. The dead-man's switch is external because a dead node cannot alarm about itself (A35). Gate ruling 18 (DEC-0233) raised it; GATE-2 ruling 31 (DEC-0236) fixed it as PROPOSED; GATE-2 ruling 34 put alert-class membership in FAILURES.md's notification-tier column, which is where the new class is declared. NFR-11's FAILURES.md obligation — one entry per designed failure mode, six fields — is the mechanism that maps each node failure mode onto the allow-list."
    sources: [EXT-2145, EXT-2155, EXT-2140, EXT-2136]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, parent-annotation, proposed, prd-amendment, allow-list, silent-degradation, dead-mans-switch, cheap-veto]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting"

  - id: DEC-0258
    title: "The four reconciliation verdicts replace the three-verdict baseline everywhere the node speaks [APPLIED]"
    statement: "APPLIED. The node's reconciliation vocabulary is FOUR VERDICTS — reconciled | drift | unknown | out-of-lookback — as the CT-20 contract already carries them. The GitBook baseline's three, and the PRD section 6 mined doctrine's three, are SUPERSEDED everywhere the node speaks: in the startup and recovery sequence, in the drift narrative, in the read models the doors publish, in the operator-facing lens pages and in the glossary. Two consequences ride with the fourth verdict: resolve_unknown may be issued ONLY from a reconciled read-back INSIDE THE LOOKBACK, and an out-of-lookback verdict is therefore a distinct, nameable state rather than a silent failure to reconcile."
    status: ratified
    rationale: "Adjudication correction 1 settled this against the corpus (ct-20 lines 26 and 44): the fourth verdict already exists in the ratified contract and only the older prose carried three, so the node adopts the contract and the documentation factory carries the correction into every place the node's vocabulary is rendered. It matters operationally because the missing verdict is precisely the case where the node CANNOT know — a read-back older than the lookback — and collapsing that into 'drift' would either alarm falsely or, worse, let a stale read clear an UNKNOWN. GATE-2 ruling 10 (DEC-0236) is the other half of the same correction: the residuals compared are quantity and cash separately, and unrealized P&L is a mark that is never reconciled. Binds TN-10 (DEC-0195), TN-24 (DEC-0209) and TN-25 (DEC-0210)."
    sources: [EXT-2144, EXT-2140, EXT-2145]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, parent-annotation, applied, reconciliation-verdicts, ct-20, vocabulary, resolve-unknown]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#corrections-the-node-inherits-from-adjudication"

  - id: DEC-0259
    title: "Trading-node spine TN-1..TN-25 adopted in full (FINAL 2026-08-28, ratified by delegation plus four direct rulings)"
    statement: "The trading-node architecture spine — TN-1 through TN-25 plus its Inherited Invariants table, the adjudication corrections, the parent annotations, the Deferred table, the operator rulings and the assumption register, at architecture-NODE-2026-08-28/, status FINAL, updated 2026-08-28 — is ADOPTED IN FULL as the trading node's V1 architecture. It is a CHILD SPINE of architecture-QMX-2026-08-19 (AD-1..AD-41), honouring QMB B-1..B-15 and QML QL-1..QL-10 read-only, with the paradigm 'supervised composition-root runtime over a pure rulebook'. RATIFICATION BASIS: operator DELEGATION for the sitting as a whole ('Treat this as a one-shot: run the whole sitting autonomously, batch every genuinely open decision into at most two AskUserQuestion rounds, and otherwise do not wait on me. I am non-technical; the corpus is my memory.'), PLUS the four DIRECT rulings of 2026-08-28 (DEC-0211..DEC-0214). Every non-directly-ruled entry in this increment therefore carries authority: rider. GROUND TRUTH: the parts-bin inventory of integration@ef9bb25 — 154 node capabilities, 78 exists-as-is / 24 exists-needs-live-adapter / 52 does-not-exist, capability count 58-66 per cent and NODE-EFFORT-WEIGHTED 48.5 per cent inside a stated 45-60 per cent band. The operator's recalled 'around 60%' is the TOP of that band and its SHAPE is wrong: roughly 60-80 per cent complete where the problem is LAW (qmf-risk 16,905 LOC and 613 tests; qmf-venue 9,180 LOC and 407 tests) and roughly 25-35 per cent where the problem is RUNTIME (async driver 33 per cent, logging/metrics/health 33 per cent, operator doors and config 26 per cent, deployment and CI 38 per cent) — the node is 100 per cent of a runtime plus the wiring of a very complete rulebook. REVIEW HISTORY: a SIX-LENS first gate (rubric, adversarial, parent-consistency, inputs-reconcile, ops-security, currency) returning CONDITIONAL PASS to DO-NOT-RATIFY-AS-IS, closed by FIX PASS 1 (243 rows, 150 findings applied, TN-25 minted, six diagrams valid); then the operator round; then a FIVE-LENS validation re-gate (parent-consistency, adversarial, rubric-plus-ambiguity, operator-reconcile which confirmed all four rulings applied faithfully, and fix-regression which found every fix-pass row present), closed by residual fix pass 2 under the 34 GATE-2 rulings (DEC-0236); then a FINAL CERTIFICATION seat which blocked on four highs and ten lows, all fourteen closed at desk. CHEAP-VETO SURFACE: the assumption register A1-A47 is attached as the operator's one-line overturn surface — A1, A10, A17 and A26 are RULED, A8 is RETIRED (the dead-zone width carries no node posture and its disagreeing evidence is recorded unmerged), and every other row proceeds on recommendation and may be overturned individually without unwinding another ruling. DEFERRED TABLE, every row named: the KSA effect-matrix VALUES; a staging host; hardened OS-level confinement for seats; VPS procurement, Spotware app approval, live KYC and the swap-free admin-fee schedule in writing; the platform-versus-venue identity axis; hot-apply of settings; the MIS TRAINING plus SHADOW ROLLOUT epic; MIS ML labelers on the live path with quarterly cloud training and a re-certification cadence; a dedicated monitoring agent over the observability stack; the AD-9 paper-validation versus paper-benched role split; margin-aware sizing and an admission-time free-margin check; numeric latency budgets for the six AD-13 rungs; a second VPS for the evidence tier; fill simulation in replay; a second notification channel; the 26.04 LTS upgrade; leap-second smearing sources; the news-feed legal archiving posture; the GAP-0048 and GAP-0049 thresholds; the agent or MCP door; and the desktop UI itself — deferred but never optional. ID CORRECTION CARRIED BY THIS ADOPTION: the spine cites GAP-0015 for the KSA matrix values, but catalog GAP-0015 is the lineage-edges gap answered 2026-08-20 by DEC-0114; the correct id is GAP-0050, GAP-0015 is NOT touched, and 'GAP-0015 shape closed' reads as 'the matrix SHAPE is closed by TN-7 under GAP-0050's heading'."
    status: ratified
    rationale: "Adopted as one decision because the spine is a single reconciled artifact whose parts were gated together; the individual rules are already minted at DEC-0186..DEC-0210 and the rulings and annotations at DEC-0211..DEC-0258, so this entry carries the adoption, the provenance and the veto surface rather than restating law. TRANSCRIPT-SCAN FINDINGS, carried here so the changelog can surface every one to the operator: (i) the MISATTRIBUTED quote — memlog line 48 and spine R2 present 'I know what you're talking about' as the operator claiming familiarity with a Prometheus/Grafana-class stack; he said the opposite about himself and addressed the phrase to the agent (corrected in DEC-0212); (ii) the SPLICED promotion quote 'A simple click on the user interface... two separate acts.', a composite of two non-contiguous sentences with an added capital (corrected in DEC-0213); (iii) the RECONSTRUCTED 'it might have its own page... I'm not certain yet', which reverses his lean while keeping the uncertainty (corrected in DEC-0215); plus the paraphrase-in-quotes 'focus on live trading', the dropped self-correction in 'later versions, yes, no, we're going to iterate', the not-a-quote 'QMF is portable', the speaker error on R1's enumeration, the relocated referent of 'a very separate system, like how big tech teams work', the inference presented as a refusal to name, and case-and-punctuation drift on four further quotations. UNCARRIED OPERATOR STATEMENTS, each named so the changelog surfaces it: U1 his post-promotion warm-up recollection, unanswered by memlog and spine and CLOSED here at DEC-0213; U2 his reason for deferring the UI (it is too large to build alongside the node, 'we are trying to be efficient with our resources'), dropped by the spine and carried at DEC-0215; U3 'the trading node is very back-end heavy... The user interface is less', carried nowhere before this increment; U4 the DevOps lens was DELEGATED to the agent with a stated need, not ruled — which is precisely why everything DevOps-shaped carries authority: rider; U5 the 'Hammers agent' as his named future consumer of the observability stack, memlog-only and dropped by the spine, carried at DEC-0212; U6 his question-quality instruction ('don't be stupid... Such a question is very annoying'), carried as posture and never as doc prose; U7 his fidelity instruction 'I hope I'm clear and quote me right, please. These are more of brain dumps than actual answers', which is the standard this scan applied; U8 his SELF-SUPERSESSION of two kickoff non-negotiables (the no-UI-in-this-phase framing with its CLI/API door, and the ~2-day first milestone) — the changelog must say plainly that the operator overrode his own opening instructions so no later reader treats the kickoff text as live; U9 his own word for the node's place in the UI, a banned term kept as the spine's paraphrase only; U10 the epics-stage constraints (a SMALL set of 5-8 epics, wave plan, paper-milestone epics first, routed to the Grok epic-factory lane, with the live-connection story sequenced first among those the tokens unblock), which this increment CARRIES FORWARD to prompt 14 and does not re-decide; U11 his mid-sitting model-tier nudge, session mechanics with no doc bearing. His own acceptance bar for this absorption is his phrase: 'so there is no ambiguity, no assumption, and no contradiction'."
    sources: [EXT-2143, EXT-2147, EXT-2148, EXT-2152, EXT-2158, EXT-2159, EXT-2137, EXT-2138, EXT-2141, EXT-2142, EXT-2151, EXT-2160, EXT-2161, EXT-2162, EXT-2163, EXT-2164, EXT-2165, EXT-2166, EXT-2167, EXT-2168, EXT-2169]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, spine-adoption, final, cheap-veto, assumption-register, deferred, parts-bin, transcript-scan, gap-0050]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md"

  - id: DEC-0260
    title: "The node's open-items register — the ten items carried, with each disposition after the rulings"
    statement: "The sitting's OPEN ITEMS CARRIED (memlog line 42, non-blocking for the spine and for the epics) become the trading node's open-items register, each with its disposition AFTER the four operator rulings and the two gate rounds. (1) The KSA trigger-to-level-to-effect matrix VALUES — STILL OPEN, and MOVED EARLIER: gate ruling 16 (DEC-0231) makes it a PRE-SOAK operator ratification through the settings surface, recorded as a config version, not merely a pre-live one, because the soak checklist exercises the matrix; a blank or provisional-evidence cell blocks live money regardless. Tracked as GAP-0050, never GAP-0015. (2) VPS procurement, Spotware app approval, live KYC and the swap-free admin-fee schedule in writing — STILL OPEN, human-only steps, but now SPLIT: VPS procurement GATES THE SOAK'S START because CT-28 refuses a live binding without a rung baseline on this deployment tuple, while Spotware approval and live KYC GATE GO-LIVE ONLY — the week runs on the demo binding alone and the live connection opens for sensing and recording the moment credentials land (A47), so a late approval delays the live milestone and NEVER the week. (3) The platform-versus-venue identity axis — RECORDED, NOT MODELLED; a third axis stays reachable in TN-22 (DEC-0207). (4) Hot-apply of settings — DEFERRED; V1 applies a config change at the next boot epoch and hot-apply is a later mint on the same versioned artifact (A24). (5) MIS ML labelers, the shadow lane and quarterly cloud training — PARTLY CLOSED: the operator ruled the models do not exist and must be trained, so the SHADOW-LANE SEAM became explicit V1 node work (DEC-0215, TN-19) while the TRAINING plus SHADOW ROLLOUT became a named follow-on epic after the paper milestone; live-path labelers, quarterly cloud training and the re-certification cadence STAY DEFERRED, and V1 binds no trained model. (6) Hardened OS-level confinement for seats — DEFERRED, with the V1 controls named once so no two units build two containment stories: seat_callback_deadline, seat_memory_ceiling, automatic seat quarantine whose only exit is the operator-signed seat_reinstate power, the door layer's slice-progress watch, the supervised restart of last resort, QL-8's static scan and the stdlib process isolation of the Layer-2 runner (A38). (7) The legal archiving posture for the news feed — STILL OPEN as an operator item, RECORDED AS PERSONAL USE exactly as Dukascopy was, and reaffirmed rather than resolved by R4 (DEC-0214). (8) The GAP-0048 and GAP-0049 thresholds — DEFERRED to the backtesting and search-quality sittings; blank bars block live regardless under AD-32. (9) Margin-aware sizing and the admission-time free-margin check — DEFERRED with the consequence stated: an R-sized position may exceed what the account can margin, and a second Book on one account can consume free margin the first assumed; CT-18 declares the dimension so it stays visible. (10) Numeric latency budgets for the six AD-13 rungs — DEFERRED until after the soak baselines; the operator's roughly 50 ms is a WATCHED TARGET, never a gate. THREE ITEMS THE ROUND ITSELF OPENED, added to the register: the PRODUCT NAME, which the operator declined to rule ('That question is not for this layer') so qmn stands as a code name and a rename is mechanical; the DESKTOP UI sitting, at which every operator moment is walked as a behaviour-driven story; and the alignment of the doors' one versioned wire vocabulary with the QMA daemon-to-UI wire-contract conventions once that spine fixes them — an alignment obligation on the node, never an import (A39)."
    status: ratified
    rationale: "The memlog recorded these ten as carried and non-blocking, but three of them moved during the same sitting — item 1 moved earlier in time, item 2 split into two different gates, and item 5 half-closed — so a register that merely repeated the memlog line would understate what is now settled and overstate what still blocks. Recording the disposition beside each item is what lets the next sitting see, in one place, which of them can gate the soak, which can gate go-live and which gate nothing. The three additions are the round's own residue: a declined naming question, a deferred-but-never-optional UI, and a coordination obligation toward a sibling spine that does not exist yet. None of the thirteen blocks the epics, which is the property the memlog asserted and this entry preserves."
