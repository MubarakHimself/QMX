      ## 2026-08-29 — QMA increment absorption (change mode)

      Absorbed the 2026-08-29 QMX agentic-system architecture sitting — the spine AD-1 through AD-29 at `architecture-QMA-2026-08-28/`, FINAL and export-ready with validation closed dry on 2026-08-29 (verified, remaining 0), a child of the QMX foundation spine (AD-1..AD-41) honouring QMB (B-1..B-15) and QML (QL-1..QL-10) read-only, its paradigm an organizational, multi-agent system on the QMF backend — into the knowledge base. The spine was drafted by the sitting and ratified by delegation under his I-draft-operator-ratifies mode, with the job-spec rider SRC-15 ordering the absorption, so every non-directly-ruled ledger entry carries `authority: rider` (DEC-0329). New components [COMP-QMA-CORE](components/qma-core.md), [COMP-QMA-WIRE](components/qma-wire.md), and [COMP-QMA-DAEMON](components/qma-daemon.md); new [ADR-0020](decisions/ADR-0020-qma-agentic-system.md); scenarios [SCN-0013](scenarios/SCN-0013-quant-over-the-wire.md) and [SCN-0014](scenarios/SCN-0014-money-path-barrier.md); twelve contracts CT-40 through CT-51; and features FEAT-0040 through FEAT-0046 in the operator's build order. The QMX agentic system is a daemon plus the QMA SDK (QuantMind Agents) plus a wire contract, an application-layer product built ON QMF exactly as the other consumers are, never a QMF roster package and never a framework; its only output into the money path is a candidate artifact a human promotes, never an order, sizing decision, or binding. The design is ratified; implementation authorization still arrives only through the factory pipeline, and nothing in these docs grants credential, order, promotion, live-money, or destructive authority. The cheap-veto register is surfaced below so the operator can overturn any call in one line.

      | Field | Value |
      |---|---|
      | Mode | Change mode — fold the ratified QMA increment into `docs/`; `lint_docs --strict` stays clean |
      | Authority snapshot | 29 AD decisions DEC-0300–DEC-0328 (one per AD-1..AD-29); the spine-adoption umbrella DEC-0329; 21 ruling decisions DEC-0330–DEC-0350; 20 `status: dead` decisions DEC-0360–DEC-0379 for the Cut-outright table; 22 `status: deferred` gaps GAP-0070–GAP-0091; seven features FEAT-0040–FEAT-0046; ADR-0020; two scenarios SCN-0013/SCN-0014; twelve contracts CT-40–CT-51 (`defined-unwired`); and three components. Validation closed dry 2026-08-29. No prior ledger conflict opened or closed. |
      | Provenance | Sources SRC-13 (the `architecture-QMA-2026-08-28/` sitting folder — `ARCHITECTURE-SPINE.md` AD-1..AD-29, `.memlog.md`, `research/`, `reviews/`, `inputs/`), SRC-14 (`archive/agentic-spine.txt`, the sitting transcript, the citation surface for the operator's own words only), and SRC-15 (`_docwork/qma/riders/job-spec-2026-08-29.md`, the operator's verbatim job spec) registered; extractions EXT-2300–EXT-2459. The spine is FINAL under the sitting's I-draft-operator-ratifies mode, with the operator's rulings recorded in the memlog. |
      | Naming and posture | The system is "the QMX agentic system"; **QMA = QuantMind Agents, the SDK only**, never the whole system and never a framework; "Quantum Mind" is retired as a dictation error (DEC-0330). The persistent named organizational actor is the **Quant** (never Bot, never Steward), `ActorId` grammar `quant:<desk_slug>/<quant_slug>` over five Desks and five Roles (DEC-0331). One Python 3.14 asyncio daemon is dispositive under L31; workers and non-Python clients attach over the wire (DEC-0334). The namespace is `qma.*` with no blanket `qmx.` prefix (DEC-0337). |
      | New components | [COMP-QMA-CORE](components/qma-core.md) (`qma-core`, definitions only, depends only on `qmf-core`), [COMP-QMA-WIRE](components/qma-wire.md) (`qma-wire`, the only cross-boundary contract), and [COMP-QMA-DAEMON](components/qma-daemon.md) (`qma-daemon`, the only process that runs anything and the sole writer); all `layer: backend`, application-layer consumers built ON QMF (DEC-0335). |
      | Contracts | CT-40 through CT-51 minted `defined-unwired` (no code exists): the wire envelope (CT-40), hook event/result (CT-41), plugin manifest/context (CT-42), memory provider (CT-43), knowledge source (CT-44), model deployment/broker (CT-45), execution environment/job (CT-46), experiment spec (CT-47), mailbox envelope (CT-48), routine (CT-49), refinement proposal (CT-50), and task ledger entry (CT-51). |
      | Money path | QMA's only output into the money path is a candidate artifact a human promotes — never an order, sizing decision, or binding (DEC-0324). There is no execution tool at any account role, "paper only" included (an act-level deny-list), and no environment, worker, browser, or computer-use profile may reach a venue, broker, exchange, or trading-node host (DEC-0341, DEC-0315, DEC-0327). `qmf-venue` is importable by no QMA package, worker, or plugin; the `qmf-registry` and `qmf-risk` edges are read-and-calculate only over a default-deny enumerated surface (DEC-0347). Risk, sizing, and live authority stay with the GitBook and trading-node corpus. |
      | Registry, stack, glossary | [variables.yaml](registry/variables.yaml) gains the AD-26 configurable-variables registry; [stack.md](architecture/stack.md) gains the QMA application stack (one Python 3.14 asyncio runtime and its pins, DEC-0334); the [glossary](glossary.md) gains the QMA terms — Quant, Desk/Role, Graph Template versus Task Graph, the three ledgers, admit/apply/promote — and the retired names, with the scoped `plugin`/"RLM kernel" note (DEC-0346). |
      | Lens pages | [security/security-model.md](lenses/security/security-model.md) gains the Credential Broker, principal-classes, and money-path-barrier section; [observability/metrics-and-alerts.md](lenses/observability/metrics-and-alerts.md) gains the QMA telemetry export port (OpenTelemetry at a swappable export port, telemetry off the ledgers, the keep-forever journal). |
      | Vocabulary scope | `plugin` (a desk extension package) and the qualified "RLM kernel" (the Analysis worker's persistent Python interpreter) are adopted for QMA prose; the parent ban stays in force for QMF/QMB/node prose (`engine` banned for backtesting, `exam` banned outright, `kernel` a retired name for `qmf-core`); QMA's adoption scopes the ban's audience and never lifts it (DEC-0346). `promote` is reserved for the human live-zone act outside QMA; memory candidates are admitted and refinement proposals applied (DEC-0345). |
      | Constitution touchpoints | QMA binds L17, L18, L30 (scope annotation), L31, L33, L34, L35, L36, L38, and L39 read-only, recorded in traceability; QMA amends no parent by assertion (DEC-0350, DEC-0347). |
      | Id-block reservation | On 2026-08-29 this increment's identifiers were block-reserved from DEC-0300, EXT-2300, GAP-0070, FEAT-0040, and CT-40, keeping the QMA numbering disjoint from the trading-node increment's block (decision numbers from 0186 upward and contract numbers 35 through 39); contract numbers 35 through 39 are left free for the trading-node increment, and decision numbers 0351–0359 and 0380–0399 stay unused by QMA. |
      | Cheap-veto register | The full assumption-and-inference register plus the 22 Deferred rows — the operator's one-line overturn surface — is the two tables below this one (DEC-0329). The five operator-flagged items are marked ★. Every row proceeds on recommendation and is individually overturnable without unwinding another call. |
      | Remaining open | The 22 Deferred rows GAP-0070–GAP-0091 (below), each with its stated revisit condition; the UI and its extension SDK, contribution points, and packaging are deferred (GAP-0081) while the wire contract (AD-5) and the variables registry (AD-26) bind now. The Cut-outright table (DEC-0360–DEC-0379) is spine law and nothing on it is revived. |
      | Gates | validate_ledger PASS; validate_registry PASS; validate_inventory PASS (house-accepted contracts-before-consumers and uncovered-ratified warnings); check_citations PASS (house-accepted dead-DEC class; DEC-0360–DEC-0379 join it); lint_docs CLEAN; **lint_docs --strict CLEAN** |

      Touched docs: new [qma-core.md](components/qma-core.md), [qma-wire.md](components/qma-wire.md), and [qma-daemon.md](components/qma-daemon.md) component specs; new [ADR-0020](decisions/ADR-0020-qma-agentic-system.md); new scenarios [SCN-0013](scenarios/SCN-0013-quant-over-the-wire.md) and [SCN-0014](scenarios/SCN-0014-money-path-barrier.md); twelve new contracts [CT-40](contracts/ct-40-qma-wire-envelope.yaml) through [CT-51](contracts/ct-51-qma-task-ledger-entry.yaml); [variables.yaml](registry/variables.yaml) (the AD-26 configurable variables), [stack.md](architecture/stack.md) (the QMA application stack), and [dependencies.yaml](architecture/dependencies.yaml) (COMP-QMA-CORE/WIRE/DAEMON minted with the read-and-calculate narrowing and no qmf-venue edge); the [glossary](glossary.md) (the QMA terms and the scoped vocabulary note); [overview](architecture/overview.md) (the QMA application-layer consumer section with the containers and deployment diagrams, and the C4 context additions); the security and observability lens pages above; the [gap report](gap-report.md) (GAP-0070–GAP-0091 deferred and DEC-0360–DEC-0379 dead); [traceability](knowledge/traceability.md) (the DEC-0300–DEC-0350, DEC-0360–DEC-0379, GAP-0070–GAP-0091, and FEAT-0040–FEAT-0046 locators and the QMA constitution touchpoints); the feature inventory (FEAT-0040–FEAT-0046); the manifest (SRC-13/SRC-14/SRC-15); and [index](index.md), [AGENTS.md](AGENTS.md), and this changelog. The QMX agentic system runs the ratified QMF rulebook read-only, adds no money-path rule of its own, and is never a QMF roster package or a framework.

      ### Cheap-veto register — the operator's one-line overturn surface

      Every call the QMA sitting made on an assumption or an inference rather than a direct operator quote, plus every Deferred row, gathered so the operator can overturn any one in a single line (DEC-0329). The register's authority is the memlog's ruling entries as amended. The five operator-flagged items are marked ★; each row stands unless the operator vetoes it, and no veto unwinds another.

      | Id | The call QMA made (memlog line) | Lands in | The operator's one-line overturn |
      |---|---|---|---|
      | ★ V1 | A **desk-level lead Quant** exists as a persistent actor keeping a Quant Ledger (L63/L133/L183) | AD-7, AD-9, AD-20; DEC-0349, DEC-0331, DEC-0338 | There is no persistent desk-level lead Quant — drop the Quant Ledger and the lead flag |
      | V2 | **One lead flag per desk** and the lead's mailbox as the undeliverable-`Envelope` catch-all were inferred (L183) | AD-7, AD-20; DEC-0349, GAP-0071 | A desk may carry more than one lead flag / route undeliverable `Envelope`s to the lead, not `dead_letter` |
      | ★ V3 | A **loopback-unauthenticated local proxy** is accepted in v1; `proxy.allow_unauthenticated_loopback` default `true` (L106) | AD-15, AD-24, AD-26; DEC-0344 | Default `proxy.allow_unauthenticated_loopback` to `false` — refuse an unauthenticated loopback proxy |
      | ★ V4 | **QMA never pools accounts**; pooling stays the operator's own practice inside his proxy (L41) | AD-15; DEC-0344 | Bar QMA from registering or routing to any multi-account-pooling proxy |
      | V5 | **No QMA-resolved secret crosses into a local proxy process** (`auth_mode: none`, loopback bind) (L102) | AD-15, AD-24; DEC-0344 | Allow QMA to hand its resolved credentials to the local proxy process |
      | ★ V6 | The word **`plugin`** and the qualified **"RLM kernel"** are adopted for QMA; the parent ban is read QMB/QMF/node-scoped (L102/L140/L182/L205) | Conventions, Vocabulary, glossary; DEC-0346 | Refuse `plugin` and "RLM kernel" for QMA — use `extension` and "RLM interpreter" throughout |
      | V7 | **`promote` reserved for the L17 live-zone act**; memory admitted, refinement applied (L102/L104) | AD-18, AD-22, AD-25; DEC-0345 | Keep one verb `promote` across memory, refinement, and the live zone |
      | ★ V8 | The **Windows VPS** for the computer-use agent is PLANNED, not provisioned (L224/L260) | AD-25; DEC-0324, DEC-0316; GAP-0070 | The Windows VPS is already provisioned — register the desktop environment now |
      | V9 | The **Graph Template / Task Graph name split** was invented to close the adversary hole; the operator's quote is "graphs, not loops" (L39, T-4954) | AD-12, AD-13; DEC-0340 | Reject the Graph Template / Task Graph split — one "Graph" object |
      | V10 | The in-house **Knowledge contract** was adopted on the operator's silence (L43) | AD-19; DEC-0343 | Drop the in-house Knowledge contract — no `KnowledgeSource` port in v1 |
      | V11 | The **threading-node accommodation** was read as a ratified constraint on the plugin model (L137) | AD-21; GAP-0077 | The threading node is not in scope for the QMA plugin model at all |
      | V12 | Three variables the job spec named are **not** registered: `bus.sticky_limit` and `routine.budget_hint` (removed from AD-26 by the sitting as unowned — no owning AD, subsystem, units or default) and `journal.retention_*` (the event journal is evidence and is never trimmed, so it mints no retention or trim threshold) | registry/variables.yaml; DEC-0325 | Register a sticky limit / budget hint / journal retention window anyway, naming its owning subsystem, units and default |

      | Deferred row | The deferral (revisit condition) |
      |---|---|
      | GAP-0070 | Windows VPS for the computer-use agent — planned, not provisioned; a `desktop` `ExecutionEnvironment` is registered only once provisioned, and until then every computer-use tool fails its `check_fn`. |
      | GAP-0071 | One lead flag per desk and the lead's catch-all mailbox — the operator rules; interim, a second lead flag is a hard startup error and an undeliverable `Envelope` resolves to `dead_letter`. |
      | GAP-0072 | External memory backend (Hindsight/Mem0) behind a testable eval — revisit once the staging store holds candidates from two desks and a Mission has been blocked on recall. |
      | GAP-0073 | Knowledge hybrid retrieval beyond literal and locator search — revisit once the corpus holds ingestible content and STRATS section 6 is ratified upstream. |
      | GAP-0074 | Self-improvement evaluation gates — switch on once telemetry holds finished-Mission trajectories (initially 50) across two desks; v1 ships invariants plus staging only. |
      | GAP-0075 | Sandbox and compute vendors (`remote_container`; desktop beyond the planned VPS) — after the registered count of `NoEnvironment` refusals; Modal, Daytona, and E2B are rejected outright. |
      | GAP-0076 | RLM kernel performance envelope — measure the first 800-variant fan-out; RLM-in-Docker re-opens if a snapshot fails or the recorded cost exceeds the ceiling. |
      | GAP-0077 | The in-house threading node's shape and contribution point — the operator supplies its spec or code first; no contribution type is minted until then. |
      | GAP-0078 | Browser stack — reverse-engineer Egolite as the starting point when a browser-heavy Mission actually blocks. |
      | GAP-0079 | External agent-to-agent transport — when a second host or an external counterparty needs the mailbox; the internal bus comes first. |
      | GAP-0080 | RLM beyond the Analysis desk and depth above 2 — when a non-Analysis Task blocks for want of an RLM kernel or a run hits the depth-2 cap. |
      | GAP-0081 | UI presentation, Rust extension technology, UI SDK, and `qma-ui-contract` beyond a stub — its own later UI work; the wire contract and the variables registry are not deferred and bind now. |
