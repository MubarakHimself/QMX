id: CT-21
name: Venue secret and session boundary contract
status: ratified
version: 1  # first minted format version; the shape is spine-ratified (AD-26), corpus signed off by the operator 2026-08-21 (DEC-0136, DEC-0140); trading-node increment 2026-08-29 adds node-usage notes only — the two-layer VPS store landed at the node sitting, four named secret holders and no fifth (the separate zero-authority observability stack the declared fourth), refresh keyed by credential reference, and the SecretStore refusing to construct a venue-session holder off the VPS host — no field or format change (DEC-0197, DEC-0227, DEC-0222)
owner: COMP-QMF-VENUE
consumers: []  # consumer-blind by design: the adapter's connection manager is the single value-holder and the composition root injects the SecretStore port; nothing imports qmf-venue under default-deny, so no package import edge exists (DEC-0136, DEC-0138)
active_consumers: []
intended_consumers: [COMP-CTRADER]  # the cTrader adapter's connection manager holds secret values through the injected SecretStore port; wired by the composition root when the factory ships, documentary until then (DEC-0136)
wiring_status: ratified-shape-wiring-intended  # AD-26 ratified the secret/session shape; adapter implementation and root wiring stay intended and documentary, and no credential-bearing integration is authorized from this doc until the software factory ships it (DEC-0136)
layer_from: external
layer_to: middleware
decisions: [DEC-0059, DEC-0060, DEC-0107, DEC-0110, DEC-0135, DEC-0136, DEC-0137, DEC-0138, DEC-0140, DEC-0197, DEC-0222, DEC-0227, DEC-0236]
gaps: []  # GAP-0005 answered by minting version 1; GAP-0035 answered 2026-08-20 (DEC-0136); GAP-0036/0037 answered (DEC-0137, DEC-0135); store mechanics and key custody are deferred to the node/ops sitting, a scoped hand-off, not a gap
purpose: "The external credential and session boundary: QMF components handle opaque secret references, the adapter's connection manager alone holds secret values through an injected SecretStore port, and every session and topology binding is a secret-reference-only record — so credentials never enter code, evidence, logs, fingerprints, or sandboxes."
invariants:
  - "The secret/session shape is ratified (DEC-0136); the composition root injects the SecretStore port and wires the connection manager, but no credential-bearing integration is authorized from this doc — wiring stays intended and documentary until the software factory ships it (DEC-0136, DEC-0140)."
  - "QMF components handle secret references, never values: qmf-core ships typed SecretRef and SecretValue; a SecretValue never renders its value — repr, str, serialization, and logging all yield the reference id — and a tier-1 secret-scan gate rides poe check (DEC-0136, DEC-0140)."
  - "A secret reference is an opaque minted id under AD-9's discipline: stable, never reused, never encoding venue, broker, account, environment, or key material; any human-readable label is a separate field held outside evidence; construction validates opacity as an invalid-input refusal (DEC-0136, DEC-0140)."
  - "An account-binding record's identity is (VenueId, AccountId, role, world); its secret reference is declared occurrence/display-only and excluded from fp1 — a credential is a deployment fact, never a market fact (DEC-0136, DEC-0140)."
  - "The connection manager is the single named component permitted to hold secret values in memory, for a session's lifetime, through the core-defined SecretStore port (read + atomic replace) injected by the composition root; values never cross back out — no getter, no log line, no refusal context, no health field, no metric label (DEC-0136)."
  - "A credential is a one-writer stream: exactly one live refresher per credential — a workstation tool never refreshes a credential a VPS session owns (DEC-0136, DEC-0140)."
  - "Rotation is store-before-discard: where the venue rotates refresh material on use, the new secret is stored via atomic replace before the old is discarded; a failed store after rotation is an alarm and a command-pipe block (unavailable dependency, after-condition = successful store or operator re-provision), with the sensing pipe unaffected; where the venue already invalidated the old material the session is marked degraded and the compromise drill triggers (DEC-0136, DEC-0140)."
  - "Compromise recovery is a documented, tested drill: cTID re-authorization invalidates all outstanding refresh tokens, application-credential reset, store replacement, and session restart; expiry and refusal paths ship as tested behavior (DEC-0136, DEC-0135)."
  - "A missing, expired, or rejected credential is an unavailable-dependency refusal carrying the reference id, never the value; refusal context, logs, health reports, and metrics carry the reference id only (DEC-0136)."
  - "Testing uses demo credentials only; factory sandboxes never hold live secrets, and evidence produced in a sandbox carries an identity-bearing provenance field per AD-12 (DEC-0136)."
  - "Session topology and paired-demo bindings are secret-reference-only records identified per this contract; a session-epoch id distinct from the boot epoch rides every venue observation, sequences reset only on boot, and the cursor is durable through the observation sink (DEC-0136, DEC-0137, DEC-0138)."
  - "Token lifecycle facts for the cTrader-platform profile: the access token lives ~30 days, the refresh token never expires and is the crown-jewel secret, and cTID re-authorization is the invalidation anchor; secrets never appear in repositories, configuration artifacts, docs, .env files, CLI arguments, journals, evidence, fingerprints, or logs (DEC-0135, DEC-0136)."
  - "Store mechanics and key custody LANDED at the 2026-08-28 node/ops sitting and are recorded here as node-usage, not QMF contract surface: the VPS store is two layers — systemd-creds LoadCredentialEncrypted with --with-key=host (never --with-key=auto) delivering a node key-encryption key and the bootstrap credentials at service start, while rotated material (the refresh token dies on use, the access token lives roughly its declared class) is kept under /var/lib/qmx/state as AEAD ciphertext under that key; credential entry and management UI stays platform territory — none of it is QMF contract surface (DEC-0136, DEC-0197, DEC-0227)."
  - "TRADING-NODE USAGE (2026-08-29): on the VPS there are FOUR named secret holders and no fifth — the connection manager (venue session material), the backup unit (the CT-14 payload key plus object-storage credentials for one run), the observability path (the notification-channel token), and the separate zero-authority observability stack under its own distinct non-qmx service account (holding its own Grafana admin credential and any log-shipper token, and holding nothing the node holds); the three node holders run under a fixed User=qmx service account, and every unit — the stack included — receives ONLY its own credentials through LoadCredentialEncrypted with systemd-creds --with-key=host pinned (DEC-0227, DEC-0197, DEC-0236)."
  - "TRADING-NODE USAGE (2026-08-29): token refresh is keyed by CREDENTIAL REFERENCE, never by connection — at most one refresh is in flight per credential reference, owned by the connection manager as a whole, every session sharing that credential a reader of the rotated access token rather than a refresher and republished to before any of them reissues a request; whether demo and live share one cTID credential is a declared roster fact verified at preflight, and an authentication failure attributable to a rotation in flight is retry-after-refresh only for requests carrying no command identity, never for a command (DEC-0222, DEC-0197)."
  - "TRADING-NODE USAGE (2026-08-29): the workstation installation is provisioning-only and ENFORCED — the node's composition root refuses to compose on any host whose declared machine tuple is not the deployment roster's VPS entry, and the node's SecretStore refuses to construct a venue-session holder off that host, so no workstation script can refresh the token and kill the VPS session mid-trade; the provisioning wizard is carved out as a transient workstation-only holder for the duration of one run (DEC-0197, DEC-0227)."
schema:
  type: secret-reference + secret-value + account-binding + session-binding  # the opaque reference id and its render-guarded value core type, the identity-bearing account-binding record, and the secret-reference-only session/topology records (DEC-0136, DEC-0140)
  fields:
    - "secret_ref: opaque minted id under AD-9's discipline; stable, never reused, never encoding venue/broker/account/environment/key material; construction-validated opacity; any human-readable label is a separate field held outside evidence (DEC-0136, DEC-0140)"
    - "secret_value: the qmf-core SecretValue type; render guard on repr, str, serialization, and logging (all yield the reference id); held only by the connection manager, for a session's lifetime, never crossing back out (DEC-0136)"
    - "binding_identity: (VenueId, AccountId, role, world); the account-binding record's fp1; its secret reference is occurrence/display-only and excluded from identity (DEC-0136, DEC-0140)"
    - "secret_store_port: the core-defined SecretStore protocol (read + atomic replace) injected by the composition root; the connection manager is its sole holder (DEC-0136)"
    - "session_binding: the session-epoch id (distinct from the boot epoch), the venue-declared session topology, and paired-demo pairings — all secret-reference-only records (DEC-0136, DEC-0137, DEC-0138)"
    - "rotation_state: one live refresher per credential; store-before-discard on rotation; a failed store is an alarm plus a command-pipe block, the sensing pipe unaffected (DEC-0136, DEC-0140)"
    - "token_lifecycle: the declared credential lifecycle class (cTrader-platform: ~30-day access token, never-expiring refresh token); the reference-not-value discipline holds regardless of lifetime (DEC-0135, DEC-0136)"
  enums:
    - "account-binding role: live | demo | paper-validation | paper-benched | prop-firm, per CT-03's account_role enum; testing uses demo only, and prop-firm is a reserved seam in V1 with no prop firm modeled (DEC-0107, DEC-0136)"
    - "world in binding identity: live | replay | simulated per AD-12, with demo and paper bindings world = live under the money-reality rule (DEC-0110); the binding-identity tuple itself is (VenueId, AccountId, role, world), and a sandbox binding carries the provenance field (DEC-0136, DEC-0110)"
    - "SecretStore operation: read | atomic-replace — the only two the port exposes (DEC-0136)"
    - "refusal categories in this contract's paths: unavailable dependency (missing, expired, or rejected credential; failed store after rotation), invalid input (non-opaque reference construction) per registry:typed_refusal_codes (DEC-0136, DEC-0140)"
  units:
    - "token lifecycle: wall duration of the declared class; cTrader-platform access token ~30 days, refresh token never-expiring; actual refresh cadence is a do-not-default node value (DEC-0135, DEC-0137)"
    - "session epoch: an opaque per-session id distinct from the boot epoch, carried on every venue observation, not a duration (DEC-0136, DEC-0137)"
  nullability:
    - "a binding record's secret reference is excluded from fp1 as occurrence/display-only; an absent secret reference is an omitted key in identity content, never a null (DEC-0136, DEC-0140)"
    - "a SecretValue is never null-rendered and never serialized; the absence of a credential is an unavailable-dependency refusal carrying the reference id, never a null value or an empty string (DEC-0136)"
    - "any human-readable label is null in evidence content — it lives outside evidence, fingerprints, and logs (DEC-0136, DEC-0140)"
conformance_register: "The venue increment gate hardened this boundary at desk: opaque SecretRef ids with construction-validated opacity, the SecretValue render guard, the tier-1 secret scan, binding identity (VenueId, AccountId, role, world), one-refresher-per-credential, and rotation store-failure as a command-pipe block are folded into these invariants; the compromise drill (cTID re-authorization, application-credential reset, store replace, session restart) ships as tested behavior with demo credentials only; the venue research companions are cited as evidence, never copied, and bind conformance tests when the factory ships (DEC-0140, DEC-0136, DEC-0135)."
