ledger:
  - id: DEC-0001
    title: "Current operator rulings are authoritative"
    statement: "Current direct operator corrections and rulings govern QMF V1 when sources disagree."
    status: ratified
    rationale: "The transcripts explicitly place current operator rulings above inherited plans, summaries, and historical material."
    sources: [EXT-0041, EXT-1143]
    component: COMP-QMF-CORE
    tags: [law, authority]

  - id: DEC-0002
    title: "Historical source hierarchy"
    statement: "The GitBook supplies Book and BMS governance baselines, while recovery and older QMX material supplies evidence only for semantics that have not been changed by later rulings."
    status: ratified
    rationale: "The baseline is useful but incomplete; it does not override later corrections or recreate the old module graph."
    sources: [EXT-0042, EXT-0043, EXT-1144, EXT-1145, EXT-1147]
    component: COMP-QMF-CORE
    tags: [law, authority]

  - id: DEC-0003
    title: "Research never auto-adopts"
    statement: "Research and study deliverables are evidence for a later ruling; they do not become QMF contracts merely because a study was completed."
    status: ratified
    rationale: "Both sessions distinguish study delivery from operator adoption."
    sources: [EXT-0040, EXT-0203, EXT-1046]
    component: COMP-QMF-CORE
    tags: [law, governance]

  - id: DEC-0004
    title: "Documentation precedes implementation"
    statement: "QMF is documented and reviewed before trading-node implementation or code generation, and deep design proceeds one focused topic at a time."
    status: ratified
    rationale: "The operator requested a documentation handoff first and repeatedly rejected premature implementation."
    sources: [EXT-0078, EXT-0107, EXT-1112]
    component: COMP-QMF-CORE
    tags: [law, delivery]

  - id: DEC-0005
    title: "Project initialization stays with operator tooling"
    statement: "Documentation agents must not initialize or scaffold QMX; the operator's project skills own that step."
    status: ratified
    rationale: "The source explicitly reserves initialization and scaffolding for the user's tooling."
    sources: [EXT-0075, EXT-1142]
    component: COMP-QMF-CORE
    tags: [delivery]

  - id: DEC-0006
    title: "Human and agent readability"
    statement: "QMF code and documentation must be legible to both human developers and coding agents."
    status: ratified
    rationale: "The factory is intended to support both forms of maintainer."
    sources: [EXT-0076, EXT-1133]
    component: COMP-QMF-CORE
    tags: [law, maintainability]

  - id: DEC-0007
    title: "No shipped mock trading estate"
    statement: "QMF libraries ship without mock market data, fake bots, or default strategies; tests may use controlled fixtures but the product does not pretend those are live artifacts."
    status: ratified
    rationale: "The operator repeatedly rejected shipping fake data and bots as platform content."
    sources: [EXT-0090, EXT-0111, EXT-1104]
    component: COMP-QMF-CORE
    tags: [law, quality]

  - id: DEC-0008
    title: "QMF is a toolbox"
    statement: "QMF is a set of reusable libraries and small modules from which QMX applications are built; QMF is not itself an application."
    status: ratified
    rationale: "The operator corrected application-like framing and positioned QMF as foundation tooling."
    sources: [EXT-0013, EXT-0108]
    component: COMP-QMF-CORE
    tags: [law, scope, accepted-source]

  - id: DEC-0009
    title: "Application runtime stays outside the foundation"
    statement: "Application loops, orchestration flows, scheduled lifecycles, and product UI do not belong in the QMF foundation unless a later component contract explicitly admits them."
    status: ratified
    rationale: "The source separates reusable contracts from the applications that consume them."
    sources: [EXT-0108, EXT-0080]
    component: COMP-QMF-CORE
    tags: [law, boundary]

  - id: DEC-0010
    title: "Constrained-only authoring surface"
    statement: "All QMF strategy authoring must occur through a narrowly constrained agent surface."
    status: superseded
    rationale: "This was an earlier safety framing before the operator corrected QMF toward an open Python toolbox."
    sources: [EXT-1010]
    component: COMP-QMF-CORE
    tags: [historical]
    superseded_by: DEC-0011

  - id: DEC-0011
    title: "Open Python toolbox"
    statement: "QMF must not box in developers or agents: ordinary Python and suitable external libraries remain usable, while uniformity is enforced at live-money and agent-harness boundaries."
    status: ratified
    rationale: "The later correction preserves experimentation and extensibility while concentrating strictness where capital is exposed."
    sources: [EXT-0025, EXT-0026, EXT-0030, EXT-0045, EXT-0166]
    component: COMP-QMF-CORE
    tags: [law, extensibility, accepted-source]
    supersedes: [DEC-0010]

  - id: DEC-0012
    title: "Blanket ban on third-party code"
    statement: "QMF must implement every dependency internally and may not use external libraries."
    status: superseded
    rationale: "The later ruling narrowed the prohibition to contract transplantation and unsuitable strategy-family dependencies."
    sources: [EXT-1129]
    component: COMP-QMF-CORE
    tags: [historical]
    superseded_by: DEC-0013

  - id: DEC-0013
    title: "Build-own boundary"
    statement: "QMX-owned domain contracts and strategy semantics are implemented locally; suitable dependencies may be wrapped or used without transplanting a foreign platform contract, and separately installed compatible libraries remain permissible."
    status: ratified
    rationale: "The operator distinguished dependency reuse from copying another framework's architecture or strategy model."
    sources: [EXT-0052, EXT-0062, EXT-0109, EXT-1059]
    component: COMP-QMF-CORE
    tags: [law, dependency-policy]
    supersedes: [DEC-0012]

  - id: DEC-0014
    title: "Third-party strategy-family libraries"
    statement: "QMF may use third-party libraries that define or transplant strategy families."
    status: dead
    rationale: "Strategy semantics are an owned QMX domain boundary."
    sources: [EXT-0061, EXT-1050]
    component: COMP-QMF-CORE
    tags: [death, dependency-policy]
    reason: "The operator said no third-party strategy-family libraries; QMX will build its own."

  - id: DEC-0015
    title: "Futures and options support"
    statement: "QMF V1 or a later QMX edition will support futures and options."
    status: dead
    rationale: "The operator permanently excluded those asset classes rather than merely deferring them."
    sources: [EXT-0063, EXT-1058]
    component: COMP-QMF-CORE
    tags: [death, scope]
    reason: "The ruling was permanent: no futures and no options; stocks may come later."

  - id: DEC-0016
    title: "QML as the framework name"
    statement: "The overall reusable trading framework is named QML."
    status: superseded
    rationale: "The operator corrected QML into the Bot-specific future library and renamed the umbrella QMF."
    sources: [EXT-1025]
    component: COMP-QMF-CORE
    tags: [historical, naming]
    superseded_by: DEC-0017

  - id: DEC-0017
    title: "QMF umbrella and QML Bot domain"
    statement: "QMF is the framework umbrella; QML names the future Bot-oriented library rather than the whole foundation."
    status: ratified
    rationale: "This naming correction separates reusable framework primitives from Bot-specific machinery."
    sources: [EXT-0083, EXT-1026]
    component: COMP-QMF-CORE
    tags: [law, naming]
    supersedes: [DEC-0016]

  - id: DEC-0018
    title: "Minimal-core project scope"
    statement: "The complete project deliverable is a minimal core rather than a QMF V1 blueprint."
    status: superseded
    rationale: "Later QMX2 corrections enlarged and renamed the agreed deliverable while retaining a deliberately small qmf-core."
    sources: [EXT-1030, EXT-1031]
    component: COMP-QMF-CORE
    tags: [historical, scope]
    superseded_by: DEC-0019

  - id: DEC-0019
    title: "QMF V1 Blueprint"
    statement: "The current documentation target is the QMF V1 Blueprint; qmf-core is only its first small foundational component."
    status: ratified
    rationale: "The operator explicitly corrected the whole-agreement label and scope."
    sources: [EXT-0235, EXT-0237]
    component: COMP-QMF-CORE
    tags: [law, scope, accepted-source]
    supersedes: [DEC-0018]

  - id: DEC-0020
    title: "Minimal core as the whole-project label"
    statement: "The whole QMF V1 agreement is called the minimal core."
    status: dead
    rationale: "The operator retained small-core design but retired this phrase for the overall blueprint."
    sources: [EXT-0236]
    component: COMP-QMF-CORE
    tags: [death, naming]
    reason: "The phrase \"minimal core\" was explicitly retired for the whole agreement."

  - id: DEC-0021
    title: "Broad runtime kernel"
    statement: "QMF begins as a runtime kernel containing trading execution and orchestration machinery."
    status: superseded
    rationale: "The later boundary makes qmf-core a definitions-only library and moves runtime machinery to consumers or future modules."
    sources: [EXT-0047, EXT-1097]
    component: COMP-QMF-CORE
    tags: [historical, architecture]
    superseded_by: DEC-0022

  - id: DEC-0022
    title: "Definitions-only qmf-core"
    statement: "qmf-core is a framework-neutral definitions library with exact primitives, domain nouns, typed refusals, and fingerprints; it contains no broker, event loop, backtest, download, or node runtime."
    status: ratified
    rationale: "The accepted first brick is intentionally small and exposes stable language to every later consumer."
    sources: [EXT-0095, EXT-0112, EXT-0118, EXT-1131]
    component: COMP-QMF-CORE
    tags: [law, boundary, accepted-source]
    supersedes: [DEC-0021]

  - id: DEC-0023
    title: "Kernel terminology"
    statement: "The qmf-core foundation is described as the QMX kernel."
    status: dead
    rationale: "The term implied an application/runtime center that the operator did not want."
    sources: [EXT-0053]
    component: COMP-QMF-CORE
    tags: [death, vocabulary]
    reason: "The operator said the word \"kernel\" is retired."

  - id: DEC-0024
    title: "Final QMF V1 component roster"
    statement: "QMF V1 consists of five libraries—qmf-core, qmf-registry, qmf-data, qmf-indicators, and qmf-structure—and two small modules—venue and risk."
    status: ratified
    rationale: "This is the final simplified roster stated after the detailed studies and corrections."
    sources: [EXT-0244, EXT-0245, EXT-0246]
    component: COMP-QMF-CORE
    tags: [law, scope, accepted-source]

  - id: DEC-0025
    title: "qmf-core is the first brick"
    statement: "qmf-core is the first component to specify and build, but its six detailed freeze choices remain pending."
    status: ratified
    rationale: "Lock 1 was accepted as the first brick without silently ratifying the proposed choices inside it."
    sources: [EXT-0177]
    component: COMP-QMF-CORE
    tags: [source-accepted, sequencing]

  - id: DEC-0026
    title: "Exact money primitives"
    statement: "qmf-core represents money and quantity exactly and does not use binary floating-point values for monetary contracts."
    status: ratified
    rationale: "Exact money is part of the accepted definitions boundary; the precision and rounding policy remains a gap."
    sources: [EXT-0065, EXT-1131]
    component: COMP-QMF-CORE
    tags: [direction-agreed, contract]

  - id: DEC-0027
    title: "Exact time and trading dates"
    statement: "qmf-core distinguishes exact instants, trading days, and the two date concepts required by trading semantics."
    status: ratified
    rationale: "The sources require exact time vocabulary while leaving encoding and calendar details to ratification."
    sources: [EXT-0065, EXT-1131]
    component: COMP-QMF-CORE
    tags: [direction-agreed, contract]

  - id: DEC-0028
    title: "Core market nouns"
    statement: "qmf-core defines Instrument, Bar, Tick, Order, Fill, Position, and Account as asset-neutral domain nouns that can later support order flow, DOM, tape, and market structure."
    status: ratified
    rationale: "The vocabulary must support later Forex, equities, and crypto consumers without forcing a core rebuild."
    sources: [EXT-0126, EXT-1131, EXT-1132]
    component: COMP-QMF-CORE
    tags: [direction-agreed, contract]

  - id: DEC-0029
    title: "Typed refusals and deterministic fingerprints"
    statement: "qmf-core exposes typed refusal outcomes and canonical deterministic fingerprint primitives rather than ad-hoc exceptions or unstable identifiers."
    status: ratified
    rationale: "Downstream registration, evidence, and live gates require failures and identities that agents can reason about reproducibly."
    sources: [EXT-0065, EXT-0113, EXT-1131]
    component: COMP-QMF-CORE
    tags: [direction-agreed, contract]

  - id: DEC-0030
    title: "Versioning from birth"
    statement: "Public QMF contracts are versioned from their first release, and incompatible semantic changes mint new versions instead of mutating old meaning."
    status: ratified
    rationale: "The foundation is intended to remain stable while later Books, brokers, and asset classes evolve."
    sources: [EXT-0114, EXT-1134]
    component: COMP-QMF-CORE
    tags: [law, compatibility]

  - id: DEC-0031
    title: "Asset-neutral core"
    statement: "qmf-core must not assume Forex, cTrader, scalping, or a specific deployment environment; Forex is only the first seeded consumer."
    status: ratified
    rationale: "The operator wants equities and crypto to fit later without rebuilding the foundational language."
    sources: [EXT-0118, EXT-0192, EXT-0204]
    component: COMP-QMF-CORE
    tags: [law, extensibility]

  - id: DEC-0032
    title: "Six qmf-core freeze choices"
    statement: "The UTC clock encoding, instrument identity, canonical indicator arithmetic, backtest fidelity taxonomy, SR* threshold, and result-label tuple are not frozen contracts."
    status: superseded
    rationale: "The source explicitly calls all six proposals pending confirmation during documentation; the 2026-08-19/20 architecture sitting ratified three of the six."
    sources: [EXT-0097, EXT-0098, EXT-0099, EXT-0100, EXT-0101, EXT-0177]
    component: COMP-QMF-CORE
    tags: [historical, open-design]
    superseded_by: DEC-0124

  - id: DEC-0033
    title: "qmf-registry V1 boundary"
    statement: "qmf-registry owns identity, lineage, and registration preconditions, including look-ahead causality checks and attempt-count gates."
    status: ratified
    rationale: "The final roster folds these disciplines into registry, while their exact schemas remain for a dedicated contract pass."
    sources: [EXT-0247, EXT-0248]
    component: COMP-QMF-REGISTRY
    tags: [accepted-scope, direction-agreed]

  - id: DEC-0034
    title: "Universal registry recipe card"
    statement: "Every registered QMF object must implement one universal all-fields recipe-card schema."
    status: dead
    rationale: "The operator rejected a universal card as too abstract and too constraining for unlike domain objects."
    sources: [EXT-0157, EXT-0178]
    component: COMP-QMF-REGISTRY
    tags: [death, schema]
    reason: "The one-card-for-everything proposal was rejected as too abstract; only identity and lineage were accepted in principle."

  - id: DEC-0035
    title: "Graph-shaped lineage without a graph database"
    statement: "Registry lineage is graph-shaped and append-only, but its V1 persistence does not require a graph database."
    status: ratified
    rationale: "Identity and lineage were accepted in principle while database choice was deliberately kept simple."
    sources: [EXT-0158, EXT-0178, EXT-0200]
    component: COMP-QMF-REGISTRY
    tags: [accepted-in-principle, direction-agreed]

  - id: DEC-0036
    title: "Registry identity study model"
    statement: "The study-proposed fingerprint, charter, occurrence, kind-plus-id, and Bot revision model remains a candidate design rather than a frozen registry schema."
    status: superseded
    rationale: "The study was delivered but the transcript warns that study output does not auto-adopt; the 2026-08-20 sitting ratified the per-kind record and lineage design."
    sources: [EXT-0194, EXT-0195, EXT-0196, EXT-0203]
    component: COMP-QMF-REGISTRY
    tags: [historical, study-delivered]
    superseded_by: DEC-0114

  - id: DEC-0037
    title: "Graph database in QMF V1"
    statement: "qmf-registry V1 requires Neo4j or another graph database for lineage."
    status: dead
    rationale: "The operator expressly declined a graph database for V1."
    sources: [EXT-0228]
    component: COMP-QMF-REGISTRY
    tags: [death, persistence]
    reason: "When asked whether graphs were needed for V1, the operator answered: \"No, we don't.\""

  - id: DEC-0038
    title: "Content-addressed evidence with two timestamps"
    statement: "Stored result artifacts are content-addressed and preserve both event time and knowledge or ingestion time."
    status: ratified
    rationale: "Reproducible lineage and look-ahead checks need immutable identity plus the time evidence became knowable."
    sources: [EXT-0016, EXT-0017]
    component: COMP-QMF-REGISTRY
    tags: [direction-agreed, contract]

  - id: DEC-0039
    title: "Bot and Book lineage"
    statement: "Bots and Books accumulate lineage across first-class variants and revisions instead of being overwritten in place."
    status: ratified
    rationale: "Career identity and variant lineage are necessary for promotion, audit, and later comparisons."
    sources: [EXT-0131, EXT-1135]
    component: COMP-QMF-REGISTRY
    tags: [direction-agreed, lineage]

  - id: DEC-0040
    title: "Bot-to-confluence cardinality"
    statement: "The number of confluences contained by one Bot is unresolved."
    status: superseded
    rationale: "The conflict was resolved by the operator's GAP-0018 ruling (2026-08-20): one-or-more confluences, generalized to multiplicity at every layer."
    sources: [EXT-0161, EXT-1126]
    component: COMP-QMF-REGISTRY
    tags: [historical, contract]
    conflict:
      - "A Bot is built around one confluence plus a not-yet-designed Book binding."
      - "A Bot may contain multiple confluences."
    superseded_by: DEC-0115

  - id: DEC-0041
    title: "Human-controlled promotion"
    statement: "Only a human may promote a Bot or other registered artifact into the live zone; opaque ordinary-Python implementations may still be promoted after review."
    status: ratified
    rationale: "This preserves an open research surface without allowing automated live-money promotion."
    sources: [EXT-0166, EXT-0167]
    component: COMP-QMF-REGISTRY
    tags: [law, live-money-gate]

  - id: DEC-0042
    title: "qmf-data V1 boundary"
    statement: "qmf-data separates ingestion evidence, processed data, processing mechanisms, research access, journaling, and backup as distinct concerns."
    status: ratified
    rationale: "The component is in the final roster and the separation is directionally agreed, but the detailed six-layer schema is still study-derived."
    sources: [EXT-0152, EXT-0249]
    component: COMP-QMF-DATA
    tags: [accepted-scope, direction-agreed]

  - id: DEC-0043
    title: "Six-layer qmf-data study"
    statement: "The proposed six qmf-data layers are not yet a ratified storage or API contract."
    status: superseded
    rationale: "The dedicated ratification happened at the 2026-08-20 sitting, which adopted seven room-roles per world."
    sources: [EXT-0198, EXT-0203, EXT-0205, EXT-0249]
    component: COMP-QMF-DATA
    tags: [historical, study-delivered]
    superseded_by: DEC-0117

  - id: DEC-0044
    title: "Historical data retention and sealed holdout"
    statement: "QMX retains the full obtainable history for each currency and source and seals the newest approximately twelve months as a final one-time evaluation holdout."
    status: ratified
    rationale: "The later data ruling keeps historical evidence while protecting one untouched recent period from repeated research use."
    sources: [EXT-0219, EXT-0220, EXT-0233]
    component: COMP-QMF-DATA
    tags: [direction-agreed, evidence]

  - id: DEC-0045
    title: "Full raw evidence and off-machine backup"
    statement: "qmf-data retains complete raw evidence locally and maintains a bucket or equivalent off-machine backup with platform-level backup support."
    status: ratified
    rationale: "The operator rejected relying only on reduced buckets and required durable recovery beyond one machine."
    sources: [EXT-0215, EXT-0233, EXT-1074]
    component: COMP-QMF-DATA
    tags: [law, durability]

  - id: DEC-0046
    title: "Research splits by default"
    statement: "qmf-data presents research datasets through explicit train, validation, and untouched-test splits by default."
    status: ratified
    rationale: "The source treats split discipline as a guard against agent-driven overfitting."
    sources: [EXT-0122]
    component: COMP-QMF-DATA
    tags: [law, research-integrity]

  - id: DEC-0047
    title: "Proposed local data stack"
    statement: "Parquet, DuckDB, SQLite, and append-only JSONL are candidate V1 persistence choices, not adopted engine contracts."
    status: superseded
    rationale: "The 2026-08-20 sitting ratified this stack behind QMF-owned contracts with swappable engines."
    sources: [EXT-0199, EXT-0200, EXT-0203, EXT-0217]
    component: COMP-QMF-DATA
    tags: [historical, study-delivered, persistence]
    superseded_by: DEC-0117

  - id: DEC-0048
    title: "Cross-domain journal and observability"
    statement: "The data foundation must support durable journal and observability records for Bot, Book, BMS, MIS, SQS, and kill-switch behavior."
    status: ratified
    rationale: "The listed trading domains need audit evidence, although event shapes, cadence, and retention are still open."
    sources: [EXT-0154, EXT-0155]
    component: COMP-QMF-DATA
    tags: [direction-agreed, observability]

  - id: DEC-0049
    title: "Automatic detector action"
    statement: "Automatic detectors may act, but only through the existing entry-blocking control vocabulary, scoped to the narrowest affected subject — instrument, currency cohort, Book, venue/broker, or system-wide — never wider (an event affecting USD never pauses JPY pairs; an event affecting gold never pauses EUR), and never through any act on positions or exits (the L39 exit-preservation invariant holds). The response posture is operator-configurable and UI-editable per L38: inform when the operator is reachable, pause when not. Detector-raised pauses clear under the existing control rank/authority rules; these are rare, black-swan-class events."
    status: ratified
    rationale: "Operator direct ruling 2026-08-21 (PRD session, DevOps-lens framing): inform if available, pause if not, configurable via the settings panel; zoom into who is affected and pause only that scope."
    sources: [EXT-0202, EXT-0203, EXT-2093]
    component: COMP-QMF-DATA
    tags: [operator-direct, safety, cross-cutting]

  - id: DEC-0050
    title: "Calendar and live-feed capture excluded from foundation work"
    statement: "The current foundation must not implement calendar capture or live-price recording."
    status: superseded
    rationale: "This earlier boundary was later replaced by an urgent forward-recording decision and a standalone calendar recorder seam."
    sources: [EXT-1119]
    component: COMP-QMF-DATA
    tags: [historical, acquisition]
    superseded_by: DEC-0051

  - id: DEC-0051
    title: "Acquisition plumbing and first-install bulk history"
    statement: "QMF V1 provides ingest plumbing and supports a bulk historical load during first installation, while scheduled acquisition lifecycle remains outside the reusable library."
    status: ratified
    rationale: "The later source requires evidence capture now but preserves the toolbox-versus-application boundary."
    sources: [EXT-0079, EXT-0080, EXT-1155]
    component: COMP-QMF-DATA
    tags: [direction-agreed, acquisition]
    supersedes: [DEC-0050]

  - id: DEC-0052
    title: "Standalone economic-calendar recorder"
    statement: "Forward economic-calendar recording is performed by a standalone application that consumes QMF data contracts rather than by a QMF runtime module."
    status: ratified
    rationale: "Calendar history is otherwise lost, but scheduling and operation are application responsibilities."
    sources: [EXT-0018, EXT-0031, EXT-0080]
    component: COMP-QMF-DATA
    tags: [boundary, acquisition]

  - id: DEC-0053
    title: "Tick acquisition sequence"
    statement: "Historical tick backfill uses Dukascopy-class evidence first, and forward broker tick capture waits for the broker API application and connection."
    status: ratified
    rationale: "This sequence captures available history without pretending the unapproved broker feed already exists."
    sources: [EXT-0019, EXT-0081, EXT-0216]
    component: COMP-QMF-DATA
    tags: [direction-agreed, acquisition]

  - id: DEC-0054
    title: "Synthetic data role"
    statement: "Synthetic market data may stress infrastructure and failure handling, but it may not validate trading edge or replace real evidence."
    status: ratified
    rationale: "The operator allows synthetic conditions only as a robustness tool."
    sources: [EXT-0093, EXT-1075]
    component: COMP-QMF-DATA
    tags: [law, research-integrity]

  - id: DEC-0055
    title: "qmf-indicators wrapper boundary"
    statement: "qmf-indicators wraps TA-Lib-class arithmetic through QMF-owned interfaces instead of reimplementing established indicator formulas."
    status: ratified
    rationale: "The final roster explicitly chooses wrapping for light indicator arithmetic."
    sources: [EXT-0250]
    component: COMP-QMF-INDICATORS
    tags: [direction-agreed, accepted-scope]

  - id: DEC-0056
    title: "Light and heavy indicator split"
    statement: "Light deterministic indicators may run with Bots, while heavy analytical indicators belong to MIS or research consumers outside qmf-indicators runtime responsibility."
    status: superseded
    superseded_by: DEC-0128
    rationale: "The sessions consistently separate trading-path arithmetic from heavier analytical work."
    sources: [EXT-0123, EXT-0124, EXT-0180, EXT-0181]
    component: COMP-QMF-INDICATORS
    tags: [direction-agreed, boundary]

  - id: DEC-0057
    title: "Custom indicator discovery"
    statement: "Genetic or other custom-indicator discovery belongs to a future research lab and is not a QMF V1 indicator-library responsibility."
    status: out-of-scope
    rationale: "The source assigns custom discovery to research rather than the stable library."
    sources: [EXT-0125]
    component: COMP-QMF-INDICATORS
    tags: [future, research]

  - id: DEC-0058
    title: "qmf-structure boundary"
    statement: "qmf-structure owns QMX-defined causal levels, zones, and market-structure components rather than generic indicator arithmetic."
    status: ratified
    rationale: "The final roster assigns proprietary causal structure to its own library."
    sources: [EXT-0251]
    component: COMP-QMF-STRUCTURE
    tags: [direction-agreed, accepted-scope]

  - id: DEC-0059
    title: "Venue module boundary"
    statement: "COMP-QMF-VENUE is a small broker and venue integration module whose first implementation targets the cTrader Open API in Python."
    status: ratified
    rationale: "The final roster treats broker connection as a small module, not as a broad trader library."
    sources: [EXT-0141, EXT-0241, EXT-0252]
    component: COMP-QMF-VENUE
    tags: [accepted-scope, direction-agreed]

  - id: DEC-0060
    title: "No MQL implementation"
    statement: "The first venue integration uses the cTrader Open API from Python and does not use MQL."
    status: ratified
    rationale: "The operator chose the Python cTrader path explicitly."
    sources: [EXT-0141]
    component: COMP-QMF-VENUE
    tags: [law, integration]

  - id: DEC-0061
