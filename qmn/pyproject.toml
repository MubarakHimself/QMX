[project]
name = "qmn"
version = "0.1.0"
description = "QMX trading node (code name qmn). Application-layer composition root; never a roster package and never a CLI."
requires-python = ">=3.14,<3.15"
# SemVer is display-only provenance (DEC-0186) — composition_fp is identity.
# Story 24.1 lands the venue boundary (qmf-core + sanctioned qmf-venue at
# qmn.venue). Story 24.4 adds qmb so the live loop drives run_slice unforked.
dependencies = [
    "qmf-core",
    "qmf-registry",
    "qmf-venue",
    "qmb",
    "prometheus-client==0.26.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Top-level import qmn — not a qmf.* PEP 420 namespace submodule.
module-name = "qmn"

[tool.uv.sources]
qmf-core = { workspace = true }
qmf-registry = { workspace = true }
qmf-venue = { workspace = true }
qmb = { workspace = true }
