  - id: EXT-2153
    type: decision
    summary: "PRD SECTION 6 MINED NODE DOCTRINE (all [MINED], 'to ratify at node planning'). Startup and recovery ordering: a deterministic cold-start preflight gate before any state mutation (host, disk, network and pinned-version checks, fail-closed with a typed failure id), then a fixed per-Book order - connect, reconnect gap recovery (fetch deals and positions since the last-seen execution event, commit recovered fills before reporting healthy), missed rollover catch-up (boundary equity reconstructed from journals, sweep journaled as a correction-style append), protection-state projection (breakers, budgets, exposure rebuilt from journals), readiness gates, then the sequencer accepts intents; the invariant is that a crash never resets safety counters because there are no safety counters, only journal projections. Drift is reconciled-explained never raw equality: divergence decomposes into journaled components (swept-but-unwithdrawn cash, re-seed remnants, open unrealized P&L) and only the residual is drift; verdicts reconciled | drift | unknown; unexplained live drift halts trading and a restart is not permission to resume - a fresh reconciliation review is; the paper and demo binding is excluded from the live drift check. Rate limits are a design input: one connection pool per account binding, per-account command affinity, token-bucket limiting, caps per connection at protocol level so synchronized bursts need sharding or a shared bucket - also the future multi-account load-balancer seam. Fail-closed stand-down is an alive state: past a crash-loop threshold the process boots into stand-down, sequencers refuse-and-journal, adapter connections quiesce and drain, the operator-powers surface keeps serving so resurrection stays reachable; a protection transition counts as enforced only after the account's connections have quiesced and drained. Shadow lane shape: candidate labeler and model versions run as near-real-time replay over the captured canonical feed, off the hot path, to their own manifest prefix, never to live consumers, evaluated over one full affected-Book cycle; promotion is ratification, version bump, re-certification; a recovered or pre-trained model carries no authority without fresh ratification; training is an offline job that may seed its RNG provided the seed is recorded, and the no-ambient-randomness invariant binds the live runtime. The always-on evidence tier: a placement and authority boundary for archive, captured feed, heavy analytics and the shadow lane - explicitly not a database server and not a second writer; the hot path never blocks on it; sync is one-way, watermarked, idempotent, resumable, under verify-before-purge; recovery re-requests carry watermarks only; the only reverse crossing is the click-gated promotion pull."
    cite: "_bmad-output/planning-artifacts/prds/prd-QMX-2026-08-21/prd.md:394-441"
    topics: [prd, node-doctrine, startup, drift, rate-limits, stand-down, shadow-lane, evidence-tier]
    authority: rider

  - id: EXT-2154
    type: decision
    summary: "PRD SECTION 6 MINED CONSOLE SPINE (to ratify at terminal planning) - the half the node must satisfy now because the doors are built now. UI-only, never a second system of record: business authority, persistence and command validation stay server-side. Exactly two channels: an evidence read channel and a powers action channel, with evidence review and command execution visibly distinct steps. Anti-goals carried verbatim: no direct manual-trading surface; no generic LIVE/PAPER toggle; no single global health indicator hiding independent failure domains; no stale evidence authorizing an action; no editable setting without registry-backed configurability; no optimistic command success without server validation and evidence. State independence and read provenance: safety, execution readiness, connection, reconciliation, data freshness, lifecycle and sync are INDEPENDENT states that never collapse into one health color; requested protection state displays separately from enforcement completion; every important read reveals authority source (live-authoritative versus replicated evidence), source time, receive time and watermark. The read data-plane: a family of publish-never-act read models, each budgeted, authority-free, returning refusals as evidence. Settings are evidence-scoped, not a boolean: three scopes render distinctly - system settings (secrets and bindings, console-managed, never registry numerics), component settings (registry), instance values; a non-configurable value renders read-only; a null renders unresolved, never as an editable default; measured or provisional values never masquerade as settings; a provisional value requires an explicit operator countersign before live; a value fixed within an active cycle (the kill line) is not editable mid-cycle. The PRD names the gap in its own words: 'docs/registry/variables.yaml carries configurable but no value-status field - the terminal cannot decide editability from data until it does'."
    cite: "_bmad-output/planning-artifacts/prds/prd-QMX-2026-08-21/prd.md:448-490"
    topics: [prd, console-spine, doors, state-independence, provenance, settings, value-status]
    authority: rider

  - id: EXT-2155
    type: decision
    summary: "PRD SECTION 3 UNATTENDED DOCTRINE AND THE NOTIFICATION ALLOW-LIST: no intraday human judgment; notifications must never create intraday decision loops; only a human-signed promotion occurrence crosses into live money (SCN-0007, ADR-0015, L17). The constraint made concrete [MINED]: notifications fire only on a CLOSED, RATIFIED event-class allow-list - sweep, re-seed, refund, kill-switch and KSA events, and supervision fail-closed; everything else is console evidence, never a push. Two-plane rule: authoritative system records (journals, veto ledger, lineage) and operator notification delivery are separate layers with separate policies - losing a notification never erases the underlying evidence, and the notification channel is never a permission path back into live trading. Delivery mechanics (channels, retries, dedupe, quiet hours, credentials) stay deferred to the node and terminal phases. Forward-compatibility hook (operator-confirmed 2026-08-21): one primary operator today but other people may use the platform later, so action attribution stays named and no surface hard-bakes an anonymous single-user assumption."
    cite: "_bmad-output/planning-artifacts/prds/prd-QMX-2026-08-21/prd.md:115-132"
    topics: [prd, notification-allow-list, unattended-doctrine, two-plane-rule]
    authority: rider

  - id: EXT-2156
    type: decision
    summary: "PRD SECTION 10 OPEN ITEMS, ROWS 12-15 (each carrying its own owner column). ROW 12 [MINED] Node-phase position-safety cluster, owner 'Node planning' - four questions neither the old build nor the corpus closed: (a) the exit-disposition taxonomy, whether a breakeven exit or forced flat counts toward sizing (the bench half is already ruled); (b) position fate at money boundaries - how unrealized P&L enters a sweep (boundaries leave positions alone; the accounting is unstated); (c) dynamic protective-order grammar - Book grammar, BMS as config authority; (d) an amendment idempotency threshold (UI-editable) suppressing tick-storm duplicate amends. ROW 13 [MINED] Atomic decision-plus-evidence commit versus the store seam, owner 'Architecture' - the old build required a decision state change and its journal append to commit atomically; the corpus has WriterId ownership and gapless streams but no dual-write atomicity rule, and the store seam spans storage backends without transactions (Parquet/JSONL); is atomic dual-write a journal-path requirement, and does it constrain the seam? Corpus wins pending a ruling. ROW 14 [MINED] News-provider selection evidence for DEC-0119, owner 'Operator ruling at node/ops' - old-build evaluation recorded as input, not a choice: Forex Factory free weekly JSON as primary (rate-limited roughly 2 downloads per 5 min), FMP / Trading Economics / FXStreet as impact-carrying fallbacks, EODHD disqualified (no impact field), scraping rejected. ROW 15 [MINED] Deep-history acquisition evidence, owner 'Input to FR-042 epics' - TrueFX (16 majors, tick since 2009) and HistData (M1 plus tick) as evaluated Dukascopy companions; Databento carries no spot FX; venue-only backfill is rate-capped into unviability, so the recent window needs a platform-continuity bridge, not broker backfill."
    cite: "_bmad-output/planning-artifacts/prds/prd-QMX-2026-08-21/prd.md:673-676"
    topics: [prd, open-items, position-safety, atomicity, news-provider, deep-history]
    authority: rider

  - id: EXT-2157
    type: decision
    summary: "TICKET 006 / QB11 DISPOSITION (adjudicated corpus verdict). VERDICT PARTIAL: the POLICY is fully ratified, the FACT is second-hand and stays that way until the node measures it. Policy - never hardcoded, measured per broker: registry venue_trendbar_price_basis carries no value and is annotated measured-per-broker (variables.yaml:383), and the corpus already demoted the claim ('demoted to 2013-forum-grade and NEVER hardcoded - adapter measures per broker at first connection plus continuous monitor', gaps.yaml GAP-0037 answered; docs/components/ctrader.md:72-73). The first-deploy check is already a named part of the adapter contract with its refusal stated: 'Bar-basis reconciliation | Reconcile trendbar OHLC against explicitly-BID/ASK tick history per broker and symbol class; record the verified quote side (DEC-0135). | A failed bar-basis reconciliation refuses bar evidence.' (runbook.md:65-71, first-connection verification suite). The web finding graded honestly: ticket 006 asked the question (tracker/tickets/006-spotware-broker-setup.md:11-16); the web-verification seat found NO official documentation page stating the basis, only a Spotware moderator on the official community forum - 'It is not possible to get trendbars based on ask prices' - with the thread confirming the prices are bid-based; GRADE SECONDARY (vendor moderator, not a docs page), consistent with cTrader charts being bid-based by default, and it changes nothing because the corpus already refuses to hardcode it; adjudicator A's cross-cut item 13 adds 'do not upgrade the forum finding into a pin'. What the backtest-to-live comparison must assume meanwhile: NOTHING - until the reconciliation passes, venue-native bars are ungoverned observations never assumed aligned and bar evidence is refused; backtests run on Dukascopy tick data carrying both sides, so the honest interim posture is to build every backtest-to-live comparison on TICKS, not trendbars, and to treat any trendbar-derived series as provisional until the per-broker basis is recorded with its evidence."
    cite: SRC-11:inputs/corpus-verdicts-B.md#QB11
    topics: [trading-node, ticket-006, trendbar, venue-facts, dec-0135, a15]
    authority: rider

  - id: EXT-2158
    type: decision
    summary: "SPINE FRONT MATTER AND PROVENANCE (status final, created and updated 2026-08-28). Paradigm: 'Supervised composition-root runtime over a pure rulebook: one systemd-supervised process is the only impure shell, composing the pure QMF/QMB/QML parts at boot and driving the ratified event-slice loop once per command stream behind thin doors.' Binds: Phase-2 trading node, PRD section 6 Phase-2 doctrine, NFR-10, NFR-11, CT-18..CT-32 live wiring, the KSA-matrix-shape gap, DEC-0049, DEC-0142. Parent: architecture-QMX-2026-08-19 (AD-1..41); siblings QMB B-1..15 and QML QL-1..10. PROVENANCE: autonomous one-shot sitting 2026-08-28 by operator delegation; FINAL after two reviewer gates (a six-lens gate plus fix pass 1; the operator round; a five-lens validation re-gate plus residual pass 2) and a final certification seat whose four highs and ten lows were closed at desk; ground truth = the parts-bin inventory of integration@ef9bb25; EVERY without-operator call is tagged A1-A47 and individually overturnable; the operator round of 2026-08-28 produced four rulings applied at desk (no node command line, the soak IS the warm-up week, promotion is a click over a silent battery, Forex Factory free file as the sole news source) with A1 narrowed, A10/A17/A26 RULED and A39 added; the validation re-gate applied 107 findings at desk under the 34 GATE-2 rulings, adding A40-A47. DEPENDENCY DIRECTION: qmn depends on the QMF roster, on qmb, on qml and on registered extensions; NOTHING IMPORTS QMN - it is the top of the graph; qmb never imports qmf-venue and keeps its ban."
    cite: SRC-11:ARCHITECTURE-SPINE.md#front-matter
    topics: [trading-node, spine, provenance, paradigm, dependency-direction]
