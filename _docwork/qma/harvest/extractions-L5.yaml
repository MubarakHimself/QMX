  # ── Deferred — 22 rows (GAP-0070..GAP-0091) ───────────────────────────────
  - id: EXT-2421
    type: open
    summary: "DEFERRED (GAP-0070): Windows VPS for the computer-use agent — planned, not provisioned (AD-25). Until an ExecutionEnvironment of kind desktop is registered against a reachable host, every computer-use tool fails its check_fn and the Compute Router returns NoEnvironment for a desktop ComputeRequirement. The VPS is the operator's own planned purchase; AD-25 registers it only once provisioned, never in v1 (memlog L206)."
    quote: "an ExecutionEnvironment of kind desktop is registered against a reachable host; until that record exists every computer-use tool fails its check_fn and the Compute Router returns NoEnvironment for a desktop ComputeRequirement"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#deferred (row: Windows VPS for the computer-use agent); SRC-13:.memlog.md:L206"
    topics: [deferred, windows-vps, computer-use, desktop-environment, ad-25]
    authority: rider
  - id: EXT-2422
    type: open
    summary: "DEFERRED (GAP-0071): one lead flag per desk, and the lead Quant's mailbox as the catch-all for mailbox Envelopes whose recipient no longer exists — both inferred from the ledger ruling, never ruled by the operator. Until he rules on both, a second lead flag on a desk is a hard startup error and an undeliverable Envelope resolves to dead_letter (AD-20) rather than to the lead. AD-7's own sentence states this interim rule; the memlog narrowed the AD-7 tag to ratify only that a desk-level lead Quant exists and keeps a ledger (memlog L183)."
    quote: "the operator rules on both; until then a second lead flag on a desk is a hard startup error and an undeliverable Envelope resolves to dead_letter (AD-20) rather than to the lead"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#deferred (row: One lead flag per desk, and the lead Quant's mailbox as the catch-all); SRC-13:.memlog.md:L183"
    topics: [deferred, lead-flag, mailbox, catch-all, dead-letter, ad-7, ad-20]
    authority: rider
  - id: EXT-2423
    type: open
    summary: "DEFERRED (GAP-0072 + GAP-0073): the two provider-backend deferrals. (GAP-0072) External memory backend (Hindsight, Mem0): revisit when the AD-22 staging store holds memory candidates from at least two desks AND at least one Mission has been blocked by recall being unavailable — both readable from the journal — then re-check the store dependency (Postgres+pgvector or Oracle 23ai); the port-to-Hindsight 1:1 mapping in research/memory-providers.md was verified against 0.4.9 and the current release is v0.9.2, so re-verify the mapping at admission. (GAP-0073) Knowledge indexing (hybrid retrieval over the corpus): revisit when the corpus root holds at least one ingestible content file AND STRATS §6 Q1-Q12 (folder layout, serialization, stable-id scheme) are ratified upstream. v1 ships the MemoryProvider and KnowledgeSource ports only (AD-18, AD-19)."
    quote: "the AD-22 staging store holds memory candidates from at least two desks and at least one Mission has been blocked by recall being unavailable"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#deferred (rows: External memory backend; Knowledge indexing)"
    topics: [deferred, memory-backend, hindsight, mem0, knowledge-indexing, hybrid-retrieval, ad-18, ad-19]
    authority: rider
  - id: EXT-2424
    type: open
    summary: "DEFERRED (GAP-0074): self-improvement evaluation gates. Revisit when the telemetry store holds complete agent trajectories for at least the AD-26-registered count of finished Missions (initially 50) across at least two desks. v1 ships the AD-22 invariants plus the staging store only; the evaluation gates switch on when this condition is met."
    quote: "the telemetry store holds complete agent trajectories for at least the AD-26-registered count of finished Missions (initially 50) across at least two desks; v1 ships invariants plus staging only"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#deferred (row: Self-improvement evaluation gates)"
    topics: [deferred, self-improvement, evaluation-gates, trajectories, ad-22, ad-26]
    authority: rider
  - id: EXT-2425
    type: open
    summary: "DEFERRED (GAP-0075): sandbox and compute vendors — remote_container, and desktop beyond the operator's planned Windows VPS (which AD-25 registers only once provisioned, never in v1). Revisit when the Compute Router has recorded at least the AD-26-registered count (initially 3) of NoEnvironment refusals for ComputeRequirements no local Docker environment can satisfy, or a job has exceeded the workstation's memory or GPU capability — counted from telemetry, never judged. The operator rejected Modal, Daytona and E2B outright on cost and fit and said he would 'first look for what I want' (T-3976), so a shortlist starting from those three is not the starting point; the sandbox exists for backtesting fan-out first (T-3976). The row was rescoped so it no longer defers a provider the spine already ships (memlog L123)."
    quote: "the Compute Router has recorded at least the AD-26-registered count (initially 3) of NoEnvironment refusals for ComputeRequirements no local Docker environment can satisfy, or a job has exceeded the workstation's memory or GPU capability"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#deferred (row: Sandbox and compute vendors); SRC-13:.memlog.md:L123"
    topics: [deferred, sandbox, compute-vendors, remote-container, modal-daytona-e2b-rejected, t-3976]
    authority: rider
  - id: EXT-2426
