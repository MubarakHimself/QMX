[project]
name = "qmf-indicators"
version = "0.1.0"
description = "The two-mode CT-16 indicator protocol and wrappers around the pinned canonical arithmetic reference."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# The canonical arithmetic reference (registry:canonical_indicator_reference;
# DEC-0127, AD-23): TA-Lib C library 0.7.1 + Python wrapper 0.7.1, pinned as the
# lockfile-resolved artifact (distribution filename + hash recorded in uv.lock) of
# both the C library (bundled in the wheel) and the Python wrapper. The pin change
# is an arithmetic upgrade — it mints per-configured-indicator contract format
# versions with recorded before/after evidence, exactly like a version upgrade — so
# do not move this pin without the upgrade gate. `qmf-core` is the ONLY roster
# import edge (default-deny, L30); `ta-lib` is a third-party runtime dependency, on
# the same footing as qmf-data's pyarrow/duckdb and qmf-venue's protobuf.
dependencies = [
    "qmf-core",
    "ta-lib==0.7.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace submodule. Dot notation tells uv_build the module lives at
# src/qmf/indicators/ with NO src/qmf/__init__.py anywhere in the distribution.
module-name = "qmf.indicators"

[tool.uv.sources]
qmf-core = { workspace = true }
