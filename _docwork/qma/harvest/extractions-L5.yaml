extractions:
  # ── Framing: the two registers of doubt and out-of-scope (D21) ────────────
  - id: EXT-2400
    type: constraint
    summary: "The Deferred table (22 rows) and the Cut-outright table (20 rows) are the two exhaustive registers of doubt and out-of-scope for the QMA v1 spine under D21. Spine law: anything on neither table, and not in D1..D23, is out of scope for v1. An AD carries rules only; doubt, unmeasured facts and unstudied implementation choices live in Deferred, each with a testable revisit condition. The Cut table is spine law — no Cut row is revived except by an explicit spine amendment, and the two tables are exclusive (a Deferred row may not specify what a Cut row bars). Every memlog 'NO NEW DEFERRED ROWS THIS ROUND' entry (L224, L246, L260) confirms findings were fixed in place rather than deferred; the rows that stand were each added or amended deliberately."
    quote: "Spine law per D21: anything on neither this table nor the Deferred table, and not in D1..D23, is out of scope for v1."
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright; SRC-13:ARCHITECTURE-SPINE.md#deferred"
    topics: [cut, deferred, d21, scope-law, spine-law]
    authority: rider

  # ── Cut outright — 20 rows (DEC-0360..DEC-0379) ───────────────────────────
  - id: EXT-2401
    type: death
    summary: "CUT (DEC-0360): a QMX agent protocol plus adapters hosting foreign agent runtimes (a QMA-defined wire protocol other harnesses speak, and in-worker shims hosting the Claude Agent SDK, OpenAI or LangGraph loops). QMA owns its runtime bottom-up. This is why the Deferred Claude-Agent-SDK hook-count row (GAP-0087) revisits only if a spine amendment reverses this Cut, and why the model-proxy foreign-harness shim (DEC-0370) is also dead."
    quote: "QMA owns its runtime bottom-up; nothing needs it to host foreign harnesses"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: A QMX agent protocol plus adapters hosting foreign agent runtimes)"
    topics: [cut, dead, foreign-runtimes, agent-protocol, adapters]
    authority: rider
  - id: EXT-2402
    type: death
    summary: "CUT (DEC-0361): extension trust tiers, a marketplace or plugin store, and install counts. QMA is a single-operator system with no third-party publishers, so there is no untrusted-extension problem for a trust-tier or store to solve."
    quote: "one operator, no third-party publishers, no untrusted-extension problem"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: Extension trust tiers, marketplace or plugin store, install counts)"
    topics: [cut, dead, plugins, marketplace, trust-tiers]
    authority: rider
  - id: EXT-2403
    type: death
    summary: "CUT (DEC-0362): a provides/requires/optional capability dependency solver for the plugin set. A package-manager-style solver is unwarranted for a plugin set numbering in single digits (the five fixed desk plugins)."
    quote: "a package-manager solver for a plugin set numbering in single digits"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: A provides/requires/optional capability dependency solver)"
    topics: [cut, dead, plugins, capability-solver]
    authority: rider
  - id: EXT-2404
    type: death
    summary: "CUT (DEC-0363): the 20-service injectable context fabric (a large enumerated dependency-injection surface of context services). Architecture by enumeration; most entries have no described consumer, so QMA does not build it."
    quote: "architecture by enumeration; most entries have no described consumer"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: The 20-service injectable context fabric)"
    topics: [cut, dead, context-fabric, injection]
    authority: rider
  - id: EXT-2405
    type: death
    summary: "CUT (DEC-0364): the eight-type memory taxonomy (semantic/episodic/procedural/etc. typed memory classes). It was never load-bearing; QMA supersedes it with one narrow memory definition plus provenance-gated candidates behind the MemoryProvider port (AD-18)."
    quote: "never load-bearing; superseded by one narrow definition plus provenance-gated candidates"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: The eight-type memory taxonomy)"
    topics: [cut, dead, memory, taxonomy]
    authority: rider
  - id: EXT-2406
    type: death
    summary: "CUT (DEC-0365): the general-IDE lifecycle events (display, elicitation, config, cwd, directories). This is multi-surface public-IDE plumbing; QMA fires only the hook events its authored graphs need (AD-10), not a general editor event bus."
    quote: "multi-surface public-IDE plumbing; QMA fires only what its authored graphs need"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: The general-IDE lifecycle events (display, elicitation, config, cwd, directories))"
    topics: [cut, dead, ide-lifecycle, hooks]
    authority: rider
  - id: EXT-2407
    type: death
    summary: "CUT (DEC-0366): hot-module reload and reactive re-mount of live plugins. A developer nicety that runs against QMA's determinism requirement; QMA uses explicit reload instead (AD-21 reversible scopes)."
    quote: "a dev nicety against a determinism requirement; explicit reload instead"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: Hot-module reload and reactive re-mount of live plugins)"
    topics: [cut, dead, plugins, hot-reload, determinism]
    authority: rider
  - id: EXT-2408
    type: death
    summary: "CUT (DEC-0367): isolate/intercept and label-joined config scopes (multi-tenant overlay configuration machinery). QMA has one operator and one config, so the overlay machinery has nothing to isolate."
    quote: "multi-tenant overlay machinery; one operator, one config"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: Isolate/intercept and label-joined config scopes)"
    topics: [cut, dead, config-scopes, multi-tenant]
    authority: rider
  - id: EXT-2409
    type: death
    summary: "CUT (DEC-0368): relay, signing and public-messaging protocols as the Agent Bus transport. That is sovereign multi-tenant messaging for strangers; a single-operator daemon's bus (AD-20) needs none of it."
    quote: "sovereign multi-tenant messaging for strangers; a single-operator daemon needs none"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: Relay, signing and public-messaging protocols as the bus transport)"
    topics: [cut, dead, agent-bus, transport, messaging]
    authority: rider
  - id: EXT-2410
    type: death
    summary: "CUT (DEC-0369): a shared account-level cloud computer with per-actor screens. It is not a security boundary; Docker-per-worker (AD-17 ExecutionEnvironment) replaces it as the isolation mechanism."
    quote: "not a security boundary; Docker-per-worker replaces it"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: A shared account-level cloud computer with per-actor screens)"
    topics: [cut, dead, cloud-computer, per-actor-screens, docker]
    authority: rider
  - id: EXT-2411
    type: death
    summary: "CUT (DEC-0370): a foreign-harness shim in the model proxy (masquerading, model-identity spoofing so a call appears to originate from a different harness). QMA owns its caller and records the true Deployment honestly (AD-15); it never spoofs a model identity."
    quote: "QMA owns its caller and records the true deployment honestly"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: A foreign-harness shim in the model proxy (masquerading, model-identity spoofing))"
    topics: [cut, dead, model-proxy, masquerading, foreign-harness]
    authority: rider
  - id: EXT-2412
    type: death
    summary: "CUT (DEC-0371): plaintext credential files in a home directory as a source for any QMA-resolved secret. L34 binds — QMA handles references only, with values kept in the OS store through the Credential Broker (AD-24). A local-proxy Deployment's own provider credentials stay that proxy's custody outside QMA's namespace and are never read, copied, migrated or referenced by QMA."
    quote: "L34: QMA handles references only, values in the OS store through the Credential Broker; a local-proxy Deployment's own provider credentials remain that proxy's custody outside QMA's namespace, never read, copied, migrated or referenced by QMA (AD-15, AD-24)"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: Plaintext credential files in a home directory as a source for any QMA-resolved secret)"
    topics: [cut, dead, credentials, credential-broker, l34, secrets]
    authority: rider
  - id: EXT-2413
    type: death
    summary: "CUT (DEC-0372): multi-tenant memory and knowledge machinery (orgs, projects, ACLs, sharing, webhooks, billing). QMA keeps the memory/knowledge engine but drops the tenancy — there is a single operator."
    quote: "single operator; keep the engine, drop the tenancy"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: Multi-tenant memory and knowledge machinery (orgs, projects, ACLs, sharing, webhooks, billing))"
    topics: [cut, dead, multi-tenant, memory, knowledge]
    authority: rider
  - id: EXT-2414
    type: death
    summary: "CUT (DEC-0373): cloud service tiers, telemetry to a vendor, account slots and mobile clients. The daemon is authoritative and local (AD-6, AD-25); there is no service tier and no vendor telemetry sink."
    quote: "the daemon is authoritative and local; there is no service tier"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: Cloud service tiers, telemetry to a vendor, account slots, mobile clients)"
    topics: [cut, dead, cloud-tiers, vendor-telemetry, mobile]
    authority: rider
  - id: EXT-2415
    type: death
    summary: "CUT (DEC-0374): permanent named specialist rosters (a fixed cast of always-on named worker agents). The operator flagged the overcooking himself; QMA spawns worker templates on demand instead (AD-22 worker_template)."
    quote: "the operator flagged the overcooking himself; worker templates spawned on demand instead"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: Permanent named specialist rosters)"
    topics: [cut, dead, rosters, worker-templates]
    authority: rider
  - id: EXT-2416
    type: death
    summary: "CUT (DEC-0375): a Trading-desk execution tool, 'paper only' included. QMA's money-path output is never an order; L36 puts nothing above a bot on the market, and paper is an account role on a real venue, not a sandbox. This Cut is the ground for the AD-16/AD-28 money-path reachability barrier and DEC-0341."
    quote: "QMA's money-path output is never an order; L36 puts nothing above a bot on the market, and paper is an account role on a real venue"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: A Trading-desk execution tool, \"paper only\" included)"
    topics: [cut, dead, execution-tool, money-path, paper-trading, l36]
