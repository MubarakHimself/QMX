    authority: rider
  - id: EXT-2372
    type: constraint
    summary: "Operator standing principle 2026-08-28 (memlog L30, options-sheet D7 amendment L35, AD-10/AD-11): everything created in the system gets HOOKS — every daemon-owned primitive (task, ledger append, memory write, skill write, graph transition, message send, spawn, tool call, completion, mission start/complete, routine fire, hook register, ...) ships its own before/after hook events so deterministic guards can stop agents from being 'too agentic'; hooks are the single ENFORCEMENT surface and the control surface, never an optional feature; the registry is closed-and-addable and every new daemon-owned primitive ships a before_<verb> gate AND an after_<verb> event (omitting an after_ is a spine amendment, never an author's judgment call)."
