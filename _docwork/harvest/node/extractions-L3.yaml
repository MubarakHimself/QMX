te onto the filled quantity, admission value retained as the declared plan, lineage edge) and adjudicator B's never-re-base recommendation is OVERRIDDEN by the parent text; (11) duplicate-fill dedup IS ruled by AD-27 - every CT-20 observation carries a venue-native identity key so gap-replay redelivery deduplicates under AD-10's idempotent split."
