    summary: "AD-21 splits, journal, doors: split manifests fingerprinted, time-ordered, non-overlapping, pinning exactly one calendar identity+version in-band with frozen TradingDate seal boundaries; 12-month seal enforced now as policy-rejection refusals at every qmf-data read boundary including restored backups, one logged final look journaled as a control-action subtype; journal is N gapless per-writer streams carrying seven event types with correlation_id excluded from identity; adapter doors define contracts, normalization, validation, idempotent (source, source-native id, revision) intake; news-calendar recorder keeps provider-native identity and revisions; tick sources separately identified, bid and ask preserved, disagreements kept via corroborates/disagrees-with edges."
