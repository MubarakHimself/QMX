    title: "Cut: an eleven-entry loop registry as the organizing centre"
    statement: "QMA would make an eleven-entry loop registry the organizing centre of its control model. This is CUT: the operator's last word (T-4954) enumerates graphs, not loops; the named cycles become authored, plugin-contributed Graph Templates (AD-13), and Loop is reduced to a node kind inside a Graph Template. Graphs, not loops, are the organizing centre."
