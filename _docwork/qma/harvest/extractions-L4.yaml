    topics: [qma, stack, pins, sqlite-floor, unpinned]
    authority: rider
  - id: EXT-2368
    type: decision
    summary: "D1 PARADIGM ratified (memlog L37, AD-1/AD-2/AD-3): contract-hub, the same house style as QMF so QMF and QMA read as one system — qma-core is definitions-only and depends only on qmf-core (refusals are variants of qmf-core's typed base, ids/correlation_id/fp1 imported never re-minted, no parallel base for anything qmf-core defines); qma-daemon is the only process that runs anything and the sole writer; qma-wire is the only cross-boundary contract package; every runtime concern enters through a core-defined port; the seven ports are MemoryProvider, ModelDeployment, ExecutionEnvironment, KnowledgeSource, ToolAdapter, ComputeProvider, ContextCompiler with cardinality and scope key declared per contribution point (a second singleton binding is a hard startup error naming both plugin ids); contributions are reversible and scoped; plugins named by desk (research-*, trading-*, dev-*, analysis-*, pm-*)."
    cite: "SRC-13:.memlog.md:L37"
    topics: [qma, contract-hub, ports, house-style, reversible]
    authority: rider
  - id: EXT-2369
    type: decision
    summary: "D15 DAEMON HOST / deployment envelope ratified (memlog L38, AD-25, AD-5 transport, AD-17): the daemon runs on the operator's workstation by default ('90% of the time, like most harnesses'); Docker workers run on that host by default; Quants/Missions/Workers are deployable to remote workspaces through AD-17's contract with remote workers DIALING OUT to the daemon (no inbound port on the deployed side, the daemon's own listener is the single inbound port, non-loopback only under TLS + recorded operator configuration); deployment is driven from the operator's UI/wire commands, never a QMA command line — QMB's qmb CLI stays the platform's single command-line surface (DEC-0185 Ruling C); mailboxes/journal live in the daemon store wherever it runs, no external relay; the trading-node VPS is untouched (AD-28 barrier)."
    cite: "SRC-13:.memlog.md:L38"
    topics: [qma, deployment, workstation-default, dial-out, no-cli]
    authority: rider
  - id: EXT-2370
    type: decision
    summary: "SDK NAMESPACE ratified (operator L3968 register #73, memlog L18/L26, AD-1 Conventions): no blanket qmx. prefix anywhere — the SDK, daemon and wire share the qma.* namespace (qma.core, qma.wire, qma.daemon), and plugins and ledger views are named by desk with prefix tokens research-*, trading-*, dev-*, analysis-*, pm-*; QMX stays the platform name and is never assumed as the prefix for a subsystem."
    quote: "Don't blanket-prefix with QMX ... I don't like QMX because QMX is assuming the entire platform"
    cite: "SRC-13:inputs/transcript-decision-register.md#4"
    topics: [qma, namespace, no-qmx-prefix, desk-scoped]
    authority: rider
  - id: EXT-2371
    type: decision
    summary: "LEDGER GRANULARITY ratified (operator ledger ruling memlog L22/L25, follow-up L29, AD-9): ledgers are TASK-LEVEL — no global ledger, no per-desk/per-profile ledger store, and no remote agent appending to a desk-central ledger; the Task Ledger is one per Task for its whole life, appended only by the Agent holding the Task's dispatch_lease through before_ledger_append and written by the daemon, carrying attempt_no/authored_by/model with daemon-authored reassigned and unknown_tail entries; a Quant Ledger exists only for the desk's lead Quant (quant_ledger_lease); an Experiment Ledger per experiment; Research/Trading/Dev/Analysis/PM 'ledgers' are read-time desk VIEWS (indexes by desk/quant/agent/mission/task/experiment/date); Mission reports are a derived-after-the-fact synthesis, DEFERRED (operator not yet certain); the daemon event journal is neither a ledger nor telemetry."
    cite: "SRC-13:.memlog.md:L25"
    topics: [qma, ledgers, task-level, quant-ledger, desk-views]
    authority: rider
  - id: EXT-2372
    type: constraint
    summary: "Operator standing principle 2026-08-28 (memlog L30, options-sheet D7 amendment L35, AD-10/AD-11): everything created in the system gets HOOKS — every daemon-owned primitive (task, ledger append, memory write, skill write, graph transition, message send, spawn, tool call, completion, mission start/complete, routine fire, hook register, ...) ships its own before/after hook events so deterministic guards can stop agents from being 'too agentic'; hooks are the single ENFORCEMENT surface and the control surface, never an optional feature; the registry is closed-and-addable and every new daemon-owned primitive ships a before_<verb> gate AND an after_<verb> event (omitting an after_ is a spine amendment, never an author's judgment call)."
    cite: "SRC-13:.memlog.md:L30"
    topics: [qma, hooks, enforcement-surface, every-primitive]
    authority: rider
  - id: EXT-2373
    type: decision
    summary: "D8 GRAPH/LOOP/SKILL adopted by the sitting from the ChatGPT design transcript after the operator declined to re-answer D8 and directed it to the transcript (memlog L39, AD-12/AD-13): three control primitives — Skill (reusable procedure/knowledge, Skill != Loop, a Skill may invoke a Loop), Loop (executable control cycle with RUNTIME-owned stopping condition, budget and escalation, a node kind inside a Graph Template), and Graph Template (authored, plugin-contributed, versioned topology with NO runtime state; instantiating it emits Tasks only) — with the Graph Template vs Task Graph NAME SPLIT (the daemon's Task Graph is the only place work state lives; the name split is the drafter's adversary fix, not an operator ruling, cheap-veto V9); graphs, not loops, are the organizing centre (the operator's last word, T-4954 'we have to have a few graphs noted down, not loops'); no Mission Template layer in v1; loops are in-house and reach the registry only through AD-22."
    quote: "already answered in the transcript, look it up"
    cite: "SRC-13:.memlog.md:L39"
    topics: [qma, graph-template, loop, skill, task-graph-split]
    authority: rider
  - id: EXT-2374
    type: decision
    summary: "MONEY-PATH boundary (AD-16, AD-25, AD-28, Cut row 16, L36/L39): no execution tool exists at ANY account role, 'paper only' included — paper is an account role on a REAL venue, never a sandbox where an act is safe because it is not live (AD-25); the Trading desk is read-only; the act-level deny-list (order submit/amend/cancel/replace, open/close/reduce/hedge a position, set/amend protection, size/mint a sizing decision, create/amend/activate a bot-to-book binding, set Book mode/seat state/BMS parameter/priority rank/capital floor, arm/disarm a kill switch or node control action, transition any registry artifact between zones) is refused at REGISTRATION with ProhibitedMoneyPathTool (a startup error, evaluated before check_fn, deny-list is code not configuration); nothing above a bot touches the market (L36)."
    cite: "SRC-13:ARCHITECTURE-SPINE.md#AD-16"
    topics: [qma, money-path, no-execution-tool, deny-list, paper-is-real]
    authority: rider
  - id: EXT-2375
    type: decision
    summary: "D13 MEMORY adopted from transcript row 43 (memlog L42, AD-18/AD-22, Deferred row): QMA builds NO memory engine in-house — qma-core owns the MemoryProvider port with admission-gated candidates (recall, propose, admit, MemoryCandidate carrying provenance, validation_state and the daemon-computed scalar admission_confidence a proposing agent may never set); with no provider bound recall returns the typed refusal NoMemoryProvider (per-desk singleton) and candidates stage under AD-22 as RefinementProposals; Hindsight (v0.9.2) is the deferred first backend admitted only behind a QMA-owned eval on real desk experience (GAP-0072); the no-database-server rule binds QMA's own stores (journal, ledgers, artifact, staging, telemetry), never a provider's internal storage behind a QMA-owned port."
    cite: "SRC-13:.memlog.md:L42"
    topics: [qma, memory, memoryprovider, admit, hindsight-deferred]
    authority: rider
  - id: EXT-2376
    type: decision
    summary: "D14 KNOWLEDGE adopted from transcript rows 47-48 (memlog L43, AD-19, Deferred row): QMA owns the KnowledgeSource port as a READ-ONLY, provenance-carrying adapter over the STRATS plain-file library — CorpusSnapshot (content-addressed tree digest), Citation (source_ref, snapshot_ref, locator) and Provenance (an opaque evidence label plus a map of exactly six evidence_confidence dimensions declared once per source, never scalarized); search is literal and locator-based (grep-class, no ranking, no embedding); on cite the daemon copies the cited bytes into the artifact store; the two confidences are never conflated (evidence_confidence on knowledge vs admission_confidence on memory, neither derived from the other); hybrid/semantic indexing is DEFERRED (GAP-0073) until the corpus is populated and its layout ratified upstream."
    cite: "SRC-13:.memlog.md:L43"
    topics: [qma, knowledge, knowledgesource, read-only, evidence-confidence]
    authority: rider
  - id: EXT-2377
    type: decision
    summary: "D10 MODEL PROXY (memlog L41, local-proxy custody L105, operator rulings applied L194, AD-15/AD-24): the deterministic chain is ModelClass -> Deployment -> Credential Broker; the four ModelClass values are REASONING_HIGH, WORKHORSE_GENERAL, CODING_HIGH, FAST_CHEAP (SCREAMING_SNAKE); the requested class selects the pool and the router never crosses a class boundary (empty pool -> NoEligibleDeployment); OpenCodex is the first ModelDeployment implementation sitting BEHIND the Deployment contract, NOT behind the Broker; a local-proxy Deployment carries auth_mode none (no QMA secret value ever crosses into the proxy), must bind loopback on the daemon host (NonLoopbackProxy otherwise), and the AD-26 variable proxy.allow_unauthenticated_loopback (default true, ui-editable) governs whether an unauthenticated loopback proxy is accepted (UnauthenticatedProxy when false); QMA NEVER pools accounts (pooling is the operator's own proxy under his own terms, held outside QMA); model_family is OPTIONAL on the Deployment record, assigned only by an operator command, and an unassigned family is routable but ineligible for every ReviewPolicy comparison (NoEligibleReviewer)."
    quote: "it's the only reference I have, and it's a perfect fit"
    cite: "SRC-13:.memlog.md:L41"
    topics: [qma, model-proxy, opencodex, modelclass, credential-broker]
    authority: rider
  - id: EXT-2378
    type: decision
    summary: "CLOSED VERBS admit/apply/promote (memlog L104, Conventions 'Closed verbs' row, AD-18/AD-22/AD-24/AD-25): three acts, three verbs, never interchanged — a memory candidate is ADMITTED (MemoryProvider operation admit, validation_state value admitted, scalar admission_confidence, AD-18); a RefinementProposal is APPLIED out of the staging store (AD-22); only a registered artifact is PROMOTED into the live zone, by a human OUTSIDE QMA (L17, AD-24, AD-25), and QMA mints no promotion or zone-transition command at all, recording only the resulting artifact ref; 'promote' and 'promotion' never appear for memory or refinement anywhere in the spine or its projections."
    cite: "SRC-13:.memlog.md:L104"
    topics: [qma, closed-verbs, admit, apply, promote]
    authority: rider
  - id: EXT-2379
    type: decision
    summary: "VOCABULARY ADOPTION and scope reconciliation (memlog L103, closed-from-sources L205, SRC-15, Conventions Naming, Vocabulary): 'plugin' is the transcript's and operator's own word for a desk extension package (AD-21) and is ADOPTED for QMA prose; 'kernel' appears only in the qualified phrase 'RLM kernel' — the Analysis worker's persistent Python interpreter (AD-14) — never bare and never for qmf-core or the Trading Node; the parent's ban stays in force for QMF/QMB/node prose (engine stays banned for backtesting, exam banned outright, kernel a retired name for qmf-core/Trading Node, 'QMB is a library and a CLI, never an engine or kernel'); no constitution law bans plugin; the adoption is tagged [ADOPTED 2026-08-28 - transcript vocabulary; parent ban is QMB-scoped] and QMA's adoption is never presented as lifting the parent ban."
    cite: "SRC-13:.memlog.md:L205"
    topics: [qma, plugin, rlm-kernel, scope-reconciliation, parent-ban]
    authority: rider
  - id: EXT-2380
    type: decision
    summary: "DEPENDENCY DIRECTION for QMA (AD-2, memlog edge narrowing L60, banned-vocab close L103, constitution L30/L31): AD-2's diagram is the whole rule and an undrawn edge is default-deny; qma-daemon -> qmf-registry and -> qmf-risk are READ-AND-CALCULATE only, the permitted surfaces enumerated default-deny in qma-core, and QMA may write only content-addressed dev-zone candidates through qmf-registry, never a binding/Book/BMS/seat/control-action/exit/protection/priority-rank/promotion record nor a zone-transition surface; qmf-venue is importable by NO QMA package, worker or plugin; plugin daemon-half and worker-half meet only at qma-wire; L30's 2026-08-21 scope annotation makes L30 roster-internal, so QMA's read-and-calculate edges stand under L31 (DEC-0171/DEC-0184 precedent)."
    cite: "SRC-13:ARCHITECTURE-SPINE.md#AD-2"
