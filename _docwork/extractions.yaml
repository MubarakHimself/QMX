  # --- SRC-03: foundation architecture sitting 2026-08-19/20 (ratified spine AD-1..AD-21 + memlog); SRC-04: raw transcript archive/qmf-3.txt ---

  - id: EXT-2001
    type: decision
    summary: "AD-1 runtime matrix: CPython 3.14 pinned everywhere; tier-1 targets Windows 11 x86-64 and Ubuntu LTS x86-64; QMF stays pure-Python and OS-neutral."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-1
    topics: [runtime, ci, packaging]
    authority: rider

  - id: EXT-2002
    type: decision
    summary: "AD-2 packaging: one repo as a uv workspace; seven packages importing as the qmf.* PEP 420 namespace; src layout; uv_build; one committed uv.lock; lockstep roster versioning; explicit sibling dependencies with isolated per-package test envs; calendar extensions outside the roster on their own SemVer ladder; shared nouns defined in qmf-core, records owned by qmf-registry."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-2
    topics: [packaging, workspace, namespace, extensions]
    authority: rider

  - id: EXT-2003
    type: decision
    summary: "AD-3 toolchain: ruff format+lint, pyright strict workspace-wide, pytest; coverage floor 80% per package with 100% branch coverage on CT-01/CT-02 primitive modules; frozen dataclasses for public value types, Protocols for seams; canonical poe fmt|lint|types|test|check commands."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-3
    topics: [toolchain, quality, coverage]
    authority: rider

  - id: EXT-2004
    type: decision
    summary: "AD-4 quality tiers bound to factory events: tier 1 poe check per work unit; tier 2 poe check-integration (plus integration and contract tests in isolated envs) on landing into the integration branch; tier 3 poe check-release (plus builds and clean-install smoke on both tier-1 OSes) on ship; contract tests defined and owned by each contract's owning package."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-4
    topics: [ci, gates, contract-tests]
    authority: rider

  - id: EXT-2005
    type: decision
    summary: "AD-5 two version ladders: SemVer lockstep 0.x code packages (one-release deprecation window) and per-contract integer format versions stamped into every artifact whose meaning never mutates; history append-only; recomputation under newer calendar/tzdata mints a new artifact with a lineage edge."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-5
    topics: [versioning, compatibility, evidence]
    authority: rider

  - id: EXT-2006
    type: decision
    summary: "AD-6 dependency and licence tiers: permissive allowed; LGPL only unmodified and separately installed; GPL/AGPL, strategy-family, and platform-imposing dependencies prohibited; qmf-core takes zero outside dependencies; every dependency registered in DEPENDENCIES.md."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-6
    topics: [dependencies, licences]
    authority: rider

  - id: EXT-2007
    type: decision
    summary: "AD-7 exact money: Money/Price/Quantity are scaled integers with declared scale; Price is instrument-tagged, never single-currency; lossless auto-promotion or typed refusal; the money path is a taint rule banning binary float, crossed only at named conversion boundaries with explicit rounding mode; foreign money stored verbatim as evidence; analytic float series stay off the money path with label-derived identity."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-7
    topics: [money, exactness, contracts]
    authority: rider

  - id: EXT-2008
    type: decision
    summary: "AD-8 exact time: int64 UTC ns instants (POSIX, no leap seconds, 1677–2262, checked arithmetic); CivilDate/TradingDate split with calendar identity in-band; Duration and half-open Interval in core; wall vs monotonic clocks type-separated with monotonic never an Instant; (instant, writer, sequence) replay ordering with WriterId a first-class noun; calendar identity is the rule set with rollover vs session schedule split; day-boundary calendar kind account-scoped; forex 17:00 New York calendar ships first, swap-Wednesday dropped; tzdata pinned and verified in calendar extensions; foreign timestamps stored verbatim as evidence."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-8
    topics: [time, calendars, ordering, evidence]
    authority: rider

  - id: EXT-2009
    type: decision
    summary: "AD-9 identity: instrument identity is (venue, opaque venue symbol); VenueId operator-minted, opaque, stable, with white-label brokers as distinct venues; renames are dated alias records; Venue and Account are first-class core nouns with registry-owned records; accounts carry roles and Books bind to accounts; multi-broker is normal."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-9
    topics: [identity, venue, account]
    authority: rider

  - id: EXT-2010
    type: decision
    summary: "AD-10 fingerprints: single canonical serializer and fingerprint implementation in qmf-core; pinned fp1 recipe (sorted-key UTF-8 JSON, NFC strings, integer-only identity numerics, no null, no floats in identity) hashed SHA-256, emitted fp1:sha256:<hex>; fields identity-by-default with versioned display-only exclusions; float artifacts get label-derived identity; idempotent re-writes accepted, true collisions refused and alarmed."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-10
    topics: [fingerprints, identity, serialization]
    authority: rider

  - id: EXT-2011
    type: decision
    summary: "AD-11 typed refusals: seven categories (invalid input, unsupported capability, unavailable dependency, stale evidence, policy rejection, transient venue failure, storage failure) with machine-readable context and retryability; refusals returned as result unions, never exceptions across package boundaries; one construction pattern — unchecked constructor plus validating try_create factory."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-11
    topics: [refusals, contracts]
    authority: rider

  - id: EXT-2012
    type: decision
    summary: "AD-12 result label and worlds: every result carries producer contract format version, input fingerprints, evidence time range, computation identity vs occurrence record, and world; worlds are live (paper/demo included via account role), replay (data-driven clock), and simulated (reserved, unusable until the backtesting sitting); non-live worlds never write the live evidence namespace."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-12
    topics: [result-label, worlds, identity]
    authority: rider

  - id: EXT-2013
    type: decision
    summary: "AD-13 measure-then-budget performance: no invented numbers; per-component benchmark harnesses measuring speed and peak memory at framework-native load ladders sized around the ~40-bot scenario; fingerprinted baselines scoped to (OS, CPU-class); variance-scaled regression thresholds gate merges; qmf-core imports in well under one second."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-13
    topics: [performance, benchmarks, gates]
    authority: rider

  - id: EXT-2014
    type: decision
    summary: "AD-14 loud failure: errors and refusals always carry context and are never swallowed; structured logging with correlation_id propagated across every boundary; every component exposes health(); logs render ISO-8601 Z display while journals store int64 UTC ns evidence; signals exportable to Prometheus-class stacks with the stack choice deferred to node/ops."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-14
    topics: [observability, logging, health]
    authority: rider

  - id: EXT-2015
    type: decision
    summary: "AD-15 concurrency stance: QMF values immutable; pure-computation libraries stay pure; resource-owning components follow one-writer-per-stream (the writer holds the AD-8 WriterId) with unlimited readers; QMF never spawns threads or background work; async only at the venue network edge."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-15
    topics: [concurrency, purity]
    authority: rider

  - id: EXT-2016
    type: decision
    summary: "AD-16 registry records: per-kind versioned record schemas sharing a tiny header (kind, contract format version, at-birth parent refs, writer, sequence); stable id derived from the fp1 fingerprint; occurrence facts display-only; after-birth lineage lives exclusively in append-only typed edge records (supersedes, promoted-from, occurrence-of, corroborates, disagrees-with) in pinned JSONL files with rebuildable local indexes; kinds addable never redefined; Bot and Book kinds reserved; no database server."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-16
    topics: [registry, lineage, records]
    authority: rider

  - id: EXT-2017
    type: decision
    summary: "AD-17 multiplicity at every layer: a Bot contains one-or-more confluences; confluences contain one-or-more levels, triggers, confirmations; components compose into composite artifacts with lineage; no layer hardcodes cardinality one; collections canonically ordered by child fingerprint unless declared order-significant; Bot identity is its content with the Bot↔Book↔account binding a separate dated record so paper-to-live re-binding never mints a new Bot."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-17
    topics: [bot, multiplicity, binding]
    authority: rider

  - id: EXT-2018
    type: decision
