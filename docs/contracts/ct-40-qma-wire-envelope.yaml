id: CT-40
name: QMA wire envelope and protocol contract
status: ratified
version: 1  # first minted format version; the daemon-to-UI wire contract of the QMX agentic system, minted by the 2026-08-28/29 QMA architecture sitting (spine AD-5, with AD-14's host_request bridge and AD-24's principal classes on the connection), validation closed dry 2026-08-29 (DEC-0304, DEC-0313, DEC-0323)
owner: COMP-QMA-WIRE  # qma-wire is the only cross-boundary contract package; it defines the envelope, the command/query/event families, the schemas and the protocol version (AD-1, DEC-0304)
consumers: []  # consumer-blind by design: qma-wire is the cross-boundary contract package both halves import — the daemon serves it and every client (the out-of-scope UI, non-plugin workers and language adapters, and desk plugins over their wire half) speaks it by importing qma-wire, so no runtime import edge is drawn to the contract from its speakers (DEC-0335, AD-2)
active_consumers: []
intended_consumers: [COMP-QMA-DAEMON]  # the daemon is the single server-side implementer and the sole writer of durable state behind the wire; the UI client is out of scope and unbuilt, and non-plugin workers, language adapters and desk-plugin worker halves are clients that dial out over qma-wire (DEC-0304, DEC-0336)
wiring_status: defined-unwired  # ratified surface; no code exists; the wire contract binds now while the UI arrives later against it (DEC-0333)
layer_from: ui  # the seam is ui -> backend; workers and desk plugins are the other client-side speakers (AD-5; the daemon-to-UI wire is the seam CT-40 carries)
layer_to: backend
decisions: [DEC-0304, DEC-0303, DEC-0313, DEC-0323, DEC-0333, DEC-0336]
gaps: [GAP-0079, GAP-0081]  # GAP-0079 external agent-to-agent transport (the internal bus comes first); GAP-0081 the qma-ui-contract package beyond a stub (the wire contract itself is not deferred and binds now)
purpose: >-
  One versioned wire contract joining the QMA daemon and every client — the daemon-to-UI
  contract of the QMX agentic system. It fixes the wire ENVELOPE (`v`, `type`, `id`,
  `producer_id`, `correlation_id`, `scope_path`, optional `seq`, `payload`; JSON canonical
  per `fp1`), the three message families (commands that mutate and are acked immediately
  with side effects settling asynchronously, queries that read durable state over HTTP GET,
  and a durable event stream), the MCP-style `initialize` handshake negotiating a semver
  `protocolVersion` plus capabilities, the `wire.attach` / `wire.detach` / replay client
  scope-subscription surface, the durable idempotency and dedup discipline, the typed
  `host_request` bridge family (AD-14), and the `operator` / `machine` principal class every
  authenticated connection carries (AD-24) — so a separately built client never breaks on a
  daemon change, closing a client never stops an agent, and a detached overnight run stays
  observable. Snapshots are authoritative; progress events are explicitly not.
invariants:
  - "Two products joined by one versioned contract: the daemon and every client are joined by one wire contract of three message families — commands (mutate, acked immediately, side effects settle asynchronously), queries (read durable state over HTTP GET) and a durable event stream; closing a client must not stop an agent and an overnight agent need not know a client exists; snapshots are authoritative and progress events are explicitly not (DEC-0304)."
  - "The wire envelope frame carries `v`, `type`, `id`, `producer_id`, `correlation_id`, `scope_path`, optional `seq` and `payload`, JSON canonical per `fp1`; it is AD-5's message frame and is never named `Envelope` — the mailbox `Envelope` (CT-48) is a different record and neither name is ever used for the other (DEC-0304)."
  - "`producer_id` is the stable identity of the minting client, worker or daemon component, assigned at the `initialize` handshake, unchanged across reconnects, and the first half of the command idempotency pair; it is one of the ten names the Conventions whitelist against the `_ref` law (DEC-0304)."
  - "`scope_path` is an ordered array of `kind`-plus-`id` segments in the fixed order desk, quant, mission, task, session, agent, subagent — Session sits between Task and Agent because a Task outlives the session that runs it (AD-12); every existing ancestor is present, filters prefix-match it, and the segment order is part of canonical JSON (DEC-0304)."
  - "One `seq`, one referent: `seq` is always the per-scope projection index of the scope named last in that message's `scope_path`; the journal's `journal_seq` (AD-6) never appears on the wire as `seq` and is opaque to clients (DEC-0304)."
  - "Transport is JSON-RPC 2.0 over WebSocket for commands and events with HTTP GET for queries, an MCP-style `initialize` handshake negotiating a semver `protocolVersion` plus capabilities, and JSON-Schema-described message families; language-specific workers and non-Python clients — the Rust UI included — connect as clients and never re-implement a `qmf` contract, and money, time, `fp1` and `correlation_id` never cross a language boundary (DEC-0304, DEC-0303)."
  - "Compatibility law: additive-only within a major, unknown types and fields ignored by older clients, deprecations live a configured number of minors (registry:wire.deprecation_minors) then drop, and `qma-wire` is the sole compatibility authority (DEC-0304)."
  - "`wire.attach(scope, since_seq)` and `wire.detach` are client state only: attachment never changes an actor's identity or stops a run, and session replay is `wire.attach(since_seq=0)`, read-only; `attach` is never used bare and this client scope subscription is the same thing as AD-14's session attachment axis; a cursor is valid only for the scope that issued it and a `wire.attach` carrying a cursor from another scope is refused with the typed refusal `CursorScopeMismatch`, never silently re-based (DEC-0304)."
  - "`id` is unique per message or record and minted by its producer; every wire command is idempotent on the pair producer id plus `id`, and the daemon keeps a dedup cursor whose window is a registered variable (registry:wire.dedup_window) (DEC-0304)."
  - "`correlation_id` has exactly three minting origins — an originating operator command, a scheduled trigger (AD-29) and a daemon-internal lifecycle act — and is copied verbatim onto every downstream command, event, JobHandle, ledger append, memory candidate and telemetry span, never regenerated, derived or truncated; a record without one is refused at the gate, with one carve-out — an evidence append reaching the daemon without one is recorded under a daemon-minted lifecycle id annotated `correlation_missing`, because L39 forbids a control blocking the recording of evidence (DEC-0304)."
  - "The typed `host_request` bridge is a `qma-wire` message family, never a second channel: every host call the RLM kernel makes is a wire command or query issued by the worker over `qma-wire` under the Task's `scope_path` and `correlation_id`, its verb set is closed-and-addable in `qma-wire`, every verb maps to exactly one daemon-owned primitive and runs that primitive's `before_*` hook, and a host call with no mapped primitive returns the typed refusal `UnknownHostRequest` (DEC-0313)."
  - "Every authenticated wire connection carries exactly one principal class, `operator` or `machine`: the `operator` class comes only from an interactive human credential presented by a client a human is driving, no `machine` principal may acquire, delegate, borrow, cache or impersonate the operator class, the class is recorded verbatim on every command, journal entry and ledger entry, and the human-gate command list (AD-24) is the sole closed-and-addable authority on which commands require an `operator` principal — refused from a `machine` principal with the typed refusal `OperatorPrincipalRequired` (DEC-0323)."
  - "Transport posture: the daemon binds loopback by default; any non-loopback bind requires TLS (`wss://` plus HTTPS for queries) AND an explicit recorded operator configuration, never a default; every client authenticates with a Credential-Broker-resolved reference before protocol bytes; an unauthenticated bind or a plaintext non-loopback bind is a hard startup refusal rather than a warning (DEC-0304, DEC-0336)."
  - "Remote workers dial out: a remote worker or deployed Quant dials OUT to its daemon and the daemon never dials in — the deployed side holds the daemon's address and its own credential, no inbound port is opened on the deployed side and no external relay is introduced (AD-20); the daemon's own listener is the single inbound port; a remote worker holds a durable local outbox (registry:wire.remote_outbox_depth, registry:wire.remote_spool_bytes) replayed in order on reconnect and deduped on the producer-plus-`id` pair (DEC-0336, DEC-0304)."
  - "The wire vocabulary seeds from the packet's 26 nouns — 9 commands, 7 queries, 10 `noun.verb` events — as a closed-and-addable registry, each family described by JSON Schema and versioned by `protocolVersion`; the seed query `get bot` reads `get quant`, since Quant is the persistent named actor and Bot stays the platform's trading-strategy instance (DEC-0331); there is no `ui_view` contribution point (AD-1) and the `qma-ui-contract` client-contract package ships as a deferred stub only (GAP-0081), while the wire contract itself binds now (DEC-0304, DEC-0333)."
  - "WORKFLOWS FORMAT MINT (Story 53.1 / FEAT-0051): federated discovery hits are exactly KnowledgeHit | ArtifactHit | ContributionHit on this additive CT-40 family; no new CT number (do not mint CT-52) (DEC-0449, DEC-0415, DEC-0446). ContributionHit identity is the live published_contributions() tuple {hit_class: contribution, plugin_id, point, qualified_id, package_id, package_version, availability_revision, availability} and is never fp1, never a registry kind, and never ArtifactHit.kind (DEC-0415; FR-WF-02; FR-WF-03). Discovery query names facade_search and facade_get are the additive CT-40 query family for this DTO. view:* is not a ContributionHit (GAP-0081). hit_class strats, qml_candidate, and hypothesis kinds stay refused; DEC-0412 stays dead and hypotheses stay on qml.research (DEC-0412; FR-WF-04). At inspect SHA 270e992 the wire was still KnowledgeHit|ArtifactHit only (DEC-0450)."
schema:
  type: wire-envelope-and-protocol  # the AD-5 message frame plus the command / query / event families, the initialize handshake, the attach/detach/replay surface, the host_request bridge family and the principal classes on the connection (DEC-0304)
  fields:
    - "v: the envelope/protocol format version; a semver `protocolVersion` negotiated at `initialize`, additive-only within a major (DEC-0304)"
    - "type: the message type name, drawn from the closed-and-addable command, query and event families and described by that family's JSON Schema (DEC-0304)"
    - "id: unique per message or record, minted by its producer; the second half of the command idempotency pair producer-id-plus-`id` (DEC-0304)"
    - "producer_id: the stable identity of the minting client, worker or daemon component, assigned at `initialize`, unchanged across reconnects; a whitelisted `_ref`-law exception and the first half of the idempotency pair (DEC-0304)"
    - "correlation_id: the trace id minted once at one of three origins (an originating operator command, a scheduled trigger, a daemon-internal lifecycle act) and copied verbatim; excluded from `fp1` identity by explicit versioned declaration; a whitelisted `_ref`-law exception (DEC-0304)"
    - "scope_path: the ordered array of `{kind, id}` segments in the fixed order desk, quant, mission, task, session, agent, subagent, every existing ancestor present; a whitelisted `_ref`-law exception and part of canonical JSON (DEC-0304)"
    - "seq: optional; the per-scope projection index of the scope named last in `scope_path`; never the journal's `journal_seq`, which is opaque to clients (DEC-0304)"
    - "payload: the message body described by its family's JSON Schema (DEC-0304)"
    - "federated hit (additive CT-40 family, COMP-QMA-WIRE): exactly one of KnowledgeHit, ArtifactHit, or ContributionHit (DEC-0449; FR-WF-01; Story 53.1 format mint)"
    - "KnowledgeHit: hit_class=knowledge, source_ref, snapshot_ref, locator (CT-44 cite handles on the wire DTO)"
    - "ArtifactHit: hit_class=artifact, fp1, kind where kind is a Workbench AD-3 roster kind or closed query-hit tags saved-view | analysis.published"
    - "ContributionHit: hit_class=contribution, plugin_id, point, qualified_id, package_id, package_version, availability_revision, availability — identity is the live published_contributions() tuple, never fp1, never a registry kind, never ArtifactHit.kind (DEC-0415; FR-WF-02; FR-WF-03; SCN-0018)"
    - "ContributionPin (Story 53.3 / FR-WF-07): stores exactly (qualified_id, package_version, availability_revision); never a descriptor digest, never fp1, never a grant (cheap-veto A4; SCN-0018). Invoke revalidates the pin against the live published roster and availability_revision; matching live tuple may proceed to grant checks (54/55). Disable/uninstall/leave-roster → typed unavailable or tombstone, never another package_version (FR-WF-08). Pin leases persist on existing plugin_install_records (AR-WF-05; no sixth sqlite class)."
    - "ContributionListing (Story 53.4 / FR-WF-12): overlay over a ContributionHit distinguishing published vs configured vs granted vs reachable vs healthy as independent booleans; authorizes_invoke is always false — a hit is not a grant even when published and healthy (SCN-0018 Branch B; DEC-0415; FR-WF-06). Occupancy none. product_session / granted_ops are not minted here (Epic 55; AD-8; FR-WF-38)."
    - "view:* presentation DTO (Story 53.4 / AD-17): CONTRACTS §14 wire DTO only; not a plugin contribution point and not a ContributionHit until a named GAP-0081 ui_view increment. Mount/dispose must not start or kill durable work."
    - "discovery queries: facade_search, facade_get (additive CT-40 query names for the federated hit DTO; FEAT-0051 format mint; FR-RES-18)"
    - "InvocationEnvelope (Story 54.2 / FR-WF-17; cheap-veto A3; additive CT-40): logical_invocation_id, attempt_id, op_id, op_version, contribution {qualified_id, package_version}, instance_id, config_revision, caller_session_ref, callee_session_ref, grant_id, effect_class, idempotency_key, reconcile_policy, input_hash, parent_logical_invocation_id, call_depth. Signed/bound request context, not authority. Transport (in-process, CLI, wire, nested) never bypasses it. Host resolves contribution, descriptor, GrantRecord from authoritative stores and compares every bound field before execution; typed stale / mismatch / GRANT_MISMATCH. Ambiguous instance_id or config_revision refuses (never silent latest). input_hash preimage is canonical JSON of the input_schema-validated payload (sorted keys); secrets never inlined. Crypto algorithm remains GAP-DESK-ENVELOPE-CRYPTO; mismatch refuse still required. Not on the wire at inspect SHA 270e992 (DEC-0437, DEC-0450; GAP-0096)."
    - "GrantRecord (Story 54.4 / FR-WF-23; CONTRACTS §3b; additive CT-40): immutable after mint; fields grant_id, principal, audience, contribution {qualified_id, package_version}, instance_id, config_revision, op_id, op_version, effect_class, parameter_ceiling.allow_keys, account_scope (omitted unless granted), expires_at. revoked_at is not a GrantRecord field (RC-05). Manifests request; the host grants. product_session.granted_ops stores grant_ids, never bare op-id strings."
    - "product_session (Story 55.1 / FR-WF-27; Workflows AD-8; COMP-QMA-DAEMON journal projection on existing daemon sqlite, not a new store class): ids psess: not QMA sess:. Durable fields product_session_id, profile (authoring|app-use, immutable at create, not ontology Profile), principal, context_revision, app_instance_id, granted_ops (grant_ids), selected_refs, account_scope (omitted unless granted), resume_cursor, cursor_generation. product_session.context is the bound request context: principal, account_scope (nullable), occupancy none until live-adjacent, contribution {qualified_id, package_version}, instance_id, config_revision, as_of. Public call missing/stale versus that context is typed mismatch. Occupancy remains none. A tab is not this row. scope_path does not gain a segment. Not persisted at inspect SHA 270e992 (DEC-0450; GAP-0093)."
    - "product_session.granted_ops (Story 55.2 / FR-WF-30): grant_ids resolved by the host to GrantRecord rows beside product_session on the existing daemon sqlite (not a new store class). Envelope grant_id / op / effect / contribution / instance that do not match the bound GrantRecord → GRANT_MISMATCH before execution. Revoke or expires_at: already-accepted work may finish; new dispatch refused. Upgrade cannot widen or retarget without explicit re-grant that bumps context_revision. Manifests request; the host grants. Does not rewrite the Story 44.3 Tool Registry."
    - "product_session journal restore (Story 55.3 / FR-WF-33; Workflows AD-8): journaled daemon projection on the existing journal/CAS, not a sixth store class. Restart/reconnect restores the same bound context from product_session.* events, not in-process RAM. Two tabs of the same product (app_instance_id) share one psess:. Closing a tab writes nothing and does not close the session. A new tab does not mint a new product_session. Reconnect is a query from (resume_cursor, cursor_generation) and never replays unacked intent. Compacted history past the cursor yields snapshot/resync with a new cursor_generation — never a silent empty replay."
    - "GrantRevocation (Story 54.4 / FR-WF-24; CONTRACTS §3b): append-only {grant_id, revoked_at, principal, reason}. Minted GrantRecord bytes do not change. Evaluation moments: accept, dispatch, nested_call, retry, external_commit. Already-accepted work may finish; new dispatch after revoke or expires_at is refused. Upgrade cannot widen or retarget without explicit re-grant that bumps context_revision."
  enums:
    - "message families: command | query | event — commands mutate and are acked immediately with side effects settling asynchronously, queries read durable state over HTTP GET, events form the durable stream; the family set is closed-and-addable and owned by qma-wire (DEC-0304)"
    - "the 9 seed commands: start mission | send message | steer agent | stop run | approve hook action | install/enable plugin | update configuration | launch task | retry task — the packet seed, closed-and-addable (DEC-0304)"
    - "the 7 seed queries: get quant | list missions | get graph state | inspect ledger | inspect trace | list installed plugins | get provider health — the packet seed, with the seed noun `get bot` reading `get quant` under the Bot-to-Quant rule (DEC-0304, DEC-0331)"
    - "additive discovery queries: facade_search | facade_get — closed-and-addable CT-40 query names for the federated hit DTO (Story 53.1 format mint; FR-WF-01)"
    - "federated hit_class: knowledge | artifact | contribution — closed; strats, qml_candidate, and hypothesis kinds refused (DEC-0389 named-amended by DEC-0449; DEC-0412 stays dead)"
    - "ContributionHit.point: one of the eight multi contribution points (tool | tool_adapter | hook | skill | graph_template | model_deployment | toolset | worker_template); ui_view / view:* refused (GAP-0081)"
    - "ContributionHit.availability: enabled | disabled | unavailable | tombstone"
    - "ContributionPin fields: qualified_id | package_version | availability_revision (Story 53.3; FR-WF-07). Pin invoke availability outcomes: unavailable | tombstone mapped onto CT-04 unavailable-dependency (GAP-0094; do not invent a refusal category)"
    - "ContributionListing status axes: published | configured | granted | reachable | healthy (Story 53.4; FR-WF-12; AD-15). authorizes_invoke is const false. Occupancy is const none."
    - "ViewPresentation.mount: mounted | unmounted (AD-17; CONTRACTS §14). is_contribution_hit and is_plugin_contribution_point are const false (GAP-0081)"
    - "the 10 seed events (`noun.verb`): agent.started | message.delta | tool.started | task.completed | hook.blocked | ledger.updated | mission.updated | worker.detached | provider.cooldown | artifact.created — the packet seed, closed-and-addable (DEC-0304)"
    - "principal class (per authenticated connection): operator | machine — exactly one per connection, recorded verbatim on every command, journal entry and ledger entry (DEC-0323)"
    - "transport bind posture: loopback (default) | non-loopback (permitted only with TLS plus an explicit recorded operator configuration; otherwise a hard startup refusal) (DEC-0304, DEC-0336)"
    - "host_request bridge: a `qma-wire` message family whose verb set is closed-and-addable, each verb mapping to exactly one daemon-owned primitive and running that primitive's `before_*` hook; a verb with no mapped primitive returns `UnknownHostRequest` (DEC-0313)"
    - "typed refusals on this surface, variants of `qmf-core`'s base (CT-04): `CursorScopeMismatch` (a `wire.attach` carrying a cursor from another scope), `UnknownHostRequest` (a `host_request` verb with no mapped primitive), `OperatorPrincipalRequired` (a `machine` principal on a human-gate command) (DEC-0304, DEC-0313, DEC-0323)"
    - "InvocationEnvelope.effect_class: none | read | append-evidence | mutate-config | place-run | external-egress (AD-3; DEC-0416)"
    - "InvocationEnvelope.reconcile_policy: query-then-decide | unknown-manual | never-retry (AD-24; DEC-0437; FR-WF-22; Story 54.3)"
    - "Idempotency (Story 54.3 / FR-WF-19; RC-04): issuer of idempotency_key is the caller. Uniqueness domain (principal, op_id, op_version, instance_id, config_revision, grant_id, target, canonical_input_hash). Retention at least the journal lifetime of the invocation. Collision with a different payload hash is a typed refusal. Replay of the same key within retention returns the prior result."
    - "Nested identity (Story 54.3 / FR-WF-20): nested public calls carry parent_logical_invocation_id and call_depth. Child logical_invocation_id derives from (parent_logical_invocation_id, call_depth, child_op_id, child_canonical_input_hash). Nested invocation does not union permissions."
    - "Effect-specific outcomes (Story 54.3 / FR-WF-22; SCN-0021 Then 3): none/read may retry; append-evidence dedupes on the key; mutate-config is CAS on config_revision; place-run treats logical_invocation_id as run identity; external-egress MUST obtain a receipt or become unknown and MUST NOT blind-retry."
    - "public-call transports that must carry InvocationEnvelope: in-process | cli | wire | nested (FR-WF-17; FR-WF-25)"
    - "InvocationEnvelope hop refusals: StaleObservation (STALE_OBSERVATION), EnvelopeMismatch (mismatch), GrantMismatch (GRANT_MISMATCH), AmbiguousResolution (never latest), InvocationEnvelopeRequired (transport omitted the envelope), IdempotencyCollision (payload hash collision), BlindRetryRefused (external-egress without receipt), NestedPermissionUnionRefused (nested call unioned permissions) (RC-03; RC-04; FR-WF-18; FR-WF-19; FR-WF-20; FR-WF-22)"
    - "GrantRecord evaluation refusals (Story 54.4 / FR-WF-24; RC-05): GrantInactive (revoked or past expires_at at a new-dispatch moment), GrantWidenRefused (in-place upgrade/widen/retarget), ManifestIsNotGrant (manifests request; host grants)"
    - "Grant evaluation moments: accept | dispatch | nested_call | retry | external_commit (AD-24; FR-WF-24)"
    - "ProductSessionProfile: authoring | app-use (immutable at create; not qma.core.ontology.Profile; FR-WF-29; AD-8)"
    - "product_session.context occupancy: none until live-adjacent (Story 55.1). Public-call comparison refusals: EnvelopeMismatch (mismatch) for a missing or stale field versus bound context."
    - "product_session.granted_ops GrantRecord hop refusals (Story 55.2): GrantMismatch (GRANT_MISMATCH) when envelope grant_id / op / effect / contribution / instance do not match the bound GrantRecord; GrantInactive after revoke or expires_at at a new-dispatch moment; GrantWidenRefused for in-place upgrade; ManifestIsNotGrant when a manifest tries to mint."
    - "product_session tab/reconnect refusals (Story 55.3 / FR-WF-33): a tab is not a product_session row; a new tab does not mint; reconnect carrying command_id/payload is refused (never replays unacked intent)."
  units:
    - "`v` and `protocolVersion` are semver; compatibility is additive-only within a major and deprecations live a configured number of minors (registry:wire.deprecation_minors) then drop (DEC-0304)"
    - "`seq` is the per-scope projection index (an integer the daemon maintains), opaque to clients and never the journal's `journal_seq` (DEC-0304)"
    - "durations on this surface are spans measured from a recorded UTC instant (AD-6) and carry no timezone: the dedup window (registry:wire.dedup_window) (DEC-0304)"
    - "the remote outbox bounds are a dimensionless count (registry:wire.remote_outbox_depth) and an on-disk byte budget (registry:wire.remote_spool_bytes), not spans (DEC-0336)"
    - "JSON is canonical per `fp1`; fingerprints are `fp1:sha256:<hex>` imported from the parent and never re-derived (DEC-0304)"
  nullability:
    - "`v`, `type`, `id`, `producer_id`, `scope_path` and `payload` are always present; per `fp1` null is prohibited and an absent value is an omitted key (DEC-0304)"
    - "`seq` is optional (an omitted key, not null): it is present only on a message scoped to a projection whose index applies (DEC-0304)"
    - "`correlation_id` is present on every record except the single carve-out — an evidence append reaching the daemon without one is recorded under a daemon-minted lifecycle id annotated `correlation_missing` (L39, DEC-0304)"
    - "InvocationEnvelope optional keys (`caller_session_ref`, `callee_session_ref`, `parent_logical_invocation_id`) are omitted when absent, never null (fp1). Session refs when present are `psess:` product-session ids, never QMA `sess:` (FR-WF-17; AD-8)."
    - "GrantRecord.account_scope is omitted when not granted (fp1 null prohibited); a granted account_scope is a non-empty string (FR-WF-23)."
provenance_note: "CT-40 is newly minted by the 2026-08-28/29 QMA architecture sitting: the daemon-to-UI wire contract of the QMX agentic system, realizing AD-5 (the wire envelope, the command/query/event families, `initialize`, `protocolVersion`, attach/detach/replay, dedup and transport posture), AD-14 (the typed `host_request` bridge family), AD-24 (the `operator`/`machine` principal classes on every authenticated connection) and AD-4 (one Python daemon, JSON-RPC 2.0 over WebSocket, workers and non-Python clients over the wire) (DEC-0304, DEC-0313, DEC-0323, DEC-0303). The one-`seq`-one-referent rule keeping `journal_seq` off the wire, the `correlation_missing` evidence-append carve-out and the remote-dial-out durability were fixed at the 2026-08-29 validation close (verified=true, dry=true, remaining=0). Owned by COMP-QMA-WIRE, the only cross-boundary contract package (DEC-0335); the contract is `defined-unwired` and no code exists, the wire binding now while the UI arrives later against it (DEC-0333). Story 53.1 (FEAT-0051) lands the additive CT-40 format mint of ContributionHit fields and the facade_search / facade_get discovery query names so the frozen federated DTO is KnowledgeHit | ArtifactHit | ContributionHit; no CT-52 is minted (DEC-0446, DEC-0449, DEC-0415). Story 54.2 (FEAT-0052) lands the additive CT-40 InvocationEnvelope field catalogue (cheap-veto A3) as signed/bound request context, not authority. Story 54.4 lands immutable GrantRecord and append-only GrantRevocation on additive CT-40 (FR-WF-23, FR-WF-24; RC-05). Story 55.1 lands the COMP-QMA-DAEMON product_session journal projection and bound request context (FR-WF-27; AD-8); occupancy remains none. Story 55.2 binds product_session.granted_ops to host GrantRecords on the same sqlite (FR-WF-30); GRANT_MISMATCH / revoke refuse before execution. Story 55.3 restores bound product_session.context from the journal after restart/reconnect; tabs share one psess: and never mint or close it (FR-WF-33; AD-8). At inspect SHA 270e992 ContributionHit, InvocationEnvelope, and product_session were not present (DEC-0450). Implementation authorization arrives only through the factory pipeline."
