r a distinct account with its own quota and a declared fourth secret holder; A43 a reserved SUPERVISOR WriterId; A44 a named sealed-archive room role; A45 the three-way blank partition with blocks-soak GENERATED from the TN-23 checklist; A46 a small reserved protection-intent extent with UNDELIVERABLE as the honest terminal state; A47 the live connection opened for sensing and recording only from the moment credentials exist."
