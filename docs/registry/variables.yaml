  - name: canonical_indicator_reference
    symbol: null
    value: "TA-Lib C library 0.7.1 + Python wrapper 0.7.1"
    formula: null
    units: null
    type: string
    component: COMP-QMF-INDICATORS
    decision: DEC-0127
    configurable: false
    notes: "Pinned per QMF release as the lockfile-resolved artifacts (distribution filename + hash) of both the C library and the Python wrapper — the artifact identity, not a version string, is what AD-10 float provenance records — plus a declared, identity-bearing reference-configuration record (compatibility mode, candle settings) asserted at import and never mutated at runtime; a configuration change mints exactly like a version upgrade. Where the reference lacks a formula, the QMX implementation is canonical for that formula under the identical upgrade gate (DEC-0127, AD-23). Verified current 2026-08-20."

  - name: barspec_kinds
    symbol: null
    value: "time-interval | tick-count | volume-threshold | notional-threshold | price-brick | range | session"
    formula: null
    units: null
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0126
    configurable: false
    notes: "BarSpec is the discriminated aggregation rule that replaces the bare word 'timeframe' everywhere; each kind carries exact parameters and, for time-based kinds, the anchoring market-hours calendar identity + version. A bar series is well-defined only via its BarSpec; aggregation itself is a fingerprinted qmf-data derivation (DEC-0126, DEC-0130, AD-22)."

  - name: presence_map_states
    symbol: null
    value: "present | provisional | not_ready | gap | absent_by_schedule"
    formula: null
    units: null
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0126
    configurable: false
    notes: "Every position of a bulk series carries a presence state in a parallel integer-encoded map; positions are never omitted or shifted; NaN and sentinel markers are prohibited; equality compares presence maps first, values only at present positions (DEC-0126, DEC-0130, AD-22)."

  - name: evidence_classes
    symbol: null
    value: "confirmed | unconfirmed | provisional"
    formula: null
    units: null
    type: enum
    component: COMP-QMF-CORE
    decision: DEC-0129
    configurable: false
    notes: "Named part of the AD-12 result label and a declared identity field; an unconfirmed output links to its confirmed successor via a typed confirmed-as edge; a read requesting confirmed evidence refuses unconfirmed rows (policy rejection) rather than filtering silently (DEC-0129, DEC-0131, AD-25, AD-12)."

  - name: structure_seed_family_candidates
    symbol: null
    value: "swing points | horizontal levels from confirmed swings | zones | structure breaks"
    formula: null
    units: null
    type: enum
    component: COMP-QMF-STRUCTURE
    decision: DEC-0129
    configurable: false
    notes: "Candidates only, not a privileged set: each ships only once its confirmation rule states 'confirmed the moment X happens' with X knowable at that instant; operator-authored from-scratch families are first-class peers under identical law, and family authoring via the extension shape is the primary use case (DEC-0129, AD-25)."

  - name: venue_trendbar_price_basis
    symbol: null
    value: measured-per-broker
    formula: null
    units: null
    type: enum
    component: COMP-QMF-VENUE
    decision: DEC-0135
    configurable: false
    notes: "Never hardcoded: the trend-bar price basis (bid, ask, mid, or provider-native) is measured per broker at first connection and re-verified by a continuous background monitor, stored as per-broker configuration; a failed bar-basis reconciliation refuses bar evidence (DEC-0135, DEC-0141, AD-8, AD-28). The earlier BID-derived staff claim is demoted evidence — a 2013-forum-grade quote with structural corroboration only, never an invariant; DEC-0123 (recorded, not adopted) is superseded by DEC-0135."

  - name: venue_daily_bar_boundary
    symbol: null
    value: measured-per-broker
    formula: null
    units: null
    type: enum
    component: COMP-QMF-VENUE
    decision: DEC-0135
    configurable: false
    notes: "Never hardcoded: the venue's actual daily-bar boundary is derived per broker from trendbar timestamps at first connection (and across DST transitions), re-verified by a continuous background monitor, and stored as per-broker configuration; once verified it is minted as a venue-scoped market-hours calendar identity that anchors venue-native BarSpec, and until then venue daily bars are ungoverned observations (DEC-0135, DEC-0141, AD-8, AD-28). The 17:00-New-York claim is demoted 2013-forum-grade evidence, never an invariant; QMF's own forex_rollover accounting rule is independent of venue bars (DEC-0106)."

  - name: venue_broker_identity
    symbol: null
    value: deployment-configuration
    formula: null
    units: null
    type: enum
    component: COMP-QMF-VENUE
    decision: DEC-0139
    configurable: true
    notes: "Broker identity is deployment configuration, never architecture: opaque VenueId/AccountId identity and account bindings are sufficient, and measured per-broker behaviors live in the venue-observation profile (DEC-0139, AD-9). IC Markets is the operator's stated intent, deliberately not a framework commitment; account-type confirmation is config-time work per broker."

  - name: venue_protocol_artifact
    symbol: null
    value: 91
    formula: null
    units: spotware-proto-release-tag
    type: integer
    component: COMP-QMF-VENUE
    decision: DEC-0141
    configurable: false
    notes: "The Spotware openapi-proto-messages integer release tag pinned in the AD-6 register (verified current 2026-08-20); a tag change mints a new capability declaration plus gated re-verification on the second version ladder, bumping a contract format version only where the wire change alters that contract's public shape (DEC-0141, DEC-0138, AD-6, AD-28). Message definitions only — data, not code; zero Spotware code runs in QMX (the OpenApiPy SDK is reference-only under the platform-imposing rule)."

