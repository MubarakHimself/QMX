      | GAP-0083 | Desk consolidation — a Profile-level display collapse only, never a rename or retirement of a `desk_slug`, `ActorId`, plugin prefix, memory scope, or ledger key. |
      | GAP-0084 | A separate Mission Template registry — after the first three authored graph packs and a demonstrated need a Graph Template cannot carry. |
      | GAP-0085 | Typed strategy-mechanism decomposition — QML and `qmf-registry` own strategy semantics; revisit at the QML sitting. |
      | GAP-0086 | Graph engine implementation choice — when the first three authored graph packs exist. |
      | GAP-0087 | Claude Agent SDK in-process hook count 7-vs-10 — bounded by the Cut on foreign agent runtimes; revisits only if a spine amendment reverses that Cut. |
      | GAP-0088 | Backup destination, encryption-key custody, and the sample-restore and full-restore rehearsal cadences — before the daemon's first non-test run opens a durable store. |
      | GAP-0089 | The trim window for the two bounded non-evidence streams (mailbox delivery projection, telemetry) — when a stream crosses its registered threshold; the journal and agent trajectories are never trimmed. |
      | GAP-0090 | The context compaction rule — when the first run reaches its deployment's `min_context_tokens` ceiling; until then compaction persists nothing and no compacted transcript is evidence. |
