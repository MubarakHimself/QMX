components:
  - id: COMP-QMF-CORE
    name: qmf-core
    kind: library
    layer: backend
    roster_role: public-library
    distribution: uv-workspace-lockstep
    depends_on: []
    interfaces: [CT-01, CT-02, CT-03, CT-04, CT-05]
    spec: docs/components/qmf-core.md

  - id: COMP-QMF-REGISTRY
    name: qmf-registry
    kind: library
    layer: backend
    roster_role: public-library
    distribution: uv-workspace-lockstep
    depends_on: [COMP-QMF-CORE, COMP-QMF-DATA]
    interfaces: [CT-02, CT-03, CT-04, CT-05, CT-06, CT-07, CT-08, CT-09, CT-11, CT-13, CT-33, CT-34]
    spec: docs/components/qmf-registry.md
    notes: >-
      Owns every registry kind, including the two Bot-domain kinds the QML
      design fills: CT-33 Bot definition (AD-16's reserved Bot kind) and CT-34
      confluence. Both are authored via QML (COMP-QML) but owned by
      qmf-registry like every kind; the strategy-family metadata record is a
      kind under CT-06's addable-kinds law with no new CT number. Authoring by
      an application-layer library creates no import edge into qmf-registry.
      (DEC-0173, DEC-0175, DEC-0176)

  - id: COMP-QMF-DATA
    name: qmf-data
    kind: library
    layer: backend
    roster_role: public-library
    distribution: uv-workspace-lockstep
    depends_on: [COMP-QMF-CORE, COMP-QMF-DATA-STORE]
    interfaces: [CT-01, CT-02, CT-03, CT-04, CT-05, CT-06, CT-07, CT-08, CT-10, CT-11, CT-12, CT-13, CT-14]
    spec: docs/components/qmf-data.md

  - id: COMP-QMF-INDICATORS
    name: qmf-indicators
    kind: library
    layer: backend
    roster_role: public-library
    distribution: uv-workspace-lockstep
    depends_on: [COMP-QMF-CORE]
    interfaces: [CT-01, CT-02, CT-03, CT-04, CT-05, CT-10, CT-16]
    spec: docs/components/qmf-indicators.md

  - id: COMP-QMF-STRUCTURE
    name: qmf-structure
    kind: library
    layer: backend
    roster_role: public-library
    distribution: uv-workspace-lockstep
    depends_on: [COMP-QMF-CORE]
    interfaces: [CT-02, CT-03, CT-04, CT-05, CT-06, CT-07, CT-08, CT-10, CT-16, CT-17]
    spec: docs/components/qmf-structure.md

  - id: COMP-QMF-VENUE
    name: QMF venue module
    kind: middleware
    layer: middleware
    roster_role: public-module
    distribution: uv-workspace-lockstep
    depends_on: [COMP-QMF-CORE]
    interfaces: [CT-01, CT-02, CT-03, CT-04, CT-05, CT-10, CT-13, CT-18, CT-19, CT-20, CT-21]
    spec: docs/components/qmf-venue.md
    notes: >-
      Venue write path creates no dependency edge: qmf-venue emits through
      qmf-core-defined sink protocols (ObservationSink, JournalSink, RecordSink,
      SecretStore) injected at the composition root; the adapter connection
      manager holds the WriterId and sees every sink refusal. depends_on stays
      [COMP-QMF-CORE] only. (DEC-0138, DEC-0141)

  - id: COMP-QMF-RISK
    name: QMF risk module
    kind: library
    layer: backend
    roster_role: public-module
    distribution: uv-workspace-lockstep
    depends_on: [COMP-QMF-CORE]
    interfaces: [CT-01, CT-02, CT-03, CT-04, CT-05, CT-06, CT-07, CT-10, CT-13, CT-22, CT-23, CT-24, CT-25, CT-27, CT-28, CT-29, CT-30, CT-31, CT-32]
    spec: docs/components/qmf-risk.md
    notes: >-
      The ratified risk sitting (AD-29..41) adds NO package import edge:
      depends_on stays [COMP-QMF-CORE] only. Risk record kinds (CT-22, CT-24,
      CT-27, CT-28, CT-29, CT-30, CT-31, CT-32 and the instrument
      currency-exposure metadata record) are qmf-core value types wrapped into
      qmf-registry records by the composition root; entity journals (CT-25) are
      read-time projections over qmf-data's writer-scoped streams; and
      control-action dispatch (CT-30) reaches the venue through qmf-core-defined
      sink protocols injected at the composition root. CT-23 is the bot-to-Book
      inbound door whose caller is node-boundary and unassigned in QMF. All
      risk contracts are defined-unwired; the venue command CT-19 gains the
      fifth kind amend_protection, owned by COMP-QMF-VENUE. (DEC-0143, DEC-0145,
      DEC-0158)

  - id: COMP-QMB
    name: QMB (experimentation/backtesting library + qmb CLI)
    kind: library
    layer: middleware
    roster_role: consumer-product
    distribution: separate-versioned-package-own-semver
    depends_on: [COMP-QMF-CORE, COMP-QMF-REGISTRY, COMP-QMF-DATA, COMP-QMF-INDICATORS, COMP-QMF-STRUCTURE, COMP-QMF-RISK]
    interfaces: [CT-01, CT-02, CT-04, CT-05, CT-07, CT-10, CT-12, CT-13, CT-16, CT-17, CT-22, CT-23, CT-25, CT-27, CT-28, CT-29, CT-32]
    spec: docs/components/qmb.md
    notes: >-
      Application-layer product built ON QMF, never a roster package: one pure
      library + the qmb CLI in one wheel (uv add qmb; own SemVer,
      display-only provenance never identity), consuming the QMF workspace in
      lockstep (DEC-0159, DEC-0167). QMB is an application composition root —
      the first sanctioned place the defined-unwired risk contracts
      (CT-22/23/27/28/29/32) are legally wired, in world=replay only; the
      default-deny no-import posture governs roster packages, and wiring at a
      composition root is the ratified pattern (DEC-0146, DEC-0158, DEC-0169).
      No edge to COMP-QMF-VENUE: live adapters and brokerage ports are
      trading-node territory (spine Deferred); B-2's clock/adapter seam is
      where they will bind, and replay execution binds the B-6 fill/cost/
      financing ports instead (DEC-0164). Results are CT-32 artifacts with
      declared chart-series and trade-event-reference extensions; run trading
      events ride CT-13 journal streams in the run's world (DEC-0163).
      Registry state arrives as immutable fingerprinted as-of sets over a
      passive file-sync hub — dumb storage, never the dead DEC-0084 central
      service (DEC-0165).

  - id: COMP-QML
    name: QML (bot-authoring library)
    kind: library
    layer: middleware
    roster_role: consumer-product
    distribution: separate-versioned-package-own-semver
    depends_on: [COMP-QMF-CORE, COMP-QMF-REGISTRY, COMP-QMF-RISK]
    interfaces: [CT-01, CT-02, CT-03, CT-04, CT-05, CT-06, CT-07, CT-16, CT-17, CT-18, CT-22, CT-23, CT-28, CT-29, CT-33, CT-34]
    spec: docs/components/qml.md
    notes: >-
      Application-layer product built ON QMF, never a roster package: one pure
      uv-installable library (uv add qml; own SemVer display-only provenance
      never identity), consuming the QMF workspace in lockstep (DEC-0171,
      DEC-0180). Its whole surface is three thin things — author types/helpers
      for the CT-33 Bot definition and CT-34 confluence, the bot runtime
      protocol, and the conformance gate — and it mints NO new QMF-ladder
      (CT-*) shared contract of its own; the runtime protocol and conformance
      contract are QML-local on QML's own AD-5 ladder (DEC-0171, DEC-0177,
      DEC-0178). CT-33/CT-34 are AUTHORED via QML but OWNED by qmf-registry
      like every kind; the strategy-family record is a CT-06 metadata kind, no
      new CT number (DEC-0173, DEC-0175, DEC-0176). Dependency stance: imports
      qmf-core, qmf-registry, and qmf-risk (CT-23/CT-29 types) at its
      composition root, and NEVER qmf-venue; the QMF default-deny
      Dependency-direction rule is read roster-scoped — it governs the seven
      roster packages internally, never applications built on the workspace,
      the same reading the ratified QMB precedent exercises (DEC-0171,
      DEC-0169, DEC-0184). Registration write path is AD-25 root-mints: a host
      composition root holds the WriterId and per-(writer, kind) sequence and
      sees every RecordSink refusal; qml returns fingerprintable content, never
      stamped records, and is pure per AD-15 (no threads, I/O, or process
      spawning) (DEC-0171). Parent-contract format mints CT-22 v2 and CT-23 v2
      are owned by COMP-QMF-RISK with QML-authored semantics (DEC-0181,
      DEC-0182). Hosts: QMB binds conformant bots through a runtime-protocol
      adapter at its composition root day one, the trading node hosts seats
      later (DEC-0177, DEC-0180).

