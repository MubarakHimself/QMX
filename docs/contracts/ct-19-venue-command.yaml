id: CT-19
name: Venue command contract
status: provisional
version: 1  # first minted format version; the command law is spine-ratified (AD-27), the doc stays provisional pending operator corpus re-ratification (DEC-0137, DEC-0140)
owner: COMP-QMF-VENUE
consumers: []  # the command caller is unassigned in QMF; a per-venue adapter implements CT-19 and the composition root wires the caller, which arrives only through the factory pipeline (DEC-0137, DEC-0138)
active_consumers: []
intended_consumers: [out-of-scope QMX application]  # the command caller; deliberately unassigned in QMF, intended until the factory wires it (DEC-0137)
caller_status: unassigned  # the caller stays unassigned in QMF; QMF carries the ordering ordinal field, the node owns the sequencer (DEC-0137)
wiring_status: ratified-shape-application-mediated  # shape ratified (AD-27, amended by AD-34/DEC-0148); no caller is wired and no build is authorized outside the factory pipeline
layer_from: backend
layer_to: middleware
decisions: [DEC-0029, DEC-0059, DEC-0061, DEC-0137, DEC-0138, DEC-0140, DEC-0141, DEC-0142, DEC-0147, DEC-0148, DEC-0150, DEC-0158]
gaps: []  # GAP-0005 (version policy), GAP-0036 (command/uncertainty law), and GAP-0038 (adapter contract) answered 2026-08-20; the fifth command kind amend_protection is minted, not a gap (DEC-0148); reconciliation-verdict consequences are node/BMS authority (DEC-0142) and flatten authority is assigned in AD-36 with the adapter never initiating a flatten (DEC-0150) — both referenced as pointers, never specified here
purpose: "The venue-neutral command contract: a caller submits one of exactly five typed command kinds to a per-venue adapter over the (VenueId, account) command stream, and every well-formed submission resolves to exactly one of four outcomes — accepted-by-venue, rejected-by-venue, denied-locally, or UNKNOWN — with uncertainty recorded as an explicit state, never assumed, retried, flattened, or invented (DEC-0137, DEC-0140, DEC-0148)."
invariants:
  - "The command stream — the unit of UNKNOWN blocking, of WriterId ownership, and of the gapless per-writer sequence — is the (VenueId, account) pair: coarser than an account binding (all bindings on an account block together), strictly finer than a connection (a shared connection never couples distinct accounts' uncertainty); sessions and bindings exist but neither is a stream (DEC-0137, DEC-0140)."
  - "A session-epoch id distinct from the boot epoch rides every venue observation; the per-writer sequence resets only on boot, never on reconnect, and the sequence cursor is durable through the observation sink (DEC-0137, DEC-0138)."
  - "Command vocabulary is exactly five kinds — place_order, cancel_order, close_position, close_all, and amend_protection (the fifth, minted 2026-08-20 through this contract's own explicit-later-mint clause) — each typed per kind on qmf-core nouns (exact prices and quantities per the foreign-value boundary, identity per the minting discipline) with no free-form payload; kinds are addable never redefined; a general amend_order (price, size, expiry) and a partial close arrive only by an explicit later mint, never through a payload, and amend_protection is never widened into a general amend_order; no command kind expresses a fractional close, so a V1 partial exit — emulable only by close-then-replace, the unprotected window forbidden — is an unsupported-capability refusal; the caller stays unassigned in QMF (DEC-0137, DEC-0140, DEC-0141, DEC-0147, DEC-0148)."
  - "amend_protection is typed on qmf-core nouns with exact prices and constrained at contract level to risk-non-increasing changes defined PER PROTECTION SIDE: a stop-side change may not increase the loss-direction distance measured against the frozen original_risk_distance, and the contract-level check binds the STOP SIDE ONLY — target-side changes are governed by the Book's declared envelope, not the risk test. It carries the position or pending-order reference under the command identity discipline — the subject reference the CT-20 subject-terminal resolution reads, so a stop filling mid-amend is a named outcome, never a stream-blocking UNKNOWN. It is never emulated by cancel-then-place (which opens an unprotected window) and never widened into a general order amendment. Absolute protection is unsupported for MARKET orders on the cTrader-platform profile, so the entry-relative form is the declared placement path and THE REFERENCE PRICE a relative distance derives from is declared CT-19 contract surface; because the resting stop may then differ from the declared full-loss price by slippage, that declaration stays the plan and is never read back as the observed fill. No dedicated response message exists, so the four-outcome law and CT-18 acknowledgement-mode declarations apply unchanged (DEC-0148, DEC-0158)."
  - "Order-parameter vocabulary — order type (market | limit | stop | stop-limit), time-in-force, and protective-stop attachment — is QMF-owned, addable never redefined; each adapter declares its supported subset in CT-18, and invoking an undeclared parameter is an unsupported-capability refusal (DEC-0137, DEC-0138)."
  - "close_position and close_all carry a required typed scope — account | account-binding | instrument-within-binding; CT-18 declares the natively supported scopes, and an unsupported scope is an unsupported-capability refusal, never emulated at a wider scope (DEC-0137, DEC-0138)."
  - "A command fanning out to N venue submissions is a compound command: each child carries a derived identity (parent fp1 + declared ordinal) and is individually observation- and journal-bearing; the parent's outcome is the meet of its children — any child UNKNOWN makes the parent UNKNOWN, any child rejected makes the parent partially-executed, a named outcome that is never a success (DEC-0137, DEC-0140)."
  - "Command identity is the command record's fp1 — including the (VenueId, account) stream qualification, the session epoch, and the caller's opaque ordering ordinal; a venue-native id is never sufficient alone. The CT-18-declared mapping into the venue's client-id field must be injective and total over the digest space, or a durable command-id-binding record — (venue client id, command fp1, account, session epoch) — persists through the sink BEFORE submission (DEC-0137, DEC-0138)."
  - "Idempotency and collision tests run against the full local fingerprint, never the venue-side id: re-presenting the same command is an idempotent accept; differing content under a reused identity is refused and alarmed (DEC-0137)."
  - "Four-outcome law: every well-formed submission resolves to accepted-by-venue | rejected-by-venue | denied-locally | UNKNOWN; denied-locally is an outcome, never a refusal — typed refusals are reserved for a malformed command, an undeclared capability, and a blocked stream — and every outcome, denied-locally included, mints an observation record and a journal event (DEC-0137, DEC-0140)."
  - "A transport error, timeout, or disconnect yields UNKNOWN — a state, not an error; a venue-returned error resolves rejected-by-venue only where the CT-18 error table declares that outcome class, and every other path is UNKNOWN (DEC-0137, DEC-0138)."
  - "An UNKNOWN is minted as an explicit observation carrying its trigger (timeout | transport-error | disconnect), the monotonic elapsed measurement, the wall receive instant, and the submission deadline in force; the deadline is a declared adapter parameter the application injects under do-not-default — its existence and declaration are mandatory, its value is never QMF's (DEC-0137)."
  - "While an UNKNOWN is outstanding on a command stream the adapter refuses new commands on that stream (transient-venue-failure, after-condition = resolution); protection commands are not exempt from the block — but a protection act the block refuses NEVER EVAPORATES: it stands as a standing protection intent (AD-36) and is re-decided when the block clears, re-deciding being explicitly not retrying — and cancel_order, close_position, close_all, and amend_protection dispatch ahead of place_order on every shared throttle (CT-18 declares the throttle scope: connection | account | binding), and suspend-new takes local effect instantly with no venue round-trip (DEC-0137, DEC-0138, DEC-0148, DEC-0150, DEC-0158)."
  - "No QMF component retries, assumes an outcome, flattens, or invents terminal state on UNKNOWN; the adapter never clears its own block — unblocking is an explicit typed resolve_unknown(command identity, resolution in observed-accepted | observed-absent | operator-attested) call by the application, itself recorded as an observation; the block is per command and clears on resolution, never on a reconciliation verdict (DEC-0137)."
  - "Command retry is prohibited — retryability rides typed refusals (a venue retry-after becomes the after-condition); retry, pool, and health constants are node values under the do-not-default standing; session recovery is the adapter's declared work run by the application's scheduler and never resubmits a command (DEC-0137, DEC-0141)."
  - "Flatten is close_position or close_all executed mechanically; the adapter never initiates it (its own adapter_self actions are limited to suspend_new, drain, throttle, and session state). Flatten authority is ASSIGNED IN AD-36 — the operator unconditionally at any scope; Book policy only through pre-declared trigger classes (a kill-line breach flattens that binding's scope); the protection authority (kill-switch class) where the node's severity policy declares close_all; and nobody else — never the venue adapter. Which effect fires at which severity stays node/trading-node authority, recorded in tracker/trading-node-notes.md and referenced here as a pointer, never specified as QMF contract surface (DEC-0137, DEC-0142, DEC-0150)."
  - "Command outcome and order state are separate streams, never merged: an order's terminal state is decided by fills and venue lifecycle events under CT-20 only, never inferred from a command outcome (DEC-0137, DEC-0140)."
  - "All failures are typed refusals per registry:typed_refusal_codes; the correlation_id rides the caller's context and is occurrence/display-only, never identity content (DEC-0109, DEC-0137)."
schema:
  type: command-record + submission-outcome  # the command record whose fp1 is the command's identity, and the outcome plus observation it produces (DEC-0137)
  fields:
    - "command_kind: exactly one of place_order | cancel_order | close_position | close_all | amend_protection; typed per kind on qmf-core nouns, no free-form payload (DEC-0137, DEC-0148)"
    - "stream_qualification: the (VenueId, account) pair naming the command stream, part of fp1 (DEC-0137, DEC-0140)"
    - "session_epoch: the session-epoch id distinct from the boot epoch, riding every observation this command produces (DEC-0137)"
    - "ordering_ordinal: the caller's opaque ordering ordinal, identity-bearing; QMF carries the field, the node owns the sequencer (DEC-0137)"
    - "order_parameters: present for place_order only — order type (market | limit | stop | stop-limit), time-in-force, protective-stop attachment; exact prices and quantities on qmf-core nouns; the adapter's supported subset is declared in CT-18 (DEC-0137, DEC-0138)"
    - "close_scope: present for close_position and close_all only — the required typed scope account | account-binding | instrument-within-binding (DEC-0137)"
    - "protection_amendment: present for amend_protection only — the risk-non-increasing change per protection side on exact qmf-core prices (stop-side checked against the frozen original_risk_distance, contract check binding the stop side only; target-side governed by the Book's declared envelope), the subject position or pending-order reference read by the CT-20 subject-terminal resolution, and — where the placement path is entry-relative (MARKET orders on the cTrader-platform profile) — the declared reference price the relative distance derives from, held as the plan and never read back as the observed fill (DEC-0148, DEC-0158)"
    - "client_id_mapping: the CT-18-declared injective-and-total mapping into the venue client-id field, or the durable command-id-binding record persisted through the sink before submission (DEC-0137, DEC-0138)"
    - "compound_children: for a fan-out command, each child's derived identity (parent fp1 + declared ordinal), individually observation- and journal-bearing (DEC-0137)"
    - "submission_deadline: the declared, application-injected adapter parameter in force at submission; do-not-default (DEC-0137)"
    - "outcome: accepted-by-venue | rejected-by-venue | denied-locally | UNKNOWN; a compound parent's outcome is the meet of its children, adding partially-executed where any child is rejected (DEC-0137, DEC-0140)"
    - "unknown_observation: the explicit observation minted on UNKNOWN — trigger, monotonic elapsed measurement, wall receive instant, submission deadline in force (DEC-0137)"
    - "resolution: for a resolve_unknown call — observed-accepted | observed-absent | operator-attested; issued by the application only and itself recorded as an observation (DEC-0137)"
  enums:
    - "command kind: place_order | cancel_order | close_position | close_all | amend_protection; addable never redefined; a general amend_order and a partial close arrive only by explicit later mint, and amend_protection is never widened into a general amend_order (DEC-0137, DEC-0148)"
    - "order type: market | limit | stop | stop-limit; adapter subset declared in CT-18 (DEC-0137, DEC-0138)"
    - "close scope: account | account-binding | instrument-within-binding; unsupported scope is an unsupported-capability refusal, never emulated wider (DEC-0137)"
    - "submission outcome: accepted-by-venue | rejected-by-venue | denied-locally | UNKNOWN; denied-locally is an outcome, never a refusal (DEC-0137)"
    - "compound parent outcome: the meet of child outcomes — UNKNOWN if any child is UNKNOWN, partially-executed (a named outcome, never a success) if any child is rejected (DEC-0137)"
    - "UNKNOWN trigger: timeout | transport-error | disconnect (DEC-0137)"
    - "resolve_unknown resolution: observed-accepted | observed-absent | operator-attested (DEC-0137)"
    - "acknowledgement mode (declared per command kind in CT-18): explicit-event | implicit-absence | none; an outcome is never derived from absence alone (DEC-0137, DEC-0138)"
    - "refusal categories in this contract's paths: registry:typed_refusal_codes — invalid-input (malformed command), unsupported-capability (undeclared kind, scope, or order parameter), transient-venue-failure (new commands while an UNKNOWN is outstanding), storage-failure (unpersistable command-id-binding or journal event blocking the command stream) (DEC-0137, DEC-0138, DEC-0109)"
  units:
    - "prices and quantities: exact rationals as scaled integers per the foreign-value boundary; binary floats never appear in command parameters or in identity (DEC-0137, DEC-0141)"
    - "instants (wall receive, submission deadline): int64 UTC nanoseconds; the elapsed measurement backing an UNKNOWN is a boot-scoped monotonic delta, never wall-computed (DEC-0137, DEC-0138)"
    - "ordering ordinal and per-writer sequence: integer counts; the sequence is gapless within one boot epoch and resets only on boot (DEC-0137)"
  nullability:
    - "order_parameters is present only for place_order, close_scope only for close_position and close_all, and protection_amendment only for amend_protection; a kind-inappropriate field is an omitted key, never null (DEC-0137, DEC-0148)"
    - "submission_deadline is never absent — its declaration is mandatory though its value is not QMF's (do-not-default) (DEC-0137)"
    - "an UNKNOWN observation is never cleared by the adapter; the resolution field is populated only by an application resolve_unknown call (DEC-0137)"
