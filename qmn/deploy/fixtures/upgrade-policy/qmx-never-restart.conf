# QMX Trading VPS — needrestart must never restart node units (NFR-18).
# Package upgrades may stage; only `just node-switch` flips the release.
$nrconf{override_rc} = {
  qr(^qmn.service$) => 0,
  qr(^qmn-news-calendar.service$) => 0,
  qr(^qmn-backup.service$) => 0,
  qr(^qmn-restore-sample.service$) => 0,
  qr(^qmn-restore-full.service$) => 0,
};
