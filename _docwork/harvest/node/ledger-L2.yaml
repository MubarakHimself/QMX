  - id: DEC-0209
    title: "Position-safety closures (TN-24)"
    statement: "PRD open-item rows 12 through 15 and the QB3 residues close as ten lettered closures, (a) through (j), and no eleventh. (a) A partial ENTRY fill follows AD-40 verbatim: the VIRTUAL (Book) position's original_risk_amount is re-based EXACTLY ONCE, at the entry's first terminal state, onto the filled quantity, the admission value retained as the declared plan with a lineage edge recording it - the only re-basing in V1 - the short fill also recorded as an execution-quality fact, and a short fill is NEVER topped up because V1 admits no scale-in, adding to an open virtual position being a policy rejection and a second tranche needing its own admission and its own R under a later Book version. (b) Duplicate fills dedup by the venue-native identity key - the deal or execution id within the account - per AD-27, the first copy standing and a second copy with different content being a data-quality alarm and never an overwrite. (c) A disconnect mid-order is UNKNOWN per L35 and THE BLOCK IS THE WHOLE STREAM, not the entry side: AD-27's per-command UNKNOWN block is AD-36's one non-control block, so every command on that (VenueId, account) stream is refused, protection included, and a refused protective act stands as an AD-36 protection intent journaled before dispatch and re-decided on resolution, cleared only by resolve_unknown and never by a reconciliation verdict. (d) A virtual-versus-venue position mismatch on restart is a drift verdict, then the entry stand-down for a role = live binding with no automatic resume. (e) One disposition vocabulary serves the bench and the sizing loss-rate - qualifying_loss_exit, scratch-or-partial-loss, breakeven - where BREAKEVENS NEVER COUNT under any q and are recorded as their own clustering metric, while scratches and partial losses do not count BY DEFAULT and count only where the Book's declared q reaches them, q being a per-family UI-editable variable and never a spine constant. (f) Money boundaries - rollover, sweep, re-seed, paper flip - NEVER TOUCH POSITIONS, a money-accounting boundary never being itself a flatten trigger, while flatten authority stays AD-36's three (the operator at any scope; Book policy only through pre-declared trigger classes, the kill-line breach included; the protection authority per the matrix) and never the adapter, and a declared window, hold-time or boundary force-flat that merely coincides with a money boundary is a separate declared Book trigger at AD-37 rank 2 and is honoured; floating P&L is an explained, named component of the equity narrative, is never swept, and is NEVER a term in either reconciliation residual because it is a mark and marks are never reconciled. (g) V1 dynamic protection is the breakeven ratchet only, a bot-proposed tighten being bounded risk-non-increasing, naming a direction and a bound rather than a price, and never refused on the command path. (h) Every decision-plus-evidence write declares atomic or ordered-with-recovery per CT-20's modes with evidence-first ordering always, and a partial write is a storage failure that blocks ENTRIES ONLY; no global dual-write atomicity rule is minted. (i) The news provider and the deep-history sources are TN-13's - Dukascopy with TrueFX and HistData as recorded companions, not node-blocking - and a requote is an ordinary mapped venue rejection through the venue error map with no vocabulary of its own. (j) A node close that races a venue terminal event - a venue margin liquidation or a venue-initiated close - reads back as rejected-by-venue with a superseded-by-terminal-subject qualifier: a NAMED OUTCOME, never a stream-blocking UNKNOWN, with the subject-terminal observation as the named resolving evidence, the venue-initiated close reasons being CT-29's own venue_liquidation and venue_initiated_close each carrying closing_authority = venue; and the pre-submission half, which is not a race at all, is that a command whose subject is absent or already terminal AT SUBMISSION resolves WITHOUT SUBMISSION and never as a naked close."
    status: ratified
    rationale: "AD-40, AD-27, AD-36, AD-37, L35 and CT-29's disposition vocabulary are the parent bindings; (a), (b) and (j) are parent- or corpus-ratified rather than assumptions, and adjudication correction 10 explicitly overrides adjudicator B's 'never re-base' recommendation with AD-40's parent text. The remaining calls rest on A29 (the scratch band left to the Book's declared q rather than excluded by spine law) and A13 (floating P&L never swept) - both proceed-on-recommendation. Amended at the gates: memlog line 51 (1) corrected (c) so the UNKNOWN block covers the whole stream including protection, superseding the memlog's bare 'disconnect mid-order to UNKNOWN per L35' and correcting the memlog's (h) 'blocking the command stream' to blocking ENTRIES ONLY for a partial write - the two blocks are different and only AD-27's is non-control; line 51 (33) added the absent-or-terminal-at-submission resolution and the no-scale-in refusal over virtual positions; and line 46 (1) and (6) fixed flatten authority and the entry-side-only rule. The memlog's (e) - 'breakeven/scratch exits count for NEITHER the bench nor the sizing loss-rate' - is superseded by the spine's split: breakevens never count under any q, but scratches and partial losses count where the Book's declared q reaches them. The memlog's (f) 'only the kill line flattens' is likewise superseded by AD-36's three flatten authorities plus the honoured coinciding Book trigger, and its 'floating P&L is an explained drift component' is corrected to an explained component of the equity narrative that is never a term in either reconciliation residual (memlog line 51 (10)). Closure (j) has no memlog counterpart: it is minted by the gate rulings."
