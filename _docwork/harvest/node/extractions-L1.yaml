  - id: EXT-2100
    type: decision
    summary: "TN-7 KSA — THE PROTECTION AUTHORITY, AND THE KILL SWITCH UNDER A DEAD WIRE (as amended by both gates): the node ADOPTS the GitBook baseline explicitly under L37 and re-ratifies it here because docs/ never carried it (a grep for GREEN or BLACK across docs/ returns zero hits) — five levels GREEN | YELLOW | ORANGE | RED | BLACK (fixed enum, uneditable), four trigger classes scheduled_news | black_swan | connectivity | unknown_state (addable, never redefined), automatic transitions ESCALATE ONLY, de-escalation by an operator resume alone. THE KSA LEVEL IS A READ-TIME FOLD over the control-action stream declaring its full AD-36 fold contract — stream, ordering key, knowledge-time bound, equal-instant disposition — resolving across writers by AD-37 rank and never by WriterId byte order, returning the most restrictive state and alarming rather than refusing on the trading path. FOLDED PER ENFORCEMENT SCOPE (line 51 ruling 24): the scope is part of the level's identity and of its level epoch, two scopes exist in V1 (global, and per (VenueId, account) command stream), the effective level at any decision point is the most restrictive of the scopes covering it, an operator resume NAMES the scope whose epoch it opens rather than silently reopening every scope, and the exported KSA level signal carries its scope label — without the scope the monotonicity rule is not well-formed. A connectivity or unknown_state escalation on the LIVE connection does NOT block paper routing to the paired demo stream, because AD-35 rules them distinct (VenueId, account) streams whose uncertainty never gates each other and a silent paper outage corrupts every later decay verdict: the escalation blocks the stream it names and no other, while a GLOBAL escalation blocks both live and paper alike. THE FOLD IS MONOTONE NON-DECREASING WITHIN A LEVEL EPOCH (line 46 ruling 3): it takes the maximum over every escalation record and lowers ONLY on an operator resume record opening a new level epoch — resolving a trigger's underlying condition, satisfying a standing protection intent, a reconciled verdict, a reconnect, a clocked clear, a restart, or the mere absence of new escalations never lowers it — and most-restrictive-on-ambiguity governs which level an ambiguous escalation resolves to, never whether a level decays. THE TRIGGER-TO-LEVEL-TO-EFFECT MATRIX is the node's severity policy: a configurable UI-editable node variable set, ksa_effect_matrix, carrying NO spine value, where each cell declares three mandatory things — an effect drawn ONLY from CT-30's kinds suspend_new | drain | flatten (a flatten resolving at dispatch into close_position or close_all CT-19 commands through CT-30's pinned resolution table; close_all is a command kind and never a control effect), a required typed scope, and the AD-36 satisfaction predicate from the full closed vocabulary scope-flat-at-reconciled-verdict | no-pending-orders-at-reconciled-verdict | never-auto, the middle one expressible in a cell and not silently dropped (line 51 ruling 33) — with a blank or provisional-evidence cell blocking role = live bindings (L38 / FR-035; line 46 ruling 16) while paper may run, and the legacy donor matrix (GREEN normal, YELLOW caution, ORANGE block new entries, RED protective posture, BLACK force-close) recorded as evidence only. EVERY TRIGGER KIND THE NODE MINTS DECLARES ITS AD-35 DISPOSITION, routes-to-paper | blocks-paper, as a mandatory field whose classification is fixed by the invariant and not by the author: scheduled_news and black_swan are market-risk blocks and blocks-paper; connectivity and unknown_state are blocks-paper on the escalation's own scope only; a kill-line stand-down and a benched seat are capital-or-authority blocks and routes-to-paper; and a kind minted with no disposition is an invalid input refusal at registration. THE KILL SWITCH IS THE KSA at its blocking levels — global, stopping all NEW trading live and paper alike, sensor-fed, with the MIS snapshot and SQS as inputs and never authorities. UNDER A DEAD WIRE OR AN OUTSTANDING UNKNOWN the satisfaction predicates are AD-36's verbatim and are never collapsed into one: suspend_new takes local effect instantly with no round trip, suspend_new AND drain are never-auto and stand until an operator resume with a reconciled verdict never clearing them, flatten satisfies only on scope-flat-at-reconciled-verdict, a command outcome never satisfies an intent, drift | unknown | out-of-lookback alarm and hold the intent open without dispatching, and a dead node is answered by the venue-resident protective stop (AD-33) — superseding the original entry's 'drain/close_all become standing intents satisfied only on a reconciled verdict'. THE STANDING-INTENT MACHINERY BINDS EVERY RISK-NON-INCREASING ACT and not only CT-30 kinds — amend_protection under AD-34, CT-23's close_full and tighten_protective_stop under AD-33, and every protective close — journaled before dispatch and, where the journal room is unpersistable, into TN-4's reserved protection-intent extent rather than merely into a fold (line 51 ruling 21), resolved as a read-time fold, re-decided rather than retried, never time-expiring and alarming when undeliverable; without it the apparatus would cover four control kinds and leave most actual protective acts to evaporate on the first transient refusal. THE KSA AUDIT TRAIL is the CT-25 projection ksa_audit_log over the control-action stream, never a stream of its own. DEC-0049's detector-pause scoping holds verbatim: automatic detectors act only through entry-blocking controls at the narrowest affected subject and never on positions or exits (L39 holds), with the inform-versus-pause posture a UI-editable node setting. BINDS qmn/protection, the node severity policy. PREVENTS an invented matrix, an automatic de-escalation, a flatten that fires on a guess."
    cite: "SRC-11:.memlog.md#line-22"
    topics: [trading-node, tn-7, ksa, protection-authority, kill-switch, effect-matrix, standing-intent]
    authority: rider

  - id: EXT-2101
    type: decision
    summary: "TN-8 [ADOPTED] THE RISK PROTECTION SET THE NODE RUNS VERBATIM, and the node-minted value roster (as amended by both gates): AD-33 through AD-41 and CT-29 through CT-32 RUN VERBATIM — the node ratifies the parent's ratified protection set BY ADOPTION, with GitBook and the trading-node documentation the authoritative risk-and-sizing layer under L37 — and the node mints VALUES, never rules. KILL LINE, one variable, one declared series, one cadence (line 46 ruling 1): kill_line_capital_floor is the ratified registry key and IS AD-40's loss_floor — one value, one name, read by both the ladder and the breach test, with no second name minted — declared by the Book definition and evaluated PER BINDING against that binding's virtual-ledger equity marked to the latest observed price of its own virtual positions (realized plus unrealized, TN-25), on every slice carrying a fill or a price update on an instrument the binding holds and at every accounting rollover; venue equity (balance plus unrealized, converted_by = venue, exact integers at the account money exponent) is the BMS and account view and the reconciliation counterpart and NEVER the per-Book breach series, while book_capital (period-open, excluding unrealized) is the sizing ladder's input only; a breach auto-flattens THAT binding's scope with close_reason = kill_line_flat (minted apart from protection_forced_flat), stands that binding down (binding state stood-down, never a Book-mode row), leaves other bindings of the same Book definition unaffected, returns only on an operator signature per binding, and declares disposition = routes-to-paper. FLATTEN AUTHORITY IS AD-36'S THREE and a money boundary is never one of them — the operator at any scope, always, unconditional and never gated on reconciliation; Book policy only through pre-declared trigger classes, the kill-line breach included; the protection authority where the matrix declares a flatten effect for that severity; venue-delegated trailing where the venue manages it and a Book opted in — and NEVER the adapter, whose adapter_self authority is limited to suspend_new, drain, throttle and session state, with AD-33's other flatten paths (hold_time_force_flat, boundary_flat, window_forced_flat, protection_forced_flat, operator_close) declared Book triggers at AD-37 rank 2 rather than exceptions to that list. NEWS BLACKOUT is instrument-scoped via dated per-instrument currency-exposure records — reading a currency out of a symbol is prohibited — entries only, live and paper alike, suppressed decisions journaled on the veto path, fail-closed on a missing exposure record, with no live skip button. A NEWS-CALENDAR REVISION MAY ONLY WIDEN OR ADD A WINDOW AUTOMATICALLY (line 51 ruling 7): a revision that would narrow, shorten, downgrade the severity of, delay the start of or remove a window currently in force or beginning within the current trading day is ingested and journaled as evidence, takes effect no earlier than the end of the window the superseded revision declared, never opens entries the superseded revision blocked, and is otherwise an operator act on the powers channel citing both revisions — without which the twice-hourly refresh of TN-13 would be an automatic protective de-escalation on the most frequently changing protective state in the system. STALENESS FAILS CLOSED BY A PER-DECISION-CYCLE PRECONDITION, news_calendar_max_staleness (do-not-default, configurable, duration unit-kind), evaluated exactly like a clock band: where the newest ingested snapshot's ingestion instant is older than it, entries fail closed on every binding holding news-exposed instruments, so a silently dead timer fails entries closed with no signal from the timer. DEAD ZONES are daily_dead_zone plus session_handover_buffer with a mandatory anchor pre-close | post-open | both: entries pause while exits, safety acts and data streaming are never blocked; THEIR WIDTHS CARRY NO SPINE VALUE AND NO NODE POSTURE — A8 RETIRED at the reviewer gate — the variable is blank do-not-default and a blank blocks live, the QMX-discussion layer's disagreeing figures (a one-hour table row against Flow 9's roughly three-hour prose) are recorded UNMERGED as evidence with their source layer and never as a default, and which band the operator ratifies is a hand-off recommendation rather than spine text; the original entry's 'sitting default posture = the wider roughly 3 h band around the daily rollover' is WITHDRAWN. SQS is the V1 ratio sensor as a CT-16 configured producer with the node as the BASELINE PRODUCER from its own live tick recording — one governed producer, published once, reaching the Book door only inside the per-instant signal snapshot (line 46 ruling 15) so one instant carries exactly one SQS value — with markers ok | not_ready | unavailable | stale | refused, a live binding requiring a present baseline KEYED (VenueId, environment, instrument) so a demo-conditioned baseline NEVER satisfies a role = live binding (the live baseline is minted from live-connection recording during the warm-up week, and the soak proves the minting and blocking mechanics on the demo environment rather than the live baseline itself), and instrument class a dated AD-9 instrument_class metadata record that is operator-declarable and correctable and never parsed from a symbol, no class record meaning blocked with the absence journaled as data quality and alarmed (AD-38's missing-record rule mirrored verbatim). THE BREAKEVEN RATCHET is V1's only dynamic protection, single-sided amend_protection until amend atomicity is measured at the venue (TN-11's sixth first-connection check), and its minimum step amend_min_improvement is ORIGINATION POLICY AND NEVER A GATE — a Book exit_policy authoring threshold declaring when the ratchet PROPOSES an amendment — so NO node component on the command path may refuse a risk-non-increasing amend_protection: a proposal not made is not a block, and a proposal made is dispatched (L39 / AD-36). BENCH is a read-time fold over CT-29 records of VIRTUAL (Book) positions with predicate realized_r <= -q, breakevens never counting under any q, a fill's CT-29 record persisting before the next intent on that seat (else stale evidence), its stream boundary the binding epoch (a new epoch starts at zero unless a signed carries-ledger edge spans it), and a benched seat declaring disposition = routes-to-paper and routing through its seat record's execution target while the Book stays LIVE. SAME-TICK PRIORITY is one BMS-declared rank table per stream with ranks total and unique, checked at admission Layer 1, a Book whose control policy contradicts its BMS's table refusing at bind time. THE NODE-MINTED UI-EDITABLE VARIABLE ROSTER — registry rows declaring schema and evidence values only, the resolved values living in the config artifact (TN-18) — is: ksa_effect_matrix; daily_dead_zone_width (evidence recorded unmerged, no default); session_handover_buffer_width and session_handover_buffer_anchor; news_blackout_before and news_blackout_after per severity; the seven sqs_* keys PLUS the Book-scoped decision_freshness_bound, which AD-39 makes mandatory and non-defaultable and against which a configured SQS input age is refused at the door; breakeven_ratchet_trigger and breakeven_ratchet_offset; qualifying_loss_threshold q per family; bench_consecutive_loss_threshold per bot, KEPT SEPARATE from the money-ladder divisor seat_loss_run_allowance (the legacy coupling being the recorded defect); amend_min_improvement per Book as the ratchet's authoring threshold; the clock bands of TN-14; the crash-loop K and T, drain_window and watchdog_interval of TN-4; and news_calendar_max_staleness. Every blank is partitioned blocks-boot | blocks-role-live | blocks-soak across the mint table (line 51 ruling 20), and a provisional-evidence value blocks role = live exactly as a blank does (line 46 ruling 16). BINDS qmn/protection, the registry variable rows the node mints. PREVENTS the node redefining a ratified control, the bench threshold re-coupling to the money-ladder divisor, a tick-storm amend flood."
    cite: "SRC-11:.memlog.md#line-23"
    topics: [trading-node, tn-8, adopted, kill-line, flatten-authority, news-blackout, dead-zone, sqs, bench, variables]
    authority: rider

  - id: EXT-2102
    type: decision
    summary: "TN-9 PAPER MODE AND THE SOAK AS THE FULL UNATTENDED WARM-UP WEEK (as amended by the operator ruling and both gates): paper is a Book-level mode (AD-35 / CT-24) expressed as a dated binding-epoch change CARRYING A MANDATORY state_carry DECLARATION PER COUNTER (TN-25); the paper target is the paired demo account — role demo, world = live — carrying its own BMS instance linked by a typed pairing record (AD-29), and K-27's 'paired demo binding for fail-mechanism fills' IS this mechanism, reconciled not contradictory; exactly one active paper-routing target per live binding, with execution_target resolved once at intent mint from (Book mode, seat state, active-control set); paper balance is family-scoped and frozen, a reset mints an operator-signed paper_epoch treasury boundary record (AD-16), and paper P&L never crosses the money boundary and never buys a seat. WHAT ROUTES AND WHAT BLOCKS follows AD-35's invariant: a CAPITAL OR AUTHORITY block routes to the paired target while the Book stays LIVE — a benched seat and a kill-line stand-down both route and the evidence keeps flowing — while a MARKET-RISK block blocks paper too, so a protection window, a dead zone and the kill switch stop paper entries exactly as live, and a blocked or silent paper stream raises the live alarm class. ROLE SCOPING IS DECLARED RATHER THAN COLLAPSED: the paired account is minted with AD-9 role demo and every routing reason writes under it, the finer roles paper-validation and paper-benched are DELIBERATELY NOT USED IN V1, and the consequence is stated — Book-mode PAPER evidence and benched-seat evidence land in one role-scoped namespace and are told apart by the routing reason on the execution-target record, never by namespace — a later split being a role addition rather than a re-write. THE SOAK IS MILESTONE 1 AND IT IS THE FIRST-DEPLOY WARM-UP WEEK, RULED by the operator 2026-08-28 ('two days to a week... I think a week is enough and sufficient'): for one full UNATTENDED week the node runs in paper mode on the demo account with the FULL live machinery — a real cTrader connection, the verification suite, reconciliation read-backs, standing intents, KSA, windows, SQS baseline minting, recording, backups, the restore drills, the doors, metrics and alerts — under full logging and monitoring, and it is the SAME week as the ratified roughly one-week warm-up rider (AD-39's pre-live rider; one attribution, one rider), never a soak nested inside a longer rider; the original entry's 'the roughly 2-day soak is the first two days of the ratified roughly 1-week warm-up rider' is superseded, the first-connection verification suite still preceding it. THE SOAK RUNS THE DEMO BINDING WHILE THE LIVE CONNECTION IS OPENED FOR SENSING AND RECORDING ONLY (line 51 ruling 32): the demo connection carries paper routing and the full order-path machinery, and as soon as live credentials exist the live connection opens with NO live binding, NO command stream open and NO live roster binding minted, so the live-environment SQS baseline (keyed (VenueId, environment, instrument), TN-8) and the live-path rung baseline accumulate on the live environment while the machinery proves itself on the demo one; THE LIVE BINDING WAITS ON ITS OWN BASELINES, a precondition stated here and gated in TN-23, so a late Spotware approval or KYC delays go-live and NEVER the soak — the week runs with the demo connection alone and the live baselines begin the day the credentials land — and the connection count is derived from the roster (a soak roster naming one (venue, environment) pair opens one connection, a roster naming two opens two). THE PAPER LEDGER RUNS (line 46 ruling 20): the paired binding keeps a full virtual ledger (TN-25) — frozen starting balance plus realized plus unrealized of its paper virtual positions — so a paper capital floor is evaluable and the kill-line mechanism is exercisable in paper, the frozen balance being what is never hand-adjusted while the equity series moves. DAY-ONE DRIFT CHECKS IN PAPER ARE TWO: the paper ledger must reconcile against its own CT-29 and fill records as self-consistency at epsilon 0 in the exact integer domain (TN-10), and the full reconciliation read-back runs against the demo account with a non-zero residual ALARMING for investigation rather than halting — and THE DISCRIMINATOR IS ROLE, NEVER WORLD, because the demo binding carries world = live by AD-12 and keying the live drift stand-down on world would stand the soak down on the first demo-server quirk — with these alarms delivered during the soak as a soak-scoped demo-drift digest rather than the live drift alarm class, so the operator is not trained to dismiss drift alarms in the week before go-live. LIVE BINDING COMES ONLY AT THE END of that week and only on instruments whose checks passed AND whose live-conditioned baselines are present. UNATTENDED IS A DESIGN CONSTRAINT rather than a schedule note: the alert allow-list, the dead-man's switch and the liveness digest (TN-15) stand in for a watching operator, and a synthetic alert is proven delivered end-to-end before the node is left alone (TN-23); TN-23's injected-fault drills are discrete operator-performed acceptance acts at the week's boundaries or at declared drill points, and the continuous run between them is what is left alone. ACCEPTANCE IS MACHINERY PROOF — the TN-23 checklist with its fault-injection drills, UNCHANGED by the duration ruling, since a longer soak proves the same machinery over a fuller daily-boundary and session cycle — and NEVER profit, because paper evidence can never authorize live money (SCN-0007, AD-32). BINDS qmn/paper, the milestone plan. PREVENTS a paper twin, a profit gate, an untested reconciliation meeting live money first."
    cite: "SRC-11:.memlog.md#line-24"
    topics: [trading-node, tn-9, paper-mode, soak, warm-up-week, demo-binding, acceptance]
    authority: rider

  - id: EXT-2103
    type: decision
    summary: "TN-10 [ADOPTED] STARTUP, RECOVERY AND EXPLAINED-DRIFT DOCTRINE (as amended by both gates): the PRD's mined Phase-2 doctrine is RATIFIED BY ADOPTION with ONE declared narrowing named at its point of use — the PRD's 'unexplained live drift halts trading' is narrowed to an entries-only stand-down, AUTHORIZED BY L39 exactly as TN-11 narrows AD-28's sensing-outage rule — and the GitBook start sequence is recorded as this doctrine's ancestor rather than a competing rule. After TN-2's seal the boot order is FIXED at ten steps: (1) connect per environment; (2) the FIRST-CONNECTION VERIFICATION SUITE of SIX verify-or-refuse checks — spot-timestamp unit, D1 boundary, bar-basis reconciliation, pip formula, money exponent, and AMEND ATOMICITY (AD-34's undocumented measured-at-connection field, whose verdict gates whether dual-sided amends are ever legal and whose absence leaves single-sided amendment the only path) — landing in the per-(VenueId, account) venue-observation profile, a failure refusing the dependent evidence class and journaling a data quality event; (3) RE-FOLD OF THE INTERPRETATION CURSOR, every observation recorded after the accumulator's last committed cursor position folded before any state is projected (TN-5), so nothing recorded before a shutdown is lost to interpretation; (4) reconnect gap recovery, fetching deals and positions since the last-seen execution event, recovered fills committing through evidence BEFORE the session reports healthy, a no-gap reconnect still emitting correlation evidence; (5) the reconciliation read-back over the declared lookback with FOUR verdicts; (6) resolution of outstanding UNKNOWNs — automatic on an unambiguous observed-accepted or observed-absent, operator attestation through the powers channel on an ambiguous, absent or out-of-lookback read-back, with the evidence channel serving the outstanding set WITH its per-command read-back detail so the attestation is made against evidence rather than a count, and a typed refusal rather than an offered choice where the read-back cannot support attestation; (7) missed-rollover catch-up, boundary equity reconstructed from journals and the sweep journaled as an AD-16 treasury boundary event (sweep | refund | re_seed | paper_epoch_reset, mapped onto AD-21's risk transition) appended as a correction — no money moves without one, it never closes a position and it never re-bases a frozen R; (8) protection-state projection over standing intents, KSA level, Book modes, binding states, seat states, bench counts, exposure and budgets, ALL read-time folds with no safety counters to reset; (9) readiness gates — clock sync and drift band ok, an SQS baseline present per door, a consistent control-rank table, every market-hours, day-boundary and news-calendar identity verified plus the pinned tzdata, and FOR role = live BINDINGS ONLY a live-path rung baseline on this deployment tuple, minted by the benchmark harness and never by the trading loop so a first boot is not circular; and (10) command-ordinal recovery before the sequencers accept intents, a stream whose ordinal cannot be recovered refusing to open. EVERY FOLD declares its stream, ordering key, knowledge-time bound and equal-instant disposition as pinned contract surface and resolves across writers by AD-37 rank and never by WriterId byte order; no fold on the trading path refuses — one that cannot resolve returns the most restrictive state, journals data quality and alarms. THE ARITHMETIC DOMAIN IS DECLARED (line 46 ruling 10): equity derivation and drift decomposition are exact scaled-integer arithmetic at the account's declared money exponent, each venue-supplied converted figure decoding once at its own declared exponent and re-scaling to the account exponent by exact integer arithmetic with NO float participating in the sum, and a figure arriving with no declared exponent or at an exponent that cannot be re-scaled exactly REFUSING the derivation with a typed refusal rather than approximating; reconciliation_epsilon = 0 is a statement about that domain, and no tolerance is ever introduced to absorb a representation error that does not exist. EXPLAINED DRIFT IS TWO RESIDUALS COMPARED SEPARATELY, each with its own epsilon-0 identity and NEVER one blended number (line 51 ruling 10): (a) QUANTITY — the sum of virtual (Book) positions per instrument (TN-25) against the venue position picture for that account, in exact instrument quantity units, under the account's declared netting | hedging model, through AD-27 reconciliation evidence; and (b) CASH — the venue's realized balance against the virtual ledger's realized cash plus the named components (swept-but-unwithdrawn cash, re-seed remnants, and venue-charged fees or financing not yet journaled) in exact scaled integers at the account money exponent. UNREALIZED P&L ENTERS NEITHER RESIDUAL because it is a mark, not a fact, and marks are never reconciled: the venue equity series (venue-marked, converted_by = venue) and the binding's virtual-ledger equity series (node-marked at the slice frontier) are reported SIDE BY SIDE with their mark instants and are NEVER differenced — differencing two marks taken at two instants under epsilon 0 would set operator_review permanently on any open position and gate promotion forever — and floating P&L remains an explained, named, never-swept component of the equity narrative rather than a term in a residual. Drift is a non-zero residual in (a) or in (b) and ONLY that sets operator_review, which is a journaled binding-scoped state, folded like any other, that gates the NEXT live promotion or activation on that binding and gates nothing else: it never blocks the command stream, never blocks an exit, and clears only on an operator resume after a fresh reconciliation review. UNEXPLAINED DRIFT IS KEYED ON THE BINDING'S ROLE AND NEVER ON ITS WORLD: a role = live binding stands down FOR ENTRIES ONLY — exits, protection amendments, standing intents and evidence continue per L39, which is what authorizes narrowing the PRD's 'halts trading' to the entry side — with no automatic resume and a restart never permission to resume, while a role = demo binding alarms at the live severity class and continues whatever its world. A DEPLOYMENT-TUPLE CHANGE INVALIDATES THE RUNG BASELINE: where the declared (OS, CPU-class) tuple changes under a running node — a VPS live migration, a rebuild, a resize — new role = live bindings are blocked entry-side until the benchmark harness re-records a baseline on the new tuple, the change alarms on the silent-degradation class, existing live bindings keep exits, protection amendments and evidence per L39, and AD-24's light claims degrade to provisional on the same event. RECONCILIATION CADENCE is a node value — after every UNKNOWN, on every reconnect, at each accounting rollover, and on a configurable periodic tick — startup reconciliation gates ENTRIES only under TN-6's entry-side rule while the sensing pipe flows from boot, and a clocked reconciled verdict satisfies a flatten intent and never lowers a KSA level. The original entry's five verification checks and its single blended residual are superseded. BINDS qmn/host boot, qmn/reconcile. PREVENTS trading on a false account picture, a crash resetting a counter, a sweep moving money that might not exist."
    cite: "SRC-11:.memlog.md#line-25"
    topics: [trading-node, tn-10, adopted, startup-order, reconciliation, explained-drift, operator-review]
    authority: rider

  - id: EXT-2104
    type: decision
    summary: "TN-11 VENUE INTEGRATION ON cTRADER — the transport increment, the node-minted port, equity derivation (as amended by both gates): IC Markets is deployment configuration and never architecture. THE TRANSPORT LOCUS IS DECLARED, NOT ASSUMED: qmf-venue owns its own transport and already ships the ConnectionManager as the AD-26/AD-28 sole owner of venue sessions and the single in-memory holder of secret values, so the missing pieces — the asyncio TLS socket to demo.ctraderapi.com and live.ctraderapi.com on port 5035, length-prefixed ProtoMessage framing over the pinned proto release tag 91 compiled in-house against protobuf 7.36.0 with zero Spotware code, request encoding, clientMsgId generation and matching, the submit path, market-data subscription (spots with timestamps opt-in, live trendbars inside spot events, depth verbatim), account auth, in-band token refresh via ProtoOARefreshTokenReq, and the cents and volume decoder that decodes from the wire's int64 fields at their declared exponent straight into scaled integers, no float participating and a money field arriving in a floating form refused rather than converted (line 51 ruling 19) — are a qmf-venue INCREMENT THAT COMPLETES THAT EXISTING COMPONENT, delivered as QMF-side stories the node's epics depend on, with protobuf staying a qmf-venue-only dependency, no second connection manager minted and no second in-memory secret holder existing; the original entry's 'the node ships the in-house transport qmf-venue deliberately lacks' is superseded by that declared locus. The increment carries TN-2's delegated-impurity clause and, in the same increment, the amendment exempting qmf.venue.connection BY NAME from QMF's async conformance test (a proposed parent annotation); if the parent refuses the exemption the increment lands in qmn.venue.ctrader instead and THE EPICS MAY NOT CHOOSE (line 51 ruling 9); the increment also carries the SessionTopology relaxation. qmn/venue/ctrader/ holds only what is genuinely node-side — duty scheduling, the verification-suite runner, equity derivation, the CT-18 field fills, the error-map rows and the port implementation — and the qmn.venue subpackage is the sanctioned qmf-venue import boundary (TN-1's L30 note) against which the L30 default-deny lint is written. THE NEUTRAL PORT IS NODE-MINTED BECAUSE THE INVENTORY SAYS THERE IS NONE (line 46 ruling 13): qmf-venue exposes exactly one Protocol, ProbeTransport, and there is no VenuePort, OrderPort or VenueAdapter seam at ef9bb25, so AD-28's 'one neutral port' is a contract statement rather than an injectable seam; the node therefore mints qmn.venue.VenueClientPort over the CT-19 command and CT-20 event and reconciliation shapes, owns its versioning, and ships THREE V1 implementations — the cTrader client composed around qmf-venue's concrete typed values, TN-21's replay adapter, and TN-23's FEAT-0023 venue conformance double, which must implement the same port or the conformance suite proves nothing about the port. THE IMPLEMENTATION IS SELECTED BY THE PAIR (world, VenueId) AND NEVER BY VenueId ALONE (line 51 ruling 6): world = replay selects the replay implementation for every VenueId and the composition REFUSES to bind any venue-connecting implementation into a replay composition, because a replay of a recorded IC Markets day must never resolve to the cTrader client. qmf-venue is NOT amended to carry the port, and realizing the seam inside qmf-venue instead is recorded as a candidate AD-28 parent annotation for the documentation factory — surfaced, never settled by a child; TN-2, TN-5, TN-21 and TN-22 say 'the port' and mean this one. CONNECTIONS ARE KEYED BY (venue, environment) under the cTrader platform cap of one demo plus one live with accounts multiplexed, and THE CONNECTION COUNT IS DERIVED FROM THE ROSTER — one connection per (venue, environment) pair the roster names, never a fixed requirement — so a soak roster naming the demo pair alone opens one connection and the week runs before live credentials exist (TN-9), while SessionTopology's shipped required_connection_count = 2 ClassVar is a qmf-venue increment item to relax (A37); a connection fault blocks EVERY command stream bound to that connection, enumerated from the roster at Compose. THE NODE FILLS THE 19 UNFILLED CT-18 FIELDS, marking each static or measured-at-connection, with the load-bearing rows named rather than counted because each is verify-or-refuse and several gate bind time: the position model netting | hedging per account (measured at connection; it decides scope resolution and the fill-to-virtual-position attribution requirement), account settlement currency, the margin model with leverage and the venue's own margin-call and venue_liquidation level, the instrument value-factor surface, amend atomicity, protective-stop attachment form per order type (the field TN-6's placement rule reads, whose absence under a Book that requires attachment is an unsupported capability refusal), venue-managed trailing support, the reconciliation lookback declaration, acknowledgement mode per command kind (whose consequence binds the node's outcome path — an outcome is never derived from absence alone), and throttle_scope. ERROR-MAP ROWS ARE PINNED, an unmapped code defaulting to (transient venue failure, retryable = no, outcome = UNKNOWN) plus an alarm, and a requote is an ordinary mapped venue rejection through that table with no separate vocabulary and no separate path. EQUITY DERIVATION is balance plus per-VENUE-position unrealized P&L using the venue's own converted figures with converted_by = venue provenance and no QMX conversion, in TN-10's exact scaled-integer domain at the account's declared money exponent, each figure decoded at its own declared exponent and re-scaled exactly, a missing or unscalable exponent refusing rather than approximating; this series is the account and reconciliation view and is NOT the per-Book kill-line series of TN-8. Session duties run on the node scheduler (TN-4); TOKEN REFRESH IS KEYED BY CREDENTIAL REFERENCE, NEVER BY CONNECTION (TN-12), with retry-after-refresh confined to requests carrying no command identity (line 51 ruling 8); command retry is prohibited and session recovery never resubmits. VENUE MAINTENANCE WINDOWS ARE NOT A FOURTH CONTROL-WINDOW KIND — a down session or dead feed already fails closed FOR ENTRIES under L39's authorized narrowing of AD-28's sensing-outage rule, with no silent failover and the maintenance timestamp journaled as data quality — a conscious divergence from reviewer recommendation QB1a to treat an announced window as a dead-zone window, whose accepted consequence is that an announced window does not proactively block entries ahead of the disconnect; the continuous D1-boundary monitor re-verifies at a configurable cadence (evidence: daily and across DST transitions). THE TRENDBAR BASIS (ticket 006) is measured per broker at first connection as already ratified — secondary web evidence says BID, a Spotware moderator on the official forum with no documentation page — and until it is recorded, backtest-to-live comparisons are TICK-based and never trendbar-based. BINDS qmn/venue/ctrader. PREVENTS Twisted or SDK code entering the runtime, a third connection, a second venue client, an equity number nobody computed, bars trusted before measurement."
    cite: "SRC-11:.memlog.md#line-26"
    topics: [trading-node, tn-11, ctrader, qmf-venue-increment, venueclientport, ct-18, equity-derivation]
    authority: rider

  - id: EXT-2105
    type: decision
    summary: "TN-12 SECRETS — two-layer store, the provisioning wizard, rotation by credential reference, the drills (as amended by the operator ruling and both gates): references never values above the connection manager (L34 / AD-26), and the node's SecretStore implements qmf-core's port with read plus atomic replace. THE VPS STORE HAS TWO LAYERS: systemd-creds LoadCredentialEncrypted=, sealed with an explicit --with-key=host and never the default --with-key=auto (which silently binds a TPM2 where the VPS exposes one and reintroduces exactly the migration fragility this design rejects; line 46 ruling 12), delivers at service start a node key-encryption key (KEK) and the bootstrap credentials — client id and secret, the initial access and refresh tokens, the cTID account ids, and the escrowed CT-14 payload key — while the node keeps ROTATED material (the refresh token dies on use, the access token lives roughly 30 days) under /var/lib/qmx/state as AEAD ciphertext under the KEK, so rotation is ordinary unprivileged file I/O for the qmx service account with no root and no code change, under store-before-discard, a failed store after rotation raising an alarm and blocking ENTRIES ONLY while sensing, exits and protective acts continue (L39). HOST-KEY SEALING SURVIVES reboot, migration and rotation but does NOT survive VPS death — the host key is a file on the VPS disk, and TPM2 would not survive it either — so the seal buys reboot-and-rotation determinism and nothing more, and disaster recovery rests on the escrow rule instead. BACKUP PAYLOAD KEY CUSTODY IS RULED, not left to a variable (line 46 ruling 2): the CT-14 payload key that decrypts every off-host copy is generated at provisioning ON THE WORKSTATION, escrowed in Windows Credential Manager under qmx/backup-payload-key plus one operator-held offline copy, and delivered to the VPS as a bootstrap credential — it is NEVER VPS-minted, the VPS-minted KEK protects rotated SESSION material only, and backup_payload_key_custody carries that text as its rule rather than a blank. THE WORKSTATION's Windows Credential Manager qmx/* store, read through keyring's WinVaultKeyring, is the PROVISIONING SOURCE, the payload-key escrow and the home of workstation-local secrets only — bootstrap material, never rotated live session material — because after provisioning the VPS session is the ONE live refresher and the only holder of live session state: the laptop's copy of the refresh token is dead the moment the VPS refreshes, the wizard says so, and the wizard REPORTS WHICH qmx/* ENTRIES ARE NOW STALE so the boundary is auditable rather than assumed. TOKEN REFRESH IS KEYED BY CREDENTIAL REFERENCE AND NEVER BY CONNECTION (line 46 ruling 7): at most one refresh is in flight per credential reference, every session sharing that credential is a READER of the rotated access token rather than a refresher, the refresh duty is owned by the connection manager as a whole and never by a session, it executes store-before-discard against SecretStore.atomic_replace and republishes the new access token to every session bound to that credential before any of them reissues a request, and whether demo and live share one cTID credential is a declared roster fact per credential reference verified at preflight (two declared credentials run two independent refreshers, one runs exactly one). An authentication failure attributable to a rotation in flight is a RETRY-AFTER-REFRESH condition and never an UNKNOWN, but ONLY for requests carrying no command identity — session auth, account auth, subscription, heartbeat, gap replay and the reconciliation read-back (line 51 ruling 8) — while a place_order, amend_protection, cancel_order, close_position or close_all meeting an authentication failure is NEVER retried and takes the ordinary submission-deadline path, minting UNKNOWN where it has passed wire handoff and a typed veto-path refusal where it has not, so TN-11's prohibition on command retry has no exception. THE WIZARD is the operations toolkit's just node-secrets-provision recipe, a human-only step run on the laptop (the operator's no-command-line ruling at line 48 Q1, applied at line 49; the original entry's 'qmn secrets provision' command is superseded history): it reads each qmx/* entry and streams the value over an SSH session's stdin straight into systemd-creds encrypt --with-key=host --name=<ref> on the VPS — never argv, never a file, never echoed, never logged — mints the KEK on the VPS, delivers the escrowed payload key, fetches the ctidTraderAccountId list from the access token when those entries are absent, and verifies by asking the node for is_set metadata only; ITS PRIVILEGE PATH IS DECLARED, since writing /etc/credstore.encrypted needs root, so provisioning runs over a dedicated key-only SSH identity restricted to a single passwordless-sudo provisioning command, with no interactive root login, no password anywhere, and that identity distinct from the operator's ordinary SSH key. FOUR NAMED SECRET HOLDERS EXIST ON THE VPS AND NO FIFTH: the connection manager holds venue session material (client id and secret, access and refresh tokens) as its one in-memory holder; the backup unit holds the CT-14 payload key and the object-storage credentials for the duration of one backup or drill run; the observability path holds the notification-channel token; and the separate zero-authority OBSERVABILITY STACK under its own service account (TN-15) is the DECLARED FOURTH holder of its own Grafana admin credential and any log-shipper auth token, delivered by its own LoadCredentialEncrypted line and holding nothing the node holds (line 51 ruling 13) — none of the latter three ever holds venue session material, no other component on the VPS holds any secret value, each unit receives only the credentials its role names, and the provisioning wizard is carved out as a TRANSIENT workstation-only holder for the duration of one run so the VPS invariant stays checkable rather than quietly false. THE WORKSTATION INSTALLATION IS PROVISIONING-ONLY AND ENFORCED, NOT ASSERTED (line 51 ruling 18): the composition root REFUSES to compose on any host whose declared machine tuple is not the deployment roster's VPS entry, the SecretStore REFUSES to construct a venue-session holder off that host, and a tier-1 check assertion proves the wizard module imports neither the connection manager nor the refresh duty — without these three, any workstation script that composed a root would refresh the token and kill the VPS session mid-trade. THE COMPROMISE DRILL is anchored on cTID re-authorization, which invalidates all refresh tokens, then application-credential reset, store replace and session restart, tested with demo credentials only, sandboxes never holding live secrets. NEW DEPENDENCY: cryptography (Apache-2.0/BSD dual) for the KEK layer AND CT-14's PayloadCipher, registered in DEPENDENCIES.md. BINDS qmn/secrets, deployment. PREVENTS a secret in argv, a file, scrollback or a log; a laptop tool locking the VPS out mid-trade; a rebuild losing every credential."
    cite: "SRC-11:.memlog.md#line-27"
    topics: [trading-node, tn-12, secrets, systemd-creds, kek, payload-key-escrow, provisioning-wizard]
    authority: rider

  - id: EXT-2106
    type: decision
    summary: "TN-13 LIVE DATA, HISTORY BOOTSTRAP, THE NEWS CALENDAR, BACKUP AND THE THREE RESTORE DRILLS (as amended by the operator ruling and both gates): live ticks, bars and depth enter as CT-10 source observations through qmf-data's CT-15 intake into the LIVE world room under the venue WriterId — machine, adapter role, VenueId, account — written THROUGH the TN-5 accumulator, which is the single first writer, so this module owns the intake and the room and never a second write of the same observation; the feed is the pinned canonical sensing feed with no silent sibling failover, receive-wall and monotonic stamps are mandatory because the venue exposes no server clock, and the venue is also a source. POSITION AND BALANCE READ-BACKS ARE CT-20 OBSERVATION KINDS journaled onto the EXISTING seven AD-21 event types through CT-20's versioned mapping table — never a new journal type and never a second event catalog (line 51 ruling 27) — entering through the same intake under the same writer and read by TN-11's equity derivation and TN-10's reconciliation folds rather than through any side channel, with the mapping-row addition proposed as a parent annotation and never asserted. HISTORY BOOTSTRAP at first install is the operations toolkit's just node-data-bootstrap recipe: download-once through qmf-data's Dukascopy adapter into the immutable raw archive, license-tagged personal-use (DEC-0170), idempotent, checkpointed and resumable, with venue tick history (5 requests per second, one-week span cap) as the recent-window continuity bridge for the gap between the archive's last window and go-live ONLY and never a routine backfill source; THE TWO TICK SOURCES STAY SEPARATELY IDENTIFIED AND ARE NEVER MERGED, disagreements where the bridge overlaps the archive recorded as AD-21 corroborates and disagrees-with edges, which is also what makes TN-11's tick-based interim comparison honest. THE NEWS CALENDAR IS RULED by the operator 2026-08-28 ('I will not pay for news'): the recorder is re-homed from the Windows Scheduled Task to the systemd timer qmn-news-calendar.timer — named for its kind, because the bare word names three things — calling the ratified ingest adapter (CalendarFeedTransport, decode_calendar_snapshot, idempotent intake with provider-native (source, id, revision) identity and revisions), and FOREX FACTORY'S FREE WEEKLY FILE IS THE SOLE V1 SOURCE because it carries the impact label the blackout needs: there is NO paid fallback slot and none is ever minted, the later path being a second FREE source or an agent-scraped JSON delivered in the same CT-15 intake shape (the intake shape is the seam, so a second source is an adapter and a config row and never a code path through the blackout), the legal archiving posture staying an open operator item recorded as personal use, and a failed refresh blocking entries fail-closed with no live skip button. REFRESH CADENCE IS A CONFIGURABLE because all three sessions are traded and timeliness matters: news_calendar_refresh_cadence is a configurable node variable with a duration unit-kind (evidence value: every 2 h and before each session open), the scheduler respects the free feed's roughly 2-downloads-per-5-minutes limit with a configured cadence that would breach it REFUSED at config compile rather than silently throttled, and the recorder's retry policy is declared rather than left to the implementer — at most news_recorder_max_attempts per timer firing with news_recorder_backoff, both configurable and blocks-boot, counted against the same provider budget, with a provider rate-limit or block response journaled as data quality, alarmed on the silent-degradation class and NEVER retried inside the same firing, since a retry loop on the sole V1 source could get the host blocked and fail-close entries indefinitely (line 51 ruling 7). A MARKET-HOURS, DAY-BOUNDARY OR NEWS-CALENDAR CODE IDENTITY is sealed into composition_fp while the dated snapshot DATA those recorders ingest is not (TN-2) — snapshots are ordinary append-only observations read as of the slice frontier, so a twice-hourly data refresh never requires a restart while a code change does — staleness fails closed by the per-decision-cycle precondition news_calendar_max_staleness rather than by a signal the timer sends, a revision may only WIDEN or ADD an in-force or same-day window automatically (narrowing, downgrading, delaying or removing one takes effect no earlier than the superseded window's end and is otherwise an operator act), and the 12-month seal is enforced at every read boundary unchanged (holdout_months = 12, do-not-default, enforced on restored reads too). BACKUP IS PUSHED BY THE VPS: qmn-backup.timer runs nightly, the CT-14 primitives produce encrypted versioned copies through PayloadCipher under the escrowed workstation-minted payload key of TN-12, and the V1 ObjectStorage implementation is local staging under /var/lib/qmx/staging plus rclone to an S3-compatible bucket whose provider is deployment configuration (recommendation Backblaze B2; alternatives R2, Wasabi) with credentials by reference. THE BACKED-UP ROOM SET IS NAMED — the immutable raw archive, every journal room, the registry room, and the evidence tier's sealed-archive role and research door, for EVERY world, the processed room being rebuildable and excluded unless a result label cites it — and THE COPY IS ALWAYS A PREFIX OF A REAL STREAM: the backup unit copies only journal segments sealed at a committed sequence boundary, reading each stream's last committed sequence from the running node over the evidence channel, an open segment copied to its last sealed boundary with that boundary recorded in the backup manifest, because otherwise a restored room can hold a torn record and verify-before-purge verifies the copy against itself. THREE RESTORE DRILLS RUN, all journaled as data quality with failures alarming on the silent-degradation push class and never silently retried, each with its own unit so one timer never carries two cadences (line 51 ruling 16): a nightly SAMPLE restore right after the backup under qmn-restore-sample.timer, pulling one file back and verifying its fingerprint, sharing the backup run's payload key; a monthly FULL restore into a scratch directory under qmn-restore-full.timer, fingerprint-verified, an integrity test and only that; and a HOST-LOSS RESTORE REHEARSAL that is not a timer at all but the operator's restore_drill_run power (TN-17), run once before the live milestone and after every rebuild, restoring from the bucket onto a clean host holding nothing but the escrowed payload key — the only drill that exercises key availability and therefore the only one that can prove DR — never over the only copy and never over live evidence. TWO RTO NUMBERS are recorded apart and never conflated: the integrity-restore RTO measured at the monthly rehearsal, and the full-DR RTO measured at the host-loss rehearsal including VPS re-procurement, re-provisioning and key recovery; RPO is 24 h by construction, RTO is MEASURED and never declared, the backup set's retention depth is a configurable variable (evidence: 90 days versioned) while evidence itself is retained forever (NFR-06). A VPS-LOSS RUNBOOK IS A REQUIRED NODE ARTIFACT: procure, bootstrap uv and CPython, provision, cTrader re-authorization because the stored refresh token is spent, restore with the escrowed key, then a replay check against a recorded day. CAPACITY IS A DECLARED DIMENSION, not a metric: the VPS carries a declared disk budget with bytes-per-day of tick, bar, depth and journal growth MEASURED and recorded at the soak and never estimated; hot rooms purge only after a verified off-host copy exists, under hot_room_retention_window, since the evidence tier shares the machine and a same-disk sync frees nothing by itself; a disk_headroom_min threshold mints no-new-entry BEFORE the disk-full block arrives and pushes on the silent-degradation class so headroom is bounded by design rather than watched; and vps_disk_budget's line items are named and each separately capped — journald SystemMaxUse, room retention, backup staging, the per-commit trees under /opt/qmx with their declared prune depth, the reserved protection-intent extent under /var/lib/qmx/state, and /var/lib/qmx-observability, which additionally carries its own filesystem quota so a zero-authority stack can never consume the headroom disk_headroom_min protects. REGISTRY ROWS MINTED: backup_recovery_point_objective, backup_recovery_time_objective_integrity, backup_recovery_time_objective_full_dr, backup_retention_period, restore_verification_cadence, backup_object_storage_provider, backup_payload_key_custody, hot_room_retention_window, disk_headroom_min, vps_disk_budget, news_calendar_refresh_cadence and news_calendar_max_staleness — superseding the original entry's backup_recovery_time_objective and backup_key_custody. BINDS qmn/data, the deploy timers. PREVENTS a live feed with no evidence home, an untested backup, a lost news-calendar week, a provider baked into code."
    cite: "SRC-11:.memlog.md#line-28"
    topics: [trading-node, tn-13, live-data, history-bootstrap, news-calendar, backup, restore-drills, capacity]
    authority: rider

  - id: EXT-2107
    type: decision
    summary: "OPERATOR RULING 2026-08-28 (Q1) — NO OPERATOR COMMAND LINE FOR THE TRADING NODE, and the operations toolkit that replaces it (the ruling entry that amends TN-1, applied at desk by the amendments entry at memlog line 49; dictated brain dumps quoted faithfully and distilled; supersedes A1): the operator ruled that 'there is nothing like commands or anything... it's a user interface on the desktop application as per the overall architecture' — killing, status, resolving a stuck order and promotion are UI actions over the node's API door, over the same connection logic the agentic system will use ('the same setting or the same logic behind even the agentic system'), the node appearing inside that UI as its own surface ('it might have its own page... I'm not certain yet'), and the priority stated as 'first, make the trading node work, make sure it can execute'. CONSEQUENCE AS RECORDED: Door 2 — an operator qmn command line — is DELETED; the control surface is the Python API in-process plus the localhost HTTP evidence channel and the unix-socket powers channel, UI-consumed later; the closed PRD row (PRD FR-046 / DEC-0159 / DEC-0185 Ruling C — qmb is the platform's single command-line surface) is HONORED and NO reconciliation note is needed, so the first gate's CLI reconciliation note and its rewritten operator question (memlog line 46 ruling 5, which had offered a qmn command on the VPS, a qmb node proxy distribution, or API-and-HTTP-doors-only) are WITHDRAWN. DEPLOYMENT AND PROVISIONING TOOLING — install, switch and rollback, the secrets wizard, the data bootstrap, replay, config init / validate / explain, notify test — becomes an OPERATIONS TOOLKIT exposed as just recipes in the repo's existing justfile (just node-…), NEVER a product command line and NEVER a trading control: DevOps tooling, which the operator ruled is 'a very separate system, like how big tech teams work'. THE PACKAGE AND IMPORT NAME STAYS qmn AS A CODE NAME, the operator having DECLINED to rule naming: 'that question is not for this layer'. The amendments entry applied this at desk with TN ids stable — TN-1 loses the operator command line, gains the just node-… toolkit under qmn/deploy and withdraws the CLI reconciliation note; TN-17 deletes Door 2 and leaves the Python API, the localhost HTTP evidence channel and the unix-socket powers channel (SO_PEERCRED) as the doors, consumed by the desktop UI over an SSH tunnel later and by the toolkit's few read and act calls during the soak, with the wire vocabulary versioned and to be aligned with the QMA daemon-to-UI wire-contract conventions once that spine fixes them (coordination note, cheap veto A39); the open-questions section becomes 'Operator rulings 2026-08-28' and the assumption register marks A1 RULED and NARROWED. SUPERSEDES every pre-ruling memlog mention of a qmn command; that text is history and is never presented as current."
    cite: "SRC-11:.memlog.md#line-48"
    topics: [trading-node, tn-1, operator-ruling, no-command-line, operations-toolkit, doors]
    authority: rider

  - id: EXT-2108
    type: decision
    summary: "OPERATOR RULING 2026-08-28 (Q2) — THE SOAK IS ONE FULL UNATTENDED WEEK, AND TRACKING IS MANDATORY THROUGHOUT (the ruling entry that amends TN-9, applied at desk by the amendments entry at memlog line 49; supersedes A10): the operator ruled 'two days to a week... I think a week is enough and sufficient' — THE SOAK IS ONE FULL WEEK, unattended, on the demo account, COINCIDING with the ratified first-deploy warm-up week (one attribution, one rider, never a soak nested inside a longer rider), with LIVE BINDING AT ITS END. TRACKING IS MANDATORY THROUGHOUT, Prometheus/Grafana-class ('I know what you're talking about'): THE OBSERVABILITY STACK IS A SEPARATE ZERO-AUTHORITY SYSTEM — Prometheus plus Grafana plus Loki/Promtail-class — with containers allowed for THIS stack ONLY, its compose file shipped under qmn/deploy/observability/ and scanned by Skylos, consuming the node's exported metrics and JSON logs; the node ships the exporters plus dashboard-as-code seeds, and a dedicated monitoring agent (the operator's 'Hammers agent') attaches to that stack later, which is explicitly not this sitting's concern — that half of the ruling lands on TN-15, not on TN-9. The amendments entry applied the duration at desk with TN ids stable: TN-9 — the soak is the full first-deploy warm-up week, unattended, on the demo account, live binding at its end, ACCEPTANCE CHECKLIST UNCHANGED; TN-15 — the observability stack is a separate zero-authority system shipped as a compose file under qmn/deploy/observability/ (containers permitted for this stack only, versions pinned at the implementation gate and registered as external tools), the node shipping exporters and dashboard seeds while the external dead-man's switch and the push channel stay; the assumption register marks A10 RULED. SUPERSEDES the pre-ruling TN-9 text, which made the roughly two-day soak the first two days of the ratified roughly one-week warm-up rider."
    cite: "SRC-11:.memlog.md#line-48"
    topics: [trading-node, tn-9, operator-ruling, soak, warm-up-week, observability-stack]
    authority: rider

  - id: EXT-2109
    type: decision
    summary: "OPERATOR RULING 2026-08-28 (Q4) — 'I WILL NOT PAY FOR NEWS': FOREX FACTORY'S FREE WEEKLY FILE IS THE SOLE V1 NEWS-CALENDAR SOURCE (the ruling entry that amends TN-13, applied at desk by the amendments entry at memlog line 49; supersedes A17): the operator ruled in his own words 'I will not pay for news' — Forex Factory's free weekly file is the SOLE V1 source, there is NO paid fallback slot and none is ever minted, and the later fallback path is named rather than left open: a second FREE source, or an agent-scraped JSON delivered in the same CT-15 intake shape ('later versions, yes, we're going to iterate'), so a second source is an adapter and a config row and never a code path through the blackout. BECAUSE ALL THREE SESSIONS ARE TRADED, TIMELINESS MATTERS: the refresh cadence becomes a CONFIGURABLE (evidence value: every 2 h and before each session open) with the free feed's roughly 2-downloads-per-5-minutes limit respected, and FAIL-CLOSED ON A FAILED REFRESH STANDS. The amendments entry applied this at desk with TN ids stable: TN-13 — Forex Factory's free weekly file is the sole source, no paid slot, news_calendar_refresh_cadence minted configurable (evidence: 2 h plus pre-session), and a second free source or an agent-scraped JSON in CT-15 shape named as the later fallback; the assumption register marks A17 RULED. SUPERSEDES the pre-ruling TN-13 text, which carried a paid impact-carrying fallback slot (FMP / Trading Economics class) as configuration: that slot is deleted and is never re-minted."
    cite: "SRC-11:.memlog.md#line-48"
    topics: [trading-node, tn-13, operator-ruling, news-calendar, forex-factory, free-source-only]
    authority: rider
