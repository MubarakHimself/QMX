id: CT-45
name: QMA ModelDeployment and Credential Broker port contract
status: ratified
version: 1  # first minted format version; CT-45 is the qma-core ModelDeployment port plus the Credential Broker surface newly minted by the 2026-08-28/29 QMA architecture sitting (AD-15, DEC-0314; AD-24, DEC-0323), absorbed on the operator's order SRC-15 (DEC-0344); model_family made optional is the 2026-08-29 validation fix (DEC-0329)
owner: COMP-QMA-CORE  # the ModelDeployment port, the ModelClass request/capabilities shapes, ReviewPolicy and the Credential Broker allowlist are qma-core DEFINITIONS; qma-daemon runs the deterministic proxy chain and the broker resolution while a plugin contributes a model_deployment as an AD-1 multi contribution, so ownership is qma-core-side and every runtime concern enters through this core-defined port (DEC-0335, DEC-0344)
consumers: []  # consumer-blind by design: the port is a qma-core definition bound at the AD-1 contribution point; qma-daemon calls it and a plugin provides the deployment, so no package import edge is minted from this doc (DEC-0335, DEC-0344, DEC-0300)
active_consumers: []
intended_consumers: [COMP-QMA-DAEMON]  # qma-daemon is the sole process that runs anything and the sole caller — it runs the deterministic ModelClass -> Deployment -> Credential Broker chain and resolves references from the OS secret store; a model_deployment is contributed through the daemon's loader as an AD-1 multi contribution, never a package import (DEC-0335, DEC-0300, DEC-0344)
wiring_status: defined-unwired  # ratified port surface; no code exists; a deployment binds only through the daemon's plugin loader as an AD-1 `model_deployment` multi contribution, and no wiring is authorized from this doc (DEC-0344, DEC-0335)
layer_from: backend
layer_to: backend
decisions: [DEC-0314, DEC-0344, DEC-0323, DEC-0300, DEC-0309, DEC-0325, DEC-0322, DEC-0302]
gaps: [GAP-0087]  # GAP-0087: the Claude Agent Python SDK in-process hook count (7 vs 10) and whether it binds any QMA adapter — bounded by the Cut on foreign agent runtimes and carried to a later sitting that specifies AD-15 Deployment adapters; nothing in this contract depends on it (DEC-0344)
purpose: >-
  The one qma-core ModelDeployment PORT and the Credential Broker surface that make every
  model call a deterministic chain ModelClass -> Deployment -> Credential Broker and never
  an LLM deciding where prompts go (DEC-0344). A ModelClassRequest names one of exactly
  four `ModelClass` values and its `needs` flags plus `min_context_tokens`; a Deployment
  declares its adapter, `auth_mode`, an optional operator-assigned `model_family` and a
  loopback bind for the local-proxy case; the router selects two-stage without ever
  crossing a class boundary, load-balances under a routing policy, and returns
  `ModelCapabilities` to the Context Compiler. The Credential Broker resolves references —
  never values — from the OS secret store behind a code-declared allowlist, holds no
  ambient authority, and refuses any reference outside its scope. Its purpose is that the
  harness picks the class, an agent never names a vendor, a silent capability downgrade is
  impossible, and venue/broker/exchange/trading-node/platform-registry credentials are
  resolvable by no QMA component.
invariants:
  - "CT-45 is a qma-core PORT plus a qma-core-defined broker surface, definitions only, owned by qma-core; qma-daemon runs the deterministic chain and the broker resolution and is the sole caller, and a plugin contributes a `model_deployment` as an AD-1 multi contribution through the daemon's loader — no package import edge is minted from this doc (DEC-0335, DEC-0344, DEC-0300)."
  - "DETERMINISTIC CHAIN, NEVER AN LLM: a ModelClass request resolves against the Deployment Registry, whose credentials resolve through a SEPARATE Credential Broker; the router is a load balancer, not another LLM deciding where prompts go (DEC-0314, DEC-0344)."
  - "FOUR CLASSES: `ModelClass` has exactly four SCREAMING_SNAKE values — REASONING_HIGH, WORKHORSE_GENERAL, CODING_HIGH, FAST_CHEAP — a cost and difficulty tier; the harness picks the class and an agent NEVER names a vendor (DEC-0314, DEC-0344)."
  - "TWO-STAGE SELECTION, NO CLASS BOUNDARY CROSSING: stage one the requested `ModelClass` selects the candidate pool (the deployments registered under that class, and only those); stage two the request's `needs` flags (tools, vision, reasoning_effort, parallel_tool_calls) plus `min_context_tokens` are the SOLE eligibility filter. The router never falls back to a deployment outside the requested class nor to one failing `min_context_tokens` or any `needs` flag — this is what makes a silent capability downgrade IMPOSSIBLE rather than merely discouraged (DEC-0314)."
  - "EMPTY POOL: an empty filtered pool returns the typed refusal `NoEligibleDeployment` naming the class and the unmet constraint; the router never substitutes across the class boundary to fill it (DEC-0314)."
  - "ROUTING POLICY: within the eligible pool the router load-balances under a routing policy of exactly `failover`, `weighted_round_robin`, `quota_lowest` or `fill_first`, and returns `ModelCapabilities` to the Context Compiler (DEC-0314)."
  - "MODEL_FAMILY IS OPTIONAL (2026-08-29 validation fix): every Deployment carries an OPTIONAL, operator-assigned `model_family` field — unset at registration, never defaulted and never synthesized, independent of `ModelClass` and of the provider account, registered under AD-26 — the allowed value enum is registry-homed under registry:deployment.model_family (set by an operator-principal `variable.set`, AD-24), while the per-Deployment assignment is optional, an operator-assigned field of the Deployment record. AD-10's ReviewPolicy compares that field and the daemon returns `NoEligibleReviewer` when none qualifies; a deployment whose family is unassigned is routable but INELIGIBLE for every ReviewPolicy comparison (DEC-0314, DEC-0325, DEC-0309)."
  - "PLUGIN CONTRIBUTION SPLIT: a plugin-contributed `model_deployment` (AD-1 multi contribution) registers with NO `model_family`; the field is assigned only by an `operator`-principal command (AD-24), and a manifest declaring one is refused at load naming the plugin id and the field — the same split AD-16 applies to a `tool_adapter` desk-and-role binding (DEC-0314, DEC-0323)."
  - "OPENCODEX BEHIND THE DEPLOYMENT CONTRACT: OpenCodex is the FIRST ModelDeployment implementation and sits BEHIND the Deployment contract and deliberately NOT behind the Credential Broker, as the first implementation for OAuth and subscription-pool providers; each provider combination becomes one Deployment with a QMA-owned capability record, and QMA emits its own routing-decision telemetry (DEC-0314, DEC-0344, DEC-0322)."
  - "LOCAL-PROXY CUSTODY: a Deployment whose implementation is a local proxy carries `auth_mode: none` on the QMA side — QMA passes it no credential and NO QMA-resolved secret value ever crosses into the proxy's process; the proxy's own provider credentials are its own custody OUTSIDE QMA's namespace, never read, copied, migrated or referenced (this is what makes the proxy a deployment rather than a second secret store) (DEC-0314, DEC-0344, DEC-0323)."
  - "LOCAL-PROXY LOOPBACK BIND (AD-15, surfaced assumption — operator-overridable, GAP-free cheap veto V3): the daemon permits a proxy Deployment ONLY when it binds loopback (127.0.0.1 or ::1) on the daemon's host, verified at registration; any non-loopback or remote proxy is refused with `NonLoopbackProxy`. A loopback proxy accepting unauthenticated connections is permitted only by the AD-26 configurable registry:proxy.allow_unauthenticated_loopback (default true, ui-editable) and refused with `UnauthenticatedProxy` when that variable is false; at every startup the daemon records an evidence entry naming each registered proxy Deployment and the value of that setting (DEC-0344, DEC-0314, DEC-0325)."
  - "MULTI-ACCOUNT POOLING (AD-15, surfaced assumption — cheap veto V4): QMA NEVER pools accounts itself; where pooling exists it happens inside the operator's own proxy under the operator's own account terms, QMA registers each proxy target as ONE logical Deployment and records the true deployment honestly on every routing decision (AD-23); no QMA component spreads, rotates or masquerades accounts (DEC-0344, DEC-0322)."
  - "CREDENTIAL BROKER — REFERENCES NEVER VALUES: the Credential Broker resolves references from an OS secret store behind a backend interface; Windows Credential Manager is the first and only v1 backend (L34) and a second is admitted when the host OS changes; components handle credential reference strings (`credential_ref`), never values (DEC-0323)."
  - "BROKER ALLOWLIST IS CODE, DEFAULT-DENY: the broker's scope is a CODE-DECLARED allowlist shipped in qma-core — model and inference providers, compute and sandbox providers, corpus and knowledge sources, telemetry sinks; venue, broker, exchange, trading-node and platform-registry credentials are OUTSIDE QMA's namespace and resolvable by NO QMA component under any Role, Mission, plugin or permission mode, and a reference not on the allowlist returns the typed refusal `CredentialOutOfScope` naming the reference. The allowlist is source code — never settings, never a plugin contribution, never a UI-editable variable, never widened by a Mission (DEC-0323, DEC-0344)."
  - "BROKER HOLDS NO AMBIENT AUTHORITY: it resolves by EXACT reference and never enumerates, searches, lists or globs the OS secret store (DEC-0323)."
  - "EGRESS RULE: a resolved secret value exists only inside the model-proxy or provider-adapter egress call frame and is never stored on, attached to or reachable from any object handed to a hook, plugin or graph; broker resolution is callable ONLY from the adapter layer; the hook and plugin context type exposes credential reference strings exclusively; secrets are excluded from `updated_input`, `updated_output` and `injected_context` by a schema check rather than author discipline; a local-proxy Deployment is the outward half — `auth_mode: none`, no QMA-resolved value crosses into its process (DEC-0323, DEC-0314)."
  - "AUTHORITY BOUNDARY — what this contract may never do: the router never crosses a `ModelClass` boundary or substitutes a downgraded deployment; the broker never resolves a venue/broker/exchange/trading-node/platform-registry credential, never enumerates the secret store, and never hands a secret VALUE to a hook, plugin or graph; a machine principal never assigns `model_family` or a `tool_adapter` binding; and no QMA-resolved secret crosses into a local proxy (DEC-0314, DEC-0323, DEC-0344)."
schema:
  type: model-deployment-port + credential-broker  # a qma-core-defined runtime port and broker surface (definitions only): the ModelClassRequest, the Deployment record, ModelCapabilities, ReviewPolicy, the routing policy enum and the Credential Broker allowlist and resolution surface, implemented by qma-daemon and OpenCodex as the first Deployment (DEC-0344, DEC-0335)
  operations:
    - "resolve(ModelClassRequest) -> Deployment | NoEligibleDeployment: two-stage selection within the requested class only; empty pool returns NoEligibleDeployment naming the class and the unmet constraint (DEC-0314)"
    - "route(eligible_pool) -> Deployment: load-balances under the routing policy (failover | weighted_round_robin | quota_lowest | fill_first) and returns ModelCapabilities to the Context Compiler (DEC-0314)"
    - "select_reviewer(ReviewPolicy) -> Deployment | NoEligibleReviewer: compares the operator-assigned model_family; a deployment with an unassigned family is ineligible for every comparison (DEC-0314, DEC-0309)"
    - "broker.resolve(credential_ref) -> egress-frame secret | CredentialOutOfScope: exact-reference resolution from the OS secret store, callable only from the adapter layer, refusing any reference off the code-declared allowlist; never enumerates, searches, lists or globs (DEC-0323)"
  fields:
    - "request.model_class: one of the four ModelClass values; selects the candidate pool and the router never crosses the class boundary (DEC-0314)"
    - "request.needs: the eligibility flags tools | vision | reasoning_effort | parallel_tool_calls, the sole stage-two filter beside min_context_tokens (DEC-0314)"
    - "request.min_context_tokens: the minimum context the deployment must supply; a deployment failing it is never substituted (DEC-0314)"
    - "deployment.adapter: the Deployment implementation; OpenCodex is the first, behind the Deployment contract and not behind the Credential Broker (DEC-0314, DEC-0344)"
    - "deployment.auth_mode: `none` — the value a local-proxy Deployment carries on the QMA side (no QMA-resolved secret crosses into its process); the spine mints no other auth_mode value, and a QMA-owned credential is carried as a broker-resolved `credential_ref` on the Deployment rather than as a second auth_mode token (DEC-0314, DEC-0323)"
    - "deployment.model_family: OPTIONAL, operator-assigned, unset at registration, never defaulted or synthesized; a plugin-contributed deployment registers with none; the allowed value enum is registry-homed under registry:deployment.model_family and the per-Deployment assignment is an operator-assigned field of the Deployment record (DEC-0314, DEC-0325)"
    - "deployment.loopback_bind: for a local-proxy Deployment, the verified 127.0.0.1 or ::1 bind on the daemon host; a non-loopback proxy is refused with NonLoopbackProxy (DEC-0344)"
    - "capabilities: the ModelCapabilities record the router returns to the Context Compiler for the selected deployment (DEC-0314)"
    - "review_policy.families: the AD-10 ReviewPolicy's family enum, registered under AD-26 (registry:review_policy.families); the daemon returns NoEligibleReviewer when no deployment's model_family qualifies (DEC-0314, DEC-0325, DEC-0309)"
    - "credential_ref: the credential reference string type qma-core exposes on the plugin/hook context (AD-1, AD-24); components handle references, never values (DEC-0300, DEC-0323)"
    - "broker.allowlist: the code-declared, default-deny allowlist in qma-core — model/inference providers, compute/sandbox providers, corpus/knowledge sources, telemetry sinks; never settings, plugin, UI-variable or Mission-widened (DEC-0323)"
  enums:
    - "ModelClass: REASONING_HIGH | WORKHORSE_GENERAL | CODING_HIGH | FAST_CHEAP — exactly four SCREAMING_SNAKE cost-and-difficulty tiers; selection never crosses the class boundary (DEC-0314)"
    - "needs flags: tools | vision | reasoning_effort | parallel_tool_calls — the stage-two eligibility flags beside min_context_tokens (DEC-0314)"
    - "routing policy: failover | weighted_round_robin | quota_lowest | fill_first — the closed set the router load-balances under within the eligible pool (DEC-0314)"
    - "auth_mode: `none` — the value a local-proxy Deployment carries on the QMA side (no QMA-resolved secret crosses into its process); the spine mints no other auth_mode value, and a QMA-owned credential is carried as a broker-resolved `credential_ref` on the Deployment rather than as a second auth_mode token (DEC-0314, DEC-0323)"
    - "model_family: OPTIONAL and operator-assigned; the allowed value set is the registry:deployment.model_family enum (AD-26); an unassigned family is routable but ineligible for ReviewPolicy comparison (DEC-0314, DEC-0325)"
    - "broker allowlist categories (code-declared, default-deny): model and inference providers | compute and sandbox providers | corpus and knowledge sources | telemetry sinks; venue, broker, exchange, trading-node and platform-registry credentials are OUTSIDE QMA's namespace and resolvable by no QMA component (DEC-0323)"
    - "typed refusals on this contract's paths, variants of `qmf-core`'s base (CT-04): `NoEligibleDeployment` (empty filtered pool, naming class and unmet constraint); `NoEligibleReviewer` (no deployment's model_family qualifies for a ReviewPolicy comparison); `NonLoopbackProxy` (a proxy Deployment binding a non-loopback or remote address); `UnauthenticatedProxy` (an unauthenticated loopback proxy while registry:proxy.allow_unauthenticated_loopback is false); `CredentialOutOfScope` (a credential reference not on the code-declared broker allowlist, naming the reference) (DEC-0314, DEC-0344, DEC-0323, DEC-0302)"
  units:
    - "min_context_tokens: a token count on the request; a deployment failing it is never substituted, never rounded down to a smaller-context deployment (DEC-0314)"
    - "proxy.allow_unauthenticated_loopback: a boolean AD-26 configurable (default true, ui-editable), evidence not a ratified constant; recorded at each startup against every registered proxy Deployment (DEC-0344, DEC-0325)"
    - "routing-decision telemetry: each routing decision records the true deployment honestly (AD-23), including the one-logical-Deployment mapping of a pooled proxy target (DEC-0322, DEC-0344)"
  nullability:
    - "model_family is ABSENT at registration and on every plugin-contributed deployment — an unassigned family is a declared absence (routable, ReviewPolicy-ineligible), never a synthesized or defaulted value, and a plugin manifest declaring one is refused at load (DEC-0314, DEC-0325)"
    - "auth_mode: none on a local-proxy Deployment is a declared value carrying no QMA credential; QMA passes such a deployment no secret and resolves none into its process (DEC-0314, DEC-0323)"
    - "a credential reference off the broker allowlist is a CredentialOutOfScope refusal, never a best-effort or ambient resolution; the broker never enumerates to find a near match (DEC-0323)"
    - "an empty eligible pool is a NoEligibleDeployment refusal, never a silent cross-class fallback or a downgraded deployment (DEC-0314)"
provenance_note: "CT-45 is newly minted by the 2026-08-28 QMA architecture sitting as the qma-core ModelDeployment port and the Credential Broker surface (AD-15, AD-24), absorbed into docs/ under the operator's order SRC-15 (2026-08-29); it realizes AD-15 (DEC-0314) and AD-24's secret custody (DEC-0323) with the model-proxy-chain ruling (DEC-0344), the AD-1 port/contribution cardinality and credential_ref type (DEC-0300), the AD-10 ReviewPolicy comparison (DEC-0309), the AD-26 registered variables model_family / proxy.allow_unauthenticated_loopback / review_policy.families / deployment.model_family (DEC-0325), AD-23's honest routing-decision telemetry (DEC-0322) and AD-3's no-parallel-base rule for the typed refusals (DEC-0302). `model_family` made OPTIONAL is the 2026-08-29 validation-pass fix, and the loopback-bind and no-pooling clauses were resolved from sources under the operator's meta-ruling delegation and are surfaced in the cheap-veto register as overridable. The spine is FINAL and its multi-round validation pass closed verified=true dry=true remaining=0 on 2026-08-29 (DEC-0329). The Claude Agent SDK in-process hook-count question is deferred and bounded by the Cut on foreign agent runtimes (GAP-0087); nothing in this contract depends on it. The contract is defined-unwired: no code exists, and implementation authorization arrives only through the factory pipeline. Nothing in this doc grants credential, order, promotion, live-money or destructive authority."
