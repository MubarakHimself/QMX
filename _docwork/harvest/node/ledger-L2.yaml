  - id: DEC-0210
    title: "The accounting boundary and the virtual ledger (TN-25)"
    statement: "The node RUNS the accounting period: everything here is per binding, and nothing here is a Book or BMS rule - the node executes them and does not invent them. The period calendar identity is DECLARED, never inferred: the accounting period is named by an account-scoped AD-8 DAY-BOUNDARY CALENDAR - the rule that answers only which day an instant belongs to for evaluation - carried in-band on every TradingDate it produces, never substituted for a market-hours calendar and never a fixed offset from broker server time. Each binding's VIRTUAL LEDGER is an append-only record stream written by the risk-domain writer (machine, risk role, binding) in the exact scaled-integer domain at the account money exponent, and it is the source AD-40 reads for book_capital and the source the kill-line series marks to market. TWO POSITION FOLDS ARE NAMED APART and every risk record declares which it references: a VENUE POSITION is observation-derived, whatever CT-20's fills and lifecycle events describe under the venue's declared netting or hedging model, while a VIRTUAL (Book) POSITION is a fold over fills joined by declared command identity - binding-scoped, Bot-attributed, minted at admission, carrying the frozen R faces - and is the unit of CT-29 exit records, AD-33's whole-trade attribution and AD-41's folds, with the sum of virtual positions reconciling against the venue's netted position through AD-27 reconciliation evidence. The netting attribution declaration is a BIND-TIME CHECK and the SET must be a PARTITION: where CT-18 declares netting the fill-to-virtual-position attribution rule is a mandatory Book declaration whose absence is a bind-time policy rejection, never a trade-time discovery and never an implementer's default, and the declarations across every binding on that account must be jointly exhaustive and disjoint, proved at compile with an invalid input refusal otherwise - which is what makes the reconciliation claim arithmetic rather than aspiration. NO SCALE-IN is restated where the fold lives: an entry against an instrument on which the binding already holds an open VIRTUAL position is a policy rejection at the door, so a netted account's shared venue position never masks it and no virtual position ever carries two admissions with two frozen R faces. r_unit_price is FIXED AT PERIOD START and not recomputed as the budget drains intraday unless the Book declares another cadence as r_unit_price_recompute_cadence (a configurable Book variable, blocks-role-live, whose absence is an invalid input refusal at AD-32 Layer 1), and it must declare one or two builds price the same intraday admission differently; book_capital is the binding's virtual-ledger equity at the period-open instant EXCLUDING unrealized P&L on open positions and is the sizing ladder's input only, never the kill-line breach series, with loss_runway, period_loss_budget, seat_loss_run_allowance and seat_r_ceiling deriving from it under AD-40's shape and no values stated here - while the kill-line series belongs to the protection set, kill_line_capital_floor IS AD-40's loss_floor (one variable, one name), declared by the Book definition and evaluated per binding against that binding's virtual-ledger equity marked to the latest observed price of its own virtual positions, on every slice carrying a fill or a price update on an instrument the binding holds and at every accounting rollover. ROLLOVER, SWEEP AND RE-SEED ARE OPERATOR-SIGNED JOURNALED TREASURY BOUNDARY ACTS, each minting an AD-16 treasury boundary-event record of the reserved kind (sweep, refund, re_seed, paper_epoch_reset) mapped onto AD-21's risk transition - NO MONEY MOVES WITHOUT ONE - and a boundary act never touches positions and never re-bases a frozen R, the only re-basing in V1 being AD-40's partial-entry-fill re-base, while a missed rollover is reconstructed from journals and appended as a correction. state_carry rides EVERY binding the node mints - a paper flip, a kill-line stand-down return, an activation, a BMS re-version and any config version whose diff touches a Book- or BMS-identity-bearing field - mandatory and non-defaultable per counter (ledger, cycle, budget, bench_counter, exposure), each carry or reset, absence being an invalid input refusal, carry legal only with a human-signed carries-ledger edge, and continues-performance asserting a track record while moving no money, neither edge ever inferred from the other. Floating P&L is an explained, named component of the equity narrative, is never swept and is NEVER a term in either reconciliation residual, and PAPER IS NOT EXEMPT: the paired demo binding keeps its own virtual ledger - frozen starting balance plus realized plus unrealized of its paper virtual positions - so a paper capital floor is evaluable, the frozen balance being what is never hand-adjusted and a reset minting an operator-signed paper_epoch boundary record."
    status: ratified
    rationale: "TN-25 has no memlog decision entry of its own: it was MINTED at the reviewer gate by memlog line 46 ruling (17), which created the accounting boundary and the virtual ledger as a rule in their own right after ruling (1) fixed the kill-line series per binding against the binding's virtual-ledger equity and settled that the registry key kill_line_capital_floor IS AD-40's loss_floor - one variable, one name, no second name minted. The rule rests on A13 (floating P&L never swept, and never a term in either residual) as its one proceed-on-recommendation call, with the AD-16 treasury boundary kinds, AD-40's frozen R and AD-8's calendar identity all parent-ratified. Amended further by memlog line 51 (10), which made unrealized P&L a mark that is never reconciled and the two residuals separate; line 51 (15), the jointly-exhaustive-and-disjoint partition proof at compile; and line 51 (33), the no-scale-in refusal stated over VIRTUAL positions so a netted account cannot mask it. The state_carry per-counter declaration with its human-signed carries-ledger edge comes from the same gate rulings and is what closes the silent-carry money-path failure in either direction."
    sources: [EXT-2121]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-25, accounting, virtual-ledger, state-carry, treasury]
    date: 2026-08-28
