    summary: "DEFERRED (GAP-0076 + GAP-0080): the two RLM deferrals. (GAP-0076) RLM kernel performance envelope — fan-out throughput, namespace-snapshot fidelity for large handles, cost per 800-variant aggregation: a measurement obligation revisited when the Analysis desk's first full backtest fan-out has run, recording wall-clock, peak memory and USD cost for one 800-variant aggregation and one snapshot-and-restore of the largest handle in that run, as evidence under AD-26; if a snapshot fails or the recorded cost exceeds rlm.fanout_cost_ceiling_usd (AD-26), RLM-in-Docker is re-opened (memlog L135, L260). (GAP-0080) RLM beyond the Analysis desk, and depth above 2: revisit when a desk other than Analysis has recorded a Task blocked for want of an RLM kernel, OR an Analysis run has hit the depth-2 cap — both readable from the journal."
