    statement: "QMA would carry multi-tenant memory and knowledge machinery — orgs, projects, ACLs, sharing, webhooks and billing. This is CUT: QMA keeps the memory/knowledge engine (AD-18, AD-19) but drops the tenancy, because there is a single operator."
