ledger:
  # ── Cut outright — 20 dead DECs (DEC-0360..DEC-0379), spine Cut-table order ──
  # Each is spine law per D21 (DEC-0329): anything on neither the Cut nor the
  # Deferred table and not in D1..D23 is out of scope for v1; no Cut row is
  # revived except by an explicit spine amendment. reason = the row's one reason
  # verbatim from the spine Cut-outright table.
  - id: DEC-0360
    title: "Cut: a QMX agent protocol plus adapters hosting foreign agent runtimes"
    statement: "The QMX agentic system would define a QMX agent protocol and ship adapters that host foreign agent runtimes (the Claude Agent SDK, OpenAI or LangGraph loops) inside QMA workers. This is CUT from v1: QMA owns its runtime bottom-up (AD-4, AD-14), and no foreign harness runs inside a QMA worker. The Deferred Claude-Agent-SDK hook-count row (GAP-0087) and the model-proxy foreign-harness shim (DEC-0370) both depend on this Cut and revive only if a spine amendment reverses it."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law; the Cut table and the Deferred table are exclusive (memlog L244), and the Cut table is spine law that no row revives except by amendment (DEC-0329)."
    sources: [EXT-2400, EXT-2401]
    component: null
    tags: [cut, dead]
    reason: "QMA owns its runtime bottom-up; nothing needs it to host foreign harnesses"
  - id: DEC-0361
    title: "Cut: extension trust tiers, marketplace or plugin store, install counts"
    statement: "QMA would carry extension trust tiers, a marketplace or plugin store, and install counts for its plugins. This is CUT: QMA is a single-operator system with no third-party publishers, so there is no untrusted-extension problem for tiers, a store or install counts to solve."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
    sources: [EXT-2400, EXT-2402]
    component: null
    tags: [cut, dead]
    reason: "one operator, no third-party publishers, no untrusted-extension problem"
  - id: DEC-0362
    title: "Cut: a provides/requires/optional capability dependency solver"
    statement: "QMA would run a provides/requires/optional capability dependency solver over its plugin set. This is CUT: a package-manager-style solver is unwarranted for a plugin set numbering in single digits (the five fixed desk plugins, AD-7); explicit registration at a composition root suffices (AD-21)."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
    sources: [EXT-2400, EXT-2403]
    component: null
    tags: [cut, dead]
    reason: "a package-manager solver for a plugin set numbering in single digits"
  - id: DEC-0363
    title: "Cut: the 20-service injectable context fabric"
    statement: "QMA would provide a 20-service injectable context fabric (a large enumerated dependency-injection surface of context services). This is CUT: it is architecture by enumeration and most entries have no described consumer; the Context Compiler (AD-14) provides what a given invocation sees without a service fabric."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
    sources: [EXT-2400, EXT-2404]
    component: null
    tags: [cut, dead]
    reason: "architecture by enumeration; most entries have no described consumer"
  - id: DEC-0364
    title: "Cut: the eight-type memory taxonomy"
    statement: "QMA would classify memory into an eight-type taxonomy (semantic, episodic, procedural and the rest). This is CUT: the taxonomy was never load-bearing and is superseded by one narrow memory definition plus provenance-gated candidates behind the MemoryProvider port (AD-18, admit / admission_confidence)."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
    sources: [EXT-2400, EXT-2405]
    component: null
    tags: [cut, dead]
    reason: "never load-bearing; superseded by one narrow definition plus provenance-gated candidates"
  - id: DEC-0365
    title: "Cut: the general-IDE lifecycle events (display, elicitation, config, cwd, directories)"
    statement: "QMA would emit the general-IDE lifecycle events — display, elicitation, config, cwd and directories. This is CUT: that is multi-surface public-IDE plumbing; QMA fires only the hook events its authored graphs need (AD-10), not a general editor event bus."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
    sources: [EXT-2400, EXT-2406]
    component: null
    tags: [cut, dead]
    reason: "multi-surface public-IDE plumbing; QMA fires only what its authored graphs need"
  - id: DEC-0366
    title: "Cut: hot-module reload and reactive re-mount of live plugins"
    statement: "QMA would support hot-module reload and reactive re-mount of live plugins. This is CUT: it is a developer nicety that runs against QMA's determinism requirement; QMA uses explicit reload instead, with reversible scoped contributions (AD-21)."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
    sources: [EXT-2400, EXT-2407]
    component: null
    tags: [cut, dead]
    reason: "a dev nicety against a determinism requirement; explicit reload instead"
  - id: DEC-0367
    title: "Cut: isolate/intercept and label-joined config scopes"
    statement: "QMA would provide isolate/intercept and label-joined config scopes (multi-tenant overlay configuration machinery). This is CUT: QMA has one operator and one config, so the overlay machinery has nothing to isolate or label-join."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
