    topics: [qma, constitution-touchpoints, inherited, read-only, traceability]
    authority: rider
  - id: EXT-2384
    type: decision
    summary: "D21 SCOPE LISTS adopted (memlog L44) — the sitting's scope filter, read from the operator's fresh-start and seed-not-spec rulings: the Deferred table (each row with its revisit condition) and the Cut-outright table are spine law; anything on neither list and not in D1..D23 is out of scope for v1. This is the rule that makes every Deferred row and every Cut row a decision of record rather than an omission."
    cite: "SRC-13:.memlog.md:L44"
    topics: [qma, d21, scope-lists, spine-law]
    authority: rider
  - id: EXT-2385
    type: decision
    summary: "PACKET DELTA — KEEP (memlog L16, packet 07/04/03): keep mission-scoped hooks authored by agents from approved templates under SIX constraints (schema-validated, permission-bounded, UI-visible, auditable, removed with the mission, cannot escalate privilege); the TaskCompleted hook requires a STRUCTURED ledger append (what was done, what changed, evidence/artifacts, unresolved issues, next recommendation); a Task is reassignable/resumable by another agent WITHOUT the prior agent's transcript; the 26-noun wire vocabulary (9 commands, 7 queries, 10 noun.verb events) is adopted ONLY WITH a versioning rule the packet lacks."
    cite: "SRC-13:.memlog.md:L16"
    topics: [qma, packet-delta-keep, mission-hooks, taskcompleted, wire-vocab]
    authority: rider
  - id: EXT-2386
    type: decision
    summary: "PACKET DELTA — CUT (memlog L17): cut the packet's revivals the register already wrote off — extension trust tiers, the provides/requires/optional capability solver, the memory-type taxonomy; and cut the packet's 11-loop registry re-centring, which recentred loops against operator T-4954 ('graphs, not loops') — the named cycles become authored Graph Templates and an eleven-entry loop registry as the organizing centre is Cut outright."
    cite: "SRC-13:.memlog.md:L17"
    topics: [qma, packet-delta-cut, trust-tiers, capability-solver, loops]
    authority: rider
  - id: EXT-2387
    type: decision
    summary: "WIRE CONTRACT as stated in the packet (packet-delta §4, adopted with the versioning rule the packet lacked): commands (start mission, send message, steer agent, stop run, approve hook action, install/enable plugin, update configuration, launch task, retry task), queries (get bot, list missions, get graph state, inspect ledger, inspect trace, list installed plugins, get provider health) and events (agent.started, message.delta, tool.started, task.completed, hook.blocked, ledger.updated, mission.updated, worker.detached, provider.cooldown, artifact.created) — a dotted noun.verb convention; the packet's versioning was 'asserted, not specified', which the spine repairs with AD-5's initialize handshake, semver protocolVersion additive-only within a major and wire.deprecation_minors; attachment is client state."
    cite: "SRC-13:inputs/packet-delta.md#4"
    topics: [qma, wire, commands-queries-events, versioning-rule, noun-verb]
    authority: rider
  - id: EXT-2388
    type: constraint
    summary: "Operator constraints in his own words (transcript decision register §4): build-and-scope — 'we are not using any SDK. In fact ... we have our own custom SDK in-house', 'We are building for a specific purpose, we're not building for the general public', 'we are not going to clone blindly ... we are going to extract'; determinism — 'I would prefer this being more deterministic than anything, the entire thing. Because I know how messy agents can go', deterministic verifier scripts at before_task_complete instead of LLMs judging themselves, 'A model router's job is simply to balance the load'; these constraints ground the no-third-party-SDK posture, the contract-hub house style and the hooks-are-deterministic-guards principle."
    quote: "we are not using any SDK. In fact, the idea was we break this down through and through ... we have our own custom SDK in-house."
    cite: "SRC-13:inputs/transcript-decision-register.md#4"
    topics: [qma, no-sdk, determinism, extract-not-clone]
    authority: rider
  - id: EXT-2389
    type: constraint
    summary: "Inherited binding set (memlog L14 L31, L15 platform conventions): the agentic system is built WITH the QMF libraries and must not re-implement or bypass their contracts (exact money/time, fingerprints, typed refusals, registry records, correlation_id) — L31/DEC-0122; and it reuses the inherited platform conventions rather than re-deriving them — append-only evidence with read-time folds (never mutable stored state), typed refusals at public boundaries, correlation_id across every boundary, configurable = UI-editable, closed-and-addable vocabularies, engine/kernel banned for QMB."
    cite: "SRC-13:.memlog.md:L14"
    topics: [qma, inherited, l31, platform-conventions, no-reimplementation]
    authority: rider
  - id: EXT-2390
    type: decision
