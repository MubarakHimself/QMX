[project]
name = "qma-wire"
version = "0.1.0"
description = "QMA cross-boundary contract package: wire envelope, message-family schemas, protocol version. No client implementation."
requires-python = ">=3.14,<3.15"
dependencies = [
    "qma-core",
    "qmf-core",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace submodule. Dot notation tells uv_build the module lives at
# src/qma/wire/ with NO src/qma/__init__.py anywhere in the distribution.
module-name = "qma.wire"

[tool.uv.sources]
qma-core = { workspace = true }
qmf-core = { path = "../../../packages/qmf-core", editable = true }
