# QMF V1 uv-workspace root.
#
# Two things live in this one file and MUST NOT be confused:
#
#   1. THE SSSF FACTORY-GATE STAMP (the original contents of this file). The
#      factory's merge gate re-runs three commands against every branch:
#          uv run --project <tree> --group dev ruff check .
#          uv run --project <tree> --group dev mypy adws
#          uv run --project <tree> --group dev pytest -q adws/tests
#      That gate is FAIL-CLOSED: a command that cannot run reads RED. Its
#      contract is the `[dependency-groups] dev` list and the `adws/tests`
#      pytest wiring below. Both are preserved verbatim in intent — the `dev`
#      group keeps every tool and library the gate needs, and
#      `[tool.pytest.ini_options] testpaths = ["adws/tests"]` is unchanged.
#
#   2. THE QMF WORKSPACE (added by Story 1.1). `[tool.uv.workspace]` declares
#      the seven roster packages under packages/ and the first extension under
#      extensions/. The canonical toolchain and the `poe` task surface (Tier-1
#      `check`, plus `check-integration` and `check-release`) gate the QMF code.
#
# The two coexist deliberately: the SSSF commands target `adws`, the `poe`
# tasks target `packages/ + extensions/ + tools/`, and neither weakens the
# other. `name`/`version` remain placeholders; nothing reads them.

[project]
name = "sssf-project"
version = "0.1.0"
description = "A project the Super Simple Software Factory was stamped into; also the QMF V1 uv-workspace root"
# The factory-stamp floor stays >=3.10 (the SSSF root is not a QMF package, and
# keeping this floor keeps ruff's inferred target at py310 so `adws` lints
# byte-identically to baseline). The actual CPython 3.14 pin (AR-04) lives in
# `.python-version` and in every member's own `requires-python = ">=3.14,<3.15"`;
# the workspace resolves and runs on 3.14 accordingly.
requires-python = ">=3.10"
# The same libraries every adws/*.py declares in its own PEP 723 header.
# Declared here too because adws/tests/ imports adw_modules directly, so `uv run
# --group dev pytest` needs them importable.
dependencies = ["pydantic", "python-dotenv", "pyyaml", "rich"]

[tool.uv.workspace]
# The QMF distribution units. Seven roster packages (SemVer lockstep) under
# packages/, off-roster extensions (own SemVer ladders) under extensions/.
members = ["packages/*", "extensions/*"]

[dependency-groups]
# THE GATE'S CONTRACT — plus the QMF canonical toolchain, one environment for
# both gates. The last four (pydantic, python-dotenv, pyyaml, rich) and mypy /
# types-PyYAML are the SSSF factory-gate essentials and MUST stay: adws/tests/
# imports adw_modules, which imports them, and the gate runs `mypy adws`.
#
# The pinned QMF toolchain (AD-3/AD-4; DEC-0101/0102) is added on top: ruff,
# pyright (strict), pytest 9.x, poethepoet, and pytest-cov. Exact pins give
# byte-identical results on every machine; the committed uv.lock nails the rest.
dev = [
    # SSSF factory-gate essentials (do not remove)
    "mypy",
    "types-PyYAML",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "rich",
    # QMF canonical toolchain (AR-11)
    "ruff==0.16.3",
    "pyright==1.1.411",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "poethepoet==0.48.0",
]

# skylos is SEPARATE from `dev`, and not because it is optional - because it
# does not install everywhere. It depends on tree-sitter-dart-orchard, which
# publishes an sdist only and needs an MSVC toolchain to build on Windows; one
# shared group would take ruff, pytest and mypy down with it on every
# `uv sync`. adw_modules/quality.py treats every uv provisioning failure from
# this group as TOOL UNAVAILABLE ("incomplete"), never as a pass or a fail.
scan = ["skylos"]

[tool.pytest.ini_options]
# SSSF contract: a bare `pytest` (and the gate's `pytest -q adws/tests`) targets
# the factory suite. `poe test` passes `packages extensions` explicitly, which
# overrides this default and collects the QMF package suites instead.
testpaths = ["adws/tests"]
# QMF package sources on the import path, so `qmf.*` resolves from src/ without
# an install at Tier 1 (additive; adws/tests never import qmf and are unaffected).
pythonpath = [
    "packages/qmf-core/src",
    "packages/qmf-registry/src",
    "packages/qmf-data/src",
    "packages/qmf-indicators/src",
    "packages/qmf-structure/src",
    "packages/qmf-venue/src",
    "packages/qmf-risk/src",
    "extensions/qmf-calendar-forex/src",
    # Workspace tools (the tier-1 static scanners) import as top-level modules so
    # `poe test-tools` can measure their coverage (Story 1.7).
    "tools",
]

[tool.mypy]
# SSSF gate: `mypy adws` only. QMF workspace code is type-checked by pyright
# (strict) via `poe types`; mypy stays scoped to the factory machinery.
python_version = "3.10"
files = ["adws"]
# adw_data/ is runtime session output and stamped prompt files, not source.
exclude = "adws/adw_data"

[tool.ruff]
# adw_data/ holds runtime session output and the stamped prompt/config files,
# copied verbatim from the skill template - not source this project owns.
# recorder/ is the SSSF status-dashboard tooling stamped in at baseline; it is
# not QMF roster code and not linted here (the same "scope to shipped code"
# posture the CI applies to the AI-defect scanner).
# tools/tests/fixtures/ holds deliberately-broken sample modules (money-path
# float violations) that the money-path scanner parses as data — not shipped
# code, so it is neither linted nor type-checked (Story 1.7).
extend-exclude = ["adws/adw_data", "recorder", "tools/tests/fixtures"]
line-length = 100

[tool.ruff.lint]
ignore = [
    # every subprocess call inspects returncode itself - explicit check= is noise here
    "PLW1510",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101 is the whole point of a test); test files may reach into a
# package's private benchmark module (`_bench`) to exercise the harness.
"packages/*/tests/*" = ["S101"]
"extensions/*/tests/*" = ["S101"]
"tools/tests/*" = ["S101"]

[tool.pyright]
# Strict, workspace-wide over the QMF code (AR-11). adws is mypy's job, not
# pyright's, so it is not included here.
include = ["packages", "extensions", "tools"]
# The deliberately-broken money-path fixtures are scanner input data, not code to
# type-check (Story 1.7); the rest preserves pyright's default exclusions.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "tools/tests/fixtures"]
extraPaths = [
    "packages/qmf-core/src",
    "packages/qmf-registry/src",
    "packages/qmf-data/src",
    "packages/qmf-indicators/src",
    "packages/qmf-structure/src",
    "packages/qmf-venue/src",
    "packages/qmf-risk/src",
    "extensions/qmf-calendar-forex/src",
    # Workspace tools import as top-level modules (see pytest pythonpath above).
    "tools",
]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.poe.tasks]
# The canonical QMF commands (AR-11), byte-identical on every machine. ruff /
# ruff-format / pyright / pytest target the shipped workspace (packages/,
# extensions/, tools/); the SSSF gate independently covers adws.
fmt = "ruff format packages extensions tools"
fmt-check = "ruff format --check packages extensions tools"
lint = "ruff check packages extensions tools"
types = "pyright"
test = "pytest packages extensions --cov=qmf --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80"
# Mechanical per-package + contract-module enforcement on top of the aggregate floor
# above: reads the coverage.json `test` writes and fails the gate if any package drops
# below 80% or exact.py/chrono.py drop below 100% branch (AR-20; M1).
cov-report = "python tools/coverage_report.py"
# The workspace tools (tier-1 static scanners + gate helpers) carry their own suite and
# their own 80% package coverage floor, scoped to the tool modules (Story 1.7, 1.8;
# M1/M7/M9; AR-20).
test-tools = "pytest tools/tests --cov=money_path_scan --cov=ambient_scan --cov=secret_scan --cov=coverage_report --cov=workspace_meta --cov-branch --cov-report=term-missing --cov-fail-under=80"
secret-scan = "python tools/secret_scan.py"
# Tier-1 static scanner: fails closed on any binary float on the money path
# (NFR-02 enforcing FR-001; CT-01, DEC-0105).
money-path-scan = "python tools/money_path_scan.py"
# Tier-1 static scanner: fails closed on any read of the system clock or other ambient
# nondeterminism below the composition root (NFR-02 enforcing FR-002; CT-02, AR-16).
ambient-scan = "python tools/ambient_scan.py"
build-all = "uv build --all-packages"
# Tier-2 isolated-install smoke: builds each package wheel, installs it alone with only
# its declared deps into a throwaway env, and imports its qmf.* module — so an undeclared
# import fails the isolated build, and no wheel ships qmf/__init__.py (AR-06/AR-18; M9).
isolated-build = "python tools/isolated_build_check.py"

[tool.poe.tasks.check]
# Tier 1 — every factory work unit. Format, lint, strict types, unit tests +
# coverage floor, the workspace-tool suite, the money-path float scanner (NFR-02
# enforcing FR-001), the ambient-nondeterminism scanner (NFR-02 enforcing FR-002),
# and the secret-scan gate (AR-24). `cov-report` enforces the per-package + contract-module
# coverage floors on the JSON `test` writes (M1). Fail-closed: any nonzero step fails the gate.
sequence = ["fmt-check", "lint", "types", "test", "cov-report", "test-tools", "money-path-scan", "ambient-scan", "secret-scan"]
default_item_type = "ref"

[tool.poe.tasks.check-integration]
# Tier 2 — landing into integration. Tier 1, a build of every workspace package, and
# the isolated-install smoke that installs each package alone and imports it so an
# undeclared import actually fails the isolated build (AR-06/AR-18; M9).
sequence = ["check", "build-all", "isolated-build"]
default_item_type = "ref"

[tool.poe.tasks.check-release]
# Tier 3 — ship. Tier 2 today; the clean-install smoke on both tier-1 OSes is
# added once a remote exists (AR-23: Ubuntu tier-1 stays untested until then).
sequence = ["check-integration"]
default_item_type = "ref"
