  - id: EXT-2450
    type: decision
    summary: "LEDGER CORRECTION (round 3) — the operator rejected Claude's mission-level reading and re-aimed the ledger at the TASK level: a mission is broad and splits into tasks run by multiple agents; the ledger he means is the one 'that little agent, the worker, is actually using to record'. Upstream/main agents at the profile or desk level may keep their own bigger work ledgers (hedged 'if I recall properly'); ledgers can ride the hook system and need not be heavyweight; agent-to-agent messages must be logged; a mission report is derived after the fact by an agent reading the task ledgers. He closes with an explicit fidelity instruction, 'Qoute me right'."
    quote: "the mission has tasks which are split down, which are run by multiple agents. What I'm talking about is that thing that that little agent, the worker, is actually using to record. I'm not talking about the one for the mission. [...] the agents upstream, the main ones [...] I think they can also have their own work ledgers, the big versions of work ledgers. [...] the ledgers, you know, can be part of the hook system. They don't need to be very hard [...] you also have agent-to-agent [...] Those things need to be logged. [...] after the mission is done, you know, the agent will read through all the ledgers and write a report or a summary [...] the main agent at the profile or the desk level, if I recall properly. Qoute me right"
    cite: "SRC-14:agentic-spine.txt:L288-331"
    topics: [qma, ledgers, task-level, desk-level, mission-report, hooks, quote-me-right]
    authority: rider
