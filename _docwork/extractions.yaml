  - id: EXT-2170
    type: decision
    summary: "TRADING-NODE INCREMENT VETO ROUND (operator direct, 2026-08-30, first-person dictation at desk; closes the cheap-veto surface of DEC-0259). (1) BOT JOURNEY, ruled globally: a bot starts as a hypothesis, is built, is backtested and iterated with QMB by the operator and agents, and its paper trading is PART OF that pre-promotion stress-testing - all of it OUTSIDE the trading node ('all that happens outside the trading node... the trading node is only for live trading'); by promotion 'it is known that the bot itself is ready to trade live capital'; 'anything that is on the trading node... has human approval. So I have approved for it to touch my money'; 'there is no ramping, there is no bot ramping'; the only route back to paper is a BMS/Book protective event ('the only time where I will take it back to paper trading is... the BMS... drawdowns'); ONE added rule: 'when I promote about midday or in the middle of a trading day, the bot won't trade until the next day'; a manual override was raised and withdrawn ('leave it out'). The operator asked that this journey be made consistent across the entire documentation and noted the architecture sitting had asked the same question. (2) FIRST-DEPLOYMENT WINDOW: the whole system first runs on the demo account ('we are going to first put it on our demo account globally... a few demo bots... we see what is falling, what is failing'); that window is testing, agents watch most alerts then ('most alerts are going to be monitored by agents... that doesn't concern you'). (3) ALERT WIDENING: the silent-degradation class ACCEPTED; the daily liveness digest REJECTED ('not so necessary... continuous streaming via the UI'); the dead-man's switch first REJECTED AS PRESENTED ('it might mess with my trading... what if the fault is not on my end?') then, after the zero-authority explanation, KEPT and renamed 'liveness heartbeat' with the rider 'make sure it doesn't contradict with the UI or the other thing I was describing in the UI' - the UI's later connectivity/latency view ('we need to know latency from the trading node to the provider, especially since we might scalp at times, and also connectivity') - and the reconciliation delegated ('you decide because I'm not so technical'). (4) COSTS: the Backblaze B2 bucket default not objected to (stands); the observability stack on the same VPS stands; the operator has an existing Linux VPS and will buy a dedicated trading server, but likely not before coding starts; asked the minimum VPS spec for ~40 strategies (answered as a procurement starting point, the node's own benchmark rules). (5) PLACEMENT QUESTION: 'is it possible to have two variants of this trading node? One that can run on the same machine... as the agentic system' - recorded as a deferred placement variant, not a second product. (6) MIS TRAINING: the operator asked for the plan before epics ('what is the plan for the MIS model training... they take a very long time to train... you have to get that data, clean it, categorize it... this system can trade across all sessions'), accepts training on his own machine, wants efficiency ('we don't want one epic to pause... it's better if we have multiple epics... they might be on different branches during coding'), and recalls shadow rollout. (7) The operator asked whether the kill switch, dead zone and session windows were already documented (they are; no change) and closed with 'are there any more questions I need to answer?' - none."
    cite: "operator-direct:2026-08-30 (documentation-factory trading-node increment veto round; first-person dictation recorded at desk)"
    topics: [trading-node, veto-round, bot-journey, promotion, alerts, liveness-heartbeat, vps, mis-training]
    authority: rider

  - id: EXT-2171
    type: decision
    summary: "TRADING-NODE VETO ROUND, SECOND EXCHANGE (operator direct, 2026-08-30, dictation at desk). (1) MIS MODELS: the operator asked whether the models are known ('you don't have any idea which models you are using in the MIS or do you know them?'); answered from the mined corpus (prd discovery mine-node.md section 3): 8 ratified labelers - 6 rule-based (identity, spread-state, gap-event, feed-state, SQS, degraded-sensors), 1 fitted (liquidity_stress_v1, CPU quantile fit), 1 trained (regime_classifier_v1) whose model_family is a placeholder and training_location unresolved; recovered non-authority candidates Kronos, HMM, BOCPD, MS-GARCH carry no current authority. (2) MIS TRAINING = THE LAST SPEC under the trading node ('I feel like it should be the last spec under the trading node... it needs a lot of human in the loop'), shape = 'a script you the agent gives me to run and retrain. It can take a few hours or so.' (3) TWO VARIANTS RULED IN SCOPE: 'let's do the two variants, please... I have a colleague who might want to try this out'; the whole platform must be easy to set up out of the box: 'I shouldn't require technical knowledge to set this up'; the UI later gets an installation page or walkthrough that installs dependencies; 'the backend should set itself up, so which means you have to be thorough. If you need Docker, you use Docker. If you don't need Docker, you [don't]'. (4) Session close: 'you tell me when you are done and that you do the epics run because this is gonna take a minute' - the operator runs the epics session on the hand-off prompt."
    cite: "operator-direct:2026-08-30 (documentation-factory trading-node increment veto round, second exchange; first-person dictation recorded at desk)"
    topics: [trading-node, veto-round, mis-labelers, mis-training, placement-variants, self-setup, docker]
    authority: rider
