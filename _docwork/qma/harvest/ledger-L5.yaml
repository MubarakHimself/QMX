  - id: DEC-0369
    title: "Cut: a shared account-level cloud computer with per-actor screens"
    statement: "QMA would run a shared account-level cloud computer with per-actor screens. This is CUT: it is not a security boundary; Docker-per-worker (AD-17 ExecutionEnvironment) replaces it as the isolation mechanism."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
