  - id: EXT-2084
    type: decision
    summary: "QML SPINE QL-1..QL-2 (autonomous sitting 2026-08-21). QL-1 IDENTITY: QML is the bot-authoring LIBRARY — one uv-installable distribution (import qml), application layer built ON QMF exactly as QMB (AD-2/L11), never a roster package/framework/engine/cross-component contract layer; whole surface = three thin things (author types+helpers producing CT-33/CT-34 on qmf-core nouns; the bot runtime protocol; the conformance gate); QML mints NO new QMF-ladder contract of its own (CT-33/CT-34 are qmf-registry kinds; protocol + conformance are QML-local on QML's own AD-5 ladder); the old uniformity rationale is already delivered by ratified QMF law (CT-23 sizing, AD-40 frozen R, CT-29/CT-32), QML adds only declared footprint + declared parameter space; plain Python first-class forever, conformance the ticket into governed evidence + seats and nothing else; no acronym expansion (L=Library). Dependency stance: imports qmf-core/qmf-registry/qmf-risk, NEVER qmf-venue; the default-deny edge rule read ROSTER-SCOPED (governs the seven roster packages, not applications on the workspace — the QMB precedent), recorded as a declared reconciliation note annotated at source. Registration write path = AD-25 root-mints (root holds WriterId + gapless per-(writer,kind) sequence; qml returns fingerprintable content never stamped records; writer unit = machine, authoring role, kind; AD-28 scoped to sandbox I/O). AD-15 purity: no threads/I-O/process-spawning. QL-2 TWO HALVES + .qml RULING: a governed bot = exactly two artifacts — the DECLARATION (AD-30 template discipline, CT-33) + the LOGIC (plain Python conforming to the protocol, versioned distribution under AD-2/AD-22); logic identity = distribution identity + version + canonical source-manifest fingerprint (reproducible source-tree hash, NEVER wheel bytes) as identity fields of the Bot; the .qml file format + Monaco surface NOT revived in V1 (no second language; a future grammar/editor/agent-codegen compiles to the same two artifacts); baked-in-weights NN bots legal today, a separately-tunable weights kind Deferred."
    cite: SRC-09:ARCHITECTURE-SPINE.md#QL-1-QL-2
    topics: [qml, spine, ql-1, ql-2, identity, two-halves, no-dsl]
    authority: rider

  - id: EXT-2085
    type: decision
    summary: "QML SPINE QL-3..QL-4. QL-3 BOT DEFINITION KIND CT-33 — fills AD-16's reserved Bot kind (qmf-registry per-kind contract, QML-authored, qmf-registry-owned). Identity carve-out: header writer/sequence/stable-id/created-at excluded from fp1 (ordering/occurrence); Bot identity = semantic content + contract format version + at-birth refs. Six content groups: strategy-family id (exactly one); confluence set (one-or-more CT-34 fps, fingerprint-ascending order + display ordinal); declared parameter space = THE one authoritative bot parameter-space contract (B-8 schema completed with AD-40 unit-kinds; mandatory defaults = CANONICAL ASSIGNMENT); footprint (contains the B-12 stream set, one locus/one linter target); permitted-intent declaration (entry always permitted; declared EXIT-intent kinds subset of ratified CT-23 vocab, may be empty; opaque qmf-core-typed ids, no registry->risk edge); logic reference. Versioning = AD-30 git logic (branches-from graph, current = dated pointer, continues-performance human-signed). Bot identity is content (AD-17): re-binding/seats/paper flips never mint a Bot, a changed default/leg/footprint/logic always does. Seat cites Bot fp1 (AD-41/CT-28). PARAMETERIZATION LAW: governed seats execute the canonical assignment ONLY; non-default = B-3 run-spec overrides in experimentation; promoting a tuned assignment = a new Bot version. QL-4 FOOTPRINT = the single canonical consumption manifest: stream set + required calendars (AD-8) + producer bindings, each a pinned CT-16/CT-17 fp OR a producer TEMPLATE (complete CT-16/CT-17 config minus only space-bound values; omitted identity field = Layer-1 refusal; resolution TOTAL + SINGLE-VALUED to one deterministic fingerprint). Completeness law: producer-binding set MUST equal the transitive union of cited confluences' leg producers + bot-direct producers (else Layer-1 refusal). Hosts provide ONLY the declared footprint. Warm-up/embargo horizon DERIVED at resolution (AD-21/AD-22), never hand-declared. footprint_requirements (AD-30 pending slot) gains its shape: a set of typed requirements over CT-33 footprint fields under admission_bar grammar, values in Book templates. Template resolution = a declared B-3 config-compiler extension + node seat-admission responsibility."
    cite: SRC-09:ARCHITECTURE-SPINE.md#QL-3-QL-4
    topics: [qml, spine, ql-3, ql-4, ct-33, footprint, parameter-space]
    authority: rider

  - id: EXT-2086
    type: decision
    summary: "QML SPINE QL-5..QL-6. QL-5 CONFLUENCE KIND CT-34 — own registry artifact (AD-17), reusable, cited by fingerprint; one-or-more legs of ANY role mix (multiplicity-faithful AD-17, never one-of-each); leg = (role, producer binding per QL-4, optional declared exact params); a leg may cite another confluence. Leg-role vocabulary = CT-34's own closed-and-addable surface: level | trigger | confirmation | filter — AD-17's three are the seed, filter is the FIRST addition (freshly-minted, provenance marked; a suppressing condition on the same governed producers, giving the old formula's Filters a governed home). Old formula's Features = producer bindings consumed by level/trigger legs (stated disposition). Ordering: AD-17 fingerprint-ascending default (order-insignificant) + display ordinals; a confluence is NOT a CT-17 causal composite, so AD-25's order-significant default does not reach it; order-significance opt-in, enters the fingerprint only when declared. Condition semantics live in logic in V1; declarative predicate grammar Deferred. QL-6 STRATEGY FAMILY — an opaque operator-minted id under AD-9 + a dated registry metadata record (same machinery as instrument_class; a kind under CT-06's addable-kinds law, NO new CT number). A KEYING TOKEN WITH NO AUTHORITY. Every CT-33 Bot declares exactly one family id (deliberate AD-17 cardinality-one; an attribution key). Book exit_policy entries key by family id and MAY declare ONE catch-all default entry (ratified into the CT-22 mint; CT-29 exit record keys the RESOLVED entry, explicit-or-catch-all); a bot whose family resolves no entry fails the prediction linter. ArchetypeSpec constraint powers (permitted feature families/timeframes, mutation allowances) NOT revived — constraining is the Book's job; agent-mutation governance is agentic-sitting territory. 'Archetype' = retired alias (glossary)."
    cite: SRC-09:ARCHITECTURE-SPINE.md#QL-5-QL-6
    topics: [qml, spine, ql-5, ql-6, ct-34, confluence, leg-roles, strategy-family]
    authority: rider

  - id: EXT-2087
    type: decision
    summary: "QML SPINE QL-7 — THE BOT RUNTIME PROTOCOL (QML-owned format-versioned contract on QML's own AD-5 ladder, not CT-numbered). A conformant bot is a FACTORY the host constructs with (declaration, resolved assignment, injected read surfaces), returning a callback object driven per evaluation instant; callbacks receive ONLY declared-footprint evidence (presence-mapped series per AD-22, structure folds per AD-25, per-sample knowable-at) and return zero-or-more CT-23 intents. The bot never sizes (requested_r Book-resolved), never touches venue commands, never reads a clock, never performs I/O/network/undeclared randomness; conformant logic is DETERMINISTIC (B-2 golden-slice property). State: AD-22 streaming-instance discipline generalized; snapshot/restore versioned, scoped to (OS, logic distribution identity + source-manifest fp, protocol format version, arithmetic-reference build); cross-component restore = unavailable-dependency refusal; restored-state fingerprint enters labels. ENTRY-INTENT DERIVATION — BOOK-SIDE, SINGLE-SITED (the reviewer gate's reversal of the draft intent-mint-side design): the bot's entry proposal carries an ADVISORY STOP PROPOSAL (price or PriceDelta bound, advisory exactly as proposed_r), landing on CT-23's entry intent as a new OPTIONAL field via the CT-23 format mint; the DECLARED FULL-LOSS PRICE is derived at the Book door by the Book executing its own per-family ExitLogicRef, consuming the advisory proposal + cited evidence, stamped exactly as requested_r is resolved; NO Book module ever injected into bot logic (keeps the bot deterministic, sandbox-testable with no Book, zero-import); ungoverned plain-Python bots ride the same Book-side path (run spec supplies the family or catch-all applies). execution_profile dispositioned: order-type/slippage/partial-fill = venue/node + tunnel (CT-18/CT-19, B-6); minimum-RR-before-entry = bot-internal condition in logic in V1; parity = GAP-0048. Hosts: QMB binds via a protocol adapter at its composition root; the node hosts seats later."
    cite: SRC-09:ARCHITECTURE-SPINE.md#QL-7
    topics: [qml, spine, ql-7, runtime-protocol, advisory-stop, book-side-derivation]
    authority: rider

  - id: EXT-2088
    type: decision
    summary: "QML SPINE QL-8 — CONFORMANCE GATE + ADMISSION INTERFACES. Conformance is TECHNICAL, never performance (AD-32 mirrored). Layer 1 declaration linter (at registration): schema completeness, unit-kinds + valid canonical assignment, every reference resolvable, footprint completeness (transitive-union law), template completeness, exit-intent kinds within the ratified CT-23 vocab; failures = AD-11 typed refusals, journaled. Layer 2 sandboxed execution conformance, SPLIT: QML owns the pure format-versioned contract (denial set, static AST/import-scan rules, determinism harness, deterministic golden-slice generator keyed off the declared footprint, verdict function); the HOST owns process spawning/isolation — verdict host-independent by construction, no Book present. Suite: loads in isolation; golden slice twice -> identical intents; only permitted intent kinds; state bound + snapshot/restore round-trip. V1 enforcement honesty: static scan + capability starvation + host process isolation; hardened OS-level confinement a named deferred dependency (node/platform sitting); dynamically-evasive malicious bots out of the V1 threat model. THE TICKET: the Bot kind mints only on passing both layers (else policy-rejection refusal); registration is what governed evidence + seats cite; ungoverned bots keep full tunnel access — conformance gates evidence CITATION + seats, never tunnel entry. Old max_acceptable_complexity_score gate NOT revived (stated drop). ADMISSION-BAR INTERFACE (interfaces only; thresholds stay GAP-0048/0049): two bot-side declarable evidence_requirements fields — registered-conformant-Bot cite + canonical-assignment evidence (read from the B-3 assignment_is_canonical stamp via a B-4 fold qualifier); they land ONLY through the CT-22 format mint (AD-30 unknown-section rule), never a silent field addition. PREDICTION LINTER, pinned check list (addable never redefined), statically on demand + at seat time against the CT-28 binding context, filling AD-32's Layer-1 slot: (a) footprint satisfies Book footprint_requirements; (b) declared exit-intent kinds subset of Book exit_policy permitted exit kinds (entry never gated; a zero-exit-kind Book admits entry-only bots); (c) family resolves an exit_policy entry (explicit or catch-all); (d) stream set within the binding's declared venue capabilities (CT-18 via AD-29). Graduation: mint the two artifacts with a lineage edge back to the originating research artifact (AD-22 generalized)."
    cite: SRC-09:ARCHITECTURE-SPINE.md#QL-8
    topics: [qml, spine, ql-8, conformance, ticket, prediction-linter, admission-bar]
    authority: rider

  - id: EXT-2089
    type: decision
    summary: "QML SPINE QL-9..QL-10. QL-9 EXIT RECONCILIATION — AD-33's provenance flag ('QML donor atoms open to revision by the QML sitting') CLOSED, ratified as-is. ExitLogicRef = {module_id, config} stays in the Book's exit_policy per family; the Bot definition carries NO exit_logic field (old BotSpec slot deliberately dead). CT-29's taxonomy stays the ONE close-reason taxonomy; old CloseReason members map as recorded evidence, never a second contract: SL_HIT->protective_stop_fill, TP_HIT->target_fill, TRAILING_SL_HIT->protection_amendment_fill, MANUAL_CLOSE/MANUAL->operator_close, KS_FORCED_CLOSE/KILL_SWITCH_FLATTEN->protection_forced_flat, SESSION_CLOSE->window_forced_flat|boundary_flat|hold_time_force_flat per trigger, TIMEOUT->hold_time_force_flat, BROKER_CLOSE->venue_initiated_close|venue_liquidation, HEDGE_CLOSE->no successor (no hedge machinery in V1). Close-authority priority already AD-37; survivor mechanics AD-27/AD-34 (out of QML scope); DEC-0024 lineage honored (system-owned asymmetric SL/TP authority stays retired). QL-10 BUILD ORDER + DISTRIBUTION — QML builds BEFORE the trading node, may build alongside QMB (consumes QMF contracts only; nothing waits on node runtime). Natural order: QMF core packages -> QML + QMB -> trading node. QMB exercises plain-Python bots day one, conformant bots the day QML lands. Version ladder (B-13 mirrored): qml distribution own SemVer display-only (never identity; CT-33 fp1 + logic identity carry identity), QMF workspace lockstep, uv add qml. MQL5 analogy narrowed to the authoring layer at the bot-to-Book boundary."
    cite: SRC-09:ARCHITECTURE-SPINE.md#QL-9-QL-10
    topics: [qml, spine, ql-9, ql-10, exit-reconciliation, build-order, distribution]
    authority: rider

  - id: EXT-2090
    type: decision
    summary: "QML SITTING MEMLOG — ASSUMPTIONS, GATE, OPEN QUESTIONS. Sitting opened AUTONOMOUS by operator delegation (verbatim 'try to run this without me... close this out as smoothly and as simply as possible, but be thorough'). ASSUMPTIONS (rulings made without a live operator, each traceable to a standing direction, each individually overturnable without unwinding another): (1) no-DSL-in-V1 (QL-2) from 'bots stay authorable in plain Python' + don't-box-in; (2) canonical-assignment parameterization law (QL-3) from AD-17 identity-is-content + AD-30; (3) filter as a fourth leg role (QL-5), freshly minted; (4) family = key-not-authority (QL-6); (5) advisory-stop/Book-side single-sited full-loss derivation (QL-7) — the reviewer gate's reversal of the draft intent-mint-side design; (6) CT-33/CT-34 numbering continues the QMF ladder. REVIEWER GATE APPLIED AT DESK (5 lenses — rubric, adversarial, currency/reality, inputs-reconcile, parent-consistency; 34 findings, all applied; lint clean twice): headline amendments include the entry-intent derivation REVERSAL, the parent-contract-mint discipline (new spine section), the sandbox split + V1 enforcement honesty, entry-always-permitted, footprint = single canonical manifest with the transitive-union law + total-single-valued template resolution, the AD-16 header identity carve-out, the snapshot tuple, source-manifest identity basis, CT-34 fingerprint-ascending default + closed-and-addable role vocabulary, one-family cardinality-one + catch-all ratified into the CT-22 mint, AD-25 root-mints write path, the qmf-risk import carve-out as a declared reconciliation note, the B-3/B-4/B-8 sibling coordination, the L21->L11 mis-cite fix, the QML version ladder, and the reconcile dispositions (execution_profile, close-authority = AD-37, parity = GAP-0048 half, survivor mechanics = AD-27/AD-34, complexity gate NOT revived). OPEN OPERATOR QUESTIONS (non-blocking, none gates the build): (1) a UI display name for the bot-declaration artifact ('Bot definition' in the spine; 'BotSpec' retired); (2) whether QML ships a tiny qml CLI (V1 library-only); (3) NN/ML bots — baked-in weights governed today, a separately-tunable weights-artifact kind a later mint."
    cite: SRC-09:.memlog.md#entries-13,14,17
    topics: [qml, memlog, assumptions, reviewer-gate, open-questions, delegation]
    authority: rider

  - id: EXT-2091
    type: decision
    summary: "QML SITTING — PARENT-CONTRACT MINTS + SIBLING COORDINATION (QML cannot amend a parent contract by assertion; these land as AD-5 format-version mints of parent contracts, owned by their owners with QML-authored semantics, carried by the documentation-factory increment with migration notes; pre-mint artifacts readable forever). CT-22 FORMAT VERSION 2 (owner COMP-QMF-RISK): (1) admission_bar evidence_requirements +2 fields — registered-conformant-Bot cite + canonical-assignment evidence (QL-8; net-new, never a silent AD-30 field addition); (2) exit_policy +1 explicit optional catch-all default entry, CT-29 exit record keying the RESOLVED entry (QL-6); (3) footprint_requirements' reserved pending(GAP-0047) slot fills with QL-4's requirement-set shape (reserved-pending path, not net-new). CT-23 FORMAT VERSION 2 (owner COMP-QMF-RISK): +1 optional entry field — the advisory stop proposal (price or PriceDelta bound); the declared full-loss price documented Book-resolved at the door mirroring requested_r (QL-7); the CT-23 GAP-0047 revision flag closes (donor atoms ratified as-is, QL-9). SIBLING (QMB) COORDINATION declared, not silent: the B-3 assignment_is_canonical stamp + B-4 fold qualifier (QL-3/QL-8), the B-3 producer-template resolution step + node seat-admission responsibility (QL-4), and the B-8 parameter-space schema completed with unit-kinds (QL-3)."
    cite: SRC-09:ARCHITECTURE-SPINE.md#parent-contract-mints
    topics: [qml, parent-contract-mints, ct-22, ct-23, sibling-coordination, qmb]
    authority: rider

  - id: EXT-2092
    type: decision
    summary: "QML INCREMENT VETO ROUND RESOLVED (operator direct ruling, 2026-08-21, post-absorption veto checkpoint DEC-0184 created; first-person dictation at desk). All SIX delegation-made calls CONFIRMED KEPT, none overturned: (1) no-DSL-in-V1, the .qml file format not revived ('we can remove the file format, no problem'); (2) the canonical-assignment / promotion-mints-a-version parameterization law, confirmed via the operator's own snapshot/copy framing — experimentation overrides mint nothing, a copy becomes a bot version only at promotion ('until a snapshot turns into an actual live bot'); (3) filter as the fourth confluence leg role ('add it, seems like I have misunderstood you'); (4) family = key-not-authority ('good for the UI... add it, no problem'); (5) the advisory-stop proposal + Book-side single-sited full-loss derivation, kept together with rider B as its expansion; (6) CT-33/CT-34 numbering on the QMF ladder (unchallenged). RIDER A (resolves the recorded CT-34 leg-cardinality coordination question): a confluence leg MAY carry BOTH a producer binding and a child-confluence cite; at least one of the two is required; the role stays mandatory; leg and component counts are never bounded anywhere (twenty level legs plus one trigger is legal; several mini-levels composing one level is legal) — the don't-box-in reading ('if the code makes sense and it went through QMB... it will obviously be able to work'). RIDER B (resolves the CT-23 inbound-full-loss-price coordination question — neither refused nor silently invented): bot-owned exit methodologies are FIRST-CLASS — a bot's logic may implement its own exit/TP/stop methodology (VWAP exit, mini-scalper exit, anything) and act through the CT-23 door; AND a Book's per-family ExitLogicRef must support an ADOPT-THE-BOT'S-ADVISORY-STOP-PROPOSAL-AS-IS module mode (validated against the Book's risk rules) so a bot with its own stop methodology is honored rather than overridden. NO inbound-refusal posture is added to CT-23: the advisory stop proposal stays the bot's channel, requested_r stays Book-resolved, and the risk-monotonic law and frozen-R machinery are unchanged — the adoption mode is a DECLARED MODULE MODE inside the existing ExitLogicRef = {module_id, config} shape (DEC-0177/DEC-0179), NOT a contract format change ('most bots will have their own exit methodology... it can still work with the same rules for the book, but its exit still remains the same'; 'keep as is with room for expansion'). RULING C closes the sitting's open question 2: QML ships NO CLI, ever in this shape — QMB's CLI is the single command-line surface ('just put it under QMB... I don't know why we would have two command lines'). The CT-29 resolved-entry-keying field-shape question stays DEFERRED-WITH-NOTE, operator-aligned ('same response', consistent with rider B) — no CT-29 change now. Open question 1 (the UI display name for the declaration artifact) stays open, platform territory, now carrying the operator's lean: the bot declaration surfaces READ-ONLY for live bots (editing a live bot makes no sense — editing mints a version), an editable/config view belongs to research mode, UI naming stays the open platform question (a note only)."
    cite: "operator-direct:2026-08-21 (doc-factory QML-increment veto round; first-person dictation recorded at desk)"
    topics: [qml, veto-round, exits, confluence, cli]
    authority: rider

  - id: EXT-2093
    type: decision
    summary: "PRD-SESSION OPERATOR RULINGS (first-person dictation, 2026-08-21, second sitting). (1) DEC-0049 RESOLVED: automatic detectors on rare (black-swan-class) data-quality/drift events may PAUSE, but only as an entry-blocking control at the narrowest affected scope — instrument, currency cohort, Book, venue/broker, or system ('if something is affecting the USD, there is no point in pausing the yen'); positions and exits are never touched (L39 holds); posture is configurable UI-editable per L38 — inform when the operator is available, pause when not ('either it informs me if I'm available; if I'm not available, it pauses... it should be configurable... part of the things we should have for settings panel'). (2) SQS CONFIRMED AS-DOCUMENTED: SQS means Spread Quality Sensor ('the name is meant to mean spread quality sensor'), the ratified formula (DEC-0153) stands untouched for V1 ('take what is in that documentation folder... do not change a thing'), revisit post-V1; the stale architecture-session memlog note ('SQS formula stays open pending re-understanding pass') is historical — the ledger wins. (3) ENH BATCH DEFERRED POST-V1: the 71 pending enhancement entries flip to deferred ('for now, let's leave ENH batch of 71 as deferred after V1'), theme summary delivered in-session; entries are documentation-precision audit rows, not features. (4) CORPUS SIGN-OFF EXECUTED: the conditional go-ahead's condition is fulfilled — the independent contradiction sweep (workflow wf_93306df4-1f5, 14 agents, 2026-08-21) passed after two desk fixes (CT-28 world/replay amendment citing DEC-0160; DEC-0056/DEC-0124 supersession-flip corrections); operator authorized commits and push ('you make commits... then I think we might push because I really want to start coding soon')."
    cite: "operator-direct:2026-08-21 (PRD session; first-person dictation recorded at desk)"
    topics: [dec-0049, sqs, enhancements, sign-off]
    authority: rider

  - id: EXT-2094
    type: decision
    summary: "TN-1 IDENTITY, PACKAGING, BASE (as amended by the operator rulings and both gates): the trading node is ONE product with two modes, paper|live — never a separate paper product. It is a top-level uv-workspace member alongside qmb/ and qml/, code name `qmn` (QuantMind Node — the distribution and import CODE NAME only; the operator declined to rule the name, 'that question is not for this layer', and a rename is mechanical), an application layer built ON QMF exactly as QMB and QML are (L11/L31, ADR-0011, ADR-0012:36), never a qmf.* roster package and never a framework. Nothing QMX is published to any index; the node installs from ONE canonical checkout root on the VPS — git clone at a pinned commit plus `uv sync --frozen`, materialized as immutable per-commit trees under a `current` symlink (TN-16, NFR-10). BASE: node epics branch from origin/integration@ef9bb25, never the stale local integration ref at 2c8d495, and land back on integration through the factory lane; if the operator squash-merges to main first the lane re-points onto main (mechanical); 'start from main' is refused because main carries no packages/, qmb/, qml/ or extensions/. NO OPERATOR COMMAND LINE, RULED (line 48 Q1, applied at line 49): the node ships no product command line and no typed operator door of its own — its control surface is the desktop UI over the node's doors (TN-17) — so PRD FR-046, DEC-0159 and DEC-0185 Ruling C (qmb is the platform's single command-line surface) stand unchallenged and the CLI reconciliation note is WITHDRAWN; the pre-ruling memlog text naming a `qmn` command is superseded history. OPERATIONS TOOLKIT: install, switch, rollback, the secrets provisioning wizard, the data bootstrap, replay, config init/validate/explain, notify test, hub publish and the on-demand host-loss restore rehearsal are `just node-…` recipes in the repo's existing root justfile with bodies in one place under qmn/deploy/justfile-recipes/ — DevOps tooling, 'a very separate system, like how big tech teams work', never a trading control and never a product command line: no recipe places, cancels, amends, flattens, promotes or activates anything, and the restriction is enforced BY THE TRANSPORT (recipes run under the powers channel's ops principal, refused every trading, protection, promotion, activation, settings, resurrect, attestation and countersign power), node-install/node-switch/node-rollback are privileged host acts through the declared sudo admin path touching no door, a recipe needing live node state makes the same door call the UI makes, and no recipe ever constructs a composition root or imports the Python API in another process. ENFORCED NOT ASSERTED: a tier-1 check assertion that no workspace member declares a publishable target, and a second that qmn's packaging declares no console-script entry point, so the deleted command-line surface cannot re-enter through packaging. DECLARED RECONCILIATION NOTE for the documentation factory, one half only: L30's scope annotation says 'applications still never import qmf-venue', while the node's composition root is the one sanctioned importer and wirer of qmf-venue (AD-28 — someone must construct the adapter); the sanctioned boundary is the `qmn.venue` SUBPACKAGE, not the root module alone, every other qmn module receiving VenueClientPort and CT-19/CT-20 shapes only and the L30 default-deny lint written against that boundary; qmb keeps its ban; the conflict is SURFACED for annotation at source and nothing is amended by a child. NAMING BLAST RADIUS bounded: /opt/qmx, the /var/lib/qmx trees, the qmx service account and the qmx/* credential labels are PLATFORM names that stay; the distribution name, import name, `just node-…` recipe prefix and `qmn_` metric prefix are ONE identifier set that moves together. BINDS all node code, the factory lane, the workspace layout. PREVENTS a second toolbox package, a published artifact nobody ratified, a node built on a codeless branch."
    cite: "SRC-11:.memlog.md#line-16"
    topics: [trading-node, tn-1, identity, packaging, no-command-line, operations-toolkit, l30]
    authority: rider

  - id: EXT-2095
    type: decision
    summary: "TN-2 COMPOSITION ROOT AND THE BOOT CEREMONY, compose then fingerprint then seal (as amended by both gates): the node is the ONLY place ambient time, broker sessions, secret values, async, threads, processes, schedules and real money exist; everything below it stays pure (AD-15, L13). TWO THINGS HAPPEN BEFORE ACT 1 (line 46 ruling 11): the supervisor/door layer BINDS FIRST — evidence channel, preflight-status read model, the resurrect power — and a BOOT-ATTEMPT RECORD carrying boot epoch id, unit role and stage reached is the first durable write, with composition_fp stamped onto it at act 3 as an amendment; only a failure that prevents the doors binding exits non-zero, every later failure booting into stand-down-alive (TN-4 owns the exit model and the crash-loop fold). Then four ordered acts. (1) PREFLIGHT, a gate before any state mutation: host, disk headroom, network, clock sync (chronyc waitsync), pinned CPython/uv/proto tag/tzdata, credential presence (is_set metadata only), store reachability, the roster's declared credential-sharing facts, the roster's VPS machine tuple, the absence of any unit running under an operator-principal uid, and the ownership and mode of every writable tree — a DETECTED refusal is fail-closed with a typed failure id, journaled, and NEVER EXITS (line 51 ruling 5): the node stays alive in stand-down with the doors serving, so no systemd restart follows and the crash-loop fold never advances. (2) COMPOSE from ONE resolved node-config artifact (TN-18): the roster of (VenueId, AccountId, role, world) bindings with credential references, Book/BMS definition cites by fp1, VenueClientPort implementation selection BY THE PAIR (world, VenueId) and never by VenueId alone (line 51 ruling 6), explicit registration of every market-hours, day-boundary and news-calendar extension and every producer extension (never scanning), every do-not-default value, plus the real Clock, SecretStore, sinks and scheduler; a world=replay composition selects the replay implementation for every VenueId, resolves no credential reference, constructs no venue-session SecretStore holder and opens no socket, and preflight proves all three or refuses the boot. (3) FINGERPRINT: composition_fp = fp1 over the resolved node-config fp1, every distribution identity and version (qmf lockstep, qmb, qml, qmn) AND every registered extension's identity and version (AD-2), the proto release tag, the tzdata version, each adapter's static capability-declaration fp1, the registry as-of set fingerprint, every market-hours, day-boundary and news-calendar CODE identity and version, and the OS/CPU-class tuple — stamped as occurrence provenance on the boot-epoch record of every journal stream and on every artifact label, so that because journal.sequence is gapless per (writer, boot-epoch) every evidence row traces to the exact composition that produced it. The dated snapshot DATA those recorders ingest is deliberately excluded (a data revision never needs a restart, a code change does), the venue-observation profile is excluded because it is measured post-seal, and every candidate labeler enters TN-19's separate shadow_composition_fp so a candidate never re-identifies governed evidence. (4) SEAL: immutable for the boot epoch, no hot reload of anything identity-bearing; a config change is a new resolved config version plus a supervised drain-aware restart at a safe point, which never flattens, lets standing intents survive as folds, and never changes a runtime state (TN-18's partition rule; line 46 ruling 8 — config carries eligibility and identity only). ONE IMPURITY IS DELEGATED, named here and nowhere else (line 51 ruling 9): qmf-venue's ConnectionManager holds the venue socket, session and single in-memory venue secret value on the loop the node injects, under the injected Clock and SecretStore, owning no event loop, creating no unscheduled task, reading no ambient clock and holding no money — with the QMF async conformance test amended in the same increment to EXEMPT qmf.venue.connection BY NAME, and if the parent refuses, the increment lands in qmn.venue.ctrader and the epics may not choose. WriterId ALLOCATION IS THE ROOT'S EXCLUSIVELY: allocated at Compose from a declared namespace, proven pairwise distinct before Seal, journaled in full on the boot-epoch record beside composition_fp, refusing to boot on a collision, naming each (VenueId, account) command stream, the venue recording feed, the AD-31 risk-domain writer, the QL-1 Bot-domain record streams, each streaming-indicator feeder and each timer unit — with ONE id RESERVED rather than allocated (line 51 ruling 25): the SUPERVISOR WriterId, a constant of the unit role, owning the boot-attempt and lifecycle stream under /var/lib/qmx/state, never re-issued by Compose and included in the distinctness proof. TIMER UNITS run an abbreviated ceremony from the config version THE RUNNING NODE SEALED, read over the evidence channel and never from the config graph's `current` pointer (line 51 ruling 16), computing composition_fp over the same inputs so one deployment yields one value, minting their own boot epoch stamped with the unit role and writing only under their own WriterId; node-absent means compose from `current` and stamp node-absent; a timer that can establish neither refuses to write and alarms on the silent-degradation class; a timer needing anything the node process does not compose hands the work to the node through the doors, honoring B-4. BINDS qmn/host, every journal stream, every artifact label. PREVENTS two nodes composing the same rulebook differently and not knowing it, identity-bearing settings mutating under a running loop, a boot that fails where nothing can see it, two writers sharing one WriterId."
    cite: "SRC-11:.memlog.md#line-17"
    topics: [trading-node, tn-2, composition-root, boot-ceremony, composition-fp, writerid]
    authority: rider

  - id: EXT-2096
    type: decision
    summary: "TN-3 TOPOLOGY, PLANES, TRUST BOUNDARIES (as amended by both gates): three planes, two machines, one bucket. VPS PLANE (Linux, always on): ONE node process hosts the trading loop AND the live tick/bar/depth recording, because cTrader allows at most one demo plus one live connection per application, so the connection manager's canonical sensing feed IS the recorder and a separate recorder process cannot hold its own live connection; separate scheduled units run the news-calendar recorder, the nightly backup, the nightly sample restore and the monthly full restore, all under distinct WriterIds; the VPS provider is deployment configuration exactly as the broker and bucket provider are, never architecture; the always-on EVIDENCE TIER is a second directory tree on the same VPS — a placement and authority boundary, not a second host, not a database server, not a second writer — hot rooms never blocking on it, sync one-way, watermarked, idempotent and resumable under verify-before-purge; the VPS is the ONLY plane holding live venue credentials. WORKSTATION PLANE (Windows 11 now, Linux later): working archive as a controlled-room host (B-9), research reads, the future desktop app, the provisioning wizard — holding provisioning and bootstrap material ONLY and never rotated live session material, since the VPS session is the only refresher and the only holder of live session state, so a workstation tool never refreshes a credential the VPS session owns; Windows Credential Manager qmx/* is the provisioning source, the escrow home of the CT-14 backup payload key, and the home of workstation-local secrets only. BUCKET: nightly encrypted versioned copies, ciphertext only, PUSHED BY THE VPS (TN-13's timer) and never by the workstation — a 24 h RPO cannot depend on a laptop being awake and the bucket credential belongs where the timer runs. EPISODIC SANDBOX PLANE (factory agents): evidence carries provenance=sandbox, never merges, never holds live secrets. FLOWS are ONE-WAY node to evidence tier to workstation, and node to bucket, with TWO INBOUND CROSSINGS AND NO OTHERS: the click-gated promotion pull of registry as-of sets from the passive hub, which REFUSES any artifact carrying provenance=sandbox at pull (TN-20); and the sandbox fragment push into the write-only inbox over a restricted key-only SSH identity confined to /var/lib/qmx/hub-inbox, distinct from the operator's key and from TN-12's provisioning identity. THE PASSIVE FILE-SYNC HUB IS A SEPARATE TREE from the evidence tier's rooms (B-15): a write-only inbox for WriterId-scoped sandbox fragments and a read-only published area of as-of sets, where the inbox-to-published step is AN OPERATOR ACT and not a background sweep — the hub_publish power on the powers channel (line 51 ruling 11), signed and journaled, verifying each fragment's fp1 and refusing provenance=sandbox at publish as well as at pull, with `just node-hub-publish` the toolkit recipe calling that same power; the one-way sync never writes into the inbox, the inbox is never a room, nothing in either area is a service (DEC-0084 stands). WRITABLE TREES named once and pinned into the unit files by TN-16 (line 46 ruling 12): /var/lib/qmx/rooms, /evidence, /hub-inbox, /hub-published, /archive, /state (rotated secret material, the supervisor stream of boot-attempt and lifecycle records, and TN-4's reserved protection-intent extent) and /staging, all owned by the fixed qmx service account — plus two trees that are NOT the node's: /opt/qmx (one immutable tree per commit plus the `current` symlink; line 51 ruling 12) and /var/lib/qmx-observability under the stack's own account (line 51 ruling 13); every one is a named line item of vps_disk_budget. ROOM-ROLE PLACEMENT per world: AD-19's seven roles plus one node-minted EIGHTH, `sealed-archive` (line 51 ruling 26), all instantiated for live and for replay — ingest door, immutable raw archive, processed and journal rooms under rooms/<world>/; the split-governed research door, the registry room and sealed-archive under evidence/<world>/; the backup role is the bucket. sealed-archive is what the one-way sync writes into and what TN-21's replay import port and TN-13's backup read by name, and a hot room may be purged under hot_room_retention_window only when a verified copy exists in sealed-archive AND a verified off-host copy exists; replay gets its own instances of all roles under the same trees, the storage separation AD-12 requires. The eighth role is surfaced as a parent annotation, never asserted. BINDS deployment, evidence sync, secrets placement. PREVENTS a third machine, a second live connection, a live secret on a travelling laptop."
    cite: "SRC-11:.memlog.md#line-18"
    topics: [trading-node, tn-3, topology, planes, evidence-tier, passive-hub, sealed-archive]
    authority: rider

  - id: EXT-2097
    type: decision
    summary: "TN-4 PROCESS MODEL, SUPERVISION, STAND-DOWN-ALIVE, SHUTDOWN (as amended by both gates): the node is ONE long-lived process supervised by systemd — qmn.service, Type=notify, WatchdogSec set, Restart=on-failure — implementing the sd_notify wire protocol ITSELF over a stdlib AF_UNIX datagram socket (READY=1, WATCHDOG=1, the leading-NUL abstract-socket form, an unset NOTIFY_SOCKET) with no python-systemd or sdnotify dependency (line 46 ruling 11). THE KEEPALIVE IS OWNED BY THE SUPERVISOR/DOOR LAYER, never by the domain slice loop, so it continues through stand-down; the obligation that carries is that the door layer also runs TN-19's slice-progress watch (line 51 ruling 23), so a loop wedged inside a non-cooperative seat callback stops the keepalive rather than being masked by it. INSIDE: exactly one asyncio event loop with async ONLY at the venue edge and the doors (AD-15); the domain loop runs synchronously on that loop's thread per slice; the node's scheduler drives the adapter's five declared session duties (heartbeat at its 10 s venue-bound cadence, token refresh keyed by credential reference, reconnect, gap replay, verification monitors including the continuous D1-boundary monitor) plus the nightly cycle, the news-calendar refresh and the backup and restore hooks; NO threads for domain work; stdlib process-per-job only for isolated work — conformance Layer-2 runs, benchmark runs and REPLAY runs — with a replay run ALWAYS a spawn OUTSIDE the node process (line 51 ruling 6), composing a replay-scoped root from the same resolved config at world=replay, drawing WriterIds from a disjoint namespace, resolving no credential and constructing no live sink. DRAIN-ORDER DISCIPLINE applies to dequeue for interpretation ONLY, never to record-and-journal order: execution and system events are interpreted before market data so a tick storm cannot starve risk checks, while the accumulator's recorded stream preserves arrival order verbatim, which keeps the TN-21 replay diff meaningful. NODE STAND-DOWN IS AN ALIVE LIFECYCLE STATE, not a CT-30 control action (line 46 ruling 3): entered automatically on a crash loop, a `halt` clock band or a preflight failure, left ONLY by an operator `resurrect` through the powers channel — journaled as an AD-21 `control action` EVENT under the declared node subtype `node_resurrect`, operator signer, global scope, minting no CT-30 kind (line 51 ruling 4) — with no clocked clear, reconnect, reconciled verdict or restart leaving it, and named apart from the binding state `stood-down` and from CT-30 `resume`. IN STAND-DOWN the sequencers refuse and journal ENTRY intents ONLY — place_order and risk-increasing amend_protection, whatever their author — while EVERY risk-non-increasing act passes whatever its author (line 51 ruling 3): Book-minted protective closes, declared force-flat triggers, ExitLogicModule exits, bot-proposed tightens, the standing-intent dispatcher, and every operator-signed protective command; where sessions have quiesced a protective command is journaled as a standing protection intent before dispatch and satisfied on the next healthy session — never refused, never dropped — because 'reachable in stand-down' means ENACTABLE, not merely answerable; the doors keep serving throughout. THE EXIT MODEL (line 51 ruling 5): a DETECTED refusal at or after preflight does NOT exit; the crash-loop fold governs only failures that DO exit (a door-binding failure, any unhandled death after boot); a REQUESTED restart (settings edit, node-switch) exits code 75 under RestartForceExitStatus=75 / SuccessExitStatus=75, stamps reason=requested-restart on the next boot-attempt record, and NEVER advances (K,T). THE CRASH-LOOP FOLD counts UNREQUESTED BOOT ATTEMPTS — K within T seconds, node values, UI-editable, evidence value 3 boots in 60 s — from the supervisor writer's boot-attempt records, counting every attempt within T regardless of stage (stage recorded for diagnosis, never for bucketing), with StartLimitBurst MUST exceed K and StartLimitIntervalSec at least T so systemd carries the node to the boot that self-detects the loop; a burst at or below K leaves the node dead at start-limit-hit with no doors, answered by TN-15's dead-man's switch. A SAFE POINT, defined once: slice driver between slices, suspend_new enforced on every stream, every command terminal or UNKNOWN-minted, every sink flushed with block-on-unpersistable honored — positions NEVER waited on — bounded by drain_window (configurable, duration, blank blocks boot; TimeoutStopSec RENDERED from it) with a breach a typed refusal, and watchdog_interval the second such value rendering WatchdogSec (line 51 ruling 28). SHUTDOWN CONTRACT: SIGTERM mints a boot-epoch lifecycle STOP (not a CT-30 action) enforcing suspend_new on every stream under authority adapter_self, then closes sessions with no resubmission, then MINTS AN UNKNOWN for every command without a terminal outcome under the declared trigger `disconnect` — the mint following session close so AD-27's vocabulary applies honestly, with `lifecycle-stop` offered as a proposed CT-20 trigger and this ordering the node's rule until the parent rules — then flushes every sink; exit 0 for an operator stop, 75 for a requested restart, and a code that is neither where the safe point is unreached within drain_window after minting UNKNOWNs for the remainder; if the flush itself cannot complete the node stays up, alarms on the silent-degradation class and refuses to exit clean. Shutdown NEVER flattens; standing intents survive as folds and are re-decided at the next boot. UNDER A FULL DISK block-on-unpersistable and L39 compose: the block is entry-side only, the venue-resident protective stop carries the position, the door-owned keepalive keeps answering, and a protection intent the journal room cannot take is written to a small RESERVED PROTECTION-INTENT EXTENT under /var/lib/qmx/state sized by disk_headroom_min so the headroom block trips first (line 51 ruling 21), re-decided when storage returns, or recorded UNDELIVERABLE and alarmed — never held in memory, never silently dropped. BINDS qmn/host, qmn/deploy/systemd. PREVENTS a second event loop, background threads mutating folds, a restart loop churning the broker, a shutdown that loses an intent, a safety state that disarms the operator."
    cite: "SRC-11:.memlog.md#line-19"
    topics: [trading-node, tn-4, process-model, stand-down-alive, resurrect, safe-point, shutdown]
    authority: rider

  - id: EXT-2098
    type: decision
    summary: "TN-5 THE LIVE LOOP IS QMB'S LOOP, UNFORKED (as amended by both gates): the node drives QMB's B-2 event-slice loop through `run_slice`, the pure single-slice function, and never a second loop — binding at the root a live frontier clock (the real wall clock injected as qmf-core's Clock; the monotonic kind for every duration) and a live SliceHandler implementing the five hooks update_stream, scheduled_position_event, execute_resting, update_closed_data, mint_intents. The six pinned sub-phase order is identity-bearing and preserved verbatim; new intents rest a slice; instruments process in declared order; forming bars are never visible. A PUSH-TO-PULL ACCUMULATOR sits between the venue edge and the loop as the SINGLE FIRST WRITER of every inbound observation: the venue client hands it raw decoded observations, it records them through qmf-data's CT-15 intake into the live world room AND journals them under the allocated venue WriterId, and only then makes them foldable; the recorder duty is a ROLE of this one path and never a second writer, no component writes an inbound observation anywhere else, and recording precedes interpretation. THE SLICE FRONTIER IS THE RECEIVE WALL INSTANT stamped by the accumulator, the venue instant carried beside it as evidence (AD-8), so the live frontier is monotonically non-decreasing by construction and the accumulator's recorded stream order IS the replay cursor order — a replay reproduces slice boundaries from the recorded receive stamps, which is what makes TN-21's diff a decision diff and nothing else. The accumulator maintains a DURABLE INTERPRETATION CURSOR in the journal, committing at slice end after that slice's sinks have flushed and never mid-slice, so the re-fold boundary is always a completed slice; TN-10's boot order re-folds every observation recorded after the last committed cursor position BEFORE the protection-state projection, and every fold the re-fold touches is idempotent by observation identity (AD-27's venue-native key under AD-10's idempotent split), so a re-fold can never double-count a fill. The accumulator is BOUNDED (`accumulator_bound`, node value, do-not-default) with a TYPED OVERFLOW RULE: overflow never drops an execution or system observation — market-data observations coalesce and the coalescing is journaled as `data quality` — and a bound that cannot be honoured without dropping an execution or system observation is a `storage failure` blocking entries only. Slices are event-driven per observation with a declared `max_slice_latency` (node value, do-not-default) whose BREACH EFFECT IS STATED: a journaled `data quality` record plus a `no-new-entry` band effect, entry-side only per L39 — never a silent skip, never a stand-down; the loop never awaits I/O, since sinks are synchronous local writes and venue submissions are handed to the venue client whose outcomes arrive as observations in later slices. Candidate labelers are computed off the trading path and never counted toward max_slice_latency (line 51 ruling 14), and every producer feeding the signal snapshot reads as of the slice frontier, never wall-now (line 46 ruling 15). STREAMING INDICATORS obey the single-feeder law: exactly one WriterId holder per streaming instance allocated at Compose, a snapshot restoring equivalently only within the same SnapshotScope (OS and arithmetic-reference build injected, never read ambiently), a cross-scope restore refusing. ONE loop instance per (VenueId, account) command stream — the same unit as AD-37's one arbitration point per stream — several Books on one account sharing it with every coupling ruled at bind time in TN-22, cross-stream ordering a declared non-guarantee. Backtest, replay (TN-21) and live differ only in which clock and which VenueClientPort implementation the root binds — the port node-minted (TN-11) and SELECTED BY THE PAIR (world, VenueId), never by run mode and never by VenueId alone (line 51 ruling 6). BINDS qmn/loop and every consumer of qmb/runloop. PREVENTS forked live and backtest loops, look-ahead through a live feed, two orderings of one tick."
    cite: "SRC-11:.memlog.md#line-20"
    topics: [trading-node, tn-5, event-slice-loop, accumulator, interpretation-cursor]
    authority: rider

  - id: EXT-2099
    type: decision
    summary: "TN-6 THE ORDER PATH, CHAIN OF COMMAND WIRED NOT REDEFINED (as amended by both gates): the chain is bot, Book, BMS, operator (L36), wired without redefining a step. ENTRY-SIDE-ONLY BLOCKS as the node's own law (line 46 ruling 6; L39/AD-36): every block the node can raise — startup-reconciliation gating, rotation-store failure, unpersistable sink, partial write, node stand-down, a clock band, a full disk — refuses place_order and risk-increasing amend_protection and NOTHING ELSE, never cancel_order, close_position, close_all, a risk-non-increasing amend_protection, CT-23 close_full or tighten_protective_stop, nor the recording of evidence; a block that cannot be applied entry-side only IS NOT MINTED; where the venue path is unavailable a protective command becomes a standing protection intent (TN-7). THE ONE EXCEPTION IS THE PARENT'S OWN (line 51 ruling 1): AD-27's per-command UNKNOWN block is not a control and not an entry-side block — while an UNKNOWN is outstanding on a (VenueId, account) stream EVERY command on that stream is refused, protection included, because dispatching a close_position into a stream whose last submission's fate is unknown is how a position gets double-closed; the refused protective act stands as an AD-36 protection intent journaled before dispatch and re-decided when the block clears (re-deciding is not retrying); ONLY resolve_unknown clears it, never a reconciliation verdict. DOORS IN FIXED ORDER: the QL-7 bot callback over its declared footprint; the CT-23 Book door (admission, Book-resolved requested_r, the declared full-loss price derived by the per-family ExitLogicModule, which CONSUMES the bot's optional advisory_stop_proposal where the Book declares the ratified adopt-as-is module mode inside the existing module-id-plus-config shape, DEC-0185/DEC-0177); NO SCALE-IN (line 51 ruling 33) — an entry against an instrument on which the binding already holds an open VIRTUAL position is a policy rejection, stated over virtual positions so a netted account's shared venue position cannot mask it; protection windows (CT-31); SQS (AD-39, read only from the per-instant signal snapshot); bench (AD-41); the budget and sizing ladder (AD-40, over TN-25's virtual-ledger figures); the cohort-correlation slot; and L39 check_exit_preservation, wired and PROVEN on the live path. close_partial is NOT a V1 kind, so a Book- or bot-scoped partial exit is an `unsupported capability` refusal, never emulated by close-then-replace. BMS constraints are account-scoped (kill-line series, exposure, control-rank table). EXECUTION-TARGET RESOLUTION once at intent mint from the three AD-35 inputs (Book mode, seat state, active-control set), never from Book mode alone. THE PROTECTION GATE sits BEFORE command mint, entry-side blocking only, reading the KSA level fold at the effective scope, the standing-intent fold and the UNKNOWN block; risk-reducing commands pass every entry-side block unconditionally and dispatch ahead of place_order; the gate CONSUMES arbitration and never performs it. COMMAND MINT: fp1 identity including (VenueId, account), session epoch and the node-owned COMMAND ORDINAL — a different counter from the journal sequence and never the same object (line 46 ruling 9): the sequence is gapless per (writer, boot epoch) and restarts each boot epoch, the ordinal is monotone, never reused across the life of a stream, its high-water mark durable and recovered BEFORE the sequencers open, a stream that cannot recover it refusing to open. V1 maps into clientMsgId through a DURABLE COMMAND-ID-BINDING RECORD persisted BEFORE submission — (venue client id, command fp1, account, session epoch), named reconciliation evidence — because 100 characters cannot be a total injection over an fp1 digest space plus stream qualification. PROTECTIVE-STOP ATTACHMENT AT PLACEMENT (line 51 ruling 2): every place_order carries a venue-resident protective stop in the form CT-18 declares (the entry-relative form where absolute protection is unsupported for MARKET orders); where the Book requires attachment and CT-18 does not declare it, placement is an `unsupported capability` refusal — never a silently unprotected order — and AD-40's declaration stays the plan, never read back as the observed fill. COMPOUND COMMANDS fan out with derived child identities (parent fp1 plus declared ordinal), children ordered by child content fingerprint ascending, each observation- and journal-bearing, under a stated parent-outcome table (all accepted = accepted-by-venue; any child UNKNOWN = UNKNOWN; mixed = partially-executed; ALL rejected = rejected-by-venue, never partially-executed), scope resolving through the pinned versioned CT-30 table against the CT-18 position model and REFUSING rather than widening. VENUE SUBMIT through VenueClientPort: the pacer stays below the declared 50/s non-historical and 5/s historical ceilings PER CONNECTION; cancel_order, close_position, close_all and amend_protection are served ahead of place_order; suspend_new takes local effect instantly; THE SUBMISSION DEADLINE STARTS AT WIRE HANDOFF, never at mint; pacer admission time is a LOCAL QUEUE with its own bound whose breach is a typed veto-path refusal naming the pacer, never an UNKNOWN and never a stream block; a connection fault applies to EVERY stream bound to that connection, each journaling its own block. resolve_unknown, TWO PATHS WITH DECLARED PRECEDENCE, and the call is ITSELF A CT-20 OBSERVATION: an unambiguous observed-accepted|observed-absent read-back resolves automatically; ambiguous, absent or out-of-lookback requires operator attestation through the powers channel, the only path carrying a signer identity. AD-27's acknowledgement-mode consequence binds the outcome path — an outcome is NEVER derived from absence alone; a cancel resolved by read-back is accepted-by-venue only where the read-back shows no fill at or after the submit stamp, else rejected-by-venue (superseded-by-fill); a subject absent or already terminal AT SUBMISSION resolves without submission, never as a naked close; `denied-locally` stays an adapter pre-submission outcome minting an observation, never an authority-layer veto. Every door refusal is a `decision` event on the VETO PATH (CT-25's veto_ledger) carrying the refusing door and the would-have-been action; every arbitration loser is a `suppressed` control action on the SUPPRESSION PATH linked by `enacts` edges; ARBITRATION LIVES IN ONE COMPONENT — the control-action dispatcher in protection/, AD-37's one arbitration point per stream — strictly by rank with no arrival-order input, Tier 1 venue-resident actions outside the ordering, composing actions both executing, one command emitted where two actions produce the same mechanical command, a lower-ranked action never undoing a higher-ranked one, and a higher-ranked action never reducing the protection a lower-ranked one would have delivered. The risk dispatcher carries block-on-unpersistable exactly as the venue client does. VALUES THE NODE OWNS (do-not-default, UI-editable, blank or provisional-evidence blocks role=live): the submission deadline that mints UNKNOWN, the reconciliation lookback and cadence, the pacing and backoff cadence, the local-queue bound, the protective reserve capacity, the pool and health constants. RESPONSIBILITIES it owns (not values, never blank, never UI-editable): evaluating the AD-40 sizing ladder against live Book state, and issuing resolve_unknown under the two-path precedence. BINDS qmn/orderpath. PREVENTS a bot sizing itself, a second venue client, a timeout read as a rejection, an unjournaled refusal, a control that traps a position."
    cite: "SRC-11:.memlog.md#line-21"
    topics: [trading-node, tn-6, order-path, entry-side-only, command-ordinal, resolve-unknown]
    authority: rider

  - id: EXT-2100
    type: decision
    summary: "TN-7 KSA — THE PROTECTION AUTHORITY, AND THE KILL SWITCH UNDER A DEAD WIRE (as amended by both gates): the node ADOPTS the GitBook baseline explicitly under L37 and re-ratifies it here because docs/ never carried it (a grep for GREEN or BLACK across docs/ returns zero hits) — five levels GREEN | YELLOW | ORANGE | RED | BLACK (fixed enum, uneditable), four trigger classes scheduled_news | black_swan | connectivity | unknown_state (addable, never redefined), automatic transitions ESCALATE ONLY, de-escalation by an operator resume alone. THE KSA LEVEL IS A READ-TIME FOLD over the control-action stream declaring its full AD-36 fold contract — stream, ordering key, knowledge-time bound, equal-instant disposition — resolving across writers by AD-37 rank and never by WriterId byte order, returning the most restrictive state and alarming rather than refusing on the trading path. FOLDED PER ENFORCEMENT SCOPE (line 51 ruling 24): the scope is part of the level's identity and of its level epoch, two scopes exist in V1 (global, and per (VenueId, account) command stream), the effective level at any decision point is the most restrictive of the scopes covering it, an operator resume NAMES the scope whose epoch it opens rather than silently reopening every scope, and the exported KSA level signal carries its scope label — without the scope the monotonicity rule is not well-formed. A connectivity or unknown_state escalation on the LIVE connection does NOT block paper routing to the paired demo stream, because AD-35 rules them distinct (VenueId, account) streams whose uncertainty never gates each other and a silent paper outage corrupts every later decay verdict: the escalation blocks the stream it names and no other, while a GLOBAL escalation blocks both live and paper alike. THE FOLD IS MONOTONE NON-DECREASING WITHIN A LEVEL EPOCH (line 46 ruling 3): it takes the maximum over every escalation record and lowers ONLY on an operator resume record opening a new level epoch — resolving a trigger's underlying condition, satisfying a standing protection intent, a reconciled verdict, a reconnect, a clocked clear, a restart, or the mere absence of new escalations never lowers it — and most-restrictive-on-ambiguity governs which level an ambiguous escalation resolves to, never whether a level decays. THE TRIGGER-TO-LEVEL-TO-EFFECT MATRIX is the node's severity policy: a configurable UI-editable node variable set, ksa_effect_matrix, carrying NO spine value, where each cell declares three mandatory things — an effect drawn ONLY from CT-30's kinds suspend_new | drain | flatten (a flatten resolving at dispatch into close_position or close_all CT-19 commands through CT-30's pinned resolution table; close_all is a command kind and never a control effect), a required typed scope, and the AD-36 satisfaction predicate from the full closed vocabulary scope-flat-at-reconciled-verdict | no-pending-orders-at-reconciled-verdict | never-auto, the middle one expressible in a cell and not silently dropped (line 51 ruling 33) — with a blank or provisional-evidence cell blocking role = live bindings (L38 / FR-035; line 46 ruling 16) while paper may run, and the legacy donor matrix (GREEN normal, YELLOW caution, ORANGE block new entries, RED protective posture, BLACK force-close) recorded as evidence only. EVERY TRIGGER KIND THE NODE MINTS DECLARES ITS AD-35 DISPOSITION, routes-to-paper | blocks-paper, as a mandatory field whose classification is fixed by the invariant and not by the author: scheduled_news and black_swan are market-risk blocks and blocks-paper; connectivity and unknown_state are blocks-paper on the escalation's own scope only; a kill-line stand-down and a benched seat are capital-or-authority blocks and routes-to-paper; and a kind minted with no disposition is an invalid input refusal at registration. THE KILL SWITCH IS THE KSA at its blocking levels — global, stopping all NEW trading live and paper alike, sensor-fed, with the MIS snapshot and SQS as inputs and never authorities. UNDER A DEAD WIRE OR AN OUTSTANDING UNKNOWN the satisfaction predicates are AD-36's verbatim and are never collapsed into one: suspend_new takes local effect instantly with no round trip, suspend_new AND drain are never-auto and stand until an operator resume with a reconciled verdict never clearing them, flatten satisfies only on scope-flat-at-reconciled-verdict, a command outcome never satisfies an intent, drift | unknown | out-of-lookback alarm and hold the intent open without dispatching, and a dead node is answered by the venue-resident protective stop (AD-33) — superseding the original entry's 'drain/close_all become standing intents satisfied only on a reconciled verdict'. THE STANDING-INTENT MACHINERY BINDS EVERY RISK-NON-INCREASING ACT and not only CT-30 kinds — amend_protection under AD-34, CT-23's close_full and tighten_protective_stop under AD-33, and every protective close — journaled before dispatch and, where the journal room is unpersistable, into TN-4's reserved protection-intent extent rather than merely into a fold (line 51 ruling 21), resolved as a read-time fold, re-decided rather than retried, never time-expiring and alarming when undeliverable; without it the apparatus would cover four control kinds and leave most actual protective acts to evaporate on the first transient refusal. THE KSA AUDIT TRAIL is the CT-25 projection ksa_audit_log over the control-action stream, never a stream of its own. DEC-0049's detector-pause scoping holds verbatim: automatic detectors act only through entry-blocking controls at the narrowest affected subject and never on positions or exits (L39 holds), with the inform-versus-pause posture a UI-editable node setting. BINDS qmn/protection, the node severity policy. PREVENTS an invented matrix, an automatic de-escalation, a flatten that fires on a guess."
    cite: "SRC-11:.memlog.md#line-22"
    topics: [trading-node, tn-7, ksa, protection-authority, kill-switch, effect-matrix, standing-intent]
    authority: rider

  - id: EXT-2101
    type: decision
    summary: "TN-8 [ADOPTED] THE RISK PROTECTION SET THE NODE RUNS VERBATIM, and the node-minted value roster (as amended by both gates): AD-33 through AD-41 and CT-29 through CT-32 RUN VERBATIM — the node ratifies the parent's ratified protection set BY ADOPTION, with GitBook and the trading-node documentation the authoritative risk-and-sizing layer under L37 — and the node mints VALUES, never rules. KILL LINE, one variable, one declared series, one cadence (line 46 ruling 1): kill_line_capital_floor is the ratified registry key and IS AD-40's loss_floor — one value, one name, read by both the ladder and the breach test, with no second name minted — declared by the Book definition and evaluated PER BINDING against that binding's virtual-ledger equity marked to the latest observed price of its own virtual positions (realized plus unrealized, TN-25), on every slice carrying a fill or a price update on an instrument the binding holds and at every accounting rollover; venue equity (balance plus unrealized, converted_by = venue, exact integers at the account money exponent) is the BMS and account view and the reconciliation counterpart and NEVER the per-Book breach series, while book_capital (period-open, excluding unrealized) is the sizing ladder's input only; a breach auto-flattens THAT binding's scope with close_reason = kill_line_flat (minted apart from protection_forced_flat), stands that binding down (binding state stood-down, never a Book-mode row), leaves other bindings of the same Book definition unaffected, returns only on an operator signature per binding, and declares disposition = routes-to-paper. FLATTEN AUTHORITY IS AD-36'S THREE and a money boundary is never one of them — the operator at any scope, always, unconditional and never gated on reconciliation; Book policy only through pre-declared trigger classes, the kill-line breach included; the protection authority where the matrix declares a flatten effect for that severity; venue-delegated trailing where the venue manages it and a Book opted in — and NEVER the adapter, whose adapter_self authority is limited to suspend_new, drain, throttle and session state, with AD-33's other flatten paths (hold_time_force_flat, boundary_flat, window_forced_flat, protection_forced_flat, operator_close) declared Book triggers at AD-37 rank 2 rather than exceptions to that list. NEWS BLACKOUT is instrument-scoped via dated per-instrument currency-exposure records — reading a currency out of a symbol is prohibited — entries only, live and paper alike, suppressed decisions journaled on the veto path, fail-closed on a missing exposure record, with no live skip button. A NEWS-CALENDAR REVISION MAY ONLY WIDEN OR ADD A WINDOW AUTOMATICALLY (line 51 ruling 7): a revision that would narrow, shorten, downgrade the severity of, delay the start of or remove a window currently in force or beginning within the current trading day is ingested and journaled as evidence, takes effect no earlier than the end of the window the superseded revision declared, never opens entries the superseded revision blocked, and is otherwise an operator act on the powers channel citing both revisions — without which the twice-hourly refresh of TN-13 would be an automatic protective de-escalation on the most frequently changing protective state in the system. STALENESS FAILS CLOSED BY A PER-DECISION-CYCLE PRECONDITION, news_calendar_max_staleness (do-not-default, configurable, duration unit-kind), evaluated exactly like a clock band: where the newest ingested snapshot's ingestion instant is older than it, entries fail closed on every binding holding news-exposed instruments, so a silently dead timer fails entries closed with no signal from the timer. DEAD ZONES are daily_dead_zone plus session_handover_buffer with a mandatory anchor pre-close | post-open | both: entries pause while exits, safety acts and data streaming are never blocked; THEIR WIDTHS CARRY NO SPINE VALUE AND NO NODE POSTURE — A8 RETIRED at the reviewer gate — the variable is blank do-not-default and a blank blocks live, the QMX-discussion layer's disagreeing figures (a one-hour table row against Flow 9's roughly three-hour prose) are recorded UNMERGED as evidence with their source layer and never as a default, and which band the operator ratifies is a hand-off recommendation rather than spine text; the original entry's 'sitting default posture = the wider roughly 3 h band around the daily rollover' is WITHDRAWN. SQS is the V1 ratio sensor as a CT-16 configured producer with the node as the BASELINE PRODUCER from its own live tick recording — one governed producer, published once, reaching the Book door only inside the per-instant signal snapshot (line 46 ruling 15) so one instant carries exactly one SQS value — with markers ok | not_ready | unavailable | stale | refused, a live binding requiring a present baseline KEYED (VenueId, environment, instrument) so a demo-conditioned baseline NEVER satisfies a role = live binding (the live baseline is minted from live-connection recording during the warm-up week, and the soak proves the minting and blocking mechanics on the demo environment rather than the live baseline itself), and instrument class a dated AD-9 instrument_class metadata record that is operator-declarable and correctable and never parsed from a symbol, no class record meaning blocked with the absence journaled as data quality and alarmed (AD-38's missing-record rule mirrored verbatim). THE BREAKEVEN RATCHET is V1's only dynamic protection, single-sided amend_protection until amend atomicity is measured at the venue (TN-11's sixth first-connection check), and its minimum step amend_min_improvement is ORIGINATION POLICY AND NEVER A GATE — a Book exit_policy authoring threshold declaring when the ratchet PROPOSES an amendment — so NO node component on the command path may refuse a risk-non-increasing amend_protection: a proposal not made is not a block, and a proposal made is dispatched (L39 / AD-36). BENCH is a read-time fold over CT-29 records of VIRTUAL (Book) positions with predicate realized_r <= -q, breakevens never counting under any q, a fill's CT-29 record persisting before the next intent on that seat (else stale evidence), its stream boundary the binding epoch (a new epoch starts at zero unless a signed carries-ledger edge spans it), and a benched seat declaring disposition = routes-to-paper and routing through its seat record's execution target while the Book stays LIVE. SAME-TICK PRIORITY is one BMS-declared rank table per stream with ranks total and unique, checked at admission Layer 1, a Book whose control policy contradicts its BMS's table refusing at bind time. THE NODE-MINTED UI-EDITABLE VARIABLE ROSTER — registry rows declaring schema and evidence values only, the resolved values living in the config artifact (TN-18) — is: ksa_effect_matrix; daily_dead_zone_width (evidence recorded unmerged, no default); session_handover_buffer_width and session_handover_buffer_anchor; news_blackout_before and news_blackout_after per severity; the seven sqs_* keys PLUS the Book-scoped decision_freshness_bound, which AD-39 makes mandatory and non-defaultable and against which a configured SQS input age is refused at the door; breakeven_ratchet_trigger and breakeven_ratchet_offset; qualifying_loss_threshold q per family; bench_consecutive_loss_threshold per bot, KEPT SEPARATE from the money-ladder divisor seat_loss_run_allowance (the legacy coupling being the recorded defect); amend_min_improvement per Book as the ratchet's authoring threshold; the clock bands of TN-14; the crash-loop K and T, drain_window and watchdog_interval of TN-4; and news_calendar_max_staleness. Every blank is partitioned blocks-boot | blocks-role-live | blocks-soak across the mint table (line 51 ruling 20), and a provisional-evidence value blocks role = live exactly as a blank does (line 46 ruling 16). BINDS qmn/protection, the registry variable rows the node mints. PREVENTS the node redefining a ratified control, the bench threshold re-coupling to the money-ladder divisor, a tick-storm amend flood."
    cite: "SRC-11:.memlog.md#line-23"
    topics: [trading-node, tn-8, adopted, kill-line, flatten-authority, news-blackout, dead-zone, sqs, bench, variables]
    authority: rider

  - id: EXT-2102
    type: decision
    summary: "TN-9 PAPER MODE AND THE SOAK AS THE FULL UNATTENDED WARM-UP WEEK (as amended by the operator ruling and both gates): paper is a Book-level mode (AD-35 / CT-24) expressed as a dated binding-epoch change CARRYING A MANDATORY state_carry DECLARATION PER COUNTER (TN-25); the paper target is the paired demo account — role demo, world = live — carrying its own BMS instance linked by a typed pairing record (AD-29), and K-27's 'paired demo binding for fail-mechanism fills' IS this mechanism, reconciled not contradictory; exactly one active paper-routing target per live binding, with execution_target resolved once at intent mint from (Book mode, seat state, active-control set); paper balance is family-scoped and frozen, a reset mints an operator-signed paper_epoch treasury boundary record (AD-16), and paper P&L never crosses the money boundary and never buys a seat. WHAT ROUTES AND WHAT BLOCKS follows AD-35's invariant: a CAPITAL OR AUTHORITY block routes to the paired target while the Book stays LIVE — a benched seat and a kill-line stand-down both route and the evidence keeps flowing — while a MARKET-RISK block blocks paper too, so a protection window, a dead zone and the kill switch stop paper entries exactly as live, and a blocked or silent paper stream raises the live alarm class. ROLE SCOPING IS DECLARED RATHER THAN COLLAPSED: the paired account is minted with AD-9 role demo and every routing reason writes under it, the finer roles paper-validation and paper-benched are DELIBERATELY NOT USED IN V1, and the consequence is stated — Book-mode PAPER evidence and benched-seat evidence land in one role-scoped namespace and are told apart by the routing reason on the execution-target record, never by namespace — a later split being a role addition rather than a re-write. THE SOAK IS MILESTONE 1 AND IT IS THE FIRST-DEPLOY WARM-UP WEEK, RULED by the operator 2026-08-28 ('two days to a week... I think a week is enough and sufficient'): for one full UNATTENDED week the node runs in paper mode on the demo account with the FULL live machinery — a real cTrader connection, the verification suite, reconciliation read-backs, standing intents, KSA, windows, SQS baseline minting, recording, backups, the restore drills, the doors, metrics and alerts — under full logging and monitoring, and it is the SAME week as the ratified roughly one-week warm-up rider (AD-39's pre-live rider; one attribution, one rider), never a soak nested inside a longer rider; the original entry's 'the roughly 2-day soak is the first two days of the ratified roughly 1-week warm-up rider' is superseded, the first-connection verification suite still preceding it. THE SOAK RUNS THE DEMO BINDING WHILE THE LIVE CONNECTION IS OPENED FOR SENSING AND RECORDING ONLY (line 51 ruling 32): the demo connection carries paper routing and the full order-path machinery, and as soon as live credentials exist the live connection opens with NO live binding, NO command stream open and NO live roster binding minted, so the live-environment SQS baseline (keyed (VenueId, environment, instrument), TN-8) and the live-path rung baseline accumulate on the live environment while the machinery proves itself on the demo one; THE LIVE BINDING WAITS ON ITS OWN BASELINES, a precondition stated here and gated in TN-23, so a late Spotware approval or KYC delays go-live and NEVER the soak — the week runs with the demo connection alone and the live baselines begin the day the credentials land — and the connection count is derived from the roster (a soak roster naming one (venue, environment) pair opens one connection, a roster naming two opens two). THE PAPER LEDGER RUNS (line 46 ruling 20): the paired binding keeps a full virtual ledger (TN-25) — frozen starting balance plus realized plus unrealized of its paper virtual positions — so a paper capital floor is evaluable and the kill-line mechanism is exercisable in paper, the frozen balance being what is never hand-adjusted while the equity series moves. DAY-ONE DRIFT CHECKS IN PAPER ARE TWO: the paper ledger must reconcile against its own CT-29 and fill records as self-consistency at epsilon 0 in the exact integer domain (TN-10), and the full reconciliation read-back runs against the demo account with a non-zero residual ALARMING for investigation rather than halting — and THE DISCRIMINATOR IS ROLE, NEVER WORLD, because the demo binding carries world = live by AD-12 and keying the live drift stand-down on world would stand the soak down on the first demo-server quirk — with these alarms delivered during the soak as a soak-scoped demo-drift digest rather than the live drift alarm class, so the operator is not trained to dismiss drift alarms in the week before go-live. LIVE BINDING COMES ONLY AT THE END of that week and only on instruments whose checks passed AND whose live-conditioned baselines are present. UNATTENDED IS A DESIGN CONSTRAINT rather than a schedule note: the alert allow-list, the dead-man's switch and the liveness digest (TN-15) stand in for a watching operator, and a synthetic alert is proven delivered end-to-end before the node is left alone (TN-23); TN-23's injected-fault drills are discrete operator-performed acceptance acts at the week's boundaries or at declared drill points, and the continuous run between them is what is left alone. ACCEPTANCE IS MACHINERY PROOF — the TN-23 checklist with its fault-injection drills, UNCHANGED by the duration ruling, since a longer soak proves the same machinery over a fuller daily-boundary and session cycle — and NEVER profit, because paper evidence can never authorize live money (SCN-0007, AD-32). BINDS qmn/paper, the milestone plan. PREVENTS a paper twin, a profit gate, an untested reconciliation meeting live money first."
    cite: "SRC-11:.memlog.md#line-24"
    topics: [trading-node, tn-9, paper-mode, soak, warm-up-week, demo-binding, acceptance]
    authority: rider

  - id: EXT-2103
    type: decision
    summary: "TN-10 [ADOPTED] STARTUP, RECOVERY AND EXPLAINED-DRIFT DOCTRINE (as amended by both gates): the PRD's mined Phase-2 doctrine is RATIFIED BY ADOPTION with ONE declared narrowing named at its point of use — the PRD's 'unexplained live drift halts trading' is narrowed to an entries-only stand-down, AUTHORIZED BY L39 exactly as TN-11 narrows AD-28's sensing-outage rule — and the GitBook start sequence is recorded as this doctrine's ancestor rather than a competing rule. After TN-2's seal the boot order is FIXED at ten steps: (1) connect per environment; (2) the FIRST-CONNECTION VERIFICATION SUITE of SIX verify-or-refuse checks — spot-timestamp unit, D1 boundary, bar-basis reconciliation, pip formula, money exponent, and AMEND ATOMICITY (AD-34's undocumented measured-at-connection field, whose verdict gates whether dual-sided amends are ever legal and whose absence leaves single-sided amendment the only path) — landing in the per-(VenueId, account) venue-observation profile, a failure refusing the dependent evidence class and journaling a data quality event; (3) RE-FOLD OF THE INTERPRETATION CURSOR, every observation recorded after the accumulator's last committed cursor position folded before any state is projected (TN-5), so nothing recorded before a shutdown is lost to interpretation; (4) reconnect gap recovery, fetching deals and positions since the last-seen execution event, recovered fills committing through evidence BEFORE the session reports healthy, a no-gap reconnect still emitting correlation evidence; (5) the reconciliation read-back over the declared lookback with FOUR verdicts; (6) resolution of outstanding UNKNOWNs — automatic on an unambiguous observed-accepted or observed-absent, operator attestation through the powers channel on an ambiguous, absent or out-of-lookback read-back, with the evidence channel serving the outstanding set WITH its per-command read-back detail so the attestation is made against evidence rather than a count, and a typed refusal rather than an offered choice where the read-back cannot support attestation; (7) missed-rollover catch-up, boundary equity reconstructed from journals and the sweep journaled as an AD-16 treasury boundary event (sweep | refund | re_seed | paper_epoch_reset, mapped onto AD-21's risk transition) appended as a correction — no money moves without one, it never closes a position and it never re-bases a frozen R; (8) protection-state projection over standing intents, KSA level, Book modes, binding states, seat states, bench counts, exposure and budgets, ALL read-time folds with no safety counters to reset; (9) readiness gates — clock sync and drift band ok, an SQS baseline present per door, a consistent control-rank table, every market-hours, day-boundary and news-calendar identity verified plus the pinned tzdata, and FOR role = live BINDINGS ONLY a live-path rung baseline on this deployment tuple, minted by the benchmark harness and never by the trading loop so a first boot is not circular; and (10) command-ordinal recovery before the sequencers accept intents, a stream whose ordinal cannot be recovered refusing to open. EVERY FOLD declares its stream, ordering key, knowledge-time bound and equal-instant disposition as pinned contract surface and resolves across writers by AD-37 rank and never by WriterId byte order; no fold on the trading path refuses — one that cannot resolve returns the most restrictive state, journals data quality and alarms. THE ARITHMETIC DOMAIN IS DECLARED (line 46 ruling 10): equity derivation and drift decomposition are exact scaled-integer arithmetic at the account's declared money exponent, each venue-supplied converted figure decoding once at its own declared exponent and re-scaling to the account exponent by exact integer arithmetic with NO float participating in the sum, and a figure arriving with no declared exponent or at an exponent that cannot be re-scaled exactly REFUSING the derivation with a typed refusal rather than approximating; reconciliation_epsilon = 0 is a statement about that domain, and no tolerance is ever introduced to absorb a representation error that does not exist. EXPLAINED DRIFT IS TWO RESIDUALS COMPARED SEPARATELY, each with its own epsilon-0 identity and NEVER one blended number (line 51 ruling 10): (a) QUANTITY — the sum of virtual (Book) positions per instrument (TN-25) against the venue position picture for that account, in exact instrument quantity units, under the account's declared netting | hedging model, through AD-27 reconciliation evidence; and (b) CASH — the venue's realized balance against the virtual ledger's realized cash plus the named components (swept-but-unwithdrawn cash, re-seed remnants, and venue-charged fees or financing not yet journaled) in exact scaled integers at the account money exponent. UNREALIZED P&L ENTERS NEITHER RESIDUAL because it is a mark, not a fact, and marks are never reconciled: the venue equity series (venue-marked, converted_by = venue) and the binding's virtual-ledger equity series (node-marked at the slice frontier) are reported SIDE BY SIDE with their mark instants and are NEVER differenced — differencing two marks taken at two instants under epsilon 0 would set operator_review permanently on any open position and gate promotion forever — and floating P&L remains an explained, named, never-swept component of the equity narrative rather than a term in a residual. Drift is a non-zero residual in (a) or in (b) and ONLY that sets operator_review, which is a journaled binding-scoped state, folded like any other, that gates the NEXT live promotion or activation on that binding and gates nothing else: it never blocks the command stream, never blocks an exit, and clears only on an operator resume after a fresh reconciliation review. UNEXPLAINED DRIFT IS KEYED ON THE BINDING'S ROLE AND NEVER ON ITS WORLD: a role = live binding stands down FOR ENTRIES ONLY — exits, protection amendments, standing intents and evidence continue per L39, which is what authorizes narrowing the PRD's 'halts trading' to the entry side — with no automatic resume and a restart never permission to resume, while a role = demo binding alarms at the live severity class and continues whatever its world. A DEPLOYMENT-TUPLE CHANGE INVALIDATES THE RUNG BASELINE: where the declared (OS, CPU-class) tuple changes under a running node — a VPS live migration, a rebuild, a resize — new role = live bindings are blocked entry-side until the benchmark harness re-records a baseline on the new tuple, the change alarms on the silent-degradation class, existing live bindings keep exits, protection amendments and evidence per L39, and AD-24's light claims degrade to provisional on the same event. RECONCILIATION CADENCE is a node value — after every UNKNOWN, on every reconnect, at each accounting rollover, and on a configurable periodic tick — startup reconciliation gates ENTRIES only under TN-6's entry-side rule while the sensing pipe flows from boot, and a clocked reconciled verdict satisfies a flatten intent and never lowers a KSA level. The original entry's five verification checks and its single blended residual are superseded. BINDS qmn/host boot, qmn/reconcile. PREVENTS trading on a false account picture, a crash resetting a counter, a sweep moving money that might not exist."
    cite: "SRC-11:.memlog.md#line-25"
    topics: [trading-node, tn-10, adopted, startup-order, reconciliation, explained-drift, operator-review]
    authority: rider

  - id: EXT-2104
    type: decision
    summary: "TN-11 VENUE INTEGRATION ON cTRADER — the transport increment, the node-minted port, equity derivation (as amended by both gates): IC Markets is deployment configuration and never architecture. THE TRANSPORT LOCUS IS DECLARED, NOT ASSUMED: qmf-venue owns its own transport and already ships the ConnectionManager as the AD-26/AD-28 sole owner of venue sessions and the single in-memory holder of secret values, so the missing pieces — the asyncio TLS socket to demo.ctraderapi.com and live.ctraderapi.com on port 5035, length-prefixed ProtoMessage framing over the pinned proto release tag 91 compiled in-house against protobuf 7.36.0 with zero Spotware code, request encoding, clientMsgId generation and matching, the submit path, market-data subscription (spots with timestamps opt-in, live trendbars inside spot events, depth verbatim), account auth, in-band token refresh via ProtoOARefreshTokenReq, and the cents and volume decoder that decodes from the wire's int64 fields at their declared exponent straight into scaled integers, no float participating and a money field arriving in a floating form refused rather than converted (line 51 ruling 19) — are a qmf-venue INCREMENT THAT COMPLETES THAT EXISTING COMPONENT, delivered as QMF-side stories the node's epics depend on, with protobuf staying a qmf-venue-only dependency, no second connection manager minted and no second in-memory secret holder existing; the original entry's 'the node ships the in-house transport qmf-venue deliberately lacks' is superseded by that declared locus. The increment carries TN-2's delegated-impurity clause and, in the same increment, the amendment exempting qmf.venue.connection BY NAME from QMF's async conformance test (a proposed parent annotation); if the parent refuses the exemption the increment lands in qmn.venue.ctrader instead and THE EPICS MAY NOT CHOOSE (line 51 ruling 9); the increment also carries the SessionTopology relaxation. qmn/venue/ctrader/ holds only what is genuinely node-side — duty scheduling, the verification-suite runner, equity derivation, the CT-18 field fills, the error-map rows and the port implementation — and the qmn.venue subpackage is the sanctioned qmf-venue import boundary (TN-1's L30 note) against which the L30 default-deny lint is written. THE NEUTRAL PORT IS NODE-MINTED BECAUSE THE INVENTORY SAYS THERE IS NONE (line 46 ruling 13): qmf-venue exposes exactly one Protocol, ProbeTransport, and there is no VenuePort, OrderPort or VenueAdapter seam at ef9bb25, so AD-28's 'one neutral port' is a contract statement rather than an injectable seam; the node therefore mints qmn.venue.VenueClientPort over the CT-19 command and CT-20 event and reconciliation shapes, owns its versioning, and ships THREE V1 implementations — the cTrader client composed around qmf-venue's concrete typed values, TN-21's replay adapter, and TN-23's FEAT-0023 venue conformance double, which must implement the same port or the conformance suite proves nothing about the port. THE IMPLEMENTATION IS SELECTED BY THE PAIR (world, VenueId) AND NEVER BY VenueId ALONE (line 51 ruling 6): world = replay selects the replay implementation for every VenueId and the composition REFUSES to bind any venue-connecting implementation into a replay composition, because a replay of a recorded IC Markets day must never resolve to the cTrader client. qmf-venue is NOT amended to carry the port, and realizing the seam inside qmf-venue instead is recorded as a candidate AD-28 parent annotation for the documentation factory — surfaced, never settled by a child; TN-2, TN-5, TN-21 and TN-22 say 'the port' and mean this one. CONNECTIONS ARE KEYED BY (venue, environment) under the cTrader platform cap of one demo plus one live with accounts multiplexed, and THE CONNECTION COUNT IS DERIVED FROM THE ROSTER — one connection per (venue, environment) pair the roster names, never a fixed requirement — so a soak roster naming the demo pair alone opens one connection and the week runs before live credentials exist (TN-9), while SessionTopology's shipped required_connection_count = 2 ClassVar is a qmf-venue increment item to relax (A37); a connection fault blocks EVERY command stream bound to that connection, enumerated from the roster at Compose. THE NODE FILLS THE 19 UNFILLED CT-18 FIELDS, marking each static or measured-at-connection, with the load-bearing rows named rather than counted because each is verify-or-refuse and several gate bind time: the position model netting | hedging per account (measured at connection; it decides scope resolution and the fill-to-virtual-position attribution requirement), account settlement currency, the margin model with leverage and the venue's own margin-call and venue_liquidation level, the instrument value-factor surface, amend atomicity, protective-stop attachment form per order type (the field TN-6's placement rule reads, whose absence under a Book that requires attachment is an unsupported capability refusal), venue-managed trailing support, the reconciliation lookback declaration, acknowledgement mode per command kind (whose consequence binds the node's outcome path — an outcome is never derived from absence alone), and throttle_scope. ERROR-MAP ROWS ARE PINNED, an unmapped code defaulting to (transient venue failure, retryable = no, outcome = UNKNOWN) plus an alarm, and a requote is an ordinary mapped venue rejection through that table with no separate vocabulary and no separate path. EQUITY DERIVATION is balance plus per-VENUE-position unrealized P&L using the venue's own converted figures with converted_by = venue provenance and no QMX conversion, in TN-10's exact scaled-integer domain at the account's declared money exponent, each figure decoded at its own declared exponent and re-scaled exactly, a missing or unscalable exponent refusing rather than approximating; this series is the account and reconciliation view and is NOT the per-Book kill-line series of TN-8. Session duties run on the node scheduler (TN-4); TOKEN REFRESH IS KEYED BY CREDENTIAL REFERENCE, NEVER BY CONNECTION (TN-12), with retry-after-refresh confined to requests carrying no command identity (line 51 ruling 8); command retry is prohibited and session recovery never resubmits. VENUE MAINTENANCE WINDOWS ARE NOT A FOURTH CONTROL-WINDOW KIND — a down session or dead feed already fails closed FOR ENTRIES under L39's authorized narrowing of AD-28's sensing-outage rule, with no silent failover and the maintenance timestamp journaled as data quality — a conscious divergence from reviewer recommendation QB1a to treat an announced window as a dead-zone window, whose accepted consequence is that an announced window does not proactively block entries ahead of the disconnect; the continuous D1-boundary monitor re-verifies at a configurable cadence (evidence: daily and across DST transitions). THE TRENDBAR BASIS (ticket 006) is measured per broker at first connection as already ratified — secondary web evidence says BID, a Spotware moderator on the official forum with no documentation page — and until it is recorded, backtest-to-live comparisons are TICK-based and never trendbar-based. BINDS qmn/venue/ctrader. PREVENTS Twisted or SDK code entering the runtime, a third connection, a second venue client, an equity number nobody computed, bars trusted before measurement."
    cite: "SRC-11:.memlog.md#line-26"
    topics: [trading-node, tn-11, ctrader, qmf-venue-increment, venueclientport, ct-18, equity-derivation]
