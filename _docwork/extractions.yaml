  - id: EXT-2146
    type: decision
    summary: "SPINE REGISTRY MINT TABLE - new registry variables to mint in docs/registry/variables.yaml, all configurable: true, all with a unit-kind, an owner scope, a value_status_required flag and evidence values only (never ratified constants); the registry row is the SCHEMA and the resolved value plus its value-status live only in the node-config artifact. EVERY ROW CARRIES A BLANK-EFFECT TAG - blocks-boot | blocks-role-live | blocks-soak - and blocks-soak is additionally a GENERATED property of any variable a TN-23 checklist item exercises, so a row may carry it on top of its own tag. Rows: ksa_effect_matrix; ksa_detector_posture (inform versus pause); daily_dead_zone_width (evidence recorded unmerged, no default); session_handover_buffer_width and _anchor; news_blackout_before and _after per severity; the seven sqs_* keys (hard-block threshold per class, hysteresis band, outlier-guard multiple, sample cadence, baseline conditioning, baseline refit schedule, staleness horizon); news_calendar_max_staleness; breakeven_ratchet_trigger and _offset; qualifying_loss_threshold q per family and bench_consecutive_loss_threshold per bot kept separate from seat_loss_run_allowance; amend_min_improvement per Book (the ratchet's ORIGINATION threshold inside exit_policy, an authoring rule and never a command-path gate); decision_freshness_bound (mandatory, non-defaultable, IS the heavy snapshot's maximum age with no second bound); submission_deadline, local_queue_bound, max_slice_latency, accumulator_bound (blocks-boot); reconciliation_lookback, reconciliation_cadence, pacing_cadence, backoff_cadence, protective_reserve_capacity and the pool and health constants; node_crash_loop_max_boots (K) and node_crash_loop_window (T) (blocks-boot); drain_window (blocks-boot; TimeoutStopSec RENDERED from it by node-install, never hand-authored); slice_watch_trip_multiple (dimensionless ratio, evidence 3); shadow_lane_publish_bound; news_recorder_max_attempts and news_recorder_backoff; r_unit_price_recompute_cadence; watchdog_interval (WatchdogSec RENDERED from it); clock_drift_warn, clock_drift_no_new_entry, clock_drift_halt, clock_unsynchronized_after; venue_d1_reverification_cadence; backup_recovery_point_objective, backup_recovery_time_objective_integrity, backup_recovery_time_objective_full_dr, backup_retention_period, restore_verification_cadence, backup_object_storage_provider, backup_payload_key_custody (the custody row carries the escrow RULE - workstation-minted, qmx/backup-payload-key plus one offline copy, never VPS-minted - not a blank); hot_room_retention_window, disk_headroom_min, vps_disk_budget (line items include the per-commit trees and their prune depth, the reserved protection-intent extent, and /var/lib/qmx-observability with its own quota); news_calendar_provider_primary (Forex Factory's free weekly file, the SOLE V1 source; no fallback slot row is minted); news_calendar_refresh_cadence; the operator-log retention window and journald size cap; the dead-man's-switch endpoint, cadence and token reference (alert-class membership is NOT a registry row - FAILURES.md's notification tier column is its sole home); evidence_channel_budget; governor_cpu_budget and governor_memory_budget; seat_callback_deadline and seat_memory_ceiling; bot_state_snapshot_cadence; accounting_period_calendar_identity."
