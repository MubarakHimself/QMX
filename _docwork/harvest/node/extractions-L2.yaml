extractions:
  - id: EXT-2110
    type: decision
    summary: "TN-14 TIME DISCIPLINE AT THE LIVE BOUNDARY (the time-audit obligations, adopted) - as amended by the gate rulings. The VPS operating-system clock is the sole stamper of QMX-owned event times; chrony runs with four or more sources (iburst, makestep boot-only, NTS where offered), installed by provisioning because 24.04 defaults to systemd-timesyncd while 26.04 makes chrony the default so provisioning VERIFIES rather than installs; RTC in UTC, system zone UTC, TZ=UTC; no local time is ever stored, keyed or compared as evidence, though AD-8 civil-time bucket keys stay legal as identity-bearing derivations of an instant plus a declared zone and tzdata version. NO TRADE BEFORE SYNC: preflight waits on chronyc waitsync; slew only while live; a step only with the node stopped, detected by a wall-versus-monotonic divergence detector marking a suspect window; every unsynchronized, stepped or paused window including a VPS live migration is an explicit data-gap record plus a no-entry window. TWO MEASUREMENTS NAMED APART: machine-versus-truth (chrony offset, stratum, sync-age, step counter) and node-versus-broker SKEW (rolling per-venue local_receive minus source, windowed minimum), never auto-corrected and never called latency. FOUR BANDS ok | warn | no-new-entry | halt - amended by line 46 (3) into a PER-DECISION-CYCLE PRECONDITION and never a standing CT-30 action, so no band needs de-escalating; effects entry-side only per L39 (no-new-entry refuses place_order and risk-increasing amends for that cycle; halt enters the node stand-down lifecycle state left only by an operator resurrect), a breach being a typed refusal plus a journal record plus a node state change and a no-new-entry band pushing on the silent-degradation alert class in live as well as during the soak; unsynchronized (no source for N minutes) is a distinct state from measured drift. Registry rows minted configurable: clock_drift_warn, clock_drift_no_new_entry, clock_drift_halt, clock_unsynchronized_after, whose band numbers are EVIDENCE VALUES from the time audit sized for roughly one-second decisions and never constants (L38); line 51 (20) tags them blocks-role-live plus blocks-soak and line 51 (22) puts their value-status on the resolved config artifact, so a provisional band needs an operator countersign with its evidence citation before live. Leap-second posture: no smearing sources, step-with-slew per chrony default, one policy on all machines. Three calendar kinds named apart (market-hours, day-boundary, news), calendar identity in-band on every TradingDate, one pinned tzdata verified at import with TZPATH forcing proven once on the Linux VPS, the venue D1 boundary measured per broker into a venue-scoped market-hours calendar identity, broker schedule and holiday axes verbatim, never a fixed offset from broker server time. Assumption A20 (band evidence values as starting defaults; the leap-second posture)."
    cite: SRC-11:.memlog.md#line-29
    topics: [trading-node, tn-14, time, clock, calendars]
    authority: rider

  - id: EXT-2111
    type: decision
    summary: "TN-15 OBSERVABILITY - LOGS, METRICS, HEALTH, ALERTS (AD-14 made concrete) - as amended by the gate and operator rulings. LOGS ARE NOT JOURNALS: operator logs are stdlib logging with a JSON-lines formatter to stdout captured by journald, retention and rotation set by provisioning (a SystemMaxUse cap plus a configurable retention window whose length is an evidence value), fields ts (UTC ISO-8601 Z, millisecond precision), level, logger, event, correlation_id propagated across every boundary, boot_epoch, composition_fp and typed-refusal fields carrying reference ids only and never a secret value; the stdlib five levels with a typed refusal at WARNING, an alarm at ERROR and stand-down or halt at CRITICAL; journals stay CT-13 evidence (int64 ns plus writer plus sequence) in the journal room and are never written through the logger. METRICS: prometheus_client as registry and exposition format ONLY, the node's own door serving /metrics on the localhost endpoint with no library-spawned server thread; families named at implementation under a qmn_ prefix with labels never carrying secrets or account numbers beyond opaque ids - clock, session, command streams, reconciliation, protection (line 51 (24): KSA level PER ENFORCEMENT SCOPE with the scope as a label), the six AD-13 latency rungs as monotonic histograms with no budgets until baselines exist, data, backup, process; line 51 (10) replaces the memlog's single reconciliation residual with TWO reported separately, quantity and cash. JOURNAL-TO-RECORDS BRIDGE: the legacy five Records streams survive as CT-25 PROJECTION NAMES ONLY over AD-21's seven journal event types through one versioned mapping table (veto_ledger = refused-by-door decisions; trade_journal = order and fill joined by the command record's content fingerprint; book_journal = the entity projection over decision, risk transition and control action by Book identity; ksa_audit_log = protection-authority control actions plus the suppressed subtype; correlation_ledger = the enacts edge set), each a read and never a writer, with position and balance read-backs joining the same table as CT-20 observation kinds (line 51 (27)) rather than an eighth type. HEALTH: /health reports INDEPENDENT states (safety, execution readiness, connection, reconciliation, data freshness, lifecycle, sync), never one colour, requested apart from enforced, each state carrying per-read provenance (authority source, source time, receive time, watermark). ALERTS: the closed allow-list is the ONLY push tier and line 46 (18) gave it a THIRD class - money boundaries; protection escalation with the named state alarms; and SILENT DEGRADATION, the node having stopped accepting entries or being unable to persist evidence for a non-KSA reason, enumerated (clock band at no-new-entry or worse, unexplained live-drift stand-down, failed news-calendar refresh, degraded or dead canonical feed, failed backup or restore drill or host-loss rehearsal, disk headroom below minimum, live first-connection or data-quality verification failure) - plus an EXTERNAL DEAD-MAN'S SWITCH heartbeating to an off-VPS watcher that alerts on a MISSING ping and a liveness digest surviving go-live. Line 51 (34) makes FAILURES.md's notification tier column the SOLE home of class membership with the allow-list GENERATED from it and no registry membership row. One push channel through a NotificationChannel port with an HTTPS-webhook implementation plus console and file sinks, the toolkit's just node-notify-test delivering a synthetic alert through the powers channel; two planes, records versus delivery - an alert is evidence, not permission. The memlog's soak profile is SUPERSEDED: the clock-band alert does not switch off at go-live, being a permanent member of class 3. Assumptions A21, A35, A42."
    cite: SRC-11:.memlog.md#line-30
    topics: [trading-node, tn-15, observability, logging, metrics, alerts]
    authority: rider

  - id: EXT-2112
    type: decision
    summary: "TN-16 DEPLOYMENT, SUPERVISION SHAPE, CI MATRIX, ROLLBACK, HARDENING - as amended by the gate and operator rulings. The node runs as a plain systemd service on Ubuntu 24.04 LTS x86-64 (systemd 255.4, so systemd-creds is available; it matches the ubuntu-24.04 CI runner; 26.04 LTS is the planned upgrade at the first maintenance window) and NOT a container: no Docker requirement stands and systemd credentials are the secret path. ONE CANONICAL CHECKOUT - amended by line 51 (12) from the memlog's single mutable clone into /opt/qmx as a canonical root of IMMUTABLE PER-COMMIT TREES plus a current symlink, each tree a clone at its pinned commit with uv-managed CPython 3.14 and uv sync --frozen applied, never writing into a tree a running node resolved from, pruned to a declared depth that is a line item of vps_disk_budget so a rollback needs no network; line 51 (29) adds the pre-qmn bootstrap as a stand-alone day-one script installing uv, CPython, pinned just and the container runtime the observability stack needs before cloning at the pinned commit. Line 51 (18) makes the workstation installation provisioning-and-Python-API only and ENFORCED by four checks (the root refuses to compose off the roster's VPS machine tuple; the SecretStore refuses a venue-session holder off that host; a tier-1 check proves the wizard imports neither the connection manager nor the refresh duty; a tier-1 check proves no console-script entry point and no publishable target). UNIT FILES ARE CHECKED IN under qmn/deploy/systemd/ - line 51 (16) restates them as FIVE node units (qmn.service, qmn-news-calendar timer and service, qmn-backup timer and service, qmn-restore-sample nightly, qmn-restore-full monthly) with qmx-observability.service a sixth unit that is not the node's - and line 46 (12) replaces the memlog's DynamicUser=yes plus StateDirectory=qmn with a FIXED User=qmx account for all node units, ProtectSystem=strict plus ReadWritePaths=/var/lib/qmx and every writable tree pre-created and owned by qmx, RuntimeDirectory creating /run/qmn for the powers socket, LogsDirectory, NoNewPrivileges, PrivateTmp, ProtectHome, RestrictAddressFamilies AF_UNIX plus AF_INET plus AF_INET6, LoadCredentialEncrypted per unit for that unit's credentials only, Restart=on-failure with line 51 (5)'s RestartForceExitStatus=75 and SuccessExitStatus=75 so a requested restart is never counted as a failure, StartLimitBurst strictly greater than the crash-loop K with StartLimitIntervalSec at least T, and line 51 (28)'s TimeoutStopSec and WatchdogSec RENDERED from the config artifact's drain_window and watchdog_interval by just node-install. INSTALL AND UPGRADE run from the OPERATIONS TOOLKIT: the memlog's qmn deploy install and qmn deploy switch are SUPERSEDED by the operator's no-command-line ruling (line 48 Q1, line 49) into just node-install, just node-switch <commit> - materializing a new tree beside the old, preflight, backup-first, clone plus uv sync --frozen, a dry-run in check mode against that tree, an atomic current-symlink flip as part of a drain-aware restart at a safe point, then a prune - minting a DEPLOYMENT RECORD carrying commit plus config version validated as a pair, and just node-rollback flipping onto the previous retained tree with no network; none is a trading control and migrations follow AD-20 only. CHECK MODE is defined (doors, config compile, fingerprint, seal and every credential-free preflight gate; skips credential presence, store reachability, chronyc waitsync and venue connect; exits non-zero; never opens a sequencer) with the soak additionally requiring one boot under the real systemd unit with LoadCredentialEncrypted from a scratch credstore. ONE ENVIRONMENT with named compensating controls (no staging host; CI clean-install boot, check-mode dry run on the production host, a replay diff, the rollback flip). VPS HARDENING: SSH key-only, the restricted provisioning identity and the confined inbox-write identity, ufw default-deny inbound except SSH, a stated egress allow-list gaining the observability stack's image registry per line 51 (13), no public port with doors reached over an SSH tunnel, unattended security upgrades with no automatic reboot and never restarting qmn.service. CI MATRIX: tier-1 Windows 11 plus Ubuntu LTS, a new Linux lane pinned ubuntu-24.04 (never latest) re-running the type gate with pythonPlatform Linux, the tier-2 isolated-install smoke plus a clean-install boot-in-check-mode and the unit-file scan, tier 3 gaining the both-OS smoke; the nightly mutation job targets the branch that carries code with a zero-mutants run failing closed; benchmark baselines on the VPS OS and CPU-class tuple with CI running the harness for correctness only; the 26.04 upgrade carries two behavioural deltas. Assumptions A22, A31, A41."
    cite: SRC-11:.memlog.md#line-31
    topics: [trading-node, tn-16, deployment, systemd, ci, hardening]
    authority: rider

  - id: EXT-2113
    type: decision
    summary: "TN-17 DOORS - LIBRARY FIRST, THIN DOORS - as amended by the operator ruling that deleted the node's command line. DEC-0159's shape is copied onto the node: every node capability exists ONCE as a pure library function, doors carry only adaptation (parsing, transport, refusal rendering), and a tier-2 door-parity contract test binds them - parity scoped because the doors are deliberately unequal. The memlog's THREE-DOOR SHAPE IS SUPERSEDED HISTORY: its Door 2, the qmn command line (click, the same pin as qmb, the operator's typed door on the VPS over SSH), was DELETED by memlog line 48 (Q1) - 'there is nothing like commands or anything... it's a user interface on the desktop application as per the overall architecture' - and line 49 restated the doors as the Python API in-process, the LOCALHOST HTTP EVIDENCE CHANNEL and the UNIX-SOCKET POWERS CHANNEL, consumed by the desktop UI over an SSH tunnel later and by the operations toolkit's few read and act calls. EVIDENCE CHANNEL: HTTP/JSON on localhost, publish-never-act, authority-free, budgeted by evidence_channel_budget, no authentication beyond the loopback binding (accepted, single-tenant VPS, a read-only surface), serving status and health, journal projections including the five CT-25 projection names, reconciliation status and the two residuals, the outstanding UNKNOWN set with per-command read-back detail, standing intents, KSA level, Book modes, binding and seat states, drift components, backup and drill status and /metrics, with per-state provenance as REQUIRED fields and any role-spanning entity projection a declared AD-31 cross-role read. POWERS CHANNEL (line 46 (19), line 51 (11)): a unix domain socket at /run/qmn/powers.sock owned qmx:qmxops mode 0660 from the unit's RuntimeDirectory, SO_PEERCRED recorded beside the claimed signer; TWO declared peer principals by uid, neither the qmx service account - the operator principal with every power, the ops principal with only notify_test, restore_drill_run, config_validate, hub_publish and the evidence reads - every trading, protection, promotion, activation, settings, resurrect, attestation and countersign power refused to the ops principal BY THE TRANSPORT and journaled, preflight refusing to boot if any unit declares an operator-principal uid, and the honest limit recorded: SO_PEERCRED proves an ACCOUNT, not a human (residual risk A32). The powers list is CLOSED and gained restore_drill_run, config_version_activate, seat_reinstate and hub_publish; the value-status countersign is refused without the variable's evidence citation by fp1, one variable per call (line 51 (22)). Every powers call is server-side revalidated at click time, idempotent by artifact key, journaled with the human signer identity and AD-18's plain-words summary as an identity field, and ENACTABLE in stand-down; requested apart from enforced; no stale evidence authorizes; no generic LIVE/PAPER toggle. Transport stdlib-first; remote access an SSH tunnel only; ONE versioned wire vocabulary across both channels aligning with the QMA daemon-to-UI conventions once that spine fixes them (A39, an obligation and never an import). The OPERATIONS TOOLKIT uses these doors as the ops principal and no other path, config authoring is a toolkit affordance over the same library functions, settings scopes render from the artifact's flags with blank or provisional-evidence rendered as such and a cycle-fixed value taking effect at the next period open, a settings edit rendering its admission_impact before the click, and the agent/MCP door is NOT built this phase. Assumptions A1 (RULED and narrowed), A23, A32, A39, A40."
    cite: SRC-11:.memlog.md#line-32
    topics: [trading-node, tn-17, doors, powers-channel, no-command-line]
    authority: rider

  - id: EXT-2114
    type: decision
    summary: "TN-18 THE CONFIG SURFACE - UI-EDITABLE BY DESIGN - as amended by the gate and operator rulings. ONE resolved node-config artifact per boot epoch, JSON-Schema-class under AD-30 template discipline (every number an exact rational or scaled integer with a unit-kind; every variable flagged ui-editable or uneditable with its admission_impact; an integer format version; fp1 identity; AD-10 identity-versus-display classification). Line 51 (30) DELETED the invocation layer, so the memlog's five-layer precedence is SUPERSEDED by FOUR layers in disjoint namespaces - deployment roster, then BMS fragment, then Book fragment, then node defaults - because the node has no command line and no runtime override path and an invented one would become the highest-precedence, lowest-visibility source of money-path values; a collision is a compile-time refusal, BMS outranks Book in any sanctioned overlap, and the BMS and Book fragments are GENERATED, schema-validated, fingerprinted derived artifacts with AD-16 lineage edges, never free-hand-edited. THE PARTITION RULE (line 46 (8)): the artifact declares ELIGIBILITY AND IDENTITY ONLY and never runtime state - Book mode, binding state, seat state, standing intents, KSA level, bench counts, exposure and budgets are read-time folds and the compiler refuses any layer supplying one - so a paper flip, an activation, a benching and a kill-line stand-down mint records rather than config versions and a restart never changes a runtime state. THE VALUE-HOME RULE: docs/registry/variables.yaml declares SCHEMA only (unit-kind, flags, owner scope, admission_impact, the new value_status_required field, and recorded evidence values that are never resolved values) while the resolved artifact is the SOLE home of a resolved value and its value-status; the compiler refuses a key with no registry declaration and refuses to read a value from the registry. VALUE-STATUS (line 46 (16), line 51 (22)): every resolved value carries blank | provisional-evidence | ratified on its config row, Book-declared values included with the compiler propagating it onto generated fragments, and a provisional-evidence value gating live money blocks role = live exactly as a blank does until an operator countersign through the powers channel - a new config version, journaled, refused without the variable's evidence citation by fp1, one variable per call - with the promotion battery checking ratified rather than merely non-blank. ADMISSION_IMPACT IS ENFORCED: the compiler derives a version's impact from the registry rows its diff touches and stamps it, a resign diff (charter, money_rules, admission_bar, required_venue_capabilities) making the resulting binding INADMISSIBLE to live until a fresh AD-32 Layer 2 and Layer 3 complete, a relint diff re-running Layer 1 at compile. BLANKS PARTITION INTO THREE EFFECTS (line 51 (20), superseding the memlog's single money-gate effect), tagged per mint-table row: blocks-boot for absent mechanisms (submission_deadline, accumulator_bound, max_slice_latency, local_queue_bound, crash-loop K and T, drain_window, watchdog_interval); blocks-role-live for money gates; and blocks-soak as a GENERATED rule - every variable a TN-23 checklist item exercises must hold at least provisional-evidence in the pre-soak config version or the soak gate REFUSES TO START. The do-not-default roster stays blank until ruled, and holdout_months is explicitly NOT on it, being a corpus-ratified inherited value. EXTENSIBILITY IS A REQUIREMENT (operator ruling, line 48 (c) and line 49): adding a Book, a BMS, a bot or a new version of any is a registry mint plus a roster-config change plus a restart at a safe point, never code. Versioning is AD-30 git logic on a branches-from graph with a dated current pointer, every version readable forever, taking effect at the next boot epoch; the memlog's 'an edit (CLI or powers channel)' is SUPERSEDED - edits arrive through the powers channel or the toolkit's authoring recipes only - and a version whose diff touches a Book- or BMS-identity-bearing field mints a new AD-29 binding and must collect a state_carry declaration per counter plus a human-signed carries-ledger edge for any carry. Assumptions A24, A34, A45."
    cite: SRC-11:.memlog.md#line-33
    topics: [trading-node, tn-18, config, registry, value-status]
    authority: rider

  - id: EXT-2115
    type: decision
    summary: "TN-19 BOT SEATS, RUNTIME-PROTOCOL HOSTING, MIS SEAM - as amended by the gate and operator rulings. The node hosts QL-7 seats: a factory per seat with the declaration, the canonical assignment and injected ReadSurfaces over the declared footprint only, driven per evaluation instant by the loop's mint_intents hook and returning zero-or-more CT-23 intents, an entry intent carrying the bot's optional advisory_stop_proposal beside its advisory proposed_r - both advisory, neither sizing - which the Book door may adopt under the ratified module mode; look-ahead refused by the surface; bot state under the BotStateScope tuple with the OS injected and world a component of the scope, snapshotted at a configurable slice cadence and restored only within the same tuple. THE SEAT-CALLBACK FAILURE CONTRACT (line 51 (23)) because admitted code runs in-process on the loop's only domain thread while OS confinement is deferred: a per-callback seat_callback_deadline enforced through the CancelToken at slice boundaries and a seat_memory_ceiling enforced by LimitProbe, a breach being a typed refusal plus automatic SEAT QUARANTINE journaled as a seat-state transition, never a stream failure and never a node restart, with leaving quarantined the operator-signed seat_reinstate power alone and never inferred from a restart, a boot epoch, a config version or the absence of further breaches; and because a cooperative token cannot stop a callback that never returns, the door layer runs a SLICE-PROGRESS WATCH that stops the keepalive with WATCHDOG=trigger past slice_watch_trip_multiple of the deadline, pushes on the silent-degradation class and lets systemd restart - safe because a restart never flattens - with the accepted V1 consequence stated: V1 cannot interrupt a non-cooperative callback. The roster declares ELIGIBILITY ONLY while seat state (admitted, active, benched, quarantined) is a read-time fold over AD-41 records and CT-24 transitions the compiler refuses to accept from a layer; the prediction linter's four pinned checks run at seat time against the CT-28 binding context; producer templates resolve at seat admission; conformance Layer 2 is a node-owned stdlib process spawn feeding QML's pure verdict under the governor budgets. THE OR-06 RELOCATION lands here - the root holds the Bot-domain WriterId under QL-1's declared writer unit and mints CT-33 records only on a conformance pass through the registration capability on the doors (the memlog's 'qmn registry ...' door text is SUPERSEDED: there is no node command line) - with hardened OS confinement the one named deferred dependency. MIS V1 IS A SEAM ONLY: a compute-once, versioned, immutable per-instant SIGNAL SNAPSHOT, schema format-versioned, computed in-process by rule-based deterministic labelers and dispatched to a CLOSED consumer set of the Book door and the KSA, carrying per-instrument SQS score and hard-block flag, feed_state, degraded_sensors, labeler version stamps and readiness markers; no trained model in V1; bots NEVER consume it; line 46 (15) puts SQS inside the snapshot only and makes every producer read AS OF THE SLICE FRONTIER rather than wall-now. AD-24 is honoured rather than skipped, superseding the memlog's SYNCHRONOUS dispatch: every labeler is HEAVY BY DEFAULT until the live-path rung has a recorded baseline on the deployment tuple, the snapshot fanned out with staleness stamps, its maximum age IS the Book's decision_freshness_bound with no second bound (line 51 (17)) and a labeler that cannot publish inside it publishes not_ready; a benchmark-proven light claim earns synchronous dispatch afterwards. THE SHADOW-LANE SEAM IS EXPLICIT V1 NODE WORK by operator ruling (line 48 (b), line 49), only the ML and training half deferred: candidate labeler registration at the root into a CANDIDATE role with a separate shadow_composition_fp, heavy by construction, never counted toward max_slice_latency and dropped with a data-quality record past shadow_lane_publish_bound (line 51 (14)); a shadow snapshot stream under its own manifest prefix and WriterId with the same frontier-bound read rule; and a comparison read model on the evidence channel gating nothing - with a candidate NEVER a live consumer and a composition wiring shadow into a governed consumer refusing to boot. No ambient randomness in the live runtime; a recovered or pre-trained model carries no authority without fresh ratification. Assumptions A25, A38."
    cite: SRC-11:.memlog.md#line-34
    topics: [trading-node, tn-19, seats, mis, shadow-lane]
    authority: rider

  - id: EXT-2116
    type: decision
    summary: "TN-20 PROMOTION AND ACTIVATION - HUMAN ONLY, TWO ACTS - as amended by the operator and gate rulings. Promotion to live is a human-signed AD-18 promotion card minted through the powers channel; line 51 (11) binds every powers call to a declared principal and refuses any other, so the SO_PEERCRED peer credential must be the OPERATOR principal, the ops principal is refused promotion outright, and the credential is recorded beside the claimed signer - proving an ACCOUNT and not a human, with no automated unit running under an operator principal (preflight asserts it) and humanity beyond that a named residual risk (A32) rather than a proof, which is what proves QMX-F045 to the extent it is provable in V1 alongside L17 and DEC-0041. The card carries AD-18's mandatory plain-words summary as an IDENTITY FIELD (rendered to the human and stored with the signature; a typo fix mints a new card with a supersedes edge) and the Book or BMS DEFINITION FINGERPRINT so a signature can never attest a superseded template, presenting AD-32 Layer 3's ONE ASSEMBLED PAGE - both proofs, the binding identity, the capability-satisfaction result, the resolved BMS fingerprint - signed once. PROMOTION IS A CLICK, ruled by the operator on 2026-08-28 ('a simple click on the user interface... two separate acts'), and the PRECONDITION BATTERY runs SILENTLY, SERVER-SIDE, AGAINST FRESH STATE: AD-32's three layers including the demo shakedown, the CT-28 bind-time capability check, present LIVE-CONDITIONED baselines per line 46 (15) - the (VenueId, environment, instrument) SQS baseline from live-connection recording and the live-path rung baseline on this deployment tuple, a demo-conditioned baseline never satisfying either - the config version's admission_impact stamp showing no un-discharged resign diff, no blanks, and value-status = ratified on every live-gating variable per line 46 (16) rather than merely non-blank. Promotion presupposes reviewed backtest evidence carried on the card and, later, the agentic system's own paper-trading period before a bot returns for promotion, neither being the node's to run ('doesn't concern you... focus on live trading'); THE OPERATOR SEES RESULTS, NEVER MACHINERY - the outcome renders as a passed or refused list in his own words with the refusing check named, displayed-eligible is never a guarantee, and a refusal is journaled. The crossing is a node-initiated pull of the registry as-of set from the hub's published area, idempotent by artifact key, landing the seat ADMITTED with no intents and no ledger, REFUSING any artifact carrying provenance = sandbox and any as-of set containing one and verifying each artifact's fp1 against the card, a refusal journaled and alarmed; this is the node's only inbound path. ACTIVATION IS THE SECOND ACT - the seat becoming active at a live binding - a separate operator action through the same channel, journaled as its own CT-24 transition and folded like every other seat state, never written into config, so approval never equals exposure and a restart never re-arms exposure. The CT-13 promotion event carries the card fp1 plus correlation_id only (QMX-F046). Paper flip, paper-epoch reset, the kill-line stand-down return, node resurrect, a value-status countersign and every first entry into live are operator-signed; carries-ledger and continues-performance are two further operator-signed acts never inferred from one another; clocked mechanical clears mint CT-24 transitions only, never a CT-30 resume. Assumption A26 - RULED."
    cite: SRC-11:.memlog.md#line-35
    topics: [trading-node, tn-20, promotion, activation]
    authority: rider

  - id: EXT-2117
    type: decision
    summary: "TN-21 REPLAY MODE - THE NODE'S OWN REGRESSION TOOL - as amended by the operator and gate rulings. The memlog's invocation 'qmn replay <day|range>' is SUPERSEDED HISTORY: the operator's 2026-08-28 no-command-line ruling (line 48 Q1, line 49) leaves a just node-replay recipe over the same library, or the Python API, and never a trading control; line 51 (6) further makes a replay run a stdlib PROCESS-PER-JOB SPAWN OUTSIDE the node process, since running it inside would drive a second loop on the live thread. It composes a replay-scoped root from the same resolved node-config artifact with world = replay, drawing WriterIds from a DISJOINT namespace, resolving NO credential reference, holding no venue secret, opening no socket (preflight proves it) and constructing NO live sink, running THE SAME loop with the replay frontier clock - a pure function of the data cursor - behind the REPLAY IMPLEMENTATION of VenueClientPort, guaranteed for every VenueId by the (world, VenueId) selection, with slice boundaries reproduced from the accumulator's recorded RECEIVE stamps so the diff moves only when a decision moves; the port has three V1 implementations (the cTrader client, the replay implementation, the FEAT-0023 conformance double). THE ONE SANCTIONED CROSS-WORLD READ, named rather than assumed (line 46 (14), line 51 (26)): a named ONE-WAY REPLAY IMPORT PORT, read-only, reading the evidence tier's sealed-archive role so a hot-room purge past hot_room_retention_window never orphans a replay - superseding the memlog's 'from the live world room' - where SEALED means durably persisted and verified into sealed-archive, the sync's own watermark, and neither the boot composition seal nor AD-21's 12-month split seal, which keeps binding every boundary it already binds; this is the single exception to AD-19's cross-world refusal and there is no write exception ever. The SQS door's input under replay is declared because nothing is modelled: the door reads the RECORDED per-instant signal snapshot from the replayed day and reads not_ready where none exists, refusing entries there, so a replay never recomputes an SQS value. Every decision, door and fold re-runs and the produced decision stream is DIFFED against the recorded one, but the diff is an UNGOVERNED DIAGNOSTIC REPORT - not a B-3/B-4 governed run, never ledgered, never gating evidence - commands are NEVER submitted, the recorded venue answers ride as evidence only, and there is no fill simulation in V1 (that is QMB's tunnel, with its fidelity taint). Every artifact - decisions, folds, journals and bot-state snapshots - carries world = replay DERIVED FROM DATA PROVENANCE rather than caller-declared, and because world is a component of the BotStateScope identity a replay snapshot can never be restored into a live or paper seat nor live state into a replay run; a replay binding is a different identity that can never gate live money, replay writes only into the replay world's rooms, and replay-clock exhaustion is a typed refusal (OR-03). Replay is a required step of the soak acceptance and of every change touching the order path. Assumptions A27, A33."
    cite: SRC-11:.memlog.md#line-36
    topics: [trading-node, tn-21, replay, cross-world-read]
    authority: rider

  - id: EXT-2118
    type: decision
    summary: "TN-22 MULTI-ACCOUNT AND MULTI-BROKER SEAM (config, not architecture) - as amended by the gate rulings. Every runtime object is keyed by the ratified tuples and never by a singleton account or broker. The deployment ROSTER lists account bindings (VenueId, AccountId, role, world) with credential references, the declared credential-sharing fact per credential reference (line 46 (7)), the BMS definition fp1, the Book bindings on each, the opaque-id mapping for metric labels and the mandatory state_carry declaration per counter with its carries-ledger signature wherever a counter carries; one BMS instance per account; the roster declares ELIGIBILITY ONLY with no runtime state (line 46 (8)). Line 51 (32) adds SENSING-ONLY ENTRIES: a (VenueId, environment, AccountId, credential reference) row with no Book binding, no BMS instance and no command stream, opening its (venue, environment) connection for subscription, recording and baseline minting alone, minting no AD-29 binding, resolving no execution_target and refused a sequencer by the composition - the way the live environment is named during the soak week before any live binding exists. NETTING VERSUS HEDGING is read from CT-18 at BIND TIME with its consequences imported whole (line 46 (4)): on a netting account several Books share one account-level position so a Book-scoped flatten mechanically closes another Book's exposure, so binding a second Book onto a netted account with overlapping live instruments is an unsupported capability refusal unless the operator signs the shared-flatten limitation as an identity field of the binding, ONE BOOK PER NETTED ACCOUNT being the recommended V1 default; where the position model makes a narrower scope indistinguishable from a wider one the action REFUSES rather than executing wider; the fill-to-virtual-position attribution rule is a mandatory Book declaration whose absence is a bind-time policy rejection, and line 51 (15) adds that the SET of declarations on one netted account must be JOINTLY EXHAUSTIVE AND DISJOINT, proved at compile with an invalid input refusal otherwise, so the reconciliation claim is arithmetic rather than aspiration. One COMMAND-STREAM OBJECT per (VenueId, account) carries its own UNKNOWN block, WriterId, journal sequence (gapless per writer and boot epoch) and command ordinal (monotone, never reused, durable high-water mark) as TWO DISTINCT COUNTERS per line 46 (9), plus the control-rank table - and, superseding the memlog, it does NOT carry a pacer bucket: THE BUCKET IS OWNED BY THE CONNECTION, instantiated once per CT-18-declared throttle_scope which is read rather than assumed, every issuer on a connection admitting through it (the order path, the five session duties, the history bridge, the reconciliation read-back) and the bucket reserving a declared minimum capacity for protective commands that no other issuer may consume, so a close_all never queues behind a gap replay. Connections are keyed by (venue, environment), one per pair the roster names, and line 51 (6) selects the VenueClientPort implementation by (world, VenueId) rather than by VenueId alone. Each BROKER is its own VenueId even on the same platform, the platform-versus-venue axis recorded rather than modelled. EXTENSIBILITY, by operator ruling: a Book, a BMS, a bot, a new version, a new account, a second broker or a second cTrader VenueId is a registry mint plus a roster row plus a restart at a safe point, never a module. NOT built now: cross-account netting, load balancing, any cross-stream ordering guarantee. Assumption A28."
    cite: SRC-11:.memlog.md#line-37
    topics: [trading-node, tn-22, roster, netting, pacer, multi-broker]
    authority: rider

  - id: EXT-2119
    type: decision
    summary: "TN-23 QA STANDARD, BENCHMARKS, SOAK ACCEPTANCE, QA-DEBT DISCHARGE - as amended by the operator and gate rulings. The node ships under the permanent battery (Skylos including its IaC scan of the unit files, vulture, the four tier-1 scanners, the coverage floor, the Linux lane) plus requirements-first independent tests in the qa/ tree, with nightly mutmut EXTENDED to the node's money-path modules - door-path wiring, command mint, equity derivation, drift decomposition, sizing-ladder evaluation and the virtual-ledger folds - at the ratified kill floor, run against the branch that carries code with a zero-mutants run failing closed. A VENUE CONFORMANCE DOUBLE is a required node artifact (FEAT-0023) and is the THIRD VenueClientPort implementation per line 51 (6), so one conformance suite that both the double and the live cTrader client must pass carries UNKNOWN-outcome fixtures per trigger and the superseded-by-fill cancel read-back, earning the money-path proofs deterministically in CI. The four risk GOLDEN SCENARIOS SCN-0006, SCN-0008, SCN-0010 and SCN-0011 stay defined-unwired until this node wires them; FAILURES.md completeness is GATED by a CI check over the failure-id enum with all six NFR-11 fields and every operator affordance resolving to a real door capability or toolkit recipe, and TN-15's allow-list is generated from the register's notification tier column (line 51 (34)). BENCHMARKS: the node's own harness at test status measures wall-clock AND peak RSS at four seat counts against the roughly forty-seat design reference; line 51 (17) forbids it running concurrently with a slice-driving node - before the doors open or from stand-down, holding the governor budgets which are SOAK-blocking, with every baseline and gate run recording the node's lifecycle state at measurement - and the first Linux baseline recorded on the VPS tuple in the soak's first hours becomes the regression gate AND satisfies CT-28's bind-time rung baseline and AD-24's light-claim gate, each threshold stated as a multiple of measured run-to-run variance when its baseline is recorded, the six AD-13 rungs named with their stamps and the operator's own latency figure a WATCHED TARGET, never a budget. THE SOAK ACCEPTANCE GATE, the soak being the FULL first-deploy warm-up week run unattended on the demo account (A10 RULED, checklist explicitly unchanged), is a machinery-proof CHECKLIST, each item journaled with an injected-fault drill where applicable: SIX first-connection checks per instrument with the amend-atomicity measurement among them (superseding the memlog's five); a forced disconnect mid-order minting UNKNOWN and BLOCKING THE WHOLE STREAM including protection per line 51 (1), a protective close under the block journaled as a standing intent dispatching on resolution; protective-stop attachment refusal without the CT-18 capability and a placed entry observed carrying its venue-resident stop (line 51 (2)); a no-scale-in policy rejection (line 51 (33)); reconnect gap recovery committing fills before healthy; reconciliation with four verdicts and TWO separately reported residuals, quantity and cash, the two equity series side by side and never differenced (line 51 (10)); a KSA escalation at its declared scope with only a scope-naming operator resume de-escalating, a clocked reconciled verdict proven not to lower the level and a live-connection connectivity escalation proven not to block paper routing to the paired demo stream (line 51 (24)); an AD-37 COMPOSE PAIR where a KSA suspend_new and a kill-line breach on one tick BOTH execute; an operator-signed synthetic kill-line breach on the paper Book auto-flattening and standing down that binding; a news window and a dead zone blocking entries while an exit passes, with a news-calendar revision proven not to open entries before the in-force window's declared end (line 51 (7)); a HELD amend_protection re-decided when the block clears; an SQS baseline minted and a block observed, a demo-conditioned baseline proven not to satisfy a live binding, and at the week's end a LIVE-CONDITIONED SQS baseline and live-path rung baseline PRESENT from the sensing-and-recording-only live connection (line 51 (32)); the bench fold benching a seat while the Book stays live; the ratchet amending single-sided; an injected residual driving the entry stand-down cleared only by an operator resume after a fresh review; a restart re-deciding a standing intent without re-arming a Book left in paper; the crash-loop, preflight-refusal-without-exit, exit-75 restart and resurrect-only items of line 51 (5); a quarantined seat leaving only by seat_reinstate; the shutdown contract flushing, minting UNKNOWNs after session close and never flattening; the nightly backup, the nightly sample-restore timer, one monthly full-restore run and the HOST-LOSS REHEARSAL by restore_drill_run onto a clean host with only the escrowed payload key, which measures the full-DR RTO (line 51 (16), superseding the memlog's single 'full restore drill'); one boot under the real systemd unit from a scratch credstore; a simulated clock-band breach producing the entry-side no-new-entry effect AND pushing (superseding the memlog's 'to suspend_new', a band never being a CT-30 action); the powers door refusing a call from neither principal and every trading, protection, promotion and settings power to the ops principal; a value-status countersign with its evidence citation flipping a provisional live-gating value to ratified and one without refused; the dead-man's switch alerting when the heartbeat stops with a synthetic alert proven delivered before the node is left unattended; both port implementations passing one suite with the four scenarios wired; a replay of a recorded soak day diffing clean from a process outside the node resolving no credential; metrics, health and alerts observed; the observability stack standing up from its compose file under its own unit and account with dashboards rendering for the whole week and the node proven to run unchanged when it is stopped; the benchmark baseline and threshold recorded with the node not driving slices; and measured bytes-per-day and the disk budget recorded. QA DEBT rows become NODE STORIES by name (QMX-F045, F046, F062, F063, F064, F067, F068, F069, F102, D008, D010, E15-F01/F02/F03, E7-R28, E9-F04, E12-F01/F04/F05) while foundation debt stays foundation. Assumption A30; A47 inherited."
    cite: SRC-11:.memlog.md#line-38
    topics: [trading-node, tn-23, qa, soak, benchmarks, qa-debt]
    authority: rider

  - id: EXT-2120
    type: decision
    summary: "TN-24 POSITION-SAFETY CLOSURES (PRD open-item rows 12-15 and the QB3 residues) - as amended by the gate rulings, and closing as TEN lettered closures (a) through (j). (a) A partial ENTRY fill follows AD-40 verbatim: the VIRTUAL (Book) position's original_risk_amount is re-based EXACTLY ONCE at the entry's first terminal state onto the filled quantity, the admission value retained as the declared plan with a lineage edge, the only re-basing in V1, the short fill also recorded as an execution-quality fact; line 51 (33) adds that a short fill is NEVER topped up because V1 admits no scale-in - adding to an open virtual position is a policy rejection and a second tranche needs its own admission and its own R under a later Book version. (b) Duplicate fills dedup by the venue-native identity key (deal or execution id within the account) per AD-27; the first copy stands and a second copy with different content is a data-quality alarm, never an overwrite. (c) A disconnect mid-order is UNKNOWN per L35 and line 51 (1) CORRECTS the block's scope: it is the WHOLE STREAM, AD-27's per-command UNKNOWN block being AD-36's one non-control block, so every command on that (VenueId, account) stream is refused including protection, a refused protective act standing as an AD-36 protection intent journaled before dispatch and re-decided on resolution, cleared only by resolve_unknown and never by a reconciliation verdict. (d) A virtual-versus-venue mismatch on restart is a drift verdict then the entry stand-down on a live binding with no automatic resume. (e) One disposition vocabulary (qualifying_loss_exit | scratch-or-partial-loss | breakeven) serves both rules, and the spine SUPERSEDES the memlog's 'count for NEITHER': BREAKEVENS never count under any q and are their own clustering metric, while scratches and partial losses do not count BY DEFAULT and count where the Book's declared q reaches them, q being a per-family UI-editable variable and never a spine constant. (f) Money boundaries - rollover, sweep, re-seed, paper flip - NEVER touch positions, a money-accounting boundary never being itself a flatten trigger; the memlog's 'only the kill line flattens' is SUPERSEDED by AD-36's three flatten authorities (the operator at any scope; Book policy only through pre-declared trigger classes including the kill-line breach; the protection authority per the matrix) and never the adapter, with a declared window, hold-time or boundary force-flat that merely coincides with a money boundary honoured as a separate declared Book trigger at AD-37 rank 2; floating P&L is an explained, named component of the equity narrative, never swept, and per line 51 (10) NEVER a term in either reconciliation residual because it is a mark and marks are never reconciled. (g) V1 dynamic protection is the breakeven ratchet only, a bot-proposed tighten bounded risk-non-increasing (OR-01), naming a direction and a bound rather than a price, never refused on the command path. (h) Every decision-plus-evidence write declares atomic or ordered-with-recovery per CT-20's modes with evidence-first ordering always, and a partial write is a storage failure blocking ENTRIES ONLY - distinct from (c)'s whole-stream block - with no global dual-write atomicity rule minted. (i) News provider and deep history per TN-13 (Dukascopy, with TrueFX and HistData as recorded companions, not node-blocking); a requote is an ordinary mapped venue rejection with no vocabulary of its own. (j) MINTED BY THE GATE and absent from the memlog entry: a node close racing a venue terminal event - a venue margin liquidation or a venue-initiated close - reads back as rejected-by-venue with a superseded-by-terminal-subject qualifier, a NAMED OUTCOME and never a stream-blocking UNKNOWN, the subject-terminal observation being the resolving evidence, with CT-29's own venue_liquidation and venue_initiated_close each carrying closing_authority = venue; and the pre-submission half, per line 51 (33), is that a command whose subject is absent or already terminal AT SUBMISSION resolves WITHOUT SUBMISSION, never as a naked close. Assumptions A29, A13; (a), (b) and (j) are parent- or corpus-ratified rather than assumptions."
    cite: SRC-11:.memlog.md#line-39
    topics: [trading-node, tn-24, position-safety, unknown, closures]
    authority: rider

  - id: EXT-2121
    type: decision
    summary: "TN-25 THE ACCOUNTING BOUNDARY AND THE VIRTUAL LEDGER - MINTED at the reviewer gate by ruling (17), 'TN-25 minted - the accounting boundary and the virtual ledger (qmn/ledger)', there being no earlier memlog decision entry for it; ruling (1) of the same entry supplies its money core. The node RUNS the accounting period, everything per binding and nothing a Book or BMS rule - the node executes them and does not invent them. The period calendar identity is DECLARED, never inferred: an account-scoped AD-8 DAY-BOUNDARY CALENDAR names the period, the rule that answers only which day an instant belongs to for evaluation, carried in-band on every TradingDate, never substituted for a market-hours calendar and never a fixed offset from broker server time. Each binding's VIRTUAL LEDGER is an append-only record stream written by the risk-domain writer (machine, risk role, binding) in the exact scaled-integer domain at the account money exponent, the source AD-40 reads for book_capital and the source the kill-line series marks to market. TWO POSITION FOLDS ARE NAMED APART and every risk record declares which it references: a VENUE POSITION is observation-derived under the venue's declared netting or hedging model, while a VIRTUAL (Book) POSITION is a fold over fills joined by declared command identity - binding-scoped, Bot-attributed, minted at admission, carrying the frozen R faces - the unit of CT-29 exit records, AD-33 whole-trade attribution and AD-41 folds, the sum of virtual positions reconciling against the venue's netted position through AD-27 evidence. The netting attribution declaration is a BIND-TIME CHECK whose absence is a policy rejection, and line 51 (15) adds that the SET must be a PARTITION - jointly exhaustive and disjoint, proved at compile, an invalid input refusal otherwise - which is what makes the reconciliation claim arithmetic rather than aspiration. NO SCALE-IN restated where the fold lives (line 51 (33)): an entry against an instrument on which the binding already holds an open VIRTUAL position is a policy rejection at the door, so a netted account's shared venue position never masks it and no virtual position carries two admissions with two frozen R faces. r_unit_price is FIXED AT PERIOD START and not recomputed as the budget drains intraday unless the Book declares r_unit_price_recompute_cadence (configurable, blocks-role-live, absence an invalid input refusal at AD-32 Layer 1); book_capital is the binding's virtual-ledger equity at the period-open instant EXCLUDING unrealized P&L and is the sizing ladder's input only, never the breach series, with loss_runway, period_loss_budget, seat_loss_run_allowance and seat_r_ceiling deriving from it under AD-40's shape and no values stated; the kill-line series belongs to the protection set, where ruling (1) fixes kill_line_capital_floor AS AD-40's loss_floor - one variable, one name - declared by the Book definition and evaluated per binding against that binding's virtual-ledger equity marked to the latest observed price of its own virtual positions, on every slice carrying a fill or a price update on a held instrument and at every accounting rollover. ROLLOVER, SWEEP AND RE-SEED ARE OPERATOR-SIGNED JOURNALED TREASURY BOUNDARY ACTS minting an AD-16 boundary-event record of the reserved kind (sweep, refund, re_seed, paper_epoch_reset) mapped onto AD-21's risk transition - NO MONEY MOVES WITHOUT ONE - never touching positions and never re-basing a frozen R, with a missed rollover reconstructed from journals and appended as a correction. state_carry rides EVERY binding the node mints, mandatory and non-defaultable per counter (ledger, cycle, budget, bench_counter, exposure), each carry or reset, absence an invalid input refusal, carry legal only with a human-signed carries-ledger edge, continues-performance asserting a track record while moving no money and neither edge inferred from the other. Floating P&L is an explained, named component of the equity narrative, never swept and NEVER a term in either reconciliation residual (line 51 (10)). PAPER IS NOT EXEMPT: the paired demo binding keeps its own virtual ledger - frozen starting balance plus realized plus unrealized of its paper virtual positions - so a paper capital floor is evaluable (ruling (20)), the frozen balance never hand-adjusted and a reset minting an operator-signed paper_epoch boundary record. Assumption A13."
    cite: SRC-11:.memlog.md#line-46
    topics: [trading-node, tn-25, accounting, virtual-ledger, treasury, state-carry]
    authority: rider

  - id: EXT-2122
    type: decision
    summary: "OPERATOR RULING R1, 2026-08-28 - NO OPERATOR COMMAND LINE FOR THE TRADING NODE, the amendment that rewrites TN-17's door roster. The operator dictated: 'there is nothing like commands or anything... it's a user interface on the desktop application as per the overall architecture'; killing, status, resolving a stuck order and promotion are UI actions over the node's doors, running the same connection logic the agentic system will use - 'the same setting or the same logic behind even the agentic system' - and the node is one surface inside that UI which 'might have its own page... I'm not certain yet', with the priority stated plainly: 'first, make the trading node work, make sure it can execute'. CONSEQUENCE, applied at desk: the memlog's Door 2, an operator qmn command line, is DELETED; the control surface is the Python API in-process plus the localhost HTTP evidence channel plus the unix-socket powers channel, consumed by the desktop UI over an SSH tunnel later and by the operations toolkit's few read and act calls during the soak; the closed PRD row naming qmb the platform's single command-line surface is honoured and TN-1's command-line reconciliation note is WITHDRAWN because no conflict remains with PRD FR-046 or DEC-0185 Ruling C. Deployment and provisioning tooling - install, switch and rollback, the secrets wizard, data bootstrap, replay, config init/validate/explain, the notify test, the restore drill - becomes an OPERATIONS TOOLKIT of just node-... recipes in the repo's existing justfile, never a product command line and never a trading control, DevOps tooling that the operator ruled is 'a very separate system, like how big tech teams work'. The package and import name stays qmn as a CODE NAME only: the operator declined to rule the product's name - 'that question is not for this layer' - so a rename is mechanical. Assumption A1 is thereby RULED and NARROWED and A23's command-line half is ruled away; the wire vocabulary stays versioned and will align with the QMA daemon-to-UI wire-contract conventions once that spine fixes them (A39)."
    cite: SRC-11:.memlog.md#line-48
    topics: [trading-node, tn-17, tn-1, operator-ruling, no-command-line, operations-toolkit]
    authority: rider

  - id: EXT-2123
    type: decision
    summary: "AMENDMENTS FROM THE OPERATOR ROUND, 2026-08-28 - the observability half that rewrites TN-15, applied at desk with TN ids stable. Because the operator ruled the soak to be one full unattended week on the demo account ('two days to a week... I think a week is enough and sufficient'), tracking through that week became MANDATORY - 'I know what you're talking about' of a Prometheus/Grafana-class stack - so TN-15 now ships the OBSERVABILITY STACK as a SEPARATE ZERO-AUTHORITY SYSTEM (Prometheus plus Grafana plus Loki/Promtail class) as a compose file under qmn/deploy/observability/, with containers permitted for THIS STACK ONLY while the trading node itself stays a plain systemd service with no container requirement; Skylos's IaC scan gates the checked-in compose file, its image versions are pinned at the implementation gate and registered as external tools rather than floating, and the node's own half is the /metrics exposition, the JSON-lines log stream journald already carries, and versioned DASHBOARD-AS-CODE SEEDS so the stack stands up from the checkout rather than from clicks. The external dead-man's switch and the push channel STAY exactly as they are: the stack is not an alerting path and does not replace them, because a stack that dies with its host cannot report its own silence. A dedicated monitoring agent - the operator's own later idea - plugs into that stack afterwards and is explicitly not this sitting's concern. The memlog's pre-ruling text, 'Prometheus/Grafana-class stacks are optional zero-authority consumers of the exported signals' plus a soak profile whose clock-band alert switches off at go-live, is SUPERSEDED: the stack is mandatory through the soak and after it, and the clock-band alert is a permanent member of the silent-degradation class. Assumption A10 is RULED; A42 (the stack's own unit, distinct non-qmx account, /var/lib/qmx-observability with its own quota, network_mode host bound to loopback, a dedicated read-only journal namespace and its credentials as the declared fourth secret holder) was added at the second gate as the footprint that keeps 'zero authority' from being falsified by the stack's own presence."
    cite: SRC-11:.memlog.md#line-49
    topics: [trading-node, tn-15, observability-stack, operator-ruling, soak]
    authority: rider

  - id: EXT-2124
    type: decision
    summary: "GATE-2 RULINGS, the deployment and supervision half that rewrites TN-16, applied by the residual fix pass with TN ids stable. (12) /opt/qmx becomes IMMUTABLE PER-COMMIT TREES plus a current symlink flipped atomically at the restart, with a deployment record on the version graph carrying commit plus config version and old trees pruned by a declared depth - superseding the memlog's single mutable clone, so nothing ever rewrites the tree a running node resolved from and a conformance or benchmark spawn during a switch cannot execute new code under the parent's sealed composition_fp. (16) Timer units compose from the config version the RUNNING node sealed, read over the evidence channel, falling back to current with a node-absent stamp and refusing plus alarming if neither is readable; there are TWO restore timers, qmn-restore-sample nightly and qmn-restore-full monthly, the host-loss rehearsal is the restore_drill_run power rather than a timer, qmn-news-calendar is renamed, and the unit count is stated accordingly - five node units plus the observability stack's sixth. (18) The workstation installation is provisioning-only and ENFORCED by four named checks: the composition root refuses to compose off the roster's VPS machine tuple, the SecretStore refuses a venue-session holder off that host, a tier-1 check proves the wizard module imports neither the connection manager nor the refresh duty, and a tier-1 check proves no console-script entry point and no publishable target. (28) drain_window and watchdog_interval are minted as configurable durations and TimeoutStopSec and WatchdogSec are RENDERED into the unit file from the config artifact by node-install, so a config change and a unit file can never disagree. (29) just is pinned and registered as an external tool, and the bootstrap script installs uv, CPython, just and the container runtime for the stack before cloning at the pinned commit. (5) A detected preflight REFUSAL never exits - stand-down alive with the doors serving - the crash-loop fold counts only failures that DO exit, StartLimitBurst exceeds K with StartLimitIntervalSec at least T, and a requested restart exits code 75 under RestartForceExitStatus=75 and SuccessExitStatus=75 without advancing (K, T). (13) The observability stack gets its own unit and non-qmx account, /var/lib/qmx-observability as a named line item of vps_disk_budget with its own quota, network_mode host bound to loopback scraping /metrics only, a dedicated read-only journal namespace, its credentials as a declared fourth secret holder, a provisioned and pinned container runtime for this stack alone, and the image registry (or a vendored image source) added to the egress allow-list - with the node proven to run and pass with the stack stopped. Assumptions A31, A41, A42 carry these calls; the memlog's qmn deploy install and qmn deploy switch invocations are superseded by the operator's no-command-line ruling into just node-install, just node-switch and just node-rollback."
    cite: SRC-11:.memlog.md#line-51
    topics: [trading-node, tn-16, deployment, gate-2, units, supervision]
    authority: rider

  - id: EXT-2125
    type: decision
    summary: "GATE-2 RULING (6) and its companions, the replay half that rewrites TN-21, applied by the residual fix pass with TN ids stable. The VenueClientPort implementation is selected by (world, VenueId) rather than by VenueId alone, so world = replay selects the replay implementation for EVERY venue; a replay composition RESOLVES NO CREDENTIAL, holds no venue secret and opens no socket, which preflight proves; a replay run is a stdlib PROCESS-PER-JOB OUTSIDE the node process with disjoint replay WriterIds, because running it inside would drive a second loop on the live thread; and the port has THREE V1 implementations - the cTrader client, the replay implementation and the FEAT-0023 conformance double. Ruling (26) gives the evidence tier a named sealed-archive room role per world for synced observation and journal content, which the replay import port and the backup read by name, with a hot-room purge precondition of a verified copy in sealed-archive AND a verified off-host copy - so a purge past hot_room_retention_window can never orphan a replay; the first gate's ruling (14) had already named the one-way replay import port as the single sanctioned cross-world read, fixed replay artifacts as world = replay and never ledgered, made the decision diff an UNGOVERNED DIAGNOSTIC REPORT rather than a B-3/B-4 governed run, and made world a component of the bot-state scope. Together with the operator's no-command-line ruling, which replaces the memlog's qmn replay invocation with a just node-replay recipe over the same library or the Python API, these amendments are what make TN-21's rule current: the memlog's replay text - a command, an adapter reading the live world room, no stated process boundary - is superseded history. Assumptions A27, A33, A44."
    cite: SRC-11:.memlog.md#line-51
    topics: [trading-node, tn-21, replay, gate-2, venue-port, sealed-archive]
    authority: rider
