extractions:
  - id: EXT-0001
    type: context
    summary: "QMX, or Quantmind, is conceived as the operator's custom trading terminal."
    quote: "it's more like a my own custom trading terminal"
    cite: SRC-01-C0001
    topics: [qmx, product, vision]
    authority: source
  - id: EXT-0002
    type: constraint
    summary: "QMX must be extensible because it is built to leverage AI agents."
    quote: "the idea is simple the idea is to try as much as possible to make it extensible since it's leveraging AI agents"
    cite: SRC-01-C0001
    topics: [qmx, extensibility, agents]
    authority: source
  - id: EXT-0003
    type: constraint
    summary: "The platform is intended to provide uniformity, control, order, and easy extension through building blocks."
    quote: "we wanted uniformity we wanted control and order we wanted something that if we want to extend it it's simple so it's like we are we wanted to create building blocks"
    cite: SRC-01-C0001
    topics: [architecture, extensibility, design-values]
    authority: source
  - id: EXT-0004
    type: value
    summary: "QMF expands to Quantmind Framework and contains Quantmind Libraries called QMLs."
    quote: "QMF is Quantmind Framework which contains a lot of quantmind libraries which are QMLs"
    cite: SRC-01-C0001
    topics: [qmf, qml, vocabulary]
    authority: source
  - id: EXT-0005
    type: context
    summary: "The trading node is a core component, but it is not the whole QMX system."
    quote: "the quant mind trading node and this is a thing that deals with after life trading so it is one of the core components of the entire system but it's not the only component of the entire system"
    cite: SRC-01-C0001
    topics: [trading-node, qmx, scope]
    authority: source
  - id: EXT-0006
    type: constraint
    summary: "The work should seek the most efficient leverage points rather than merely the fastest route."
    quote: "I won't say the fastest way, but the most efficient way"
    cite: SRC-01-C0001
    topics: [process, leverage, delivery]
    authority: source
  - id: EXT-0007
    type: correction
    summary: "The existing tracker and map are unverified and must not be treated as authoritative."
    quote: "everything you are going to read in terms of tracker and map, some stuff is not really verified yet. Okay, so for me, I think don't take it as core as you think."
    cite: SRC-01-C0001
    topics: [authority, tracker, evidence]
    authority: source
  - id: EXT-0008
    type: constraint
    summary: "User-facing output should stay in chat or diagrammatic artifacts, not prose-heavy reports."
    quote: "it's better we discuss either in chat or you produce an artifact that has diagrams or whatever because I don't like reading blocks of text"
    cite: SRC-01-C0002
    topics: [communication, diagrams, operator-experience]
    authority: source
  - id: EXT-0009
    type: constraint
    summary: "Questions should use the Ask User tool and include recommendations."
    quote: "if you want to ask a question, it's better you ask me with that tool of yours, the Ask User tool, but with recommendations"
    cite: SRC-01-C0002
    topics: [process, questions, operator-experience]
    authority: source
  - id: EXT-0010
    type: context
    summary: "The operator identifies as nontechnical and is ideating, so technical judgment should be carried by the agents."
    quote: "I'm not technical. Please, actually, in fact, I don't know what I'm doing. I'm not going to lie to you. I'm just ideating"
    cite: SRC-01-C0002
    topics: [operator, process, decision-making]
    authority: source
  - id: EXT-0011
    type: constraint
    summary: "Use one or two subagents for simple work instead of a long dynamic workflow."
    quote: "at times dynamic workflows are too long and okay, they are thorough, don't get me wrong, but at times are simple or two sub-agents could really do that trick"
    cite: SRC-01-C0002
    topics: [agents, workflow, process]
    authority: source
  - id: EXT-0012
    type: decision
    summary: "Use Sonnet and Opus routinely; reserve Fable for high-end reasoning or devil's-advocate work."
    quote: "Use Fable only and only when you need should I say high-end thinking or reasoning. If you need like a devil's advocate or something"
    cite: SRC-01-C0002
    topics: [agents, models, process]
    authority: source
  - id: EXT-0013
    type: correction
    summary: "QMF is a toolbox of libraries that builds applications; it is not itself an application."
    quote: "QMF-as-toolbox (libraries that build applications, never an application itself)"
    cite: SRC-01-C0003
    topics: [qmf, architecture, scope]
    authority: source
  - id: EXT-0014
    type: context
    summary: "An earlier design proposed one kernel with two plugs to make backtest/live parity testable."
    quote: "one kernel with two plugs (so backtest ≡ live is enforced by tests, not hoped for)"
    cite: SRC-01-C0003
    topics: [kernel, backtesting, live-parity]
    authority: source
  - id: EXT-0015
    type: constraint
    summary: "Signals must not carry money quantity, preventing bots from controlling sizing."
    quote: "signals that carry no money quantity (so a bot cannot blow the account through sizing)"
    cite: SRC-01-C0003
    topics: [signals, risk, bot]
    authority: source
  - id: EXT-0016
    type: decision
    summary: "Stored results should be content-addressed so changed definitions cannot silently reuse stale results."
    quote: "content-addressed results (so old test results can never silently lie about new definitions)"
    cite: SRC-01-C0003
    topics: [identity, results, reproducibility]
    authority: source
  - id: EXT-0017
    type: constraint
    summary: "A two-timestamp rule is required to prevent look-ahead bias."
    quote: "the two-timestamp rule (the one defence against an agent building in look-ahead bias at 3am)"
    cite: SRC-01-C0003
    topics: [data, timestamps, look-ahead]
    authority: source
  - id: EXT-0018
    type: constraint
    summary: "Forward-only calendar and tick evidence must be recorded or it is permanently lost."
    quote: "The economic calendar feed only shows the current week — past weeks are unbuyable at any price. Your own tick stream exists only if something records it."
    cite: SRC-01-C0003
    topics: [data-acquisition, calendar, ticks]
    authority: source
  - id: EXT-0019
    type: open
    summary: "The Spotware API application had not been submitted and its review lead time was unknown."
    quote: "The Spotware application isn't submitted. They review applications before you're allowed to build against their API, the queue length is unknown"
    cite: SRC-01-C0003
    topics: [ctrader, spotware, dependency]
    authority: source
  - id: EXT-0020
    type: correction
    summary: "Exit belongs to Book territory, not inside a confluence."
    quote: "It still says Exit lives inside the confluence (you ruled it's Book territory)"
    cite: SRC-01-C0003
    topics: [book, confluence, exits]
    authority: source
  - id: EXT-0021
    type: decision
    summary: "Backtesting and its fill engine were paused as a decision area."
    quote: "still puts the fill engine in core QMF (you paused backtesting entirely)"
    cite: SRC-01-C0003
    topics: [backtesting, fill-model, scope]
    authority: source
  - id: EXT-0022
    type: open
    summary: "The proposed five-lock sequencing spine was not adopted immediately and required discussion."
    quote: "Adopt the five locks (nouns+keys, broker contract+test suite, one manifest format, one-page agent surface, oracle list) as the official sequencing spine"
    cite: SRC-01-C0004
    topics: [five-locks, sequencing, open]
    authority: source
  - id: EXT-0023
    type: value
    summary: "An assistant estimate placed QMF alone at roughly 100–150 factory-days."
    quote: "The honest estimate for QMF alone is on the order of 100–150 factory-days"
    cite: SRC-01-C0003
    topics: [estimate, delivery, qmf]
    authority: source
  - id: EXT-0024
    type: context
    summary: "The cTrader adapter, prop-firm rule schema, and fill model were identified as pieces without obvious reusable implementations."
    quote: "Three pieces can't be sped up by copying because nothing to copy exists anywhere: the cTrader adapter, the prop-firm rule schema, and the fill model"
    cite: SRC-01-C0003
    topics: [ctrader, prop-firm, fill-model]
    authority: source
  - id: EXT-0025
    type: correction
    summary: "The framework must not box developers or agents into its own libraries."
    quote: "while we are building the framework, we should still make sure that we are not boxing ourselves in"
    cite: SRC-01-C0003
    topics: [extensibility, interoperability, architecture]
    authority: source
  - id: EXT-0026
    type: constraint
    summary: "QMF must remain usable together with ordinary Python and external libraries."
    quote: "We can still use the framework in correlation with normal Python."
    cite: SRC-01-C0003
    topics: [python, interoperability, qmf]
    authority: source
  - id: EXT-0027
    type: decision
    summary: "The agentic harness is the area that merits stricter discipline because agents are nondeterministic."
    quote: "the part where we are going to be a bit strict is the agentic harness. And the reason for that is because, well, agents are very non-deterministic"
    cite: SRC-01-C0003
    topics: [agentic-harness, strictness, safety]
    authority: source
  - id: EXT-0028
    type: context
    summary: "The DeepSeek approach was selected as a reference for the agentic harness, not as a constraint on all of QMF."
    quote: "So we are going to use what DeepSeek was using, but everywhere else, I believe we are just giving them a little bit of guidelines, but not boxing them"
    cite: SRC-01-C0003
    topics: [deepseek, agentic-harness, extensibility]
    authority: source
  - id: EXT-0029
    type: constraint
    summary: "Research and hypothesis experimentation must remain open to synthetic data, RLMs, and other methods."
    quote: "If we want to experiment with synthetic data, we can generate it. If we want to experiment with, you know, oh my god, if you want to experiment with RLMs, we can do it."
    cite: SRC-01-C0003
    topics: [research, experimentation, extensibility]
    authority: source
  - id: EXT-0030
    type: correction
    summary: "The live path needs uniformity and order, not rigid lock-in."
    quote: "order is necessary, but don't build yourself in"
    cite: SRC-01-C0003
    topics: [live-trading, uniformity, extensibility]
    authority: source
  - id: EXT-0031
    type: decision
    summary: "Begin recording and storing forward data in a retrievable form for the later full QMX build."
    quote: "we can start recording and storing the data somewhere, but we need to be logical and we need to be able to make sure we can retrieve it"
    cite: SRC-01-C0004
    topics: [data-acquisition, retention, recorder]
    authority: source
  - id: EXT-0032
    type: correction
    summary: "The trading node is specifically the live-trading portion of the larger QMX system."
    quote: "the trading node is actually still part of it, it's just the actual live trading part"
    cite: SRC-01-C0004
    topics: [trading-node, live-trading, scope]
    authority: source
  - id: EXT-0033
    type: constraint
    summary: "The recorder must expose visible status through a UI or TUI."
    quote: "Do we have a do you can you give me a UI or a TUI? I don't know if you want anyway, but as long as I know what's going on"
    cite: SRC-01-C0004
    topics: [recorder, observability, ui]
    authority: source
  - id: EXT-0034
    type: open
    summary: "The need to record the live tick stream remained delegated to technical judgment."
    quote: "I don't think we can we really need to bother so much for thick stream, but at the same time, I'm then wondering why bother a thick stream. This this one I think you do what you think is right"
    cite: SRC-01-C0004
    topics: [ticks, data-acquisition, open]
    authority: source
  - id: EXT-0035
    type: correction
    summary: "Examples in ideation must not be promoted automatically into crucial requirements."
    quote: "it takes that message as very crucial. Yet in the message, I said I was actually giving an example"
    cite: SRC-01-C0004
    topics: [process, examples, authority]
    authority: source
  - id: EXT-0036
    type: decision
    summary: "Current work excludes the agentic system and focuses on the ordinary building blocks that system will later use."
    quote: "For today, let's focus on everything apart from the agentic system. Okay? We build what the agentic system will be using in a normal day today."
    cite: SRC-01-C0004
    topics: [agentic-system, scope, qmf]
    authority: source
  - id: EXT-0037
    type: constraint
    summary: "The present documentation should not turn the illustrative agentic-system vision into requirements."
    quote: "You don't need to record anything about the authentic system. Again, I'm just giving you, painting a picture here"
    cite: SRC-01-C0004
    topics: [agentic-system, examples, scope]
    authority: source
  - id: EXT-0038
    type: constraint
    summary: "Extensibility must accommodate changing methods such as genetic algorithms, trees, RL, LLMs, and neural networks."
    quote: "today. I'm using genetic algorithms, tomorrow I'm using you know, decision trees, the other day I'm using RLA, and the other time I'm using an actual LLN, another time I'm using a neural network. So things change."
    cite: SRC-01-C0004
    topics: [extensibility, methods, research]
    authority: source
  - id: EXT-0039
    type: open
    summary: "The five-lock proposal was explicitly held for discussion rather than ratified."
    quote: "Discuss first"
    cite: SRC-01-C0004
    topics: [five-locks, ratification, open]
    authority: source
  - id: EXT-0040
    type: constraint
    summary: "Research findings are never adopted automatically; they must be discussed and ratified."
    quote: "Research protocol: findings are NEVER auto-adopted. Claude presents what was found, what it proposes, where it agrees/disagrees — then Mubarak and Claude discuss and ratify"
    cite: SRC-01-C0004
    topics: [research, ratification, process]
    authority: source
  - id: EXT-0041
    type: constraint
    summary: "Current operator rulings outrank every historical source layer."
    quote: "current operator rulings override every historical layer"
    cite: SRC-01-C0004
    topics: [authority, precedence, evidence]
    authority: source
  - id: EXT-0042
    type: constraint
    summary: "GitBook is the Book/BMS governance baseline but is not a complete mechanics source."
    quote: "GitBook (https://elios-1.gitbook.io/qmx) = the Book/BMS governance baseline, NOT a complete source"
    cite: SRC-01-C0004
    topics: [gitbook, authority, book]
    authority: source
  - id: EXT-0043
    type: constraint
    summary: "Old corpora and recovery material are evidence only and require fresh ratification."
    quote: "old corpus and local `.recovery/` = evidence only, fresh ratification required"
    cite: SRC-01-C0004
    topics: [legacy, recovery, authority]
    authority: source
  - id: EXT-0044
    type: constraint
    summary: "The Cordiverse composability paper is scoped to the agentic harness and must not be cited for QMF or the trading node."
    quote: "cordiverse composability paper = agentic harness only, never cite it for QMF or the node"
    cite: SRC-01-C0004
    topics: [cordiverse, agentic-harness, authority]
    authority: source
  - id: EXT-0045
    type: constraint
    summary: "Strictness is concentrated in the nondeterministic agentic harness and the gate into live money; research remains free."
    quote: "Strictness concentrates in exactly two places: the agentic harness (agents are non-deterministic; DeepSeek-grade discipline earns its place there) and the promotion gate into the live money path (order, not lock-in). Research/experimentation lanes stay free."
    cite: SRC-01-C0005
    topics: [strictness, agentic-harness, live-trading]
    authority: source
  - id: EXT-0046
    type: constraint
    summary: "The QMF research sweep and repo studies are research inputs, not adopted requirements."
    quote: "Facts gathered — adoption pending ratification."
    cite: SRC-01-C0005
    topics: [research, ratification, authority]
    authority: source
  - id: EXT-0047
    type: decision
    summary: "The earlier kernel ruling selected an in-house implementation rather than a third-party engine, runtime, or contract."
    quote: "BUILD our own — no third-party engine, runtime, or contract, ever."
    cite: SRC-01-C0005
    topics: [build-own, kernel, architecture]
    authority: source
  - id: EXT-0048
    type: constraint
    summary: "Load-bearing fills, metrics, and overfitting arithmetic must be readable and patchable by the factory."
    quote: "load-bearing arithmetic (fills/metrics/overfitting) must be readable and patchable by the factory"
    cite: SRC-01-C0005
    topics: [code-quality, fills, metrics]
    authority: source
  - id: EXT-0049
    type: decision
    summary: "Agent backtests run in disposable sandboxes and content-addressed Runs merge into a common ledger."
    quote: "agents backtest in disposable sandboxes where a small pure-Python QMF fits and content-addressed Runs merge from many sandboxes into one ledger"
    cite: SRC-01-C0005
    topics: [backtesting, sandboxes, results]
    authority: source
  - id: EXT-0050
    type: constraint
    summary: "Reference platforms contribute mental models only, not inherited implementations."
    quote: "Nautilus et al. = mental models in the ledger only."
    cite: SRC-01-C0005
    topics: [references, build-own, licensing]
    authority: source
  - id: EXT-0051
    type: death
    summary: "The proposed three-day third-party adoption spike was cancelled."
    quote: "The 3-day adoption spike is cancelled."
    cite: SRC-01-C0005
    topics: [kernel, evaluation, dead]
    authority: source
  - id: EXT-0052
    type: decision
    summary: "Unmodified, separately installed LGPL dependencies are acceptable."
    quote: "D1 licence amendment (LGPL ok for unmodified deps) still stands for ordinary libraries."
    cite: SRC-01-C0005
    topics: [licensing, dependencies, constraint]
    authority: source
  - id: EXT-0053
    type: death
    summary: "The word and framing 'kernel' were retired; qmf-core plus the separately specified trading node replace it."
    quote: "the word \"kernel\" is retired — the referent is now `qmf-core` (the language) plus the separately-specified trading node; the build-our-own ruling survives, the old framing does not."
    cite: SRC-01-C0006
    topics: [vocabulary, kernel, qmf-core]
    authority: source
  - id: EXT-0054
    type: decision
    summary: "Backtesting is paused for its own session, with a staged funnel and a missing GPT brainstorm as input."
    quote: "Backtesting: PAUSED as a decision area (operator ruling) — own session"
    cite: SRC-01-C0005
    topics: [backtesting, scope, deferred]
    authority: source
  - id: EXT-0055
    type: context
    summary: "The intended backtesting funnel progresses from screening through research, robustness, replay, and full Book/BMS simulation."
    quote: "Approach changes to his staged funnel (screen → research → robustness → replay → full Book/BMS sim), on-demand in sandboxes."
    cite: SRC-01-C0005
    topics: [backtesting, funnel, book]
    authority: source
  - id: EXT-0056
    type: open
    summary: "The operator's GPT backtesting brainstorm remained a missing input."
    quote: "His GPT brainstorm markdown is the missing input — request it."
    cite: SRC-01-C0005
    topics: [backtesting, input, open]
    authority: source
  - id: EXT-0057
    type: constraint
    summary: "Current Claude sessions must keep hands off the agentic system until its research papers are analyzed."
    quote: "Agentic system: HANDS OFF for Claude sessions — ~5 research papers to analyze first; \"don't build organs; the veins only.\""
    cite: SRC-01-C0006
    topics: [agentic-system, scope, deferred]
    authority: source
  - id: EXT-0058
    type: decision
    summary: "Bot schema and data management were the only explicitly allowed agentic foundations."
    quote: "Allowed foundational organs: bot schema, data management."
    cite: SRC-01-C0006
    topics: [agentic-system, bot-schema, data]
    authority: source
  - id: EXT-0059
    type: decision
    summary: "Prop-firm Books and firm-specific modeling were deferred to the agentic era."
    quote: "Prop-firm Book: DEFERRED to the agentic era (operator ruling, re-echoed — do not re-surface)."
    cite: SRC-01-C0006
    topics: [prop-firm, book, deferred]
    authority: source
  - id: EXT-0060
    type: context
    summary: "An earlier plan retained generic rule-schema and Program/Campaign capability in QMF V1, but this is later reversed."
    quote: "QMF V1 ships only generic machinery (rule schema + Program/Campaign phase capability) able to hold any firm's rules later."
    cite: SRC-01-C0006
    topics: [prop-firm, program-campaign, superseded]
    authority: source
  - id: EXT-0061
    type: constraint
    summary: "QMF does not adopt third-party strategy-family libraries; it enables custom implementations of those ideologies."
    quote: "QMF never adopts third-party strategy-family libraries (SMC, ICT, scalper packs…); it exists so Mubarak/agents can build their OWN custom versions of those ideologies."
    cite: SRC-01-C0006
    topics: [strategy-libraries, build-own, qmf]
    authority: source
  - id: EXT-0062
    type: constraint
    summary: "Repo studies may supply mental models but not transplanted code, and licenses must be respected."
    quote: "Repo studies extract mental models only — no code transplantation, licences respected."
    cite: SRC-01-C0006
    topics: [research, licensing, code-transplant]
    authority: source
  - id: EXT-0063
    type: constraint
    summary: "Futures and options trading are permanently excluded; day-traded stocks may be added later."
    quote: "Permanent product constraint: no futures or options, ever; stocks (day-trading) possibly later."
    cite: SRC-01-C0006
    topics: [asset-classes, scope, stocks]
    authority: source
  - id: EXT-0064
    type: decision
    summary: "Testing is a Bot-by-Book matrix because each Book may define its own test mechanism."
    quote: "each Book may carry its own testing mechanism — one bot testable against many Books (scalping variants, prop-firm eval vs funded) as a matrix."
    cite: SRC-01-C0006
    topics: [bot, book, testing]
    authority: source
  - id: EXT-0065
    type: context
    summary: "The proposed qmf-core language includes exact money, exact time, broad nouns, typed refusals, stamping, and versioning."
    quote: "library #1 = `qmf-core` \"the language\" (exact money, exact time, the nouns seeded with order-flow/DOM concepts so crypto never forces a rebuild, typed refusals, stamp machine, versioning) — proposed, pending explicit ratification"
    cite: SRC-01-C0006
    topics: [qmf-core, primitives, proposal]
    authority: source
  - id: EXT-0066
    type: value
    summary: "Confluence is defined as levels, triggers, and confirmations, with multiple variants and nesting."
    quote: "Confluence = Level(s)+Trigger(s)+Confirmation(s), multi-variant and nesting"
    cite: SRC-01-C0006
    topics: [confluence, bot, schema]
    authority: source
  - id: EXT-0067
    type: constraint
    summary: "Confluence contains no Exit; Exit, sizing, and risk are Book responsibilities."
    quote: "no Exit — Exit/sizing/risk are Book territory"
    cite: SRC-01-C0006
    topics: [confluence, book, risk]
    authority: source
  - id: EXT-0068
    type: open
    summary: "The Bot-to-Book binding contract remained undesigned."
    quote: "Bot = confluence + binding contract (not yet designed) + accumulating lineage, variants first-class"
    cite: SRC-01-C0006
    topics: [bot, book, contract]
    authority: source
  - id: EXT-0069
    type: value
    summary: "SQS expands to Spread Quality Sensor, but its candidate formula was not ratified."
    quote: "SQS = Spread Quality Sensor (candidate formula NOT ratified)"
    cite: SRC-01-C0006
    topics: [sqs, spread, formula]
    authority: source
  - id: EXT-0070
    type: value
    summary: "R means one unit of original pre-trade risk."
    quote: "R = one unit of original pre-trade risk"
    cite: SRC-01-C0006
    topics: [risk, variables, r]
    authority: source
  - id: EXT-0071
    type: death
    summary: "FORM-0006 must not be implemented because it is dimensionally broken."
    quote: "FORM-0006 dimensionally broken — never implement as-is"
    cite: SRC-01-C0006
    topics: [formula, risk, dead]
    authority: source
  - id: EXT-0072
    type: constraint
    summary: "The three seat concepts must never be collapsed into one."
    quote: "three seat concepts never collapsed"
    cite: SRC-01-C0006
    topics: [seat, book, schema]
    authority: source
  - id: EXT-0073
    type: correction
    summary: "Sweep-to-cap-to-reseed is a scalping Book pattern, not a global QMX law."
    quote: "sweep→cap→re-seed = the SCALPING Book's pattern, not a universal law"
    cite: SRC-01-C0006
    topics: [scalping, book, treasury]
    authority: source
  - id: EXT-0074
    type: decision
    summary: "Simulator is reserved as a later product UI and backtesting is called a library, not an engine."
    quote: "Simulator = product UI later; backtesting = library, never \"engine\"."
    cite: SRC-01-C0006
    topics: [simulator, backtesting, vocabulary]
    authority: source
  - id: EXT-0075
    type: constraint
    summary: "Claude must not scaffold projects; documentation restarts framework-first and trading-node work follows."
    quote: "Claude never scaffolds/initializes projects — Mubarak's own skills do that; documentation restart is framework-first, trading node later"
    cite: SRC-01-C0006
    topics: [process, documentation, trading-node]
    authority: source
  - id: EXT-0076
    type: constraint
    summary: "Code must be understandable by humans as well as agents."
    quote: "code is written for humans AND agents (\"I might also need to understand this code\")"
    cite: SRC-01-C0006
    topics: [code-quality, operator, agents]
    authority: source
  - id: EXT-0077
    type: death
    summary: "The term 'plugins' is banned even though the platform is extensible."
    quote: "the platform is fully extensible but the word \"plugins\" is banned"
    cite: SRC-01-C0006
    topics: [vocabulary, extensibility, dead]
    authority: source
  - id: EXT-0078
    type: decision
    summary: "Build incrementally one topic per session rather than attempting a multi-day full draft."
