    type: correction
    summary: "The old backtesting system was overengineered and carried wrong claims, while its true purpose was preventing overfitting."
    quote: "our old backtesting engine, it had a lot, but there were so many wrong claims and it seemed over-engineered, in my opinion. But what we were trying to do is just preventing overfitting."
    cite: SRC-01-C0011
    topics: [backtesting, overfitting, legacy]
    authority: source
  - id: EXT-0146
    type: constraint
    summary: "Agents execute tests correctly, but agents do not decide whether a strategy is accepted."
    quote: "the agents are not the ones that decide, but the agents should be able to do the right things in terms of testing a strategy"
    cite: SRC-01-C0011
    topics: [agents, backtesting, authority]
    authority: source
  - id: EXT-0147
    type: value
    summary: "The legacy Book exam meant testing a Bot against the conditions that define its target Book."
    quote: "The strategy or the bot has to be tested against the things that make the scalping book the scalping book."
    cite: SRC-01-C0011
    topics: [book, bot, testing]
    authority: source
  - id: EXT-0148
    type: correction
    summary: "Broker connection is considered simple, whereas backtesting is not."
    quote: "connection is simple again. I'll say this a lot: connection is simple."
    cite: SRC-01-C0011
    topics: [broker, connection, backtesting]
    authority: source
  - id: EXT-0149
    type: correction
    summary: "Live promotion is binary, and non-live Bots may be in paper trading rather than an abstract promotion tier."
    quote: "promotion towards life is a little bit ambiguous. It's either live or not live, simple as that. Okay, that's as simple as that. And if it's not live, what is it doing? Because we had a mechanism of having both be paper trading"
    cite: SRC-01-C0011
    topics: [promotion, live, paper]
    authority: source
  - id: EXT-0150
    type: decision
    summary: "Paper trading can be activated by kill-switch, daily-limit, or prop-firm conditions while results continue to be recorded."
    quote: "if the kill switch fires, if for example, the scalping book example we have, if the daily drawdown, I don't know if it's called drawdown, but it's something like a daily limit, I believe. If it's heat, stuff like that, and even for prop firm books, that might be the way."
    cite: SRC-01-C0011
    topics: [paper-trading, kill-switch, book]
    authority: source
  - id: EXT-0151
    type: constraint
    summary: "Alpha-decay sensing requires continued collection even after a strategy is paused or evolves into new versions."
    quote: "that doesn't mean that we pause them there and then. We still need a lot of data collections or data points. In fact, throughout the entire system, that's something we need to consider so much."
    cite: SRC-01-C0012
    topics: [alpha-decay, data, strategy]
    authority: source
  - id: EXT-0152
    type: correction
    summary: "Data ingestion, processed-data collection, and processing methodology are distinct concerns."
    quote: "data ingestion or data intake is one thing, data collection after being processed is another. How data is processed is something to also consider."
    cite: SRC-01-C0012
    topics: [data-layer, ingestion, processing]
    authority: source
  - id: EXT-0153
    type: decision
    summary: "QMX provides strategies with appropriate trading conditions while centralizing risk management above individual Bots."
    quote: "the whole point of actually creating QMX as it is is giving a strategy the best suitable conditions for it to trade. So, we remove the burden of modeling risk management, we do it at a higher level, and we just give the bot things that it needs to trade."
    cite: SRC-01-C0012
    topics: [qmx, risk, bot]
    authority: source
  - id: EXT-0154
    type: decision
    summary: "The data layer includes a trading journal and observability for Bot, Book, BMS, MIS, SQS, and kill switch."
    quote: "we should have a trading journal. You know, if a bot is trading, if a book is trading, what is the BMS saying? The MIS, the SQS, the kill switch. There are so many things we need to collect."
    cite: SRC-01-C0012
    topics: [journal, observability, data]
    authority: source
  - id: EXT-0155
    type: open
    summary: "Collection content, mechanism, quantity, retention, and cadence remain to be specified per component."
    quote: "we still also need to see what is it collecting, how is it collecting it, in what quantity, how long, how often?"
    cite: SRC-01-C0012
    topics: [data, cadence, retention]
    authority: source
  - id: EXT-0156
    type: open
    summary: "ArcticDB was only a proposal and its suitability remained uncertain."
    quote: "Yesterday we were proposing ArcticDB. I don't know if it will work"
    cite: SRC-01-C0012
    topics: [arcticdb, storage, open]
    authority: source
  - id: EXT-0157
    type: death
    summary: "A single universal identity card was rejected as premature abstraction that could lock in Forex-specific assumptions."
    quote: "this point of one card, I think it's a bit abstract. I really do. Because there is so much to consider before you even propose one singular card"
    cite: SRC-01-C0012
    topics: [identity, abstraction, dead]
    authority: source
  - id: EXT-0158
    type: decision
    summary: "Identity is acceptable in principle and lineage is graph-shaped, but no graph database is yet chosen."
    quote: "the ID itself is okay. I don't deny the thing of an ID. I do, but in fact, actually, this is where relational databases come in. I don't know if I'm actually saying the right thing, but if you look at something like Neo4je, for example"
    cite: SRC-01-C0012
    topics: [identity, lineage, graph]
    authority: source
  - id: EXT-0159
    type: correction
    summary: "The bare term 'model' is ambiguous across ML, trading, and analysis meanings."
    quote: "what is a model? Are you talking about a machine learning model, a trading model? Are you talking about, you know, should I say, a data analysis model?"
    cite: SRC-01-C0012
    topics: [vocabulary, model, ambiguity]
    authority: source
  - id: EXT-0160
    type: constraint
    summary: "Books have their own specific metrics, variables, and schemas, and deploying a Book requires the operator in the loop."
    quote: "a book is specific, a book is just under risk management and position sizing. Okay, it's very specific. A book is, in fact, for an agent to deploy a book, I have to be in the loop. Okay, and a book has specific metrics and variables."
    cite: SRC-01-C0012
    topics: [book, deployment, operator]
    authority: source
  - id: EXT-0161
    type: correction
    summary: "A Bot can contain multiple confluences and can combine behavior for multiple market regimes."
    quote: "About now, about is a combination of many things. So, when you say a level or trigger, a level and a trigger are under a bot, together with the other thing I was talking about in the last session called Confluence, but that alone doesn't make up a bot because it can contain multiple confluences."
    cite: SRC-01-C0012
    topics: [bot, confluence, composition]
    authority: source
  - id: EXT-0162
    type: constraint
    summary: "Design work should be sliced to what one session can genuinely handle."
    quote: "we need to try and bite off as little, okay, not as little, but the part that we can actually handle in one go"
    cite: SRC-01-C0012
    topics: [process, sessions, scope]
    authority: source
  - id: EXT-0163
    type: decision
    summary: "The one-page agent authoring surface is deferred until the QMF library and documentation exist."
    quote: "let's first build the library. If you, for example, you're an agent right now, right? If you were told to use React and you've never actually seen React, you'll need proper documentation, right? But the thing is, we can't front-load an agent page without having proper documentation"
    cite: SRC-01-C0012
    topics: [agent-surface, documentation, deferred]
    authority: source
  - id: EXT-0164
    type: value
    summary: "A Trigger is the exact event that enters a trade."
    quote: "a trigger is the exact event that puts you into a trade"
    cite: SRC-01-C0012
    topics: [trigger, bot, vocabulary]
    authority: source
  - id: EXT-0165
    type: constraint
    summary: "The existing Book schema in GitBook must be read rather than guessed."
    quote: "a book is already documented very, very well on Gitbook. Very well. It has a schema, all right."
    cite: SRC-01-C0013
    topics: [book, gitbook, schema]
    authority: source
  - id: EXT-0166
    type: constraint
    summary: "Promotion into live trading is human-only; an agent cannot promote, and even an opaque Python-only Bot may be promoted."
    quote: "promotion is just actually prom no agent can promote, it's me who does the actual promotion. So, I can even just decide to promote a Python-only bot."
    cite: SRC-01-C0013
    topics: [promotion, operator, bot]
    authority: source
  - id: EXT-0167
    type: decision
    summary: "The essential lifecycle zones are the free lab and live money, with promotion as a human review activity rather than a major subsystem."
    quote: "the only two things that are very important are love-free and live"
    cite: SRC-01-C0013
    topics: [lab, live, promotion]
    authority: source
  - id: EXT-0168
    type: decision
    summary: "All overfitting-statistics and backtesting design is deferred because upstream concepts are not yet settled and agents will run the tests."
    quote: "I'm not the one doing the back tests. I really am not. It's the agents. So we need to really sit down and think through this. And I'm not willing to do it now because there are so many things we haven't thought through upstream."
    cite: SRC-01-C0013
    topics: [backtesting, agents, deferred]
    authority: source
  - id: EXT-0169
    type: death
    summary: "Program/Campaign challenge machinery is rejected; a prop firm is modeled as a new Book."
    quote: "the program campaign: a machine that plays a program challenge. No, this is off very much off. Reason being, what are you going to use as a prop form to model the prop farm? That is some the prop form, think of it as a new book."
    cite: SRC-01-C0013
    topics: [program-campaign, prop-firm, book]
    authority: source
  - id: EXT-0170
    type: decision
    summary: "Book creation, including prop-firm Books, belongs to the agentic era."
    quote: "tomorrow, if I decide to make a prop form book, I should be able to do it under QMX. That's one of the things I want to be doing with QMX. Also, creation of books, but all that goes to agentic system."
    cite: SRC-01-C0013
    topics: [book, prop-firm, agentic-system]
    authority: source
  - id: EXT-0171
    type: constraint
    summary: "Backend and UI extensibility require structure and order."
    quote: "it does reinforce my point of this being extensible as much as possible, as much as possible in the back end in the UI. It really needs to be. That's why we need structure and order."
    cite: SRC-01-C0013
    topics: [extensibility, backend, ui]
    authority: source
  - id: EXT-0172
    type: value
    summary: "The calendar recorder captured 96 events, including 8 high-impact events, on its first run."
    quote: "recorder/ now holds today's first snapshots (96 events, 8 high-impact)"
    cite: SRC-01-C0013
    topics: [calendar, recorder, values]
    authority: source
  - id: EXT-0173
    type: value
    summary: "The calendar recorder was scheduled for 06:00 and 18:00 daily."
    quote: "a scheduled task runs it at 06:00 and 18:00 daily"
    cite: SRC-01-C0013
    topics: [calendar, schedule, operations]
    authority: source
  - id: EXT-0174
    type: constraint
    summary: "The calendar feed allows roughly two downloads per five minutes and should not be polled more aggressively."
    quote: "the feed allows roughly 2 downloads per 5 minutes, so we deliberately don't poll more"
    cite: SRC-01-C0013
    topics: [calendar, rate-limit, recorder]
    authority: source
  - id: EXT-0175
    type: constraint
    summary: "The calendar feed lacks actual release values, so it supports blackout gating but not surprise-based strategies."
    quote: "the feed carries forecast/consensus but no actual released values — it supports the news-blackout gate, not surprise-based strategies"
    cite: SRC-01-C0013
    topics: [calendar, news, data-quality]
    authority: source
  - id: EXT-0176
    type: open
    summary: "The legal posture of automated calendar archiving remained unresolved."
    quote: "the legal posture of automated archiving stays an open item on your side"
    cite: SRC-01-C0013
    topics: [calendar, legal, open]
    authority: source
  - id: EXT-0177
    type: decision
    summary: "Lock 1, the qmf-core Dictionary, was accepted as the first brick, while its six irreversible choices stayed proposals."
    quote: "Lock 1 \"the Dictionary\" (qmf-core): ACCEPTED as first brick, with every dictated input below folded in. The six freeze-choices (UTC-ns clock, (venue,symbol) identity, TA-Lib reference math, three backtest honesty levels, SR* bar, result-label tuple) remain PROPOSALS to be explicitly confirmed during the documentation pass — not yet frozen."
    cite: SRC-01-C0014
    topics: [qmf-core, five-locks, ratification]
    authority: source
  - id: EXT-0178
    type: decision
    summary: "Identity and graph-shaped lineage were accepted in principle while a universal card was denied."
    quote: "Lock 3: identity + lineage ratified IN PRINCIPLE (lineage is explicitly graph-shaped — Neo4j analogy, grows and compounds); one-card-for-EVERYTHING DENIED as premature abstraction"
    cite: SRC-01-C0014
    topics: [identity, lineage, five-locks]
    authority: source
  - id: EXT-0179
    type: decision
    summary: "Lock 5's answer-key catalog was not ratified and had to be grounded in actual QMX components."
    quote: "Lock 5 (answer keys): NOT ratified — rework grounded in actual QMX components first."
    cite: SRC-01-C0014
    topics: [answer-keys, validation, five-locks]
    authority: source
  - id: EXT-0180
    type: context
    summary: "Heavy examples include regime detection, GARCH-family volatility, correlations, clustering, and ML inference; MIS publishes a frozen view consumed by Bots."
    quote: "heavy = things that can't compute in milliseconds — regime detection over years of data, volatility forecasting (GARCH-family), cross-pair correlation matrices, clustering, any ML model inference — and they live in the MIS, publishing a frozen view the bots read."
    cite: SRC-01-C0014
    topics: [indicators, mis, heavy-compute]
    authority: source
  - id: EXT-0181
    type: context
    summary: "Light indicators are per-bar calculations such as EMA, RSI, and ATR."
    quote: "Light = per-bar arithmetic like EMA, RSI, ATR — bot-level."
    cite: SRC-01-C0014
    topics: [indicators, bot, light-compute]
    authority: source
  - id: EXT-0182
    type: open
    summary: "Graph-shaped lineage does not yet imply Neo4j or any other graph database."
    quote: "whether it needs a graph database or graph-shaped records in plain files is a data-layer decision, and per your own rule we won't box into either yet."
    cite: SRC-01-C0014
    topics: [lineage, graph, storage]
    authority: source
  - id: EXT-0183
    type: context
    summary: "ArcticDB was reported to have only one native time axis, a weakness for the two-timestamp requirement."
    quote: "ArcticDB has a known technical weakness for our two-timestamp needs (it tracks only one of the two times natively)"
    cite: SRC-01-C0014
    topics: [arcticdb, timestamps, storage]
    authority: source
  - id: EXT-0184
    type: constraint
    summary: "Banned vocabulary includes plugins, exam, engine for backtesting, and fake-counterparty framing."
    quote: "Banned vocabulary: \"plugins\" (extensions are not plugins); \"exam\" (collides with the legacy Examination Engine / Book-exam concept, 2026-08-18); \"engine\" for backtesting (it is a library); no \"fake counterparty\" framing."
    cite: SRC-01-C0015
    topics: [vocabulary, process, constraint]
    authority: source
  - id: EXT-0185
    type: constraint
    summary: "Give the operator time to read an artifact before asking questions about it."
    quote: "Give reading time — never deliver an artifact and fire questions in the same beat."
    cite: SRC-01-C0015
    topics: [communication, artifacts, process]
    authority: source
  - id: EXT-0186
    type: decision
    summary: "While a pair is blocked by news, its Bots may remain in paper mode to preserve alpha-decay evidence."
    quote: "while blocked, bots may continue in paper mode so alpha-decay data keeps flowing"
    cite: SRC-01-C0016
    topics: [kill-switch, paper-trading, alpha-decay]
    authority: source
  - id: EXT-0187
    type: constraint
    summary: "Deep-study work on identity, data, and answer keys explicitly excluded backtesting."
    quote: "Backtesting is explicitly excluded from all of them."
    cite: SRC-01-C0019
    topics: [backtesting, deep-study, scope]
    authority: source
  - id: EXT-0188
    type: context
    summary: "The operator worried that front-loading a large build would create avoidable cost."
    quote: "I think I'm proposing rather that we build a lot at the start, and I think that is going to cost me in a way."
    cite: SRC-01-C0019
    topics: [scope, delivery, cost]
    authority: source
  - id: EXT-0189
    type: constraint
    summary: "Extensibility is the paramount design idea because new asset classes and methods will keep being added."
    quote: "extensibility again should be the core idea behind all of this because I had actually forgotten I also want to trade stocks"
    cite: SRC-01-C0019
    topics: [extensibility, stocks, design-values]
    authority: source
  - id: EXT-0190
    type: decision
    summary: "Stocks are a required future asset class alongside Forex and crypto."
    quote: "I had actually forgotten I also want to trade stocks"
    cite: SRC-01-C0019
    topics: [stocks, asset-classes, scope]
    authority: source
  - id: EXT-0191
    type: decision
    summary: "The foundational pattern is a small core with wide seams rather than a large initial build."
    quote: "The honest pattern is: build a small core with wide seams."
    cite: SRC-01-C0019
    topics: [architecture, qmf-core, extensibility]
    authority: source
  - id: EXT-0192
    type: constraint
    summary: "Core concepts must not assume Forex, cTrader, or scalping so later assets extend rather than rebuild the foundation."
    quote: "making sure the core words never assume forex, cTrader, or scalping. Then stocks later is \"one more venue and one more instrument type,\" not a rebuild."
    cite: SRC-01-C0019
    topics: [qmf-core, asset-neutral, extensibility]
    authority: source
  - id: EXT-0193
    type: context
    summary: "The first answer-key rework proposed dual indicator references, a look-ahead specimen, Book schema validation, prop-firm fixtures, and calendar blackout fixtures."
    quote: "each real QMX module family gets an external truth (TA-Lib and talipp as dual reference for indicators, the broken smartmoneyconcepts library kept as a specimen the look-ahead test must always catch, the GitBook Book schema as the only spec for money math, published prop-firm rulebooks as free fixtures, your archived calendar snapshots as the kill-switch test corpus)"
    cite: SRC-01-C0020
    topics: [answer-keys, validation, research]
    authority: source
  - id: EXT-0194
    type: context
    summary: "The identity study proposed fingerprint, charter, and occurrence as three distinct identity disciplines."
    quote: "The three-discipline correction to \"one card\": fingerprint (reproducible recipes — levels/triggers/confluences, content-addressed), charter (named things the operator stands behind — Books, BMS instances, operator-countersigned, amended by named decisions), occurrence (unrepeatable events — runs, live sessions; a live Tuesday cannot be re-derived, so it carries no content hash)."
    cite: SRC-01-C0020
    topics: [identity, fingerprint, charter]
    authority: source
  - id: EXT-0195
    type: constraint
    summary: "Only the address shape kind plus id was proposed as universal across identity families."
    quote: "Only the address format `kind + id` is universal."
    cite: SRC-01-C0020
    topics: [identity, address, proposal]
    authority: source
  - id: EXT-0196
    type: context
    summary: "The identity study distinguishes permanent Bot career identity from per-revision fingerprints and represents plain-Python Bots opaquely."
    quote: "Bot = permanent career identity + per-revision fingerprints; variants are new bots linked `variant-of`; plain-Python bots carried via `definition: opaque`."
    cite: SRC-01-C0020
    topics: [bot, identity, lineage]
    authority: source
  - id: EXT-0197
    type: open
    summary: "Whether BENCHED belongs to a roster seat, whether individual Bots can paper trade under live Books, and when idea-origin becomes mandatory were open."
    quote: "Top open questions (operator): BENCHED moves from Book mode to the bot's roster seat (recommend yes); one bot in paper while its Book stays live (recommend yes); idea-origin required only at promotion gate, not registration (recommend yes — don't-box-in)."
    cite: SRC-01-C0020
    topics: [benched, paper-trading, identity]
    authority: source
  - id: EXT-0198
    type: context
    summary: "A six-layer data blueprint proposed ingest, raw evidence, processed data, journal, research-door, and backup layers."
    quote: "six layers L0–L5 (ingest / raw evidence / processed / journal / research door with splits-by-default / backup)"
    cite: SRC-01-C0021
    topics: [data-layer, layers, proposal]
    authority: source
  - id: EXT-0199
    type: context
    summary: "The data study proposed Parquet, DuckDB, and a SQLite inbox while rejecting PostgreSQL and ArcticDB for V1."
    quote: "stores-per-purpose matrix (Parquet+DuckDB+SQLite-inbox; PostgreSQL rejected), ArcticDB verdict: NO for v1 — technical, not licence"
    cite: SRC-01-C0021
    topics: [storage, parquet, arcticdb]
    authority: source
  - id: EXT-0200
    type: context
    summary: "The data study proposed append-only JSONL lineage and deferred a graph database until needed."
    quote: "lineage: graph model in append-only JSONL files, graph database deferred until proven needed"
    cite: SRC-01-C0021
    topics: [lineage, jsonl, graph]
    authority: source
  - id: EXT-0201
    type: context
    summary: "The data blueprint proposed a permanently active paper twin, later rejected at Bot level."
    quote: "paper-twin permanently on for alpha-decay continuity"
    cite: SRC-01-C0021
    topics: [paper-twin, alpha-decay, superseded]
    authority: source
  - id: EXT-0202
    type: constraint
    summary: "Proposed automatic detection rules may notify but must never act autonomously."
    quote: "auto-detection = operator-owned rules.yaml over a fixed metric catalog, flags notify but NEVER act."
    cite: SRC-01-C0021
    topics: [automation, detection, operator]
    authority: source
  - id: EXT-0203
    type: constraint
    summary: "None of the three deep-dive studies were adopted merely by being delivered."
    quote: "three studies delivered while operator was out (facts gathered, NONE adopted)"
    cite: SRC-01-C0021
    topics: [research, ratification, authority]
    authority: source
  - id: EXT-0204
    type: decision
    summary: "Forex is seeded first; equities and crypto arrive later."
    quote: "we are seeding Forex, but the other two will come in later: equities and crypto."
    cite: SRC-01-C0022
    topics: [forex, equities, crypto]
    authority: source
  - id: EXT-0205
    type: open
    summary: "The six-layer data system was accepted as a plausible shape but still needed definition."
    quote: "The data layer, in my opinion, it's a six-layer system, good okay, seems like it by the way. Kind of seems like six, but we need to define it."
    cite: SRC-01-C0022
    topics: [data-layer, six-layers, open]
    authority: source
  - id: EXT-0206
    type: constraint
    summary: "Documentation must give coding agents enough context to avoid implementation mistakes."
    quote: "our whole point is to provide enough context so that the agent doesn't actually make mistakes while coding this out."
    cite: SRC-01-C0022
    topics: [documentation, coding-agents, quality]
    authority: source
  - id: EXT-0207
    type: open
    summary: "Using cTrader for stocks was explicitly speculative and not a ruling."
    quote: "I might still use C trader for stocks unless I see otherwise. Anyway, hey, don't take that literally."
    cite: SRC-01-C0022
    topics: [ctrader, stocks, open]
    authority: source
  - id: EXT-0208
    type: open
    summary: "Crypto spot and crypto-versus-currency instrument treatment remain undecided."
    quote: "A crypto might go with spot. Yeah, but we shall see really. Crypto is large."
    cite: SRC-01-C0022
    topics: [crypto, spot, instruments]
    authority: source
  - id: EXT-0209
    type: context
    summary: "There is one current BMS version, expected to evolve or diversify later."
    quote: "I have one version of a BMS, but I believe as we go further down the road, we might enhance it and make it different"
    cite: SRC-01-C0022
    topics: [bms, versioning, future]
    authority: source
  - id: EXT-0210
    type: correction
    summary: "Specific method examples such as genetic algorithms are illustrative and not framework limits."
    quote: "the method scheme, the genetic algorithms, method sim, don't worry about it, really. Like, the sky is the limit."
    cite: SRC-01-C0022
    topics: [methods, examples, extensibility]
    authority: source
  - id: EXT-0211
    type: correction
    summary: "Nothing agreed left QMF merely because it was outside qmf-core; QMF is an umbrella of libraries."
    quote: "Nothing agreed leaves QMF. Those things are only outside qmf-core, the first brick. QMF is an umbrella of libraries split along your five hats"
    cite: SRC-01-C0022
    topics: [qmf, qmf-core, correction]
    authority: source
  - id: EXT-0212
    type: constraint
    summary: "Architecture must be designed for a real workload of roughly forty Bots rather than toy assumptions."
    quote: "this system has a possibility of having around 40-something bots"
    cite: SRC-01-C0022
    topics: [scale, bots, architecture]
    authority: source
  - id: EXT-0213
    type: decision
    summary: "Book paper mode is Book-level: the Book switches to paper and all attached Bots continue there."
    quote: "paper mode is Book-level, not bot-level — when a Book can't trade live, the Book switches to a paper account and its bots keep trading there so performance data keeps flowing"
    cite: SRC-01-C0023
    topics: [paper-trading, book, bots]
    authority: source
  - id: EXT-0214
    type: death
    summary: "Parallel Bot paper twins and one-Bot-to-many-Books were rejected."
    quote: "no bot ever runs a parallel paper twin, and a bot connects to exactly one Book (Q5 and Q10 both die, correctly)."
    cite: SRC-01-C0023
    topics: [paper-twin, bot, book]
    authority: source
  - id: EXT-0215
    type: decision
    summary: "Raw data is retained fully and backed up to an object-storage bucket."
    quote: "Q7: keep everything raw — storage is yours to buy, bucket backs it up."
    cite: SRC-01-C0023
    topics: [raw-data, retention, backup]
    authority: source
  - id: EXT-0216
    type: decision
    summary: "Historical Dukascopy plumbing is built now, while bulk data download stays at installation time."
    quote: "Historical Dukascopy download stays where you already ruled it: plumbing now, downloading at install"
    cite: SRC-01-C0023
    topics: [dukascopy, data-acquisition, installation]
    authority: source
  - id: EXT-0217
    type: context
    summary: "The proposed no-server local stack is compressed Parquet, DuckDB, and SQLite for the live inbox."
    quote: "Plain compressed files (Parquet) + DuckDB (free, no server) + SQLite for the live inbox"
    cite: SRC-01-C0023
    topics: [storage, parquet, sqlite]
    authority: source
  - id: EXT-0218
    type: decision
    summary: "Trading-node design may start soon, but trading-node code waits for its QMF library dependencies."
    quote: "the node's design sessions can start soon (it's documentation work), but its code waits for the QMF libraries it stands on."
    cite: SRC-01-C0023
    topics: [trading-node, sequencing, documentation]
    authority: source
  - id: EXT-0219
    type: decision
    summary: "Historical datasets should retain as much history as each currency and Dukascopy provide."
    quote: "It should have as far back as that currency goes. Okay, as far back as that currency goes, and also as far back as locascopy provides."
    cite: SRC-01-C0023
    topics: [history, dukascopy, retention]
    authority: source
  - id: EXT-0220
    type: decision
    summary: "The newest twelve months of historical data are sealed from experiments for a final out-of-sample look."
    quote: "for the data of most recent, yes, skip the most recent 12 months"
    cite: SRC-01-C0023
    topics: [holdout, out-of-sample, backtesting]
    authority: source
  - id: EXT-0221
    type: decision
    summary: "Live performance data remains stored and may support MIS training and shadow deployment."
    quote: "we are still storing the performance data because we can still distill it and like use it for training, not training, yeah. Actually, my ML, the MIS training, there are so many models in there that I think I believe was already thought through for Shadow Dish. It's called Shadow Deployment."
    cite: SRC-01-C0023
    topics: [performance-data, mis, shadow-deployment]
    authority: source
  - id: EXT-0222
    type: open
    summary: "The exact training/out-of-sample splitting method and whether sheer data volume is the right design variable remain open."
    quote: "is it called chunking where we split like that data that this is for training, this is for out of sample? We have a long enough time frame to test with. I don't know if the amount is a good variable to use anyway"
    cite: SRC-01-C0023
    topics: [splits, training, open]
    authority: source
  - id: EXT-0223
    type: correction
    summary: "SQS is a distinct trading gate and must not be confused with the news blackout."
    quote: "The SQS is one of the gates that allow a system to trade or not, simple as that."
    cite: SRC-01-C0023
    topics: [sqs, news, gates]
    authority: source
  - id: EXT-0224
    type: decision
    summary: "Scheduled-news blackout is pair-scoped and tentatively runs from 15 minutes before through 15 minutes after the event."
    quote: "I think it stops 15 minutes before, then resumes 15 minutes after. It's very systematic."
    cite: SRC-01-C0023
    topics: [news, kill-switch, timing]
    authority: source
  - id: EXT-0225
    type: open
    summary: "The meaning and mechanics of BENCHED required a dedicated corpus dig."
    quote: "benching, I don't think I'm sure. So, you might need to dig deep here"
    cite: SRC-01-C0023
    topics: [benched, alpha-decay, open]
    authority: source
  - id: EXT-0226
    type: context
    summary: "DPR and PRS were remembered as alpha-decay-related legacy mechanisms, with PRS possibly meaning Performance Rating System."
    quote: "those things were part of Alpha Decay. So the DPR is, I think, I don't even recall what the full thing is, but PR is like performance rating system."
    cite: SRC-01-C0023
    topics: [dpr, prs, alpha-decay]
    authority: source
  - id: EXT-0227
    type: decision
    summary: "The next step is to document QMF for coding, then build the trading node on the resulting framework."
    quote: "the next session should be actually coding this QMF, the version we have. I think it will be getting it ready to be coded. So we have to first start documenting and whatnot. Then another part I believe we shall use trading, we shall start on the trading node, but it will be using what we have built in this session"
    cite: SRC-01-C0023
    topics: [sequencing, qmf, trading-node]
    authority: source
  - id: EXT-0228
    type: death
    summary: "A graph database is not needed for QMF V1."
    quote: "do we need graphs? No, we don't."
    cite: SRC-01-C0024
    topics: [graph-database, lineage, dead]
    authority: source
  - id: EXT-0229
    type: constraint
    summary: "The project must show concrete progress toward documentation and factory implementation."
    quote: "my problem right now is progress, because I feel like I'm falling behind. Seriously, that's why I preferred you taking over most things."
    cite: SRC-01-C0024
    topics: [progress, process, factory]
    authority: source
  - id: EXT-0230
    type: constraint
    summary: "QMF must be distilled into concrete libraries mapped to the five hats."
    quote: "QMF, remember, has to have libraries, unless I'm wrong. A framework always has libraries. So, which libraries do we have? We need to narrow everything down to the literally the nanometer. And I remember asking or telling you, I don't know if it came out properly, that thing of I thought we, I think we should try so much to distill and separate the framework into what each heart that we suggested earlier is going to use. Okay, I'm meaning the 5 hats"
    cite: SRC-01-C0024
    topics: [qmf, libraries, five-hats]
    authority: source
  - id: EXT-0231
    type: constraint
    summary: "Design for the ninety-fifth-percentile workload, with about forty concurrent Bots as a real case."
    quote: "Design load principle (operator ruling): design for the 95th-percentile load — ~40 concurrent bots is a real scenario, never a toy that breaks at scale."
    cite: SRC-01-C0024
    topics: [scale, bots, performance]
    authority: source
  - id: EXT-0232
    type: decision
    summary: "Multiple demo accounts are expected for different pipeline roles."
    quote: "Multiple demo accounts are expected (one for paper-mode Books, one for post-backtest validation — a pipeline detail for the agentic era)."
    cite: SRC-01-C0025
    topics: [demo-accounts, paper-trading, validation]
    authority: source
  - id: EXT-0233
    type: decision
    summary: "Retain all source history, seal the newest year from research, keep full raw data, and back up nightly to a cloud bucket."
    quote: "keep ALL history as far back as each source goes (12-month seal ≠ 12-month dataset — the seal only excludes the newest year from research until a strategy's one logged final look; RATIFIED); split/chunking discipline is QMF's job by default (he wants help there — splits registry covers it); MIS snapshots and everything else kept RAW in full (storage is his to buy; \"better to have every copy\"); backup to a cloud bucket, nightly"
    cite: SRC-01-C0025
    topics: [data, holdout, backup]
    authority: source
  - id: EXT-0234
    type: death
    summary: "The special paper-simulation-through-news-blackout idea was dropped because ordinary market recorders already continue."
    quote: "the record-through-blackout paper-simulation idea was dropped — ordinary market recording continues anyway because recorders never stop."
    cite: SRC-01-C0025
    topics: [news, paper-simulation, dead]
    authority: source
  - id: EXT-0235
    type: correction
    summary: "The whole agreement is not a minimal core; it is a broad QMF V1 blueprint whose qmf-core is only the small first brick."
    quote: "Is this really a minimal core anymore? Because if I'm to give the documentation agent to the agent that's going to document everything, these two transcripts. The one I gave you are also this one we have just had. Do you really think it's going to be saying this is minimal? Because this seems like we've agreed on a lot of things"
    cite: SRC-01-C0026
    topics: [qmf, minimal-core, correction]
    authority: source
  - id: EXT-0236
    type: death
    summary: "The phrase 'minimal core' was retired as the name of the overall agreement."
    quote: "the phrase \"minimal core\" is RETIRED as a name for this agreement."
    cite: SRC-01-C0027
    topics: [vocabulary, qmf, dead]
    authority: source
  - id: EXT-0237
    type: value
    summary: "The corrected name for the agreement is QMF V1 Blueprint."
    quote: "QMF V1 Blueprint — Handoff for the Documentation Factory"
    cite: SRC-01-C0027
    topics: [qmf, blueprint, vocabulary]
    authority: source
  - id: EXT-0238
    type: constraint
    summary: "A documentation agent should cover the whole blueprint, not restrict itself to qmf-core."
    quote: "A documentation agent must scope to the whole blueprint, not to the first brick alone."
    cite: SRC-01-C0027
    topics: [documentation, qmf, scope]
    authority: source
  - id: EXT-0239
    type: constraint
    summary: "The reconciled spec/tracker were designated later authority, with transcripts treated as raw evidence containing superseded ideas."
    quote: "the two session transcripts are raw evidence BEHIND these documents, never overriding them — where a transcript and this spec disagree, the spec is the later, corrected word."
    cite: SRC-01-C0027
    topics: [authority, transcripts, spec]
    authority: source
  - id: EXT-0240
    type: correction
    summary: "MIS is not a QMF library; it is a core trading-node ML-ensemble component."
    quote: "the MIS that's what I mean okay so I don't think it's it deserves a library I really don't because it's it's if you read about it it's it's just a machine learning ensembler in a way"
    cite: SRC-01-C0028
    topics: [mis, trading-node, qmf]
    authority: source
  - id: EXT-0241
    type: correction
    summary: "Broker connection does not warrant a standalone trader library; it is a small module."
    quote: "trader does it really need an actual library some of these things seem too hard like too simple"
    cite: SRC-01-C0028
    topics: [broker, library, module]
    authority: source
  - id: EXT-0242
    type: decision
    summary: "Risk remains the current Book/BMS design in V1 and must be versioned so later designs can replace it."
    quote: "for now we are using the book management system and the books themselves but i think i think later down the road we sh we might develop a new version so it should be updatable"
    cite: SRC-01-C0028
    topics: [risk, book, bms]
    authority: source
  - id: EXT-0243
    type: decision
    summary: "Researcher tooling and agent tooling are outside the immediate QMF V1 scope."
    quote: "researcher okay that one is out of scope for now then agents also out of scope"
    cite: SRC-01-C0028
    topics: [researcher, agents, scope]
    authority: source
  - id: EXT-0244
    type: decision
    summary: "The final simplified QMF V1 roster is five libraries plus two small modules."
    quote: "QMF V1 is five libraries and two small modules"
    cite: SRC-01-C0028
    topics: [qmf, roster, architecture]
    authority: source
  - id: EXT-0245
    type: value
    summary: "The five QMF V1 libraries are qmf-core, qmf-registry, qmf-data, qmf-indicators, and qmf-structure."
    quote: "The five libraries:"
    cite: SRC-01-C0028
    topics: [qmf, libraries, roster]
    authority: source
  - id: EXT-0246
    type: value
    summary: "The two deliberately non-library modules are the venue module and risk module."
    quote: "Plus: the venue module (cTrader connection — simple, not a library) and the risk module (Books + BMS as designed, v1, updatable)."
    cite: SRC-01-C0028
    topics: [venue, risk, modules]
    authority: source
  - id: EXT-0247
    type: decision
    summary: "The look-ahead test remains in V1 by folding into qmf-registry as a registration gate."
    quote: "the look-ahead test you ratified doesn't vanish, it folds into the registry as a registration gate."
    cite: SRC-01-C0028
    topics: [look-ahead, qmf-registry, gate]
    authority: source
  - id: EXT-0248
    type: decision
    summary: "qmf-registry owns identity, lineage, and registration gates including look-ahead and attempt-count preconditions."
    quote: "`qmf-registry` — identity & lineage: three disciplines (fingerprinted recipes / operator-chartered Books & BMS / occurrences; graph-shaped lineage in append-only files, no database) plus the registration gates: the ratified look-ahead/causality test (K1, with the context-library logic) and the attempt counter run here as registration preconditions."
    cite: SRC-01-C0029
    topics: [qmf-registry, identity, registration]
    authority: source
  - id: EXT-0249
    type: context
    summary: "qmf-data is the six-layer data-system study and still requires a dedicated ratification session."
    quote: "`qmf-data` — the six-layer data system: ingest plumbing, raw evidence archive, processed layer, journal, research door with splits-by-default, backup. STUDY DELIVERED (`reference/09`); ratification = ticket 005 session."
    cite: SRC-01-C0029
    topics: [qmf-data, data-layer, ratification]
    authority: source
  - id: EXT-0250
    type: decision
    summary: "qmf-indicators wraps TA-Lib-class libraries rather than reinventing their arithmetic."
    quote: "`qmf-indicators` — light indicators, wrapping TA-Lib-class libraries (wrap, never reinvent; dual-reference checks per K2)."
    cite: SRC-01-C0029
    topics: [qmf-indicators, ta-lib, dependencies]
    authority: source
  - id: EXT-0251
    type: decision
    summary: "qmf-structure contains QMX-owned causal levels, zones, and market-structure components."
    quote: "`qmf-structure` — our OWN causal levels/zones/market-structure components"
    cite: SRC-01-C0029
    topics: [qmf-structure, levels, market-structure]
    authority: source
  - id: EXT-0252
    type: decision
    summary: "The venue module is a Python cTrader Open API connection with later crypto and stock venues behind the same seam."
    quote: "Venue module — the cTrader Open API connection (simple; Python only, no MQL; crypto/stock venues later through the same seam)."
    cite: SRC-01-C0029
    topics: [venue, ctrader, python]
    authority: source
  - id: EXT-0253
    type: decision
    summary: "The risk module holds versioned Books/BMS, exits, correlation ledger, and money rules and requires a separate deep session."
    quote: "Risk module — Books + BMS machinery as currently designed, v1 and explicitly versioned/updatable (\"later down the road we might develop a new version\"): exits (fast invalidation, dynamic SL/TP), correlation ledger, money rules. Detail = the trading-node/Book session"
    cite: SRC-01-C0029
    topics: [risk, book, trading-node]
    authority: source
  - id: EXT-0254
    type: decision
    summary: "The QML Bot library is excluded from V1 until its Bot-to-Book binding contract is designed."
    quote: "`qml` bot library — vocabulary ratified (confluences, bot careers/variants/lineage) but the bot↔Book binding contract is undesigned; own pass after the node session."
    cite: SRC-01-C0029
    topics: [qml, bot, scope]
    authority: source
  - id: EXT-0255
    type: correction
    summary: "BENCHED is present in GitBook and appears as a door, leash rung, and Bot-state enum."
    quote: "\"benched\" IS in your GitBook — I said it came only from the recovery corpus, and that was wrong. It appears in three places (one of the seven doors, a leash rung, and the bot state list LIVE/PAPER/BENCHED/STOOD_DOWN)."
    cite: SRC-01-C0030
    topics: [benched, gitbook, bot-state]
    authority: source
  - id: EXT-0256
    type: death
    summary: "DPR and PRS are legacy-only mechanisms on do-not-revive lists."
    quote: "DPR and PRS — those are legacy-only, surviving in exactly one old file, and both sit on do-not-revive lists."
    cite: SRC-01-C0030
    topics: [dpr, prs, legacy]
    authority: source
  - id: EXT-0257
    type: value
    summary: "Legacy PRS was a Performance Rating Service producing a zero-to-one-hundred score from six weighted measures and mapping it to three tiers."
    quote: "PRS was a Performance Rating Service (your recall was right): six weighted measures → a 0–100 score → three tiers."
    cite: SRC-01-C0030
    topics: [prs, performance, legacy]
    authority: source
  - id: EXT-0258
    type: value
    summary: "Legacy DPR was a rolling ten-day tier, but the expansion of the initials is unknown and must not be guessed."
    quote: "DPR was the rolling 10-day tier it emitted — and what the letters D-P-R stand for is written down nowhere, so no agent will be allowed to guess it."
    cite: SRC-01-C0030
    topics: [dpr, legacy, vocabulary]
    authority: source
  - id: EXT-0259
    type: value
    summary: "The current baseline benches a Bot after two consecutive stop-outs for the rest of the day and resets it at the next open."
    quote: "two stop-outs in a row benches a bot for the rest of the day, and it auto-resets at the next open."
    cite: SRC-01-C0030
    topics: [benched, stop-out, bot]
    authority: source
  - id: EXT-0260
    type: context
    summary: "A legacy redemption loop let demoted Bots paper trade to regain live status, but it is not revived without a new ruling."
    quote: "The legacy version had a redemption loop (demoted bots kept scoring on paper to win their live seat back) — that idea is worth remembering for the node session, but nothing revives without your word."
    cite: SRC-01-C0030
    topics: [redemption, paper-trading, legacy]
    authority: source
  - id: EXT-0261
    type: open
    summary: "The definition of stop-out, including whether breakeven counts, is missing."
    quote: "nobody ever defined what counts as a \"stop-out\" (does a breakeven close count? — the bench counter can't be built until you rule)"
    cite: SRC-01-C0030
    topics: [stop-out, benched, open]
    authority: source
  - id: EXT-0262
    type: open
    summary: "Symbol B is overloaded between the bench threshold and a seat-sizing divisor."
    quote: "the symbol B does double duty in the old math (bench threshold and a divisor in seat sizing — retuning one silently resizes the other)"
    cite: SRC-01-C0030
    topics: [variables, benched, seat-sizing]
    authority: source
  - id: EXT-0263
    type: open
    summary: "BENCHED currently exists both as a Book mode and a Bot seat state and must be untangled before schema design."
    quote: "\"BENCHED\" currently lives in two places at once (a Book mode and a bot's seat state), which must be untangled before schemas are written"
    cite: SRC-01-C0030
    topics: [benched, book, schema]
    authority: source
  - id: EXT-0264
    type: decision
    summary: "Alpha-decay mathematics is unrecoverable and must be designed fresh."
    quote: "Alpha-decay math is confirmed unrecoverable — two independent sources agree it was never written down. It gets designed fresh, not recovered."
    cite: SRC-01-C0030
    topics: [alpha-decay, recovery, design]
    authority: source
  - id: EXT-0265
    type: decision
    summary: "The sim-live parity checklist was denied as part of Lock 2 and moved into the dedicated backtesting session, while broker connection proceeds separately."
    quote: "The sim≡live parity idea (one shared checklist both the practice venue and the real cTrader connection must pass, written before either implementation) was pitched as \"Lock 2\" and DENIED as bundled — the connection half proceeds separately as simple work; the parity half belongs HERE"
    cite: SRC-01-C0017
    topics: [live-parity, backtesting, broker]
    authority: source
  - id: EXT-0266
    type: constraint
    summary: "Backtesting design must make correct testing the easy path for autonomous agents."
    quote: "agents, not Mubarak, execute backtests, so the design must make the right thing the easy thing for an agent."
    cite: SRC-01-C0017
    topics: [backtesting, agents, usability]
    authority: source
  - id: EXT-0267
    type: decision
    summary: "The operator requested deep dives on Locks 3–5 while keeping the backtesting framework untouched."
    quote: "Especially for decision three to five, then two, I told you, I really don't want to look at the back testing framework."
    cite: SRC-01-C0018
    topics: [five-locks, deep-study, backtesting]
    authority: source
  - id: EXT-0268
    type: constraint
    summary: "The verdict should use proper diagrams because the operator does not want prose blocks."
    quote: "you give me a good verdict with proper diagrams"
    cite: SRC-01-C0018
    topics: [communication, diagrams, operator]
    authority: source
  - id: EXT-0269
    type: constraint
    summary: "The data layer is a major priority deserving extensive investigation."
    quote: "the data layer, I think, is something that we need to look into so much."
    cite: SRC-01-C0018
    topics: [data-layer, priority, research]
    authority: source
  - id: EXT-0270
    type: death
    summary: "Alpha-decay recovery work should stop because its mathematics was never written down."
    quote: "Math confirmed unrecoverable (2026-08-18 dig, two independent sources — never written down): design fresh, don't excavate"
    cite: SRC-01-C0031
    topics: [alpha-decay, recovery, dead]
    authority: source
  - id: EXT-0271
    type: constraint
    summary: "The documentation handoff has no pending QMF-side work and should pass the spec, tracker, studies, and transcripts as evidence."
    quote: "Nothing is pending on my side — export when ready, hand the spec + tracker + reference studies to your documentation skill, and the transcripts ride along as evidence only."
    cite: SRC-01-C0031
    topics: [handoff, documentation, evidence]
    authority: source
  - id: EXT-1001
    type: context
    summary: "QMX is the operator's custom algorithmic-trading platform, with a later ambition to become fully quantitative."
    quote: >-
      what I'm building is a project called QMX. Now, that project is meant to be my own custom quantitative trading platform, I would call it. Okay, it's actually not quantitative, but algorithmic. Later, we shall switch fully to quantitative
    cite: SRC-02-C0001
    topics: [qmx, product-vision, trading]
    authority: source
  - id: EXT-1002
    type: context
    summary: "The initial deployment picture contained a trading node, a debatable backend/middle node, and an agentic node."
    quote: >-
      the second thing was going to be a back-end server. Now, this is very debatable because depending on how we see things, we might not need it or we might. It depends on things, yeah. Then, the third thing would have been the agentic node
    cite: SRC-02-C0001
    topics: [topology, trading-node, backend, agentic-system]
    authority: source
  - id: EXT-1003
    type: decision
    summary: "The trading node owns most live-trading work and must be precise, surgical, and efficient."
    quote: >-
      the trading node handles most of the things that deal with live trading. Alright, so that right there is very crucial. You know, the core concepts need to be precise, surgical, and efficient.
    cite: SRC-02-C0001
    topics: [trading-node, live-trading, quality]
    authority: source
  - id: EXT-1004
    type: context
    summary: "The original middle layer was imagined for persistence and longer-running computation such as synchronization and model training."
    quote: >-
      that middle pass is meant to be like, think of it like a database, I would call it. It handles longer-running tasks, syncing, machine learning, model training, and whatnot.
    cite: SRC-02-C0001
    topics: [backend, data, machine-learning, topology]
    authority: source
  - id: EXT-1005
    type: context
    summary: "QML began as an internal bot library and QMA was floated as a future agent-oriented counterpart."
    quote: >-
      QML, which is the quant mind library. Okay, now I don't know if we can have, I don't know if they are called modules, yeah, so small sort of features that form up the library. So, for at first, QML was made for only you know bots like the trading bots. However, it has occurred to me that we might also need something called I'm calling it QMA
    cite: SRC-02-C0001
    topics: [qml, qma, bots, agentic-system]
    authority: source
  - id: EXT-1006
    type: open
    summary: "At the start of the session, whether the node or QML should be designed first was unresolved."
    quote: >-
      Are we first building the agents? Sorry, are we first building the library? Not the agents, but the library, are we first building the node? What do you propose?
    cite: SRC-02-C0001
    topics: [build-order, qml, trading-node]
    authority: source
  - id: EXT-1007
    type: correction
    summary: "The old QMX version and recovery material are evidence only and must not become the foundation of the restart."
    quote: >-
      What you are seeing in the old version of QMX, please don't take it as core. Okay, what we did with GPT was try to recover and whatnot, but don't take it as something core for you to build this new system on top of. Otherwise, you'll poison the entire state
    cite: SRC-02-C0002
    topics: [source-authority, clean-start, legacy]
    authority: source
  - id: EXT-1008
    type: decision
    summary: "The new project is a deliberate clean restart away from the previous design state."
    quote: >-
      The whole reason of me restarting this is because I want to run away from the other poisonous thing
    cite: SRC-02-C0002
    topics: [clean-start, legacy, project-reset]
    authority: source
  - id: EXT-1009
    type: context
    summary: "The trading-node domain includes MIS, SQS, news, kill switch, Books, BMS, and bots."
    quote: >-
      the node we have the MIS, we have SQS, we have the news, the kill switch and whatnot, we have the book, the BMS. Well, the books rather, the BMS and the bots.
    cite: SRC-02-C0002
    topics: [trading-node, mis, sqs, books, bms, bots]
    authority: source
  - id: EXT-1010
    type: decision
    summary: "QML's purpose is to give coding agents a uniform, constrained way to author bots instead of unconstrained generic Python."
    quote: >-
      bots we wanted to provide one uniform way for agents because agents were mostly the ones going to be coding this thing out. So, in other words, instead of using Python and making everything too generic, which later down the road can cause issues
    cite: SRC-02-C0002
    topics: [qml, agents, authoring-surface, uniformity]
    authority: source
  - id: EXT-1011
    type: decision
    summary: "Reusable internal components such as market engines, data tools, and indicators are a primary reason for the framework."
    quote: >-
      wanted to have reusable components inbuilt in-house. We wanted to have, for example, what I'm trying to say by usable components. For example, if we manage to build like certain market engines or certain data, stuff like that, okay, or certain indicators. We would like them to be reusable across.
    cite: SRC-02-C0002
    topics: [qml, reuse, market-data, indicators]
    authority: source
  - id: EXT-1012
    type: constraint
    summary: "The design order must avoid building the node in a way that will later require a framework-driven rewrite."
    quote: >-
      I feel like certain things will have to be rebuilt with the library
    cite: SRC-02-C0002
    topics: [build-order, rebuild-risk, qml]
    authority: source
  - id: EXT-1013
    type: decision
    summary: "cTrader is the initial broker platform."
    quote: >-
      for the broker, yes, for now, we shall use C trader.
    cite: SRC-02-C0003
    topics: [broker, ctrader, venue]
    authority: source
  - id: EXT-1014
    type: constraint
    summary: "The operator prefers pure Python where cTrader permits it."
    quote: >-
      I would prefer at times using pure Python, which by the way, C Trader does allow
    cite: SRC-02-C0003
    topics: [python, ctrader, implementation]
    authority: source
  - id: EXT-1015
    type: decision
    summary: "The recurring delivery workflow is transcript and accepted artifacts to documentation factory, then Kanban, software factory, and later review."
    quote: >-
      I will export the transcript together with the artifacts for that session. Then we parse them to the documentation factory skill. Then, after documentation factory works its magic, we pass it to the Kanban skill, which just updates the Kanban for the factory. And the factory, the software factory, does the shipping. And we shall do review down the road
    cite: SRC-02-C0003
