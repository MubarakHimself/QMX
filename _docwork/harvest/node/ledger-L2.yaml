ledger:
  - id: DEC-0199
    title: "Time discipline at the live boundary (TN-14)"
    statement: "[ADOPTED] The node adopts in full the time-audit obligations of the ratified operations runbook table (runbook.md:107-116) and ratifies them by adoption rather than minting new law. The VPS operating-system clock is the sole stamper of QMX-owned event times: chrony runs with four or more sources (iburst, makestep boot-only, NTS where offered), installed by provisioning on Ubuntu 24.04 and only VERIFIED rather than installed on 26.04 where chrony is the default; RTC in UTC, system zone UTC, TZ=UTC; no local time is ever stored as an evidence timestamp, key or comparison, while AD-8 civil-time bucket keys stay legal as identity-bearing derivations of an instant plus a declared zone and tzdata version, used for seasonality, session-of-day statistics and AD-39 session-window conditioning and never as timestamps or causality proxies. No trade before sync: preflight waits on chronyc waitsync, the clock slews only while live, a step happens only with the node stopped and is detected by a wall-versus-monotonic divergence detector that marks a suspect window, and every unsynchronized, stepped or paused window - a VPS live migration included - mints an explicit data-gap record plus a no-entry window. Two measurements are named apart and never merged: machine-versus-truth (chrony offset, stratum, sync-age, step counter) and node-versus-broker SKEW (a rolling per-venue local_receive minus source series, windowed minimum), never auto-corrected and never called latency. FOUR BANDS ok | warn | no-new-entry | halt are evaluated as a per-decision-cycle PRECONDITION and never as a standing CT-30 action, so no band ever needs de-escalating and none can be confused with a control the operator must resume; effects are entry-side only per L39, no-new-entry refusing place_order and risk-increasing amends for that cycle and nothing else while halt enters the node stand-down lifecycle state that only an operator resurrect leaves; exceeding a band is a typed refusal plus a journal record plus a node state change, never silent, a no-new-entry band pushes on the silent-degradation alert class in live as well as during the soak, and unsynchronized (no source for N minutes) is a distinct state from measured drift. Four registry rows are minted configurable - clock_drift_warn, clock_drift_no_new_entry, clock_drift_halt and clock_unsynchronized_after - whose band numbers are EVIDENCE VALUES recorded from the time audit and sized for roughly one-second decisions, never ratified constants (L38); the leap-second posture is no smearing sources, step-with-slew per the chrony default, one policy on all machines. Three calendar kinds stay named apart - market-hours, day-boundary and news (DEC-0106) - with calendar identity riding in-band on every TradingDate, one pinned tzdata version verified at import and the TZPATH forcing proven once on the Linux VPS, the venue D1 boundary measured per broker into a venue-scoped market-hours calendar identity, broker schedule and holiday axes stored verbatim, and a session calendar never a fixed offset from broker server time."
    status: ratified
    rationale: "Adopted rather than invented: the obligations already stand in the ratified runbook table, so the node ratifies them by adoption and adds only the band mechanism, its four registry rows and the calendar-identity discipline. The rule rests on A20 - the clock-band evidence values as starting defaults and the leap-second posture - which is proceed-on-recommendation, not ruled by the operator, and on adjudication correction 8, which fixes the band numbers as RECONFIRM evidence from time-audit-devops.md:9 and never as constants. Amended at the gates: memlog line 46 (3) made the no-new-entry band a per-decision-cycle precondition rather than a standing CT-30 action and made node stand-down a lifecycle state left only by an operator resurrect, and memlog line 46 (6) fixed every node-raised block as entry-side only; memlog line 51 (20) tagged the four clock rows blocks-role-live plus blocks-soak, and line 51 (22) put value-status on the resolved config artifact, so a provisional band value needs an operator countersign carrying its evidence citation before live money."
    sources: [EXT-2110]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-14, time, clock, adopted]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-14"

  - id: DEC-0200
    title: "Observability: logs, metrics, health, alerts (TN-15)"
    statement: "AD-14 made concrete, and LOGS ARE NOT JOURNALS. Operator logs are stdlib logging with a JSON-lines formatter to stdout captured by journald - retention and rotation set by provisioning as a SystemMaxUse cap plus a configurable retention window whose length is an evidence value - carrying ts in UTC ISO-8601 with an explicit Z at millisecond precision, level, logger, event, correlation_id propagated across every boundary, boot_epoch, composition_fp and typed-refusal fields (category, retryability, after-condition, reference ids only, never a secret value), at the stdlib five levels with a typed refusal at WARNING, an alarm at ERROR and stand-down or halt at CRITICAL, while journals stay CT-13 evidence in the journal room and are never written through the logger. Metrics use prometheus_client as registry and exposition format ONLY - the node's own door serves /metrics on the localhost endpoint and no library-spawned server thread exists - exporting families named at implementation under a qmn_ prefix whose labels never carry secrets or account numbers beyond opaque ids: clock, session, command streams, reconciliation, protection (KSA level per enforcement scope, the scope carried as a label), the six AD-13 latency rungs as monotonic histograms with no budgets until baselines exist, data, backup and process. The legacy five Records streams survive as CT-25 PROJECTION NAMES ONLY over AD-21's seven journal event types through CT-25's one versioned mapping table - veto_ledger = decision events with outcome refused-by-door, trade_journal = order and fill events joined through the command record's content fingerprint, book_journal = the entity projection over decision, risk transition and control action selected by Book identity, ksa_audit_log = control action events of the protection-authority class plus their suppressed subtype, correlation_ledger = the enacts edge set linking enactment to intent - each a read and never a writer, and the position and balance read-backs join that same table as CT-20 observation kinds rather than as an eighth journal type. Every component's health() aggregates into a /health read model of INDEPENDENT states (safety, execution readiness, connection, reconciliation, data freshness, lifecycle, sync) and never one colour, requested protection state shown apart from enforced, each state carrying its own per-read provenance - authority source live-authoritative or replicated-evidence, source time, receive time and watermark. The closed allow-list is the ONLY push tier and it has THREE CLASSES: money boundaries (sweep, re-seed, refund, refund dormant in V1); protection escalation (kill switch and KSA escalation, supervision fail-closed, node stand-down, plus the named state alarms - rotation store failure, unmapped venue code, reused command identity, undeliverable protection intent, fold-cannot-resolve, missing scope record, paper-stream outage at live severity); and SILENT DEGRADATION, the node having stopped accepting entries or being unable to persist evidence for a reason that is not a KSA escalation, enumerated as a clock band at no-new-entry or worse, an unexplained live-drift entry stand-down on any binding, a failed news-calendar refresh, a degraded or dead canonical sensing feed, a failed nightly backup or sample restore or full restore or host-loss rehearsal, disk headroom below disk_headroom_min, and a live first-connection or data-quality verification failure; everything else is console evidence. FAILURES.md's notification tier column is the SOLE HOME of alert-class membership and the allow-list is GENERATED from it, so no registry row carries membership and a failure mode with no register entry cannot be alerted; one push channel runs through a NotificationChannel port with a generic HTTPS-webhook implementation plus console and file sinks, the operations toolkit's just node-notify-test recipe delivers a synthetic alert end-to-end through the powers channel, records and delivery stay two planes (an alert is evidence, not permission), and an external DEAD-MAN'S SWITCH heartbeats on a declared cadence to an off-VPS watcher that alerts on a MISSING ping, with a liveness digest that survives go-live and a clock-band alert that does NOT switch off at go-live. The observability stack, ruled mandatory by the operator through the unattended soak and after it, is a SEPARATE ZERO-AUTHORITY SYSTEM of Prometheus, Grafana and Loki/Promtail class shipped as a compose file under qmn/deploy/observability/: it consumes the node's exported metrics and JSON logs and can never write to the node, hold a credential the node holds, or appear on any decision, command or evidence path, so losing it loses visibility and nothing else; containers are permitted for THIS STACK ONLY while the node stays a plain systemd service; it runs under its own unit qmx-observability.service on a distinct non-qmx service account, stores under /var/lib/qmx-observability as a named line item of vps_disk_budget with its own retention caps and its own filesystem quota, runs network_mode host with every container port bound to loopback and scrapes the /metrics path only, reads the node's log stream through a dedicated read-only journal namespace rather than the system journal, and holds its own credentials as the DECLARED FOURTH secret holder. Skylos's IaC scan gates the checked-in compose file, its image versions are pinned at the implementation gate and registered as external tools in DEPENDENCIES.md rather than floating, the node's own half is the /metrics exposition, the JSON-lines log stream and versioned dashboard-as-code seeds, the node runs and passes with the stack stopped, and a dedicated monitoring agent consuming the stack later is explicitly out of scope."
    status: ratified
    rationale: "AD-14 is the parent law; this rule only makes it concrete and closes the three homes that could otherwise drift - the log/journal split, the alert allow-list's single source, and the stack's footprint. It rests on A21 (stdlib logging over structlog, prometheus_client, a webhook channel, the soak alert profile), A35 (an external dead-man's switch as a required V1 component, against the otherwise no-required-external-stack posture) and A42 (the stack as its own unit under a distinct account, with its own storage, quota, host-network binding, journal namespace and fourth secret holder) - all proceed-on-recommendation - and it is downstream of A10, RULED by the operator on 2026-08-28: because the soak is a full unattended week, tracking became mandatory and the stack entered the spine. Amended at the gates: memlog line 46 (18) minted the third alert class, the external dead-man's switch and the liveness digest; memlog line 48 (Q2) and line 49 turned the pre-ruling 'Prometheus/Grafana-class stacks are optional zero-authority consumers' into a mandatory separate system with compose file, exporters and dashboard seeds; line 51 (13) fixed its unit, account, storage quota, loopback binding, journal namespace and fourth-holder status; line 51 (10) replaced the single reconciliation residual with two reported separately; line 51 (24) made the KSA level a per-enforcement-scope label; line 51 (21) routed an UNDELIVERABLE protection intent onto the silent-degradation class; and line 51 (34) made FAILURES.md's notification tier column the sole home, withdrawing the proposed registry membership row. The memlog's pre-ruling soak profile - two soak-only alerts switching off at go-live - is superseded: the clock-band alert is a permanent member of class 3."
    sources: [EXT-2111, EXT-2123]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-15, observability, alerts, metrics, logging]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-15"

  - id: DEC-0201
    title: "Deployment, supervision shape, CI matrix, rollback, hardening (TN-16)"
    statement: "The node runs as a plain systemd service on Ubuntu 24.04 LTS x86-64 - systemd 255.4, so systemd-creds is available and it matches the ubuntu-24.04 CI runner, with 26.04 LTS the planned upgrade at the first maintenance window - and never as a container: no Docker requirement stands and systemd credentials are the secret path (NFR-10). ONE canonical checkout is materialized as IMMUTABLE PER-COMMIT TREES: /opt/qmx is a canonical root holding one immutable tree per commit plus a current symlink, each tree a git clone at its pinned commit with uv-managed CPython 3.14 and uv sync --frozen already applied and nothing built or published elsewhere; uv sync --frozen never writes into a tree a running node resolved from, old trees are pruned to a declared depth that is a named line item of vps_disk_budget so a rollback needs no network, and the pre-qmn bootstrap is a declared day-one stand-alone script - install uv, provision CPython, install just at its pinned version, install and pin the container runtime the separate observability stack needs, and clone at the pinned commit into the first tree - run before qmn exists and before any just node-... recipe can be called. Installing qmn on the workstation is for the provisioning wizard and the Python API only and is ENFORCED: the composition root refuses to compose off the roster's VPS machine tuple, the SecretStore refuses a venue-session holder off that host, a tier-1 check proves the wizard module imports neither the connection manager nor the refresh duty, and a tier-1 check proves the packaging declares no console-script entry point and no publishable target, so the VPS trees stay the only runtime installation. Unit files are CHECKED IN under qmn/deploy/systemd/ as FIVE node units - qmn.service, qmn-news-calendar timer and service, qmn-backup timer and service, qmn-restore-sample timer and service (nightly) and qmn-restore-full timer and service (monthly) - with qmx-observability.service a SIXTH checked-in unit that is not one of the node's, and hardening is reconciled with the storage topology rather than asserted beside it: a fixed User=qmx service account for all five node units rather than DynamicUser, ProtectSystem=strict with ReadWritePaths=/var/lib/qmx and every writable tree pre-created and owned by qmx, RuntimeDirectory creating /run/qmn for the powers socket, LogsDirectory, NoNewPrivileges, PrivateTmp, ProtectHome, RestrictAddressFamilies limited to AF_UNIX plus AF_INET plus AF_INET6, LoadCredentialEncrypted per unit for that unit's credentials only, Restart=on-failure with RestartForceExitStatus=75 and SuccessExitStatus=75 so a requested restart at a safe point actually restarts and is never counted as a failure, RestartSec, StartLimitBurst strictly greater than the crash-loop K with StartLimitIntervalSec at least T, and TimeoutStopSec and WatchdogSec RENDERED into the unit file from the resolved config artifact's drain_window and watchdog_interval by just node-install rather than hand-authored, so a config change and a unit file can never disagree. Install and upgrade run from the OPERATIONS TOOLKIT and never from a product command line: just node-install runs an idempotent script in the checkout (chrony, the qmx account and the stack's distinct account, tree creation and ownership including /var/lib/qmx-observability and its quota, rendered unit files, credstore layout, journald limits and the stack's read-only journal namespace, the pinned container runtime and the compose file); just node-switch <commit> MATERIALIZES A NEW TREE BESIDE THE OLD - preflight, backup-first, clone plus uv sync --frozen into the new tree, a dry-run boot in check mode against that tree, then an atomic flip of the current symlink as part of a drain-aware restart at a safe point, then a prune to the declared depth - minting a DEPLOYMENT RECORD on the same version graph as the config carrying both the commit and the config version, the dry-run validating that exact pair; and just node-rollback is the same symlink flip onto the previous retained tree and its config pair with no network. None of these is a trading control, and migrations follow AD-20 only (preflight, backup, dry-run, migrate, verify) and never in place. Check mode is defined rather than implied - it runs the doors, the config compile, the fingerprint, the seal and every preflight gate needing no venue and no credential, SKIPS credential-presence, store-reachability, chronyc waitsync and venue connect, exits non-zero on any refusal and never opens a sequencer - and because that is a different path from a real boot, the soak gate additionally requires one boot under the real systemd unit with LoadCredentialEncrypted from a scratch credstore. ONE ENVIRONMENT is a decision with its compensating controls named - there is no staging host, and an upgrade is validated by the CI clean-install boot, the check-mode dry run on the production host, a TN-21 replay diff of a recorded day and the just node-rollback flip - while VPS hardening is SSH key-only with no password plus the separate restricted provisioning identity and the separate confined inbox-write identity, ufw default-deny inbound except SSH, a stated egress allow-list (venue hosts, the notification and dead-man's-switch endpoints, the object-storage bucket, the history and news-calendar providers, the distribution index, the observability stack's image registry or a vendored image source, and NTP), no public port ever with the doors localhost- and socket-bound and reached over an SSH tunnel, and unattended security upgrades with NO automatic reboot and configured never to restart qmn.service. The CI matrix keeps tier-1 Windows 11 plus Ubuntu LTS and closes the now-stale clean-install deferral by adding a Linux lane pinned ubuntu-24.04, never latest, that re-runs the type gate with pythonPlatform Linux, runs the tier-2 isolated-install smoke plus a clean-install boot-in-check-mode of the node and scans the unit files, with tier 3 check-release gaining the both-OS smoke; the nightly mutation job targets the branch that carries code and a zero-mutants-classified run FAILS CLOSED and alarms rather than passing vacuously; benchmark baselines are recorded on the VPS's declared OS and CPU-class tuple with the CI lane running the harness for correctness only; and the 26.04 upgrade carries two behavioural deltas rather than a version bump - chrony becomes the default so provisioning verifies rather than installs, and the CI pin holds at ubuntu-24.04 until ubuntu-26.04 leaves runner preview."
    status: ratified
    rationale: "NFR-10's one-canonical-checkout, no-DB-server, no-container-requirement claim and ADR-0012's tier structure are the parent bindings; this rule makes them a repeatable deployment with a rollback that needs no archaeology. It rests on A22 (systemd rather than a container, Ubuntu 24.04, the Linux lane pinned to ubuntu-24.04), A31 (a fixed qmx service account rather than DynamicUser, every writable tree under /var/lib/qmx) and A41 (immutable per-commit trees plus an atomically flipped current symlink, pruned to a declared depth) - all proceed-on-recommendation - and it inherits A42's stack footprint for the sixth unit and the container runtime. Amended at the gates: memlog line 46 (12) replaced the memlog's DynamicUser=yes plus StateDirectory=qmn with the fixed User=qmx account and the named /var/lib/qmx trees and pinned systemd-creds encrypt --with-key=host; memlog line 48 (Q1) and line 49 deleted the node command line, so the memlog's qmn deploy install and qmn deploy switch <commit> text is SUPERSEDED - install, switch and rollback are just node-... recipes of the operations toolkit, DevOps tooling and never a trading control; memlog line 51 (12) replaced the single mutable checkout with immutable per-commit trees, the atomic symlink flip and the deployment record carrying commit plus config version; line 51 (16) renamed the timers and split the restore drill into a nightly sample and a monthly full timer, restating the unit count; line 51 (18) made the workstation-only installation enforced by four named checks; line 51 (28) made TimeoutStopSec and WatchdogSec rendered from the config artifact; line 51 (29) pinned just and defined the bootstrap script; and line 51 (13) added the stack's distinct account, its quota and the image registry to the egress allow-list. Memlog line 46 (11) supplies the supervision mechanics the unit file encodes (StartLimitBurst greater than K, StartLimitIntervalSec at least T, TimeoutStopSec at least the drain window) and line 51 (5) the exit-75 requested-restart contract."
    sources: [EXT-2112, EXT-2124]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-16, deployment, systemd, ci, rollback, hardening]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-16"

  - id: DEC-0202
    title: "Doors: library first, three thin doors, no command line (TN-17)"
    statement: "DEC-0159's shape is copied onto the node: every node capability exists ONCE as a pure library function, doors carry only adaptation - parsing, transport, refusal rendering - and a tier-2 door-parity contract test binds them, with parity scoped because the doors are deliberately unequal (every capability the HTTP and socket doors expose is the same library function the Python API exposes with the same refusals, not that all doors expose the same set). THE NODE HAS NO COMMAND LINE, ruled by the operator on 2026-08-28: the desktop UI is the operator's control surface - killing, status, resolving a stuck order, promotion and activation are UI actions - consuming the doors in-process where co-located and over an SSH TUNNEL to the localhost-bound channels once it runs on the workstation, with the node one surface inside that UI, and the priority stated as back end, data and DevOps first. THE FIRST DOOR is the PYTHON API, in-process: the desktop backend consumes it where co-located and the operations toolkit's scripts import it rather than shelling anywhere. THE SECOND DOOR is the LOCALHOST HTTP EVIDENCE CHANNEL, HTTP/JSON on localhost, publish-never-act, authority-free, returning refusals as evidence and budgeted by the evidence_channel_budget registry row, with no authentication beyond the loopback binding - accepted because the VPS is single-tenant and the channel cannot act - serving status and health, journal projections including the five named CT-25 projections, reconciliation status and the two residuals (quantity and cash), the outstanding UNKNOWN set with per-command read-back detail, standing intents, KSA level, Book modes, binding states, seat states, drift components, backup and drill status and /metrics, every read model carrying per-state provenance as REQUIRED fields (authority source live-authoritative or replicated-evidence, source time, receive time, watermark) and any entity projection spanning roles being a DECLARED AD-31 cross-role read with role carried on every projected row. THE THIRD DOOR is the POWERS ACTION CHANNEL, a unix domain socket at /run/qmn/powers.sock owned qmx:qmxops at mode 0660 created by the unit's RuntimeDirectory, where SO_PEERCRED reads the peer credential from the transport and records it beside the claimed signer on every powers journal record: TWO peer principals are declared by uid in the resolved config artifact and NEITHER is the qmx service account - the operator principal, which may call every power, and the ops principal, which may call only notify_test, restore_drill_run, config_validate, hub_publish and the evidence reads - every trading, protection, promotion, activation, settings-edit, resurrect, attestation and countersign power being refused for the ops principal BY THE TRANSPORT and journaled, preflight refusing to boot if any systemd unit on the host declares an operator-principal uid, a call from neither principal refused outright, and the limit stated honestly: SO_PEERCRED proves an ACCOUNT, not a human, a named residual risk rather than a proof. The powers list is CLOSED and exhaustive - resurrect from node stand-down; resume and de-escalate naming the KSA scope reopened; operator-attested resolve_unknown; flatten at any scope; manual kill-switch escalation; paper flip; paper-epoch reset; promotion sign and activation as its own act; config_version_activate; seat_reinstate as the only exit from quarantined; restore_drill_run, which triggers the host-loss rehearsal; hub_publish, refusing sandbox provenance at publish as well as at pull; config_validate; the state_carry declaration with its carries-ledger and continues-performance signatures; the value-status countersign; the sealed period's one logged final look; a settings edit that mints a new config version and schedules a restart at a safe point; the notify test; and a secrets is_set check - and the value-status countersign is REFUSED unless the call carries the variable's evidence citation by fp1, with no bulk countersign of more than one variable per call. Every powers call is server-side revalidated against fresh state at click time, idempotent by artifact key, journaled as a control action, promotion or transition carrying the human signer identity and the plain-words summary AD-18 declares an identity field, and enactable in stand-down rather than merely answerable; requested is shown apart from enforced, no stale evidence authorizes and no generic LIVE/PAPER toggle exists; transport is stdlib-first (an asyncio-served minimal HTTP/1.1 with JSON for evidence, a stdlib AF_UNIX stream socket for powers, any HTTP library entering only through the AD-6 register), remote access is an SSH tunnel only, and ONE versioned wire vocabulary spans both channels, aligning with the QMA daemon-to-UI wire-contract conventions once the QMA spine fixes them as an obligation on the node and never an import. The OPERATIONS TOOLKIT uses THESE DOORS and no other path, as the OPS PRINCIPAL, and no recipe ever constructs a composition root or imports the Python API in a process other than the node's; config authoring is a toolkit affordance over the same library functions (just node-config-init, just node-config-validate, just node-config-explain) rather than a door capability; settings scopes render from the config artifact's flags with a non-configurable value read-only, a null rendering as unresolved and never as an editable default, a blank or provisional-evidence value rendering as such and never as a settled setting, and a cycle-fixed value such as the kill line taking effect at the next open of the binding's accounting period, with a settings edit rendering its admission_impact consequence before the click; every operator moment already carries its read model and its power so the later UI sitting walks stories rather than inventing them; and the agent/MCP door is NOT built this phase, so nothing an agent can reach exists on the node in V1."
    status: ratified
    rationale: "DEC-0159's library-first, thin-door shape and B-1 are the parent bindings; the node copies them and adds the principal model that makes L17 and TN-20's agent-signer refusal enforceable rather than asserted. A1 is RULED and NARROWED by the operator on 2026-08-28 - no operator command line at all, qmn surviving as the package and import CODE NAME only because the operator declined to name the product ('that question is not for this layer'), a rename being mechanical - and A23's command-line half is ruled away with it, leaving the localhost door and the no-agent-door posture as proceed-on-recommendation. The rule also rests on A32 (SO_PEERCRED over a unix socket rather than a per-operator signing key held off-node, proving an account and not a human), A39 (the wire vocabulary aligning with the QMA conventions once that spine fixes them) and A40 (two declared peer principals by uid, neither the qmx service account) - all proceed-on-recommendation. The memlog's TN-17 entry is SUPERSEDED HISTORY where it names 'Door 2: the qmn CLI (click, the same pin as qmb)' and a Door 3 carrying two channels: memlog line 48 (Q1) deleted the typed door and line 49 restated the doors as Python API plus localhost HTTP evidence channel plus unix-socket powers channel, with deployment and provisioning becoming just node-... recipes. Amended further by memlog line 46 (19), which moved powers onto a unix socket with SO_PEERCRED while the evidence channel stayed localhost HTTP; line 46 (6), entry-side-only blocks with operator protective commands always passing in stand-down; line 46 (8), config as eligibility and identity only, which is what the settings scopes render; line 51 (11), the socket path, ownership, mode, two principals, the transport-level refusals, the preflight uid assertion and the closed list's additions (restore_drill_run, config_version_activate, seat_reinstate, hub_publish); and line 51 (22), the countersign's evidence citation by fp1, one variable per call."
    sources: [EXT-2113, EXT-2122]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-17, doors, powers-channel, evidence-channel, no-command-line]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-17"

  - id: DEC-0203
    title: "The config surface: UI-editable by design (TN-18)"
    statement: "ONE resolved node-config artifact per boot epoch, JSON-Schema-class under AD-30's template discipline: every number an exact rational or scaled integer with a unit-kind, every variable flagged ui-editable or uneditable with its admission_impact, an integer format version, fp1 identity and AD-10 identity-versus-display field classification. It is compiled from FOUR explicit layers in fixed precedence and disjoint key namespaces - the deployment roster (account bindings, credential references, VenueClientPort selection, machine tuple), then the BMS fragment, then the Book fragment, then node defaults - and THERE IS NO INVOCATION LAYER: B-3's top layer is the qmb command line's flags, the node has no command line and no runtime override path, and inheriting the layer would leave a builder to invent one that would become the highest-precedence, lowest-visibility source of money-path values above the roster and outside the powers-channel edit flow, so the layer is deleted; a collision is a compile-time refusal, BMS outranks Book in any sanctioned overlap, and the BMS and Book fragments are GENERATED, schema-validated, fingerprinted DERIVED artifacts carrying AD-16 lineage edges back to their source definitions and are never free-hand-edited. THE PARTITION RULE: the resolved artifact declares ELIGIBILITY AND IDENTITY ONLY and never carries runtime state - Book mode, binding state, seat state, standing intents, KSA level, bench counts, exposure and budgets are exclusively read-time folds over append-only records and the compiler REFUSES any layer that supplies one - so a paper flip, an activation, a benching and a kill-line stand-down mint records rather than config versions, a restart never changes a runtime state, and the composition can be sealed without freezing anything the operator can change while the node runs. THE VALUE-HOME RULE: docs/registry/variables.yaml declares a variable's SCHEMA and nothing else - unit-kind, ui-editable or uneditable flag, owner scope, admission_impact, the new value_status_required field, and recorded evidence values that are never resolved values - while the resolved node-config artifact is the SOLE HOME of a resolved value and of that value's value-status; the compiler refuses any key with no registry declaration and refuses to read a value from the registry, and every node-minted variable carries configurable: true where it is UI-editable, with its unit-kind and owner scope (L38). VALUE-STATUS is minted here because the PRD names the gap by hand: every resolved value carries value-status in blank | provisional-evidence | ratified on its config-artifact row, Book-declared values included with the compiler propagating the status onto the generated fragment, and a provisional-evidence value that gates live money BLOCKS role = live bindings exactly as a blank does until an operator countersign through the powers channel flips it to ratified - a countersign minting a new config version, journaled, refused without the variable's evidence citation by fp1, one variable per call - with TN-20's battery checking value-status = ratified rather than merely non-blank. ADMISSION_IMPACT IS ENFORCED, not merely declared: the compiler derives a config version's impact from the registry rows its diff touches and stamps it on the version, and a diff touching any resign variable - charter, money_rules, admission_bar, required_venue_capabilities - makes the resulting binding INADMISSIBLE to role = live until a fresh AD-32 Layer 2 demo shakedown and Layer 3 operator signature complete, while a relint diff re-runs Layer 1 at compile and none needs neither. BLANKS PARTITION INTO THREE EFFECTS and every mint-table row is TAGGED with the one it carries: blocks-boot, where a declared mechanism cannot run at all without the value so the node refuses to compose (submission_deadline, accumulator_bound, max_slice_latency, local_queue_bound, the crash-loop K and T, drain_window, watchdog_interval); blocks-role-live, a money gate blocking live bindings only while paper runs; and blocks-soak, a GENERATED rule rather than a list - every variable named by any TN-23 checklist item is soak-blocking, must hold at least provisional-evidence in the pre-soak config version, and the soak gate REFUSES TO START otherwise - with the do-not-default roster left BLANK until ruled (the submission deadline, the reconciliation lookback and cadence, the pacing and backoff cadence, the local-queue bound, the protective reserve capacity, max_slice_latency, accumulator_bound, drain_window, watchdog_interval, pool and health constants, ksa_effect_matrix, window widths, decision_freshness_bound, the clock bands, the crash-loop K and T, the backup numerics, disk_headroom_min, hot_room_retention_window, the seat-callback deadline, news_calendar_refresh_cadence, news_calendar_max_staleness, evidence_channel_budget and the governor CPU and memory budgets) while holdout_months is explicitly NOT on that list, being a corpus-ratified inherited value the node neither mints nor leaves blank. EXTENSIBILITY IS A REQUIREMENT and it is a CONFIG requirement: adding a Book, a BMS, a bot or a NEW VERSION of any of them is a registry mint plus a roster-config change plus a restart at a safe point and never code, the partition rule being what makes that safe; and versioning is AD-30's git logic - an edit through the powers channel or an authoring recipe mints a new config version on a branches-from graph with a dated current pointer, every version stays readable forever, a change takes effect at the next boot epoch through a restart at a safe point, and a config version whose diff touches a Book- or BMS-identity-bearing field mints a new AD-29 BINDING and therefore must collect a state_carry declaration per counter (ledger, cycle, budget, bench_counter, exposure, each carry or reset) plus a human-signed carries-ledger edge for any carry, refusing as invalid input if absent."
    status: ratified
    rationale: "AD-30's template discipline, B-3's one-resolved-config with fixed layer precedence, L38's configurable-means-UI-editable and the PRD console spine's provisional-value countersign are the parent bindings; this rule makes the artifact's homes disjoint so a hidden constant, a second reading of one setting, and a UI that cannot tell what it may change are all impossible. It rests on A24 (no hot-apply of settings in V1), A34 (value-status as a per-value field on the config artifact with value_status_required as the registry's schema half, rather than a registry field or the blank-versus-filled split) and A45 (the three-way blank partition tagged per mint-table row, with blocks-soak generated from the TN-23 checklist) - all proceed-on-recommendation - and inherits A4's no-hot-reload, restart-at-a-safe-point posture. Amended at the gates: memlog line 46 (8) fixed config as ELIGIBILITY AND IDENTITY ONLY with the registry declaring schema only and the artifact the sole home of resolved values, and line 46 (16) minted value-status with the pre-SOAK ruling that everything the checklist exercises holds at least a provisional value; memlog line 51 (30) DELETED the invocation layer, so the memlog's five-layer precedence 'invocation > deployment roster > BMS fragment > Book fragment > node defaults' is superseded; line 51 (20) replaced the memlog's single blank effect with the three-way partition; line 51 (22) put value-status on the artifact for every value including Book-declared ones and added the evidence-citation predicate; line 48 (c) and line 49 wrote the extensibility requirement in as an operator ruling; and because the node has no command line (line 48 Q1), the memlog's 'an edit (CLI or powers channel)' is superseded - edits arrive through the powers channel or the toolkit's authoring recipes only."
    sources: [EXT-2114]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-18, config, registry, value-status, extensibility]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-18"

  - id: DEC-0204
    title: "Bot seats, runtime-protocol hosting, and the MIS seam (TN-19)"
    statement: "The node hosts QL-7 seats: a factory per seat is constructed with the declaration, the canonical assignment and injected ReadSurfaces over the declared footprint only, driven per evaluation instant by the loop's mint_intents hook and returning zero-or-more CT-23 intents, an entry intent carrying the bot's optional advisory_stop_proposal alongside its advisory proposed_r - both advisory, neither sizing - which the Book door may adopt under the ratified adopt-the-bot's-advisory-stop module mode; look-ahead is refused by the surface, and bot state lives under the BotStateScope tuple with the OS injected and world a component of that scope, snapshotted at a configurable slice cadence and restored only within the same tuple. THE SEAT-CALLBACK FAILURE CONTRACT holds the line because admitted bot code runs in-process on the loop's only domain thread while OS-level confinement is deferred: every callback runs under a per-callback seat_callback_deadline enforced by the slice driver through the CancelToken at slice boundaries and a seat_memory_ceiling enforced by LimitProbe, and a deadline breach, a raised exception or a memory-ceiling breach is a typed refusal plus automatic SEAT QUARANTINE journaled as a seat-state transition, never a stream failure and never a node restart, with leaving quarantined being the operator-signed seat_reinstate power alone - never inferred from a restart, a new boot epoch, a config version or the absence of further breaches. Because a cooperative token cannot stop a callback that never returns, the door layer runs a SLICE-PROGRESS WATCH: the driver publishes a monotonic slice-start stamp and where the elapsed time exceeds seat_callback_deadline by slice_watch_trip_multiple (a configurable dimensionless-ratio node variable, blocks-boot, whose trip factor is an evidence value) the door layer stops the keepalive with WATCHDOG=trigger, pushes on the silent-degradation class and lets systemd restart the node - safe, because a restart never flattens and standing intents survive as folds - with the accepted V1 consequence stated plainly: V1 cannot interrupt a non-cooperative callback, and the deadline, the quarantine and the supervised restart of last resort carry the line until confinement ships. The roster in deployment configuration declares ELIGIBILITY ONLY - which Bot fp1 may sit at which Book binding - while a seat's state (admitted, active, benched, quarantined) is exclusively a read-time fold over AD-41 seat records and CT-24 transitions and the compiler refuses a roster layer that supplies one; the prediction linter's four pinned checks run at seat time against the CT-28 binding context, producer templates resolve at seat admission, and conformance Layer 2 is a node-owned stdlib process spawn feeding QML's pure verdict function under the TN-18 governor CPU and memory budgets so the verdict stays host-independent. The OR-06 relocation lands here: the node's composition root holds the Bot-domain WriterId under QL-1's declared writer unit and mints CT-33 records only on a conformance pass, through the registration capability on the doors, with hardened OS-level confinement the one named deferred dependency that V1 does not wait on. MIS V1 IS A SEAM ONLY: a compute-once, versioned, immutable per-instant SIGNAL SNAPSHOT, schema format-versioned, computed in-process by rule-based deterministic labelers and dispatched to a CLOSED consumer set of the Book door and the KSA, carrying the per-instrument SQS score and hard-block flag, feed_state (live, degraded or dead) on the pinned canonical feed, the degraded_sensors list, labeler version stamps and readiness markers (ok, not_ready, unavailable, stale, refused); no trained model is bound in V1, the labelers stay RULE-BASED, bots NEVER consume it, SQS reaches the Book door and the KSA ONLY inside the snapshot so one instant carries exactly one SQS value, and every producer feeding the snapshot reads the world room AS OF THE SLICE'S FRONTIER INSTANT and never wall-now, publishing not_ready if it cannot be bounded to the frontier. AD-24 is honoured rather than skipped: until the live-path rung has a recorded baseline on the deployment tuple every labeler is HEAVY BY DEFAULT and a light claim is refused at the gate, so the snapshot is computed once and fanned out with staleness stamps, its maximum age IS the Book's decision_freshness_bound with no second bound, a consumption past it is a stale evidence refusal and a labeler that cannot publish inside it publishes not_ready; once the rung baseline exists a labeler may declare and benchmark-prove a light claim and be dispatched synchronously, and a tuple migration leaves a provisional light claim that alarms rather than hard-blocking. THE SHADOW-LANE SEAM IS EXPLICIT V1 NODE WORK in three pieces so the follow-on epic is a model drop rather than a re-architecture: candidate labeler registration at the composition root into a CANDIDATE role the governed consumer set refuses, its distribution identity and version entering a SEPARATE shadow_composition_fp and never the governed composition_fp, heavy by construction, never counted toward max_slice_latency and dropped with a journaled data quality record if it cannot publish inside shadow_lane_publish_bound; a shadow snapshot stream written to its OWN MANIFEST PREFIX under its own allocated WriterId with the same per-instant schema and frontier-bound read rule; and a comparison read model on the evidence channel that diffs shadow against governed per instant as an ungoverned diagnostic gating nothing - with a candidate NEVER a live consumer and a composition that wires a shadow output into a governed consumer refusing to boot. There is no ambient randomness in the live runtime, a training job may seed its RNG provided the seed is recorded, a recovered or pre-trained model carries no authority without fresh ratification, and MIS training, quarterly cloud training, re-certification and any ML labeler stay deferred to a named follow-on epic."
    status: ratified
    rationale: "QL-7, QL-8, QL-10 and AD-24 are the parent bindings, and PRD Phase-2 doctrine supplies the live-runtime guardrail; the node adds only the containment line and the seam. It rests on A25 (MIS consumers are the Book door and the KSA only, bots never) and A38 (the seat-callback deadline, the automatic quarantine, the operator-signed seat_reinstate exit and the door layer's slice-progress watch as the V1 containment line ahead of OS confinement) - both proceed-on-recommendation. The shadow lane is downstream of a DIRECT operator ruling of 2026-08-28: MIS models do not exist and must be downloaded, cleaned, trained and shadow-rolled, so memlog line 48 (b) and line 49 turned the memlog's 'Shadow lane ... Deferred with the seam named' into explicit V1 node work with only the ML and training half deferred. Amended further by memlog line 46 (15), which put SQS inside the snapshot only, made every producer read as of the slice frontier, classed the labelers as CT-16 producers under AD-24 heavy-by-default until the rung baseline, and keyed the SQS baseline to (VenueId, environment, instrument) so a demo-conditioned baseline never satisfies a live binding - superseding the memlog's 'dispatched SYNCHRONOUSLY to a CLOSED consumer set'; by line 51 (14), the candidate labeler rules and shadow_composition_fp; by line 51 (17), the heavy snapshot's maximum age being decision_freshness_bound with no second bound and the governor budgets being soak-blocking; and by line 51 (23), the slice-progress watch and the seat_reinstate-only exit from quarantine. The memlog's registration-door text 'qmn registry ...' is superseded history: there is no node command line, and registration is a capability on the doors."
    sources: [EXT-2115]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-19, seats, mis, shadow-lane, conformance]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-19"

  - id: DEC-0205
    title: "Promotion and activation: human only, two acts (TN-20)"
    statement: "Promotion to live is a human-signed AD-18 promotion card minted through the powers channel, the transport binding every powers call to a declared principal and refusing any other: the SO_PEERCRED peer credential must be the OPERATOR principal, the ops principal is refused promotion outright, and the credential is recorded beside the claimed signer - proving an ACCOUNT and not a human, with no automated unit ever running under an operator principal (preflight asserts it) and humanity beyond that asserted by the signer as a named residual risk rather than a proof. The card carries AD-18's mandatory plain-words summary as an IDENTITY FIELD - the channel renders those exact words to the human and stores them with the signature, and a typo fix mints a new card with a supersedes edge - and AD-18's other mandatory identity field, the Book or BMS DEFINITION FINGERPRINT, so a signature can never attest a superseded template, and it presents AD-32 Layer 3's ONE ASSEMBLED PAGE: both proofs, the binding identity, the capability-satisfaction result and the resolved BMS fingerprint, signed once. PROMOTION IS A CLICK, ruled by the operator on 2026-08-28, and its PRECONDITION BATTERY runs SILENTLY, SERVER-SIDE, AGAINST FRESH STATE: AD-32's three layers including the demo shakedown, the CT-28 bind-time capability check, present LIVE-CONDITIONED baselines (the (VenueId, environment, instrument) SQS baseline minted from live-connection recording and the live-path rung baseline on this deployment tuple, a demo-conditioned baseline never satisfying either), the config version's admission_impact stamp showing no un-discharged resign diff, no blanks, and value-status = ratified on every live-gating variable rather than merely non-blank. Promotion presupposes reviewed backtest evidence carried on the card and, later, the agentic system's own paper-trading period before a bot even returns for promotion - neither being the node's to run - and THE OPERATOR SEES RESULTS, NEVER MACHINERY: the battery's outcome renders as a passed or refused list in the operator's own words with the refusing check named, displayed-eligible is never a guarantee, and a refusal is journaled like any other. The crossing is a node-initiated pull of the registry as-of set from the hub's published area, idempotent by artifact key, landing the seat ADMITTED with no intents and no ledger, and the pull REFUSES any artifact carrying provenance = sandbox and any as-of set containing one, verifying each artifact's fp1 against the card before the seat lands, a refusal being journaled and alarmed; this is the node's only inbound path. ACTIVATION IS THE SECOND ACT - the seat becoming active at a live binding - a separate operator action through the same channel, journaled as its own CT-24 transition and folded like every other seat state and never written into the config, so approval never equals exposure and a restart never re-arms exposure. The CT-13 promotion event carries the card fp1 plus correlation_id only. Paper flip, paper-epoch reset, the kill-line stand-down return, node resurrect, a value-status countersign and every first entry into live are operator-signed, carries-ledger and continues-performance are two further operator-signed acts never inferred from one another (ledger carry moves money and asserts nothing about comparability, performance lineage asserts a track record and moves no money), and clocked mechanical clears such as the next-open bench reset and the day-boundary budget reset mint CT-24 transitions only, never a CT-30 resume."
    status: ratified
    rationale: "L17, DEC-0041, AD-18, AD-32 and AD-35 are the parent bindings; the node adds the principal binding and the silent battery. A26 is RULED by the operator on 2026-08-28 - promotion and activation are two separate acts, each a click, the precondition battery silent and server-side ('a simple click on the user interface... two separate acts') - so this rule is direct-ruling ground rather than recommendation, and the operator also placed the agentic system's own paper-trading period outside this layer ('doesn't concern you... focus on live trading'). It further rests on A32 (SO_PEERCRED proving an account, not a human), A34 (value-status as a per-value config-artifact field) and A40 (the two peer principals) - all proceed-on-recommendation. Amended at the gates: memlog line 46 (16) added the value-status precondition that a provisional live-gating value blocks role = live until countersigned, and line 46 (15) added the live-conditioned baseline requirement, a demo-conditioned baseline never satisfying a role = live binding; memlog line 51 (11) made the transport refuse promotion to the ops principal and named SO_PEERCRED's account-not-human limit as residual risk A32; and line 51 (22) added the countersign's evidence-citation predicate that the battery reads. Memlog line 48 (Q3) and line 49 rewrote the promotion wording to the click-plus-separate-activation shape recorded here."
    sources: [EXT-2116]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-20, promotion, activation, powers-channel]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-20"

  - id: DEC-0206
    title: "Replay mode: the node's own regression tool (TN-21)"
    statement: "A replay run is a stdlib PROCESS-PER-JOB SPAWN OUTSIDE THE NODE PROCESS - started from the operations toolkit's just node-replay recipe over a day or a range, or from the Python API, never from a trading control and never inside the trading node process, which would drive a second loop on the live thread. It composes a replay-scoped root from the same resolved node-config artifact with world = replay, drawing its WriterIds from a DISJOINT namespace, resolving NO credential reference, holding no venue secret, opening no socket (preflight proves it) and constructing NO live sink, and it runs THE SAME loop with the replay frontier clock - a pure function of the data cursor - behind the REPLAY IMPLEMENTATION of VenueClientPort, which the (world, VenueId) selection guarantees for every VenueId, feeding recorded observations (ticks, bars, fills, lifecycle events) through the one crossing named below, with slice boundaries reproduced from the accumulator's recorded RECEIVE stamps so the diff moves only when a decision moves. THE ONE SANCTIONED CROSS-WORLD READ is named rather than assumed: a replay run reads live-world observations through a named ONE-WAY REPLAY IMPORT PORT, read-only, reading from the evidence tier's sealed-archive role so a hot-room purge past hot_room_retention_window never orphans a replay, where 'sealed' means DURABLY PERSISTED AND VERIFIED INTO sealed-archive - the sync's own watermark - and neither the boot composition seal nor AD-21's 12-month split seal, which continues to bind every read boundary it already binds; this port is the single exception to AD-19's cross-world refusal and there is NO WRITE EXCEPTION, EVER. The SQS door's input under replay is declared because there is no fill or spread model: the door reads the RECORDED per-instant signal snapshot from the replayed day - the same governed artifact the live run consumed, replayed as evidence - and where no recorded snapshot exists for an instant it reads not_ready and refuses entries there, so a replay never recomputes an SQS value and the diff stays a decision diff rather than a sensor diff. Every decision, door and fold re-runs and the produced decision stream is DIFFED against the recorded one, but THE DIFF IS AN UNGOVERNED DIAGNOSTIC REPORT - not a B-3/B-4 governed run, never ledgered, never evidence that gates anything, read by a human or a CI job and nothing else - commands are NEVER submitted, the recorded venue answers ride as evidence only, and there is no fill simulation in V1. Every artifact a replay run produces - decisions, folds, journals and bot-state snapshots - carries world = replay DERIVED FROM DATA PROVENANCE rather than caller-declared, and because world is a component of the BotStateScope identity a replay snapshot can never be restored into a live or paper seat and live state can never be restored into a replay run; a replay binding is a different identity that can never gate live money, replay writes only into the replay world's own rooms, and replay-clock exhaustion is a typed refusal. Replay is a required step of the soak acceptance and of every change that touches the order path."
    status: ratified
    rationale: "AD-19's cross-world refusal, adjudication correction 3 (a replayed live day is world = replay, no venue) and B-7's provenance-derived world are the parent bindings; the node adds the named import port and the process isolation. It rests on A27 (a decision diff only, no order re-send and no fill simulation) and A33 (a named one-way replay import port over an export-with-lineage copy, as the single sanctioned cross-world read) - both proceed-on-recommendation - and on A44's sealed-archive room role, which is a proposed parent annotation rather than a child's call. The memlog's TN-21 entry is SUPERSEDED HISTORY in two places: it names a 'qmn replay <day|range>' command, which the operator's 2026-08-28 no-command-line ruling (memlog line 48 Q1, line 49) deletes in favour of a just node-replay recipe over the same library, and it reads observations 'from the live world room', which memlog line 46 (14) and line 51 (26) replace with the one-way import port over the evidence tier's sealed-archive role so a purge never orphans a replay. Amended further by memlog line 51 (6): the VenueClientPort implementation is selected by (world, VenueId) rather than VenueId alone, a replay composition resolves no credential and opens no socket, the run is a stdlib process-per-job outside the node with disjoint WriterIds, and the port has three V1 implementations - the cTrader client, the replay implementation and the FEAT-0023 conformance double. Memlog line 46 (14) also fixed the diff as an ungoverned diagnostic and world as a component of the bot-state scope."
    sources: [EXT-2117, EXT-2125]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-21, replay, evidence, regression]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-21"

  - id: DEC-0207
    title: "Multi-account and multi-broker seam: config, not architecture (TN-22)"
    statement: "Every runtime object is keyed by the ratified tuples and never by a singleton account or broker. The deployment ROSTER lists account bindings (VenueId, AccountId, role, world) with credential references, the declared credential-sharing fact per credential reference, the BMS definition fp1, the Book bindings on each, the opaque-id mapping for metric labels and - on every binding it mints - the mandatory state_carry declaration per counter with its carries-ledger signature wherever a counter carries, with one BMS instance minted per account and the roster declaring ELIGIBILITY ONLY so no runtime state appears in it. The roster additionally carries SENSING-ONLY ENTRIES: a (VenueId, environment, AccountId, credential reference) row with no Book binding, no BMS instance and no command stream, which opens its (venue, environment) connection for subscription, recording and baseline minting and for nothing else - minting no AD-29 binding, resolving no execution_target, and the composition refusing to open a sequencer against it - which is how the live environment is named during the soak week before any role = live binding exists. NETTING versus HEDGING is read from CT-18 at BIND TIME and its consequences are imported whole: on a netting account the venue holds one position per instrument at account level so several Books share positions and a Book-scoped flatten mechanically closes another Book's exposure, so binding a second Book onto a netted account whose live bindings may trade an overlapping instrument set is an unsupported capability refusal UNLESS the operator signs the shared-flatten limitation, that signature being an identity field of the binding, with ONE BOOK PER NETTED ACCOUNT the recommended and V1 default configuration; where the position model makes a narrower scope indistinguishable from a wider one the action REFUSES rather than executing wider; and the fill-to-virtual-position attribution rule is a mandatory Book declaration whose absence is a bind-time policy rejection - mandatory not being enough, so the SET of attribution declarations on one netted account must be JOINTLY EXHAUSTIVE AND DISJOINT, the compiler proving at bind time that every fill on that account is attributed to exactly one virtual position across all bindings and refusing the roster otherwise as an invalid input at compile, never a trade-time discovery. One COMMAND-STREAM OBJECT per (VenueId, account) carries its own UNKNOWN block, its allocated WriterId, its journal sequence (gapless per writer and boot epoch), its command ordinal (monotone, never reused across the stream's life, high-water mark durable - two distinct counters, never one object) and the control-rank table, and it does NOT carry a pacer bucket. THE PACER BUCKET IS OWNED BY THE CONNECTION, instantiated once per CT-18-declared throttle_scope (connection, account or binding) which is read rather than assumed: a command stream admits through the bucket its declared scope names and never holds one of its own, EVERY issuer on a connection admits through that bucket - the order path, the five session duties, the history bridge and the reconciliation read-back - and the bucket reserves a declared minimum capacity (a node value, do-not-default) for protective commands that no other issuer may consume, so a close_all never queues behind a gap replay. Connections are keyed by (venue, environment), one per pair the roster names, and the VenueClientPort implementation is selected at the root by the pair (world, VenueId) and never by VenueId alone; each BROKER is its own VenueId even on the same platform, so a second cTrader broker is another VenueId with its own symbols, boundaries and hours, and the platform-versus-venue axis stays recorded rather than modelled. EXTENSIBILITY is stated here because the roster is the surface: adding a Book, a BMS, a bot or a new version of any of them is a registry mint plus a roster-config change plus a restart at a safe point and never code, and a new account, a second broker or a second cTrader VenueId is the same shape - a roster row and a VenueClientPort selection, not a module - while cross-account netting, load balancing and any cross-stream ordering guarantee are NOT built now, AD-37 declaring cross-stream ordering an explicit non-guarantee."
    status: ratified
    rationale: "AD-29's binding chain, AD-37's one-arbitration-point-per-stream and CT-18's declared capabilities are the parent bindings; the node only keys its objects by the ratified tuples so nothing hardcodes 'the account'. It rests on A28 (each broker is its own VenueId) - proceed-on-recommendation - and inherits A47's sensing-only live connection, also a recommendation. Amended at the gates: memlog line 46 (4) imported the netting/hedging consequences (bind-time shared-flatten signature, the one-Book-per-netted-account default, refuse-rather-than-widen scope resolution, the mandatory attribution declaration) and line 46 (9) split the command ordinal from the journal sequence as two distinct counters; memlog line 51 (15) added the partition proof - the attribution declarations on one netted account must be jointly exhaustive and disjoint, proved at compile - and line 51 (6) changed the port selection from 'adapter selected by VenueId at the root' to (world, VenueId); line 51 (32) added the sensing-only roster entry and the roster-derived connection count; and line 48 (c) with line 49 wrote in the extensibility requirement as an operator ruling. The memlog's TN-22 entry is superseded where it gives the command-stream object a 'pacer bucket (keyed by the CT-18 throttle scope)': the bucket belongs to the connection, with a reserved protective capacity, so a protective command never queues behind another issuer. The memlog's Binds line says qmn/roster; the spine binds qmn/config roster - the same surface under the config component's name."
    sources: [EXT-2118]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-22, roster, multi-account, netting, pacer]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-22"

  - id: DEC-0208
    title: "QA standard, benchmarks, soak acceptance, QA-debt discharge (TN-23)"
    statement: "The node ships under the permanent battery - Skylos including its IaC scan of the unit files, vulture, the four tier-1 scanners, the coverage floor and the Linux lane - plus requirements-first independent tests in the qa/ tree, with nightly mutmut EXTENDED to the node's money-path modules (door-path wiring, command mint, equity derivation, drift decomposition, sizing-ladder evaluation, virtual-ledger folds) at the ratified kill floor, run against the branch that carries code and with a zero-mutants run failing closed. A VENUE CONFORMANCE DOUBLE is a required node artifact (FEAT-0023) and is the THIRD VenueClientPort implementation - it implements the same port or the suite proves nothing about the port - so ONE conformance suite that both the double and the live cTrader client must pass carries UNKNOWN-outcome fixtures per trigger (timeout, transport-error, disconnect) and the superseded-by-fill cancel read-back, letting the money-path proofs and the QA-debt discharge be earned deterministically in CI rather than asserted once on live infrastructure; it is separate from replay, which diffs recorded observations rather than synthetic fault fixtures. The four risk GOLDEN SCENARIOS - SCN-0006, SCN-0008, SCN-0010 and SCN-0011 - stay defined-unwired until this node wires them, and no integration or runtime proof of them exists until it does; FAILURES.md completeness is GATED rather than promised, a CI check asserting an entry for every typed-failure-id the node can emit cross-checked against the failure-id enum, all six NFR-11 fields populated, every operator affordance resolving to a named door capability or operations-toolkit recipe that exists, and TN-15's alert allow-list generated from the register's notification tier column. BENCHMARKS: the node ships its own harness at test status measuring wall-clock AND peak RSS at four seat counts against the roughly forty-seat design reference, and the harness NEVER runs concurrently with a slice-driving node process - it runs before the doors open or from node stand-down, holds governor_cpu_budget and governor_memory_budget which are soak-blocking rather than merely live-blocking, and every baseline and gate run records the node's lifecycle state at measurement, a run recorded while the loop was driving slices being neither a baseline nor a gate; the first Linux baseline, recorded on the VPS tuple by the harness in the soak's first hours before the doors open on live bindings, becomes the regression gate AND satisfies CT-28's bind-time rung baseline and AD-24's light-claim gate, each benchmark's regression threshold is stated when its baseline is recorded as a multiple of measured run-to-run variance, the six AD-13 rungs are named with their stamps (the venue client owning arrival and submit), the operator's own latency figure is recorded as a WATCHED TARGET and never a budget, and the gate is evaluated on the VPS and in the nightly window while CI runs the harness for correctness only. The SOAK ACCEPTANCE GATE for the live milestone - the soak being the FULL first-deploy warm-up week run unattended on the demo account - is a machinery-proof CHECKLIST unchanged by that duration ruling, each item journaled and each carrying an injected-fault drill where applicable: six first-connection checks per instrument with the amend-atomicity measurement among them recorded in the venue-observation profile; a forced disconnect mid-order minting UNKNOWN and BLOCKING THE WHOLE STREAM, protection included, with a protective close issued under the block journaled as a standing protection intent that dispatches on resolution, resolve_unknown clearing automatically on an unambiguous read-back and by operator attestation otherwise; a protective-stop attachment refusal where CT-18 does not declare the capability and a placed entry observed carrying its venue-resident stop; a no-scale-in policy rejection; reconnect gap recovery committing fills before healthy; reconciliation with four verdicts and TWO separately reported residuals, quantity and cash, in the exact integer domain with the two equity series shown side by side and never differenced; a KSA escalation firing the matrix at its declared scope with only an operator resume naming that scope de-escalating, a clocked reconciled verdict proven not to lower the level, and a connectivity escalation on the live connection proven not to block paper routing to the paired demo stream; an AD-37 COMPOSE PAIR where a KSA suspend_new and a kill-line breach on one tick BOTH EXECUTE; an operator-signed synthetic kill-line breach on the paper Book auto-flattening that binding and standing it down; a news window and a dead zone blocking entries while an exit passes, with a news-calendar revision proven not to open entries before the in-force window's declared end; a held amend_protection re-decided when the UNKNOWN block clears; an SQS baseline minted and a block observed, a demo-conditioned baseline proven not to satisfy a live binding, and at the week's end a LIVE-CONDITIONED SQS baseline and live-path rung baseline PRESENT and satisfying the bind-time check from the sensing-and-recording-only live connection; the bench fold benching a seat while the Book stays live; the breakeven ratchet amending single-sided; an injected residual driving the entry stand-down cleared only by an operator resume after a fresh review; a restart re-deciding a standing intent without re-arming a Book left in paper; a crash-loop booting into stand-down with the doors serving, a detected preflight refusal entering stand-down WITHOUT EXITING and without advancing K and T, a requested restart exiting 75 and restarting cleanly, and only an operator resurrect journaled under the node_resurrect subtype leaving stand-down with a Book-minted exit proven to pass throughout; a quarantined seat leaving quarantined only by seat_reinstate; the shutdown contract flushing, minting UNKNOWNs for in-flight commands after session close and never flattening; the nightly backup, the nightly sample-restore timer, one monthly full-restore timer run and the HOST-LOSS RESTORE REHEARSAL triggered by restore_drill_run onto a clean host holding only the escrowed payload key, which is what measures the full-DR RTO; one boot under the real systemd unit with LoadCredentialEncrypted from a scratch credstore; a simulated clock-band breach producing the entry-side no-new-entry effect AND pushing; the powers door refusing a call from neither declared principal and refusing every trading, protection, promotion and settings power to the ops principal, an agent signer among them; a value-status countersign carrying its evidence citation flipping a provisional live-gating value to ratified, one without a citation refused as invalid input, and the promotion battery refusing before and passing after; the dead-man's switch alerting when the heartbeat stops and a synthetic alert proven delivered end-to-end before the node is left unattended; the conformance double and the live client both passing one suite with SCN-0006, SCN-0008, SCN-0010 and SCN-0011 wired and proven; a replay of a recorded soak day diffing clean from a process outside the node resolving no credential; metrics, health and alerts observed; the observability stack standing up from its checked-in compose file under its own unit and account with seeded dashboards rendering for the whole unattended week and the node proven to run unchanged when the stack is stopped; the benchmark baseline and its regression threshold recorded with the node not driving slices; and measured bytes-per-day and the disk budget recorded. QA DEBT rows become NODE STORIES by name, each story citing its id - QMX-F045, F046, F062, F063, F064, F067, F068, F069, F102, D008, D010, E15-F01/F02/F03, E7-R28, E9-F04, E12-F01/F04/F05 - while foundation debt stays foundation (F085's download half, F053-F057, F030, F107, E11-F04/05/06 and the E4/E6/E9 scope rows), and every node failure mode ships a FAILURES.md entry with NFR-11's six fields."
    status: ratified
    rationale: "AD-13's measure-then-budget, NFR-11's per-failure-mode register and the project's permanent battery are the parent bindings; the node adds no profit gate and invents no latency budget, and the checklist proves machinery rather than performance. It rests on A30 (nightly mutmut extended to the node's money-path modules) - proceed-on-recommendation - and inherits A47 (the live connection opened for sensing and recording only from the moment credentials exist, so the live-conditioned baselines accumulate during the soak week and a late approval delays go-live rather than the soak). A10 is RULED by the operator on 2026-08-28 - the soak is the full first-deploy warm-up week, unattended, on the demo account - and the ruling explicitly left the acceptance checklist unchanged, so the duration moved and the machinery did not. Amended at the gates: memlog line 51 (1) corrected the disconnect item so the UNKNOWN block is the WHOLE STREAM rather than entry-side, superseding the memlog's 'stream blocked, operator resolve_unknown clears it' shorthand; line 51 (10) replaced the memlog's single 'explained residual' with two separately reported residuals, quantity and cash; line 51 (5) added the preflight-refusal, exit-75 and crash-loop items; line 51 (17) forbade the harness running while the node drives slices and made the governor budgets soak-blocking; line 51 (2), (7), (11), (22), (24), (32) and (33) added the attachment, news-revision, principal, countersign, scope and no-scale-in items; line 51 (13) added the observability-stack item; and line 51 (16) split the memlog's 'one full restore drill' into a nightly sample timer, a monthly full timer and the restore_drill_run host-loss rehearsal. The memlog's 'five first-connection checks' is superseded by the spine's six, the amend-atomicity measurement among them, and the memlog's 'clock band breach simulated to suspend_new' is superseded because a band is a per-decision-cycle precondition and never a CT-30 action (memlog line 46 (3))."
    sources: [EXT-2119]
