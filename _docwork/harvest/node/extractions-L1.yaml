extractions:

  - id: EXT-2094
    type: decision
    summary: "TN-1 IDENTITY, PACKAGING, BASE (as amended by the operator rulings and both gates): the trading node is ONE product with two modes, paper|live — never a separate paper product. It is a top-level uv-workspace member alongside qmb/ and qml/, code name `qmn` (QuantMind Node — the distribution and import CODE NAME only; the operator declined to rule the name, 'that question is not for this layer', and a rename is mechanical), an application layer built ON QMF exactly as QMB and QML are (L11/L31, ADR-0011, ADR-0012:36), never a qmf.* roster package and never a framework. Nothing QMX is published to any index; the node installs from ONE canonical checkout root on the VPS — git clone at a pinned commit plus `uv sync --frozen`, materialized as immutable per-commit trees under a `current` symlink (TN-16, NFR-10). BASE: node epics branch from origin/integration@ef9bb25, never the stale local integration ref at 2c8d495, and land back on integration through the factory lane; if the operator squash-merges to main first the lane re-points onto main (mechanical); 'start from main' is refused because main carries no packages/, qmb/, qml/ or extensions/. NO OPERATOR COMMAND LINE, RULED (line 48 Q1, applied at line 49): the node ships no product command line and no typed operator door of its own — its control surface is the desktop UI over the node's doors (TN-17) — so PRD FR-046, DEC-0159 and DEC-0185 Ruling C (qmb is the platform's single command-line surface) stand unchallenged and the CLI reconciliation note is WITHDRAWN; the pre-ruling memlog text naming a `qmn` command is superseded history. OPERATIONS TOOLKIT: install, switch, rollback, the secrets provisioning wizard, the data bootstrap, replay, config init/validate/explain, notify test, hub publish and the on-demand host-loss restore rehearsal are `just node-…` recipes in the repo's existing root justfile with bodies in one place under qmn/deploy/justfile-recipes/ — DevOps tooling, 'a very separate system, like how big tech teams work', never a trading control and never a product command line: no recipe places, cancels, amends, flattens, promotes or activates anything, and the restriction is enforced BY THE TRANSPORT (recipes run under the powers channel's ops principal, refused every trading, protection, promotion, activation, settings, resurrect, attestation and countersign power), node-install/node-switch/node-rollback are privileged host acts through the declared sudo admin path touching no door, a recipe needing live node state makes the same door call the UI makes, and no recipe ever constructs a composition root or imports the Python API in another process. ENFORCED NOT ASSERTED: a tier-1 check assertion that no workspace member declares a publishable target, and a second that qmn's packaging declares no console-script entry point, so the deleted command-line surface cannot re-enter through packaging. DECLARED RECONCILIATION NOTE for the documentation factory, one half only: L30's scope annotation says 'applications still never import qmf-venue', while the node's composition root is the one sanctioned importer and wirer of qmf-venue (AD-28 — someone must construct the adapter); the sanctioned boundary is the `qmn.venue` SUBPACKAGE, not the root module alone, every other qmn module receiving VenueClientPort and CT-19/CT-20 shapes only and the L30 default-deny lint written against that boundary; qmb keeps its ban; the conflict is SURFACED for annotation at source and nothing is amended by a child. NAMING BLAST RADIUS bounded: /opt/qmx, the /var/lib/qmx trees, the qmx service account and the qmx/* credential labels are PLATFORM names that stay; the distribution name, import name, `just node-…` recipe prefix and `qmn_` metric prefix are ONE identifier set that moves together. BINDS all node code, the factory lane, the workspace layout. PREVENTS a second toolbox package, a published artifact nobody ratified, a node built on a codeless branch."
    cite: "SRC-11:.memlog.md#line-16"
    topics: [trading-node, tn-1, identity, packaging, no-command-line, operations-toolkit, l30]
    authority: rider

  - id: EXT-2095
    type: decision
    summary: "TN-2 COMPOSITION ROOT AND THE BOOT CEREMONY, compose then fingerprint then seal (as amended by both gates): the node is the ONLY place ambient time, broker sessions, secret values, async, threads, processes, schedules and real money exist; everything below it stays pure (AD-15, L13). TWO THINGS HAPPEN BEFORE ACT 1 (line 46 ruling 11): the supervisor/door layer BINDS FIRST — evidence channel, preflight-status read model, the resurrect power — and a BOOT-ATTEMPT RECORD carrying boot epoch id, unit role and stage reached is the first durable write, with composition_fp stamped onto it at act 3 as an amendment; only a failure that prevents the doors binding exits non-zero, every later failure booting into stand-down-alive (TN-4 owns the exit model and the crash-loop fold). Then four ordered acts. (1) PREFLIGHT, a gate before any state mutation: host, disk headroom, network, clock sync (chronyc waitsync), pinned CPython/uv/proto tag/tzdata, credential presence (is_set metadata only), store reachability, the roster's declared credential-sharing facts, the roster's VPS machine tuple, the absence of any unit running under an operator-principal uid, and the ownership and mode of every writable tree — a DETECTED refusal is fail-closed with a typed failure id, journaled, and NEVER EXITS (line 51 ruling 5): the node stays alive in stand-down with the doors serving, so no systemd restart follows and the crash-loop fold never advances. (2) COMPOSE from ONE resolved node-config artifact (TN-18): the roster of (VenueId, AccountId, role, world) bindings with credential references, Book/BMS definition cites by fp1, VenueClientPort implementation selection BY THE PAIR (world, VenueId) and never by VenueId alone (line 51 ruling 6), explicit registration of every market-hours, day-boundary and news-calendar extension and every producer extension (never scanning), every do-not-default value, plus the real Clock, SecretStore, sinks and scheduler; a world=replay composition selects the replay implementation for every VenueId, resolves no credential reference, constructs no venue-session SecretStore holder and opens no socket, and preflight proves all three or refuses the boot. (3) FINGERPRINT: composition_fp = fp1 over the resolved node-config fp1, every distribution identity and version (qmf lockstep, qmb, qml, qmn) AND every registered extension's identity and version (AD-2), the proto release tag, the tzdata version, each adapter's static capability-declaration fp1, the registry as-of set fingerprint, every market-hours, day-boundary and news-calendar CODE identity and version, and the OS/CPU-class tuple — stamped as occurrence provenance on the boot-epoch record of every journal stream and on every artifact label, so that because journal.sequence is gapless per (writer, boot-epoch) every evidence row traces to the exact composition that produced it. The dated snapshot DATA those recorders ingest is deliberately excluded (a data revision never needs a restart, a code change does), the venue-observation profile is excluded because it is measured post-seal, and every candidate labeler enters TN-19's separate shadow_composition_fp so a candidate never re-identifies governed evidence. (4) SEAL: immutable for the boot epoch, no hot reload of anything identity-bearing; a config change is a new resolved config version plus a supervised drain-aware restart at a safe point, which never flattens, lets standing intents survive as folds, and never changes a runtime state (TN-18's partition rule; line 46 ruling 8 — config carries eligibility and identity only). ONE IMPURITY IS DELEGATED, named here and nowhere else (line 51 ruling 9): qmf-venue's ConnectionManager holds the venue socket, session and single in-memory venue secret value on the loop the node injects, under the injected Clock and SecretStore, owning no event loop, creating no unscheduled task, reading no ambient clock and holding no money — with the QMF async conformance test amended in the same increment to EXEMPT qmf.venue.connection BY NAME, and if the parent refuses, the increment lands in qmn.venue.ctrader and the epics may not choose. WriterId ALLOCATION IS THE ROOT'S EXCLUSIVELY: allocated at Compose from a declared namespace, proven pairwise distinct before Seal, journaled in full on the boot-epoch record beside composition_fp, refusing to boot on a collision, naming each (VenueId, account) command stream, the venue recording feed, the AD-31 risk-domain writer, the QL-1 Bot-domain record streams, each streaming-indicator feeder and each timer unit — with ONE id RESERVED rather than allocated (line 51 ruling 25): the SUPERVISOR WriterId, a constant of the unit role, owning the boot-attempt and lifecycle stream under /var/lib/qmx/state, never re-issued by Compose and included in the distinctness proof. TIMER UNITS run an abbreviated ceremony from the config version THE RUNNING NODE SEALED, read over the evidence channel and never from the config graph's `current` pointer (line 51 ruling 16), computing composition_fp over the same inputs so one deployment yields one value, minting their own boot epoch stamped with the unit role and writing only under their own WriterId; node-absent means compose from `current` and stamp node-absent; a timer that can establish neither refuses to write and alarms on the silent-degradation class; a timer needing anything the node process does not compose hands the work to the node through the doors, honoring B-4. BINDS qmn/host, every journal stream, every artifact label. PREVENTS two nodes composing the same rulebook differently and not knowing it, identity-bearing settings mutating under a running loop, a boot that fails where nothing can see it, two writers sharing one WriterId."
    cite: "SRC-11:.memlog.md#line-17"
    topics: [trading-node, tn-2, composition-root, boot-ceremony, composition-fp, writerid]
    authority: rider

  - id: EXT-2096
    type: decision
    summary: "TN-3 TOPOLOGY, PLANES, TRUST BOUNDARIES (as amended by both gates): three planes, two machines, one bucket. VPS PLANE (Linux, always on): ONE node process hosts the trading loop AND the live tick/bar/depth recording, because cTrader allows at most one demo plus one live connection per application, so the connection manager's canonical sensing feed IS the recorder and a separate recorder process cannot hold its own live connection; separate scheduled units run the news-calendar recorder, the nightly backup, the nightly sample restore and the monthly full restore, all under distinct WriterIds; the VPS provider is deployment configuration exactly as the broker and bucket provider are, never architecture; the always-on EVIDENCE TIER is a second directory tree on the same VPS — a placement and authority boundary, not a second host, not a database server, not a second writer — hot rooms never blocking on it, sync one-way, watermarked, idempotent and resumable under verify-before-purge; the VPS is the ONLY plane holding live venue credentials. WORKSTATION PLANE (Windows 11 now, Linux later): working archive as a controlled-room host (B-9), research reads, the future desktop app, the provisioning wizard — holding provisioning and bootstrap material ONLY and never rotated live session material, since the VPS session is the only refresher and the only holder of live session state, so a workstation tool never refreshes a credential the VPS session owns; Windows Credential Manager qmx/* is the provisioning source, the escrow home of the CT-14 backup payload key, and the home of workstation-local secrets only. BUCKET: nightly encrypted versioned copies, ciphertext only, PUSHED BY THE VPS (TN-13's timer) and never by the workstation — a 24 h RPO cannot depend on a laptop being awake and the bucket credential belongs where the timer runs. EPISODIC SANDBOX PLANE (factory agents): evidence carries provenance=sandbox, never merges, never holds live secrets. FLOWS are ONE-WAY node to evidence tier to workstation, and node to bucket, with TWO INBOUND CROSSINGS AND NO OTHERS: the click-gated promotion pull of registry as-of sets from the passive hub, which REFUSES any artifact carrying provenance=sandbox at pull (TN-20); and the sandbox fragment push into the write-only inbox over a restricted key-only SSH identity confined to /var/lib/qmx/hub-inbox, distinct from the operator's key and from TN-12's provisioning identity. THE PASSIVE FILE-SYNC HUB IS A SEPARATE TREE from the evidence tier's rooms (B-15): a write-only inbox for WriterId-scoped sandbox fragments and a read-only published area of as-of sets, where the inbox-to-published step is AN OPERATOR ACT and not a background sweep — the hub_publish power on the powers channel (line 51 ruling 11), signed and journaled, verifying each fragment's fp1 and refusing provenance=sandbox at publish as well as at pull, with `just node-hub-publish` the toolkit recipe calling that same power; the one-way sync never writes into the inbox, the inbox is never a room, nothing in either area is a service (DEC-0084 stands). WRITABLE TREES named once and pinned into the unit files by TN-16 (line 46 ruling 12): /var/lib/qmx/rooms, /evidence, /hub-inbox, /hub-published, /archive, /state (rotated secret material, the supervisor stream of boot-attempt and lifecycle records, and TN-4's reserved protection-intent extent) and /staging, all owned by the fixed qmx service account — plus two trees that are NOT the node's: /opt/qmx (one immutable tree per commit plus the `current` symlink; line 51 ruling 12) and /var/lib/qmx-observability under the stack's own account (line 51 ruling 13); every one is a named line item of vps_disk_budget. ROOM-ROLE PLACEMENT per world: AD-19's seven roles plus one node-minted EIGHTH, `sealed-archive` (line 51 ruling 26), all instantiated for live and for replay — ingest door, immutable raw archive, processed and journal rooms under rooms/<world>/; the split-governed research door, the registry room and sealed-archive under evidence/<world>/; the backup role is the bucket. sealed-archive is what the one-way sync writes into and what TN-21's replay import port and TN-13's backup read by name, and a hot room may be purged under hot_room_retention_window only when a verified copy exists in sealed-archive AND a verified off-host copy exists; replay gets its own instances of all roles under the same trees, the storage separation AD-12 requires. The eighth role is surfaced as a parent annotation, never asserted. BINDS deployment, evidence sync, secrets placement. PREVENTS a third machine, a second live connection, a live secret on a travelling laptop."
    cite: "SRC-11:.memlog.md#line-18"
    topics: [trading-node, tn-3, topology, planes, evidence-tier, passive-hub, sealed-archive]
    authority: rider

  - id: EXT-2097
    type: decision
    summary: "TN-4 PROCESS MODEL, SUPERVISION, STAND-DOWN-ALIVE, SHUTDOWN (as amended by both gates): the node is ONE long-lived process supervised by systemd — qmn.service, Type=notify, WatchdogSec set, Restart=on-failure — implementing the sd_notify wire protocol ITSELF over a stdlib AF_UNIX datagram socket (READY=1, WATCHDOG=1, the leading-NUL abstract-socket form, an unset NOTIFY_SOCKET) with no python-systemd or sdnotify dependency (line 46 ruling 11). THE KEEPALIVE IS OWNED BY THE SUPERVISOR/DOOR LAYER, never by the domain slice loop, so it continues through stand-down; the obligation that carries is that the door layer also runs TN-19's slice-progress watch (line 51 ruling 23), so a loop wedged inside a non-cooperative seat callback stops the keepalive rather than being masked by it. INSIDE: exactly one asyncio event loop with async ONLY at the venue edge and the doors (AD-15); the domain loop runs synchronously on that loop's thread per slice; the node's scheduler drives the adapter's five declared session duties (heartbeat at its 10 s venue-bound cadence, token refresh keyed by credential reference, reconnect, gap replay, verification monitors including the continuous D1-boundary monitor) plus the nightly cycle, the news-calendar refresh and the backup and restore hooks; NO threads for domain work; stdlib process-per-job only for isolated work — conformance Layer-2 runs, benchmark runs and REPLAY runs — with a replay run ALWAYS a spawn OUTSIDE the node process (line 51 ruling 6), composing a replay-scoped root from the same resolved config at world=replay, drawing WriterIds from a disjoint namespace, resolving no credential and constructing no live sink. DRAIN-ORDER DISCIPLINE applies to dequeue for interpretation ONLY, never to record-and-journal order: execution and system events are interpreted before market data so a tick storm cannot starve risk checks, while the accumulator's recorded stream preserves arrival order verbatim, which keeps the TN-21 replay diff meaningful. NODE STAND-DOWN IS AN ALIVE LIFECYCLE STATE, not a CT-30 control action (line 46 ruling 3): entered automatically on a crash loop, a `halt` clock band or a preflight failure, left ONLY by an operator `resurrect` through the powers channel — journaled as an AD-21 `control action` EVENT under the declared node subtype `node_resurrect`, operator signer, global scope, minting no CT-30 kind (line 51 ruling 4) — with no clocked clear, reconnect, reconciled verdict or restart leaving it, and named apart from the binding state `stood-down` and from CT-30 `resume`. IN STAND-DOWN the sequencers refuse and journal ENTRY intents ONLY — place_order and risk-increasing amend_protection, whatever their author — while EVERY risk-non-increasing act passes whatever its author (line 51 ruling 3): Book-minted protective closes, declared force-flat triggers, ExitLogicModule exits, bot-proposed tightens, the standing-intent dispatcher, and every operator-signed protective command; where sessions have quiesced a protective command is journaled as a standing protection intent before dispatch and satisfied on the next healthy session — never refused, never dropped — because 'reachable in stand-down' means ENACTABLE, not merely answerable; the doors keep serving throughout. THE EXIT MODEL (line 51 ruling 5): a DETECTED refusal at or after preflight does NOT exit; the crash-loop fold governs only failures that DO exit (a door-binding failure, any unhandled death after boot); a REQUESTED restart (settings edit, node-switch) exits code 75 under RestartForceExitStatus=75 / SuccessExitStatus=75, stamps reason=requested-restart on the next boot-attempt record, and NEVER advances (K,T). THE CRASH-LOOP FOLD counts UNREQUESTED BOOT ATTEMPTS — K within T seconds, node values, UI-editable, evidence value 3 boots in 60 s — from the supervisor writer's boot-attempt records, counting every attempt within T regardless of stage (stage recorded for diagnosis, never for bucketing), with StartLimitBurst MUST exceed K and StartLimitIntervalSec at least T so systemd carries the node to the boot that self-detects the loop; a burst at or below K leaves the node dead at start-limit-hit with no doors, answered by TN-15's dead-man's switch. A SAFE POINT, defined once: slice driver between slices, suspend_new enforced on every stream, every command terminal or UNKNOWN-minted, every sink flushed with block-on-unpersistable honored — positions NEVER waited on — bounded by drain_window (configurable, duration, blank blocks boot; TimeoutStopSec RENDERED from it) with a breach a typed refusal, and watchdog_interval the second such value rendering WatchdogSec (line 51 ruling 28). SHUTDOWN CONTRACT: SIGTERM mints a boot-epoch lifecycle STOP (not a CT-30 action) enforcing suspend_new on every stream under authority adapter_self, then closes sessions with no resubmission, then MINTS AN UNKNOWN for every command without a terminal outcome under the declared trigger `disconnect` — the mint following session close so AD-27's vocabulary applies honestly, with `lifecycle-stop` offered as a proposed CT-20 trigger and this ordering the node's rule until the parent rules — then flushes every sink; exit 0 for an operator stop, 75 for a requested restart, and a code that is neither where the safe point is unreached within drain_window after minting UNKNOWNs for the remainder; if the flush itself cannot complete the node stays up, alarms on the silent-degradation class and refuses to exit clean. Shutdown NEVER flattens; standing intents survive as folds and are re-decided at the next boot. UNDER A FULL DISK block-on-unpersistable and L39 compose: the block is entry-side only, the venue-resident protective stop carries the position, the door-owned keepalive keeps answering, and a protection intent the journal room cannot take is written to a small RESERVED PROTECTION-INTENT EXTENT under /var/lib/qmx/state sized by disk_headroom_min so the headroom block trips first (line 51 ruling 21), re-decided when storage returns, or recorded UNDELIVERABLE and alarmed — never held in memory, never silently dropped. BINDS qmn/host, qmn/deploy/systemd. PREVENTS a second event loop, background threads mutating folds, a restart loop churning the broker, a shutdown that loses an intent, a safety state that disarms the operator."
    cite: "SRC-11:.memlog.md#line-19"
    topics: [trading-node, tn-4, process-model, stand-down-alive, resurrect, safe-point, shutdown]
    authority: rider

  - id: EXT-2098
    type: decision
    summary: "TN-5 THE LIVE LOOP IS QMB'S LOOP, UNFORKED (as amended by both gates): the node drives QMB's B-2 event-slice loop through `run_slice`, the pure single-slice function, and never a second loop — binding at the root a live frontier clock (the real wall clock injected as qmf-core's Clock; the monotonic kind for every duration) and a live SliceHandler implementing the five hooks update_stream, scheduled_position_event, execute_resting, update_closed_data, mint_intents. The six pinned sub-phase order is identity-bearing and preserved verbatim; new intents rest a slice; instruments process in declared order; forming bars are never visible. A PUSH-TO-PULL ACCUMULATOR sits between the venue edge and the loop as the SINGLE FIRST WRITER of every inbound observation: the venue client hands it raw decoded observations, it records them through qmf-data's CT-15 intake into the live world room AND journals them under the allocated venue WriterId, and only then makes them foldable; the recorder duty is a ROLE of this one path and never a second writer, no component writes an inbound observation anywhere else, and recording precedes interpretation. THE SLICE FRONTIER IS THE RECEIVE WALL INSTANT stamped by the accumulator, the venue instant carried beside it as evidence (AD-8), so the live frontier is monotonically non-decreasing by construction and the accumulator's recorded stream order IS the replay cursor order — a replay reproduces slice boundaries from the recorded receive stamps, which is what makes TN-21's diff a decision diff and nothing else. The accumulator maintains a DURABLE INTERPRETATION CURSOR in the journal, committing at slice end after that slice's sinks have flushed and never mid-slice, so the re-fold boundary is always a completed slice; TN-10's boot order re-folds every observation recorded after the last committed cursor position BEFORE the protection-state projection, and every fold the re-fold touches is idempotent by observation identity (AD-27's venue-native key under AD-10's idempotent split), so a re-fold can never double-count a fill. The accumulator is BOUNDED (`accumulator_bound`, node value, do-not-default) with a TYPED OVERFLOW RULE: overflow never drops an execution or system observation — market-data observations coalesce and the coalescing is journaled as `data quality` — and a bound that cannot be honoured without dropping an execution or system observation is a `storage failure` blocking entries only. Slices are event-driven per observation with a declared `max_slice_latency` (node value, do-not-default) whose BREACH EFFECT IS STATED: a journaled `data quality` record plus a `no-new-entry` band effect, entry-side only per L39 — never a silent skip, never a stand-down; the loop never awaits I/O, since sinks are synchronous local writes and venue submissions are handed to the venue client whose outcomes arrive as observations in later slices. Candidate labelers are computed off the trading path and never counted toward max_slice_latency (line 51 ruling 14), and every producer feeding the signal snapshot reads as of the slice frontier, never wall-now (line 46 ruling 15). STREAMING INDICATORS obey the single-feeder law: exactly one WriterId holder per streaming instance allocated at Compose, a snapshot restoring equivalently only within the same SnapshotScope (OS and arithmetic-reference build injected, never read ambiently), a cross-scope restore refusing. ONE loop instance per (VenueId, account) command stream — the same unit as AD-37's one arbitration point per stream — several Books on one account sharing it with every coupling ruled at bind time in TN-22, cross-stream ordering a declared non-guarantee. Backtest, replay (TN-21) and live differ only in which clock and which VenueClientPort implementation the root binds — the port node-minted (TN-11) and SELECTED BY THE PAIR (world, VenueId), never by run mode and never by VenueId alone (line 51 ruling 6). BINDS qmn/loop and every consumer of qmb/runloop. PREVENTS forked live and backtest loops, look-ahead through a live feed, two orderings of one tick."
    cite: "SRC-11:.memlog.md#line-20"
    topics: [trading-node, tn-5, event-slice-loop, accumulator, interpretation-cursor]
    authority: rider

  - id: EXT-2099
    type: decision
    summary: "TN-6 THE ORDER PATH, CHAIN OF COMMAND WIRED NOT REDEFINED (as amended by both gates): the chain is bot, Book, BMS, operator (L36), wired without redefining a step. ENTRY-SIDE-ONLY BLOCKS as the node's own law (line 46 ruling 6; L39/AD-36): every block the node can raise — startup-reconciliation gating, rotation-store failure, unpersistable sink, partial write, node stand-down, a clock band, a full disk — refuses place_order and risk-increasing amend_protection and NOTHING ELSE, never cancel_order, close_position, close_all, a risk-non-increasing amend_protection, CT-23 close_full or tighten_protective_stop, nor the recording of evidence; a block that cannot be applied entry-side only IS NOT MINTED; where the venue path is unavailable a protective command becomes a standing protection intent (TN-7). THE ONE EXCEPTION IS THE PARENT'S OWN (line 51 ruling 1): AD-27's per-command UNKNOWN block is not a control and not an entry-side block — while an UNKNOWN is outstanding on a (VenueId, account) stream EVERY command on that stream is refused, protection included, because dispatching a close_position into a stream whose last submission's fate is unknown is how a position gets double-closed; the refused protective act stands as an AD-36 protection intent journaled before dispatch and re-decided when the block clears (re-deciding is not retrying); ONLY resolve_unknown clears it, never a reconciliation verdict. DOORS IN FIXED ORDER: the QL-7 bot callback over its declared footprint; the CT-23 Book door (admission, Book-resolved requested_r, the declared full-loss price derived by the per-family ExitLogicModule, which CONSUMES the bot's optional advisory_stop_proposal where the Book declares the ratified adopt-as-is module mode inside the existing module-id-plus-config shape, DEC-0185/DEC-0177); NO SCALE-IN (line 51 ruling 33) — an entry against an instrument on which the binding already holds an open VIRTUAL position is a policy rejection, stated over virtual positions so a netted account's shared venue position cannot mask it; protection windows (CT-31); SQS (AD-39, read only from the per-instant signal snapshot); bench (AD-41); the budget and sizing ladder (AD-40, over TN-25's virtual-ledger figures); the cohort-correlation slot; and L39 check_exit_preservation, wired and PROVEN on the live path. close_partial is NOT a V1 kind, so a Book- or bot-scoped partial exit is an `unsupported capability` refusal, never emulated by close-then-replace. BMS constraints are account-scoped (kill-line series, exposure, control-rank table). EXECUTION-TARGET RESOLUTION once at intent mint from the three AD-35 inputs (Book mode, seat state, active-control set), never from Book mode alone. THE PROTECTION GATE sits BEFORE command mint, entry-side blocking only, reading the KSA level fold at the effective scope, the standing-intent fold and the UNKNOWN block; risk-reducing commands pass every entry-side block unconditionally and dispatch ahead of place_order; the gate CONSUMES arbitration and never performs it. COMMAND MINT: fp1 identity including (VenueId, account), session epoch and the node-owned COMMAND ORDINAL — a different counter from the journal sequence and never the same object (line 46 ruling 9): the sequence is gapless per (writer, boot epoch) and restarts each boot epoch, the ordinal is monotone, never reused across the life of a stream, its high-water mark durable and recovered BEFORE the sequencers open, a stream that cannot recover it refusing to open. V1 maps into clientMsgId through a DURABLE COMMAND-ID-BINDING RECORD persisted BEFORE submission — (venue client id, command fp1, account, session epoch), named reconciliation evidence — because 100 characters cannot be a total injection over an fp1 digest space plus stream qualification. PROTECTIVE-STOP ATTACHMENT AT PLACEMENT (line 51 ruling 2): every place_order carries a venue-resident protective stop in the form CT-18 declares (the entry-relative form where absolute protection is unsupported for MARKET orders); where the Book requires attachment and CT-18 does not declare it, placement is an `unsupported capability` refusal — never a silently unprotected order — and AD-40's declaration stays the plan, never read back as the observed fill. COMPOUND COMMANDS fan out with derived child identities (parent fp1 plus declared ordinal), children ordered by child content fingerprint ascending, each observation- and journal-bearing, under a stated parent-outcome table (all accepted = accepted-by-venue; any child UNKNOWN = UNKNOWN; mixed = partially-executed; ALL rejected = rejected-by-venue, never partially-executed), scope resolving through the pinned versioned CT-30 table against the CT-18 position model and REFUSING rather than widening. VENUE SUBMIT through VenueClientPort: the pacer stays below the declared 50/s non-historical and 5/s historical ceilings PER CONNECTION; cancel_order, close_position, close_all and amend_protection are served ahead of place_order; suspend_new takes local effect instantly; THE SUBMISSION DEADLINE STARTS AT WIRE HANDOFF, never at mint; pacer admission time is a LOCAL QUEUE with its own bound whose breach is a typed veto-path refusal naming the pacer, never an UNKNOWN and never a stream block; a connection fault applies to EVERY stream bound to that connection, each journaling its own block. resolve_unknown, TWO PATHS WITH DECLARED PRECEDENCE, and the call is ITSELF A CT-20 OBSERVATION: an unambiguous observed-accepted|observed-absent read-back resolves automatically; ambiguous, absent or out-of-lookback requires operator attestation through the powers channel, the only path carrying a signer identity. AD-27's acknowledgement-mode consequence binds the outcome path — an outcome is NEVER derived from absence alone; a cancel resolved by read-back is accepted-by-venue only where the read-back shows no fill at or after the submit stamp, else rejected-by-venue (superseded-by-fill); a subject absent or already terminal AT SUBMISSION resolves without submission, never as a naked close; `denied-locally` stays an adapter pre-submission outcome minting an observation, never an authority-layer veto. Every door refusal is a `decision` event on the VETO PATH (CT-25's veto_ledger) carrying the refusing door and the would-have-been action; every arbitration loser is a `suppressed` control action on the SUPPRESSION PATH linked by `enacts` edges; ARBITRATION LIVES IN ONE COMPONENT — the control-action dispatcher in protection/, AD-37's one arbitration point per stream — strictly by rank with no arrival-order input, Tier 1 venue-resident actions outside the ordering, composing actions both executing, one command emitted where two actions produce the same mechanical command, a lower-ranked action never undoing a higher-ranked one, and a higher-ranked action never reducing the protection a lower-ranked one would have delivered. The risk dispatcher carries block-on-unpersistable exactly as the venue client does. VALUES THE NODE OWNS (do-not-default, UI-editable, blank or provisional-evidence blocks role=live): the submission deadline that mints UNKNOWN, the reconciliation lookback and cadence, the pacing and backoff cadence, the local-queue bound, the protective reserve capacity, the pool and health constants. RESPONSIBILITIES it owns (not values, never blank, never UI-editable): evaluating the AD-40 sizing ladder against live Book state, and issuing resolve_unknown under the two-path precedence. BINDS qmn/orderpath. PREVENTS a bot sizing itself, a second venue client, a timeout read as a rejection, an unjournaled refusal, a control that traps a position."
    cite: "SRC-11:.memlog.md#line-21"
    topics: [trading-node, tn-6, order-path, entry-side-only, command-ordinal, resolve-unknown]
