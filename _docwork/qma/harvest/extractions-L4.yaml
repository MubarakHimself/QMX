    cite: "SRC-13:.memlog.md:L36"
    topics: [qma, daemon, python-3.14, l31, one-runtime]
    authority: rider
  - id: EXT-2367
    type: decision
    summary: "QMA Stack table (spine Stack section, verified 2026-08-28): CPython 3.14 daemon runtime; SQLite 3.50.4 bundled, WAL, below the 3.51.3 multi-writer floor BY DESIGN under AD-6's one-connection sole-writer rule (floor binds only if sole-writer is relaxed); JSON-RPC 2.0 wire spec; websockets 17.1 transport implementation; JSON-Schema validator [UNPINNED] (build-gate choice, stated not omitted); MCP adapter surface revision 2026-07-28; uv 0.12.7; ruff 0.16.5; pyright 1.1.411; pytest 9.1.1; poethepoet 0.48.0; duckdb 1.5.5 (rebuildable fold views only); Docker Engine 29.7.2 (29.6.1 installed, Docker Desktop/WSL2 host); OpenTelemetry Python SDK 1.44.0 behind the export port; Hindsight v0.9.2 and pgvector 0.8.6 DEFERRED (arrive only with the deferred memory provider); OpenCodex 2.34.0 published / 2.31.0 installed (AD-15 routing behaviour is the local install's)."
