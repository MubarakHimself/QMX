    summary: "SPINE DEFERRED TABLE - every row with why it can wait or where it lands. KSA trigger-to-level-to-effect matrix VALUES: a PRE-SOAK operator ratification through the settings surface recorded as a config version, because the checklist exercises the matrix so live-blocking alone would leave the mechanism inert at the soak; TN-7 binds the shape and a blank or provisional-evidence cell blocks live money. A staging host: deliberately absent (TN-16's one-environment decision) with compensating controls named - the CI clean-install boot, the check-mode dry run, a replay diff of a recorded day, and the just node-rollback symlink flip onto a retained per-commit tree. Hardened OS-level confinement for seats (the one named deferred dependency of QL-8 Layer 2): the V1 controls are named once so no two units build two containment stories - seat_callback_deadline, seat_memory_ceiling, automatic seat quarantine with the operator-signed seat_reinstate as its only exit, the door layer's slice-progress watch and the supervised restart of last resort, plus QL-8's static scan and the stdlib process isolation of the Layer-2 runner. VPS procurement, Spotware app approval, live KYC and the swap-free admin-fee schedule in writing: human-only steps - VPS procurement gates the SOAK's start because CT-28 refuses a live binding without a rung baseline on this deployment tuple, while Spotware approval and live KYC gate GO-LIVE not the soak, so a late approval delays the live milestone and never the week. The platform-versus-venue identity axis: recorded, not modelled. Hot-apply of settings: V1 applies a config change at the next boot epoch and hot-apply is a later mint on the same versioned artifact. The MIS TRAINING plus SHADOW ROLLOUT EPIC: the models do not exist and must be trained, the job runs offline in a factory sandbox or on the operator's laptop and never on the trading VPS or the decision path, each run records its data window, RNG seed and training-code fp1, outputs are