id: CT-20
name: Venue event and reconciliation contract
status: ratified
version: 1  # first minted format version; the event-and-reconciliation law is spine-ratified (AD-27, AD-28), corpus signed off by the operator 2026-08-21 (DEC-0137, DEC-0138, DEC-0140); trading-node increment 2026-08-29 adds two observation KINDS (position read-back, balance read-back) mapping to the observation journal event type under AD-21's seven types — no eighth type, no second catalog — records lifecycle-stop as a candidate fourth UNKNOWN trigger (recorded-not-applied), and confirms the four reconciliation verdicts as the node's vocabulary with the automatic resolve_unknown issued only from an unambiguous reconciled read-back inside the lookback and operator attestation through the powers channel required for an ambiguous, absent or out-of-lookback read-back (DEC-0247, DEC-0248, DEC-0258)
owner: COMP-QMF-VENUE
consumers: []  # recording is via qmf-core-defined sink protocols injected at the composition root; no package imports qmf-venue, so no dependency edge exists and consumers are application-mediated (DEC-0138)
active_consumers: []
intended_consumers: [COMP-QMF-DATA, COMP-QMF-RISK]  # documentary targets until the factory wires them: Data records the observations and journal, Risk consumes reconciliation verdicts (DEC-0138)
wiring_status: ratified-shape-application-mediated  # shape ratified (AD-27, AD-28); no downstream consumer is wired and no build is authorized outside the factory pipeline
layer_from: middleware
layer_to: backend
decisions: [DEC-0048, DEC-0059, DEC-0061, DEC-0137, DEC-0138, DEC-0140, DEC-0141, DEC-0142, DEC-0148, DEC-0150, DEC-0158, DEC-0195, DEC-0247, DEC-0248, DEC-0258, DEC-0259]
gaps: []  # GAP-0005 (version policy), GAP-0030 (tick sources), GAP-0036 (command/uncertainty law), GAP-0037 (venue facts + broker), and GAP-0038 (adapter contract) answered 2026-08-20; the reconciliation verdict gains out-of-lookback and the read-back resolution generalizes to subject-terminal, both minted, not gaps (DEC-0158); reconciliation-verdict consequences are node/BMS authority, referenced as a pointer, never specified here (DEC-0142)
purpose: "The venue-neutral event and reconciliation contract: every inbound venue event is recorded verbatim and journaled before any interpretation, the order-state machine is a read-time fold over that observation stream, and reconciliation is an on-demand read-back whose verdict gates the command pipe only — the sensing pipe never blocks on it (DEC-0137, DEC-0138)."
invariants:
  - "Recording precedes interpretation: every inbound venue event is stored verbatim (with the mandatory receive stamps) and journaled BEFORE any state evaluation; no state machine gates the immutable store (DEC-0137, DEC-0138)."
  - "The order-state machine — client-submitted -> venue-accepted | venue-rejected | UNKNOWN; venue-accepted -> partially-filled* -> filled | cancelled | expired | closed-by-venue; server-initiated events the same shape, never errors — is a read-time fold over the observation stream per this contract's read-resolution rule, never a gate on recording; the accepted/rejected/UNKNOWN prefix states are the fold's projection of the command-outcome stream and are never the order's terminal state, which only fills and venue lifecycle events decide (DEC-0137)."
  - "An observation with no legal transition is recorded, annotated with a typed out-of-sequence edge, and forces the owning command to UNKNOWN pending resolution; adapters never synthesize venue observations — a derived state is a fold result, never a stored event (DEC-0137)."
  - "Command outcome and order state are separate streams, never merged: an order's terminal state is decided by fills and venue lifecycle events only, never by a command outcome (DEC-0137, DEC-0140)."
  - "CT-18 declares each command kind's acknowledgement mode (explicit-event | implicit-absence | none); an outcome is never derived from absence alone — a cancel resolved by read-back is accepted-by-venue only if the read-back also shows no fill for that order at or after the cancel's submit stamp, otherwise it resolves rejected-by-venue (superseded-by-fill) (DEC-0137, DEC-0138)."
  - "The read-back resolution GENERALIZES from cancels to every command whose subject can terminate independently: close_position, close_all, and amend_protection each carry a SUBJECT REFERENCE under the command identity discipline. A command whose subject is observed terminal at or after the submit stamp resolves rejected-by-venue (superseded-by-terminal-subject) — a NAMED OUTCOME, never UNKNOWN, never a stream block — with the subject-terminal observation as the named resolving evidence; a command whose subject is absent or already terminal at submission resolves WITHOUT SUBMISSION, never as a naked close. This is what lets a protective stop filling mid-amend resolve as a named outcome instead of blocking the stream (DEC-0148, DEC-0158)."
  - "Fill price, fill quantity, the venue instant, and the receive instant are mandatory identity fields of a fill observation (DEC-0137)."
  - "Every observation carries a declared venue-native identity key — (source, source-native id, revision) — so gap-replay redelivery deduplicates under the idempotent split; receive stamps, monotonic values, epochs, and correlation_id are declared occurrence/display-only in this contract's explicit exclusion list and never enter identity content (DEC-0137, DEC-0138)."
  - "This contract ships an exhaustive versioned mapping — (command kind x outcome) -> journal event type, (observation kind) -> journal event type — under the cardinality law: exactly one journal event per recorded observation, one per submission, one per outcome (DEC-0137, DEC-0138, DEC-0140)."
  - "Each multi-room write (raw archive, journal, registry room) is declared as one ordered unit with a named transaction boundary — atomic | ordered-with-recovery; a partial write is a storage-failure refusal that blocks the command stream and is journaled on recovery (DEC-0138, DEC-0140)."
  - "Reconciliation is an on-demand complete read-back of venue orders, fills, positions, and balance over a MANDATORY DECLARED LOOKBACK — an adapter parameter under the do-not-default standing, its existence and declaration QMF's and its value node's, declared in CT-18 (equity derived where the venue has no native field — nativeness declared in CT-18) — with QMF-owned verdict vocabulary reconciled | drift | unknown | OUT-OF-LOOKBACK, the fourth term added so that 'I cannot see that far back' is NEVER read as 'the position closed'; a standing protection intent (AD-36) re-evaluates ONLY against a reconciled verdict, while drift, unknown, and out-of-lookback alarm and hold the intent open without dispatching. Reconciliation gates the command pipe only — the sensing pipe never blocks on it — and when it runs and what a verdict triggers are node/BMS authority, recorded in tracker/trading-node-notes.md as a pointer, never specified here — superseded 2026-08-29: that authority is now ratified in docs/components/trading-node.md, see the TRADING-NODE USAGE note below (DEC-0137, DEC-0138, DEC-0142, DEC-0150, DEC-0158, DEC-0195, DEC-0259)."
  - "Receive wall time AND the boot-scoped monotonic stamp are mandatory on every inbound venue event; a latency rung is a monotonic delta within one boot epoch on one machine, and a wall-computed rung is refused as a baseline (DEC-0138)."
  - "Market data is not carried by this contract: ticks, bars, depth, gap-replay backfill, and historical paging enter as CT-10 source observations through qmf-data's CT-15 intake — application-mediated, no fifth contract, no new edge; a venue-native daily bar is ungoverned until its measured boundary is verified and minted as a venue-scoped market-hours calendar identity giving the bar a legal BarSpec anchor; this contract carries order-lifecycle events and reconciliation evidence only (DEC-0138)."
  - "All failures are typed refusals per registry:typed_refusal_codes; the correlation_id rides the recording context and is occurrence/display-only, never identity content (DEC-0109, DEC-0137)."
  - "TRADING-NODE USAGE (2026-08-29) — APPLIED: two rows are added to this contract's versioned mapping table — (position read-back) -> observation and (balance read-back) -> observation. The node therefore adds observation KINDS and NO JOURNAL TYPE: AD-21's seven event types are untouched, there is no eighth type and no second event catalog (DEC-0247)."
  - "TRADING-NODE USAGE (2026-08-29) — RECORDED-NOT-APPLIED: AD-27's UNKNOWN observation carries a trigger drawn from timeout | transport-error | disconnect. The node's shutdown contract mints an UNKNOWN per in-flight command at SIGTERM and ORDERS THAT MINT AFTER SESSION CLOSE so disconnect applies honestly rather than approximately; lifecycle-stop is recorded only as a CANDIDATE fourth trigger (which would let the mint precede session close), and until the parent rules it the disconnect-after-close ordering stands and nothing changes (DEC-0248)."
  - "TRADING-NODE USAGE (2026-08-29) — APPLIED: the four reconciliation verdicts already carried by this contract (reconciled | drift | unknown | out-of-lookback) are the node's vocabulary everywhere the node speaks — the startup and recovery sequence, the drift narrative, the read models the doors publish, the operator-facing lens pages and the glossary — superseding the GitBook baseline's three and the PRD's three; the AUTOMATIC resolve_unknown is issued only from a reconciled read-back INSIDE THE LOOKBACK (an unambiguous observed-accepted | observed-absent), while an ambiguous, absent or out-of-lookback read-back requires operator attestation through the powers channel, so out-of-lookback is a distinct nameable state rather than a silent failure to reconcile (DEC-0258)."
schema:
  type: venue-observation + reconciliation-evidence  # every inbound event recorded verbatim before interpretation; the order-state fold and reconciliation read-back are derived at read time (DEC-0137, DEC-0138)
  fields:
    - "raw_payload: the verbatim venue wire payload, stored and journaled before any state evaluation (DEC-0137, DEC-0138)"
    - "venue_native_identity: the (source, source-native id, revision) key used for gap-replay deduplication (DEC-0137, DEC-0138)"
    - "receive_wall_time: the mandatory wall receive instant on every inbound event (DEC-0138)"
    - "monotonic_stamp: the mandatory boot-scoped monotonic stamp; latency rungs are monotonic deltas within one boot epoch (DEC-0138)"
    - "observation_kind: the venue lifecycle event driving the read-time fold — submission acknowledgement, fill, cancel acknowledgement, expiry, close-by-venue — plus the typed out-of-sequence edge (DEC-0137)"
    - "fill_fields: fill price, fill quantity, venue instant, receive instant — the mandatory identity fields of a fill observation (DEC-0137)"
    - "out_of_sequence_edge: the typed annotation on an observation with no legal transition, forcing the owning command to UNKNOWN (DEC-0137)"
    - "subject_reference: the subject a close_position, close_all, or amend_protection command names (position or pending order), read by the subject-terminal resolution; a subject observed terminal at or after the submit stamp resolves rejected-by-venue (superseded-by-terminal-subject), a named outcome never UNKNOWN; a subject absent or already terminal at submission resolves without submission (DEC-0148, DEC-0158)"
    - "journal_event: the mapped journal event type under the exhaustive versioned mapping and the cardinality law — one per recorded observation, per submission, per outcome (DEC-0137, DEC-0138)"
    - "transaction_boundary: per multi-room write — atomic | ordered-with-recovery (DEC-0138)"
    - "reconciliation_readback: the on-demand read-back of orders, fills, positions, and balance over a mandatory declared lookback (a do-not-default CT-18 adapter parameter); equity derived where non-native (nativeness declared CT-18). Trading-node usage: position and balance read-backs are journaled as observations — (position read-back) -> observation and (balance read-back) -> observation, added to this contract's versioned mapping table as observation KINDS under AD-21's seven event types, never a new journal type (DEC-0137, DEC-0138, DEC-0158, DEC-0247)"
    - "reconciliation_verdict: reconciled | drift | unknown | out-of-lookback; gates the command pipe only, never the sensing pipe; a standing protection intent re-evaluates only against reconciled (DEC-0137, DEC-0142, DEC-0150, DEC-0158)"
  enums:
    - "order state (read-time fold, never stored): client-submitted | venue-accepted | venue-rejected | UNKNOWN | partially-filled | filled | cancelled | expired | closed-by-venue (DEC-0137)"
    - "observation kind: submission-acknowledgement | fill | cancel-acknowledgement | expiry | close-by-venue | out-of-sequence | position-read-back | balance-read-back; each maps to exactly one journal event type — the two reconciliation read-back kinds map to the observation journal event type under AD-21's seven types, no eighth type (DEC-0137, DEC-0140, DEC-0247)"
    - "acknowledgement mode (declared per command kind in CT-18): explicit-event | implicit-absence | none; an outcome is never derived from absence alone (DEC-0137, DEC-0138)"
    - "transaction boundary: atomic | ordered-with-recovery (DEC-0138)"
    - "reconciliation verdict: reconciled | drift | unknown | out-of-lookback; out-of-lookback is never read as position-closed, and a standing protection intent re-evaluates only against reconciled (DEC-0137, DEC-0150, DEC-0158)"
    - "subject-terminal read-back outcome: rejected-by-venue (superseded-by-terminal-subject) — the named outcome for a close_position | close_all | amend_protection whose subject is observed terminal at or after the submit stamp, never UNKNOWN, never a stream block; resolve-without-submission where the subject is absent or already terminal at submission (DEC-0148, DEC-0158)"
    - "occurrence/display-only exclusion list (never identity content): receive stamps, monotonic values, epochs, correlation_id (DEC-0137)"
    - "refusal categories in this contract's paths: registry:typed_refusal_codes — storage-failure (unpersistable journal event or partial multi-room write, blocking the command stream), policy-rejection (consuming a measured-but-unverified capability in evidence-bearing work), unavailable-dependency (an absent money exponent refusing that message's money decode) (DEC-0138, DEC-0109)"
  units:
    - "instants (venue instant, receive wall time): int64 UTC nanoseconds (DEC-0138)"
    - "monotonic stamp: a boot-scoped monotonic counter; latency rungs are monotonic deltas within one boot epoch on one machine, never wall-computed (DEC-0138)"
    - "fill price and quantity: foreign values stored verbatim with declared scales; a foreign binary float is never identity — it crosses the named boundary at receipt to a scaled integer at the per-value-class pinned target scale with a declared rounding mode, the raw float retained only as integrity-checked provenance (DEC-0138, DEC-0141)"
  nullability:
    - "the raw payload is never absent — recording precedes interpretation, so a verbatim store exists before any fold (DEC-0137)"
    - "fill identity fields (fill price, fill quantity, venue instant, receive instant) are never null on a fill observation (DEC-0137)"
    - "order state is never stored — it is a read-time fold result, so it has no persisted slot to be null (DEC-0137)"
    - "a reconciliation verdict is absent until a read-back runs, and it never gates the sensing pipe (DEC-0137, DEC-0142)"
