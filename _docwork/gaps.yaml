  - id: GAP-0004
    question: "What CI/CD tiers run on pull requests, protected-branch merges, and releases, and which exact commands gate each tier?"
    needed_by: [COMP-QMF-CORE, COMP-QMF-REGISTRY, COMP-QMF-DATA, COMP-QMF-INDICATORS, COMP-QMF-STRUCTURE, COMP-QMF-VENUE, COMP-QMF-RISK]
