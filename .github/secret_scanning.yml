# Belt-and-braces for GitHub's OWN secret scanning (not Skylos).
#
# The primary fix is upstream of this file: tools/tests/fixtures/secret/must_flag/
# now ships TEMPLATES, and tools/tests/test_secret_scan.py assembles the credential
# shapes at run time, so no tracked file in this repository carries a string any
# real-world detector matches. This entry keeps GitHub quiet about the secret
# gate's own corpus if a future fixture ever regresses, and it is scoped to
# exactly that corpus and its test - nothing else in the repository loses
# GitHub's secret scanning.
paths-ignore:
  - "tools/tests/fixtures/secret/**"
  - "tools/tests/test_secret_scan.py"
