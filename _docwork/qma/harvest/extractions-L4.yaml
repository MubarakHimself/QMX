  - id: EXT-2382
    type: decision
    summary: "DESK-LEVEL LEAD QUANT (memlog L28 question, follow-up ruling L29, assumption L63, resolution L133, narrowed L183; AD-7, AD-20, Deferred row): the operator's ruling 'task-level ledgers CONFIRMED correct; desk-level quant ledgers OK' read against the ledger-granularity item 'a desk-level lead quant keeps its own larger work ledger' RATIFIES the desk-level lead Quant as a persistent actor that keeps a Quant Ledger (opened while it carries its desk's lead flag, retained if the flag moves); but ONE lead flag per desk and the lead's mailbox as the catch-all for undeliverable Envelopes were INFERRED, never ruled, and sit in Deferred (GAP-0071) — until the operator rules, a second lead flag on a desk is a hard startup error and an undeliverable Envelope resolves to dead_letter (AD-20) rather than to the lead."
    cite: "SRC-13:.memlog.md:L183"
    topics: [qma, lead-quant, lead-flag, dead-letter, gap-0071]
    authority: rider
  - id: EXT-2383
    type: decision
    summary: "CONSTITUTION TOUCHPOINTS binding QMA read-only (spine Inherited Invariants table, traceability): L17 (human live-zone promotion — AD-24 mechanism, AD-25 act outside QMA), L18 (raw evidence retained locally AND an off-machine backup — AD-27), L30 (roster scope annotation of 2026-08-21 — AD-2 read-and-calculate edges), L31 (built with QMF, no contract re-implemented — AD-4/AD-2), L33, L34 (OS secret store / Windows Credential Manager — AD-24), L35 (adopted — a proposed transition may not write over an UNKNOWN, AD-12/AD-17), L36 (nothing above a bot touches the market), L38 (configurable = UI-editable — AD-26), L39 (no control blocks the recording of evidence); plus the parent conventions rows of the Inherited Invariants table. QMA may not amend a parent by assertion."
