name: QA Battery
# Permanent CI for the QA battery (card FC-34; OR-10a/b, NFR-02 / AR-11). Three gates on top of
# the separate Skylos gate (skylos.yml, deliberately left untouched):
#   * check     - `uv run poe check` in full: the four Tier-1 static scanners (money-path float,
#                 ambient-nondeterminism, mock-data, secret) plus fmt-check / lint / strict types /
#                 tests + coverage / the workspace-tool suite.
#   * vulture   - the dead-code finding count held at or below a committed baseline (ratchet DOWN,
#                 never up).
#   * mutation  - nightly mutmut on qmf-core exact.py + chrono.py with a 68% kill-rate floor.
#
# Runner-side setup mirrors the workspace pins: CPython from .python-version (3.14, AR-04) and a
# pinned uv, then `uv sync` for the default groups. Fail-closed throughout, the same discipline as
# skylos.yml: a gate that cannot run reads RED, never clean. Action SHAs are the exact pins copied
# from skylos.yml.
on:
  push:
    branches: [integration]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 02:17 UTC drives the mutation job only. GitHub runs scheduled workflows on the
    # default branch (main), which is exactly where the ratified exact.py / chrono.py live.
    - cron: "17 2 * * *"

# Read-only; nothing here writes to the repo. Job artifacts need no token.
permissions:
  contents: read

jobs:
  check:
    # The Tier-1 gate in full - the four scanners plus fmt/lint/types/tests/coverage. On every
    # push to integration and every PR into main; not on the nightly schedule (that drives
    # mutation only).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          # The interpreter this project targets - CPython 3.14, pinned in .python-version (AR-04).
          python-version-file: .python-version
      - name: Install uv (pinned)
        run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Sync the workspace (default groups)
        run: uv sync
      - name: poe check (Tier-1 - four scanners + fmt/lint/types/tests/coverage)
        run: uv run poe check

  vulture:
    # Dead-code ratchet: fail only if the finding count rises above the committed baseline.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install uv (pinned)
        run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Vulture count-vs-baseline gate (min-confidence 80)
        # Vulture is pure static AST analysis and imports nothing from the workspace, so no
        # `uv sync` is needed - `--no-project --with vulture==2.14` gives a minimal pinned env.
        # tools/vulture_gate.py enforces vulture's exit-code discipline (0/3 = ran; anything else
        # is a broken scan and fails closed) and fails only if the count exceeds the baseline.
        run: >
          uv run --no-project --with "vulture==2.14" python tools/vulture_gate.py
          --baseline qa/_trace/battery/vulture/gate-baseline-min80.txt
          --min-confidence 80 -- packages extensions qml qmb tools

  mutation:
    # Nightly mutation testing on the two ratified 100%-branch modules. Schedule-only (mutmut is
    # slow) and Linux-only. Kill-rate = killed / (killed + survived); floor 68% (OR-10b, from the
    # 2c8d495 baseline of 249 killed / 117 survived = 68.03%).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install uv (pinned)
        run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Sync the workspace (default groups)
        run: uv sync
      - name: Stage the mutmut config into qmf-core (disposable checkout)
        # The committed packages/qmf-core/pyproject.toml carries no [tool.mutmut]; append the
        # battery config so mutmut reads it from the current directory. Nothing is pushed.
        run: cat qa/_trace/battery/mutmut/mutmut_config.toml >> packages/qmf-core/pyproject.toml
      - name: Run mutmut
        working-directory: packages/qmf-core
        # mutmut exits nonzero whenever survivors exist; the kill-rate gate below is what decides,
        # so this step must not fail the job on survivors alone.
        run: uv run --project "$GITHUB_WORKSPACE" --with "mutmut==3.3.0" mutmut run 2>&1 | tee mutmut-run.log || true
      - name: Collect the per-mutant results
        working-directory: packages/qmf-core
        run: uv run --project "$GITHUB_WORKSPACE" --with "mutmut==3.3.0" mutmut results > mutmut-results.txt 2>&1 || true
      - name: Kill-rate gate (floor 68%)
        working-directory: packages/qmf-core
        # Primary signal: mutmut's final run tally (🎉 killed / 🙁 survived), read as the LAST such
        # counts in the captured run log so the progress spinner does not confuse it. Fallback: the
        # per-mutant results listing (`<name>: killed` / `<name>: survived`). Fail-closed if neither
        # yields any classified mutant - an empty parse means the run broke, not that it passed.
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          run_log = pathlib.Path("mutmut-run.log").read_text(encoding="utf-8", errors="replace")
          killed_counts = re.findall("\U0001F389\\s*(\\d+)", run_log)   # party popper = killed
          survived_counts = re.findall("\U0001F641\\s*(\\d+)", run_log)  # frowning face = survived
          if killed_counts and survived_counts:
              killed, survived = int(killed_counts[-1]), int(survived_counts[-1])
          else:
              results = pathlib.Path("mutmut-results.txt").read_text(encoding="utf-8", errors="replace")
              killed = sum(1 for line in results.splitlines() if line.rstrip().endswith(": killed"))
              survived = sum(1 for line in results.splitlines() if line.rstrip().endswith(": survived"))

          total = killed + survived
          if total == 0:
              print("::error::mutation gate: parsed no killed/survived mutants - the run broke; "
                    "refusing to treat that as a pass")
              sys.exit(2)
          rate = 100.0 * killed / total
          print(f"mutation gate: {killed} killed / {survived} survived = {rate:.2f}% kill-rate (floor 68%)")
          if rate < 68.0:
              print(f"::error::mutation gate: kill-rate {rate:.2f}% is below the 68% floor")
              sys.exit(1)
          print("mutation gate: OK")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: mutmut-results
          path: |
            packages/qmf-core/mutmut-run.log
            packages/qmf-core/mutmut-results.txt
          if-no-files-found: warn
          retention-days: 30
