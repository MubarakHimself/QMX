  # --- Foundation architecture sitting 2026-08-19/20: ratified spine AD-1..AD-21 (SRC-03), transcript SRC-04 ---

  - id: DEC-0099
    title: "Runtime matrix (AD-1)"
    statement: "CPython 3.14 is pinned across all packages, CI, and factory sandboxes; tier-1 tested targets are Windows 11 x86-64 and Ubuntu LTS x86-64; QMF code stays pure-Python and OS-neutral, with other platforms working by construction but untested in V1."
    status: ratified
    rationale: "One pinned interpreter prevents version skew from making results non-comparable across factory sandboxes; the two tier-1 targets are the operator's real machines."
    sources: [EXT-2001, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, runtime]

  - id: DEC-0100
    title: "One repo, seven packages (AD-2)"
    statement: "QMF is a single uv workspace repository with seven installable packages (qmf-core, qmf-registry, qmf-data, qmf-indicators, qmf-structure, qmf-venue, qmf-risk) importing as the qmf.* PEP 420 namespace with no qmf/__init__.py anywhere, src/ layout, uv_build backend, one committed uv.lock, lockstep roster versioning, explicit per-package dependency declarations verified by isolated per-package test environments, and a test-only dependency carve-out for running a contract's conformance tests; calendar extensions are separate versioned packages outside the roster on their own SemVer ladder; shared nouns are defined in qmf-core and their records owned by qmf-registry."
    status: ratified
    rationale: "One workspace avoids cross-repo coordination tax, namespace shadowing, and silent sibling-dependency leaks while keeping sandboxes able to install single packages."
    sources: [EXT-2002, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, packaging]

  - id: DEC-0101
    title: "Quality toolchain (AD-3)"
    statement: "QMF's own source is governed by ruff (format and lint), pyright strict workspace-wide, and pytest; coverage is measured per package on every change with an 80% floor and 100% branch coverage on the modules implementing CT-01 and CT-02 primitives; public value types are frozen dataclasses and seams are typing.Protocols; canonical commands are poe fmt, lint, types, test, check; every package ships executable tests and reference usage as tier-1 artifacts."
    status: ratified
    rationale: "One toolchain prevents per-agent tool drift in factory-written code; strictness governs QMF's own source while consumers stay unconstrained per the don't-box-in ruling."
    sources: [EXT-2003, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, quality]

  - id: DEC-0102
    title: "Three quality tiers bound to factory events (AD-4)"
    statement: "Tier 1 (poe check) runs on every factory work unit; tier 2 (poe check-integration, adding integration and contract tests with each package in an isolated environment) runs on landing into the integration branch; tier 3 (poe check-release, adding package builds and clean-install smoke on both tier-1 OSes) runs on ship; a contract test is an executable conformance suite for a CT-* contract's public shape, owned by the contract's owning package and run by producer and consumers at tier 2; commands stay host-neutral until a CI remote exists."
    status: ratified
    rationale: "Binding gates to factory events instead of Git-host mechanics keeps 'tests pass' meaning one defined thing on every machine."
    sources: [EXT-2004, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, gates]

  - id: DEC-0103
    title: "Two version ladders; meanings never mutate (AD-5)"
    statement: "Code packages use SemVer in lockstep across the roster (0.x until the V1 blueprint ships) with a one-release deprecation window; every serialized contract carries its own integer format version stamped into every artifact, and a format version's meaning never changes after the fact — incompatible change mints the next version plus a migration note; QMF never loses the ability to read old stored evidence; re-derivation under a newer calendar or tzdata version produces a new artifact with its own fingerprint and a lineage edge, never a rewrite."
    status: ratified
    rationale: "Separating the code ladder from contract format versions is what keeps history readable forever while packages evolve."
    sources: [EXT-2005, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, versioning]

  - id: DEC-0104
    title: "Dependency and licence tiers; zero-dependency core (AD-6)"
    statement: "Permissive licences (MIT, BSD, Apache, PSF) are freely allowed; LGPL only unmodified and separately installed; GPL and AGPL are prohibited; strategy-family libraries and platform-imposing dependencies (own event loop, runtime, or data model) are prohibited; qmf-core takes zero outside dependencies; every dependency gets one line in the workspace-root DEPENDENCIES.md register stating name, licence, and why."
    status: ratified
    rationale: "The tiers prevent licence contamination and foreign-platform capture while keeping the sandbox-critical core weightless."
    sources: [EXT-2006, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, dependency-policy]

  - id: DEC-0105
    title: "Exact money (AD-7)"
    statement: "Money, Price, and Quantity are whole-number integer counts at a declared scale — Money(currency, scale), Price(instrument, scale) as an instrument-tagged ratio never tagged with a single currency, Quantity(unit, scale) with opaque units; mixed-scale arithmetic auto-promotes losslessly or refuses, never silently rescales; the money path is a taint — any value transitively contributing to an order quantity, price, P&L, or balance bans binary float regardless of computing package, and floats cross back only at named conversion boundaries with an explicitly stated rounding mode; foreign money is stored verbatim as evidence with declared scales; analytic float series stay permitted off the money path with label-derived identity."
    status: ratified
    rationale: "Scaled integers with a taint-rule money path prevent float drift, non-deterministic fingerprints, and unreconcilable broker disputes."
    sources: [EXT-2007, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, money, contract]

  - id: DEC-0106
    title: "Exact time and calendars (AD-8)"
    statement: "Every stored timestamp is int64 UTC nanoseconds since the Unix epoch (POSIX no-leap-second semantics, range 1677–2262, checked arithmetic); civil date and trading date are distinct types with TradingDate carrying its calendar identity and version in-band; Duration (signed int64 ns, clock-agnostic) and half-open Interval live in core; wall and monotonic clocks are type-separated and a monotonic reading is never an Instant; clock access is a core protocol injected at the composition root; record streams carry per-writer strictly-increasing sequences with (instant, writer, sequence) as a replay-determinism device without causal meaning, and WriterId is a first-class core noun; calendar identity is the rule set (plus tzdata version in fingerprints), split into accounting rollover and session schedule, with the account-scoped day-boundary calendar a third named kind; the forex market-hours calendar ships first with a 17:00 America/New_York rollover, weekend gaps, and holidays in scope, swap-Wednesday dropped; calendar extensions pin tzdata and verify the resolved version at import; foreign timestamps are stored verbatim as evidence with conversions derived under lineage."
    status: ratified
    rationale: "The two-lens-audited time model keeps results identical across server moves, DST shifts, tzdata updates, and clock corrections."
    sources: [EXT-2008, EXT-2029, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, time, contract]

  - id: DEC-0107
    title: "Instrument, venue, and account identity (AD-9)"
    statement: "Instrument identity is (venue, venue's own symbol) with the symbol opaque and never parsed; VenueId is operator-minted, opaque, stable, never derived from mutable broker attributes and never reused, with a distinct broker or legal entity a distinct venue even on shared infrastructure; renames and mutable metadata are separate dated records and stored history never rewrites; Venue and Account are distinct first-class nouns defined in qmf-core with records owned by qmf-registry; one venue may hold many accounts, each with a role (live, demo, paper-validation, paper-benched, prop-firm), and Books bind to accounts; multi-broker operation and broker migration are normal cases."
    status: ratified
    rationale: "Opaque operator-minted identity keeps brokers' records separate, survives renames, and carries the ~6-broker specialization plan without framework change."
    sources: [EXT-2009, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, identity, contract]

  - id: DEC-0108
    title: "Deterministic fingerprints, fp1 recipe (AD-10)"
    statement: "The canonical serializer and fingerprint function live only in qmf-core; the pinned fp1 recipe is UTF-8 JSON with lexicographically sorted keys at every depth, no insignificant whitespace, NFC-normalized strings, integer-only identity numerics with floats refused in identity content, null prohibited (absent value = omitted key), order-significant arrays, hashed SHA-256 and emitted as fp1:sha256:<hex>; recipe upgrades mint fp2 while old fingerprints stay valid forever; every field is identity by default and display-only exclusion requires an explicit versioned contract declaration; float-bearing artifacts take label-derived identity with integrity checksums and provenance; idempotent byte-identical re-writes are accepted silently while true collisions are refused and alarmed."
    status: ratified
    rationale: "One pinned implementation is the only way two conformant producers and merging sandboxes agree on identity."
    sources: [EXT-2010, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, fingerprints, contract]

  - id: DEC-0109
    title: "Typed refusals, seven categories (AD-11)"
    statement: "Every public QMF operation succeeds or returns a typed refusal carrying category, machine-readable context, and retryability (yes, no, or after-condition); the seven categories are invalid input, unsupported capability, unavailable dependency, stale evidence, policy rejection, transient venue failure, and storage failure; categories are addable in later versions, never redefined; public boundaries return refusals as result unions and exceptions are reserved for programmer error; value types construct through one pattern everywhere — an unchecked constructor plus a validating try_create factory returning value-or-refusal."
    status: ratified
    rationale: "Returned typed refusals let agents and consumers reason about failure without parsing prose, and the storage-failure category covers the I/O surface the data area added."
    sources: [EXT-2011, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, refusals, contract]

  - id: DEC-0110
    title: "Result label and worlds (AD-12)"
    statement: "Every computed result entering evidence carries producer contract format version, input fingerprints, evidence time range, computation identity, and world — together its identity, with human display names outside identity; computation identity is content-derived so identical work from two sandboxes deduplicates, while the occurrence record is separate provenance; worlds are live (real venue clocks and quotes — account role carries money-reality, so paper and demo runs are world live and stay comparable for alpha-decay sensing), replay (data-driven injected clock over recorded history), and simulated (reserved but unusable in V1 — writing it into governed evidence is a policy rejection until the backtesting sitting defines simulated-time typing); a non-live world may never write into the live evidence namespace and factory sandboxes never produce timestamps that enter an evidence store."
    status: ratified
    rationale: "The five-part label makes results self-identifying and mergeable across sandboxes while storage separation, not identity alone, delivers world isolation."
    sources: [EXT-2012, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, result-label, contract]

  - id: DEC-0111
    title: "Measure-then-budget performance (AD-13)"
    statement: "QMF invents no performance numbers: every component ships a benchmark harness with the same status as unit tests, measuring speed and peak memory at a load ladder in framework-native units sized around the roughly-forty-bot scenario (with 10/100/200 marks); first real measurements are recorded as fingerprinted baselines scoped to a declared (OS, CPU-class) tuple, with per-benchmark regression thresholds stated as multiples of measured run-to-run variance; regressions beyond threshold — memory equally with speed — fail the tier-2 merge gate; the one stated design constraint is that qmf-core imports in well under one second; benchmark and test data are generated or controlled fixtures, never shipped product artifacts."
    status: ratified
    rationale: "Baselines from real measurement stop the factory optimizing against invented numbers and make slow rot attributable."
    sources: [EXT-2013, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, performance]

  - id: DEC-0112
    title: "Loud failure and traceable behavior (AD-14)"
    statement: "Errors and refusals always carry context and are never swallowed; structured logging propagates a correlation_id field across every package boundary; every component exposes a no-argument health() returning a typed report; logs are not journals — operator-facing log text renders UTC ISO-8601 with explicit Z while journals and evidence streams store int64 UTC ns plus writer and sequence, with ISO-8601 permitted only as a display-only field excluded from identity; emitted signals must be exportable to Prometheus-class monitoring stacks, with the stack choice and full monitoring design owned by the node/ops sitting."
    status: ratified
    rationale: "A solo operator cannot afford multi-hour what-broke hunts; the obligation binds now even though the monitoring stack lands later."
    sources: [EXT-2014, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, observability]

  - id: DEC-0113
    title: "Concurrency stance (AD-15)"
    statement: "QMF values are immutable and safe to share by construction; purity binds the pure-computation libraries (core, indicators, structure); components owning an external resource (stores, recorders, adapters) are the stateful class and follow one-writer-per-stream with unlimited readers, where the writer is the holder of an AD-8 WriterId; QMF never spawns threads or background work — applications own all concurrency; async APIs exist only at the venue network edge, never in core or the libraries."
    status: ratified
    rationale: "The stance supports unlimited parallel experimentation safely and prevents async contagion through every signature."
    sources: [EXT-2015, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, concurrency]

  - id: DEC-0114
    title: "Registry records and lineage (AD-16)"
    statement: "The registry uses per-kind record schemas — each its own versioned contract — sharing a tiny common header of kind, contract format version, at-birth parent references, writer, and sequence; a record's stable id is derived from its fp1 fingerprint, never minted, with created-at and occurrence facts declared display-only so identical work from two sandboxes deduplicates; lineage accruing after birth lives exclusively in append-only typed edge records (supersedes, promoted-from, occurrence-of, corroborates, disagrees-with) referencing fingerprints, stored as pinned JSONL (one fp1-canonical object per line, LF-terminated, append-with-fsync, size-based rotation with monotonic ordinals) with local rebuildable indexes; kinds are addable and never redefined, Bot and Book kinds are reserved names, and no database server exists."
    status: ratified
    rationale: "Per-kind cards honor the dead universal-recipe-card ruling while fingerprint-derived ids make sandbox merges deduplicate by construction."
    sources: [EXT-2016, EXT-2028]
    component: COMP-QMF-REGISTRY
    tags: [architecture-spine, registry, lineage]
    supersedes: [DEC-0036]

  - id: DEC-0115
    title: "Multiplicity at every layer (AD-17)"
    statement: "A Bot contains one-or-more confluences; a confluence contains one-or-more levels, triggers, and confirmations; components may compose, with a composite its own artifact carrying lineage to its children; no layer of the bot vocabulary may hardcode exactly-one; multiplicity collections are canonically ordered by child fingerprint ascending unless the owning contract declares order significance; Bot identity is its content, while the Bot-Book-account binding is a separate dated binding record outside Bot identity — one Bot at exactly one Book at any time, with re-binding (paper to live) never minting a new Bot so paper and live performance stay comparable; exits remain Book, risk, and node territory."
    status: ratified
    rationale: "The operator's zoom-out ruling generalizes the one-or-more answer recursively so no cardinality-one assumption forecloses experiments."
    sources: [EXT-2017, EXT-2028]
    component: COMP-QMF-REGISTRY
    tags: [architecture-spine, bot, contract]
    supersedes: [DEC-0040]

  - id: DEC-0116
    title: "Promotion record skeleton (AD-18)"
    statement: "The registry reserves a promotion-occurrence card kind: human-only signer, signed immutable record, and a mandatory plain-words summary field explicitly declared an identity field so the signature attests the exact words the human read (a typo fix mints a new record with a supersedes edge); V1 signing is the operator's recorded approval captured as an immutable occurrence attesting the record's fp1 string with reviewer identity and instant — no cryptographic dependency now; the registry card is canonical and the journal's promotion event carries only the card's fingerprint plus correlation_id; the evidence checklist accretes from the data, backtesting, and risk sittings; the promotion gate itself — workflow, UI, timing — is platform territory outside QMF."
    status: ratified
    rationale: "The skeleton preserves the human-only promotion law with a durable, human-legible record while later sittings fill the evidence list."
    sources: [EXT-2018, EXT-2028]
    component: COMP-QMF-REGISTRY
    tags: [architecture-spine, promotion, live-money-gate]

  - id: DEC-0117
    title: "Data rooms, stores, and bitemporal law (AD-19)"
    statement: "qmf-data defines seven room-roles — ingest door, immutable raw archive, processed, journal, split-governed research door, backup, and the registry room (holding qmf-registry's records and lineage under the same retention, backup, and migration law) — instantiated per world, with a cross-world read a policy-rejection refusal; the stores are Parquet for columnar time-series, DuckDB for local analytics, SQLite for transactional metadata, and JSONL for append streams, each behind a QMF-owned contract with stdlib-typed boundary signatures and no database server; only raw-archive and journal formats are evidence-bearing — analytics engines hold rebuildable views, engine majors are pinned per release, and 'rebuildable' licenses deletion only of artifacts no result label cites; every external fact carries event-time, known-at, source, and revision, where source is a core provenance noun orthogonal to VenueId, and corrections are appended, never overwritten."
    status: ratified
    rationale: "Right-stack-for-the-right-job behind owned contracts keeps engines swappable and makes an engine format break cost a rebuild, never evidence."
    sources: [EXT-2019, EXT-2028]
    component: COMP-QMF-DATA
    tags: [architecture-spine, data, persistence]
    supersedes: [DEC-0043, DEC-0047]

  - id: DEC-0118
    title: "Migrations, retention, backup (AD-20)"
    statement: "Migrations run preflight checks, backup first, dry-run, migrate, verify, with a documented restore path and never in-place mutation of the only copy; raw originals and lineage are kept forever; time-series is partitioned by source, instrument, and time window; journal trimming rules are set only after measured volume; the ratified backup design is nightly, encrypted, versioned, off-machine to an object-storage bucket, with automated sample-restore tests and periodic full-restore rehearsal — QMF provides the backup, restore, and verify primitives (CT-14, CT-26) while applications own schedule and execution; encryption key custody and the crypto dependency are named at the node/ops sitting; topology: the trading-node VPS records and syncs down, the workstation holds the working archive, the bucket catches nightly copies."
    status: ratified
    rationale: "Backup-first migration and keep-raw-forever remove the class of upgrade that destroys the only copy; the primitives-versus-schedule split preserves the toolbox boundary."
    sources: [EXT-2020, EXT-2028]
    component: COMP-QMF-DATA
    tags: [architecture-spine, backup, migrations]

  - id: DEC-0119
    title: "Splits, journal events, and the doors to outside (AD-21)"
    statement: "Dataset splits are fingerprinted, time-ordered, non-overlapping manifests, each pinning exactly one calendar identity and version in-band and refusing rows carrying another; boundaries are explicit stored TradingDates or instants, never civil dates, and the seal boundary is a frozen TradingDate never re-derived under later tzdata; the 12-month seal is a no-peek lock (not retention) enforced now as a policy-rejection refusal at every qmf-data read boundary — raw, processed, research door, and restored backups alike — independent of the deferred GAP-0016/0017 gates, with one logged final look journaled as a named control-action subtype; the journal is N streams, one per producing component under its WriterId with gapless per-(writer, boot-epoch) sequences, recording seven event types (decision, order, fill, risk transition, promotion, data quality, control action), with correlation_id a linking annotation excluded from fp1 identity by explicit versioned declaration and causal linkage via typed edges, never timestamps; source adapters get qmf-data-defined contracts, normalization, validation, and idempotent intake keyed on (source, source-native id, revision), while applications own scheduling, retries, supervision, and UI; the news-calendar recorder keeps provider-native identity and revisions; tick sources are separately identified with bid and ask preserved and disagreements kept visible via corroborates and disagrees-with edges, never merged."
    status: ratified
    rationale: "The seal as an enforced read-boundary refusal stops research consuming its own exam questions today, without waiting for the deferred causality gate."
    sources: [EXT-2021, EXT-2028]
    component: COMP-QMF-DATA
    tags: [architecture-spine, splits, journal, adapters]

  - id: DEC-0120
    title: "Default-deny dependency direction; first ratified edge registry-to-data"
    statement: "qmf-core depends on nothing; every package may depend on qmf-core; nothing imports qmf-venue or qmf-risk; until an inter-library edge is ratified as a spine amendment, no package may depend on any package other than qmf-core; the first and only ratified edge is qmf-registry to qmf-data (2026-08-20), through which the registry persists records and lineage via the CT-11 append-store contract with stdlib-typed signatures at the boundary; calendar extensions implement core protocols from outside the roster."
    status: ratified
    rationale: "Default-deny keeps the dependency graph a governed artifact instead of an accretion; the one ratified edge keeps registry records in the same filing room as all other evidence."
    sources: [EXT-2022, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, dependencies, law]

  - id: DEC-0121
    title: "Look-ahead gate and attempt counter deferred to the backtesting sitting"
    statement: "GAP-0016 (look-ahead/causality registration gate) and GAP-0017 (attempt counter) are operator-deferred to the backtesting sitting, with the consequence knowingly accepted that artifacts registered before then carry no causality evidence and that evidence is not retroactively reconstructible; the bitemporal ingredients (event-time versus knowledge-time) remain ratified via AD-8 and CT-10, and registry occurrence records still log every run so the tally's raw material accrues without policy."
    status: ratified
    rationale: "The operator reads both mechanisms as backtesting-entangled; deferring them keeps the foundation sitting from freezing half-designed research governance."
    sources: [EXT-2023]
    component: COMP-QMF-REGISTRY
    tags: [architecture-spine, deferral, causality]

  - id: DEC-0122
    title: "Everything downstream is built with QMF libraries"
    statement: "Everything downstream of QMF — the trading node, backtesting, the agentic system, and the UI — is built with QMF libraries; no downstream deliverable re-implements or bypasses the framework's contracts."
    status: ratified
    rationale: "The operator's standing principle (2026-08-19) makes QMF the single quantitative foundation so every later layer lands as a consumer, not a rebuild."
    sources: [EXT-2024]
    component: COMP-QMF-CORE
    tags: [law, scope, foundation]

  - id: DEC-0123
    title: "cTrader time-handling research is evidence pending GAP-0037"
    statement: "The delivered cTrader Open API time research (UTC milliseconds platform-wide; 17:00 America/New_York daily bar boundary; trendbars BID-derived per staff confirmation; no server-clock primitive; 50/s and 5/s rate limits with 1-week tick spans) is recorded evidence for the venue sitting and is not adopted; no cTrader timestamp is trusted as UTC until venue verification under GAP-0037."
    status: superseded
    superseded_by: DEC-0135
    rationale: "The research protocol never auto-adopts findings; the venue sitting ratified them 2026-08-20 as DEC-0135 with corrected evidence grades — the 2013-forum-grade claims (17:00-NY boundary, BID-derived trendbars) were demoted and replaced by measure-per-broker adapter obligations."
    sources: [EXT-2025]
    component: COMP-QMF-VENUE
    tags: [study-delivered, source-unratified, ctrader]

  - id: DEC-0124
    title: "Freeze-choice status after the foundation sitting"
    statement: "Of the six qmf-core freeze choices, three are now ratified contracts — the UTC time encoding (DEC-0106), instrument identity (DEC-0107), and the result-label tuple (DEC-0110) — while canonical indicator arithmetic (GAP-0032), the backtest fidelity taxonomy (GAP-0048), and the SR* threshold (GAP-0049) remain open for their own sittings."
    status: superseded
    superseded_by: DEC-0134
    rationale: "The foundation sitting resolved the encoding-level choices; the remaining three belong to the indicator and backtesting areas."
    sources: [EXT-2027, EXT-2028]
    component: COMP-QMF-CORE
    tags: [architecture-spine, scope]
    supersedes: [DEC-0032]

  - id: DEC-0125
    title: "Five-hats sweep is an input register for remaining sittings"
    statement: "The five-hats sweep (44 findings, reviews/five-hats-sweep.md in the architecture sitting workspace) is an input register feeding the indicator/structure, venue, risk, backtesting, and ops sittings; it is referenced by the documentation, not resolved by it."
    status: ratified
    rationale: "The operator commissioned the sweep as forward-looking input; resolving its items here would pre-empt sittings he has not held."
    sources: [EXT-2026]
    component: null
    tags: [architecture-spine, backlog]

  - id: DEC-0126
    title: "CT-16 indicator protocol and series vocabulary (AD-22)"
    statement: "CT-16 is one contract with two conformant modes, batch and streaming, consumer-blind across bots, structure, MIS, and backtesting; the series vocabulary (Bar, Tick/Quote, BarSpec, series references, the exact-rational parameter type) is defined in qmf-core as shared nouns, and BarSpec — a discriminated aggregation rule (time-interval, tick-count, volume-threshold, notional-threshold, price-brick, range, session) with exact parameters and, for time-based kinds, the anchoring calendar identity and version — replaces the bare word timeframe everywhere; bar aggregation is a fingerprinted qmf-data derivation. The bulk form is a frozen value over a read-only memoryview of immutable little-endian int64 bytes with per-channel out-of-band metadata (scale, kind, unit, quote side) and a parallel integer-encoded presence map (present, provisional, not_ready, gap, absent_by_schedule) with NaN and sentinels prohibited. A configured indicator's identity is the entire declared configuration — formula id, contract format version, exact-rational parameters, the ordered named input set with upstream fingerprints, declared calendar requirements including tzdata version, alignment and missing-value policies, warm-up, output schema, supported modes, and the arithmetic-reference configuration — and that fingerprint is the only dedup key. Warm-up is an integer count of completed input observations in the input series' own sample unit, identical across modes, at least the reference's lookback. Outputs declare an ordered named channel schema, are full-length and index-aligned, and every sample carries a knowable-at instant; provisional samples never enter governed evidence. Only as-of alignment is permitted for governed evidence; a market-hours-closed position is absent_by_schedule, never a gap. Where both modes are declared, a tier-2 equality law binds them (same-process, same-build, integer-ULP comparator, cold initial state) with a separate restore-equivalence test. Streaming instances are the named AD-15 stateful class with exactly one WriterId-holding feeder and unlimited readers; snapshots are AD-5 serialized contracts scoped to a declared (OS, arithmetic-reference build) tuple. Two named AD-7 conversion boundaries (exact-to-analytic descale, analytic-to-exact return) have one qmf-core implementation each. Custom indicators are authorable as plain Python outside governed evidence, always; entering governed evidence requires CT-16 conformance as an AD-2 extension registered explicitly at the composition root. qmf-indicators depends on qmf-core only."
    status: ratified
    rationale: "Answers GAP-0031 (memlog entries 51 and 60): one consumer-blind contract keeps research and the live path computing the same numbers; identity as the entire declared configuration prevents silent merges of non-equal computations; shared instances keyed by configuration fingerprint resolve the operator's scaling concern; the presence map and knowable-at make missingness and knowledge time first-class instead of NaN folklore."
    sources: [EXT-2032, EXT-2040, EXT-2031]
    component: COMP-QMF-INDICATORS
    tags: [architecture-spine, indicators, ct-16, series-vocabulary, gap-0031]

  - id: DEC-0127
    title: "Canonical arithmetic: TA-Lib 0.7.1 pinned by artifact, upgrades gated (AD-23)"
    statement: "Where the pinned reference implements a formula, wrapping it is mandatory and it is canonical; where it does not (VWAP, Ichimoku, session-anchored levels, structure arithmetic, QMX-original formulas), the QMX implementation is the canonical arithmetic for that formula under the identical upgrade gate. The pinned reference is TA-Lib, pinned per QMF release as the lockfile-resolved artifacts (distribution filename plus hash) of both the C library and the Python wrapper — 0.7.1 + 0.7.1, verified current 2026-08-20 — with the reference's process-global configuration held in a declared, identity-bearing reference-configuration record asserted at import (unavailable dependency on mismatch) and never mutated at runtime. Upgrades are gated, never silent: the comparison suite runs first; an output change for identical canonical inputs mints the per-configured-indicator contract format version with recorded before/after evidence; an output-identical upgrade re-pins without a mint. Dual-reference checks are registered comparison artifacts (input fingerprint, parameter fingerprint, declared tolerance, verdict); tolerances and the mode comparator are declared as integer ULP counts or scaled-integer pairs, never decimal text or floats. AD-23 binds every producer of governed evidence, extensions included; no governed producer re-implements arithmetic another governed producer publishes. Streaming implementations are QMX-owned and held equal to the canonical batch arithmetic by the CT-16 equality law."
    status: ratified
    rationale: "Answers GAP-0032 (memlog entries 52 and 60): the artifact-hash pin plus the reference-configuration record make the attested arithmetic reproducible rather than a version string's promise; TA-Lib 0.7.1's own MACD/MACDFIX/TRIX/ULTOSC period=1 change is the recorded precedent that reference upgrades are contract events; per-configured-indicator mints keep unchanged indicators deduplicating across an upgrade."
    sources: [EXT-2033, EXT-2040, EXT-2031]
    component: COMP-QMF-INDICATORS
    tags: [architecture-spine, indicators, talib, arithmetic, gap-0032]

  - id: DEC-0128
    title: "Light vs heavy: budget-declared, benchmark-policed (AD-24)"
    statement: "A configuration is light iff it declares and benchmark-proves four bounds: per-update cost within the live-path latency rung; bounded declared state size within the owning contract's ceiling; either a bounded declared evidence window or a declared anchor-reset rule with O(1) per-update cost (an anchored configuration declares its anchor kind so embargo widths compute from the anchor); and synchronous availability on the trading path, which a marked not-ready value satisfies. The same four bounds bind structure families (per-update cost, bounded live-object-set size, bounded scan window, synchronous availability). The declared budget is contract surface; the light/heavy verdict is a machine-scoped AD-13 benchmark artifact declared display-only and never enters identity. Until the live-path rung has a recorded baseline, every configuration is heavy by default and a light claim is refused at the gate. A heavy configuration's synchronous entry point returns unsupported capability; heavy runs off the trading path (MIS/research side, node territory), computed once and fanned out through the same contracts, and every fanned-out heavy value carries the instant and input sequence of its last input — consuming one past its declared maximum age is a stale-evidence refusal. Classification is per configuration, never per name."
    status: ratified
    rationale: "Answers GAP-0033 (memlog entries 53 and 60), the sole nonblocking gap: classification by declared budget plus benchmark proof replaces classification by name or vibe; keeping the verdict out of identity stops machine-scoped measurements from splitting artifact identity across hosts."
    sources: [EXT-2034, EXT-2040]
    component: COMP-QMF-INDICATORS
    tags: [architecture-spine, indicators, light-heavy, budgets, gap-0033]
    supersedes: [DEC-0056]

  - id: DEC-0129
    title: "CT-17 causal structure lifecycle (AD-25)"
    statement: "A structure family is a type of chart object — never a strategy, bot, or Book category, and never named after a trading school — with family-declared open geometry (point, level, zone, span, distribution, graph). An object is minted once, at observation, on the immutable store, carrying family identity and version, exact parameters, its declared confirmation rule, an anchor span (start instant, end instant, price bounds — frozen at observation, explicitly permitted to precede observed-at, excluded from every causality test), and observed-at defined as the earliest instant the object was derivable from causally-available data. Confirmation, invalidation, and interaction records are separate append-only AD-16 records/edges referencing the object's fingerprint; the object is never mutated; current state is a read-time fold under CT-17's stated read-resolution rule. Anchor span, observed-at, and every lifecycle instant are identity fields, never occurrence-classified. The emission invariant anchor.start <= anchor.end <= observed-at <= confirmed-at <= invalidated-at, with observed-at >= the maximum evidence time of every consumed input, is checked in-component now, independent of the deferred GAP-0016 gate. A family ships into the governed library only when its confirmation rule states 'confirmed the moment X happens' with X knowable at that instant; clock-confirmed rules are legal; imprecise concepts stay free in ungoverned research lanes. Evidence class (confirmed, unconfirmed, provisional) is a named AD-12 label part and identity field; an unconfirmed output links to its confirmed successor via a confirmed-as edge; a read requesting confirmed evidence refuses unconfirmed rows. Confirmation delay is a declared maximum bound in observations at the family's BarSpec (unbounded only for families excluded from split-governed evidence) and feeds purge/embargo widths with warm-up. Sloped objects are integer anchors plus a versioned evaluation rule with slope derived, never stored; calendar-anchored levels declare sampling and schedule-gap policies. Composites take the maximum of their children's confirmed-at and observed-at, are order-significant by default, and may hold any governed kind; invalidation never cascades automatically; a refit is a new artifact with a supersedes edge. The V1 seed candidates (swing points, horizontal levels from confirmed swings, zones, structure breaks) are candidates only — operator-authored from-scratch families are first-class peers under identical law, and family authoring via the extension shape is the primary use case. Emissions are registry record kinds minted by the composition root, which holds the WriterId; qmf-structure depends on qmf-core only in V1."
    status: ratified
    rationale: "Answers GAP-0034 (memlog entries 54, 55, 56, and 61): the observed-at/confirmed-at law applied to chart objects keeps repainted or look-ahead structure out of evidence; the precise-rule bar admits any school's concept once mechanically stated while vague ones stay in research lanes; the operator's no-lock-in ruling makes from-scratch family authoring the primary use case rather than a privileged built-in set."
    sources: [EXT-2035, EXT-2036, EXT-2041]
    component: COMP-QMF-STRUCTURE
    tags: [architecture-spine, structure, ct-17, lifecycle, gap-0034]

  - id: DEC-0130
    title: "Increment-gate amendments, indicator side (AD-22/23/24 and AD-2)"
    statement: "The increment reviewer gate's must-fix findings were applied in one desk pass with AD ids stable: the series vocabulary and BarSpec moved into qmf-core as shared nouns under AD-2; the bulk form and presence map were pinned; the two AD-7 conversion boundaries were named with one qmf-core implementation each; the four-tuple identity shortcut was deleted in favor of identity = the entire declared configuration; typed configuration inputs (calendars, instrument-metadata snapshots, event anchors) create no package edges; the composition law made any CT-16/CT-17 output a legal input with the upstream fingerprint entering downstream identity; the equality law was scoped to same-process/same-build with an integer-ULP comparator and a separate restore-equivalence test; the output schema gained channels, knowable-at, and the bar-closed/in-progress emission policy with provisional barred from governed evidence; AD-2's extension mechanics were generalized to calendar, indicator, and structure extensions with explicit registration and the graduation path; AD-23 was extended to bind every governed producer with the QMX implementation canonical where the reference is absent and the pin expressed as lockfile artifact hashes plus a reference-configuration record; AD-24 gained the window-or-anchor-reset third bound, CT-17 coverage, and heavy-by-default until a rung baseline exists. No ratified ruling was reversed; every fix is additive contract surface."
    status: ratified
    rationale: "The adversarial pass found 36 conformant-but-divergent implementation pairs and the two edge-case lenses found 20 must-fix expressibility failures; the amendments close them by pinning contract surface, under the operator's adopt-as-amended delegation (memlog entries 59 and 60)."
    sources: [EXT-2039, EXT-2040]
    component: COMP-QMF-INDICATORS
    tags: [architecture-spine, amendments, gate, indicators]

  - id: DEC-0131
    title: "Increment-gate amendments, structure and cross-AD side"
    statement: "The same desk pass rewrote AD-25 in place (observed-at as known-at, anchor span, in-component emission invariant, lifecycle on the immutable store with read-time folds, identity classification of structure instants, evidence class with confirmed-as edges and refusing reads, sloped and calendar-anchored objects, bounded confirmation delay, composite instant arithmetic, no automatic cascade, refit as supersedes, the CT-16-vs-CT-17 routing test, cited-objects-become-evidence, composition-root emissions) and amended eight other ADs: AD-7 gained PriceDelta, the metadata-defined pip/point, and the exact-rational idiom; AD-8 gained the civil-time bucket key; AD-12's label gained producer contract identity and evidence class; AD-14 gained the component definition (an owner of external resources or long-lived state, streaming indicator and structure family instances included, pure batch functions excluded) and the pure-boundary correlation exemption; AD-16 gained the confirmed-as, confirmation, invalidation, and interaction record/edge kinds plus the computation-vs-market-fact classification split; AD-17 made causal composites order-significant by default with children of any governed kind; AD-21 gained knowledge-time split partitioning and purge/embargo as required manifest fields now, defaulting from producer-chain horizons; the Deferred table gained the latency-decomposition, L2/footprint-vocabulary, and bar-builder rows."
    status: ratified
    rationale: "The structure-side and cross-AD fixes carry the same gate provenance and the same additive-only verdict (memlog entries 59 and 61); recording them separately from the indicator side keeps each ruling's blast radius auditable."
    sources: [EXT-2039, EXT-2041]
    component: COMP-QMF-STRUCTURE
    tags: [architecture-spine, amendments, gate, structure, cross-ad]

  - id: DEC-0132
    title: "School-neutral vocabulary law"
    statement: "No QMF rule, contract, or vocabulary may name or privilege any trading school; school-specific edge-case findings are translated into general capability terms (mutable partial-state objects, time-anchored objects, derived objects) at synthesis; a mechanically-stated variant of any school's concept is admissible under the same precise-rule bar; a school name may appear only as an illustration, never as vocabulary."
    status: ratified
    rationale: "Operator correction 2026-08-20 (memlog entry 57): coverage must be general — general forex, crypto, and market structure alongside any single tradition — because a school-shaped framework would bias every later design."
    sources: [EXT-2037]
    component: null
    tags: [law, naming, school-neutral]

  - id: DEC-0133
    title: "Plain-Python escape hatch and the graduation path"
    statement: "Authoring outside the framework is always legal: when a concept is ambiguous or the framework cannot yet articulate it, plain Python in ungoverned research lanes is the intended route, never a forced framework fit. A working plain-Python experiment graduates into governed evidence as a CT-16 indicator or CT-17 family through the AD-2 extension shape — a separate versioned package outside the roster, own SemVer ladder, distribution identity and version as identity fields of every artifact produced, explicit registration at the composition root — with a lineage edge back to the originating research artifact."
    status: ratified
    rationale: "Operator philosophy reaffirmed 2026-08-20 (memlog entries 51 and 58): the escape hatch is the design's point; the graduation path with lineage keeps the freedom without losing provenance when an experiment becomes evidence-bearing."
    sources: [EXT-2038, EXT-2032]
    component: null
    tags: [law, extensibility, graduation, escape-hatch]

  - id: DEC-0134
    title: "Freeze-choice status after the indicators/structure sitting"
    statement: "Of the six qmf-core freeze choices, four are now ratified contracts — the UTC time encoding (DEC-0106), instrument identity (DEC-0107), the result-label tuple (DEC-0110), and canonical indicator arithmetic (DEC-0127) — while the backtest fidelity taxonomy (GAP-0048) and the SR* threshold (GAP-0049) remain open for their own sittings."
    status: ratified
    rationale: "GAP-0032's ratification closes the fourth freeze choice; the remaining two belong to the backtesting and research-threshold areas."
    sources: [EXT-2033, EXT-2031]
    component: COMP-QMF-CORE
    tags: [architecture-spine, scope]
    supersedes: [DEC-0124]

  - id: DEC-0135
    title: "cTrader venue facts ratified with corrected evidence grades"
    statement: "The consolidated venue-facts sheet (ctrader-venue-facts.md, bundles A/B/C) plus the depth-and-connectivity findings are ratified as venue facts and standing adapter obligations. Bundle A (documentation-grade): timestamps are Unix ms UTC asserted per field — no global statement exists — with named epoch exceptions (trendbar minutes, maintenance-end seconds, holiday days, schedule seconds-from-Sunday in the broker zone) and the spot-event timestamp unit genuinely undocumented; the Open API exposes no server clock (closed-set proof over the full payload-type enums), so receive-time recording is mandatory; historical ticks are BID/ASK-selectable; rate limits are 50 req/s non-historical plus 5 req/s historical per connection, breach codes 108/11/67/35, no documented ban or backoff policy; tick history is newest-first delta-encoded (price deltas staff-demonstrated only — a first-connection assertion) with hasMore-only paging and a documented one-week span cap; three independent numeric scale systems (market-data prices uint64 in 1/100000; execution prices raw doubles; a moneyDigits exponent on nine messages; volumes in cents, LightSymbol carrying no scaling metadata so the full symbol record is required before any price decode); two broker-supplied non-UTC timezone axes (symbol schedule and holidays); heartbeat adopted at the safe 10-second bound; trendbars gappy by design; swap-free accounts still pay a dated rollover commission. Bundle B (demoted): the 17:00-New-York daily boundary and BID-derived trendbars — both 2013-forum-grade claims — are NEVER hardcoded; the adapter measures the actual daily boundary and bar price basis per broker at first connection and re-verifies with a continuous background monitor, storing the result as per-broker configuration; QMF's own forex 17:00-NY market-hours calendar remains its accounting rule, independent of venue bars. Bundle C: every undocumented behavior (spot-timestamp unit, spot coalescing, rate-window semantics, absent moneyDigits, pip formula, live-trendbar semantics, historical classification, per-period span caps) is a verify-or-refuse adapter obligation. Depth/connectivity: a Level-2 resting-liquidity book exists with differential updates; no Level-3/time-and-sales stream exists (closed-catalog proof); demo and live are separate hosts requiring two simultaneous connections, each serving unlimited accounts of one environment; token lifecycle: ~30-day access token, a never-expiring refresh token as the crown-jewel secret, and cTID re-authorization as the invalidation anchor."
    status: ratified
    rationale: "Primary-source re-verification demoted the forum-grade claims DEC-0123 recorded (17:00-NY staff-only with counter-evidence; BID-bars ex-staff) and replaced them with measure-per-broker adapter obligations; the operator ratified the package 2026-08-20 (memlog entry 75), satisfying AD-8's cTrader distrust clause and closing GAP-0037's venue-facts half."
    sources: [EXT-2043, EXT-2044, EXT-2046, EXT-2048]
    component: COMP-QMF-VENUE
    tags: [architecture-spine, venue, ctrader, venue-facts, gap-0037]
    supersedes: [DEC-0123]

  - id: DEC-0136
    title: "AD-26 venue secret lifecycle (GAP-0035)"
    statement: "QMF components handle secret references, never values. qmf-core ships typed SecretRef and SecretValue; a SecretValue never renders its value — repr, str, serialization, and logging all yield the reference id — and a tier-1 secret-scan gate rides poe check. A secret reference is an opaque minted id under AD-9's discipline: stable, never reused, never encoding venue, broker, account, environment, or key material; any human-readable label is a separate field held outside evidence; construction validates opacity. Values are injected at the composition root from the deployment environment's protected store (systemd-creds-class on the VPS; store mechanics and key custody land at the node/ops sitting). Secrets never appear in repositories, configuration artifacts, docs, .env files, CLI arguments, journals, evidence, fingerprints, or logs; a missing, expired, or rejected credential is an unavailable-dependency refusal carrying the reference id, never the value. An account-binding record's identity is (VenueId, AccountId, role, world); its secret reference is occurrence/display-only and excluded from fp1 — a credential is a deployment fact, never a market fact. The adapter's connection manager is the single named component permitted to hold secret values in memory, for a session's lifetime, through a core-defined SecretStore port (read + atomic replace) injected by the root; values never cross back out. A credential is a one-writer stream: exactly one live refresher per credential — a workstation tool never refreshes a credential a VPS session owns; where the venue rotates refresh material on use, the new secret is stored atomically before the old is discarded, and a failed store after rotation is an alarm plus a command-pipe block (unavailable dependency, after-condition = successful store or operator re-provision) with the sensing pipe unaffected. Compromise recovery is a documented, tested drill: cTID re-authorization (invalidating all outstanding refresh tokens), application-credential reset, store replacement, session restart; expiry and refusal paths ship as tested behavior; testing uses demo credentials only and factory sandboxes never hold live secrets; credential entry and management UI is platform territory."
    status: ratified
    rationale: "Answers GAP-0035 (memlog entries 77 and 82): references-not-values makes leak surfaces mechanical to scan; the single value-holder plus one-refresher-per-credential prevents rotation races; store-before-discard plus the cTID drill turns the never-expiring refresh token from a standing hazard into a recoverable one."
    sources: [EXT-2046, EXT-2050, EXT-2054]
    component: COMP-QMF-VENUE
    tags: [architecture-spine, venue, secrets, ad-26, ct-21, gap-0035, law]

  - id: DEC-0137
    title: "AD-27 venue commands and the uncertainty law (GAP-0036)"
    statement: "The command stream — the unit of UNKNOWN blocking, of WriterId ownership, and of the gapless per-writer sequence — is the (VenueId, account) pair, coarser than an account binding and strictly finer than a connection; a session-epoch id distinct from the boot epoch rides every venue observation, sequences reset only on boot, and the sequence cursor is durable through the observation sink. The command vocabulary is exactly four kinds — place_order, cancel_order, close_position, close_all — each typed per kind on qmf-core nouns with no free-form payload; kinds are addable never redefined; amend_order arrives only by explicit later mint; the caller stays unassigned in QMF. Order-parameter vocabulary (market | limit | stop | stop-limit; time-in-force; protective-stop attachment) is QMF-owned, with each adapter declaring its supported subset in CT-18. close_position and close_all carry a required typed scope (account | account-binding | instrument-within-binding); an unsupported scope is an unsupported-capability refusal, never emulated at a wider scope. A command fanning out to N venue submissions is a compound command: each child carries a derived identity (parent fp1 + declared ordinal) and is individually observation- and journal-bearing; the parent's outcome is the meet of its children — any child UNKNOWN makes the parent UNKNOWN, any child rejected makes the parent partially-executed, a named outcome, never a success. Command identity derives from the command record's fp1 (including the stream qualification, session epoch, and the caller's opaque ordering ordinal); the CT-18-declared mapping into the venue's client-id field must be injective and total, or a durable command-id-binding record persists through the sink before submission; idempotency and collision tests run against the full local fingerprint — re-presenting the same command is an idempotent accept, differing content under a reused identity is refused and alarmed. Four-outcome law: every well-formed submission resolves to accepted-by-venue | rejected-by-venue | denied-locally | UNKNOWN; denied-locally is an outcome, never a refusal, and every outcome mints an observation record and a journal event. A transport error, timeout, or disconnect yields UNKNOWN — a state, not an error; a venue-returned error resolves rejected-by-venue only where the CT-18 error table declares that outcome class. An UNKNOWN is minted as an explicit observation carrying its trigger (timeout | transport-error | disconnect), the monotonic elapsed measurement, the wall receive instant, and the submission deadline in force — a declared, application-injected adapter parameter under do-not-default. While an UNKNOWN is outstanding the adapter refuses new commands on that stream; cancel/close dispatch ahead of place_order on every shared throttle (scope declared in CT-18); suspend-new takes local effect instantly. No QMF component retries, assumes an outcome, flattens, or invents terminal state on UNKNOWN; the adapter never clears its own block — unblocking is an explicit typed resolve_unknown(command identity, resolution ∈ observed-accepted | observed-absent | operator-attested) call by the application, itself recorded as an observation. Recording precedes interpretation: every inbound venue event is stored verbatim and journaled before any state evaluation; the order-state machine is a read-time fold over the observation stream per CT-20's read-resolution rule, never a gate on recording; an observation with no legal transition is recorded, annotated with a typed out-of-sequence edge, and forces the owning command to UNKNOWN; adapters never synthesize venue observations. Command outcome and order state are separate streams, never merged — an order's terminal state is decided by fills and venue lifecycle events only; CT-18 declares each command kind's acknowledgement mode (explicit-event | implicit-absence | none) and an outcome is never derived from absence alone (a cancel resolved by read-back is accepted only if the read-back also shows no fill at or after the cancel's submit stamp, else rejected-by-venue superseded-by-fill). Fill price, fill quantity, the venue instant, and the receive instant are mandatory identity fields of a fill observation; every CT-20 observation carries a declared venue-native identity key for gap-replay dedup; CT-20 ships an exhaustive versioned journal-event mapping with the cardinality law — exactly one journal event per recorded observation, per submission, per outcome; an unpersistable journal event or partial multi-room write is a storage-failure refusal that blocks the command stream. Reconciliation is an on-demand complete read-back of venue orders, fills, positions, and balance over a stated lookback (equity derived where non-native), with QMF-owned verdict vocabulary reconciled | drift | unknown; reconciliation gates the command pipe only — the sensing pipe never blocks on it; when it runs and what a verdict triggers are node/BMS authority. Outage is fail-closed: on disconnect in-flight commands become UNKNOWN, recovered fills commit through evidence before a session reports healthy; session recovery never resubmits a command; command retry is prohibited — retryability rides typed refusals; flatten is close commands executed mechanically, never adapter-initiated, with authority assignment (VPS-death included) belonging to the risk/node sittings."
    status: ratified
    rationale: "Answers GAP-0036 (memlog entries 79, 80, and 82): the operator confirmed the four-command vocabulary and command-pipe-only reconciliation scoping after the node order-path study resolved the startup tension; the four-outcome law with explicit UNKNOWN minting and the resolve_unknown protocol makes uncertainty a recorded state rather than an invented terminal, and read-time folding keeps the immutable store ungated."
    sources: [EXT-2047, EXT-2051, EXT-2052, EXT-2054]
    component: COMP-QMF-VENUE
    tags: [architecture-spine, venue, commands, uncertainty, ad-27, gap-0036, law]

  - id: DEC-0138
    title: "AD-28 venue adapter contract and capability discovery (GAP-0038)"
    statement: "One neutral port, four contracts: CT-18 (capability), CT-19 (command), CT-20 (event + reconciliation), and CT-21 (secret/session, shaped by AD-26) are defined by qmf-venue on qmf-core nouns; per-venue adapters implement them; nothing imports qmf-venue; the composition root wires. The adapter's connection manager is the sole owner of venue sessions; on the venue path the WriterId granularity is (machine, adapter role, VenueId, account) — the same unit as AD-27's command stream — and no other component may construct a venue client. Injected-sink wiring is pinned: the root injects qmf-core-defined sink protocols (ObservationSink, JournalSink, RecordSink, SecretStore); the connection manager holds the WriterId, stamps writer and sequence, and calls sinks synchronously; every sink returns success or a typed refusal to its caller, and a storage failure triggers AD-27's command-pipe block in the component that holds the WriterId — the root-mints pattern does not extend to the venue path; no dependency edge is created because sinks are core protocols. Every adapter artifact is a qmf-core value type; the registry record wrapping it is minted by the root through qmf-registry; the fingerprint consumers cite is the content fingerprint, never the record fingerprint. CT-20 declares each multi-room write as one ordered unit with a named transaction boundary (atomic | ordered-with-recovery); a partial write is a storage failure that blocks the command stream and is journaled on recovery. Market data has a named home: ticks, bars, depth, gap-replay backfill, and historical paging enter as CT-10 source observations through qmf-data's CT-15 intake — application-mediated, no fifth contract, no new edge; subscription lifecycle facts (technical snapshot on subscribe, non-instantaneous unsubscribe, hasMore-class paging) are declared CT-18/CT-15 surface; the pinned canonical sensing feed carries a prohibition — no silent sibling-feed failover; a sensing outage fails closed until the same feed gap-replays; raw depth recording is the verbatim wire payload. The capability surface is two artifacts: (1) the capability declaration — static, adapter-version-scoped, importable without credentials, containing no measured or tunable value, every field marked static or measured-at-connection, carrying the venue protocol artifact identity, its fingerprint identity-bearing for any artifact whose decode depended on it; (2) the venue-observation profile — per (VenueId, account), produced post-connect by the verification suite, append-only with supersedes edges, holding every measured fact and verdict, occurrence/provenance only. A measured-at-connection capability is unavailable until its profile exists; consuming a measured-but-unverified capability in evidence-bearing work is a policy rejection; wiring order is fixed — declaration at construction, profile before the first command and before any evidence-bearing decode. CT-18 owns the field roster (market-data kinds, order-parameter subset, command scopes, acknowledgement modes, netting-versus-hedging position model per account, session topology, throttle scope, rate limits, span caps and paging model, token lifecycle class, equity nativeness, server-clock availability, instrument-metadata surface, attribution-label support, protection primitives suspend-new | drain | close_all); invoking anything undeclared is an unsupported-capability refusal; a CCXT-class crypto venue slots in later by declaring a different record through the same port. Instrument resolution maps venue-native symbols to opaque (venue, symbol) identity, with adapter-produced instrument/account metadata snapshots as typed configuration inputs and declared full-metadata prerequisites. Foreign values store verbatim, floats included: a foreign binary float is never identity — it crosses AD-7's named boundary at receipt to a scaled integer at a per-value-class pinned target scale (execution price → the instrument's declared digits; money → the account's declared money exponent, an absent exponent being a refusal; market data → the declared wire scale) with a declared, identity-bearing rounding mode, the raw float retained only as integrity-checked provenance. Receive wall time and the boot-scoped monotonic stamp are mandatory on every inbound venue event, and a latency rung is a monotonic delta within one boot epoch on one machine — a wall-computed rung is refused as a baseline. Error mapping rows are pinned as (venue code, command-or-event context) → (refusal category, retryability, after-condition, submission-outcome class ∈ rejected-by-venue | UNKNOWN), versioned per adapter; the unmapped default is (transient venue failure, retryable = no, outcome = UNKNOWN) plus an alarm; category alone never implies retryability. Sessions follow the venue's declared topology (two connections where demo and live are separate hosts); paired-demo bindings are secret-reference-only records; shared-account order-lifecycle merges use only the caller's sequencer evidence. The venue protocol artifact is pinned in the AD-6 register (cTrader profile: the Spotware proto integer release tag, currently 91); a tag change mints a new capability declaration plus re-verification, bumping a contract format version only where the wire change alters that contract's public shape. The first-connection verification suite is a named contract part, verify-or-refuse throughout: an unverified spot-timestamp unit refuses spot evidence; an unmeasured daily boundary leaves venue daily bars ungoverned — once measured and verified the boundary is minted as a venue-scoped market-hours calendar identity, giving venue-native bars a legal BarSpec anchor; a failed bar-basis reconciliation refuses bar evidence; a failed pip-formula validation refuses metadata-derived parameters; an absent money exponent refuses that message's money decode. Measurements and verification verdicts journal as data-quality events; adapter-initiated state changes (suspend-new, drain, session restart, throttle engaged, reconnect) journal as control actions. The six-stage live-path latency decomposition (tick received → evidence write → indicator update → decision → risk evaluation → order submitted) is recorded as named rungs with no numeric budgets until measured; the adapter owns the arrival/submit stamps for its stages."
    status: ratified
    rationale: "Answers GAP-0038 (memlog entries 81 and 82): four contracts through one neutral port keep venue specifics out of qmf-core while the injected-sink wiring preserves default-deny with the writer seeing every persistence failure; splitting the static capability declaration from the measured venue-observation profile stops measured facts from splitting artifact identity across accounts; homing market data at CT-10/CT-15 avoids a fifth contract and a new edge."
    sources: [EXT-2047, EXT-2051, EXT-2053, EXT-2054]
    component: COMP-QMF-VENUE
    tags: [architecture-spine, venue, adapter, capability, ad-28, gap-0038]

  - id: DEC-0139
    title: "Broker identity is deployment configuration (GAP-0037 broker half)"
    statement: "Which broker fronts the cTrader platform is deployment configuration, never architecture: opaque VenueId/AccountId identity and account bindings are sufficient — 'account IDs are enough.' IC Markets is the operator's stated intent and deliberately not a framework commitment; account-type confirmation is config-time work per broker. AD-9 gains the platform-vs-broker distinction: the platform (cTrader) fixes the protocol and the adapter; the broker behind it is a per-deployment fact whose measured behaviors (daily-bar boundary, trendbar price basis) live in the venue-observation profile and per-broker configuration, never in code."
    status: ratified
    rationale: "Operator ruling 2026-08-20 (memlog entries 70-72): the operator declined to freeze the broker on first ask and then ruled broker identity out of architecture entirely, which closes GAP-0037's which-broker half without a commitment that would bias later multi-broker deployments."
    sources: [EXT-2045, EXT-2054]
    component: COMP-QMF-VENUE
    tags: [architecture-spine, venue, broker, deployment, gap-0037]

  - id: DEC-0140
    title: "Venue increment gate amendments, venue-AD side"
    statement: "The venue increment reviewer gate produced 49 findings (rubric 19, adversarial 30 conformant-but-incompatible implementation pairs, 12 critical in total) and all were applied at desk in one pass with AD ids stable, rewriting AD-26/27/28 in place: opaque SecretRef ids with construction-validated opacity, the SecretValue render guard, the tier-1 secret scan, binding identity (VenueId, AccountId, role, world), one-refresher-per-credential, and rotation store-failure as a command-pipe block; the command stream defined once as (VenueId, account) for blocking, WriterId, and sequence, with the session epoch and durable cursor; the injective-or-bound command-id mapping; the four-outcome law with denied-locally as an outcome; the explicit UNKNOWN observation with a declared deadline and the resolve_unknown protocol with the adapter never self-clearing; recording-precedes-interpretation with order state as a read-time fold, no synthesized observations, the outcome-versus-order-state stream split, declared acknowledgement modes, and the superseded-by-fill rule; typed close scopes and the compound-command meet law with partially-executed as a named outcome; protection-command dispatch priority and the declared throttle scope; the venue-native idempotency key, CT-20 exclusion list, journal-event mapping table, and cardinality law; injected-sink wiring with the writer seeing every failure and the content-fingerprint citation rule; atomic/ordered multi-room writes; market data homed at CT-10/CT-15 with the no-silent-sibling-failover prohibition; CT-18 split into the static capability declaration versus the per-account venue-observation profile with two-phase wiring; the pinned error-map row shape with the fail-closed unmapped default; the verify-or-refuse verification suite; the QMF-owned order-parameter vocabulary with netting/hedging declared; mandatory monotonic receive stamps and monotonic-only latency rungs; and the pinned raw-depth encoding. No ratified ruling was reversed; every fix is additive contract surface."
    status: ratified
    rationale: "The rubric's three criticals (no market-data contract in the port; the write path versus default-deny; raw-double execution prices unhandled) and the adversarial pass's nine criticals each named a way two conformant adapters could diverge or fail open; the amendments close them by pinning contract surface under the operator's adopt-as-amended delegation (memlog entry 82)."
    sources: [EXT-2054]
    component: COMP-QMF-VENUE
    tags: [architecture-spine, venue, amendments, gate]

  - id: DEC-0141
    title: "Venue increment gate amendments, cross-AD side"
    statement: "The same desk pass amended seven ratified areas outside the venue ADs: AD-7 gained the foreign-float law — a venue value delivered as a binary float is evidence, never identity; it converts at the named boundary at receipt to a scaled integer at a per-value-class pinned target scale with a declared rounding mode, the raw float retained only as integrity-checked provenance. AD-8's cTrader clauses resolved on the ratified venue facts: per-field ms-UTC timestamps are trusted on per-field documentation; the 17:00-New-York daily boundary and BID-derived bars are never hardcoded — measured per broker at first connection with a continuous monitor; a measured, verified daily boundary is minted as a venue-scoped market-hours calendar identity (identity is the rule set), giving venue-native bars a legal BarSpec anchor, and until then venue bars are ungoverned observations. AD-9 gained the platform-vs-broker distinction with broker identity as deployment configuration. AD-12 gained role-scoped namespaces and the sandbox provenance field. AD-15 gained the schedulable-duties carve-out: the adapter's periodic session duties (heartbeat, token refresh, reconnect, gap replay, verification monitors) are declared work the application's scheduler drives — the adapter defines the work, the application runs it, and session recovery never resubmits a command. The dependency-direction section gained the venue-sink note: the venue write path creates no edge because qmf-venue emits through core-defined sink protocols injected at the composition root. The Stack register gained the Spotware openapi-proto-messages integer release tag (91) and a protobuf-runtime row; the official OpenApiPy SDK is ruled reference-only because its pinned Twisted reactor violates AD-6's platform-imposing rule — only the proto message definitions (data, not code) are consumed, and zero Spotware code runs in QMX."
    status: ratified
    rationale: "The venue rules exposed gaps in seven ratified areas the gate reviewers caught as conformant-but-incompatible seams; recording the cross-AD side separately from the venue-AD side keeps each ruling's blast radius auditable (memlog entry 82), mirroring the indicators-increment convention."
    sources: [EXT-2043, EXT-2054]
    component: null
    tags: [architecture-spine, amendments, cross-ad, venue]

  - id: DEC-0142
    title: "Node-material boundary and the standing node ledger"
    statement: "Trading-node runtime material stays out of QMF documentation. tracker/trading-node-notes.md is the standing cross-session node ledger: anything discussed that concerns the trading node is noted there durably for the node sittings, and QMF docs reference it as a pointer, never absorb it. The trading-node order-path study and the node corpus brief remain reference-only evidence — the order path, protection funnel, startup semantics, and flatten-authority assignment are node/risk-sitting territory, and QMF records only the contract surface AD-26 through AD-28 define. Venue research companions are cited as evidence, never duplicated into docs."
    status: ratified
    rationale: "Operator standing instruction 2026-08-20 (memlog entry 76): 'I don't like repeating myself' — node knowledge must survive across sessions without leaking node runtime design into framework documentation, whose scope L31 and the framework-vs-node split already bound."
    sources: [EXT-2049, EXT-2051]
    component: null
    tags: [scope, boundary, node, standing-instruction]

  - id: DEC-0143
    title: "Book, BMS, and the binding chain (AD-29)"
    statement: "The authority order is constitutional and verbatim across all three legacy layers, re-ratified 2026-08-20: 'Bots trade; books control bots; BMS accounts for and constrains books; nothing above a bot touches the market. Hierarchy: bot -> book -> BMS -> operator' — nothing in QMF may invert or shortcut it. The BMS is the account-facing supervising layer, not a rulebook beside the Book: one BMS instance per account, serving many Books; a Book binds exactly one BMS at a time (dated, append-only, swappable — re-binding mints a new binding record with a supersedes edge); a Bot binds exactly one Book (DEC-0115); a crypto or prop-firm BMS is a new BMS version, never a second BMS stacked beside an existing one. Every cardinality-one is a deliberate ruling under AD-17. The authority split stays default v1 verbatim — 'The book owns admission, sizing, doors, leash, and profile selection. BMS owns accounting, constraints, journals, KSA policy, and reporting' — with the migration caveat that journal, record, and session machinery is now QMF-side (AD-19/21/28) while the authority did not move. Three identities are minted apart: Book VERSION (template content, identified by its fp1), Book INSTANCE (a minted deployment record — version fingerprint + AccountId + VenueId + world + mint occurrence + creation sequence — carrying an opaque BookInstanceId; two copies of one version on one account are distinct by mint and never merged: an equal-fingerprint binding record is an invalid-input refusal, never an idempotent accept), and binding EPOCH (the half-open interval between a binding record and its superseder, identified by the binding record's fingerprint; CT-32 populations and AD-41 folds cite binding-record fingerprints, never intervals). BmsInstanceId is content-derived from (BMS definition fingerprint, AccountId, VenueId, world). The risk domain is the binding (BookInstanceId, BmsInstanceId, VenueId, AccountId, world) — aligned with the (VenueId, account) command stream and never coarser than it; role is deliberately not in the tuple (it rides the per-intent execution target); world is a constant 'live' for every V1 binding, so a replay of a binding is deliberately incomparable by binding. Any tuple change mints a new binding, and what carries is declared, never inferred: every binding record carries a mandatory per-counter state_carry declaration (ledger, cycle, budget, bench_counter, exposure — each carry|reset), with carry legal only under a human-signed carries-ledger edge. An instance never spans venues: a strategy at several brokers is several instances of one Book version, each with its own BMS instance and connection; cross-broker figures are after-the-fact reports at a stated as-of knowledge time and never gate an order. Several Books may bind one account and every coupling is named: they share one BMS instance and one command stream; on a netting account they also share positions, so binding a second Book onto a netted account whose live bindings may trade an overlapping instrument set is an unsupported-capability refusal unless the operator signs the shared-flatten limitation on the admission page (the signature an identity field of the binding); the recommended default — operator-confirmed post-close as the first-stable-version posture — is one Book per netted account; where the position model makes a narrow enforcement indistinguishable from a wider scope, the action refuses rather than executing wider. The paired demo target is an account and carries its own paired BMS instance, linked to the live BMS by a typed pairing record; the paper flip is an operator-ratified dated change of the Book-to-BMS binding, minting a new binding epoch, never a new Book. A binding is admissible only where the venue's CT-18 declaration AND its venue-observation profile satisfy the Book's declared required capabilities — including the account settlement currency matching the Book's accounting_currency, the shared-flatten signature where netted, a present SQS baseline for every sensor the Book's doors read, the live-path rung baseline on this deployment's tuple, and a control-rank table the Book does not contradict — a shortfall refusing at bind time, never at trade time."
    status: ratified
    rationale: "Operator rulings 2026-08-20 (memlog entries 85, 86, 87, 93, 94) with the corpus-verified refinement governing (the round-1 'BMS = rulebook' framing was agent phrasing the operator's own correction reversed: 'the BMS is what connects the account'); identity trinity and bind-time capability check minted by the risk reviewer gate (entry 111); one-Book-per-netted-account confirmed post-close (entry 115). Supersedes docs/glossary.md's pre-ruling BMS definition ('machinery owned within the Book domain') and qmf-risk FM-8's several-BMS-policies framing, both written before GAP-0039 was ruled."
    sources: [EXT-2056, EXT-2057, EXT-2069, EXT-2070]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, book, bms, binding, gap-0039]
    supersedes: [DEC-0095]

  - id: DEC-0144
    title: "Templates as configuration artifacts; git-logic versioning (AD-30)"
    statement: "A Book or BMS template is a structured configuration artifact (JSON-Schema-class): declared variables, each carrying its unit, an exact-rational or scaled-integer value (no binary float anywhere), and a declared ui-editable | uneditable flag — the standing operator rule that 'configurable' means editable in the platform UI applies to every configurable variable minted anywhere in QMX. Each variable also declares admission_impact in {resign | relint | none}: changes touching charter, money_rules, admission_bar, or required_venue_capabilities are resign (a fresh AD-32 Layer 2 + Layer 3); leash_grammar, control_policy, and protection_windows numbers are relint (Layer 1 only). Defaults + versions + copies: a template version is grammar plus defaults; a copy is that version instantiated onto an account as an instance; adding a broker account offers copies of the chosen defaults (Book instance, BMS instance, own connection); a version changes the variables, a copy binds them to money. Numbers live inline and are identity-bearing — the legacy registry-pointer rule is inverted, since outside the fingerprint two Books with different money rules would share one identity. Versioning is git logic without git: an append-only version graph built on branches-from edges (multiple heads legal; 'current' is a separate dated pointer record) — never on supersedes, which stays linear everywhere else; diffs are derivable between any two versions; every old version stays readable forever; UI edits mint a new version, never mutate one. A changed number changes fp1, hence a new Book identity, a new binding, and a fresh cycle's money — unless the new binding's state_carry declares carry under a human-signed carries-ledger edge; the track record travels separately on continues-performance, so a rule change never resets the performance line by accident and never moves money by accident. Declared sections: charter, footprint_requirements, money_rules, admission_bar (the legacy 'entrance exam' renamed — banned vocabulary), leash_grammar, capacity_and_sweep, exit_policy, control_policy, protection_windows, and paper; a further section is a contract-format-version mint. Order significance is declared per section, never inferred: admission_bar is a set canonically ordered by measure_identity with display ordinals separate, so two operators writing the same requirements in different order get the same Book fingerprint. Unknown sections under a known contract format version are ignored; an unknown format version refuses. Every Book definition additionally declares accounting_currency, required_venue_capabilities, required_producer_contracts (each producer cited as contract_id + version + on_version_change in {refuse | accept-and-mint-new-book-version | accept-with-continues-performance}), and worked_example (a keyed collection, one entry per declared formula id). Mandatory surfaces whose contract is deferred (footprint_requirements, the prediction linter — both awaiting the Bot schema) are declared pending(<gap id>): a pending slot passes registration and blocks live binding. A binding cites a Book definition by fingerprint, never a version string."
    status: ratified
    rationale: "Operator Books-package ruling as amended (memlog entries 100, 86: 'every variable declared UI-editable vs uneditable in the template itself — very important'; git logic: 'we won't use Git, but the logic behind it'); admission_impact, on_version_change, pending slots, and section order rules minted by the risk gate (entry 111)."
    sources: [EXT-2057, EXT-2063, EXT-2069]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, templates, versioning, gap-0039]

  - id: DEC-0145
    title: "Risk record kinds and per-entity journals as projections (AD-31)"
    statement: "Journal streams stay writer-scoped (AD-21, one per producing component under a WriterId). The Book journal, BMS journal, and per-bot journal — the operator's logbook — are declared read-time projections over those streams, selected by entity identity: an entity is not a writer and no entity mints a stream of its own. This is a disclosed substitution of the operator's per-entity-streams ask, resolved and confirmed by the operator post-close ('if I need per-bot data I can extract it; if I need per-Book I can extract it'). Two event classes exist because the neutral venue port cannot carry Book identity and must not learn it: risk-authored events (decision, risk transition, control action, promotion), minted by the risk/node layer, carry the Book-definition fingerprint, the binding identity, and — where the act concerns one bot — the Bot identity plus seat binding, as identity fields; venue-authored events (order, fill, data quality), minted by the connection manager under its own WriterId, carry the command record's content fingerprint, and the projection joins through it — the command record carrying the binding identity as an identity field. That join is pinned versioned CT-25 surface, not implementer judgment. Paper and live are separated by construction: a projection resolves inside one role-scoped namespace; a projection spanning roles exists only as an explicitly-declared cross-role read — wider than the decay cohort: any entity projection over an entity that operated in more than one role (a benched seat inside a live Book is the ordinary case) is permitted as a declared cross-role read with role carried on every row, never aggregated across roles without an explicit declaration. The legacy five Records streams (veto_ledger, trade_journal, book_journal, ksa_audit_log, correlation_ledger) survive as projection names only, mapped onto AD-21's seven event types by one versioned mapping table in CT-25; no second event catalog is minted. Every risk record is a qmf-core value type, content-fingerprinted by qmf-core's single implementation and wrapped into a registry record by the composition root; no new package edge is created. The risk-domain writer unit is (machine, risk role, binding); the block-on-unpersistable obligation binds the risk dispatcher exactly as it binds the connection manager — a control action is journaled before dispatch, so a storage failure blocks the dispatch rather than losing the intent. Correlation vocabulary is renamed apart and never interchanged: cohort-correlation evidence (a CT-23 declared evidence slot), fill-attribution label (venue), and correlation_id (tracing)."
    status: ratified
    rationale: "AD-31, closing GAP-0039's journal half; the operator's 'dig deeper, it's not as simple as you think' journals deepening (memlog entry 100) resolved as projections, disclosed as the distiller's correction, and operator-confirmed post-close with the delegated node data-layer verdict (entry 114). The command-fingerprint join was pinned as CT-25 surface by the risk gate (entry 111)."
    sources: [EXT-2063, EXT-2069, EXT-2070]
    component: COMP-QMF-DATA
    tags: [architecture-spine, risk, journals, projections, gap-0039]

  - id: DEC-0146
    title: "Book and BMS admission: linters, shakedown, one signature (AD-32)"
    statement: "A new Book or BMS proves itself in three layers, and no trial period, probation window, or paper-performance gate exists — redemption loops stay dead. Layer 1 — linters, machine, at registration: completeness against the declared contract format version; a unit on every parameter; every number an exact rational or scaled integer; every referenced measure, producer, and venue capability resolvable; worked-example arithmetic recomputed by invoking the cited producer contracts themselves (never linter-local arithmetic, which would be a second implementation of a governed formula); control-rank uniqueness; unit-kind coverage on every declared variable; and the prediction linter — a static can-this-Book-register-this-bot compatibility check that depends on the deferred Bot schema and ships as a pending slot (passes registration, blocks live binding). Layer 2 — technical shakedown on a demo/paper binding: connect, register a bot, execute; proves the machinery works, proves nothing about edge; two named prerequisites so a bring-up deadlock surfaces here and never at the first tick — a recorded live-path rung baseline on this deployment's declared (OS, CPU-class) tuple, and a present baseline artifact for every sensor the Book's doors read. Layer 3 — one operator signature on one assembled page carrying both proofs, the binding identity, the capability-satisfaction result, and the resolved BMS fingerprint (AD-18 card; the plain-words summary an identity field). The admission_bar — 'the Book sets the bar' — is a set of named requirements, each carrying an opaque measure_identity, a mandatory unit, a comparison (at-least | at-most | within-band), a threshold expressed as a mandatory discriminated union with a pinned tag set (a ruled exact rational, or an explicit not-yet-ruled tag carrying its gap reference — the key always present, so blankness is a declared value, never a key-presence test), and evidence_requirements (world, account role, minimum evidence window, and required producer contract format versions). No paper role may gate live money: an evidence_requirements.account_role naming a paper role in a bar gating a live binding is a policy rejection at Layer 1. A float-valued measure compared to an exact-rational threshold crosses the named analytic-to-exact boundary under a comparison rule declared in the requirement itself. Blank blocks live money: a Book whose bar holds any not-yet-ruled threshold or pending slot registers and binds to non-live roles freely, and binding to a live account is a policy rejection — the container ships complete today with every number honestly blank. Parity is structural: a result whose producer contract format versions differ from the bar's declared requirements does not satisfy the bar. No composite score, rating, tier band, or weighted aggregate may express a bar. The same three layers apply verbatim to a BMS definition."
    status: ratified
    rationale: "Operator validation amendment (memlog entry 101: no performance probation, but linters + demo shakedown + one signature; the prediction linter is the operator's own idea); the corpus treats new-Book/BMS validation 'like a bot — similar but not so similar', which is exactly why the layers are technical, never performance-based. Threshold union, producer-invoked recompute, and the no-paper-gates-live rule minted by the risk gate (entry 111)."
    sources: [EXT-2063, EXT-2069]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, admission, gap-0039]

  - id: DEC-0147
    title: "Exit ownership: Book policy, Bot proposals, typed closes (AD-33)"
    statement: "The Book owns exit policy for the life of a position; a Bot may propose an exit through the versioned risk-evaluation door (CT-23), and the Book executes or refuses with a recorded, journal-bearing reason — fast invalidation is preserved as a proposal path. CT-23 is the bot-to-Book inbound port, minted once and read one way everywhere: it carries two typed intent families plus declared evidence slots. Entry intent: instrument, direction, the declared full-loss price, an advisory proposed_r, a typed reason code, and the execution target resolved per AD-35. Exit intents are risk-monotonic by construction — V1 kinds are close_full and tighten_protective_stop, each carrying a typed reason_code (versioned per Book family); close_partial is NOT a V1 kind: the command vocabulary is exactly the five ratified kinds and none expresses a fractional close, so a partial exit could only be emulated by close-then-replace — the unprotected window AD-34 forbids — and is an unsupported-capability refusal in V1. An intent may never widen a stop, extend a target beyond the Book's declared envelope, re-open, or increase size. A tighten_protective_stop names a direction and a bound, never a price; the Book's policy resolves the level, which keeps R single-authored. requested_r is Book-resolved, never bot-supplied: a Bot proposes, the Book resolves and sizes, and only the Book-resolved value enters the command record's identity — the QML donor's TradeIntent omitted volume for exactly this reason. The protective stop attached at entry is Book-owned for the position's life, moved only by Book policy or a protection authority and only in the risk-non-increasing direction measured against the frozen original_risk_distance (stated that way so a ratchet passing entry into profit stays legal); where CT-18 declares protective-stop attachment, every live order attaches a venue-resident stop at placement — the only protection that survives a dead node — and where a Book requires attachment the venue does not declare, placement refuses rather than resting unprotected. Exit method is a declaration, not code in the Book: exit_policy declares ExitLogicRef = {module_id, config} per family — a QML donor atom adopted by dated sitting decision, open to revision by the QML sitting; a Book may declare zero permitted bot-intent kinds — a static-protective-stop-only Book is the honest V1 default; later Book versions may delegate specific exit organs to specific bot families as a version change, not a rule break. Every close carries a typed close reason (generalized from the QML CloseReason taxonomy), addable never redefined: protective_stop_fill | target_fill | protection_amendment_fill | bot_intent | hold_time_force_flat | boundary_flat | window_forced_flat | protection_forced_flat | kill_line_flat | venue_liquidation | venue_initiated_close | operator_close — kill_line_flat minted apart from protection_forced_flat because the kill line and the kill switch are two different things. Every (control-action kind x issuing authority) maps to exactly one close reason through a pinned versioned table. Whole-trade attribution: the full realized result of a virtual position, in R, credits the Bot that opened it, regardless of who closed it — no counterfactual, no apportionment; reports partition by close reason, so the bot's edge and what our own gates cost are one dataset read two ways."
    status: ratified
    rationale: "Operator ruling 2026-08-20 (memlog entry 88: 'for now option one' — Book owns, bots propose, delegation is a later version change), resolving the long-standing DEC-0067 conflict in favor of the repeatedly-corrected direction; close-reason taxonomy and whole-trade attribution ratified in the paper package (entry 97); kill_line_flat, reason_code, and the close_partial removal minted by the risk gate (entry 111)."
    sources: [EXT-2058, EXT-2062, EXT-2064, EXT-2069]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, exits, ct-23, gap-0040]
    supersedes: [DEC-0067]

  - id: DEC-0148
    title: "amend_protection: the fifth venue command (AD-34)"
    statement: "CT-19 gains a fifth command kind, amend_protection, minted through AD-27's own explicit-later-mint clause: typed on qmf-core nouns with exact prices, constrained at contract level to risk-non-increasing changes defined per protection side — a stop-side change may not increase the loss-direction distance measured against the frozen original_risk_distance, and the contract-level check binds the stop side only; target-side changes are governed by the Book's declared envelope, not the risk test. It carries the position or pending-order reference under AD-27's identity discipline — the subject reference the subject-terminal resolution reads, so a stop filling mid-amend is a named outcome rather than a stream-blocking UNKNOWN. It is never emulated by cancel-then-place (that opens an unprotected window) and never widened into a general order amendment. cTrader-platform facts, CONFIRMED-PRIMARY: an open position's protection amends in one message with absolute prices, no cancel-replace; a pending order amends through its own message; and absolute protection is documented as not supported for MARKET orders on the new-order message, so the entry-relative form is the declared placement path — the reference price a relative distance derives from is declared CT-19 contract surface, and because the resting stop may then differ from the declared full-loss price by slippage, the declaration stays the plan and is never read back as the observed fill; no dedicated response message exists, so the four-outcome law and declared acknowledgement modes apply unchanged. Amend atomicity is UNDOCUMENTED in every primary source and is therefore a measured-at-connection CT-18 field under verify-or-refuse: until the verification suite establishes it, a Book policy that depends on amending both protection sides in one act refuses, and single-sided amendment is the only legal V1 path. Venue-managed trailing is a CT-18 capability fact, never an assumed behavior: it is legal only where declared and explicitly opted into by a Book; its pushed changes enter as ordinary observations; it is a named delegated protection authority (authority_kind = venue-delegated), each pushed change minting a control-action record of kind protection_amendment under that authority; routing its closes to protection_amendment_fill is design inference, not a platform fact. V1 dynamic SL/TP is the move-to-breakeven ratchet only: one-directional, risk-reducing, never reset outward, per-Book configurable, its trigger point and offset configurable UI-editable variables with no spine value; richer policies (trailing, laddered targets) are later Book versions through the same declaration."
    status: ratified
    rationale: "Operator round-5 ruling (memlog entry 103) after the requested primary-doc study of cTrader SL/TP amendment mechanics (research-risk/ctrader-sltp-amend-research.md); the per-side amendment rule and venue-delegated trailing authority minted by the risk gate (entry 111). Amends the AD-27 command vocabulary (four kinds to five) and the CT-18 capability roster."
    sources: [EXT-2064, EXT-2069]
    component: COMP-QMF-VENUE
    tags: [architecture-spine, risk, venue, amend-protection, ct-19, gap-0040]

  - id: DEC-0149
    title: "Paper mode: Book-level standing evidence state (AD-35)"
    statement: "Paper is a Book-level mode (DEC-0070 confirmed), expressed as a dated change of the Book's execution binding — a record change, not a new object. Book modes are LIVE | PAPER; no Bot twins, ever; BENCHED is a bot-seat word only and never appears in the Book-mode vocabulary; per-seat routing is expressed on the seat record, never as a Book mode — which is what lets a Book stay LIVE while one seat routes to the paired account, the flip minting a new binding epoch, never a new Book. Paper is a standing evidence state, not a waiting room: any declared condition that blocks live execution routes the Book's activity to its paper target and evidence keeps flowing; trigger kinds are addable never redefined, and every kind declares its disposition — routes-to-paper | blocks-paper — as a mandatory field: a control that blocks live for market-risk reasons blocks paper too (a protection window, the kill switch); a control that blocks live for capital or authority reasons routes to paper (a kill-line stand-down, a benched seat). Routing to paper is never a way around a control — what continues under a control is the recording (the blocked decision on the veto path or the suppressed action on the control-action path, each carrying its would-have-been action); recording is not trading. Current mode is a read-time fold over the append-only transition stream, never a stored mutable field. One active paper-routing target per live binding at an instant (plural demo accounts exist system-wide; the binding resolves to exactly one target, re-pointable by a superseding dated record) — two possible destinations is how an order fires twice; the target is excluded from the live binding's drift check but reconciled as its own binding, and a blocked stream or unresolved UNKNOWN there raises the same alarm class as a live one, because a silent paper outage corrupts every decay verdict computed after it. Routing is separated from binding: a per-intent execution_target is resolved once, at intent mint, from (Book mode, seat state, active-control set) and enters the command record's identity; role rides the execution-target record rather than the binding tuple; live and demo are distinct (VenueId, account) streams, so an outstanding UNKNOWN on one never gates the other. Paper money is frozen evidence: the starting balance is a Book/family-scoped configurable UI-editable default, sized for data-collection realism, frozen at flip, never hand-adjusted; a reset is not an adjustment — it mints a new operator-signed paper epoch record with a fresh declared balance and a lineage edge, the running balance never mutated; paper P&L never becomes Treasury cash, never crosses the money boundary, never buys a seat. Return to live is automatic only where the clearing cause is itself clocked and mechanical; anything touching real money requires an operator signature; paper performance never authorizes a return; mode transitions (CT-24) and control actions (CT-30) are distinct streams — a clocked mechanical clear mints a transition and never a resume, and a control-action stand-down clears only by an operator resume. Decay is judged on decision quality denominated in R, never realized cash; execution quality is a binding-scoped fact never folded into a decay verdict; two streams enter one judgment only when a declared cohort_key matches (Bot identity, Book identity + template version, world, the pinned sensing feed, configured producer fingerprints read as refit-series identities, calendar identity + version, instrument identity or declared equivalence, the active-control set, and the active protection-window set); account role is recorded and deliberately allowed to differ — that is what makes paper-live comparison possible; a judgment spanning mismatched cohorts is a policy rejection, never a silent average. A decay cohort read is an explicitly permitted cross-role read within world = live."
    status: ratified
    rationale: "Operator paper-package ratification with riders (memlog entry 97: 'by default the paper is meant to be the Book'; multiple demo accounts — the single-target rule is per live binding; configurable starting balance); execution_target, the paper epoch reset, paper-stream reconciliation, and the cohort-key additions minted by the risk gate (entry 111). Confirms and subsumes DEC-0070."
    sources: [EXT-2062, EXT-2069]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, paper-mode, ct-24, gap-0041]
    supersedes: [DEC-0070]

  - id: DEC-0150
    title: "Control actions: kill switch, kill line, flatten authority (AD-36)"
    statement: "Two different things, named apart, never merged: the KILL SWITCH is the global black-swan authority — it stops all new trading everywhere, live and paper alike, is sensor-fed (MIS and SQS are inputs, never authorities), escalates automatically and de-escalates only by a human; its effect may additionally be drain or close_all, and which effect a severity carries is the node's severity policy to choose — QMF forbids itself from choosing it and equally forbids itself a contract that cannot express it. The KILL LINE is a per-Book capital floor: breaching it automatically flattens that binding's scope and stands the Book down — a 3am breach never waits for the operator. The exit-preservation invariant is spine-level law: no control action, of any authority, at any scope, may block a risk-reducing act — cancel_order, close_position, close_all, a risk-non-increasing amend_protection, a protection action, or the recording of evidence; the blocking half of any control is always entries only, and no control-action kind whose effect is a blanket command-pipe block may be minted. The control-action contract (CT-30) carries: a typed action kind, each defined once — suspend_new (no new entries; everything open or resting untouched), drain (no new entries and resting orders run to their own terminal state; nothing force-closed), flatten (close the scope), resume; the issuing authority and its kind, enumerated: operator | book_policy | protection_authority | venue-delegated | adapter_self; a subject scope (instrument | book | binding | account | venue | global) resolved at dispatch through a pinned versioned resolution table — unresolvable refuses, is never emulated at a wider scope, and where netting makes a narrower scope indistinguishable from a wider one the action refuses; a mandatory satisfaction predicate from a closed vocabulary (scope-flat-at-reconciled-verdict | no-pending-orders-at-reconciled-verdict | never-auto), with suspend_new and drain never-auto by rule; a reason class plus evidence references. A control action that fans out is a compound command. Flatten authority, assigned: (1) the operator — always, at any scope, unconditional, never removable, never gated on reconciliation; (2) Book policy, only through pre-declared trigger classes — a kill-line breach flattens automatically, an undeclared trigger flattens nothing, ever; (3) the protection authority (kill-switch class) where the node's severity policy declares close_all for that severity; (4) nobody else — the venue adapter never initiates a flatten (its adapter_self actions are limited to suspend_new, drain, throttle, and session state), a sensor emits a typed verdict and never acts, a Bot never flattens another Bot's position. Every other money boundary (rollover, sweep, re-seed, paper flip) leaves positions alone — a money-accounting boundary is never itself a flatten trigger. resume is operator-only: escalation automates, de-escalation does not. Standing intent, not a queue: a protection action is journaled before dispatch, so the intent exists even if nothing reaches the venue; 'is this account under a standing flatten intent' is a read-time fold, restart-proof by construction; on reconnect the node re-evaluates every standing intent against reconciled state and, if still unsatisfied, issues a new command with a new identity — re-deciding is not retrying; the intent never time-expires; flatten satisfies only on a reconciled verdict showing the scope flat — a command outcome never satisfies an intent; drift, unknown, and out-of-lookback verdicts alarm and hold the intent open without dispatching, so a protection mechanism can never open a position against state it cannot see; undeliverable protection alarms loudly carrying the manual fallback. The standing-intent machinery binds every risk-non-increasing act, not only control kinds. The fold contract is stated once for every read-time fold the spine names: each declares its stream, ordering key, knowledge-time bound, and equal-instant disposition; across writers, control and mode folds resolve by rank, never WriterId byte order; no fold on the trading path may refuse — it returns the most restrictive state, journals data quality, and alarms. Veto accounting is symmetric to suppression accounting: every door refusal mints a decision event on the veto path carrying the refusing-door identity, the would-have-been action fingerprint, and the controlling evidence fingerprint; a door refusal (refused before authorization) stays on the veto path; a suppression is an already-authorized action discarded because a higher authority won — carrying the suppressing and suppressed authorities, the would-have-been action referenced by its control-action record fingerprint (a command identity is minted only at submission — no phantom command record may exist), and the arbitration record; enactment links back to intent by enacts edges, never correlation_id. Binding-state vocabulary, enumerated: a Book binding is live | paper | stood-down; a bot seat is active | benched; a state word in neither list does not exist. Which effect fires at which severity is node authority — QMF carries the contract, the scopes, the refusals, and the evidence, never the trigger-to-level-to-effect matrix."
    status: ratified
    rationale: "Operator vocabulary split and flatten-authority ruling (memlog entry 91: kill switch 'flips the entire thing off' vs kill line 'the amount of capital a book touches so that it stops trading'; the operator may flatten anything at any time, authority inalienable); the exit-preservation invariant, satisfaction predicates, fold contract, and veto accounting minted by the risk gate (entry 111), with the kill-switch effect question resolved by operator ruling over the reviewer's suspend_new cap (filed tension)."
    sources: [EXT-2059, EXT-2069]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, control-actions, kill-switch, kill-line, ct-30]

  - id: DEC-0151
    title: "Same-tick priority: one arbitration point per command stream (AD-37)"
    statement: "Priority is defined per (VenueId, account) command stream with exactly one arbitration point per stream — a deliberate cardinality-one under AD-17, scoped per stream so the system still holds many arbiters; cross-stream ordering is a declared non-guarantee, because two venues have two clocks and the replay tie-break carries no causal meaning. Tier 1: venue-resident actions sit outside the ordering by construction — a resting protective stop fires when it fires, its outcome arrives as an ordinary observation, and the superseded-by-fill read-back rule already resolves the node-close-versus-venue-stop race. Tier 2: node-originated actions take one deterministic order derived from the corpus authority hierarchy and the protection funnel (sensors sense, the protection authority decides, the adapter enforces; escalate-only, human de-escalates) — highest first: (0) operator action; (1) protection actions (kill-switch class); (2) BMS/Book forced flats (kill-line stand-down, window force-flat, hold-time or boundary force-flat); (3) fast invalidation (risk-reducing bot exit proposals); (4) ordinary bot exits and protection amendments. Each control-action kind's rank is a declared, mandatory, non-defaultable field — its existence is QMF's, its value is not — and the rank table is BMS-declared, one per command stream, matching the arbitration point's own cardinality (several Books share one stream, so a Book-owned table would put two rank orders at one arbiter); a Book whose control policy contradicts its BMS's table is refused at bind time; ranks are a total order with uniqueness enforced at admission Layer 1, and arbitration resolves strictly by rank with no arrival-order input. Collapse rule: where two pending actions would produce the same mechanical command on the same enforcement scope, exactly one command is emitted — the rank winner supplies the authority and reason, every loser journals as a suppressed control action; rank decides attribution, not whether the position closes. Conflict rule, scoped and compatibility-aware: where pending actions on the same enforcement scope would produce different commands whose effects are mutually exclusive, the higher rank wins outright and the lower is suppressed — never both, never queued — and a lower-ranked action may never undo a higher-ranked one; actions whose effects compose (suspend_new + flatten, drain + flatten) both execute; a higher-ranked action may never reduce the protection a lower-ranked action would have delivered. Provenance is marked so a later reader does not mistake construction for corpus: the rank ordering is corpus-derived (constitution L1 + the protection funnel); the collapse and conflict rules, and the unification of hold-time force-flat with no-overnight, are this sitting's own design — hold-time force-flat exists in the corpus as a name with no value, and no corpus layer defines same-tick arbitration at all. Scope resolution reads CT-18 netting | hedging before dispatch. Hold limits and no-overnight are one mechanism: a Book-declared force-flat rule = (trigger in {position age exceeding a declared Duration | an instant from a named calendar identity}, scope, rank), both producing the same mechanical close at rank 2; QMF supplies no durations, instants, or ranks; a Book that declares no force-flat rule has none."
    status: ratified
    rationale: "GAP-0046 closed from corpus under operator delegation (memlog entry 107: 'seems already answered in GitBook and the trading-node docs — look there'); the GitBook leash chain established as an escalation sequence over time, not an arbitration table, by three independent extractors; freshly-minted pieces (collapse, conflict, hold-time unification) explicitly marked as this sitting's design per the operator's mark-genuinely-new instruction; rank uniqueness and the BMS-declared table minted by the risk gate (entry 111)."
    sources: [EXT-2065, EXT-2067, EXT-2069]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, priority, arbitration, gap-0046]

  - id: DEC-0152
    title: "Protection windows: news, dead zone, handover buffers (AD-38)"
    statement: "One control-window contract (CT-31) serves every no-trade band. A window record carries: the external-fact quadruple (source, source-native event id, revision, known-at) where it derives from a feed; the window as two instants, never an offset — offsets stored instead of bounds would make a record's meaning depend on a policy version and break replay; a resolved instrument scope; a window kind; a reason class; and a format version. Kinds are addable never redefined and a Book declares which kinds it enables. Three kinds are ratified: news; daily_dead_zone (the daily band in which no session is meaningfully in the market); and session_handover_buffer (the pause around a session handover) — both dead-zone kinds exist and are different things per operator ruling; every kind is calendar-derived (market-hours calendar identity + tzdata, never device or broker location) and therefore absent for 24/7 markets; session_handover_buffer declares its anchor side (pre-close | post-open | both) as a mandatory field. Widths, anchors, buffers, and which severity classes produce a window are configurable UI-editable variables with no spine value; recorded evidence, non-authoritative, each carrying its source layer and authority grade: the daily no-session band appears in the QMX-discussion layer twice with disagreeing widths — a one-hour table row ('OVERNIGHT | 19:00-20:00 | Dead zone — no new positions advised') and Flow 9's approximately-three-hours prose — recorded as a disagreement, never merged, and cited for the window definition only under the named corpus-precedence exemption; ~45-minute handover buffers are the operator's later recollection, not found in that corpus; the plus-or-minus-15-minute news buffer is on record as withdrawn. Effect: a window blocks new entries on the instruments in scope, and nothing else — never an exit, a protection amendment, a protection action, or observation; recording is not trading. An instrument under a news blackout stops live and paper entries alike (operator ruling: 'I can't risk it. For now'). Two records the distillation owes the reader: (a) narrowing — the operator's ruling was stated as 'stops all trading' and is implemented as entries-only, because blocking exits would trap risk behind the very window meant to reduce it — a window that closes positions is a declared Book rule at rank 2, never an implicit effect; (b) supersession — this ruling supersedes the dated 2026-08-18 pair-scoped ruling (tracker/map.md:78, 'while blocked, bots may continue in paper mode so alpha-decay data keeps flowing') and five-hats X-6's tag-and-run shape, so one ruling travels downstream, not two. The blocked decision is still journaled on the veto path carrying the refusing door, the would-have-been action, and the controlling window's fingerprint — decay sensing keeps its data points without a trade being placed. Instrument scope is declared, never parsed: scope resolves through dated per-instrument currency-exposure records (venue-populated where metadata exists, operator-declarable and correctable otherwise); reading a currency out of a symbol is prohibited; a missing record means treated-as-affected and blocked while a window of an enabled kind is in force, journaled as data quality and alarmed. A multi-instrument bot is blocked only on the instruments in scope. Provider impact labels are stored verbatim; QMX mints no severity scale in V1; severity-to-window is a declared node mapping. Widen-never-shrink, forward-only: a later revision may pull a start earlier for instants not yet passed or push an end later, never narrow, cancel, or retro-invalidate a window that has had effect; decisions taken under an older revision stand and are tagged; enforcement is at read time, never at intake — the effective window at decision instant T is a declared read-time fold, the union of every revision known at T with passed bounds frozen. Fail closed: a failed calendar refresh, unknown coverage, or an uncertain window blocks; there is no live skip button — the operator's control is upstream configuration between sessions, and a standing per-instrument exemption is a dated fingerprinted record consumed at compile time, never a click. Whether a window ever closes open positions is a Book declaration entering arbitration at rank 2 as window_forced_flat; declaring none is the V1 posture. A window is a door-class refusal, not a kill-switch level — but evidence produced while a window was in force links to the window record by a typed edge, and the active window set enters the decay cohort key, so a news-heavy period is never compared against a quiet one and read as decay."
    status: ratified
    rationale: "Operator news ruling (memlog entry 90) plus GAP-0042 closed from corpus under explicit delegation (entry 106; CT-BMS-04 supplies the record shape and the live-AND-paper rule; the two-instant carriage is three-layers-unanimous), with the desk correction recording both disagreeing dead-zone widths (entry 112) and the round-5 both-kinds ruling (entry 103). Supersedes DEC-0072's pair-scoped framing (the instrument scoping survives re-mechanised through exposure records; the keep-paper-flowing lead is overridden) and the 2026-08-18 paper-through-news ruling."
    sources: [EXT-2059, EXT-2063, EXT-2064, EXT-2066, EXT-2069]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, windows, news, dead-zone, ct-31, gap-0042]
    supersedes: [DEC-0072]

  - id: DEC-0153
    title: "Spread Quality Sensor V1 (AD-39)"
    statement: "SQS — the Spread Quality Sensor — is a CT-16 configured producer (by the routing test it is a value per evaluation instant): identity is its entire declared configuration, warm-up declared, a knowable-at instant on every sample, and typed availability markers replacing the legacy -1.0 sentinel. The V1 formula is adopted from the corpus by operator ruling: score = the instrument's historical average spread for that session window divided by its current live spread — 1 means baseline, above 1 tighter, below 1 wider; a ratio against the instrument's own normal, which is what lets one sensor serve a book of instruments (operator caveat recorded verbatim: 'it was some agent's idea, not mine — go with it' — adopted by ruling, not corpus authority). Conditioning is declared, never inferred: the session window is a named market-hours calendar identity + session id, identity-bearing and entering the baseline's fingerprint; the baseline statistic (mean, median, a stated quantile) is fingerprinted contract surface, never the bare word 'average'. The baseline is a fingerprinted INPUT artifact with its own lineage, not part of the producer's configuration identity: it carries its conditioning window, statistic, and refit cadence; a refit mints a new artifact with a supersedes edge; the configuration cites a refit-series identity plus the refit-policy fingerprint as its derived-input identity — a refit under an unchanged policy does not fork identity, a change to the refit policy does; without that split a daily refit would fork the decay cohort daily and destroy the series this sitting exists to start. Mechanism parts adopted: a hard-block threshold per instrument class; a hysteresis band that must be re-crossed before a block clears; an outlier guard against the spread's own measured dispersion; and a conservative sentinel — undefined, unreachable, stale, or refused means hard block, never a last-known-good value. Instrument class is a dated instrument-metadata record kind (instrument_class), operator-declarable and correctable, never derived by parsing a symbol; no class record means blocked, absence journaled as data quality. Composition order is contract surface: an outlier-guarded sample is excluded from the hysteresis re-crossing test. Every parameter is a configurable UI-editable variable carried as an exact rational or scaled integer with no spine value — thresholds, band, outlier multiple, cadence, baseline window and conditioning, refit schedule, staleness horizon, and the Book's decision_freshness_bound; recorded corpus evidence, non-authoritative and never a default: per-class thresholds 0.60 / 0.55 / 0.45 / 0.65 / 0.50, band 0.05, a 4-sigma guard, per-quote cadence, daily and weekly refits. The score is an exact rational over the two scaled-integer spreads, keeping the whole sensor inside exact arithmetic with no analytic crossing between a measurement and a live-money verdict; the comparison boundary is declared — at or above threshold passes, strictly below blocks. Availability markers are enumerated (ok | not_ready | unavailable | stale | refused), the configuration declaring which the door treats as a block (all but ok, by default). The live-spread input is a tick/quote-sampled channel with a declared maximum age not exceeding the Book's mandatory decision_freshness_bound; a bar-sampled SQS is refused at the door, never blocked through. Bring-up is stated: during the first-deploy warm-up week the sensor reports not_ready and there is no live binding to block; a live binding requires a present baseline artifact, checked at bind time and named among the admission Layer-2 prerequisites. Authority boundary, unanimous across four corpus layers: the sensor computes, the transport carries, the Book's door decides — SQS never sizes, never authorizes, never issues a block itself. V1 blocks only — it never shrinks size, keeping the score off the money path. Versioned: a v2 may add depth/L2 inputs as a new configured-producer version, never a redefinition."
    status: ratified
    rationale: "Operator round-3 ruling adopting the old ratio sensor as SQS V1 (memlog entry 95), resolving the formula DEC-0075 left open; declared conditioning, the baseline-as-input split, enumerated markers, the freshness bound, and bring-up sequencing minted by the risk gate (entry 111)."
    sources: [EXT-2061, EXT-2069]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, sqs, sensor, gap-0043]
    supersedes: [DEC-0075]

  - id: DEC-0154
    title: "R, numeraire, capital, and the dimensional law (AD-40)"
    statement: "R is one relationship with three typed faces, not a number: original_risk_distance — PriceDelta(instrument), entry to the position's declared original full-loss price; original_risk_amount — Money(numeraire), the cost of a full-loss fill at the admitted quantity; r_multiple — a dimensionless exact rational, realized result divided by original_risk_amount, where -1 is a full original loss and 0 is breakeven. Position and Order are anchored as qmf-core shared nouns, each carrying the split this domain needs: a venue position is observation-derived under the venue's declared netting | hedging model; a virtual (Book) position is a fold over fills joined by declared command identity — binding-scoped, Bot-attributed, minted at admission, carrying the frozen R faces — and is the unit of exit records, whole-trade attribution, and the bench fold; every risk record names which of the two it references; where the account is netted, the fill-to-virtual-position attribution rule is a mandatory Book declaration whose absence is a bind-time policy rejection. Both money-bearing faces are frozen at admission and never re-based — not by a stop move, a protection amendment, or an intraday budget re-derivation; the one ruled exception: where an entry fills partially, original_risk_amount is re-based exactly once, at the entry's first terminal state, onto the filled quantity, the admission-time value retained as the declared plan and the re-basing recorded as a lineage edge. V1 admits no scale-in: adding to an open position is a policy rejection; a second tranche needs its own admission and its own R. Every position declares its planned full-loss price before it opens: no declared price, no original_risk_distance, an invalid-input refusal at admission; how the price is derived is a per-family declaration through ExitLogicRef; the consequence in plain words — a strategy that deliberately runs with no planned loss point cannot trade in QMX. Money-to-R crossings name a rate (r_unit_price — Money per r_multiple); an implicit crossing refuses; only r_multiple averages across instruments and accounts. The numeraire is USD system-wide in V1 (operator: 'why would I use anything other than USD?', reconfirmed post-close); the Book charter still declares accounting_currency so a later currency is a version change, and binding a Book to an account in another currency is a policy rejection — no rate source is ratified, and a silent conversion is the one error no report shows; the conversion seam ships and switches on when a source is ruled. Three capital concepts, three types, never fused: roster state (a seat-state enum holding no money), risk allocation (an exact-rational r_multiple, a permission to lose), and capital (Money — virtual ledger equity, broker equity, frozen paper balance, each its own record). The dimensional law makes a second FORM-0006 undeclarable: a closed unit-kind vocabulary, addable never redefined — money(currency) | price-delta(instrument) | quantity(unit) | value-factor(instrument, currency) | r-multiple | rate(money-per-r) | count | dimensionless-ratio | duration | instant — with value-factor (money per price-delta per quantity, the tick/point value) sourced only from venue instrument-metadata snapshots as an exact rational, an absent value factor an unavailable-dependency refusal, never a silent conversion; the reference worked example ships with the vocabulary: original_risk_amount = original_risk_distance x quantity x value_factor. Unit-kind additions are spine amendments only, never per-Book. Every declared variable carries a unit-kind; every formula declares the unit-kind of each input and its output, with a symbolic checker refusing on mismatch; addition, subtraction, and comparison require identical unit-kinds and tags; every formula ships an executable worked example recomputed at tier 2; the dead FORM-0006 is kept as the suite's permanent negative case — a dead formula that can still be typed is a dead formula that comes back. Margin is decided-deferred, never silent: V1 does not size by margin; CT-18 declares the margin model, leverage, free-margin nativeness, and the venue's own margin-call/stop-out level so the dimension is visible; the stated accepted consequence — an R-sized position may exceed what the account can margin, and a second Book on one account can consume free margin the first assumed. The replacement shape, units only, no ratified values: book_capital reads the binding's virtual-ledger equity at the declared period-open instant, excluding unrealized P&L; loss_floor is the same number the kill line names — one value, one name, read by both, never two floors that drift; r_unit_price is fixed at period start unless the Book declares another cadence; loss_runway = book_capital - loss_floor; period_loss_budget = loss_runway / runway_periods; r_unit_price = period_loss_budget / seat_loss_run_allowance supersedes FORM-0004 (dimensionally coherent but mis-named — it computed a rate, not an amount; a derived reading verified against SCN-0001's own checksum); seat_r_ceiling <= seat_loss_run_allowance supersedes FORM-0006 with no money on either side; position_risk_amount = requested_r x r_unit_price, frozen at admission; position_quantity derives across the named boundary with a declared rounding mode. The B split: the one legacy symbol B did two unrelated jobs (bench depth in loss events; a divisor in the money ladder), recorded as the defect that motivated the mandate; two typed variables replace it — bench_consecutive_loss_threshold [count] in leash_grammar, keyed per bot or bot family, and seat_loss_run_allowance [r_multiple] in money_rules; a Book may declare the second derived from the first as declared fingerprinted data, never a hardcoded identity. Book-level limits are expressed only in R or in notional in the Book's numeraire; a limit in instrument-native quantity (lots) is a policy rejection at template validation; a notional limit requiring a QMX-side currency conversion is a policy rejection until a rate source is ratified; a venue-derived notional or margin figure is legal as settlement evidence under the converted_by = venue provenance flag."
    status: ratified
    rationale: "GAP-0044 closed under its standing dimensional mandate: the full-loss-price and B-split closures were corpus-grounded under operator delegation (memlog entries 108, 109); the USD numeraire is the operator's direct ruling (entry 104, reconfirmed entry 115); the unit-kind vocabulary, value-factor kind, virtual-position noun, partial-fill re-basing, and margin visibility were minted by the risk gate (entry 111). DEC-0076 (R is pre-trade risk) stands and is elaborated, not replaced; DEC-0077 (FORM-0006 dead) stands, with the dead formula retained as the dimensional suite's permanent negative test."
    sources: [EXT-2065, EXT-2068, EXT-2069, EXT-2070]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, r-unit, numeraire, dimensional-law, gap-0044]

  - id: DEC-0155
    title: "Stop-out vocabulary, bench counter, and performance evidence (AD-41)"
    statement: "The exit record (CT-29) is minted one per VIRTUAL position close — the Book-side noun, not the venue position, or a netted account produces fewer records than admissions and every fold under-counts. It carries: the virtual-position reference; the frozen original_risk_distance and original_risk_amount (so r_multiple is recomputable forever); the fill references; realized_pnl; a cost_components breakdown (commission, financing/admin fee — a dated fee may exist even on swap-free accounts — and every other named component, each Money(numeraire) with a named source, the set an identity-bearing declaration); realized_r, net of exactly that declared set, with exactly one source — a declared derived display of the record's own frozen fields under a pinned formula, never a second governed implementation of the same division; the close reason; the closing_authority (the arbitration winner) plus the arbitration record reference — suppression counting reads the control-action stream through enacts edges, never the exit record; the result-label parts including account-binding role; and the contract format version of the Book-declared loss predicate. Mechanism and outcome are separate fields — a protective-stop fill may realize a full loss or a breakeven, a forced flat may realize either sign — so no rule is written over the mechanism alone, and the bare word 'stop-out' is not used anywhere. The bench counts qualifying loss exits — closes that realized a loss at or beyond the declared full-loss distance, honouring the operator's 'we only count losses at negative 1R' ruling: the predicate is realized_r <= -q, where q is a declared, UI-editable, per-family template variable defaulting to approximately one R — a configuration the operator sets, never a number the spine invents. Scratches and partial losses do not count by default (a -0.15R scratch is not the damage a leash exists to stop); breakevens never count under any q and are recorded as their own metric (clustering watch), keeping the ruling reversible from evidence; a forced flat or boundary flat is a mechanism, not a verdict — it counts only if it realized a qualifying loss, so the system's own protection never benches the bot it just protected. The bench counter is a read-time fold over the exit-record stream, never a mutable counter — crash-proof by construction and projection-computable; its stream boundary is the binding epoch (a new epoch starts the count at zero unless a signed carries-ledger edge spans it); its knowledge-time bound is the last exit record persisted and journaled at the intent-mint instant, and recording-precedes-interpretation extends: a fill closing a virtual position must have its exit record persisted before any later intent on the same seat is minted, else that intent refuses (stale evidence) — otherwise the (N+1)th entry races the Nth exit record and the leash misses the crossing it exists to catch. The bench threshold is per-bot and configurable (typed count, UI-editable, strategy-family-dependent), never a spine constant; the recorded value of two for a scalper is evidence, previously recorded as unusable until these semantics settled. Vocabulary split: the venue's own 'stop out' means margin liquidation — verified live against cTrader's own glossary at the reviewer gate — and venue_liquidation is reserved for that meaning; the breaker's input is named qualifying_loss_exit; QMX's protective-stop sense is one named close-reason member, never the bare word. Seat state is active | benched on the Bot-Book binding; Book modes are LIVE | PAPER; binding state is live | paper | stood-down — three vocabularies never interchanged, a seat-state write never writes a Book-mode row, and ADMITTED is not a state at all (it is the absence of a binding); a benched seat routes to the paired target through its seat record's execution target while the Book stays live, and the bench event remains on the record after an auto-reset. The performance-result container (CT-32) serves both admission-bar evidence and the analyst's report: the full result label; a declared population (Bot identity, binding-record fingerprints in or out, account roles, instruments, the cohort key — a fingerprinted declaration, not prose); a declared period (an Interval with calendar identity + version, plus the knowledge-time bound it was computed under); the ordered measure set with a unit-kind on every emitted quantity; suppression accounting (counts by authority and reason) AND veto accounting (counts of door refusals by door), so neither our arbitration nor our doors ever read as decay; float discipline — a Sharpe or a drawdown takes label-derived identity, never a hash of float bytes; a single result may never span account roles. A performance metric is a governed producer: its arithmetic is canonical and pinned by its own contract format version — identity moves when meaning moves. Alpha decay ships as evidence primitives only — the exit record, a fingerprinted baseline pointer from a live binding to the evidence it was admitted under, and the result container; no score, rating, tier, or weighted composite; measurement never acts — it publishes, and the authority to act on a published measure belongs to the Book door (bench) or the operator (promotion); the bench fold is one governed producer, published once and consumed by the door. The mathematics is deferred; the collection that makes it possible starts now, because it cannot be back-filled."
    status: ratified
    rationale: "Operator bench ruling (memlog entry 92: breakevens never count, the counter counts losses at ~negative 1R, per-bot configurable) restored precisely by the risk gate after a reconcile pass caught an over-broadening (entry 111); the venue_liquidation split verified live against cTrader's glossary at the gate; resolves what DEC-0094 left open — stop-out semantics, the B/BENCHED namespace, and the fresh alpha-decay evidence base."
    sources: [EXT-2060, EXT-2069]
    component: COMP-QMF-RISK
    tags: [architecture-spine, risk, bench, exit-record, performance, gap-0045]
    supersedes: [DEC-0094]

  - id: DEC-0156
    title: "Corpus precedence for risk, position sizing, and live trading"
    statement: "For risk, position-sizing, and live-trading content, the authoritative sources are the GitBook and the trading-node documentation (archive/recovery and the Documents/QMX wiki); the QMX-discussion layer's risk and position-sizing system was replaced and is BARRED as a source there. Non-risk structural definitions may be cited from the barred layer only under a named exemption stated at the point of use — the dead-zone definition citation in AD-38 is the single such exemption in the spine; no risk, sizing, or money content is taken from it anywhere. This is a different ruling from the authority order (bot -> book -> BMS -> operator) and is named apart so neither can be mistaken for the other. The rule binds the PRD, the documentation factory, and every downstream sitting."
    status: ratified
    rationale: "Operator standing ruling 2026-08-20 (memlog entry 104: QMX-discussion's risk system 'was REPLACED... please don't'), added to the spine's inherited-invariants table by the risk gate as the corpus-precedence row."
    sources: [EXT-2065, EXT-2069]
    component: null
    tags: [law, authority, corpus-precedence, standing-rule]

  - id: DEC-0157
    title: "Configurable means UI-editable at platform level"
    statement: "Everywhere the operator says 'configurable', it means configurable in the platform UI: every configurable variable minted anywhere in QMX must surface as UI-editable at platform level, and every template variable declares ui-editable or uneditable in the template itself (AD-30). The rule applies to SQS thresholds, bench counters, window widths, paper balances, news buffers, breakeven-ratchet parameters — everything. Recorded corpus or recollection numbers attached to such variables are evidence with a stated source layer and authority grade, never ratified constants and never spine values."
    status: ratified
    rationale: "Operator standing global rule 2026-08-20 (memlog entry 96), added to the spine's inherited-invariants table as the configurable-means-UI row and enforced across AD-30/34/38/39/41."
    sources: [EXT-2061, EXT-2069]
    component: null
    tags: [law, configuration, ui, standing-rule]

  - id: DEC-0158
    title: "Risk-gate cross-AD amendments (AD-7/10/12/16/17/18/21/24/27/28)"
    statement: "The risk reviewer gate (four passes: adversarial 54, rubric 45, rulings-reconcile 10, currency 1 — all applied at desk, three operator-ruling-over-reviewer tensions filed in Deferred rather than silently resolved, lint clean twice) amended eight standing ADs with AD ids stable. AD-7/AD-10: a canonical numeric form is pinned for identity — an exact rational entering identity content is reduced to lowest terms, denominator strictly positive, sign on the numerator, serialized as a two-key object; every Money/Price/Quantity/PriceDelta value entering identity carries the declared canonical storage scale for its value class, pinned in the owning contract — equal value implies equal fingerprint by construction. AD-12: two declared cross-role READ exceptions within world = live, and no write exception ever — the decay-cohort read and the entity projection over an entity that operated in more than one role, each carrying role on every row. AD-16: the risk record kinds are minted (Book definition CT-22, BMS definition CT-27, Book binding CT-28, binding transition CT-24, exit record CT-29, control action CT-30, control window CT-31, performance result CT-32, instrument currency-exposure as a dated metadata record); the single continues-as edge is SPLIT into continues-performance (a human-signed track-record assertion consumed only by CT-32 population declarations, moving no money) and carries-ledger (a human-signed per-binding state carry — virtual ledger, cycle position, budget remainder, breaker and bench counters — asserting nothing about comparability), neither ever inferred from the other; enacts is minted (from a command record or outcome observation to the control-action or intent record it enacts — arbitration, suppression accounting, and standing-intent folds resolve through enacts, never correlation_id); supersedes is pinned linear (one head) while AD-30's branching version graph uses branches-from; a treasury boundary-event record kind is reserved (sweep | refund | re_seed | paper_epoch_reset) with no money moving without one, a boundary event never closing a position and never re-basing a frozen R. AD-17/AD-29: every risk-domain cardinality-one is a deliberate ruling. AD-18: a promotion card attesting an admission carries the Book-definition (or BMS-definition) fingerprint as an identity field, so a signature can never attest a superseded template; the risk slot of the evidence checklist landed (the three-layer admission packet and the performance evidence). AD-21: the decision event type carries a mandatory closed outcome field — authorized | refused-by-door | suppressed — with the refusing-door or suppressing-authority reference, so every projection selects on a declared field, never key presence; the control-action type carries the declared suppressed subtype; entity journals are declared read-time projections, never additional writers. AD-24: a light claim benchmark-proven on one (OS, CPU-class) tuple stands on a new tuple as a provisional light claim — alarming, journaling data quality, re-proved within a declared window or reverting to heavy, never reverting mid-session; recording the live-path rung baseline on the deployment's own tuple is a named admission Layer-2 prerequisite. AD-27: the command vocabulary is five kinds (amend_protection minted); the reconciliation verdict vocabulary gains out-of-lookback so 'I cannot see that far back' is never read as 'the position closed' — a standing protection intent re-evaluates only against reconciled, while drift, unknown, and out-of-lookback alarm and hold the intent open; the read-back resolution generalizes to every command whose subject can terminate independently — a command whose subject is observed terminal at or after the submit stamp resolves rejected-by-venue (superseded-by-terminal-subject), a named outcome, never UNKNOWN, never a stream block; a protection act refused by an UNKNOWN block never evaporates — it stands as a standing intent and is re-decided when the block clears; amend_protection joins the dispatch-ahead set; flatten authority is assigned in AD-36. AD-28: the CT-18 roster gains — all measured-at-connection, verify-or-refuse — the account settlement currency (a non-matching binding is a bind-time policy rejection), the margin model, leverage, free-margin nativeness, and the venue's own margin-call/stop-out level, the instrument value-factor metadata surface (absent = unavailable dependency, never a silent conversion), the reconciliation-lookback declaration, and the protection-capability fields (stop attachment form per order type, amendment support for positions and pending orders separately, amend atomicity, venue-managed trailing and its change-event stream, guaranteed-stop class); a money figure the venue itself derived by conversion is settlement evidence, legal as Money(numeraire) under a declared converted_by = venue provenance flag, explicitly outside the unratified-rate-source clause, which governs QMX-performed conversions only."
    status: ratified
    rationale: "The risk increment's cross-AD amendment set, applied by the 2026-08-20 reviewer gate with AD ids stable (memlog entries 110-112); each amendment traces to a named gate finding, and the three overridden reviewer proposals are filed in the spine's Deferred table as revisitable tensions rather than silently dropped."
    sources: [EXT-2069, EXT-2070]
    component: null
    tags: [architecture-spine, cross-ad, gate, edges, identity]

  - id: DEC-0159
    title: "QMB is the backtesting product: name, scope, and the one-library-thin-doors shape (B-1)"
    statement: "The QMX experimentation/backtesting product is named QMB — one library plus the qmb CLI, both halves sharing the name; the command is qmb, superseding the position paper's DC-5 qmx-command proposal (QMX names the entire platform and reuse would confuse operator and agents alike). QMB realizes the glossary's 'future backtesting library' entry: it is an application-layer product built ON QMF — never a QMF roster package — consuming the QMF workspace in lockstep; the Simulator remains a SEPARATE deferred UI product that will consume QMB. The experimentation/backtest vocabulary is SETTLED at this sitting: 'experimentation' is the umbrella activity, 'backtest' the verification stage within it. Vocabulary law: QMB is a library and a CLI — never an 'engine' or 'kernel'; QMF is the only framework; 'snapshot' is banned for registry state (say 'as-of set'). Shape (B-1): every capability exists once, in the library, as a pure function; doors — CLI first (the product face), Python API, MCP later — are thin hand-written wrappers carrying only adaptation logic (parsing, transport, refusal rendering, registry enumeration for autocomplete through the B-15 registry-read port, never a door-side cache); door parity is enforced by a tier-2 contract test asserting identical function surface and semantics across doors; the UI backend consumes the Python API in-process; MCP is a sibling door over the same library (never stacked over HTTP), localhost-bound by default, shipped after CLI v1 and not waiting for the agentic system. Extensibility law: capabilities are added as new adapters, config fragments, or library functions — never by re-architecting the tunnel or the doors. Every agent workspace provisions the SAME qmb CLI as a pinned dependency — one CLI for agents and operator alike."
    status: ratified
    rationale: "Operator naming ruling 2026-08-20 ~9:30pm (QMB, not qmx; MCP re-ruled in) and ratification by delegation of spine B-1; the thin-doors shape answers Jesse's three-heterogeneous-stacks failure and the adversarial finding that doors do carry adaptation logic; the rename settlement executes the glossary's recorded candidate exactly as the sitting the glossary deferred it to."
    sources: [EXT-2073, EXT-2075, EXT-2076, EXT-2080]
    component: COMP-QMB
    tags: [architecture-spine, qmb, naming, doors, b-1]

  - id: DEC-0160
    title: "One resolved run-config per run: the config compiler and disjoint Book/BMS namespaces (B-3)"
    statement: "Every QMB run consumes exactly one fully-resolved, read-only, schema-validated run-config artifact — the operator's wind-tunnel model made mechanism: changing test conditions means changing config variables; the tunnel is never swapped, and adapters are never bound from ambient discovery or code changes. The artifact is compiled from explicit layers with fixed precedence: invocation flags > run spec (the bot layer) > BMS config fragment > Book config fragment > workspace defaults. Book and BMS fragments occupy DISJOINT key namespaces (Book: admission, sizing, exit-door policy; BMS: accounting, constraints, kill-line, reporting); a key collision is a compile-time typed refusal — and in any future sanctioned overlap, BMS outranks Book ('BMS accounts for and constrains Books', DEC-0143). Fragments are generated, schema-validated, fingerprinted DERIVED artifacts carrying AD-16 lineage edges back to their source Book/BMS definitions (CT-22/CT-27) — never a newly minted registry kind, never free-hand-edited. Invocation may take a human alias; the resolved artifact must cite Book definition, BMS definition, and any binding by fp1, never name@version. Every QMB run mints exactly one AD-29 binding with world=replay — a different identity from any live binding of the same Book instance, incomparable to it. starting_capital is a mandatory run-spec field (the binding's virtual-ledger seed, Book-defaultable); a flag override stamps seed_overridden on the binding and forces the run's fold to unrated. The resolved artifact is itself a versioned contract: it stamps its own AD-5 integer format version and declares AD-10 identity-vs-display field classification, so every door computes the same fingerprint and old ledger entries stay readable forever; it is written into the run's output directory, and its fingerprint is the run-id root and the ledger key. Named condition presets (e.g. stress-spread) are config fragments like any other."
    status: ratified
    rationale: "Operator Q2 counter-model ('instead of a snapshot we get a config'; wind-tunnel analogy) verified by mechanism against Lean's CLI (a config compiler producing one resolved read-only config per run); the disjoint-namespace and BMS-outranks rules minted by the QMB gate round 2 to keep the fragment layering consistent with the ratified authority chain; fragment-as-derived-artifact minted at gate round 1."
    sources: [EXT-2072, EXT-2074, EXT-2077, EXT-2078, EXT-2080]
    component: COMP-QMB
    tags: [architecture-spine, qmb, config, wind-tunnel, namespaces, b-3]

  - id: DEC-0161
    title: "Pure run, impure orchestrator: logs during, ONE ledger line at completion (B-4/B-5)"
    statement: "The QMB library's run() is a PURE function: it consumes the resolved config and data reads and RETURNS the canonical result artifact plus a self-assessment — it writes no log and no ledger. Exactly one impure component — the ORCHESTRATOR (the composition root) — owns the injected log and ledger sinks: it streams the run's operational log, and on completion appends exactly ONE ledger line; on observing a dead or cancelled process it appends the aborted line with refusal context, never silently absent. The ledger line carries the full AD-12 result label (evidence class included; provenance=sandbox on factory-sandbox runs), the CT-32 fingerprint, the run's raw AD-40 unit-kinded measures, the fingerprint of the Book bar AS RESOLVED at run time, and a discriminated run role (confirmation | trial | replicate | aborted). Physically the ledger is WriterId-scoped JSONL fragment files — durable WriterId per (machine, role, worker-slot) per AD-8; concurrent processes never share a file (single-file append is not atomic on Windows and PIPE_BUF-limited on Linux) — and 'the ledger' as read is a merge view over fragments within one world-and-role-scoped namespace (AD-12/AD-19). Concurrency (B-5): concurrent runs are separate OS processes (stdlib process management) spawned by the orchestrator, each with an isolated output directory; the governor bounds parallelism by min(cpu budget, memory budget) with typed refusal or enqueue-on-full, never silent oversubscription; every run is cancellable and carries declared per-run time/memory limits whose breach is a typed aborted; 12-14 concurrent runs on sandbox hardware is a motivating reference under AD-13, never a validated budget until a fingerprinted baseline is measured; no Ray, no required Docker, no daemon — sandboxes and laptops run the same uv-installed package. The library never spawns threads or background work (AD-15); all impurity lives in the orchestrator; no module-global mutable state exists anywhere in the library. Runs enter the governed ledger only through the orchestrator; direct library calls in research return values and produce no governed evidence."
    status: ratified
    rationale: "The operator's logs-then-ledger ruling (backtests are logged; completion saves one ledger entry with the unbiased end result) made concurrency-safe and AD-15-clean by the QMB gate: the round-2 adversarial CRITICAL (a pure library cannot also own the ledger append) forced the pure-run/orchestrator split, and round 1 forced the WriterId-scoped fragment physicality; process-per-run is both donors' mechanism, here a free choice rather than a mutable-globals workaround."
    sources: [EXT-2072, EXT-2074, EXT-2077, EXT-2078, EXT-2080]
    component: COMP-QMB
    tags: [architecture-spine, qmb, orchestrator, ledger, purity, governor, b-4, b-5]

  - id: DEC-0162
    title: "The bar verdict is reader-derived and per-requirement, never frozen (B-4)"
    statement: "A QMB ledger line stores raw unit-kinded measures and the fingerprint of the Book bar as resolved at run time — never a stored pass/fail. The bar verdict is computed by one authoritative READ-TIME fold producing PER-REQUIREMENT outcomes against the cited AD-32 bar (structural parity on producer contract versions, unit-kind, and comparison rule); composite scores are banned (AD-32/CT-32). A bar ruled later re-verdicts accrued confirmation evidence with NO re-run; not-yet-ruled is the fold's answer while a requirement is blank, or on a world/role miss. The verdict is legal only on role=confirmation lines whose adapters are the Book-declared set; optimize trials, Monte Carlo and significance replicates, and walk-forward train windows ledger role=trial or replicate plus the objective measure — never a bar verdict — and the Book-bar read selects confirmation lines only. A replay-world verdict can never gate live money (AD-29/AD-32): replay evidence feeds a live bar only where that bar's evidence requirements declare it. QMB publishes; it does not bench, promote, or bind — the authority to act on a published measure stays with the Book door and the operator (DEC-0155). QMB's ledger plus CT-32 artifacts are the designated evidence source for the AD-32 admission bar and the AD-18 promotion-card causality slot, under the standing caveat that replay-world, pre-GAP-0048 evidence cannot gate live money."
    status: ratified
    rationale: "The operator's 'unbiased pass/fail in the ledger' intent implemented without freezing a verdict that a later-ruled bar would invalidate: the QMB gate round 2 made the verdict a read-time fold (re-verdict with no re-run), and the docs-reconcile lens forced per-requirement conjunction and the replay-cannot-gate-live-money caveat into the rule; run-role discrimination minted at gate round 3 so trials never masquerade as confirmations."
    sources: [EXT-2072, EXT-2078, EXT-2079, EXT-2081]
    component: COMP-QMB
    tags: [architecture-spine, qmb, verdict, fold, roles, admission-bar, b-4]

  - id: DEC-0163
    title: "QMB adopts CT-32 and CT-13; per-run logs are operational only (B-10 adoption-not-reinvention)"
    statement: "Every QMB run emits one canonical machine-readable result artifact, and that artifact IS a CT-32 performance-result — the ratified defined-unwired container QMB was always meant to fill — carrying CT-32's fields in full, including suppression and veto accounting (so a run's own control-window and admission doors never masquerade as alpha decay) and the closed AD-40 unit-kind vocabulary. Chart series and trade-event references are DECLARED QMB EXTENSIONS of CT-32: chart series cite exact Bar/Price values (AD-22) as inputs, and any downsample is a display-only derivative with a declared sampler identity, AD-10-excluded from identity, never the canonical payload; trade-event references cite CT-13 journal streams — the trade record IS the CT-29 stream of the run's replay binding. The run's trading events (decision, order, fill, risk-transition and kin) are emitted as CT-13 journal events on writer-scoped streams in the run's world — the ratified journal, not an invented format. Per-run logs are AD-14 operational logs only and are NEVER evidence: under CT-11 only the raw archive and the journal bear evidence, and artifacts cite them. Re-running a run id under its resolved config must reproduce the CT-32 fingerprint; a mismatch is a typed refusal. All human-facing rendering (HTML report, UI charts) is a pure downstream function of the artifact and adds no computation; agents and in-house skills read the artifact, never renderings."
    status: ratified
    rationale: "The docs-reconcile lens's core finding — adoption-not-reinvention: QMB's result artifact was re-specifying what CT-32 already ratified, and its run events were re-inventing CT-13 — applied in full, with the two genuinely new needs (chart series, trade-event references) recorded as declared extensions rather than a parallel format; inverts both donors' failure of computing chart data and discarding it into PNGs and strings."
    sources: [EXT-2074, EXT-2079, EXT-2080]
    component: COMP-QMB
    tags: [architecture-spine, qmb, ct-32, ct-13, ct-11, result-artifact, b-10]

  - id: DEC-0164
    title: "Execution fidelity seams: fill/cost/financing ports, lowest-wins, optimistic taint, calibration-not-invention (B-6/B-7)"
    statement: "The GAP-0048 seams are ruled; its content is not. Inbound execution is a CT-23 Book-resolved intent (or a typed refusal) — the fill ports execute an authorized intent, never a bot-sized order. Execution binds SEPARATE ports per run-config with pinned composition: (1) fill decides Fill | NoFill | PartialFill and a pre-slip price by declared-path crossing inside the slice, partial quantities first-class (capped by position size and instrument lot step); (2) slippage maps to a post-slip price and may veto the fill if the slipped price is not a legal print on the slice; (3) cost itemizes cash charges (commission; financing/admin fee at the AD-8 accounting rollover, not per-slice) on the post-slip fill in exact-integer money, each partial carrying its own pro-rated fee. Financing is a scheduled position-level cash event on open positions (run-loop sub-phase 2), NOT an order fill — per-instrument, per-direction, calendar-scheduled. Fidelity identity is adapter-id + composition-version + taint; 'optimistic' is the taint field, never the identity. A run's fidelity is the LOWEST fidelity of any adapter it bound; mixed-fidelity comparison of Book bars is a typed refusal without an explicit override. Until GAP-0048 ratifies the fidelity taxonomy and calibration content, all fills carry an optimistic taint: such runs cannot spend split budget and cannot claim edge. The forex spread/slippage/financing content is ORIGINAL to the QMX platform — no donor reference exists — and the solve is CALIBRATION, never invention (operator-ruled 2026-08-20): spread schedules measured from QMX's own recorded bid/ask ticks per venue/hour/session, slippage from live and paper fill journals (CT-25), gap behavior from recorded history, financing from the broker's published schedule; per-broker per DEC-0135; each calibration a versioned fingerprinted artifact declared in the result label. World is provenance-derived, never caller-declared (B-7): store-persisted fabricated data is store-tainted and any run reading it is world=simulated — a policy rejection for governed evidence until GAP-0048, legal for infrastructure stress and strategy-logic smoke tests only; procedure-ephemeral perturbation (trade-shuffle, real-seeded block bootstrap that persists no synthetic series) keeps world=replay with the procedure identity + seed in the label and a robustness-only claim class; L20 stands — nothing synthetic validates edge; a clock/adapter-versus-provenance mismatch is invalid input."
    status: ratified
    rationale: "The operator's fill-model ruling (calibration from QMX's own recorded evidence, never invented parameters) plus the spec campaign's finding that neither donor has a usable retail-forex model (LEAN slippage no-ops without volume and has no FX financing; Jesse fills at exact prices with zero slippage) — so the seams ship now with an honest optimistic taint, and the taxonomy values and calibration content remain GAP-0048's sitting; the provenance-derived world closes the synthetic backdoor the adversarial round proved LEAN ships."
    sources: [EXT-2074, EXT-2076, EXT-2078, EXT-2080, EXT-2081]
    component: COMP-QMB
    tags: [architecture-spine, qmb, fidelity, fill, calibration, world, taint, b-6, b-7, gap-0048]

  - id: DEC-0165
    title: "Registry delivery: immutable as-of sets over a passive hub; DEC-0084 stays dead (B-15)"
    statement: "ONE library-owned registry-read port serves every QMB consumer — the config compiler resolves through it and doors enumerate through it for autocomplete; no door-side or second cache exists, so autocomplete and resolution can never answer differently. Registry state reaches a machine as an immutable, fingerprinted AS-OF SET of records and fragments (a registry_as_of instant + set fingerprint) — 'snapshot' is banned vocabulary for registry state — delivered by a PASSIVE file-sync hub: dumb storage, not an always-on service; the central-service option stays dead (DEC-0084), and hub deployment detail belongs to the node/ops sitting. A sweep resolves ONE as-of at batch admission, frozen for every trial and stamped into the sweep label; after admission, fragments resolve by explicit fingerprint, never name@latest. Running against a ref that a fresher as-of shows superseded raises an AD-11 stale-evidence refusal (severity configurable). Write-back: each machine's records travel as its own WriterId-scoped append streams; at hub merge, identical-fingerprint arrivals are idempotent accepts, label-identified float-differing artifacts are lineage siblings (never AD-10 collisions), and true collisions refuse and alarm per AD-10. This is the precise mechanism behind the operator's 'CLI updates when I create a Book': a new Book reaches the CLI as a fresher as-of set, never as a door cache or a live service query."
    status: ratified
    rationale: "Minted as B-15 by the QMB gate round 2, resolving the adversarial break that stateless-fingerprinted state, live auto-update, offline portability, and no-central-service cannot co-hold: the as-of set is the either/or answer, and the passive hub revives the operator's own middle-sync-server idea without reviving the dead central service; batch-frozen as-of sets keep a sweep's trials from resolving different Book versions mid-flight."
    sources: [EXT-2078, EXT-2080]
    component: COMP-QMB
    tags: [architecture-spine, qmb, registry, as-of-set, hub, autocomplete, b-15]

  - id: DEC-0166
    title: "Download-once data acquisition with per-window license tags (B-11)"
    statement: "QMB's data commands (download, verify, catalog, generate) are thin fronts over the ratified QMF data contracts (CT-10/CT-15 intake, rooms, bitemporal law, bid+ask preserved) — no second data layer. Acquisition posture (operator-ruled 2026-08-20): download ONCE under the user's own provider relationship (Dukascopy primary; a dukascopy-node-class downloader as the acquisition-tool reference — github.com/Leo4815162342/dukascopy-node, Node 18+, CLI + library, 1000+ instruments, tick history to the 1990s, web-verified 2026-08-20) into the QMF immutable raw archive: QMX owns its stored source, and runs NEVER fetch from providers — they read only qmf-data rooms. Every ingested window records provenance plus a LICENSE TAG; a source window without a recorded usage right is a typed refusal for governed-evidence use. QMB ships and redistributes no market data. The Dukascopy licensing-gate question — the old corpus failed it — remains an OPEN ops item flagged to the operator; it gates governed evidence only, not experimentation."
    status: ratified
    rationale: "Operator acquisition ruling at the walkthrough (download once and store; QMX owns its source — the QMF-ratified archive posture) with the per-window license tag minted at gate round 2 so an unlicensed window can never silently become governed evidence; supplements DEC-0059 (Dukascopy as V1 historical source) on the QMB side without touching it."
    sources: [EXT-2076, EXT-2078, EXT-2080]
    component: COMP-QMB
    tags: [architecture-spine, qmb, data, dukascopy, license, acquisition, b-11]

  - id: DEC-0167
    title: "QMB distribution: pinned lockfile dependency (uv add qmb), never uv tool; SemVer display-only (B-13)"
    statement: "QMB is a versioned uv/pip-installable package — library + CLI in one wheel. The primary channel is a normal pinned, lockfile-tracked project dependency (uv add qmb), required because the Python API door must be importable; uvx qmb / uv tool install qmb is an optional CLI-only convenience that does NOT provide the importable library and is never the sandbox provisioning channel. Run identity is AD-12's field set plus the resolved-config fingerprint as an input fingerprint; QMB SemVer and QMF roster SemVer ride as display-only provenance on the occurrence record, never identity. The result label also carries registry_as_of (B-15), data and split fingerprints, world, evidence class, fidelity identity (B-6), RNG provenance where stochastic, and provenance=sandbox on factory-sandbox artifacts. Doors may accept a human alias; the resolved artifact cites Book/BMS/bot definition fingerprints (fp1); a dated pointer record ('current') is legal UX; name@version is not a legal identity cite."
    status: ratified
    rationale: "Gate round 1 currency finding: uv tool environments are isolated and expose CLI entry points only, so a tool install cannot serve the Python API door or participate in the lockfile — the npm-analogy 'CLI half' is really pip/uv distribution, and the genuinely npm-like half (strategies and Books as versioned packages resolved from the registry) lands in B-15/B-3, not in the install channel; SemVer-never-identity is AD-10/AD-12 inherited law restated at the packaging boundary."
    sources: [EXT-2073, EXT-2077, EXT-2081]
    component: COMP-QMB
    tags: [architecture-spine, qmb, distribution, uv, semver, identity, b-13]

  - id: DEC-0168
    title: "QMB stack pins: click==8.4.2, optuna==4.9.0"
    statement: "The qmb CLI door is built on click==8.4.2 (BSD-3; pure-Python; verified CPython 3.14-compatible — click publishes no per-version classifiers, so pyreadiness's cross is a metadata artifact; web-verified 2026-08-20). The default optimize sampler adapter is optuna==4.9.0 (MIT; carries the 3.14 classifier; 5.0.0rc1 is a pre-release and is not pinned). Pins are exact-equality. A future optuna major bump changes the default sampler's behavior and is therefore a CONTRACT-VERSIONING event — a new sampler identity on every affected trial label — never a transparent update. Optuna adapters are pinned n_jobs=1: process fan-out belongs to the QMB orchestrator's governor, never to the sampler. CPython 3.14 and the uv/ruff/pyright/pytest/poethepoet toolchain are inherited QMF AD-1/AD-3 pins; qmf-* workspace packages ride the lockstep QMF release (AD-2/AD-5)."
    status: ratified
    rationale: "Web-verified at QMB gate round 1 per the house rule that no version is pinned unverified; the optuna-major-bump-is-a-contract-event rule follows from AD-5 (meanings never change post-hoc) applied to sampler identity, since the spec campaign showed sampler identity is exactly what Jesse's marketed-Optuna failure hid."
    sources: [EXT-2074, EXT-2077]
    component: COMP-QMB
    tags: [architecture-spine, qmb, stack, click, optuna, pins]

  - id: DEC-0169
    title: "QMB spine B-1..B-15 adopted in full (ratified by delegation); the remaining rules"
    statement: "The QMB architecture spine (B-1..B-15 plus the inherited-invariants table, architecture-QMB-2026-08-20/, status FINAL) is adopted in full as the QMB v1 architecture, ratified by operator delegation on 2026-08-20 with a standing right to reopen any B-id at a later sitting; nothing in it touches money-path law. Rules not individually minted above bind through this adoption: B-2 — the event-slice run loop with an injected frontier clock that IS qmf-core's AD-8 Clock protocol (monotonically non-decreasing, emitting wall/replay Instants, never choosing world), a pinned identity-bearing per-slice sub-phase order (frontier/streams -> scheduled position events -> resting-order execution -> indicators/structure on closed data -> strategy callbacks -> new intents rest), higher-BarSpec bars derived from the finest declared base stream and emitted only on completed boundaries (a forming bar is never visible or actionable), in-loop warm-up with trading locked (length = the AD-21 split-manifest embargo, never a second window; the evidence range is the trading interval), new intents never filling against the current slice's path, in non-live runs the Book's SQS door (AD-39) reading the run's modeled-spread series as its spread input (its reconciliation with DEC-0153's tick/quote-sampling and freshness rules an open GAP-0048 item), and simulated-Instant typing refused until GAP-0048 — backtest/replay/live differ only by which clock and adapters the run-config binds, the loop is never forked, and a tier-2 golden-slice determinism test enforces identical fingerprints on identical inputs; B-8 — bots declare typed parameter spaces (exact integer | exact rational | categorical | boolean, bounds, step, default) with optional hard constraint filters, sampled values entering the resolved config only through named AD-7/AD-22 conversions, a PURE sampler function (space, prior ledger results, seed, generation index) stepping in deterministic propose/barrier/condition generations, trial history read from the ledger view (never an in-process study or Optuna's own store), sampler identity + seed + generator provenance + study_fp on every trial label, every trial a first-class B-3/B-4 run, and the anti-overfit parameter-sensitivity analysis emitted with every sweep; B-9 — the research surface is the library's own pure functions importable from a bare uv-installed package, the operator's workstation is a controlled-room host (AD-19/AD-21 in full), other portable contexts receive only unsealed split-governed exports, and sealed or governed evidence never leaves controlled rooms; B-12 — a run declares its full stream set up front (instrument + BarSpec, trading vs data-only roles, declaration order identity-bearing), cross-stream reads only through the declared set, at most one open position per (venue, instrument) (DuplicatePositionStream), one settlement asset per run's trading streams (MixedSettlementAsset), and permutation sweeps are Cartesian batches of isolated fully-labeled runs aggregated only by read-time views; B-14 — the validation ladder (backtest, optimize, Monte Carlo trade-shuffle and real-seeded candle perturbation, rule-significance testing against a detrended zero-edge null, walk-forward) ships as library functions with each statistical procedure versioned as a contract, return-space statistics a declared bounded AD-7 float carve-out re-entering the money path only via named conversions, walk-forward confirmed in by operator ruling while threshold values and pass batteries stay deferred (GAP-0048/0049, 'keep it simple'). LOOK-AHEAD PREVENTION IS DELIVERED by B-2 (forming-bar/completed-boundary rules), B-8 (split-manifest enforcement at every read), and B-12 (declared stream sets); only the registration GATE — the CT-08 evidence checklist — stays deferred per DEC-0121, and B-4/B-8 ledger completeness accrues its raw material regardless. The spine's Deferred table (GAP-0048 content, GAP-0049 + 0016/0017 gate, pass batteries, MCP details, live wiring, cross-stream peer callbacks, UI rendering, QML bot schema GAP-0047, cloud-burst, hub deployment, staged funnel triage, debug/ML-RL/Rust-hybrid, locked validation window, prop-firm Books socketed per DEC-0082) is adopted as the fence: deferred means deferred, with named seams."
    status: ratified
    rationale: "Ratification by delegation (operator 2026-08-20 ~11pm) over the walkthrough acceptance and the session's explicit rulings, after three reviewer-gate rounds (round 1 currency/reconcile-qmf, round 2 all six lenses with the full B-1..B-15 rewrite, round 3 inherited-law reconciliation) plus the docs-reconcile lens, each round's findings applied at desk and lint clean; the prevention-vs-gate split on GAP-0016/0017 is recorded here so the standing DEC-0121 deferral is honored, not eroded."
    sources: [EXT-2071, EXT-2072, EXT-2075, EXT-2076, EXT-2078, EXT-2079, EXT-2080, EXT-2081, EXT-2082]
    component: COMP-QMB
    tags: [architecture-spine, qmb, adoption, run-loop, sampler, research, stream-sets, validation-ladder, look-ahead]

  - id: DEC-0170
    title: "Dukascopy licensing posture: personal use only; the ops flag is closed"
    statement: "The Dukascopy data-licensing ops question that DEC-0166 left open is CLOSED by direct operator ruling (2026-08-21): QMX's downloaded market data is used at a personal level only — backtesting the operator's own strategies — and 'experimentation' in the QMB scope means exactly that personal backtesting, nothing more. Under that posture no licensing blocker stands: acquisition is download-once under the user's own provider relationship (DEC-0166), QMB ships and redistributes no market data, and no data is exposed to third parties or offered as a service. The per-window license-tag mechanism remains in force unchanged as architecture — every ingested window still records provenance plus a usage-right tag, and a window without one remains a typed refusal for governed-evidence use — because the tag is what keeps the personal-use posture auditable rather than assumed. If a future posture ever exceeds personal use (redistribution, a hosted product exposing the data, third-party access), the question reopens as its own sitting before that use begins."
    status: ratified
    rationale: "Operator direct ruling 2026-08-21 ('we are using this data at a personal level... For experimentation, I meant backtesting my strategies. That's it.'), answering the flag the QMB increment surfaced to him; recorded the same day the flag was raised, so no downstream doc carries a stale open-question banner."
    sources: [EXT-2083]
    component: COMP-QMB
    tags: [qmb, data, dukascopy, licensing, personal-use, operator-ruling]

  - id: DEC-0171
    title: "QML identity: the bot-authoring library, thin by law (QL-1)"
    statement: "QML is the bot-authoring LIBRARY of the QMX platform — one uv-installable distribution (import `qml`), an application-layer product built ON QMF contracts exactly as QMB is (AD-2 / L11), never a QMF roster package (ADR-0011), never a framework, never an engine, and never again a cross-component contract layer (the old load-bearing-stratum role is retired; QMF's contracts are the shared layer now). Its whole surface is three thin things: (1) author-side types and helpers producing the Bot-domain registry artifacts (CT-33 Bot definition, CT-34 confluence) on qmf-core nouns; (2) the bot runtime protocol hosts invoke (DEC-0177); (3) the conformance gate (DEC-0178). QML mints NO new QMF-ladder (CT-*) shared contract of its own — CT-33/CT-34 are qmf-registry kinds this sitting fills, and the runtime protocol and conformance contract are QML-local contracts on QML's own AD-5 format-version ladder, exactly as QMB owns its run-config and ledger contracts. The old uniformity rationale ('compare bots honestly — same deterministic risk authority, same formula') is ALREADY delivered by ratified QMF law (CT-23 Book-resolved sizing, AD-40 frozen R, CT-29/CT-32 containers); QML adds only the two uniformities still missing — declared footprint and declared parameter space — so comparability never again requires a private contract layer. Plain Python stays first-class forever: an unregistered bot needs zero QML imports to run in QMB or research lanes (don't-box-in); QML conformance is the ticket into governed evidence and Book seats, nothing else. No acronym expansion is minted (the corpus never expands QML; the L reads as Library). DEPENDENCY STANCE: QML imports qmf-core (nouns, fingerprints, refusals, series vocabulary), qmf-registry (the kinds it authors), and qmf-risk (CT-23/CT-29 types); it NEVER imports qmf-venue. The QMF default-deny Dependency-direction rule is read ROSTER-SCOPED — it governs the seven roster packages internally, never applications built on the workspace (the reading the ratified QMB precedent already exercises, DEC-0169) — and this increment records that as a DECLARED RECONCILIATION NOTE annotated at source against the parent rule, never settled silently by a child. REGISTRATION WRITE PATH is AD-25's root-mints pattern (not AD-28's venue path): the composition root holds the WriterId and the gapless per-(writer, kind) sequence for the Bot-domain record streams, mints the registry records, and sees every RecordSink refusal (block-on-unpersistable); `qml` returns fingerprintable content, never stamped records; the writer unit is (machine, authoring role, kind); AD-28's injected-sink reference is scoped to the conformance runner's I/O only (DEC-0178). The library is PURE per AD-15: no threads, no I/O, no process spawning — every impure step (registration writes, sandbox execution) is host-owned."
    status: ratified
    rationale: "Ruled at the autonomous QML sitting 2026-08-21 (operator delegation) as QL-1; the roster-scoped dependency reading follows the ratified QMB precedent (DEC-0169) and is recorded as a declared reconciliation note by the reviewer gate rather than settled silently by a child, and the AD-25 root-mints write path with the AD-28-scoped-to-sandbox correction was a gate finding (memlog gate point 11). Ratified by delegation under DEC-0184."
    sources: [EXT-2084]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-1, identity, dependency-stance, registration-write-path]

  - id: DEC-0172
    title: "Two halves of a bot; the .qml DSL is not revived in V1 (QL-2)"
    statement: "A governed bot is exactly TWO artifacts. (1) The DECLARATION — a structured configuration artifact under AD-30's template discipline (JSON-Schema-class; every number an exact rational carrying a unit-kind; every configurable variable flagged `ui-editable | uneditable`), registered as the CT-33 Bot definition (DEC-0173). (2) The LOGIC — plain Python conforming to the bot runtime protocol (DEC-0177), shipped as a versioned distribution under AD-2/AD-22 extension mechanics (explicit registration at a composition root, never ambient scanning). The logic's identity basis is its DISTRIBUTION IDENTITY + VERSION + a CANONICAL SOURCE-MANIFEST FINGERPRINT — a normalized, reproducible hash over the source tree, defined as fingerprinted contract surface, NEVER non-reproducible built-artifact/wheel bytes (identical source built in two sandboxes must yield one Bot fp1 per AD-16 dedup); these are IDENTITY FIELDS of the Bot definition, so a code change mints a new Bot exactly as a changed number mints a new Book (AD-30). RULING (the mandatory plain-Python-vs-.qml-DSL question the qml-dig-verification.md input raised): the `.qml` bot-source file format and its Monaco surface are NOT revived in V1 — no second language; what the old `.qml` file carried (entry, filters, gates, subscriptions as editable source) is delivered by the declaration (structure) plus the Python logic (conditions), and the declaration IS the durable, diffable, UI-editable authoring surface. A future declarative condition grammar, editor surface, or agent-codegen lane is platform/agentic territory and COMPILES TO these same two artifacts — nothing forecloses it, nothing waits on it. A model-bearing bot is legal TODAY by baking its weights into the logic artifact (source-manifest identity covers them); a separately-tunable weights-artifact parameter kind is an explicit later mint (Deferred)."
    status: ratified
    rationale: "Ruled at the QML sitting as QL-2; the plain-Python-vs-.qml question was the mandatory question the second QML-named input (the .qml bot-source file format) raised, answered from the operator's standing 'bots stay authorable in plain Python' direction plus don't-box-in and the build-our-own economy — a tagged, individually-overturnable assumption (DEC-0184); the source-manifest (never wheel-bytes) identity basis was a reviewer-gate correction (memlog gate point 8). Ratified by delegation under DEC-0184."
    sources: [EXT-2084]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-2, two-halves, no-dsl, logic-identity]

  - id: DEC-0173
    title: "The Bot definition kind (CT-33) fills AD-16's reserved Bot kind (QL-3)"
    statement: "CT-33 fills AD-16's reserved Bot kind — a qmf-registry per-kind contract on the QMF ladder, authored via QML, owned by qmf-registry like every kind. IDENTITY CARVE-OUT (stated so AD-16's law cannot be misread): the AD-16 common header's writer, sequence, stable id, and created-at are ordering/occurrence fields EXCLUDED from fp1 (the stable id is derived FROM the fingerprint, never hashed INTO it); Bot identity is the SEMANTIC CONTENT ONLY plus the contract format version and at-birth refs. That content is six groups: (1) the STRATEGY-FAMILY id — exactly one (DEC-0176); (2) the CONFLUENCE SET — one-or-more CT-34 fingerprints (AD-17), canonically ordered by child fingerprint ascending with a separate display-only ordinal (AD-30 set discipline), the bot declaring no execution order since sequencing lives in logic; (3) the DECLARED PARAMETER SPACE — THE one authoritative bot parameter-space contract that B-8's optimizer consumes: B-8's schema (name, type in exact integer | exact rational | categorical | boolean, bounds, step, MANDATORY default, optional hard constraint filters) COMPLETED with the AD-40 unit-kind every declared variable already requires — one schema, never two — whose defaults together form the definition's CANONICAL ASSIGNMENT; (4) the FOOTPRINT (DEC-0174), which CONTAINS the stream-set declaration (instrument-role + BarSpec list in B-12's shape, trading vs data-only roles) as one locus, one nesting, one linter target, never a second top-level field; (5) the PERMITTED-INTENT declaration — `entry` is ALWAYS permitted and is never gated by exit_policy; the declaration names the bot's permitted EXIT-intent kinds, a subset of the ratified CT-23 exit vocabulary, WHICH MAY BE EMPTY, with intent-kind identifiers stored as OPAQUE qmf-core-typed values validated by QML-side linters so qmf-registry gains no qmf-risk edge (mirroring AD-22's declaring-an-input-creates-no-package-edge); (6) the LOGIC REFERENCE (DEC-0172's identity basis). VERSIONING is AD-30's git logic verbatim: an append-only branches-from version graph (multiple heads legal; 'current' is a separate dated pointer record), every version readable forever, continues-performance carrying a track record across versions only when human-signed (AD-16/AD-18). Bot identity is content (AD-17): re-binding, seats, and paper flips never mint a new Bot; a changed default, leg, footprint entry, or logic artifact always does. The AD-41 seat record — the Bot side of the CT-28 binding context — cites the registered Bot definition by fp1, and the prediction linter (DEC-0178) runs against that binding context. PARAMETERIZATION LAW: governed live/paper seats execute the CANONICAL ASSIGNMENT ONLY; non-default assignments exist solely as B-3 run-spec overrides in experimentation runs (each fully labeled and resolvable from the resolved run-config fingerprint); promoting a tuned assignment mints a NEW Bot version (branches-from, optionally continues-performance) whose defaults are the tuned values — one identity locus, no tuned bot silently wearing the original's track record. The admission-side check this enables is DEC-0178's canonical-assignment evidence, composing with QMB as a declared sibling extension (DEC-0183)."
    status: ratified
    rationale: "Ruled at the QML sitting as QL-3, filling AD-16's reserved Bot kind; the AD-16 header identity carve-out, the one-schema-completed-with-unit-kinds framing, and the one-family cardinality-one ruling were reviewer-gate refinements (memlog gate points 6, 5, 10); the canonical-assignment parameterization law is a tagged, individually-overturnable assumption (DEC-0184). Ratified by delegation under DEC-0184."
    sources: [EXT-2085]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-3, ct-33, bot-definition, parameter-space, parameterization-law]

  - id: DEC-0174
    title: "Footprint = the single canonical consumption manifest; producer bindings and templates (QL-4)"
    statement: "The footprint is THE single canonical consumption manifest: the stream set (DEC-0173); required calendars (identities + versions per AD-8); and PRODUCER BINDINGS, each either (a) a pinned configured-producer fingerprint (CT-16/CT-17 identity) or (b) a producer TEMPLATE. A template is a COMPLETE CT-16/CT-17 configuration minus ONLY the space-bound parameter values: it carries every AD-22 identity field (formula id, contract format version, ordered named input set, calendar requirements, alignment policy, missing-value policy, warm-up, output schema, supported modes, arithmetic-reference configuration) except the specific parameters bound to named bot-space parameters; an omitted identity field is a Layer-1 registration refusal (AD-22 'a missing element is a contract defect'). Resolution — substituting the space-bound values — is therefore a TOTAL, SINGLE-VALUED function producing one deterministic CT-16/CT-17 fingerprint, so dedup lands on ordinary configured-producer fingerprints and identical canonical runs fingerprint identically on every machine. COMPLETENESS LAW: the footprint's producer-binding set MUST EQUAL the transitive union of every cited confluence's leg producer bindings plus any bot-direct producers; a confluence-leg producer absent from the footprint is a Layer-1 registration refusal. Hosts provide ONLY the declared footprint to the logic (B-12's declared-stream-set law reaching the bot boundary). The bot's warm-up/embargo horizon is DERIVED at resolution from the resolved producer chain (AD-21/AD-22 law), never hand-declared — no second window. Heavy producers are consumed through AD-24's fan-out staleness stamps; nothing new. Book-side footprint_requirements (AD-30's pending(GAP-0047) slot, reserved for this sitting) now gains its contract shape: a SET of typed requirements over CT-33 footprint fields under the same grammar discipline as admission_bar (requirement kind + comparison + a ruled value or an explicit not-yet-ruled tag), with values living in Book templates only, never in contracts; its landing in CT-22 follows the reserved-pending path (DEC-0181). Template resolution is a DECLARED B-3 config-compiler extension AND a node seat-admission responsibility, composing with B-8's value resolution (DEC-0183)."
    status: ratified
    rationale: "Ruled at the QML sitting as QL-4 (draft QL-3b), giving AD-30's two pending(GAP-0047) slots their shape; the single-canonical-manifest framing, the transitive-union completeness law, and the total-single-valued template resolution were reviewer-gate refinements (memlog gate point 5). Ratified by delegation under DEC-0184."
    sources: [EXT-2085]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-4, footprint, producer-template, footprint-requirements]

  - id: DEC-0175
    title: "The confluence kind (CT-34) and the closed-and-addable leg-role vocabulary (QL-5)"
    statement: "A confluence is its OWN registry artifact (AD-17: composites are own artifacts with lineage to children), reusable across bots, cited by fingerprint (CT-34). Content: ONE-OR-MORE legs, of ANY role mix — AD-17's 'one-or-more levels, triggers, and confirmations' is read multiplicity-faithfully as at least one leg of any role, never one of each (mandating one of each would itself be a foreclosing cardinality). Each LEG = (role, producer binding per DEC-0174, optional declared exact parameters); a leg may cite another confluence (composition; the child is its own artifact). The LEG-ROLE VOCABULARY is CT-34's own contract surface, closed-and-addable (addable never redefined): `level | trigger | confirmation | filter` — AD-17's three are the seed (QL-5 formalizes the enum AD-17 left implicit, exactly as AD-40/AD-33 own the unit-kind and close-reason vocabularies, not amending AD-17), and `filter` is the FIRST addition (provenance-marked as freshly-minted design): a suppressing condition consuming the same governed producers, not a new species, giving the old formula's Filters a governed home. The old formula's FEATURES are producer bindings consumed by level/trigger legs — that is their stated disposition. ORDERING: CT-34 legs follow AD-17's fingerprint-ascending default (order-insignificant) with display-only ordinals; a confluence is a declaration artifact, NOT a CT-17 causal-structure composite, so AD-25's order-significant-by-default does NOT reach it; order-significance is opt-in per confluence and enters the fingerprint ONLY when declared. CONDITION SEMANTICS LIVE IN LOGIC IN V1: the declaration carries WHAT is consumed (producer identities) and WHICH role each plays; WHEN a leg is satisfied is the Python logic's job. A fully declarative predicate grammar is Deferred — this is the thin-consumer line: declared consumption + roles buy footprint comparability and lineage without inventing a language."
    status: ratified
    rationale: "Ruled at the QML sitting as QL-5 (draft QL-4); the AD-17 fingerprint-ascending default (a confluence is not a CT-17 causal composite), the closed-and-addable enum with AD-17's three as the seed, the one-or-more-legs-any-role reading, and the Features disposition to level/trigger legs were reviewer-gate refinements (memlog gate point 9); `filter` as the fourth role is a tagged, individually-overturnable freshly-minted addition (DEC-0184). Ratified by delegation under DEC-0184."
    sources: [EXT-2086]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-5, ct-34, confluence, leg-roles, filter]

  - id: DEC-0176
    title: "Strategy family: a key, never an authority (QL-6)"
    statement: "A STRATEGY FAMILY is an opaque operator-minted id under AD-9's discipline plus a dated registry metadata record — the SAME MACHINERY as instrument_class: a kind under CT-06's addable-kinds law, with NO new CT number. A family is a KEYING TOKEN WITH NO AUTHORITY (honoring the newer corpus's own disposition that 'archetype survives as a no-authority naming token') — it is the key the ratified law already reaches for: AD-33's exit_policy declares ExitLogicRef per family; AD-41's q and AD-40's bench_consecutive_loss_threshold are per-family/per-bot variables; AD-35's paper starting balance is family-scoped. Every CT-33 Bot definition declares EXACTLY ONE family id — a deliberate cardinality-one ruling under AD-17 (AD-29's pattern), not an assumption: a family is an attribution key, and one bot keyed to two families would partition every per-family variable and exit-policy resolution two ways. A Book's exit_policy entries key by family id and MAY declare ONE catch-all default entry — ratified into the CT-22 exit_policy shape as an explicit, optional, single default entry through the CT-22 format mint (DEC-0181), with the CT-29 exit record keying the RESOLVED entry (explicit-or-catch-all) so loss-predicate attribution stays unambiguous; a bot whose family resolves no entry fails the prediction linter (DEC-0178). The old ArchetypeSpec's constraint powers (permitted feature families, permitted timeframes, mutation allowances) are NOT revived — constraining is the Book's job (admission bar + footprint_requirements + prediction linter), and agent-mutation governance is agentic-sitting territory. 'Archetype' is the retired alias, recorded in the glossary by this documentation-factory increment."
    status: ratified
    rationale: "Ruled at the QML sitting as QL-6 (draft QL-5) from the newer corpus's own archetype disposition; the one-family cardinality-one and the catch-all's ratification into the CT-22 mint with the exit record keying the resolved entry were reviewer-gate refinements (memlog gate point 10); family = key-not-authority is a tagged, individually-overturnable assumption (DEC-0184). Ratified by delegation under DEC-0184."
    sources: [EXT-2086]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-6, strategy-family, exit-policy-keying, catch-all]

  - id: DEC-0177
    title: "The bot runtime protocol; advisory stop proposal, Book-side full-loss derivation (QL-7)"
    statement: "The bot runtime protocol is a QML-OWNED format-versioned contract on QML's own AD-5 ladder (not CT-numbered, mirroring QMB's own contracts). A conformant bot is a FACTORY the host constructs with (declaration, resolved assignment, injected read surfaces), returning a callback object the host drives PER EVALUATION INSTANT; callbacks receive ONLY the declared footprint's evidence (presence-mapped series per AD-22, structure lifecycle folds per AD-25, each sample carrying its knowable-at instant) and return ZERO-OR-MORE CT-23 intents through the door. The bot NEVER sizes (requested_r is Book-resolved, AD-33), never touches venue commands, never reads a clock (the evaluation instant rides the callback; no Clock access below the host), never performs I/O, network access, or undeclared randomness (a stochastic bot declares a seed parameter in its space). CONFORMANT LOGIC IS DETERMINISTIC: identical (declaration, assignment, evidence sequence, state) yields identical intents — the property B-2's golden-slice test already demands of everything in the tunnel. Bot STATE follows AD-22's streaming-instance discipline generalized: bounded declared state; snapshot/restore as a versioned contract SCOPED TO the tuple (OS, logic distribution identity + source-manifest fingerprint, protocol format version, and the arithmetic-reference build where the logic declares one) — restoring across any component is an unavailable-dependency refusal, and a restored-state fingerprint enters downstream labels. ENTRY-INTENT DERIVATION — BOOK-SIDE, SINGLE-SITED (the reviewer gate's reversal of the draft intent-mint-side design): the bot's entry proposal carries an ADVISORY STOP PROPOSAL — a proposed protective-stop price or PriceDelta bound, advisory EXACTLY as proposed_r is, landing on CT-23's entry intent as a new OPTIONAL field through the CT-23 format mint (DEC-0182). The DECLARED FULL-LOSS PRICE is derived AT THE BOOK DOOR by the Book side executing its own per-family ExitLogicRef (AD-40's 'how' is a per-family declaration), consuming the advisory proposal and the intent's cited evidence; the Book stamps the derived price onto the admitted intent EXACTLY as it resolves requested_r — Book-authored, single execution site, no recompute protocol needed. The bot never computes, carries, or is handed the Book's exit logic — NO Book module is ever injected into bot logic, which is what keeps the bot deterministic on its own tuple, sandbox-testable with no Book present (DEC-0178), and zero-import for plain Python. Ungoverned plain-Python bots follow the same Book-side path: the run spec supplies what the declaration would have (a family id where the Book's exit_policy needs one, or the catch-all applies). OLD execution_profile, DISPOSITIONED: it does not survive as a bot field — order-type preference, slippage tolerance, and partial-fill behaviour are venue/node and tunnel runtime law (CT-18/CT-19, B-6); minimum-RR-before-entry is a BOT-INTERNAL condition in the bot's own logic in V1 (a Book-door version is a later Book template mint); stop-policy/Lbar exam-live PARITY is Book + backtesting territory (GAP-0048). HOSTS: QMB binds conformant bots through a runtime-protocol adapter at its composition root (the plain-Python bridge remains); the trading node hosts seats through the same protocol later."
    status: ratified
    rationale: "Ruled at the QML sitting as QL-7 (draft QL-6); the entry-intent derivation was REVERSED at the reviewer gate (adversarial F1 critical + parent-consistency F1 + rubric RW-4 convergent) from the draft's intent-mint-side ExitLogicRef execution with door recompute to the advisory-stop / Book-side single-sited derivation that keeps the bot zero-import and sandbox-testable with no Book present — a tagged, individually-overturnable assumption (DEC-0184). Ratified by delegation under DEC-0184."
    sources: [EXT-2087, EXT-2090]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-7, runtime-protocol, advisory-stop, book-side-derivation]

  - id: DEC-0178
    title: "Conformance gate, the ticket, and the admission interfaces (QL-8)"
    statement: "Conformance is TECHNICAL, NEVER PERFORMANCE (AD-32's no-probation law mirrored). Two layers and a ticket. LAYER 1 — declaration linter (machine, at registration): schema completeness against the declared format version; every parameter unit-kinded with a valid canonical assignment; every reference resolvable (family record, confluence fingerprints, producer formulas at their declared format versions, logic distribution); footprint completeness per DEC-0174's transitive-union law; template completeness; permitted EXIT-intent kinds within the ratified CT-23 vocabulary; failures are AD-11 typed refusals, journaled. LAYER 2 — sandboxed execution conformance, SPLIT into a QML-owned contract and a host-owned runner: QML owns, as format-versioned pure surface, the denial set (clock/I-O/network/randomness), the static AST/import-scan rules, the determinism harness, a DETERMINISTIC GOLDEN-SLICE GENERATOR keyed off the bot's declared footprint (an identity-bearing conformance fixture), and the verdict function; the host (platform or QMB composition root) owns ONLY process spawning and isolation, feeding results back to QML's pure verdict function — so a bot's conformance verdict is HOST-INDEPENDENT by construction, and no Book is present or needed. The suite asserts: the logic artifact loads in isolation; a golden slice run TWICE yields identical intents; only permitted intent kinds are emitted; the declared state bound holds and a snapshot/restore round-trip is equivalent. V1 ENFORCEMENT SCOPE, STATED HONESTLY: the no-clock/no-I-O/no-network constraints are enforced by the static AST/import scan, capability starvation (hosts inject read surfaces only), and host process isolation; HARDENED OS-LEVEL runtime confinement (restricted tokens/job objects on Windows, seccomp-class on Linux) is NOT promised in V1 — a named deferred dependency of the node/platform sitting — and a dynamically-evasive malicious bot is OUT of V1's threat model (bots are operator- or operator's-agent-authored). THE TICKET: the Bot registry kind mints ONLY for artifacts passing both layers (registration otherwise refuses, policy rejection), and that registration is what governed evidence and seats CITE. Ungoverned bots keep full tunnel access (B-4 ledger lines, the research door): conformance gates evidence CITATION and SEATS, never tunnel entry (QMB's Deferred row honored verbatim). The old max_acceptable_complexity_score anti-sprawl gate is NOT revived — conformance is technical-never-performance; any complexity/quality signal is a later measure, never a registration gate — a decision, not an omission. ADMISSION-BAR INTERFACE (interfaces only — thresholds stay GAP-0048/0049): two bot-side declarable evidence_requirements fields — a REGISTERED-CONFORMANT-BOT CITE (presented CT-32 evidence must cite a registered Bot definition fp1) and CANONICAL-ASSIGNMENT EVIDENCE (the cited runs' resolved values equal the definition's canonical assignment, read from the B-3 assignment_is_canonical stamp / resolved-config fingerprint through a B-4 fold qualifier — the declared sibling extension of DEC-0173/DEC-0183). These are NET-NEW admission-bar surface, not the AD-30 pending slots: they land ONLY through the CT-22 format mint (DEC-0181), never as a silent field addition — under AD-30's unknown-section rule an old parser would silently ignore them and admit exactly the evidence they exist to refuse. PREDICTION LINTER, pinned check list (addable never redefined), running statically on demand and at seat time against the CT-28 binding context, filling AD-32's Layer-1 pending slot: (a) the CT-33 footprint satisfies the Book's footprint_requirements; (b) the bot's declared permitted EXIT-intent kinds are a subset of the Book's exit_policy permitted EXIT kinds (`entry` is never gated — a zero-exit-kind Book, the honest V1 default, admits entry-only bots); (c) the bot's family resolves an exit_policy entry (explicit or the declared catch-all); (d) the bot's stream set lies within the binding's declared venue capabilities (CT-18, through AD-29's bind-time check). GRADUATION PATH: a working ungoverned experiment graduates by minting the two artifacts with a lineage edge back to its originating research artifact (AD-22's graduation mechanics generalized to bots)."
    status: ratified
    rationale: "Ruled at the QML sitting as QL-8 (draft QL-7); the sandbox SPLIT (QML owns the pure versioned contract + golden-slice generator + verdict function, hosts own process spawning so the verdict is host-independent) and the V1-enforcement honesty were reviewer-gate refinements (adversarial F8, rubric RW-3, currency F1); the two admission-bar fields land only through the CT-22 format mint (DEC-0181), never as a silent AD-30 field addition; the complexity-gate drop is a stated decision. Ratified by delegation under DEC-0184."
    sources: [EXT-2088, EXT-2091]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-8, conformance, ticket, prediction-linter, admission-bar]

  - id: DEC-0179
    title: "Exit reconciliation: the donor atoms ratified, the taxonomy stays one (QL-9)"
    statement: "The AD-33 provenance flag ('QML donor atoms... open to revision by the QML sitting') is CLOSED: ratified AS-IS. ExitLogicRef = {module_id, config} stays exactly where AD-33 put it — in the Book's exit_policy, per family — and the Bot definition carries NO exit_logic field (the old BotSpec slot is deliberately dead; the bot declares only its family and its permitted exit-intent subset). CT-29's typed close-reason taxonomy stays the ONE taxonomy; the old CloseReason members map onto it as RECORDED EVIDENCE, never a second contract: SL_HIT -> protective_stop_fill; TP_HIT -> target_fill; TRAILING_SL_HIT -> protection_amendment_fill; MANUAL_CLOSE/MANUAL -> operator_close; KS_FORCED_CLOSE/KILL_SWITCH_FLATTEN -> protection_forced_flat; SESSION_CLOSE -> window_forced_flat | boundary_flat | hold_time_force_flat per trigger; TIMEOUT -> hold_time_force_flat; BROKER_CLOSE -> venue_initiated_close | venue_liquidation; HEDGE_CLOSE -> no successor (no hedge machinery in V1; a future mint under the addable law). CLOSE-AUTHORITY PRIORITY — the dig's ranked donor #5 — is already ruled upstream as AD-37 (per-stream ranks, collapse and conflict rules); the node enforces it; a QML bot emits intents and relinquishes, owning no closure priority. The remaining donor survivor mechanics (WAL/reconciliation restart, amendment idempotency, the conservative never-widen fail-safe) are venue/node-runtime law (AD-27/AD-34), out of QML scope. The old system-owned asymmetric SL/TP authority stays retired (DEC-0024 lineage honored); its surviving mechanics are already law — one-shot breakeven ratchet = AD-34, full-stop losers = AD-40's frozen R + AD-41's qualifying_loss_exit, TP-trail = a later Book version through the same declaration."
    status: ratified
    rationale: "Ruled at the QML sitting as QL-9 (draft QL-8), closing AD-33's provenance flag by ratifying the donor atoms as-is; the CloseReason members are recorded as an evidence mapping onto CT-29's single taxonomy, never a second contract; close-authority priority is already AD-37 and survivor mechanics AD-27/AD-34 (out of QML scope). Ratified by delegation under DEC-0184."
    sources: [EXT-2089]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-9, exit-reconciliation, close-reason, ct-29]

  - id: DEC-0180
    title: "Build order and distribution: QML builds before the node, own SemVer display-only (QL-10)"
    statement: "QML builds BEFORE the trading node, and MAY build alongside QMB — it consumes QMF contracts only (qmf-core nouns/fingerprints/refusals/series vocabulary, qmf-registry kinds, qmf-risk CT-23/CT-29 types), and nothing in it waits on node runtime. NATURAL ORDER: QMF core packages -> QML + QMB -> trading node. QMB exercises plain-Python bots from day one, conformant bots the day QML lands; the trading node hosts the bot-runtime-protocol seats later. The MQL5 analogy survives NARROWED exactly as the prior generation ruled: the authoring layer at the bot-to-Book boundary, nothing wider. VERSION LADDER (B-13 mirrored): the `qml` distribution carries its own SemVer as DISPLAY-ONLY provenance — never identity (CT-33 fp1 and the logic-artifact identity carry identity); it consumes the QMF workspace in LOCKSTEP, and installs as a normal pinned project dependency (`uv add qml`)."
    status: ratified
    rationale: "Ruled at the QML sitting as QL-10 (draft QL-9), answering the operator's before-or-after-the-node question: QML consumes QMF contracts only, so it builds before the node and may build alongside QMB; the own-SemVer-display-only version ladder (uv add qml, QMF lockstep) was ruled at the reviewer gate (memlog gate point 16). Ratified by delegation under DEC-0184."
    sources: [EXT-2089, EXT-2084]
    component: COMP-QML
    tags: [architecture-spine, qml, ql-10, build-order, distribution, semver]

  - id: DEC-0181
    title: "CT-22 format version 2: admission-bar +2 fields, exit_policy catch-all, footprint_requirements shape"
    statement: "CT-22 gains FORMAT VERSION 2 — an AD-5 format-version mint OWNED BY COMP-QMF-RISK (the qmf-risk contract shape) with QML-authored semantics, carried by this documentation-factory increment, migration notes mandatory, pre-mint Book definitions readable forever at format 1 (a v1 reader confronting v2 refuses unsupported capability per CT-22's unknown-version invariant). THREE changes, and nothing more: (1) admission_bar's evidence_requirements gains TWO declarable fields — a registered-conformant-Bot cite and canonical-assignment evidence (DEC-0178) — net-new surface that MUST NOT be a silent field addition under AD-30's unknown-section rule, since an old parser would ignore them and admit exactly the evidence they exist to refuse; (2) exit_policy gains ONE explicit optional catch-all default entry, with the CT-29 exit record keying the RESOLVED entry (explicit-or-catch-all) so loss-predicate attribution stays unambiguous (DEC-0176); (3) footprint_requirements' reserved pending(GAP-0047) slot FILLS with DEC-0174's requirement-set shape (the reserved-pending path, NOT a net-new addition): a set of typed requirements over CT-33 footprint fields under admission_bar's grammar discipline, with values in Book templates and never in contracts. Thresholds themselves stay GAP-0048/0049; the blank-blocks-live-money semantics stand for not-yet-ruled values."
    status: ratified
    rationale: "A parent-contract mint the QML sitting could not make by assertion: minted as an AD-5 format-version bump of CT-22, owned by COMP-QMF-RISK with QML-authored semantics, carried by this increment with mandatory migration notes; the three changes are exactly QL-8's two admission-bar fields, QL-6's catch-all, and QL-4's footprint_requirements shape, no more. Ratified by delegation under DEC-0184."
    sources: [EXT-2091, EXT-2088, EXT-2086, EXT-2085]
    component: COMP-QMF-RISK
    tags: [architecture-spine, qml, ct-22, format-mint, admission-bar, exit-policy, footprint-requirements]

  - id: DEC-0182
    title: "CT-23 format version 2: the advisory stop proposal; full-loss price documented Book-resolved"
    statement: "CT-23 gains FORMAT VERSION 2 — an AD-5 format-version mint OWNED BY COMP-QMF-RISK with QML-authored semantics, carried by this documentation-factory increment, migration notes mandatory, pre-mint intents readable forever (the new field is OPTIONAL, so v2 readers accept v1 content and a v1 intent stays valid). ONE new OPTIONAL entry-intent field: the bot's ADVISORY STOP PROPOSAL — a proposed protective-stop price or PriceDelta bound, advisory EXACTLY as proposed_r is; it never sizes and never binds the Book. The DECLARED FULL-LOSS PRICE stays mandatory at admission, but its derivation site is now documented BOOK-SIDE, single-sited: derived at the door by the Book executing its own per-family ExitLogicRef, consuming the advisory proposal and the intent's cited evidence, and stamped mirroring requested_r (DEC-0177). The GAP-0047 revision flag on CT-23 CLOSES: ExitLogicRef and the CT-29 close-reason taxonomy are RATIFIED AS-IS (DEC-0179), and the old CloseReason members are recorded as an evidence mapping (kept in CT-29, not duplicated here), never a second taxonomy."
    status: ratified
    rationale: "A parent-contract mint the QML sitting could not make by assertion: minted as an AD-5 format-version bump of CT-23, owned by COMP-QMF-RISK with QML-authored semantics, carried by this increment with mandatory migration notes; the one new field is QL-7's advisory stop proposal, and the CT-23 GAP-0047 revision flag closes with the donor atoms ratified as-is (QL-9). Ratified by delegation under DEC-0184."
    sources: [EXT-2091, EXT-2087, EXT-2089]
    component: COMP-QMF-RISK
    tags: [architecture-spine, qml, ct-23, format-mint, advisory-stop, exit-reconciliation]

  - id: DEC-0183
    title: "QMB sibling coordination: assignment_is_canonical stamp, template resolution, completed parameter schema"
    statement: "Three sibling-coordination items are declared here and recorded in the QMB component doc so QMB budgets for them rather than discovering them — declared sibling EXTENSIONS, not a QMB re-architecture. (1) A B-3 resolved-config stamp `assignment_is_canonical` (mirroring B-3's `seed_overridden` precedent) PLUS a B-4 fold qualifier that reads it — the admission-side check behind DEC-0178's canonical-assignment evidence, letting a run whose resolved values differ from the CT-33 canonical assignment satisfy no admission-bar requirement that declares canonical-assignment evidence (checkable from the resolved run-config, no B-4 amendment needed). (2) PRODUCER-TEMPLATE resolution as a declared B-3 config-compiler extension AND a node seat-admission responsibility (DEC-0174), composing with B-8's value resolution — the step that resolves a CT-16/CT-17 template's space-bound values to one deterministic configured-producer fingerprint. (3) B-8's parameter-space schema is COMPLETED with the AD-40 unit-kind every declared variable already requires — ONE schema, CT-33-authoritative, never two (DEC-0173). None of these re-architects QMB; each is a named extension QMB implements at its composition root and config compiler."
    status: ratified
    rationale: "Declared by the QML sitting as sibling coordination (memlog gate point 13) so QMB budgets for the three items rather than discovering them; each composes with existing QMB machinery (B-3 stamps, B-4 folds, B-8 value resolution) and none is a QMB re-architecture. Recorded in the QMB component doc by this increment; ratified by delegation under DEC-0184."
    sources: [EXT-2091, EXT-2085, EXT-2088]
    component: COMP-QMB
    tags: [architecture-spine, qml, qmb, sibling-coordination, b-3, b-4, b-8]

  - id: DEC-0184
    title: "QML spine QL-1..QL-10 adopted in full; GAP-0047 answered (ratified by delegation)"
    statement: "The QML architecture spine — the child spine QL-1 through QL-10 at architecture-QML-2026-08-21/, status FINAL, plus its inherited-invariants table (QMF AD-1..AD-41 and QMB B-1..B-15 binding read-only) — is ADOPTED IN FULL as the QML v1 architecture, and GAP-0047 is ANSWERED/closed. Ratified by OPERATOR DELEGATION 2026-08-21 (the sitting run autonomously, verbatim intent 'try to run this without me... close this out as smoothly and as simply as possible, but be thorough'), with a standing right to OVERTURN ANY TAGGED ASSUMPTION INDIVIDUALLY without unwinding another ruling: (1) no-DSL-in-V1, the `.qml` format not revived (DEC-0172); (2) the canonical-assignment parameterization law (DEC-0173); (3) `filter` as the fourth confluence leg role, freshly minted (DEC-0175); (4) family = key-not-authority (DEC-0176); (5) the advisory-stop proposal + Book-side single-sited full-loss derivation — the reviewer gate's reversal of the draft intent-mint-side design (DEC-0177); (6) CT-33/CT-34 numbering continuing the QMF contract ladder (DEC-0173, DEC-0175). Non-blocking OPEN OPERATOR QUESTIONS recorded (none gates the build): a UI display name for the declaration artifact ('BotSpec' is the old word; the spine says 'Bot definition'); a `qml` CLI convenience (V1 is library-only; QMB and the platform UI are the surfaces); and an NN/ML weights-artifact parameter kind (baked-in weights are governed today via logic-artifact identity — nothing refuses an NN bot; a separately-tunable weights kind is a later mint). REVIEWER GATE applied at desk: 5 lenses (rubric, adversarial, currency/reality, inputs-reconcile, parent-consistency), 34 findings, all applied (reviews/). This increment also records the MIS-CITATION FIX in the QMB spine's inherited-invariants row: 'AD-2 / L21' -> 'AD-2 / L11' (docs L21 is the cTrader law; L11 is the umbrella/library law) — flagged by the QML sitting, applied here. Design is ratified by delegation; implementation authorization still arrives only through the factory pipeline, and all absorbing docs stay status: provisional. Remaining open after this pass: GAP-0016/0017 (registration gate, DEC-0121), GAP-0048 content, and GAP-0049."
    status: ratified
    rationale: "Ratification by delegation (operator 2026-08-21) over the autonomously-run QML sitting, after the five-lens reviewer gate (34 findings, all applied at desk, lint clean twice) and spine finalization at architecture-QML-2026-08-21/; each tagged assumption is individually overturnable without unwinding another ruling, and the three open operator questions are non-blocking; nothing here authorizes implementation, which still ships only through the factory pipeline."
    sources: [EXT-2084, EXT-2085, EXT-2086, EXT-2087, EXT-2088, EXT-2089, EXT-2090, EXT-2091]
    component: COMP-QML
    tags: [architecture-spine, qml, adoption, delegation, gap-0047]

  - id: DEC-0185
    title: "QML veto round: six delegation calls confirmed; leg-may-carry-both; Book-adopts-bot's-stop mode; no second CLI"
    statement: "The operator's post-absorption VETO ROUND over the QML increment (2026-08-21, first-person dictation recorded at desk) — held at the checkpoint DEC-0184 created by ratifying the autonomous sitting with a standing right to overturn any tagged assumption individually. OUTCOME: all SIX delegation-made calls of the DEC-0184 assumption list are CONFIRMED KEPT, none overturned — (1) no-DSL-in-V1, the .qml file format not revived ('we can remove the file format, no problem'; DEC-0172); (2) the canonical-assignment / promotion-mints-a-version parameterization law, confirmed through the operator's own snapshot/copy framing (experimentation overrides mint nothing; a copy becomes a bot version only at promotion — 'until a snapshot turns into an actual live bot'; DEC-0173); (3) filter as the fourth confluence leg role ('add it, seems like I have misunderstood you'; DEC-0175); (4) family = key-not-authority ('good for the UI... add it, no problem'; DEC-0176); (5) the advisory-stop proposal + Book-side single-sited full-loss derivation, kept together with rider B below as its expansion (DEC-0177); (6) CT-33/CT-34 numbering on the QMF ladder, unchallenged (DEC-0173, DEC-0175). TWO EXPANSION RIDERS are recorded, each an expansion INSIDE an already-ratified shape and NEVER a contract format change. RIDER A resolves the recorded CT-34 leg-cardinality coordination question: a confluence leg MAY carry BOTH a producer binding and a child-confluence cite; at least one of the two is required; the role stays mandatory; leg and component counts are never bounded anywhere (twenty level legs plus one trigger is legal; several mini-levels composing one level is legal) — the don't-box-in reading ('if the code makes sense and it went through QMB... it will obviously be able to work'; expands DEC-0175). RIDER B resolves the CT-23 inbound-full-loss-price coordination question, neither refused nor silently invented: bot-owned exit methodologies are FIRST-CLASS — a bot's logic may implement its own exit/TP/stop methodology (VWAP exit, mini-scalper exit, anything) and act through the CT-23 door; AND a Book's per-family ExitLogicRef must support an ADOPT-THE-BOT'S-ADVISORY-STOP-PROPOSAL-AS-IS module mode (validated against the Book's risk rules) so a bot with its own stop methodology is honored rather than overridden. NO inbound-refusal posture is added to CT-23: the advisory stop proposal stays the bot's channel, requested_r stays Book-resolved, and the risk-monotonic law and frozen-R machinery are unchanged — the adoption mode is a DECLARED MODULE MODE inside the existing ExitLogicRef = {module_id, config} shape (DEC-0177, DEC-0179), not a format change ('most bots will have their own exit methodology... it can still work with the same rules for the book, but its exit still remains the same'; 'keep as is with room for expansion'). RULING C closes the sitting's open question 2: QML ships NO CLI, ever in this shape — QMB's CLI is the single command-line surface ('just put it under QMB... I don't know why we would have two command lines'). The CT-29 resolved-entry-keying field-shape question stays DEFERRED-WITH-NOTE, operator-aligned ('same response', consistent with rider B) — no CT-29 change now. Open question 1 (the UI display name for the declaration artifact) stays OPEN, platform territory, now carrying the operator's lean: the bot declaration surfaces READ-ONLY for live bots (editing a live bot makes no sense — editing mints a version), an editable/config view belongs to research mode, and UI naming stays the open platform question (recorded as a note only). Nothing here authorizes implementation; the corpus stays provisional."
    status: ratified
    rationale: "Operator direct ruling at the veto checkpoint DEC-0184 created (2026-08-21, first-person dictation recorded at desk): each of the six delegation-made calls was individually overturnable and none was overturned, and the two riders are expansions inside ratified shapes (the CT-34 leg contents; the ExitLogicRef adoption module mode) rather than contract format changes. Resolves the recorded CT-34 leg-cardinality and CT-23 inbound-full-loss-price coordination questions, closes open question 2 (no second CLI), leaves the CT-29 keying question operator-aligned deferred, and records the read-only-when-live lean on open question 1 (UI naming, platform territory)."
    sources: [EXT-2092]
    component: COMP-QML
    tags: [qml, veto-round, operator-ruling, exits, confluence, cli]

  - id: DEC-0186
    title: "Trading node identity, packaging, and base branch (TN-1)"
    statement: "The trading node is ONE product with two modes, paper | live, and is a top-level uv-workspace member alongside qmb/ and qml/ under the code name qmn — the distribution and import CODE NAME only; the operator declined to rule the product name ('that question is not for this layer') and a rename is mechanical. It is an application layer built ON QMF exactly as QMB and QML are (L11/L31), never a qmf.* roster package and never a framework; nothing QMX is published to any index, and the node installs from ONE canonical checkout root on the VPS — git clone at a pinned commit plus uv sync --frozen, materialized as immutable per-commit trees under a current symlink (TN-16, NFR-10). BASE: node epics branch from origin/integration @ ef9bb25, never the stale local integration ref at 2c8d495, and land back on integration through the factory lane; if the operator squash-merges to main first the lane re-points onto main, a mechanical change, and 'start the node from main' is refused because main carries no packages/, qmb/, qml/ or extensions/. THE NODE SHIPS NO OPERATOR COMMAND LINE and no typed operator door of its own (operator ruling 2026-08-28): its control surface is the desktop UI over the node's doors (TN-17), so PRD FR-046, DEC-0159 and DEC-0185 Ruling C — qmb is the platform's single command-line surface — stand unchallenged and the CLI reconciliation note is WITHDRAWN. Deployment and provisioning are an OPERATIONS TOOLKIT of `just node-…` recipes in the repo's existing root justfile with bodies in one place, qmn/deploy/justfile-recipes/ — install, switch and rollback, the secrets provisioning wizard, the data bootstrap, replay, config init / validate / explain, notify test, hub publish, and the host-loss restore rehearsal on demand — which are DevOps tooling and never a trading control and never a product command line: no recipe places, cancels, amends, flattens, promotes or activates anything, and the restriction is enforced by the transport rather than by recipe text, since recipes run under the powers channel's ops principal for which every trading, protection, promotion, activation, settings, resurrect, attestation and countersign power is refused, node-install / node-switch / node-rollback are privileged host acts through the declared sudo admin path touching no door, a recipe needing live node state makes the same door call the UI makes with no privileged path of its own, and no recipe ever constructs a composition root or imports the Python API in a process other than the node's. Two tier-1 `check` assertions make both claims gates rather than habits: every workspace member declares no publishable target, and qmn's packaging declares no console-script entry point, so the deleted command-line surface cannot re-enter through packaging. A DECLARED RECONCILIATION NOTE stands for the documentation factory, one half only: L30's scope annotation reads 'applications still never import qmf-venue', yet the node's composition root is the one sanctioned importer and wirer of qmf-venue (AD-28 — someone must construct the adapter), the sanctioned import boundary being the `qmn.venue` subpackage rather than the root module alone, with every other qmn module receiving VenueClientPort and CT-19/CT-20 shapes only and the L30 default-deny lint written against that boundary; qmb keeps its ban, the conflict is SURFACED for annotation at source, and nothing is amended by a child. Naming blast radius is bounded: /opt/qmx, the /var/lib/qmx trees, the qmx service account and the qmx/* credential labels are PLATFORM names that do not move, while the distribution name, the import name, the `just node-…` recipe prefix and the qmn_ metric prefix are ONE identifier set that moves together."
    status: ratified
    rationale: "Rests on A1 — RULED and NARROWED by the operator 2026-08-28 (no operator command line for the node; qmn survives as the package and import code name only, the name itself left unruled) — and on A2, nothing QMX published to any index, which stands proceed-on-recommendation. The first-gate ruling at memlog line 46 (5) had restated the second-command-line question as a declared reconciliation note in TN-1's L30 shape and rewritten the operator question; the operator's own ruling (line 48, Q1) then DELETED the operator command line outright and made deployment tooling an operations toolkit of `just node-…` recipes ('a very separate system, like how big tech teams work'), applied at desk by line 49's TN-1 amendment, which also withdrew the CLI reconciliation note because no conflict with PRD FR-046 remains. GATE-2 rulings at line 51 then fixed the sanctioned qmf-venue import boundary at the `qmn.venue` subpackage (9), bound the toolkit to the powers channel's ops principal and added hub_publish as a recipe calling that power (11), added the tier-1 assertions for no console-script entry point and no publishable target (18), and pinned `just` as a registered external tool (29). The pre-ruling memlog text for TN-1 — which named a `qmn` command alongside the import name — is superseded history and is never presented as current."
    sources: [EXT-2094, EXT-2107]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-1, identity, packaging, base-branch, no-command-line, operations-toolkit, l30]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-1"

  - id: DEC-0187
    title: "The composition root and the boot ceremony — compose, fingerprint, seal (TN-2)"
    statement: "The node is the ONLY place ambient time, broker sessions, secret values, async, threads, processes, schedules and real money exist; everything below it stays pure (AD-15, L13). Two things happen before act 1, so a boot that never finishes is still observable and still recoverable: the supervisor/door layer BINDS FIRST — the evidence channel, a preflight-status read model and the resurrect power — and a BOOT-ATTEMPT RECORD carrying the boot epoch id, the unit role and the stage reached is the first durable write, onto which composition_fp is stamped at act 3 as an amendment; only a failure that prevents the doors themselves from binding exits non-zero, every later failure booting into stand-down-alive (TN-4, which owns the exit model and the crash-loop fold). Boot is then four ordered acts. (1) PREFLIGHT, a gate before any state mutation: host, disk headroom, network, clock sync (chronyc waitsync), pinned CPython/uv/proto tag/tzdata, credential presence by is_set metadata only, store reachability, the roster's declared credential-sharing facts, the roster's VPS machine tuple, the absence of any systemd unit running under an operator-principal uid, and the ownership and mode of every writable tree — where a DETECTED refusal is fail-closed with a typed failure id, journaled, and leaves the node alive in stand-down with the doors serving, so it never exits, no systemd restart follows and the crash-loop fold never advances. (2) COMPOSE from ONE resolved node-config artifact (TN-18): the roster of account bindings (VenueId, AccountId, role, world) with credential references, Book/BMS definition cites by fp1, VenueClientPort implementation selection by the pair (world, VenueId) and never by VenueId alone, explicit registration of every market-hours, day-boundary and news-calendar extension and every producer extension (never scanning), every do-not-default value, plus the real Clock, the SecretStore, the sinks and the scheduler — with a world = replay composition selecting the replay implementation for every VenueId, resolving no credential reference, constructing no venue-session SecretStore holder and opening no socket, all three proven at preflight or the boot is refused. (3) FINGERPRINT: composition_fp = fp1 over the resolved node-config fp1; every distribution identity and version (qmf lockstep, qmb, qml, qmn) and every registered extension's identity and version; the proto release tag; the tzdata version; each adapter's static capability-declaration fp1; the registry as-of set fingerprint; every market-hours, day-boundary and news-calendar CODE identity and version in play; and the OS/CPU-class tuple — stamped as occurrence provenance on the boot-epoch record of every journal stream and on every artifact label, so that because journal.sequence is gapless per (writer, boot-epoch) every evidence row traces to the exact composition that produced it. The dated snapshot data those recorders ingest is deliberately NOT part of the composition (a data revision never requires a restart while a code change does), the venue-observation profile is excluded because it is measured post-seal, and every candidate labeler's identity enters TN-19's separate shadow_composition_fp so registering or changing a candidate never re-identifies governed evidence. (4) SEAL: the composition is immutable for the boot epoch with no hot reload of anything identity-bearing — a config change is a new resolved config version plus a supervised, drain-aware restart at a safe point (TN-4 defines the term) that never flattens, lets standing intents survive as folds, and never changes a runtime state. ONE IMPURITY IS DELEGATED, named here and nowhere else: qmf-venue's ConnectionManager holds the venue socket, the venue session and the single in-memory venue secret value, running on the loop the node injects under the injected Clock and SecretStore, owning no event loop, creating no task the node's scheduler did not schedule, reading no ambient clock and holding no money — with the QMF async conformance test amended in the same increment to exempt qmf.venue.connection BY NAME, and if that exemption is refused at the parent the increment lands in qmn.venue.ctrader instead and the epics may not choose between the two. WriterId allocation is the root's exclusively: every WriterId is allocated at Compose from a declared namespace and handed to its writer, no component derives its own, the root proves the allocated set pairwise distinct before Seal and journals the full allocation on the boot-epoch record beside composition_fp, refusing to boot on a collision, and the allocation names each (VenueId, account) command stream, the venue recording feed, the risk-domain writer (AD-31's owner of decision, risk transition, control action and promotion events), the Bot-domain record streams, each streaming-indicator feeder and each timer unit — with ONE id RESERVED rather than allocated, the SUPERVISOR WriterId, a constant of the unit role that must exist before Compose because it owns the boot-attempt and lifecycle stream under /var/lib/qmx/state, which Compose may never re-issue and which the distinctness proof includes. Timer units run an abbreviated ceremony from the config version the RUNNING NODE sealed, read from the node's boot-epoch record over the evidence channel and never from the config graph's current pointer, computing composition_fp over the same inputs so one deployment yields one value, minting their own boot epoch stamped with the unit role and writing only under their own allocated WriterId; where the node is not running a timer composes from current and stamps node-absent, a timer that can neither read the sealed version nor establish that the node is down refuses to write and alarms on the silent-degradation class, and a timer that would need to compose anything the node process does not hands its work to the running node through the doors instead, honoring B-4."
    status: ratified
    rationale: "Rests on A4 — the named compose-fingerprint-seal ceremony was grep-verified absent from every corpus layer and is CONSTRUCTED here from AD-25 root-mints, B-3 one-resolved-config and AD-28 two-phase wiring, with no hot reload and restart-at-a-safe-point — and on A43, the reserved supervisor WriterId as a constant of the unit role; both proceed-on-recommendation and individually overturnable. First-gate rulings at memlog line 46 supplied the supervision mechanics (11): the doors bind BEFORE preflight, the boot-attempt record is the first durable write, only a door-binding failure exits non-zero, and READY=1/WATCHDOG=1 belong to the supervisor layer; (8) fixed that the resolved config carries eligibility and identity only, never runtime state; and (12) pinned systemd-creds encrypt --with-key=host and the fixed qmx service account the trees hang off. GATE-2 rulings at line 51 then added that a detected preflight refusal never exits (5), that the port implementation is selected by (world, VenueId) with a replay composition resolving no credential, holding no venue secret and opening no socket (6), the delegated-impurity clause with the named qmf.venue.connection async exemption and the qmn.venue import boundary (9), timer-unit composition from the version the running node sealed with the node-absent stamp and the refuse-and-alarm case (16), and the reserved supervisor WriterId under /var/lib/qmx/state (25)."
    sources: [EXT-2095]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-2, composition-root, boot-ceremony, composition-fp, writerid, delegated-impurity]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-2"

  - id: DEC-0188
    title: "Topology, planes and trust boundaries — three planes, two machines, one bucket (TN-3)"
    statement: "The node's topology is three planes, two machines and one bucket. VPS PLANE (Linux, always on): ONE node process hosts the trading loop AND the live tick, bar and depth recording, because cTrader allows at most one demo plus one live connection per application, so the connection manager's canonical sensing feed IS the recorder and a separate recorder process cannot hold its own live connection; separate scheduled units run the news-calendar recorder, the nightly backup, the nightly sample restore and the monthly full restore under distinct WriterIds; the VPS provider is deployment configuration exactly as the broker and the bucket provider are, never architecture; the always-on EVIDENCE TIER is a second directory tree on the same VPS — a placement and authority boundary, not a second host, not a database server and not a second writer — into which hot rooms sync one-way, watermarked, idempotent and resumable under verify-before-purge, never blocking on it; and the VPS is the ONLY plane holding live venue credentials. WORKSTATION PLANE (Windows 11 now, Linux later): the working archive as a controlled-room host, research reads, the future desktop app and the provisioning wizard, holding provisioning and bootstrap material ONLY and never rotated live session material — the VPS session is the only refresher and the only holder of live session state, so a workstation tool never refreshes a credential the VPS session owns — with Windows Credential Manager qmx/* as the provisioning source, the escrow home of the CT-14 backup payload key, and the home of workstation-local secrets only. BUCKET: nightly encrypted versioned copies, ciphertext only, PUSHED BY THE VPS and never by the workstation, because a 24 h RPO cannot depend on a laptop being awake and the bucket credential belongs where the timer runs. EPISODIC SANDBOX PLANE (factory agents): evidence carries provenance = sandbox, never merges, and never holds live secrets. Flows are ONE-WAY node to evidence tier to workstation, and node to bucket, with exactly TWO inbound crossings and no others: the click-gated promotion pull of registry as-of sets from the passive hub, which REFUSES any artifact carrying provenance = sandbox at pull (TN-20); and the sandbox fragment push into the write-only inbox over a restricted key-only SSH identity confined to /var/lib/qmx/hub-inbox, distinct from the operator's key and from TN-12's provisioning identity. The PASSIVE FILE-SYNC HUB is a SEPARATE TREE from the evidence tier's rooms (B-15) — a write-only inbox that sandboxes push WriterId-scoped fragments into, and a read-only published area holding as-of sets — and the inbox-to-published step is AN OPERATOR ACT, not a background sweep: the hub_publish power on the powers channel, signed and journaled, verifying each fragment's fp1 and refusing provenance = sandbox at publish as well as at pull, with `just node-hub-publish` as the toolkit recipe calling that same power; the one-way evidence sync never writes into the inbox, the inbox is never a room, and nothing in either area is a service. Writable trees are named once and pinned into the unit files by TN-16 — /var/lib/qmx/rooms, /evidence, /hub-inbox, /hub-published, /archive (immutable raw archive), /state (rotated secret material, the supervisor stream of boot-attempt and lifecycle records, and TN-4's reserved protection-intent extent) and /staging — all owned by the fixed qmx service account, beside two trees that are NOT the node's: /opt/qmx, holding one immutable tree per commit plus the current symlink, and /var/lib/qmx-observability, owned by the observability stack's own distinct service account; every one of these is a named line item of vps_disk_budget. ROOM-ROLE PLACEMENT is per world: AD-19's seven roles plus one node-minted eighth, `sealed-archive`, all instantiated for live and for replay — the ingest door, the immutable raw archive and the processed and journal rooms under rooms/<world>/; the split-governed research door, the registry room and sealed-archive under evidence/<world>/; the backup role is the bucket — where sealed-archive is what the one-way sync writes into and what TN-21's replay import port and TN-13's backup read by name, a hot room may be purged under hot_room_retention_window only when a verified copy exists in sealed-archive AND a verified off-host copy exists, and replay gets its own instances of all roles under the same trees, the storage separation AD-12 requires rather than identity distinctness alone. The eighth role is surfaced as a parent annotation for the documentation factory, never asserted by the child."
    status: ratified
    rationale: "Rests on A3 — the evidence tier and the passive hub as directory trees on the same VPS, a second VPS later being a config change — and on A44, the named sealed-archive room role per world as the sync target read by the replay import port and the backup and as a precondition of any hot-room purge; both proceed-on-recommendation. The first-gate ruling at memlog line 46 (12) fixed the User=qmx service account for all units rather than DynamicUser, enumerated the writable trees under /var/lib/qmx with ProtectSystem=strict plus ReadWritePaths, and named the secret holders whose placement this rule assumes. GATE-2 rulings at line 51 then made hub_publish a closed-list power that refuses provenance = sandbox at publish as well as at pull, with a recipe calling it (11); made /opt/qmx immutable per-commit trees plus an atomically flipped current symlink pruned to a declared depth (12); gave the observability stack its own account and storage tree under /var/lib/qmx-observability with its own quota as a named budget line item (13); and minted the sealed-archive role per world with the two-copy purge precondition (26). Where the original memlog TN-3 entry read 'ONE-WAY node to workstation to bucket' with the hub pulled by the workstation, the amended spine text governs: the bucket copy is pushed by the VPS and there are exactly two inbound crossings."
    sources: [EXT-2096]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-3, topology, planes, evidence-tier, passive-hub, sealed-archive, trust-boundaries]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-3"

  - id: DEC-0189
    title: "Process model, supervision, stand-down-alive and the shutdown contract (TN-4)"
    statement: "The node is ONE long-lived process supervised by systemd — qmn.service, Type=notify, WatchdogSec set, Restart=on-failure — implementing the sd_notify wire protocol itself over a stdlib AF_UNIX datagram socket (READY=1, WATCHDOG=1, the leading-NUL abstract-socket form and an unset NOTIFY_SOCKET all handled) with no python-systemd or sdnotify dependency; THE KEEPALIVE IS OWNED BY THE SUPERVISOR/DOOR LAYER, never by the domain slice loop, so it continues through stand-down while the loop is quiescent, and that decoupling carries one obligation — the door layer also runs TN-19's slice-progress watch, so a loop wedged inside a non-cooperative seat callback stops the keepalive rather than being masked by it. Inside there is exactly one asyncio event loop with async ONLY at the venue edge and the doors (AD-15): the domain loop runs synchronously on that loop's thread per slice; the node's own scheduler drives the adapter's five declared session duties — heartbeat at its 10 s venue-bound cadence, token refresh keyed by credential reference, reconnect, gap replay, and the verification monitors including the continuous D1-boundary monitor — plus the nightly cycle, the news-calendar refresh and the backup and restore hooks; NO threads carry domain work, and stdlib process-per-job is used only for isolated work — conformance Layer-2 runs, benchmark runs and replay runs — with a replay run ALWAYS a spawn OUTSIDE the node process, composing a replay-scoped root from the same resolved node-config artifact at world = replay, drawing WriterIds from a disjoint namespace, resolving no credential reference and constructing no live sink. Drain-order discipline applies to dequeue for interpretation ONLY and never to the record-and-journal order: execution and system events are interpreted before market data so a tick storm cannot starve risk checks, while the accumulator's recorded stream preserves arrival order verbatim, which is what keeps TN-21's replay diff meaningful. NODE STAND-DOWN IS AN ALIVE LIFECYCLE STATE, not a CT-30 control action: it is entered automatically on a crash loop, a halt clock band or a preflight failure, and left ONLY by an operator resurrect act through the powers channel — journaled as an AD-21 control action EVENT under the declared node subtype node_resurrect at global scope, minting no CT-30 record and no CT-30 kind — with no clocked clear, no reconnect, no reconciled verdict and no restart leaving it, and it is named apart from the binding state stood-down and from CT-30 resume. In stand-down the sequencers refuse and journal ENTRY intents only — place_order and risk-increasing amend_protection, whatever their author — while EVERY risk-non-increasing act passes whatever its author: a Book-minted protective close, a declared force-flat trigger, an ExitLogicModule-derived exit, a bot-proposed risk-non-increasing tighten, the standing-intent dispatcher, and every operator-signed protective command (flatten at any scope, close_all, close_position, cancel_order, risk-non-increasing amend_protection); where the sessions have quiesced a protective command is journaled as a standing protection intent before dispatch and satisfied on the next healthy session, never refused and never dropped, because 'reachable in stand-down' means ENACTABLE and not merely answerable, and the doors keep serving throughout so resurrect, the evidence channel and the preflight-status view stay available. THE EXIT MODEL is stated once here and cited from TN-2 and TN-16: a DETECTED refusal at or after preflight is typed, journaled and DOES NOT EXIT, so no systemd restart follows; the crash-loop fold therefore governs only failures that DO exit — a failure to bind the doors, and any unhandled process death after boot — while a REQUESTED restart (a settings edit, a node-switch) exits with the reserved code 75 under RestartForceExitStatus=75 and SuccessExitStatus=75 so systemd restarts a clean drain rather than treating it as a failure, stamps reason = requested-restart on the next boot-attempt record, and NEVER advances (K, T). The crash-loop fold counts UNREQUESTED BOOT ATTEMPTS — K attempts within T seconds, node values, UI-editable, evidence value 3 boots in 60 s — read from the boot-attempt records the supervisor writer lays down before preflight, counting every attempt within T regardless of the stage reached (the stage is recorded for diagnosis, never for bucketing), with StartLimitBurst MUST exceeding K and StartLimitIntervalSec at least T so systemd carries the node to the boot that self-detects the loop and the counter decays once the process stops exiting; a burst at or below K leaves the node dead at start-limit-hit with no doors, the one case answered by TN-15's dead-man's switch rather than by a stand-down. A SAFE POINT, defined once and cited from TN-2, TN-16, TN-17 and TN-18, is a state in which the slice driver is between slices, suspend_new is enforced on every stream, every command has reached a terminal outcome or has had an UNKNOWN minted for it, and every sink has flushed with block-on-unpersistable honored — positions are NEVER waited on — bounded by drain_window (a configurable node value, duration unit-kind, blank blocks boot, from which TimeoutStopSec is rendered) whose breach is a typed refusal rather than an indefinite hang, with watchdog_interval the second such value, rendering WatchdogSec so a config change and a unit file can never disagree. THE SHUTDOWN CONTRACT: SIGTERM mints a boot-epoch lifecycle STOP — not a CT-30 action — which enforces suspend_new on every stream journaled with authority adapter_self, then closes sessions with no command resubmission, then mints an UNKNOWN for every command still without a terminal outcome under the declared trigger disconnect (the mint following session close so AD-27's trigger vocabulary applies honestly; a distinct lifecycle-stop trigger is offered as a proposed CT-20 mint and until the parent rules it this ordering is the node's rule), each journaled against its command identity so L35's stream block survives the restart, then flushes every sink with block-on-unpersistable honored; reaching the safe point exits 0 for an operator stop and 75 for a requested restart, failing to reach it within drain_window mints UNKNOWNs for the remainder and exits on a code that is neither, and if the flush itself cannot complete the node stays up, alarms on the silent-degradation class and refuses to exit clean — shutdown NEVER flattens and standing intents survive as folds to be re-decided at the next boot. Under a full disk the block-on-unpersistable rule and L39 compose rather than collide: the block is entry-side only, the venue-resident protective stop carries the position, and the door-owned keepalive keeps answering while the loop is legitimately blocked on storage so systemd never converts a storage stall into a restart; and a protection intent that cannot be journaled into its room is written instead to a small RESERVED PROTECTION-INTENT EXTENT under /var/lib/qmx/state, pre-allocated and sized by disk_headroom_min so the headroom block trips first, re-decided when storage returns (re-deciding is not retrying), and recorded UNDELIVERABLE and alarmed on the silent-degradation class if even that write fails — never 'held in memory' and never silently dropped."
    status: ratified
    rationale: "Rests on A5, the crash-loop evidence value of 3 boots in 60 s, and on A46, the reserved protection-intent extent under /var/lib/qmx/state as the unpersistable-journal fallback with UNDELIVERABLE as the honest terminal state; both proceed-on-recommendation and individually overturnable. First-gate rulings at memlog line 46 supplied the never-auto frame (3) — the SIGTERM stop as a boot-epoch lifecycle state rather than a CT-30 action, and node stand-down entered automatically on a crash loop, halt band or preflight failure and left only by an operator resurrect journaled at global scope — and the supervision mechanics (11): doors before preflight, the boot-attempt record as the first durable write, raw sd_notify over a stdlib AF_UNIX datagram socket owned by the supervisor layer, StartLimitBurst > K with StartLimitIntervalSec >= T, TimeoutStopSec at least the declared drain window, the four-part safe-point definition, and the shutdown mint of an UNKNOWN per in-flight command. GATE-2 rulings at line 51 then made stand-down refuse ENTRY intents only whatever the author while every risk-non-increasing act passes (3), declared resurrect an AD-21 control action EVENT under the node_resurrect subtype rather than a CT-30 kind (4), separated detected refusals (never exit) from exiting failures and minted exit code 75 for a requested restart that never advances (K, T) (5), placed the reserved protection-intent extent with UNDELIVERABLE as its terminal state (21), gave the door layer the slice-progress watch that stops the keepalive (23), and minted drain_window and watchdog_interval as configurables from which TimeoutStopSec and WatchdogSec are RENDERED by node-install (28). The original memlog TN-4 entry's simpler shutdown path (suspend_new, flush, close, exit 0) is superseded by that amended contract."
    sources: [EXT-2097]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-4, process-model, systemd, stand-down-alive, resurrect, safe-point, shutdown-contract]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-4"

  - id: DEC-0190
    title: "The live loop is QMB's loop, unforked, behind a push-to-pull accumulator (TN-5)"
    statement: "The node drives QMB's B-2 event-slice loop through run_slice, the pure single-slice function, and never a second loop — binding at the root a live frontier clock (the real wall clock injected as qmf-core's Clock, the monotonic kind for every duration) and a live SliceHandler implementing the five hooks update_stream, scheduled_position_event, execute_resting, update_closed_data and mint_intents; the six pinned sub-phase order is identity-bearing and preserved verbatim, new intents rest a slice, instruments process in declared order, and forming bars are never visible. A PUSH-TO-PULL ACCUMULATOR sits between the venue edge and the loop as the SINGLE FIRST WRITER of every inbound observation: the venue client hands it raw decoded observations, it records them through qmf-data's CT-15 intake into the live world room AND journals them under the allocated venue WriterId, and only then makes them foldable — the recorder duty is a role of this one path and never a second writer, no component writes an inbound observation anywhere else, and recording precedes interpretation. THE SLICE FRONTIER IS THE RECEIVE WALL INSTANT stamped by the accumulator, with the venue instant carried beside it as evidence (AD-8), so the live frontier is monotonically non-decreasing by construction and the accumulator's recorded stream order IS the replay cursor order — a replay reproduces slice boundaries from the recorded receive stamps, which is what makes TN-21's diff a decision diff and nothing else. The accumulator maintains a DURABLE INTERPRETATION CURSOR in the journal that commits at slice end, after that slice's sinks have flushed, and never mid-slice, so the re-fold boundary is always a completed slice; TN-10's boot order re-folds every observation recorded after the last committed cursor position BEFORE the protection-state projection, so an observation recorded before a shutdown is never lost to interpretation, and every fold the re-fold touches is idempotent by observation identity (AD-27's venue-native key under AD-10's idempotent split) so a re-fold can never double-count a fill. The accumulator is BOUNDED by accumulator_bound (node value, do-not-default) under a typed overflow rule: overflow NEVER drops an execution or system observation — market-data observations coalesce and the coalescing is journaled as data quality — and a bound that cannot be honoured without dropping an execution or system observation is a storage failure blocking entries only. Slices are event-driven per observation under a declared max_slice_latency (node value, do-not-default) whose breach effect is STATED: a journaled data quality record plus a no-new-entry band effect, entry-side only per L39, never a silent skip and never a stand-down; and the loop never awaits I/O, since sinks are synchronous local writes and venue submissions are handed to the venue client whose outcomes arrive as observations in later slices. Streaming indicators on the live path obey the single-feeder law — exactly one WriterId holder per streaming instance, allocated at Compose, with a snapshot restoring equivalently only within the same SnapshotScope (the OS and arithmetic-reference build injected, never read ambiently) and a cross-scope restore refusing. There is ONE loop instance per (VenueId, account) command stream, the same unit as AD-37's one arbitration point per stream: several Books on one account share it with every coupling that creates ruled at bind time in TN-22, cross-stream ordering is a declared non-guarantee, and backtest, replay and live differ only in which clock and which VenueClientPort implementation the root binds — the port being node-minted and selected by the pair (world, VenueId), never by run mode and never by VenueId alone."
    status: ratified
    rationale: "Rests on A6 — maximum slice latency and the accumulator bound as node values rather than spine constants — which stands proceed-on-recommendation and is individually overturnable. The first-gate ruling at memlog line 46 (15) bound every producer feeding the signal snapshot to read as of the slice frontier and never wall-now, which is the discipline the accumulator's frontier stamp enforces. GATE-2 rulings at line 51 then fixed VenueClientPort selection by the pair (world, VenueId) with a replay run spawned outside the node process under disjoint WriterIds (6), and kept the shadow lane off the trading path — candidate labelers computed off-path from frontier-stamped inputs and never counted toward max_slice_latency (14). The accumulator's single-first-writer role, the durable interpretation cursor committing only at slice end, the typed overflow rule and the stated max_slice_latency breach effect are the gates' sharpenings of the original memlog TN-5 entry, which named the accumulator and the maximum slice latency without their overflow, cursor and breach semantics."
    sources: [EXT-2098]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-5, event-slice-loop, run-slice, accumulator, interpretation-cursor, command-stream]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-5"

  - id: DEC-0191
    title: "The order path — chain of command wired, not redefined (TN-6)"
    statement: "The chain is bot, Book, BMS, operator (L36) and the node wires it without redefining a step. ENTRY-SIDE-ONLY BLOCKS are the node's own law (L39 / AD-36): every block the node can raise on a command stream — startup-reconciliation gating, a rotation-store failure, an unpersistable sink, a partial write, node stand-down, a clock band, a full disk — refuses place_order and any risk-increasing amend_protection and NOTHING ELSE, never a cancel_order, close_position, close_all, risk-non-increasing amend_protection, CT-23 close_full or tighten_protective_stop, and never the recording of evidence; A BLOCK THAT CANNOT BE APPLIED ENTRY-SIDE ONLY IS NOT MINTED, and where the venue path itself is unavailable a protective command becomes a standing protection intent under TN-7 rather than a refusal. THE ONE EXCEPTION is the parent's own: AD-27's per-command UNKNOWN block is not a control and not an entry-side block — while an UNKNOWN is outstanding on a (VenueId, account) stream EVERY command on that stream is refused, protection commands included, because dispatching a close_position into a stream whose last submission's fate is unknown is how a position gets double-closed; a refused protective act never evaporates but stands as an AD-36 protection intent journaled before dispatch and re-decided when the block clears (re-deciding is not retrying), and only resolve_unknown clears it, never a reconciliation verdict. The doors fire in fixed order: the QL-7 bot callback over its declared footprint; the CT-23 Book door (admission, Book-resolved requested_r, the declared full-loss price derived by the per-family ExitLogicModule, which CONSUMES the bot's optional advisory_stop_proposal where the Book declares the ratified adopt-the-advisory-stop-as-is module mode inside the existing module-id-plus-config shape); then NO SCALE-IN — an entry intent against an instrument on which the binding already holds an open VIRTUAL position is a policy rejection at the door, stated over virtual positions so a netted account's shared venue position can never mask it — protection windows (CT-31), SQS (AD-39, read only from the per-instant signal snapshot), bench (AD-41), the budget and sizing ladder (AD-40, over TN-25's virtual-ledger figures), the cohort-correlation slot, and L39 check_exit_preservation wired and PROVEN on the live path; close_partial is NOT a V1 kind, so a Book- or bot-scoped partial exit is an unsupported capability refusal, never emulated by close-then-replace, and the exit vocabulary widens only when CT-19 does. BMS constraints are account-scoped (the kill-line series, exposure, the control-rank table); EXECUTION-TARGET RESOLUTION happens once at intent mint from the three AD-35 inputs (Book mode, seat state, active-control set) and never from Book mode alone, entering the command record's identity without changing the AD-29 binding identity; and the PROTECTION GATE sits BEFORE command mint, blocking on the entry side only, reading the KSA level fold at the effective scope, the standing-intent fold and the per-command UNKNOWN block — risk-reducing commands pass every entry-side block unconditionally and dispatch ahead of place_order, the gate's one legitimate hold on a protective act is the UNKNOWN block under which the act stands as a journaled intent, the gate sits above the mint so a refused intent leaves no phantom command record, and the gate CONSUMES arbitration and never performs it. COMMAND MINT carries an fp1 identity including (VenueId, account), the session epoch and the node-owned COMMAND ORDINAL, which is a different counter from the journal sequence and never the same object: the journal sequence is gapless per (writer, boot epoch) and restarts at each boot epoch, while the ordinal is monotone and never reused across the life of a stream, its high-water mark durable and recovered at boot BEFORE the sequencers open, a stream that cannot recover it refusing to open rather than restarting the count; V1 maps into clientMsgId through a DURABLE COMMAND-ID-BINDING RECORD persisted BEFORE submission — (venue client id, command fp1, account, session epoch), named reconciliation evidence — because 100 characters cannot be a total injection over an fp1 digest space plus stream qualification; and EVERY place_order CARRIES A VENUE-RESIDENT PROTECTIVE STOP AT PLACEMENT in the form CT-18 declares for that order type (the entry-relative form where absolute protection is unsupported for MARKET orders, the reference price being declared CT-19 surface), with placement an unsupported capability refusal where the Book requires attachment and CT-18 does not declare it — never a silently unprotected order — and AD-40's declaration staying the plan rather than being read back as the observed fill. Compound commands (a flatten at binding scope, a close_all) fan out to N submissions, each child carrying a derived identity of parent fp1 plus its declared ordinal, children ordered by child content fingerprint ascending, each individually observation- and journal-bearing, under a STATED parent-outcome table: all children accepted gives accepted-by-venue; any child UNKNOWN gives UNKNOWN; otherwise a mix gives partially-executed; ALL children rejected gives rejected-by-venue and never partially-executed — scope resolving through the pinned versioned CT-30 resolution table against the CT-18 position model and never implementer judgment, REFUSING rather than widening where the position model makes a narrower scope indistinguishable from a wider one. Submission runs through VenueClientPort with the pacer below the declared 50 requests-per-second non-historical and 5 requests-per-second historical ceilings PER CONNECTION, cancel_order, close_position, close_all and amend_protection served ahead of place_order and suspend_new taking local effect instantly with no venue round trip: THE SUBMISSION DEADLINE STARTS AT WIRE HANDOFF, the moment the client transmits, never at command mint; time awaiting pacer admission is a local queue with its own declared bound, measured and exported separately, whose breach is a typed refusal on the veto path naming the pacer as the refusing door, never an UNKNOWN and never a stream block; and a connection fault applies its effect to EVERY command stream bound to that connection, enumerated from the roster at Compose, each affected stream journaling its own block. resolve_unknown has TWO PATHS with declared precedence and the call is ITSELF AN OBSERVATION: an unambiguous observed-accepted or observed-absent read-back resolves automatically, while an ambiguous, absent or out-of-lookback read-back requires operator attestation through the powers channel and only that path carries a signer identity, with the resolve_unknown call recorded as a CT-20 observation beside the resolving evidence; AD-27's acknowledgement-mode consequence binds the outcome path, so an outcome is NEVER derived from absence alone — a cancel resolved by read-back is accepted-by-venue only where the read-back also shows no fill at or after the cancel's submit stamp, otherwise rejected-by-venue as superseded-by-fill — a command whose subject is absent or already terminal AT SUBMISSION resolves without submission and never as a naked close, and denied-locally stays an adapter pre-submission outcome minting a CT-20 observation, never confused with an authority-layer veto. Every door refusal is a decision event on the VETO PATH (CT-25's veto_ledger projection) carrying the refusing door and the would-have-been action; every arbitration loser is a suppressed control action on the SUPPRESSION PATH with enactment linked by enacts edges; arbitration lives in ONE component — the control-action dispatcher in protection/, AD-37's one arbitration point per stream — resolving strictly by rank with no arrival-order input, with Tier 1 venue-resident actions outside the ordering by construction, composing actions both executing, only mutually exclusive actions on the same enforcement scope arbitrating, exactly one command emitted where two pending actions produce the same mechanical command on the same scope, a lower-ranked action never undoing a higher-ranked one and a higher-ranked action never reducing the protection a lower-ranked one would have delivered; and the risk dispatcher carries block-on-unpersistable exactly as the venue client does, so a storage failure blocks the dispatch and the intent stands as a protection intent rather than being lost. The node OWNS as do-not-default UI-editable values, blank or provisional-evidence blocking role = live bindings: the submission deadline that mints UNKNOWN, the reconciliation lookback and cadence, the pacing and backoff cadence, the local-queue bound, the protective reserve capacity, and the pool and health constants; and it owns as RESPONSIBILITIES that are not values, never blank and never UI-editable: evaluating the AD-40 sizing ladder against live Book state, and issuing resolve_unknown under the two-path precedence."
    status: ratified
    rationale: "TN-6 carries no assumption of its own in the register; it rests on neighbours A36 (the node-minted VenueClientPort it submits through, TN-11) and A40 (the two declared peer principals on the powers socket, through which the attestation path runs, TN-17), both proceed-on-recommendation. First-gate rulings at memlog line 46 supplied the entry-side-only law with the standing-intent fallback and the stand-down pass-through (6); the counters ruling (9) — the command ordinal distinct from the journal sequence with a durable high-water mark recovered before the sequencers open, clientMsgId carried by a durable command-id-binding record persisted before submission, the submission deadline starting at wire handoff, and pacer wait as a local queue with a veto-path refusal rather than an UNKNOWN; the kill-line series the BMS layer reads (1); and the node-minted venue port (13). GATE-2 rulings at line 51 then declared AD-27's per-command UNKNOWN block the ONE non-control block that refuses protection too, with the refused act standing as a journaled intent (1); wrote protective-stop attachment at placement into the order path (2); added the no-scale-in refusal over virtual positions, the close_partial refusal, the absent-or-terminal subject resolving without submission, arbitration strictly by rank with Tier 1 actions outside the ordering, and the no-pending-orders predicate (33); confined retry-after-refresh to requests without a command identity (8); and barred float from the money path (19)."
    sources: [EXT-2099]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-6, order-path, entry-side-only, command-ordinal, resolve-unknown, veto-path, arbitration]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-6"

  - id: DEC-0192
    title: "KSA — the protection authority, and the kill switch under a dead wire (TN-7)"
    statement: "The node ADOPTS the GitBook baseline explicitly under L37 and re-ratifies it here because docs/ never carried it: five levels GREEN | YELLOW | ORANGE | RED | BLACK (fixed enum, uneditable), four trigger classes scheduled_news | black_swan | connectivity | unknown_state (addable, never redefined), automatic transitions ESCALATE ONLY, and de-escalation by an operator resume alone. The KSA level is a READ-TIME FOLD over the control-action stream declaring its full AD-36 fold contract — stream, ordering key, knowledge-time bound, equal-instant disposition — resolving across writers by AD-37 rank and never by WriterId byte order, returning the most restrictive state and alarming rather than refusing on the trading path; and THE LEVEL IS FOLDED PER ENFORCEMENT SCOPE, the scope being part of the level's identity and of its level epoch, with two scopes in V1 (global, and per (VenueId, account) command stream), the effective level at any decision point the most restrictive of the scopes covering it, and an operator resume naming the scope whose epoch it opens rather than silently reopening every scope. The fold is MONOTONE NON-DECREASING within a level epoch: it takes the maximum over every escalation record and lowers ONLY on an operator resume record opening a new level epoch — resolving a trigger's underlying condition, satisfying a standing protection intent, a reconciled verdict, a reconnect, a clocked clear, a restart, or the mere absence of new escalations never lowers it, and most-restrictive-on-ambiguity governs which level an ambiguous escalation resolves to and never whether a level decays. A connectivity or unknown_state escalation on the LIVE connection does NOT block paper routing to the paired demo stream — AD-35 rules them distinct (VenueId, account) streams whose uncertainty never gates each other, and a silent paper outage corrupts every later decay verdict — so the escalation blocks the stream it names and no other, while a GLOBAL escalation blocks both live and paper alike. The trigger-to-level-to-effect MATRIX is the node's severity policy: a configurable UI-editable node variable set, ksa_effect_matrix, carrying NO spine value, where each cell declares three mandatory things — an effect drawn ONLY from CT-30's kinds suspend_new | drain | flatten (a flatten resolving at dispatch into close_position or close_all CT-19 commands through CT-30's pinned resolution table, close_all being a command kind and never a control effect), a required typed scope, and the AD-36 satisfaction predicate from the full closed vocabulary scope-flat-at-reconciled-verdict | no-pending-orders-at-reconciled-verdict | never-auto — with a blank or provisional-evidence cell blocking role = live bindings while paper may run, and the legacy donor matrix recorded as evidence only. Every trigger kind the node mints declares its AD-35 disposition, routes-to-paper | blocks-paper, as a mandatory field whose classification is fixed by the invariant and not by the author: scheduled_news and black_swan are market-risk blocks and blocks-paper; connectivity and unknown_state are blocks-paper on the escalation's own scope only; a kill-line stand-down and a benched seat are capital-or-authority blocks and routes-to-paper; and a kind minted with no disposition is an invalid input refusal at registration. THE KILL SWITCH IS THE KSA at its blocking levels — global, stopping all NEW trading live and paper alike, sensor-fed, with the MIS snapshot and SQS as inputs and never authorities — and UNDER A DEAD WIRE OR AN OUTSTANDING UNKNOWN the satisfaction predicates are AD-36's verbatim and are never collapsed into one: suspend_new takes local effect instantly, suspend_new and drain are never-auto and stand until an operator resume with a reconciled verdict never clearing them, flatten satisfies only on scope-flat-at-reconciled-verdict, a command outcome never satisfies an intent, drift | unknown | out-of-lookback alarm and hold the intent open without dispatching, and a dead node is answered by the venue-resident protective stop (AD-33). The standing-intent machinery binds EVERY risk-non-increasing act and not only CT-30 kinds — amend_protection under AD-34, CT-23's close_full and tighten_protective_stop under AD-33, and every protective close — journaled before dispatch and, where the journal room is unpersistable, into TN-4's reserved protection-intent extent rather than merely into a fold, resolved as a read-time fold, re-decided rather than retried, never time-expiring and alarming when undeliverable; the KSA audit trail is the CT-25 projection ksa_audit_log over the control-action stream and never a stream of its own; and DEC-0049's detector-pause scoping holds verbatim — automatic detectors act only through entry-blocking controls at the narrowest affected subject and never on positions or exits (L39 holds), with the inform-versus-pause posture a UI-editable node setting."
    status: ratified
    rationale: "Rests on A7 — the KSA levels adopted from the GitBook baseline with a blank matrix cell blocking live — which stands proceed-on-recommendation, and on A46 for the unpersistable-journal home of a standing intent (TN-4). What TN-7 ADOPTS is the GitBook risk baseline, authoritative under L37 for risk, sizing and live-trading content but never re-ratified into docs/ (a grep for GREEN or BLACK across docs/ returns zero hits); the node ratifies the vocabulary BY ADOPTION and mints only the severity policy that carries no spine value. First-gate rulings at memlog line 46 (3) fixed AD-36's predicates verbatim — suspend_new and drain never-auto, flatten scope-flat-at-reconciled — made the KSA fold monotone within a level epoch lowering only on an operator resume, and extended the standing-intent machinery to amend_protection and the CT-23 protective closes; (15) confined SQS to the per-instant signal snapshot the gate reads; and (16) made a provisional-evidence value block role = live exactly as a blank does. GATE-2 rulings at line 51 then folded the level PER ENFORCEMENT SCOPE with the scope in the level identity and epoch and kept a live-connection connectivity escalation off the paired demo stream (24), made the no-pending-orders-at-reconciled-verdict predicate expressible in a cell (33), and placed the reserved protection-intent extent behind an unpersistable journal room (21). Where the original memlog TN-7 entry said drain and close_all become standing intents 'satisfied only on a reconciled verdict', the amended rule governs: suspend_new and drain are never-auto and only flatten satisfies on scope-flat-at-reconciled-verdict."
    sources: [EXT-2100]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-7, ksa, protection-authority, kill-switch, effect-matrix, standing-intent, adopted]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-7"

  - id: DEC-0193
    title: "The risk protection set the node runs verbatim, and the node-minted value roster (TN-8)"
    statement: "AD-33 through AD-41 and CT-29 through CT-32 RUN VERBATIM: this rule is tagged ADOPTED — the node ratifies the parent's ratified protection set by adoption, with GitBook and the trading-node documentation the authoritative risk-and-sizing layer under L37 — and the node mints VALUES, never rules. KILL LINE, one variable, one declared series, one cadence: kill_line_capital_floor is the ratified registry key and IS AD-40's loss_floor — one value, one name, read by both the ladder and the breach test, with no second name minted — declared by the Book definition and evaluated PER BINDING against that binding's virtual-ledger equity marked to the latest observed price of its own virtual positions (realized plus unrealized), on every slice carrying a fill or a price update on an instrument the binding holds and at every accounting rollover; venue equity (balance plus unrealized, converted_by = venue, exact integers at the account money exponent) is the BMS and account view and the reconciliation counterpart and NEVER the per-Book breach series, while book_capital (period-open, excluding unrealized) is the sizing ladder's input only; a breach auto-flattens THAT binding's scope with close_reason = kill_line_flat (minted apart from protection_forced_flat), stands that binding down (binding state stood-down, never a Book-mode row), leaves other bindings of the same Book definition unaffected, returns only on an operator signature per binding, and declares disposition = routes-to-paper. FLATTEN AUTHORITY is AD-36's three and a money boundary is never one of them — the operator at any scope, always, unconditional and never gated on reconciliation; Book policy only through pre-declared trigger classes, the kill-line breach included; the protection authority where the matrix declares a flatten effect for that severity; venue-delegated trailing where the venue manages it and a Book opted in — and NEVER the adapter, whose adapter_self authority is limited to suspend_new, drain, throttle and session state, with AD-33's other flatten paths (hold_time_force_flat, boundary_flat, window_forced_flat, protection_forced_flat, operator_close) declared Book triggers at AD-37 rank 2 rather than exceptions to that list. NEWS BLACKOUT is instrument-scoped via dated per-instrument currency-exposure records — reading a currency out of a symbol is prohibited — entries only, live and paper alike, suppressed decisions journaled on the veto path, fail-closed on a missing exposure record, with no live skip button; A NEWS-CALENDAR REVISION MAY ONLY WIDEN OR ADD A WINDOW AUTOMATICALLY, so a revision that would narrow, shorten, downgrade, delay or remove a window currently in force or beginning within the current trading day is ingested and journaled as evidence, takes effect no earlier than the end of the window the superseded revision declared, never opens entries the superseded revision blocked, and is otherwise an operator act on the powers channel citing both revisions; and staleness fails closed by a PER-DECISION-CYCLE PRECONDITION, news_calendar_max_staleness (do-not-default, configurable, duration unit-kind), so a silently dead timer fails entries closed with no signal from the timer. DEAD ZONES are daily_dead_zone plus session_handover_buffer with a mandatory anchor pre-close | post-open | both: entries pause while exits, safety acts and data streaming are never blocked; their WIDTHS carry no spine value and no node posture — the variable is blank do-not-default and a blank blocks live, the disagreeing source figures are recorded UNMERGED as evidence with their source layer and never as a default, and which band the operator ratifies is a hand-off recommendation rather than spine text. SQS is the V1 ratio sensor as a CT-16 configured producer with the node as the BASELINE PRODUCER from its own live tick recording — one governed producer, published once, reaching the Book door only inside the per-instant signal snapshot so one instant carries exactly one SQS value — with markers ok | not_ready | unavailable | stale | refused, a live binding requiring a present baseline keyed (VenueId, environment, instrument) so a demo-conditioned baseline NEVER satisfies a role = live binding (the live baseline is minted from live-connection recording during the warm-up week), and instrument class a dated AD-9 instrument_class metadata record that is operator-declarable and correctable and never parsed from a symbol, no class record meaning blocked with the absence journaled as data quality and alarmed. The BREAKEVEN RATCHET is V1's only dynamic protection, single-sided amend_protection until amend atomicity is measured at the venue, and its minimum step amend_min_improvement is ORIGINATION POLICY and never a gate — a Book exit_policy authoring threshold declaring when the ratchet proposes an amendment — so NO node component on the command path may refuse a risk-non-increasing amend_protection: a proposal not made is not a block, and a proposal made is dispatched. BENCH is a read-time fold over CT-29 records of VIRTUAL (Book) positions with predicate realized_r <= -q, breakevens never counting under any q, a fill's CT-29 record persisting before the next intent on that seat (else stale evidence), its stream boundary the binding epoch (a new epoch starts at zero unless a signed carries-ledger edge spans it), and a benched seat declaring disposition = routes-to-paper and routing through its seat record's execution target while the Book stays LIVE; SAME-TICK PRIORITY is one BMS-declared rank table per stream with ranks total and unique, checked at admission Layer 1, a Book whose control policy contradicts its BMS's table refusing at bind time. The NODE-MINTED UI-EDITABLE VARIABLE ROSTER — registry rows declaring schema and evidence values only, the resolved values living in the config artifact — is: ksa_effect_matrix; daily_dead_zone_width (evidence recorded unmerged, no default); session_handover_buffer_width and session_handover_buffer_anchor; news_blackout_before and news_blackout_after per severity; the seven sqs_* keys plus the Book-scoped decision_freshness_bound, which AD-39 makes mandatory and non-defaultable and against which a configured SQS input age is refused at the door; breakeven_ratchet_trigger and breakeven_ratchet_offset; qualifying_loss_threshold q per family; bench_consecutive_loss_threshold per bot, KEPT SEPARATE from the money-ladder divisor seat_loss_run_allowance (the legacy coupling being the recorded defect); amend_min_improvement per Book as the ratchet's authoring threshold; the clock bands of TN-14; the crash-loop K and T, drain_window and watchdog_interval of TN-4; and news_calendar_max_staleness."
    status: ratified
    rationale: "Rests on A9 — the ratchet's minimum step expressed as an improvement threshold rather than a time gap and sited as origination policy — which stands proceed-on-recommendation, and on A8, RETIRED at the reviewer gate: the dead-zone width carries no node posture and no default, so the original memlog TN-8 entry's 'sitting default posture = the wider roughly 3 h band' is WITHDRAWN and the disagreeing evidence is recorded unmerged instead. What this rule ADOPTS is the parent's ratified protection set — AD-33..AD-41 and CT-29..CT-32 — run verbatim under L37's authority order; the node ratifies by adoption and mints only values. First-gate rulings at memlog line 46 fixed the kill-line series per binding against virtual-ledger equity with venue equity as the reconciliation counterpart and kill_line_capital_floor as the one name for AD-40's loss_floor (1); confined SQS to the signal snapshot and keyed the baseline (VenueId, environment, instrument) so a demo-conditioned baseline never satisfies a live binding (15); and made a provisional-evidence value block live exactly as a blank does (16). GATE-2 rulings at line 51 then added the widen-or-add-only news-calendar revision rule with news_calendar_max_staleness as a per-decision-cycle precondition and a declared recorder retry policy (7), wrote protective-stop attachment at placement into the order path this set gates (2), added the no-scale-in refusal over virtual positions (33), and partitioned every blank into blocks-boot | blocks-role-live | blocks-soak across the mint table (20)."
    sources: [EXT-2101]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-8, adopted, kill-line, flatten-authority, news-blackout, dead-zone, sqs, bench, ratchet, variables]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-8"

  - id: DEC-0194
    title: "Paper mode and the soak as the full unattended warm-up week (TN-9)"
    statement: "Paper is a Book-level mode (AD-35 / CT-24) expressed as a dated binding-epoch change carrying a mandatory state_carry declaration per counter (TN-25); the paper target is the paired demo account — role demo, world = live — carrying its own BMS instance linked by a typed pairing record (AD-29), with exactly one active paper-routing target per live binding and execution_target resolved once at intent mint from (Book mode, seat state, active-control set); paper balance is family-scoped and frozen, a reset mints an operator-signed paper_epoch treasury boundary record, and paper P&L never crosses the money boundary and never buys a seat. WHAT ROUTES AND WHAT BLOCKS follows AD-35's invariant: a CAPITAL OR AUTHORITY block routes to the paired target while the Book stays LIVE — a benched seat and a kill-line stand-down both route and the evidence keeps flowing — while a MARKET-RISK block blocks paper too, so a protection window, a dead zone and the kill switch stop paper entries exactly as live, and a blocked or silent paper stream raises the live alarm class. Role scoping is declared rather than collapsed: the paired account is minted with AD-9 role demo and every routing reason writes under it, the finer roles paper-validation and paper-benched are deliberately NOT used in V1, and the consequence is stated — Book-mode PAPER evidence and benched-seat evidence land in one role-scoped namespace and are told apart by the routing reason on the execution-target record, never by namespace, a later split being a role addition rather than a re-write. THE SOAK IS MILESTONE 1 AND IT IS THE FIRST-DEPLOY WARM-UP WEEK, ruled by the operator 2026-08-28: for one full UNATTENDED week the node runs in paper mode on the demo account with the FULL live machinery — a real cTrader connection, the verification suite, reconciliation read-backs, standing intents, KSA, windows, SQS baseline minting, recording, backups, the restore drills, the doors, metrics and alerts — under full logging and monitoring, and it is the same week as the ratified warm-up rider (one attribution, one rider), never a soak nested inside a longer rider. THE SOAK RUNS THE DEMO BINDING WHILE THE LIVE CONNECTION IS OPENED FOR SENSING AND RECORDING ONLY: the demo connection carries paper routing and the full order-path machinery, and as soon as live credentials exist the live connection opens with no live binding, no command stream open and no live roster binding minted, so the live-environment SQS baseline (keyed (VenueId, environment, instrument)) and the live-path rung baseline accumulate on the live environment while the machinery proves itself on the demo one — the live binding WAITS ON ITS OWN BASELINES, so a late Spotware approval or KYC delays go-live and never the soak, and the connection count is derived from the roster (a roster naming one (venue, environment) pair opens one connection). THE PAPER LEDGER RUNS: the paired binding keeps a full virtual ledger — frozen starting balance plus realized plus unrealized of its paper virtual positions — so a paper capital floor is evaluable and the kill-line mechanism is exercisable in paper, the frozen balance being what is never hand-adjusted while the equity series moves. Day-one drift checks in paper are two: the paper ledger must reconcile against its own CT-29 and fill records as self-consistency at epsilon 0 in the exact integer domain, and the full reconciliation read-back runs against the demo account with a non-zero residual ALARMING for investigation rather than halting — and THE DISCRIMINATOR IS ROLE, NEVER WORLD, because the demo binding carries world = live by AD-12 and keying the live drift stand-down on world would stand the soak down on the first demo-server quirk — with these alarms delivered during the soak as a soak-scoped demo-drift digest so the operator is not trained to dismiss drift alarms in the week before go-live. Live binding comes only at the END of that week and only on instruments whose checks passed AND whose live-conditioned baselines are present; unattended is a design constraint rather than a schedule note, since the alert allow-list, the dead-man's switch and the liveness digest stand in for a watching operator and a synthetic alert is proven delivered end-to-end before the node is left alone; TN-23's injected-fault drills are discrete operator-performed acceptance acts at the week's boundaries or at declared drill points, the continuous run between them being what is left alone; and ACCEPTANCE IS MACHINERY PROOF — the TN-23 checklist with its fault-injection drills, unchanged by the duration ruling — and NEVER profit, because paper evidence can never authorize live money (AD-32)."
    status: ratified
    rationale: "Rests on A10 — RULED by the operator 2026-08-28: the soak IS the full first-deploy warm-up week, unattended, on the demo account, with live binding at its end ('two days to a week... I think a week is enough and sufficient') — on A11, demo-account drift alarming rather than halting during the soak and delivered as a soak-scoped digest, and on A47, the live connection opened for sensing and recording only from the moment credentials exist so the live-conditioned baselines accumulate without a live binding; A11 and A47 stand proceed-on-recommendation. The operator ruling at memlog line 48 (Q2) supersedes the original TN-9 entry's 'the roughly 2-day soak is the first two days of the roughly 1-week warm-up rider', and line 49's TN-9 amendment applied it at desk with the acceptance checklist unchanged. The first-gate ruling at line 46 (20) made the paper ledger RUN so a paper capital floor is evaluable and the kill-line mechanism exercisable in paper. GATE-2 ruling at line 51 (32) then fixed that the soak runs the demo binding while the live connection is sensing-and-recording only, that the live binding waits on its own baselines so a late approval delays go-live rather than the soak, and that the connection count is derived from the roster (with SessionTopology's ClassVar relaxation a qmf-venue increment item)."
    sources: [EXT-2102, EXT-2108]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-9, paper-mode, soak, warm-up-week, demo-binding, operator-ruling, acceptance]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-9"

  - id: DEC-0195
    title: "Startup, recovery and explained-drift doctrine, ratified by adoption (TN-10)"
    statement: "The PRD's mined Phase-2 doctrine is RATIFIED BY ADOPTION with ONE declared narrowing named at its point of use: the PRD's 'unexplained live drift halts trading' is narrowed to an entries-only stand-down, authorized by L39 exactly as TN-11 narrows AD-28's sensing-outage rule; the GitBook start sequence is recorded as this doctrine's ancestor rather than a competing rule. After TN-2's seal the boot order is FIXED at ten steps: (1) connect per environment; (2) the FIRST-CONNECTION VERIFICATION SUITE of SIX verify-or-refuse checks — spot-timestamp unit, D1 boundary, bar-basis reconciliation, pip formula, money exponent, and amend atomicity, whose verdict gates whether dual-sided amends are ever legal and whose absence leaves single-sided amendment the only path — landing in the per-(VenueId, account) venue-observation profile, a failure refusing the dependent evidence class and journaling a data quality event; (3) re-fold of the interpretation cursor, every observation recorded after the accumulator's last committed cursor position folded before any state is projected; (4) reconnect gap recovery, fetching deals and positions since the last-seen execution event, recovered fills committing through evidence BEFORE the session reports healthy, a no-gap reconnect still emitting correlation evidence; (5) the reconciliation read-back over the declared lookback with FOUR verdicts; (6) resolution of outstanding UNKNOWNs — automatic on an unambiguous observed-accepted or observed-absent, operator attestation through the powers channel on an ambiguous, absent or out-of-lookback read-back, with the evidence channel serving the outstanding set WITH its per-command read-back detail so the attestation is made against evidence rather than a count, and a typed refusal rather than an offered choice where the read-back cannot support attestation; (7) missed-rollover catch-up, boundary equity reconstructed from journals and the sweep journaled as an AD-16 treasury boundary event appended as a correction that moves no money without one, never closes a position and never re-bases a frozen R; (8) protection-state projection over standing intents, KSA level, Book modes, binding states, seat states, bench counts, exposure and budgets — ALL read-time folds, with no safety counters to reset; (9) readiness gates — clock sync and drift band ok, an SQS baseline present per door, a consistent control-rank table, every market-hours, day-boundary and news-calendar identity verified plus the pinned tzdata, and for role = live bindings only a live-path rung baseline on this deployment tuple, minted by the benchmark harness and never by the trading loop so a first boot is not circular; and (10) command-ordinal recovery before the sequencers accept intents, a stream whose ordinal cannot be recovered refusing to open. Every fold declares its stream, ordering key, knowledge-time bound and equal-instant disposition as pinned contract surface and resolves across writers by AD-37 rank and never by WriterId byte order; no fold on the trading path refuses — one that cannot resolve returns the most restrictive state, journals data quality and alarms. THE ARITHMETIC DOMAIN IS DECLARED: equity derivation and drift decomposition are exact scaled-integer arithmetic at the account's declared money exponent, each venue-supplied converted figure decoding once at its own declared exponent and re-scaling to the account exponent by exact integer arithmetic with no float participating in the sum, and a figure arriving with no declared exponent or at an exponent that cannot be re-scaled exactly REFUSING the derivation with a typed refusal rather than approximating — reconciliation_epsilon = 0 is a statement about that domain, and no tolerance is ever introduced to absorb a representation error that does not exist. EXPLAINED DRIFT IS TWO RESIDUALS COMPARED SEPARATELY, each with its own epsilon-0 identity and NEVER one blended number: (a) QUANTITY, the sum of virtual (Book) positions per instrument against the venue position picture for that account in exact instrument quantity units under the account's declared netting | hedging model, through AD-27 reconciliation evidence; and (b) CASH, the venue's realized balance against the virtual ledger's realized cash plus the named components — swept-but-unwithdrawn cash, re-seed remnants, and venue-charged fees or financing not yet journaled — in exact scaled integers at the account money exponent. UNREALIZED P&L ENTERS NEITHER RESIDUAL because it is a mark and marks are never reconciled: the venue equity series and the binding's virtual-ledger equity series are reported side by side with their mark instants and are NEVER differenced (differencing two marks at two instants under epsilon 0 would set operator_review permanently on any open position and gate promotion forever), floating P&L staying an explained, named, never-swept component of the equity narrative; drift is a non-zero residual in (a) or in (b), and only that sets operator_review — a journaled binding-scoped state, folded like any other, that gates the NEXT live promotion or activation on that binding and gates nothing else, never blocking the command stream and never blocking an exit, clearing only on an operator resume after a fresh reconciliation review. UNEXPLAINED DRIFT IS KEYED ON THE BINDING'S ROLE AND NEVER ON ITS WORLD: a role = live binding stands down FOR ENTRIES ONLY — exits, protection amendments, standing intents and evidence continue per L39, which is what authorizes narrowing the PRD's 'halts trading' to the entry side — with no automatic resume and a restart never permission to resume, while a role = demo binding alarms at the live severity class and continues whatever its world. A DEPLOYMENT-TUPLE CHANGE INVALIDATES THE RUNG BASELINE: where the declared (OS, CPU-class) tuple changes under a running node — a VPS live migration, a rebuild, a resize — new role = live bindings are blocked entry-side until the benchmark harness re-records a baseline on the new tuple, the change alarms on the silent-degradation class, existing live bindings keep exits, protection amendments and evidence per L39, and AD-24's light claims degrade to provisional on the same event. Reconciliation cadence is a node value — after every UNKNOWN, on every reconnect, at each accounting rollover, and on a configurable periodic tick — startup reconciliation gates ENTRIES only while the sensing pipe flows from boot, and a clocked reconciled verdict satisfies a flatten intent and never lowers a KSA level."
    status: ratified
    rationale: "Rests on A12, unexplained live drift standing entries down rather than flattening, and on A13, floating P&L as an explained component that is never swept; both stand proceed-on-recommendation and are individually overturnable. What this rule ADOPTS is the PRD §6 Phase-2 mined doctrine — startup ordering, explained drift, stand-down-alive and the always-on evidence tier — ratified by adoption with the single L39-authorized narrowing stated at its point of use, and with the GitBook start sequence recorded as ancestor rather than rival. First-gate rulings at memlog line 46 declared the equity and drift arithmetic domain — exact scaled integers at the account money exponent, per-figure decode at its own declared exponent then exact re-scale, an unscalable or exponent-less figure refusing, epsilon 0 a statement about that domain (10) — and the two resolve_unknown paths with operator attestation only through the powers channel (9, 6). GATE-2 rulings at line 51 then split reconciliation into TWO residuals compared separately with unrealized P&L never reconciled and the two equity series reported side by side (10), and confirmed that AD-27's per-command UNKNOWN block is the one non-control block the resolution step clears (1). The sixth verification check (amend atomicity), the operator_review gating semantics and the deployment-tuple invalidation are the two gates' additions under their catch-all that every other reviewer finding is applied as its review states it; the original memlog TN-10 entry's five checks and single blended residual are superseded."
    sources: [EXT-2103]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-10, adopted, startup-order, reconciliation, four-verdicts, explained-drift, operator-review]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-10"

  - id: DEC-0196
    title: "Venue integration on cTrader — the transport increment, the node-minted port, equity derivation (TN-11)"
    statement: "IC Markets is deployment configuration and never architecture. THE TRANSPORT LOCUS IS DECLARED, not assumed: qmf-venue owns its own transport and already ships the ConnectionManager as the AD-26/AD-28 sole owner of venue sessions and the single in-memory holder of secret values, so the missing pieces — the asyncio TLS socket to demo.ctraderapi.com and live.ctraderapi.com on port 5035, length-prefixed ProtoMessage framing over the pinned proto release tag 91 compiled in-house against protobuf 7.36.0 with zero Spotware code, request encoding, clientMsgId generation and matching, the submit path, market-data subscription (spots with timestamps opt-in, live trendbars inside spot events, depth verbatim), account auth, in-band token refresh, and the cents and volume decoder that decodes from the wire's int64 fields at their declared exponent straight into scaled integers, refusing rather than converting a money field arriving in a floating form — are a qmf-venue INCREMENT completing that existing component, delivered as QMF-side stories the node's epics depend on, with protobuf staying a qmf-venue-only dependency, no second connection manager minted and no second in-memory secret holder existing. That increment carries TN-2's delegated-impurity clause and, in the same increment, the amendment exempting qmf.venue.connection BY NAME from QMF's async conformance test; if the parent refuses the exemption the increment lands in qmn.venue.ctrader instead and THE EPICS MAY NOT CHOOSE. qmn/venue/ctrader/ holds only what is genuinely node-side — duty scheduling, the verification-suite runner, equity derivation, the CT-18 field fills, the error-map rows and the port implementation — and the qmn.venue subpackage is the sanctioned qmf-venue import boundary against which the L30 default-deny lint is written. THE NEUTRAL PORT IS NODE-MINTED because the inventory says there is none: qmf-venue exposes exactly one Protocol (ProbeTransport) at ef9bb25, so AD-28's 'one neutral port' is a contract statement rather than an injectable seam, and the node mints qmn.venue.VenueClientPort over the CT-19 command and CT-20 event and reconciliation shapes, owns its versioning and ships THREE V1 implementations — the cTrader client composed around qmf-venue's concrete typed values, TN-21's replay adapter, and TN-23's FEAT-0023 venue conformance double, which must implement the same port or the conformance suite proves nothing about it — with THE IMPLEMENTATION SELECTED BY THE PAIR (world, VenueId) and never by VenueId alone, world = replay selecting the replay implementation for every VenueId and the composition REFUSING to bind any venue-connecting implementation into a replay composition; qmf-venue is NOT amended to carry the port, and realizing the seam inside qmf-venue instead is recorded as a candidate AD-28 parent annotation, surfaced and never settled by a child. Connections are keyed by (venue, environment) under the platform cap of one demo plus one live with accounts multiplexed, and THE CONNECTION COUNT IS DERIVED FROM THE ROSTER — one connection per (venue, environment) pair the roster names, never a fixed requirement — so SessionTopology's shipped required_connection_count = 2 ClassVar is a qmf-venue increment item to relax, and a connection fault blocks EVERY command stream bound to that connection, enumerated from the roster at Compose. The node fills the 19 unfilled CT-18 fields marking each static or measured-at-connection, with the load-bearing rows named rather than counted because each is verify-or-refuse and several gate bind time: the position model netting | hedging per account (measured at connection; it decides scope resolution and the fill-to-virtual-position attribution requirement), account settlement currency, the margin model with leverage and the venue's own margin-call and venue_liquidation level, the instrument value-factor surface, amend atomicity, protective-stop attachment form per order type (the field TN-6's placement rule reads, whose absence under a Book that requires attachment is an unsupported capability refusal), venue-managed trailing support, the reconciliation lookback declaration, acknowledgement mode per command kind (whose consequence binds the node's outcome path — an outcome is never derived from absence alone), and throttle_scope. Error-map rows are pinned, an unmapped code defaulting to (transient venue failure, retryable = no, outcome = UNKNOWN) plus an alarm, and a requote is an ordinary mapped venue rejection through that table with no separate vocabulary and no separate path. EQUITY DERIVATION is balance plus per-VENUE-position unrealized P&L using the venue's own converted figures with converted_by = venue provenance and no QMX conversion, in TN-10's exact scaled-integer domain at the account's declared money exponent, each figure decoded at its own declared exponent and re-scaled exactly, a missing or unscalable exponent refusing rather than approximating; this series is the account and reconciliation view and is NOT the per-Book kill-line series of TN-8. Session duties run on the node scheduler, token refresh is keyed by credential reference and never by connection, command retry is prohibited and session recovery never resubmits; VENUE MAINTENANCE WINDOWS are NOT a fourth control-window kind — a down session or dead feed already fails closed FOR ENTRIES under L39's authorized narrowing of AD-28's sensing-outage rule, with no silent failover and the maintenance timestamp journaled as data quality — a conscious divergence from the reviewer recommendation to treat an announced window as a dead-zone window, whose accepted consequence is that an announced window does not proactively block entries ahead of the disconnect, while the continuous D1-boundary monitor re-verifies at a configurable cadence (evidence: daily and across DST transitions). The TRENDBAR BASIS is measured per broker at first connection as already ratified — secondary web evidence says BID (a Spotware moderator on the official forum, no documentation page) — and until it is recorded, backtest-to-live comparisons are TICK-based and never trendbar-based."
    status: ratified
    rationale: "Rests on A14 (no fourth control-window kind for venue maintenance, a conscious divergence from the reviewer's recommendation), A15 (tick-based interim backtest-to-live comparison until the trendbar basis is measured), A36 (a node-minted VenueClientPort rather than a seam realized in qmf-venue) and A37 (the cTrader transport increment landing in qmf-venue, completing its existing connection manager, rather than in qmn) — all four proceed-on-recommendation and individually overturnable. The first-gate ruling at memlog line 46 (13) minted the port at the node over the CT-19/CT-20 shapes with two V1 implementations, left qmf-venue unamended and recorded the seam-in-qmf-venue alternative as a candidate AD-28 annotation. GATE-2 rulings at line 51 then added the third V1 implementation (the FEAT-0023 conformance double) and fixed selection by (world, VenueId) with a replay composition resolving no credential and opening no socket (6); declared the delegated-impurity clause, the named qmf.venue.connection async exemption and the qmn.venue import boundary, with the fallback landing in qmn.venue.ctrader and the epics forbidden to choose (9); barred float from the money path so wire money and volume decode from integers at their declared exponent (19); confined retry-after-refresh to requests carrying no command identity (8); and derived the connection count from the roster with the SessionTopology ClassVar relaxation as a qmf-venue increment item (32). The original memlog TN-11 entry's 'the node ships the in-house transport' is superseded by the declared locus: the increment completes qmf-venue's existing ConnectionManager."
    sources: [EXT-2104]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-11, ctrader, qmf-venue-increment, venueclientport, ct-18, equity-derivation, trendbar-basis]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-11"

  - id: DEC-0197
    title: "Secrets — two-layer store, the provisioning wizard, rotation by credential reference, the drills (TN-12)"
    statement: "References never values above the connection manager (L34 / AD-26), and the node's SecretStore implements qmf-core's port with read plus atomic replace. THE VPS STORE HAS TWO LAYERS: systemd-creds LoadCredentialEncrypted=, sealed with an explicit --with-key=host and never the default --with-key=auto (which silently binds a TPM2 where the VPS exposes one and reintroduces exactly the migration fragility this design rejects), delivers at service start a node key-encryption key (KEK) and the bootstrap credentials — client id and secret, the initial access and refresh tokens, the cTID account ids, and the escrowed CT-14 payload key — while the node keeps ROTATED material (the refresh token dies on use, the access token lives roughly 30 days) under /var/lib/qmx/state as AEAD ciphertext under the KEK, so rotation is ordinary unprivileged file I/O for the qmx service account with no root and no code change, under store-before-discard, a failed store after rotation raising an alarm and blocking ENTRIES ONLY while sensing, exits and protective acts continue. Host-key sealing survives reboot, migration and rotation but does NOT survive VPS death — the host key is a file on the VPS disk, and TPM2 would not survive it either — so the seal buys reboot-and-rotation determinism and nothing more, and disaster recovery rests on the escrow rule instead. BACKUP PAYLOAD KEY CUSTODY IS RULED, not left to a variable: the CT-14 payload key that decrypts every off-host copy is generated at provisioning ON THE WORKSTATION, escrowed in Windows Credential Manager under qmx/backup-payload-key plus one operator-held offline copy, and delivered to the VPS as a bootstrap credential — it is NEVER VPS-minted, the VPS-minted KEK protects rotated session material only, and backup_payload_key_custody carries that text as its rule rather than a blank. The workstation's Windows Credential Manager qmx/* store, read through keyring's WinVaultKeyring, is the PROVISIONING SOURCE, the payload-key escrow and the home of workstation-local secrets only — bootstrap material, never rotated live session material — because after provisioning the VPS session is the ONE live refresher and the only holder of live session state: the laptop's copy of the refresh token is dead the moment the VPS refreshes, the wizard says so, and the wizard reports which qmx/* entries are now stale so the boundary is auditable rather than assumed. TOKEN REFRESH IS KEYED BY CREDENTIAL REFERENCE AND NEVER BY CONNECTION: at most one refresh is in flight per credential reference, every session sharing that credential is a READER of the rotated access token rather than a refresher, the refresh duty is owned by the connection manager as a whole and executes store-before-discard against SecretStore.atomic_replace, republishing the new access token to every session bound to that credential before any of them reissues a request, and whether demo and live share one cTID credential is a declared roster fact per credential reference verified at preflight (two credentials run two independent refreshers, one runs exactly one); an authentication failure attributable to a rotation in flight is a RETRY-AFTER-REFRESH condition and never an UNKNOWN, but ONLY for requests carrying no command identity — session auth, account auth, subscription, heartbeat, gap replay and the reconciliation read-back — while a place_order, amend_protection, cancel_order, close_position or close_all meeting an authentication failure is NEVER retried and takes the ordinary submission-deadline path, minting UNKNOWN where it has passed wire handoff and a typed veto-path refusal where it has not, so TN-11's prohibition on command retry has no exception. THE WIZARD is the operations toolkit's just node-secrets-provision recipe, a human-only step run on the laptop: it reads each qmx/* entry and streams the value over an SSH session's stdin straight into systemd-creds encrypt --with-key=host --name=<ref> on the VPS — never argv, never a file, never echoed, never logged — mints the KEK on the VPS, delivers the escrowed payload key, fetches the ctidTraderAccountId list from the access token when those entries are absent, and verifies by asking the node for is_set metadata only; its privilege path is declared, since writing /etc/credstore.encrypted needs root, so provisioning runs over a dedicated key-only SSH identity restricted to a single passwordless-sudo provisioning command, with no interactive root login, no password anywhere, and that identity distinct from the operator's ordinary SSH key. FOUR NAMED SECRET HOLDERS exist on the VPS and no fifth: the connection manager holds venue session material (client id and secret, access and refresh tokens) as its one in-memory holder; the backup unit holds the CT-14 payload key and the object-storage credentials for the duration of one backup or drill run; the observability path holds the notification-channel token; and the separate zero-authority OBSERVABILITY STACK under its own service account is the DECLARED FOURTH holder of its own Grafana admin credential and any log-shipper auth token, delivered by its own LoadCredentialEncrypted line and holding nothing the node holds — none of the latter three ever holds venue session material, no other component on the VPS holds any secret value, each unit receives only the credentials its role names, and the provisioning wizard is carved out as a TRANSIENT workstation-only holder for the duration of one run so the VPS invariant stays checkable rather than quietly false. THE WORKSTATION INSTALLATION IS PROVISIONING-ONLY AND ENFORCED, not asserted: the composition root REFUSES to compose on any host whose declared machine tuple is not the deployment roster's VPS entry, the SecretStore REFUSES to construct a venue-session holder off that host, and a tier-1 check assertion proves the wizard module imports neither the connection manager nor the refresh duty — without these three, any workstation script that composed a root would refresh the token and kill the VPS session mid-trade. The COMPROMISE DRILL is anchored on cTID re-authorization, which invalidates all refresh tokens, then application-credential reset, store replace and session restart, tested with demo credentials only, sandboxes never holding live secrets; and cryptography (Apache-2.0/BSD dual) is the new named node dependency for the KEK layer and CT-14's PayloadCipher, registered in DEPENDENCIES.md."
    status: ratified
    rationale: "Rests on A16 — the two-layer KEK design, host-key sealing, the SSH-stdin wizard transport, cryptography as the AEAD provider, and the dedicated restricted provisioning SSH identity — which stands proceed-on-recommendation and is individually overturnable. First-gate rulings at memlog line 46 ruled backup key custody (2): the payload key generated at provisioning on the workstation, escrowed under qmx/backup-payload-key plus one offline copy, delivered as a bootstrap credential and never VPS-minted, with a host-loss restore rehearsal on a clean host and a VPS-loss runbook including cTrader re-authorization because the stored refresh token is spent; keyed refresh by credential reference with at most one refresh in flight and the roster declaring whether demo and live share a cTID credential (7); and pinned --with-key=host with the fixed qmx service account and the named secret holders (12). GATE-2 rulings at line 51 then confined retry-after-refresh to requests without a command identity (8), added the observability stack as the DECLARED FOURTH holder with its own credentials (13), and made the provisioning-only workstation posture ENFORCED by a composing refusal off the roster's VPS tuple, a SecretStore refusal and a tier-1 import check (18). The wizard's invocation is the operations toolkit's just node-secrets-provision recipe under the operator's no-command-line ruling (line 48 Q1, applied at line 49); the original memlog TN-12 entry's 'qmn secrets provision' command is superseded history."
    sources: [EXT-2105]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-12, secrets, systemd-creds, kek, payload-key-escrow, provisioning-wizard, secret-holders]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-12"

  - id: DEC-0198
    title: "Live data, history bootstrap, the news calendar, backup and the three restore drills (TN-13)"
    statement: "Live ticks, bars and depth enter as CT-10 source observations through qmf-data's CT-15 intake into the LIVE world room under the venue WriterId — machine, adapter role, VenueId, account — written THROUGH the TN-5 accumulator, which is the single first writer: this module owns the intake and the room and never a second write of the same observation, the feed is the pinned canonical sensing feed with no silent sibling failover, receive-wall and monotonic stamps are mandatory because the venue exposes no server clock, and the venue is also a source. POSITION AND BALANCE READ-BACKS ARE CT-20 OBSERVATION KINDS journaled onto the EXISTING seven AD-21 event types through CT-20's versioned mapping table — never a new journal type and never a second event catalog — entering through the same intake under the same writer and read by TN-11's equity derivation and TN-10's reconciliation folds rather than through any side channel, with the mapping-row addition proposed as a parent annotation and never asserted. HISTORY BOOTSTRAP at first install is the operations toolkit's just node-data-bootstrap recipe: download-once through qmf-data's Dukascopy adapter into the immutable raw archive, license-tagged personal-use, idempotent, checkpointed and resumable, with venue tick history (5 requests per second, one-week span cap) as the recent-window continuity bridge for the gap between the archive's last window and go-live ONLY and never a routine backfill source; the two tick sources stay separately identified and are NEVER merged, disagreements where the bridge overlaps the archive recorded as AD-21 corroborates and disagrees-with edges, which is also what makes TN-11's tick-based interim comparison honest. THE NEWS CALENDAR IS RULED by the operator 2026-08-28 ('I will not pay for news'): the recorder is re-homed from the Windows Scheduled Task to the systemd timer qmn-news-calendar.timer — named for its kind, because a bare 'calendar' names three things — calling the ratified ingest adapter (CalendarFeedTransport, decode_calendar_snapshot, idempotent intake with provider-native (source, id, revision) identity and revisions), and FOREX FACTORY'S FREE WEEKLY FILE IS THE SOLE V1 SOURCE because it carries the impact label the blackout needs: there is NO paid fallback slot and none is ever minted, the later path being a second FREE source or an agent-scraped JSON delivered in the same CT-15 intake shape (the intake shape is the seam, so a second source is an adapter and a config row and never a code path through the blackout), the legal archiving posture staying an open operator item recorded as personal use, and a failed refresh blocking entries fail-closed with no live skip button. REFRESH CADENCE IS A CONFIGURABLE because all three sessions are traded and timeliness matters: news_calendar_refresh_cadence is a configurable node variable with a duration unit-kind (evidence value: every 2 h and before each session open), the scheduler respects the free feed's roughly 2-downloads-per-5-minutes limit with a configured cadence that would breach it REFUSED at config compile rather than silently throttled, and the recorder's retry policy is declared rather than left to the implementer — at most news_recorder_max_attempts per timer firing with news_recorder_backoff, both configurable and blocking boot, counted against the same provider budget, with a provider rate-limit or block response journaled as data quality, alarmed on the silent-degradation class and NEVER retried inside the same firing, since a retry loop on the sole V1 source could get the host blocked and fail-close entries indefinitely. A market-hours, day-boundary or news-calendar CODE identity is sealed into composition_fp while the dated snapshot DATA those recorders ingest is not — snapshots are ordinary append-only observations read as of the slice frontier, so a twice-hourly data refresh never requires a restart while a code change does — staleness fails closed by the per-decision-cycle precondition news_calendar_max_staleness rather than by a signal the timer sends, a revision may only WIDEN or ADD an in-force or same-day window automatically (narrowing, downgrading, delaying or removing one takes effect no earlier than the superseded window's end and is otherwise an operator act), and the 12-month seal is enforced at every read boundary unchanged (holdout_months = 12, do-not-default, enforced on restored reads too). BACKUP IS PUSHED BY THE VPS: qmn-backup.timer runs nightly, the CT-14 primitives produce encrypted versioned copies through PayloadCipher under the escrowed workstation-minted payload key, the V1 ObjectStorage implementation is local staging under /var/lib/qmx/staging plus rclone to an S3-compatible bucket whose provider is deployment configuration (recommendation Backblaze B2; alternatives R2, Wasabi) with credentials by reference; THE BACKED-UP ROOM SET IS NAMED — the immutable raw archive, every journal room, the registry room, and the evidence tier's sealed-archive role and research door, for EVERY world, the processed room being rebuildable and excluded unless a result label cites it — and THE COPY IS ALWAYS A PREFIX OF A REAL STREAM, the backup unit copying only journal segments sealed at a committed sequence boundary read from the running node over the evidence channel, an open segment copied to its last sealed boundary with that boundary recorded in the backup manifest, because otherwise a restored room can hold a torn record and verify-before-purge verifies the copy against itself. THREE RESTORE DRILLS run, all journaled as data quality with failures alarming on the silent-degradation push class and never silently retried, each with its own unit so one timer never carries two cadences: a nightly SAMPLE restore right after the backup under qmn-restore-sample.timer, pulling one file back and verifying its fingerprint, sharing the backup run's payload key; a monthly FULL restore into a scratch directory under qmn-restore-full.timer, fingerprint-verified, an integrity test and only that; and a HOST-LOSS RESTORE REHEARSAL that is not a timer at all but the operator's restore_drill_run power, run once before the live milestone and after every rebuild, restoring from the bucket onto a clean host holding nothing but the escrowed payload key — the only drill that exercises key availability and therefore the only one that can prove DR — never over the only copy and never over live evidence. TWO RTO NUMBERS are recorded apart and never conflated — the integrity-restore RTO measured at the monthly rehearsal, and the full-DR RTO measured at the host-loss rehearsal including VPS re-procurement, re-provisioning and key recovery — RPO is 24 h by construction, RTO is MEASURED and never declared, the backup set's retention depth is a configurable variable while evidence itself is retained forever (NFR-06), and a VPS-LOSS RUNBOOK is a required node artifact: procure, bootstrap uv and CPython, provision, cTrader re-authorization because the stored refresh token is spent, restore with the escrowed key, then a replay check against a recorded day. CAPACITY IS A DECLARED DIMENSION, not a metric: the VPS carries a declared disk budget with bytes-per-day of tick, bar, depth and journal growth MEASURED and recorded at the soak and never estimated; hot rooms purge only after a verified off-host copy exists, under hot_room_retention_window, since the evidence tier shares the machine and a same-disk sync frees nothing by itself; a disk_headroom_min threshold mints no-new-entry BEFORE the disk-full block arrives and pushes on the silent-degradation class so headroom is bounded by design rather than watched; and vps_disk_budget's line items are named and each separately capped — journald SystemMaxUse, room retention, backup staging, the per-commit trees under /opt/qmx with their declared prune depth, the reserved protection-intent extent under /var/lib/qmx/state, and /var/lib/qmx-observability, which additionally carries its own filesystem quota so a zero-authority stack can never consume the headroom disk_headroom_min protects. The registry rows minted here are backup_recovery_point_objective, backup_recovery_time_objective_integrity, backup_recovery_time_objective_full_dr, backup_retention_period, restore_verification_cadence, backup_object_storage_provider, backup_payload_key_custody, hot_room_retention_window, disk_headroom_min, vps_disk_budget, news_calendar_refresh_cadence and news_calendar_max_staleness."
    status: ratified
    rationale: "Rests on A17 — RULED by the operator 2026-08-28: Forex Factory's free weekly file is the sole V1 source, no paid fallback ever, a second free source or an agent-scraped JSON in CT-15 shape as the later path, refresh cadence configurable, personal-use posture recorded — and on A18 (nightly sample restore, monthly full restore, plus a host-loss rehearsal) and A19 (rclone over an in-process S3 client, Backblaze B2 recommended), both proceed-on-recommendation. The operator ruling at memlog line 48 (Q4) supersedes the original TN-13 entry's 'paid impact-carrying fallback slot (FMP / Trading Economics class) as configuration', and line 49's TN-13 amendment applied it at desk and minted news_calendar_refresh_cadence as a configurable. The first-gate ruling at line 46 (2) moved the backup payload key to workstation custody with the escrow rule, added the host-loss rehearsal as the drill that measures full-DR RTO, and required the VPS-loss runbook. GATE-2 rulings at line 51 added the widen-or-add-only revision rule, the news_calendar_max_staleness precondition, the sealed calendar CODE identity versus frontier-read data, and the declared per-firing retry policy inside the provider budget (7); split the restore drills into qmn-restore-sample.timer and qmn-restore-full.timer with the host-loss rehearsal as the restore_drill_run power and renamed the recorder timer qmn-news-calendar.timer (16); made the sealed-archive role what the backup reads (26); and added the observability quota, the /opt/qmx prune depth and the reserved protection-intent extent as separately capped budget line items (13, 12, 21). The original entry's registry row names backup_recovery_time_objective and backup_key_custody are superseded by the split integrity and full-DR rows and by backup_payload_key_custody."
    sources: [EXT-2106, EXT-2109]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-13, live-data, history-bootstrap, news-calendar, forex-factory, backup, restore-drills, capacity]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-13"

  - id: DEC-0199
    title: "Time discipline at the live boundary (TN-14)"
    statement: "[ADOPTED] The node adopts in full the time-audit obligations of the ratified operations runbook table (runbook.md:107-116) and ratifies them by adoption rather than minting new law. The VPS operating-system clock is the sole stamper of QMX-owned event times: chrony runs with four or more sources (iburst, makestep boot-only, NTS where offered), installed by provisioning on Ubuntu 24.04 and only VERIFIED rather than installed on 26.04 where chrony is the default; RTC in UTC, system zone UTC, TZ=UTC; no local time is ever stored as an evidence timestamp, key or comparison, while AD-8 civil-time bucket keys stay legal as identity-bearing derivations of an instant plus a declared zone and tzdata version, used for seasonality, session-of-day statistics and AD-39 session-window conditioning and never as timestamps or causality proxies. No trade before sync: preflight waits on chronyc waitsync, the clock slews only while live, a step happens only with the node stopped and is detected by a wall-versus-monotonic divergence detector that marks a suspect window, and every unsynchronized, stepped or paused window - a VPS live migration included - mints an explicit data-gap record plus a no-entry window. Two measurements are named apart and never merged: machine-versus-truth (chrony offset, stratum, sync-age, step counter) and node-versus-broker SKEW (a rolling per-venue local_receive minus source series, windowed minimum), never auto-corrected and never called latency. FOUR BANDS ok | warn | no-new-entry | halt are evaluated as a per-decision-cycle PRECONDITION and never as a standing CT-30 action, so no band ever needs de-escalating and none can be confused with a control the operator must resume; effects are entry-side only per L39, no-new-entry refusing place_order and risk-increasing amends for that cycle and nothing else while halt enters the node stand-down lifecycle state that only an operator resurrect leaves; exceeding a band is a typed refusal plus a journal record plus a node state change, never silent, a no-new-entry band pushes on the silent-degradation alert class in live as well as during the soak, and unsynchronized (no source for N minutes) is a distinct state from measured drift. Four registry rows are minted configurable - clock_drift_warn, clock_drift_no_new_entry, clock_drift_halt and clock_unsynchronized_after - whose band numbers are EVIDENCE VALUES recorded from the time audit and sized for roughly one-second decisions, never ratified constants (L38); the leap-second posture is no smearing sources, step-with-slew per the chrony default, one policy on all machines. Three calendar kinds stay named apart - market-hours, day-boundary and news (DEC-0106) - with calendar identity riding in-band on every TradingDate, one pinned tzdata version verified at import and the TZPATH forcing proven once on the Linux VPS, the venue D1 boundary measured per broker into a venue-scoped market-hours calendar identity, broker schedule and holiday axes stored verbatim, and a session calendar never a fixed offset from broker server time."
    status: ratified
    rationale: "Adopted rather than invented: the obligations already stand in the ratified runbook table, so the node ratifies them by adoption and adds only the band mechanism, its four registry rows and the calendar-identity discipline. The rule rests on A20 - the clock-band evidence values as starting defaults and the leap-second posture - which is proceed-on-recommendation, not ruled by the operator, and on adjudication correction 8, which fixes the band numbers as RECONFIRM evidence from time-audit-devops.md:9 and never as constants. Amended at the gates: memlog line 46 (3) made the no-new-entry band a per-decision-cycle precondition rather than a standing CT-30 action and made node stand-down a lifecycle state left only by an operator resurrect, and memlog line 46 (6) fixed every node-raised block as entry-side only; memlog line 51 (20) tagged the four clock rows blocks-role-live plus blocks-soak, and line 51 (22) put value-status on the resolved config artifact, so a provisional band value needs an operator countersign carrying its evidence citation before live money."
    sources: [EXT-2110]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-14, time, clock, adopted]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-14"

  - id: DEC-0200
    title: "Observability: logs, metrics, health, alerts (TN-15)"
    statement: "AD-14 made concrete, and LOGS ARE NOT JOURNALS. Operator logs are stdlib logging with a JSON-lines formatter to stdout captured by journald - retention and rotation set by provisioning as a SystemMaxUse cap plus a configurable retention window whose length is an evidence value - carrying ts in UTC ISO-8601 with an explicit Z at millisecond precision, level, logger, event, correlation_id propagated across every boundary, boot_epoch, composition_fp and typed-refusal fields (category, retryability, after-condition, reference ids only, never a secret value), at the stdlib five levels with a typed refusal at WARNING, an alarm at ERROR and stand-down or halt at CRITICAL, while journals stay CT-13 evidence in the journal room and are never written through the logger. Metrics use prometheus_client as registry and exposition format ONLY - the node's own door serves /metrics on the localhost endpoint and no library-spawned server thread exists - exporting families named at implementation under a qmn_ prefix whose labels never carry secrets or account numbers beyond opaque ids: clock, session, command streams, reconciliation, protection (KSA level per enforcement scope, the scope carried as a label), the six AD-13 latency rungs as monotonic histograms with no budgets until baselines exist, data, backup and process. The legacy five Records streams survive as CT-25 PROJECTION NAMES ONLY over AD-21's seven journal event types through CT-25's one versioned mapping table - veto_ledger = decision events with outcome refused-by-door, trade_journal = order and fill events joined through the command record's content fingerprint, book_journal = the entity projection over decision, risk transition and control action selected by Book identity, ksa_audit_log = control action events of the protection-authority class plus their suppressed subtype, correlation_ledger = the enacts edge set linking enactment to intent - each a read and never a writer, and the position and balance read-backs join that same table as CT-20 observation kinds rather than as an eighth journal type. Every component's health() aggregates into a /health read model of INDEPENDENT states (safety, execution readiness, connection, reconciliation, data freshness, lifecycle, sync) and never one colour, requested protection state shown apart from enforced, each state carrying its own per-read provenance - authority source live-authoritative or replicated-evidence, source time, receive time and watermark. The closed allow-list is the ONLY push tier and it has THREE CLASSES: money boundaries (sweep, re-seed, refund, refund dormant in V1); protection escalation (kill switch and KSA escalation, supervision fail-closed, node stand-down, plus the named state alarms - rotation store failure, unmapped venue code, reused command identity, undeliverable protection intent, fold-cannot-resolve, missing scope record, paper-stream outage at live severity); and SILENT DEGRADATION, the node having stopped accepting entries or being unable to persist evidence for a reason that is not a KSA escalation, enumerated as a clock band at no-new-entry or worse, an unexplained live-drift entry stand-down on any binding, a failed news-calendar refresh, a degraded or dead canonical sensing feed, a failed nightly backup or sample restore or full restore or host-loss rehearsal, disk headroom below disk_headroom_min, and a live first-connection or data-quality verification failure; everything else is console evidence. FAILURES.md's notification tier column is the SOLE HOME of alert-class membership and the allow-list is GENERATED from it, so no registry row carries membership and a failure mode with no register entry cannot be alerted; one push channel runs through a NotificationChannel port with a generic HTTPS-webhook implementation plus console and file sinks, the operations toolkit's just node-notify-test recipe delivers a synthetic alert end-to-end through the powers channel, records and delivery stay two planes (an alert is evidence, not permission), and an external DEAD-MAN'S SWITCH heartbeats on a declared cadence to an off-VPS watcher that alerts on a MISSING ping, with a liveness digest that survives go-live and a clock-band alert that does NOT switch off at go-live. The observability stack, ruled mandatory by the operator through the unattended soak and after it, is a SEPARATE ZERO-AUTHORITY SYSTEM of Prometheus, Grafana and Loki/Promtail class shipped as a compose file under qmn/deploy/observability/: it consumes the node's exported metrics and JSON logs and can never write to the node, hold a credential the node holds, or appear on any decision, command or evidence path, so losing it loses visibility and nothing else; containers are permitted for THIS STACK ONLY while the node stays a plain systemd service; it runs under its own unit qmx-observability.service on a distinct non-qmx service account, stores under /var/lib/qmx-observability as a named line item of vps_disk_budget with its own retention caps and its own filesystem quota, runs network_mode host with every container port bound to loopback and scrapes the /metrics path only, reads the node's log stream through a dedicated read-only journal namespace rather than the system journal, and holds its own credentials as the DECLARED FOURTH secret holder. Skylos's IaC scan gates the checked-in compose file, its image versions are pinned at the implementation gate and registered as external tools in DEPENDENCIES.md rather than floating, the node's own half is the /metrics exposition, the JSON-lines log stream and versioned dashboard-as-code seeds, the node runs and passes with the stack stopped, and a dedicated monitoring agent consuming the stack later is explicitly out of scope."
    status: ratified
    rationale: "AD-14 is the parent law; this rule only makes it concrete and closes the three homes that could otherwise drift - the log/journal split, the alert allow-list's single source, and the stack's footprint. It rests on A21 (stdlib logging over structlog, prometheus_client, a webhook channel, the soak alert profile), A35 (an external dead-man's switch as a required V1 component, against the otherwise no-required-external-stack posture) and A42 (the stack as its own unit under a distinct account, with its own storage, quota, host-network binding, journal namespace and fourth secret holder) - all proceed-on-recommendation - and it is downstream of A10, RULED by the operator on 2026-08-28: because the soak is a full unattended week, tracking became mandatory and the stack entered the spine. Amended at the gates: memlog line 46 (18) minted the third alert class, the external dead-man's switch and the liveness digest; memlog line 48 (Q2) and line 49 turned the pre-ruling 'Prometheus/Grafana-class stacks are optional zero-authority consumers' into a mandatory separate system with compose file, exporters and dashboard seeds; line 51 (13) fixed its unit, account, storage quota, loopback binding, journal namespace and fourth-holder status; line 51 (10) replaced the single reconciliation residual with two reported separately; line 51 (24) made the KSA level a per-enforcement-scope label; line 51 (21) routed an UNDELIVERABLE protection intent onto the silent-degradation class; and line 51 (34) made FAILURES.md's notification tier column the sole home, withdrawing the proposed registry membership row. The memlog's pre-ruling soak profile - two soak-only alerts switching off at go-live - is superseded: the clock-band alert is a permanent member of class 3."
    sources: [EXT-2111, EXT-2123]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-15, observability, alerts, metrics, logging]
    date: 2026-08-28
    spine_ref: "SRC-11:ARCHITECTURE-SPINE.md#TN-15"

  - id: DEC-0201
    title: "Deployment, supervision shape, CI matrix, rollback, hardening (TN-16)"
    statement: "The node runs as a plain systemd service on Ubuntu 24.04 LTS x86-64 - systemd 255.4, so systemd-creds is available and it matches the ubuntu-24.04 CI runner, with 26.04 LTS the planned upgrade at the first maintenance window - and never as a container: no Docker requirement stands and systemd credentials are the secret path (NFR-10). ONE canonical checkout is materialized as IMMUTABLE PER-COMMIT TREES: /opt/qmx is a canonical root holding one immutable tree per commit plus a current symlink, each tree a git clone at its pinned commit with uv-managed CPython 3.14 and uv sync --frozen already applied and nothing built or published elsewhere; uv sync --frozen never writes into a tree a running node resolved from, old trees are pruned to a declared depth that is a named line item of vps_disk_budget so a rollback needs no network, and the pre-qmn bootstrap is a declared day-one stand-alone script - install uv, provision CPython, install just at its pinned version, install and pin the container runtime the separate observability stack needs, and clone at the pinned commit into the first tree - run before qmn exists and before any just node-... recipe can be called. Installing qmn on the workstation is for the provisioning wizard and the Python API only and is ENFORCED: the composition root refuses to compose off the roster's VPS machine tuple, the SecretStore refuses a venue-session holder off that host, a tier-1 check proves the wizard module imports neither the connection manager nor the refresh duty, and a tier-1 check proves the packaging declares no console-script entry point and no publishable target, so the VPS trees stay the only runtime installation. Unit files are CHECKED IN under qmn/deploy/systemd/ as FIVE node units - qmn.service, qmn-news-calendar timer and service, qmn-backup timer and service, qmn-restore-sample timer and service (nightly) and qmn-restore-full timer and service (monthly) - with qmx-observability.service a SIXTH checked-in unit that is not one of the node's, and hardening is reconciled with the storage topology rather than asserted beside it: a fixed User=qmx service account for all five node units rather than DynamicUser, ProtectSystem=strict with ReadWritePaths=/var/lib/qmx and every writable tree pre-created and owned by qmx, RuntimeDirectory creating /run/qmn for the powers socket, LogsDirectory, NoNewPrivileges, PrivateTmp, ProtectHome, RestrictAddressFamilies limited to AF_UNIX plus AF_INET plus AF_INET6, LoadCredentialEncrypted per unit for that unit's credentials only, Restart=on-failure with RestartForceExitStatus=75 and SuccessExitStatus=75 so a requested restart at a safe point actually restarts and is never counted as a failure, RestartSec, StartLimitBurst strictly greater than the crash-loop K with StartLimitIntervalSec at least T, and TimeoutStopSec and WatchdogSec RENDERED into the unit file from the resolved config artifact's drain_window and watchdog_interval by just node-install rather than hand-authored, so a config change and a unit file can never disagree. Install and upgrade run from the OPERATIONS TOOLKIT and never from a product command line: just node-install runs an idempotent script in the checkout (chrony, the qmx account and the stack's distinct account, tree creation and ownership including /var/lib/qmx-observability and its quota, rendered unit files, credstore layout, journald limits and the stack's read-only journal namespace, the pinned container runtime and the compose file); just node-switch <commit> MATERIALIZES A NEW TREE BESIDE THE OLD - preflight, backup-first, clone plus uv sync --frozen into the new tree, a dry-run boot in check mode against that tree, then an atomic flip of the current symlink as part of a drain-aware restart at a safe point, then a prune to the declared depth - minting a DEPLOYMENT RECORD on the same version graph as the config carrying both the commit and the config version, the dry-run validating that exact pair; and just node-rollback is the same symlink flip onto the previous retained tree and its config pair with no network. None of these is a trading control, and migrations follow AD-20 only (preflight, backup, dry-run, migrate, verify) and never in place. Check mode is defined rather than implied - it runs the doors, the config compile, the fingerprint, the seal and every preflight gate needing no venue and no credential, SKIPS credential-presence, store-reachability, chronyc waitsync and venue connect, exits non-zero on any refusal and never opens a sequencer - and because that is a different path from a real boot, the soak gate additionally requires one boot under the real systemd unit with LoadCredentialEncrypted from a scratch credstore. ONE ENVIRONMENT is a decision with its compensating controls named - there is no staging host, and an upgrade is validated by the CI clean-install boot, the check-mode dry run on the production host, a TN-21 replay diff of a recorded day and the just node-rollback flip - while VPS hardening is SSH key-only with no password plus the separate restricted provisioning identity and the separate confined inbox-write identity, ufw default-deny inbound except SSH, a stated egress allow-list (venue hosts, the notification and dead-man's-switch endpoints, the object-storage bucket, the history and news-calendar providers, the distribution index, the observability stack's image registry or a vendored image source, and NTP), no public port ever with the doors localhost- and socket-bound and reached over an SSH tunnel, and unattended security upgrades with NO automatic reboot and configured never to restart qmn.service. The CI matrix keeps tier-1 Windows 11 plus Ubuntu LTS and closes the now-stale clean-install deferral by adding a Linux lane pinned ubuntu-24.04, never latest, that re-runs the type gate with pythonPlatform Linux, runs the tier-2 isolated-install smoke plus a clean-install boot-in-check-mode of the node and scans the unit files, with tier 3 check-release gaining the both-OS smoke; the nightly mutation job targets the branch that carries code and a zero-mutants-classified run FAILS CLOSED and alarms rather than passing vacuously; benchmark baselines are recorded on the VPS's declared OS and CPU-class tuple with the CI lane running the harness for correctness only; and the 26.04 upgrade carries two behavioural deltas rather than a version bump - chrony becomes the default so provisioning verifies rather than installs, and the CI pin holds at ubuntu-24.04 until ubuntu-26.04 leaves runner preview."
    status: ratified
    rationale: "NFR-10's one-canonical-checkout, no-DB-server, no-container-requirement claim and ADR-0012's tier structure are the parent bindings; this rule makes them a repeatable deployment with a rollback that needs no archaeology. It rests on A22 (systemd rather than a container, Ubuntu 24.04, the Linux lane pinned to ubuntu-24.04), A31 (a fixed qmx service account rather than DynamicUser, every writable tree under /var/lib/qmx) and A41 (immutable per-commit trees plus an atomically flipped current symlink, pruned to a declared depth) - all proceed-on-recommendation - and it inherits A42's stack footprint for the sixth unit and the container runtime. Amended at the gates: memlog line 46 (12) replaced the memlog's DynamicUser=yes plus StateDirectory=qmn with the fixed User=qmx account and the named /var/lib/qmx trees and pinned systemd-creds encrypt --with-key=host; memlog line 48 (Q1) and line 49 deleted the node command line, so the memlog's qmn deploy install and qmn deploy switch <commit> text is SUPERSEDED - install, switch and rollback are just node-... recipes of the operations toolkit, DevOps tooling and never a trading control; memlog line 51 (12) replaced the single mutable checkout with immutable per-commit trees, the atomic symlink flip and the deployment record carrying commit plus config version; line 51 (16) renamed the timers and split the restore drill into a nightly sample and a monthly full timer, restating the unit count; line 51 (18) made the workstation-only installation enforced by four named checks; line 51 (28) made TimeoutStopSec and WatchdogSec rendered from the config artifact; line 51 (29) pinned just and defined the bootstrap script; and line 51 (13) added the stack's distinct account, its quota and the image registry to the egress allow-list. Memlog line 46 (11) supplies the supervision mechanics the unit file encodes (StartLimitBurst greater than K, StartLimitIntervalSec at least T, TimeoutStopSec at least the drain window) and line 51 (5) the exit-75 requested-restart contract."
    sources: [EXT-2112, EXT-2124]
    authority: rider
    component: COMP-QMN
    tags: [trading-node, tn-16, deployment, systemd, ci, rollback, hardening]
    date: 2026-08-28
