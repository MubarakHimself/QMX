[project]
name = "qmf-data"
version = "0.1.0"
description = "Room-roles, evidence policy, dataset splits, the holdout seal, journals, source adapters, and backup primitives."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "qmf-core",
    # Engine libraries for the CT-11/CT-09 store seam (Story 3.1; AR-30, DEC-0117).
    # Declared here only — never in qmf-core, never at a boundary signature. Pinned
    # for byte-identical results; registered in DEPENDENCIES.md with licence + why.
    "pyarrow==25.0.1",
    "duckdb==1.5.5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace submodule. Dot notation tells uv_build the module lives at
# src/qmf/data/ with NO src/qmf/__init__.py anywhere in the distribution.
module-name = "qmf.data"

[tool.uv.sources]
qmf-core = { workspace = true }
