id: CT-33
name: Bot definition (declaration) kind contract
status: ratified
version: 1  # first minted format version; CT-33 fills AD-16's reserved Bot kind, ruled by the 2026-08-21 QML sitting (DEC-0173), closing GAP-0047; corpus signed off by the operator 2026-08-21
owner: COMP-QMF-REGISTRY  # kinds are owned by qmf-registry like every kind; the CT-33 artifact is AUTHORED VIA the QML library (its author-side types/helpers produce the declaration on qmf-core nouns), but the record kind is qmf-registry-owned (DEC-0173)
consumers: []  # consumer-blind by design: the Bot kind is a qmf-registry record kind authored via the QML library; QML returns fingerprintable content and the composition root mints and persists the record under the AD-25 root-mints pattern, so no package import edge exists (DEC-0173)
active_consumers: []
intended_consumers: [COMP-QML, COMP-QMB]  # QML authors the declaration and gates its registration (author-side types + conformance gate); QMB's config compiler and sweep admission consume it, and the future trading-node seat machinery cites it — all through the composition root; the platform UI is a platform-territory consumer of the declaration as UI-editable configuration (DEC-0173, DEC-0172)
wiring_status: defined-unwired  # the Bot kind is ratified surface; no code exists; records reach qmf-registry through the composition root under the AD-25 root-mints pattern; no wiring is authorized from this doc (DEC-0173)
layer_from: backend
layer_to: backend
decisions: [DEC-0114, DEC-0115, DEC-0144, DEC-0154, DEC-0172, DEC-0173, DEC-0174, DEC-0176, DEC-0177, DEC-0178]
gaps: []  # GAP-0047 (AD-16's reserved Bot kind body) is CLOSED by this contract; admission-bar threshold VALUES stay GAP-0048/0049 and live on CT-22, never here — CT-33 declares identity and interfaces, not thresholds (DEC-0173, DEC-0178)
purpose: >-
  One Bot definition — the CT-33 kind filling AD-16's reserved Bot kind — the governed
  bot's DECLARATION half: a structured configuration artifact (JSON-Schema-class under
  AD-30's template discipline) plus a reference to the bot's plain-Python logic
  distribution, whose identity is its SEMANTIC CONTENT ONLY (exactly one strategy-family
  id, the confluence set, the declared parameter space, the footprint, the permitted
  exit-intent declaration, and the logic reference — with the AD-16 common header's
  writer, sequence, stable id and created-at excluded from fp1), so a bot's meaning lives
  inside its identity, two bots compare and deduplicate by construction, a tuned assignment
  can never silently wear the original's track record, and a seat (CT-28) cites the
  definition by fp1; authored via the QML library, owned by qmf-registry like every kind,
  and minting only when both conformance layers (DEC-0178) pass.
invariants:
  - "CT-33 fills AD-16's reserved Bot kind — a qmf-registry per-kind record contract on the QMF ladder, authored via the QML library and owned by qmf-registry like every kind; QML mints no new CT-* shared contract of its own, it authors this kind's artifact and gates its registration (DEC-0173, DEC-0114)."
  - "Identity carve-out, stated so AD-16's law cannot be misread: the AD-16 common header's `writer`, `sequence`, `stable id`, and `created-at` are ordering/occurrence fields EXCLUDED from `fp1` (the stable id is derived FROM the fingerprint, never hashed INTO it); Bot identity is the semantic content only, plus the contract format version and at-birth refs (DEC-0173, DEC-0114)."
  - "The declaration's SEMANTIC CONTENT is exactly six groups and no more — beside the AD-16 common header, the contract format version and at-birth refs, and AD-30's version-graph machinery (whose `current` pointer is a separate dated record): (1) exactly one strategy-family id; (2) the confluence set — one-or-more CT-34 fingerprints; (3) the declared parameter space; (4) the footprint (which contains the stream set); (5) the permitted exit-intent declaration; (6) the logic reference — and it carries NO exit-logic field, since exit behaviour is the Book's, keyed by the bot's one family id (DEC-0173, DEC-0176)."
  - "The strategy-family id is exactly one — a deliberate AD-17 cardinality-one ruling: an opaque operator-minted id (AD-9) resolving to a dated CT-06 family metadata record (the same machinery as `instrument_class`, an addable kind with no new CT number); a family is a keying token with no authority, and one bot keyed to two families would partition every per-family variable and exit-policy resolution two ways (DEC-0176)."
  - "The confluence set is one-or-more CT-34 confluence fingerprints (AD-17), canonically ordered by child fingerprint ascending with a separate display-only ordinal (AD-30 set discipline); the bot declares no execution order — sequencing semantics live in the Python logic, never in the declaration (DEC-0173, DEC-0115)."
  - "The declared parameter space is THE one authoritative bot parameter-space contract — the schema B-8's optimizer consumes — never two: B-8's schema (name, type, bounds, step, mandatory default, optional hard constraint filter) COMPLETED with the AD-40 unit-kind every declared variable already requires; a parameter missing its unit-kind is `invalid input` (DEC-0173, DEC-0154)."
  - "The defaults of the parameter space, taken together, are the definition's CANONICAL ASSIGNMENT — one identity locus, not a separate field (DEC-0173)."
  - "Parameterization law: governed live/paper seats execute the canonical assignment ONLY; non-default assignments exist solely as B-3 run-spec overrides in experimentation runs (each fully labeled and resolvable from the resolved run-config fingerprint); promoting a tuned assignment mints a NEW Bot version (`branches-from`, optionally `continues-performance`) whose defaults are the tuned values — no tuned bot ever silently wears the original's track record (DEC-0173)."
  - "The footprint is the single canonical consumption manifest and CONTAINS the stream-set declaration (instrument-role + `BarSpec` list in B-12's shape, trading vs data-only roles) as one nested locus, one linter target — never a second top-level field (DEC-0174, DEC-0173)."
  - "Every footprint producer binding is either (a) a pinned configured-producer fingerprint (CT-16/CT-17 identity) or (b) a producer TEMPLATE — a complete CT-16/CT-17 configuration minus ONLY the space-bound parameter values; an omitted identity field on a template is a Layer-1 registration refusal (AD-22 'a missing element is a contract defect'), and resolution is a total, single-valued function producing one deterministic CT-16/CT-17 fingerprint (DEC-0174)."
  - "Footprint completeness law: the footprint's producer-binding set MUST equal the transitive union of every cited confluence's leg producer bindings plus any bot-direct producers; a confluence-leg producer absent from the footprint is a Layer-1 registration refusal, and hosts provide ONLY the declared footprint to the logic (DEC-0174)."
  - "The bot's warm-up/embargo horizon is DERIVED at resolution from the resolved producer chain (AD-21/AD-22 law), never hand-declared — there is no second window field on the declaration (DEC-0174)."
  - "The permitted-intent declaration names the bot's permitted EXIT-intent kinds — a subset of the ratified CT-23 exit vocabulary (`close_full | tighten_protective_stop`), which MAY BE EMPTY (an entry-only bot is legal); `entry` is ALWAYS permitted and is never declared or gated here; intent-kind identifiers are stored as opaque `qmf-core`-typed values validated by QML-side linters, so qmf-registry gains no `qmf-risk` edge (DEC-0173)."
  - "The logic reference is the bot's identity basis for its logic half: distribution identity + version + a canonical source-manifest fingerprint (a normalized, reproducible hash over the source tree), never non-reproducible built-artifact or wheel bytes; it is an identity field of the definition, so a code change mints a new Bot exactly as a changed default does (DEC-0172)."
  - "Versioning is AD-30's git logic verbatim: an append-only `branches-from` version graph (multiple heads legal; `current` is a separate dated pointer record), every version readable forever, `continues-performance` carrying a track record across versions only when human-signed; Bot identity is content (AD-17), so re-binding, seats, and paper flips never mint a new Bot while a changed default, leg, footprint entry, or logic artifact always does (DEC-0173, DEC-0144, DEC-0115)."
  - "The bot never sizes and never declares its own realized full-loss price: `requested_r` and the declared full-loss price are Book-resolved (AD-33/AD-40), and the CT-33 declaration carries no sizing, no venue command, and no exit logic (DEC-0177, DEC-0154)."
  - "The AD-41 seat record — the Bot side of the CT-28 binding context — cites the registered Bot definition by `fp1`, and the prediction linter (DEC-0178) runs against that binding context; re-binding semantics stay CT-28/AD-29's (DEC-0173)."
  - "Registration is the ticket: the Bot kind mints ONLY for a declaration passing both conformance layers (Layer 1 declaration linter + Layer 2 sandboxed execution conformance); registration otherwise refuses (`policy rejection`), and that registration is what governed evidence (CT-32) and seats CITE — ungoverned plain-Python bots keep full tunnel access and simply cannot be cited by governed evidence (DEC-0178)."
schema:
  type: bot-definition  # the reserved Bot kind's body: a per-kind AD-16 registry record whose fp1 is the bot's identity — the DECLARATION half of a governed bot (the logic half is a referenced plain-Python distribution, DEC-0172)
  fields:
    - "contract_format_version: the Bot kind's own format version; an uninterpretable value is an `unsupported capability` refusal, never a best-effort read (DEC-0173, DEC-0144)"
    - "bot_definition_fingerprint: the `fp1` over the canonical semantic content — the Bot identity a seat (CT-28) and governed evidence (CT-32) cite, never a version string; the AD-16 header's writer/sequence/stable-id/created-at are excluded from it (DEC-0173, DEC-0114)"
    - "strategy_family_id: exactly one opaque operator-minted family id (AD-9) resolving to a dated CT-06 family metadata record; a key never an authority (DEC-0176)"
    - "confluence_set: one-or-more CT-34 confluence fingerprints (AD-17), canonically ordered by child fingerprint ascending, each carrying a separate display-only ordinal; the bot declares no execution order (DEC-0173, DEC-0115)"
    - "parameter_space: THE one authoritative bot parameter-space contract B-8's optimizer consumes — a set of declared variables, each `{ name, type, bounds, step, mandatory default, optional hard constraint filter, AD-40 unit-kind }`; one schema completed with unit-kinds, never two (DEC-0173, DEC-0154)"
    - "canonical_assignment: the mandatory-default projection of parameter_space taken together — the ONLY assignment governed live/paper seats execute; one identity locus, not a separate declared field (DEC-0173)"
    - "footprint.stream_set: instrument-role + `BarSpec` list in B-12's shape (trading vs data-only roles) — the one stream-set locus, nested inside the footprint (DEC-0174, DEC-0173)"
    - "footprint.required_calendars: calendar identities + versions per AD-8 (DEC-0174)"
    - "footprint.producer_bindings: each either a pinned configured-producer fingerprint (CT-16/CT-17 identity) or a producer TEMPLATE (a complete CT-16/CT-17 configuration minus only the space-bound parameter values); the set MUST equal the transitive union of every cited confluence's leg producers plus bot-direct producers (DEC-0174)"
    - "footprint.warm_up_horizon: DERIVED at resolution from the resolved producer chain (AD-21/AD-22), never hand-declared — no second window (DEC-0174)"
    - "permitted_exit_intents: the bot's declared permitted EXIT-intent kinds — a subset of the ratified CT-23 exit vocabulary, which MAY BE EMPTY; `entry` is never listed (always permitted); intent-kind ids are opaque qmf-core-typed values so qmf-registry gains no qmf-risk edge (DEC-0173)"
    - "logic_reference: the referenced plain-Python logic distribution's identity basis — distribution identity + version + canonical source-manifest fingerprint (a reproducible hash over the source tree, never built-artifact/wheel bytes); an identity field of the Bot (DEC-0172)"
    - "version_graph: AD-30 git-logic versioning — an append-only `branches-from` graph (multiple heads legal), `current` a separate dated pointer record, `continues-performance` carrying a track record across versions only when human-signed; every version readable forever (DEC-0173, DEC-0144)"
  enums:
    - "parameter type: exact integer | exact rational | categorical | boolean — B-8's closed set; every variable additionally carries an AD-40 unit-kind (DEC-0173, DEC-0154)"
    - "unit-kind (per parameter): the closed AD-40 vocabulary money(currency) | price-delta(instrument) | quantity(unit) | value-factor(instrument, currency) | r-multiple | rate(money-per-r) | count | dimensionless-ratio | duration | instant (DEC-0154)"
    - "producer binding form: pinned-fingerprint | template — a template resolves to a pinned fingerprint by a total, single-valued function (DEC-0174)"
    - "permitted exit-intent kinds (a subset, possibly empty): close_full | tighten_protective_stop — the ratified CT-23 exit vocabulary; `entry` is never listed (always permitted); close_partial is not a V1 kind (DEC-0173)"
    - "ui flag (per declared configurable variable): ui-editable | uneditable — AD-30 template discipline, exactly one per variable (DEC-0144)"
    - "refusal categories on this contract's Layer-1 registration paths, per registry:typed_refusal_codes: invalid input (a parameter missing its unit-kind, default, or bound; a producer template missing an identity field; a footprint whose producer set is not the transitive union of every cited confluence's leg producers plus bot-direct producers; a permitted exit-intent kind outside the CT-23 vocabulary; a family cardinality other than exactly one), unsupported capability (an unknown contract format version), unavailable dependency (an unresolvable family record, confluence fingerprint, producer formula, or logic distribution), policy rejection (registration attempted for a declaration that fails either conformance layer) (DEC-0173, DEC-0174, DEC-0178)"
  units:
    - "every declared parameter carries a unit-kind from the closed AD-40 vocabulary; a parameter missing its unit-kind is `invalid input` — the one-schema completion this contract mandates (DEC-0154, DEC-0173)"
    - "bounds, step, and default are exact rationals or scaled integers (AD-7 — no binary float anywhere); the default is mandatory and forms part of the canonical assignment (DEC-0173, DEC-0144)"
    - "fingerprints (bot_definition_fingerprint, confluence fingerprints, producer fingerprints, source-manifest fingerprint) are fp1 strings (fp1:sha256:<hex>); the source-manifest fingerprint is a reproducible hash over the logic source tree, never built-artifact bytes (DEC-0172, DEC-0114)"
    - "the Bot definition declares no money or R values of its own — R sizing is Book-resolved (AD-40); the declaration carries a parameter space, a footprint, and refs, never sizing (DEC-0177, DEC-0154)"
  nullability:
    - "no field is null (AD-10): a bot declaring no exit-intent kinds carries an EMPTY permitted-exit-intent set (a declared value), never an absent key; an entry-only bot is legal (DEC-0173)"
    - "strategy_family_id is mandatory and exactly one; a cardinality of zero or more-than-one is `invalid input` (DEC-0176)"
    - "the confluence set is one-or-more (at least one); every declared parameter carries a mandatory default; the footprint's producer-binding set is mandatory and complete per the transitive-union law (DEC-0173, DEC-0174, DEC-0115)"
    - "the logic reference is mandatory — a governed bot is two artifacts; a declaration whose logic distribution is unresolvable is an `unavailable dependency` refusal at Layer 1 (DEC-0172, DEC-0178)"
    - "order among confluence fingerprints is the fingerprint-ascending default; the display ordinal is always present and never enters identity (DEC-0173, DEC-0115)"
provenance_note: "CT-33 is newly minted by the 2026-08-21 QML architecture sitting (spine QL-3 and QL-4's footprint section), filling AD-16's reserved Bot kind and closing GAP-0047; it is authored via the QML library and owned by qmf-registry like every kind (DEC-0173). It supersedes the dead BotSpec framing: the old `exit_logic` slot on the bot is deliberately dead — exit behaviour is the Book's, keyed by the bot's one strategy family (DEC-0176) — and 'BotSpec' is a retired alias recorded in the glossary. The declaration is one half of a governed bot; the logic half is a referenced plain-Python distribution whose source-manifest identity enters this record's fp1 (DEC-0172). Design is ratified by operator delegation 2026-08-21 (reviewer gate: 5 lenses, 34 findings, all applied); implementation authorization arrives only through the factory pipeline, and this doc stays provisional."
