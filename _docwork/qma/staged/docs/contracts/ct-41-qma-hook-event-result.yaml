id: CT-41
name: QMA hook event and hook result contract
status: ratified
version: 1  # first minted format version; the hook enforcement surface of the QMX agentic system, minted by the 2026-08-28/29 QMA architecture sitting (spine AD-10 and AD-11), validation closed dry 2026-08-29 with `verifier_ref` added to the HookResult union (DEC-0309, DEC-0310, DEC-0339)
owner: COMP-QMA-CORE  # `HookEvent` and `HookResult` are defined in `qma-core`'s `plugins/` package beside `ports/` (AD-1); the daemon implements the registry and dispatch, plugins and agents author against the qma-core types (DEC-0300, DEC-0309)
consumers: []  # consumer-blind by design: `HookEvent`/`HookResult` are qma-core definitions imported by the daemon's hook registry (the implementer and dispatcher), by desk plugins that contribute hooks, and by mission-scoped agent-authored hooks, so no runtime import edge is drawn to the definition from its authors (DEC-0300, DEC-0335)
active_consumers: []
intended_consumers: [COMP-QMA-DAEMON]  # the daemon owns the hook registry, dispatches every `HookEvent` and resolves every `HookResult` under the total precedence order; desk plugins (multi `hook` contribution) and mission-scoped agent-authored hooks (AD-11) are the other authors, all through qma-core (DEC-0309, DEC-0310)
wiring_status: defined-unwired  # ratified surface; no code exists; hooks are the single enforcement and control surface once the daemon ships (DEC-0339)
layer_from: backend
layer_to: backend
decisions: [DEC-0309, DEC-0310, DEC-0339]
gaps: [GAP-0087]  # Claude Agent SDK hook count 7-vs-10 — bounded by the Cut on adapters hosting foreign agent runtimes; AD-10's hook set is QMA-authored and nothing in the spine depends on that count
purpose: >-
  The single enforcement and control surface of the QMX agentic system: every daemon-owned
  primitive ships a before/after `HookEvent`, and a hook returns a `HookResult` the daemon
  resolves. This contract fixes the closed-and-addable v1 registry — a `before_` and an
  `after_` event for each of twenty-three daemon-owned verbs, plus exactly two declared
  phase-less blocking controls (`agent_stop`, `review_required`) — the phase law that
  decides which decisions each event may return, the `HookResult` tagged union (the six
  decisions in a total precedence order plus the phase-gated fields `updated_input`,
  `updated_output`, `injected_context`, `ledger_entry` and `verifier_ref`), the fail-closed
  rule with its three carve-outs, the `ask` / `defer` semantics, the source bounds, and the
  AD-11 registration validator that holds an agent-authored hook to `decision` and `reason`
  only. Hooks are deterministic Python — never prompts, never an LLM judging itself — and
  the decision is always the daemon's.
invariants:
  - "Hooks are the single enforcement surface: every daemon-owned primitive ships a before/after hook event, hooks are the single enforcement point and the control surface — never an optional feature — an agent-reachable write into any daemon-owned store passes a `before_*` hook without exception, and a primitive whose write path has no hook event is a defect in this registry, never an exemption (DEC-0339, DEC-0309)."
  - "Phase law: every event declares its phase in its name, except the two declared phase-less blocking controls `agent_stop` and `review_required`, which fire before the act they gate; only a `before_*` event and those two controls may return `deny`, `ask` or `defer`; `block_stop` is legal only on the two phase-less controls and is refused at registration on every `before_*` event; `allow` is legal on every `before_*` event and on `after_tool`; every other `after_*` event may return only `observe`; a decision illegal for an event's phase is refused AT REGISTRATION, never discovered at runtime (DEC-0309)."
  - "The v1 registry is closed-and-addable: a `before_` and an `after_` event for each of these twenty-three daemon-owned verbs — tool, task_create, task_complete, ledger_append, memory_write, skill_write, artifact_register, experiment_register, env_create, env_remove, subagent_spawn, message_send, graph_transition, session_start, session_end, mission_start, mission_complete, plugin_activate, plugin_deactivate, routine_fire, hook_register, proposal_stage, proposal_apply — plus exactly two declared phase-less blocking controls, `agent_stop` and `review_required`; that is the ratified v1 set and it is complete as listed (DEC-0309)."
  - "Addability: every new daemon-owned primitive ships a `before_<verb>` gate event AND an `after_<verb>` event, the same pairing all twenty-three verbs use; omitting an `after_<verb>` is a spine amendment naming the verb and the reason, never an author's judgment call (DEC-0309)."
  - "`HookResult` is one tagged union carrying `decision`, `reason`, `updated_input` (`before_tool` only), `updated_output` (`after_tool` only), `injected_context` (`before_*` events only — it reaches the Context Compiler, never the Ledger), `ledger_entry` (`before_task_complete` and `review_required` only, and that entry still passes `before_ledger_append` like every other append) and `verifier_ref` (`before_task_complete` and `review_required` only); a field carried on an event whose phase does not permit it is refused AT REGISTRATION, on the same check as an illegal decision (DEC-0309)."
  - "Total precedence: the decision vocabulary is exactly six values in the total order `block_stop > deny > defer > ask > allow > observe`; parallel hooks resolve most-restrictive-wins; `observe` never participates in resolution and may not carry `updated_input` or `updated_output`; `updated_input` and `updated_output` are FIELDS of `HookResult`, never decisions, and each rides an `allow` (DEC-0309)."
  - "Per-control semantics: on `agent_stop` the legal decisions are `block_stop` (return the Agent to the next ready Task, AD-29) and `observe`; `deny` is not legal, a hook returning nothing resolves to `observe`, and a timeout resolves to `observe` annotated `hook_timeout` — fail-closed does not reach this control because a fail-closed stop control traps a run. On `review_required` the legal decisions are `deny`, `block_stop` and `observe`; a hook returning nothing resolves to `observe` and a timeout resolves to `deny` (DEC-0309)."
  - "Fail-closed with three carve-outs: a hook timeout resolves to `deny` with reason `hook_timeout` plus a telemetry record carrying the `correlation_id`; the carve-outs are `before_ledger_append` (a validating gate not a blocking control — a timeout resolves to ALLOW with the entry recorded and annotated `hook_timeout`, an explicit `deny` writes the entry to the quarantine stream with its reason and never discards it, and no policy, precedence resolution or permissive mode may produce a `deny` on a well-formed evidence append from the holder of the relevant lease, per L39), `agent_stop` (timeout resolves to `observe`) and every `after_*` event (timeout resolves to `observe` annotated `hook_timeout`, since `deny` is not in an `after_*` event's legal set and the observed effect is already durable); `before_memory_write` is fail-closed like every other `before_*` event (DEC-0309)."
  - "`ask` suspends the invocation and emits exactly one `approval_request` (CT-48) into the mailbox or operator approval queue named by its Mission's `approval_route`, and into the owning Quant's mailbox otherwise, carrying a required `ask_timeout` (registry:mission.ask_timeout) and an `on_timeout` of `deny` or `escalate`, and where a Mission's `approval_route` declares its own `ask_timeout`/`on_timeout` the route's values govern (registry:mission.on_timeout); `escalate` re-emits the same `approval_request` exactly once — into the daemon-held operator approval queue when the ask routed to a Mission `approval_route` carrying the reserved value `operator`, into the owning Quant's mailbox when it routed to a Mission `approval_route` naming an `ActorId`, and into the desk lead Quant's mailbox (AD-7) otherwise — and restarts `ask_timeout` once, a second expiry resolving to `deny` with reason `ask_escalation_exhausted`, and never resolves to `allow`; a session whose autonomy axis is `autonomous` resolves `ask` to `deny` with reason `no_interactive_authority` unless the Mission's `approval_route` final hop is the reserved `operator` route with a timeout. `defer` parks the work durably, RELEASES the `environment_lease` and RETAINS the `dispatch_lease` — so resume is not a reassignment and does not increment `attempt_no` — and re-runs the full hook chain on resume; an unresolved `ask` or `defer` never holds an `environment_lease` (DEC-0309)."
  - "Source bounds: the registry keys by event, matcher and source, where source is one of desk, role, mission, plugin; a hook's source bounds the events it can ever receive (a `mission` hook receives only events whose `scope_path` contains that Mission, a `role` hook only that Role's Agents, a `desk` hook only that desk, a `plugin` hook only the scopes its manifest declares); the daemon applies the source bound BEFORE the matcher, a registration whose matcher could resolve outside its bound is refused at registration, and `injected_context` and `updated_input` from a mission-sourced hook may reach only invocations inside that Mission (DEC-0309)."
  - "Determinism: every hook is a deterministic Python callable or subprocess — no prompt-type and no agent-type handlers (P-2); hooks run in the daemon (a worker-side tool interception may execute in the worker but the decision is the daemon's); `before_task_complete` and `review_required` are required gates running a deterministic verifier script rather than an LLM judging itself, and ReviewPolicy's `author_family != reviewer_family` is enforced here against AD-15's optional `model_family` field, a deployment whose family is unassigned being ineligible for every comparison and the typed refusal `NoEligibleReviewer` returned when no deployment qualifies (DEC-0309)."
  - "Agent-authored hooks are observe-or-deny: an agent may author a hook only from an approved template, only scoped to its Mission, and only as an observe-or-deny hook whose `HookResult` may carry `decision` and `reason` and NOTHING else; the AD-11 registration validator rejects at registration any agent-authored hook whose result type can carry `updated_input`, `updated_output`, `injected_context`, `ledger_entry` or `verifier_ref` — the five non-`decision`/`reason` fields of the tagged union, enumerated so the check is closed (DEC-0310)."
  - "The six mechanical constraints on an agent-authored hook: (1) the template is schema-validated at registration; (2) the permission set is the intersection with the Mission's own and a hook naming a permission the Mission lacks is refused, never silently narrowed; (3) registration writes a record exposed through a named `qma-wire` query and folded into the definition store's hook registrations under that Mission's scope; (4) registration writes a journal entry carrying the `correlation_id` and itself passes `before_hook_register` and emits `after_hook_register`; (5) the disposer is pushed onto the Mission's exit stack so the hook is removed with the Mission; (6) the hook cannot escalate privilege — it may not register hooks, tools, plugins or contributions of any kind, may not raise its registry source above `mission`, and may not match an event whose source class is wider than `mission`; a mission-scoped hook never becomes a durable hook except through AD-22 (DEC-0310)."
schema:
  type: hook-event-and-result  # `HookEvent` (the 23 before_/after_ verb pairs plus the two phase-less controls, with phase, matcher, source, payload and timeout) and `HookResult` (the six-decision tagged union with its phase-gated fields) (DEC-0309, DEC-0310)
  fields:
    - "event: the hook event name, one of the twenty-three `before_<verb>`/`after_<verb>` pairs or the two phase-less controls `agent_stop` / `review_required` (DEC-0309)"
    - "phase: before | after | phase_less — declared in the event name for the twenty-three verbs, and phase_less for the two blocking controls that fire before the act they gate (DEC-0309)"
    - "matcher: the event matcher the daemon applies AFTER the source bound; a matcher that could resolve outside the hook's source bound is refused at registration (DEC-0309)"
    - "source: one of desk, role, mission, plugin — bounds the events the hook can ever receive (DEC-0309)"
    - "payload: the event's typed payload — the tool input for `before_tool`, the durable effect for an `after_*` event, and so on (DEC-0309)"
    - "timeout: the hook's execution timeout, a span; on expiry the phase-specific fail rule resolves the decision (registry:hook.timeout_before, registry:hook.timeout_after per phase; the two phase-less controls agent_stop and review_required take registry:hook.timeout_control, whose expiry resolves per the per-control semantics (agent_stop to `observe` annotated `hook_timeout`, review_required to `deny`)) (DEC-0309)"
    - "decision (HookResult): one of the six decision values in the total precedence order (DEC-0309)"
    - "reason (HookResult): the decision's reason string; carries `hook_timeout`, `ask_escalation_exhausted`, `no_interactive_authority` or another declared reason where the rule names one (DEC-0309)"
    - "updated_input (HookResult): `before_tool` only; rides an `allow` and never an `observe` (DEC-0309)"
    - "updated_output (HookResult): `after_tool` only; rides an `allow` and never an `observe` (DEC-0309)"
    - "injected_context (HookResult): `before_*` events only; reaches the Context Compiler, never the Ledger (DEC-0309)"
    - "ledger_entry (HookResult): `before_task_complete` and `review_required` only; the entry still passes `before_ledger_append` and is written with `authored_by: daemon` (DEC-0309)"
    - "verifier_ref (HookResult): `before_task_complete` and `review_required` only; the reference to the deterministic verifier's result (DEC-0309)"
  enums:
    - "the 23 daemon-owned hook verbs (each shipping a `before_<verb>` and an `after_<verb>` event): tool | task_create | task_complete | ledger_append | memory_write | skill_write | artifact_register | experiment_register | env_create | env_remove | subagent_spawn | message_send | graph_transition | session_start | session_end | mission_start | mission_complete | plugin_activate | plugin_deactivate | routine_fire | hook_register | proposal_stage | proposal_apply (DEC-0309)"
    - "the two phase-less blocking controls: agent_stop | review_required (DEC-0309)"
    - "HookResult decisions, the six values in total precedence block_stop > deny > defer > ask > allow > observe: block_stop | deny | defer | ask | allow | observe (DEC-0309)"
    - "legal decisions on `agent_stop`: block_stop | observe (DEC-0309)"
    - "legal decisions on `review_required`: deny | block_stop | observe (DEC-0309)"
    - "legal decisions on a `before_*` event: deny | defer | ask | allow | observe (block_stop refused at registration; observe never participates in resolution and may carry no updated_input/updated_output) (DEC-0309)"
    - "legal decisions on `after_tool`: allow | observe (DEC-0309)"
    - "legal decisions on every other `after_*` event: observe (DEC-0309)"
    - "on_timeout (on an `ask`): deny | escalate (DEC-0309)"
    - "HookResult phase-gated field carriers: updated_input (before_tool) | updated_output (after_tool) | injected_context (before_*) | ledger_entry (before_task_complete, review_required) | verifier_ref (before_task_complete, review_required) (DEC-0309)"
    - "the AD-11 registration validator reject list for an agent-authored hook (whose result type may carry only `decision` and `reason`): updated_input | updated_output | injected_context | ledger_entry | verifier_ref (DEC-0310)"
    - "hook source classes: desk | role | mission | plugin (DEC-0309)"
    - "typed refusals on this surface, variants of `qmf-core`'s base: `NoEligibleReviewer` (no deployment qualifies for ReviewPolicy's `author_family != reviewer_family` comparison) (DEC-0309)"
  units:
    - "timeouts (hook execution per phase, `ask_timeout`) are spans measured from a recorded UTC instant (AD-6) and carry no timezone: registry:hook.timeout_before, registry:hook.timeout_after, registry:hook.timeout_control, registry:mission.ask_timeout (DEC-0309)"
    - "a hook timeout resolves per the phase-specific fail rule: a `before_*` event to `deny` (`hook_timeout`), `before_ledger_append` to `allow` (`hook_timeout`), `agent_stop` to `observe` (`hook_timeout`), and any `after_*` event to `observe` (`hook_timeout`) (DEC-0309)"
    - "fingerprints (`verifier_ref`, the `ledger_entry` reference): `fp1:sha256:<hex>` imported from the parent, never re-derived (DEC-0309)"
  nullability:
    - "`event`, `phase` and `decision` are always present; per `fp1` null is prohibited and an absent value is an omitted key (DEC-0309)"
    - "a `HookResult` returning nothing is a resolution, not a null decision: on a `before_*` event or `after_tool` it resolves to `allow`, and on the two phase-less controls it resolves to `observe` (DEC-0309)"
    - "`updated_input`, `updated_output`, `injected_context`, `ledger_entry` and `verifier_ref` are each present only on the event whose phase permits them and absent (an omitted key) elsewhere; a field on an event whose phase forbids it is refused at registration (DEC-0309)"
    - "an agent-authored `HookResult` carries `decision` and `reason` only; a result type that can carry any of the five other fields is refused at registration (DEC-0310)"
provenance_note: "CT-41 is newly minted by the 2026-08-28/29 QMA architecture sitting: the hook enforcement and control surface of the QMX agentic system, realizing AD-10 (hooks are the single enforcement surface — the phase law, the twenty-three-verb registry plus two phase-less controls, the `HookResult` tagged union, total precedence, fail-closed with three carve-outs, `ask`/`defer`, source bounds and determinism) and AD-11 (mission-scoped, agent-authored hooks and the observe-or-deny registration validator) (DEC-0309, DEC-0310, DEC-0339). The `verifier_ref` field was added to the `HookResult` union at the 2026-08-29 validation close (verified=true, dry=true, remaining=0). Defined in `qma-core` beside the ports (AD-1, DEC-0300) and implemented by the daemon's hook registry; the contract is `defined-unwired` and no code exists. Hooks are deterministic Python and the decision is always the daemon's; implementation authorization arrives only through the factory pipeline."
