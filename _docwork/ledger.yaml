  - id: DEC-0300
    title: "AD-1 adopted: contract-hub packages, qma.* namespaces, port cardinality and the plugin contribution surface"
    statement: "AD-1 is adopted. The packages are qma-core (definitions only, depends only on qmf-core), qma-daemon (the only process that runs anything) and qma-wire (the only cross-boundary contract package), with qma-ui-contract present only as a deferred stub; the Python namespace is qma.* with no blanket qmx. prefix anywhere, and plugins and ledger views are named by desk. Every runtime concern enters through a port qma-core defines: MemoryProvider, ModelDeployment, ExecutionEnvironment, KnowledgeSource, ToolAdapter, ComputeProvider and ContextCompiler. qma-core also defines the plugin contribution surface in a plugins/ package beside ports/ — PluginManifest, the PluginContext protocol carrying the cardinality-typed registration methods, HookEvent and HookResult, the closed handle-kind vocabulary (AD-14) and the credential_ref string type (AD-24) — which qma-daemon implements and whose loader it owns, so a plugin imports its contribution types from qma-core and never from qma-daemon. Every contribution point declares a cardinality; every singleton additionally declares an explicit scope key and every multi point is keyed by its fully-qualified plugin_id:local_id. The singleton points and their scope keys are MemoryProvider per desk, KnowledgeSource per source_id, ExecutionEnvironment per kind, ComputeProvider per kind and ContextCompiler per daemon; the multi points are tool, tool_adapter, hook, skill, graph_template, model_deployment, toolset and worker_template. There is no ui_view contribution point in v1 and a contribution point with no qma-wire schema may not be registered (the retired candidate points command, ui_view and mission_template are gone). The plugin roster is the daemon's declarative startup list of plugins, one entry per plugin_id carrying its version and enable flag — daemon configuration, never a contribution, and unrelated to the QMF package roster of parent AD-2 — and a roster entry whose cardinality or scope key the daemon cannot resolve at startup is a startup error naming the entry and the unresolved field. The ContextCompiler singleton is a default binding, not a registration: the daemon's implementation occupies the key only while no plugin binds it, exactly one plugin may bind it (replacing the default at load time as a recorded journal event, never a runtime override) and two plugins binding it is a hard startup error; every other singleton ships no default. An unbound singleton key is a startup error only when a loaded roster entry, plugin manifest or Role grant requires it, naming the port, the key and the requiring unit; an unrequired key stays unbound and its port unavailable — with no MemoryProvider bound recall returns the typed refusal NoMemoryProvider and candidates stage under AD-22, and an ExecutionEnvironment or ComputeProvider kind that no declared environment names is unbound, not an error. Two plugins binding one singleton key is a hard startup error naming both plugin ids, the port and the key — never last-write-wins and never a runtime override — and every multi contribution is addressed plugin_id:local_id, unique daemon-wide, with a duplicate the same hard startup error; toolsets, templates and Role grants reference fully-qualified ids only."
    status: ratified
    rationale: "Adopted from the QMA spine AD-1 (FINAL 2026-08-29, validation dry) as amended by the memlog contribution-surface, cardinality and roster fixes (L58, L59, L129, L158, L161, L162, L178, L186, L217): the plugin contribution surface is homed in qma-core, the Multi list is closed at eight kinds with command, ui_view and mission_template removed, and the ContextCompiler default-binding rule with unbound-key scoping make a v1 daemon bootable. Carried into docs by the QMA documentation-factory increment under the rider SRC-15 (I-draft-operator-ratifies mode)."
    sources: [EXT-2300, EXT-2301]
    component: COMP-QMA-CORE
    tags: [architecture-spine, qma, ad-1, contract-hub, ports, cardinality, plugin-surface]

  - id: DEC-0301
    title: "AD-2 adopted: dependency direction, the default-deny diagram, and the qmf-risk/qmf-registry read-and-calculate narrowing"
    statement: "AD-2 is adopted. Every arrow in the dependency diagram reads depends on, the diagram is the whole rule, and an edge not drawn is default-deny until ratified in this spine. Plugin halves — daemon, worker and UI — never share process memory and meet only at qma-wire; for dependency purposes a plugin's worker half is covered by the PLUGIN node (it may depend on qma-wire and qma-core and never on qma-daemon) while the WORKER node governs non-plugin workers and language adapters, which depend on qma-wire alone. The qma-daemon to qmf-risk and qma-daemon to qmf-registry edges are read-and-calculate only: QMA may import their value types, typed refusals and pure calculation surfaces and may write only content-addressed dev-zone candidate artifacts through qmf-registry (AD-14), and it may not construct, write, amend or delete a binding record, a Book, a BMS or seat record, a control-action record, an exit or protection record, a priority rank or a promotion record, and may not call any zone-transition surface. The permitted surface of each edge is enumerated in qma-core and that enumeration is default-deny — a surface not listed is not callable and adding one is a spine amendment — and qmf-venue is importable by no QMA package, worker or plugin. L30 carries a scope annotation (2026-08-21) making its default-deny roster-scoped, governing the seven QMF roster packages internally and never applications, so QMA's read-and-calculate edge to qmf-risk and qmf-registry is an application dependency under L31, recorded as a declared reconciliation note rather than an amendment of the parent by a child. The drawn edges are the UI, the workers and the plugins to qma-wire; the plugins and the daemon to qma-core; the daemon to qma-wire and to qmf-registry, qmf-data and qmf-risk; qma-wire to qma-core; and qma-core and the qmf libraries to qmf-core."
    status: ratified
    rationale: "Adopted from the QMA spine AD-2 (FINAL 2026-08-29) with the memlog edge-narrowing and diagram-node fixes (L60, L101, L113, L253): the qmf-risk/qmf-registry edges are read-and-calculate only under L30's roster-scoped reading (an application dependency under L31), qmf-venue is importable by nothing QMA, and a plugin's worker half is the PLUGIN node. Carried into docs by the QMA increment under SRC-15."
    sources: [EXT-2302, EXT-2303]
    component: COMP-QMA-CORE
    tags: [architecture-spine, qma, ad-2, dependency-direction, default-deny, read-and-calculate]

  - id: DEC-0302
    title: "AD-3 adopted: no parallel base for anything qmf-core defines; one content-addressing construction"
    statement: "AD-3 is adopted. QMA refusal types are variants of qmf-core's typed-refusal base, ids and correlation_id are qmf-core types, fp1 is imported and never re-derived, and money and time follow the parent's exact types. qma-core may add nouns and refusal variants but may not define a second base for anything qmf-core already defines, and no unit may re-mint one (L31, DEC-0122). Content addressing has exactly one construction: a content-addressed id is fp1 over the value's canonical JSON, and a tree digest — the AD-19 corpus snapshots, AD-17's ExperimentSpec, AD-14's candidates and AD-8's artifact registry — is fp1 over a canonical manifest of per-file fp1 values. There is one scheme, verifiable by the single imported implementation, and a second Merkle or hash construction is never defined; four previously unreconciled schemes were collapsed into this one."
    status: ratified
    rationale: "Adopted from the QMA spine AD-3 (FINAL 2026-08-29) with the memlog content-addressing unification (L61): four unreconciled schemes were collapsed into one fp1-over-canonical-JSON id plus one fp1-over-per-file-manifest tree digest, so no unit re-mints fp1 and no second hash construction exists. Carried into docs by the QMA increment under SRC-15."
    sources: [EXT-2304, EXT-2305]
    component: COMP-QMA-CORE
    tags: [architecture-spine, qma, ad-3, no-parallel-base, fp1, content-addressing]

  - id: DEC-0303
    title: "AD-4 adopted: one Python 3.14 asyncio daemon; workers and non-Python clients over the wire; the RLM kernel in the Analysis worker"
    statement: "AD-4 is adopted. The daemon is a single Python 3.14 asyncio process; hooks and verifier scripts run inside it, and the RLM kernel is a persistent Python interpreter inside the Analysis worker's Docker container, supervised by the daemon over the typed host_request bridge (AD-14) and never in the daemon process, so AD-28's image and network boundary applies to the kernel. Language-specific workers and non-Python clients — the Rust UI included — connect over qma-wire as clients and never re-implement a qmf contract, and money, time, fp1 and correlation_id never cross a language boundary. This prevents re-implementing QMF contracts across a language boundary and forbids a second daemon runtime."
    status: ratified
    rationale: "Adopted from the QMA spine AD-4 (FINAL 2026-08-29) with the memlog RLM-kernel placement fix (L109): hooks and verifiers run in the daemon while the RLM kernel is a persistent Python interpreter inside the Analysis worker's Docker container over the host_request bridge, settling that AD-28's image/network boundary applies to the kernel. Carried into docs by the QMA increment under SRC-15."
    sources: [EXT-2306, EXT-2307]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-4, daemon-language, rlm-kernel, single-runtime]

  - id: DEC-0304
    title: "AD-5 adopted: the daemon-to-UI wire contract, envelope, transport posture and correlation_id origins"
    statement: "AD-5 is adopted. Daemon and UI are two products joined by one versioned contract: commands mutate and are acked immediately with side effects settling asynchronously, queries read durable state, and a durable event stream carries progress; closing a client must not stop an agent and an overnight agent need not know a client exists. The wire envelope carries v, type, id, producer_id, correlation_id, scope_path, an optional seq and payload; producer_id is the stable identity of the minting client, worker or daemon component, assigned at the initialize handshake, unchanged across reconnects, the first half of the idempotency pair and one of the ten names the Conventions whitelist against the _ref law. scope_path is an ordered array of kind plus id segments in the fixed order desk, quant, mission, task, session, agent, subagent — Session between Task and Agent because a Task outlives its session (AD-12) — every existing ancestor present, filters prefix-matching it and the order part of canonical JSON. One seq, one referent: seq is always the per-scope projection index of the scope named last in that message's scope_path, and journal_seq (AD-6) never appears on the wire as seq and is opaque to clients. Transport is JSON-RPC 2.0 over WebSocket with HTTP GET for queries, an MCP-style initialize handshake negotiating a semver protocolVersion plus capabilities, and JSON-Schema-described message families, JSON canonical per fp1. The daemon binds loopback by default; any non-loopback bind requires TLS (wss:// plus HTTPS for queries) and an explicit recorded operator configuration, every client authenticates with a Credential-Broker-resolved credential before protocol bytes, and an unauthenticated or plaintext non-loopback bind is a hard startup refusal; a remote worker or deployed Quant dials out to its daemon and the daemon never dials in, so no inbound port opens on the deployed side and no external relay is introduced, while the daemon's own listener is the single inbound port and is non-loopback only under that TLS-plus-recorded-configuration rule. Compatibility is additive-only within a major, unknown types and fields ignored by older clients, deprecations living wire.deprecation_minors (default 2) then dropped, and qma-wire is the sole compatibility authority. The vocabulary seeds from the packet's 26 nouns — 9 commands, 7 queries and 10 noun.verb events — as a closed-and-addable registry. wire.attach(scope, since_seq) and wire.detach are client state only, attachment never changing an actor's identity or stopping a run, session replay is wire.attach(since_seq=0) read-only, and a wire.attach carrying a cursor from another scope is refused with the typed refusal CursorScopeMismatch and never silently re-based. Every wire command is idempotent on the pair producer_id plus id and the daemon keeps a dedup cursor whose window is wire.dedup_window. correlation_id has exactly three minting origins — an originating operator command, a scheduled trigger (AD-29) and a daemon-internal lifecycle act (crash recovery, the expiry of a dispatch_lease or an environment_lease, an automatic migration checkpoint and the two AD-23 daemon-job trims of the mailbox delivery projection and the telemetry store) — is copied verbatim onto every downstream command, event, JobHandle, ledger append, memory candidate and telemetry span, is never regenerated, derived or truncated, and a record without one is refused at the gate except an evidence append, which is recorded under a daemon-minted lifecycle id annotated correlation_missing because L39 forbids a control blocking the recording of evidence. Snapshots are authoritative; progress events are explicitly not."
    status: ratified
    rationale: "Adopted from the QMA spine AD-5 (FINAL 2026-08-29) with the memlog transport, seq, scope_path-order, correlation_id-origin and producer_id fixes (L54, L55, L56, L57, L111, L163, L164, L237, L264): dial-out remote reachability, one-seq-one-referent, the three correlation_id origins including the two AD-23 daemon-job trims, and the correlation_missing evidence carve-out. Carried into docs by the QMA increment under SRC-15."
    sources: [EXT-2308, EXT-2309]
    component: COMP-QMA-WIRE
    tags: [architecture-spine, qma, ad-5, wire-contract, envelope, transport-posture, correlation-id]

  - id: DEC-0305
    title: "AD-6 adopted: one journal, one writer, one clock; the closed store list, announcement law and folds"
    statement: "AD-6 is adopted. Persistence is JSONL append journals plus SQLite in WAL mode behind qmf-data sinks, with DuckDB holding rebuildable fold views only and never evidence. A single append-only journal with a global monotonic journal_seq is the only durable append target for daemon-owned events and journal_seq is the single total order in the system; every event carries its full scope path, a per-scope stream is a filtered projection whose seq is a derived index, and the event journal is evidence — append-only, retained under the same law as the ledgers, backed up under AD-27 and never trimmed — neither a ledger (AD-9) nor telemetry (AD-23). The closed store list has two classes. Journal-derived projections, never independent append targets: per-scope event streams; mailboxes and delivery state (AD-20); the daemon-held operator approval queue (AD-12), a mailbox-kind projection over the same journal message.* events readable and answerable only by an operator-principal connection and folded with mailbox delivery state; Task Graph state (AD-12); Session and Agent records (AD-14, AD-16); desk ledger views (AD-9); the ledger quarantine stream (AD-10), a projection over journal ledger.quarantined events carrying the refused entry verbatim with its reason; and the daemon's declarative registries collectively the definition store — Desk, Role (role.base and role.overlay) and Quant records, the Deployment Registry, the Tool Registry and tool_adapter records, toolset and worker_template records, hook registrations, Skill, Graph Template and Loop registrations, Routine records, ExecutionEnvironment declarations, the AD-26 variable registry and plugin install records — a sixteen-member set, each a projection over its own noun.verb journal events with journal_seq as ordering key. Declared independent stores, each with exactly one named writer and one append path through the daemon: the three ledger stores (AD-9), the artifact store (AD-8), the telemetry store (AD-23), the AD-22 staging store and an admitted MemoryProvider's own store (AD-18); a store not on this list may not be created. Every append to a declared evidence store — the three ledgers, the artifact store, the staging store and an admitted MemoryProvider's store — also emits a journal event naming the store and carrying the record's fp1 (ledger.appended, artifact.registered and their siblings), so ordering and replay stay journal-authoritative; the telemetry store is the one declared store this announcement law exempts, because a journal that is never trimmed may not grow with a stream that is bounded. The announcement's journal_seq is the ordering key in every cross-store fold and equal instants are disposed by ascending journal_seq, never by timestamp. Every durable record carries occurred_at and recorded_at as int64 UTC nanoseconds from qmf-core's clock plus, in every store the announcement law binds, its announcement journal_seq; a telemetry record carries occurred_at and recorded_at, no journal_seq, and is ordered by recorded_at and its correlation_id alone; every externally-sourced fact additionally carries source and revision. The v1 folds are exactly the desk ledger views, Task, Mission, Session and Agent state (the Session record carrying its execution-model and autonomy axes and never its attachment, the Agent record carrying the effective capability set computed at spawn), mailbox delivery state and ack cursors, deployment and provider health, staging and application state, and each definition-store registry — every fold taking journal_seq as ordering key, as_of over recorded_at as knowledge-time bound and equal instants by ascending journal_seq; per-scope event streams and the ledger quarantine stream are filtered projections, not folds, and a new fold is a spine amendment. No process other than the daemon writes the journal, the SQLite file or the artifact store; a read-only fold process may open these files read-only on the daemon's host only and never writes and never checkpoints, and external stores that live elsewhere (QMB's run ledger) are reached by _ref and never merged. The daemon opens the SQLite store on exactly one connection in one thread with every checkpoint on that connection, under which the WAL-reset bug is unreachable so 3.51.3 is not a v1 floor, asserting sqlite3.sqlite_version at startup as evidence; 3.51.3 or the 3.50.7 backport becomes a hard floor only if a second writable connection or a separate checkpointer thread is introduced. A remote or partitioned worker holds a durable local outbox — ordered, fsynced, never a journal, never folded, discarded entry by entry on daemon ack — that replays in order on reconnect with the daemon deduping on producer plus id; outbox depth and spool bytes are registered AD-26 variables, on exhaustion the worker blocks the dispatch of new work rather than discarding a pending evidence append (L39) with telemetry discarded first, and an environment lost with a non-empty outbox marks that Task's ledger unknown_tail at the last acked id and never fabricates the missing tail. Every persisted timestamp is UTC obtained from qmf-core's clock via the daemon, no component reads host local time and no worker timestamps its own evidence; every operator-facing wall-clock policy — quiet hours, routines and cron, rollups, the ledger date index — carries an explicit IANA timezone resolved in the daemon at evaluation time, and every duration policy — job timeouts, ask_timeout, hook timeouts, retention windows — is a span measured from a recorded UTC instant and carries no timezone."
    status: ratified
    rationale: "Adopted from the QMA spine AD-6 (FINAL 2026-08-29) with the memlog store-list, announcement-law, fold-contract, SQLite-precondition, outbox and clock-law fixes (L49, L50, L51, L52, L53, L134, L142, L165, L166, L167, L187, L201, L216, L227, L241, L265, L278, L284, L285, L290): the definition store is a 16-member journal-derived set, the announcement law is scoped to evidence stores (telemetry exempt, and a telemetry record carries no journal_seq per the 2026-08-29 fix), the one-connection SQLite rule keeps 3.51.3 off the v1 floor, and the outbox marks unknown_tail rather than fabricating a tail. Carried into docs by the QMA increment under SRC-15."
    sources: [EXT-2310, EXT-2311]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-6, event-journal, closed-store-list, sole-writer, clock-law]

  - id: DEC-0306
    title: "AD-7 adopted: ontology, cardinality and the ActorId address grammar"
    statement: "AD-7 is adopted. The ontology chain is Desk to Role to Quant to Agent to Subagent. Desk is the organizational and workspace unit; Profile is presentation only, a client-side grouping of desk_slugs with a display name held in client configuration, never daemon state, never a scope_path segment and never an index, filter, permission or routing key. Role is a declarative behavioral contract, close to a system prompt, and stateless. Quant is the persistent named organizational actor instantiated from a Role — carrying name, memory scope, missions, routines, preferences, a WakePolicy (AD-20) and a mailbox — plus a Quant Ledger opened only while it carries its desk's lead flag and retained if the flag moves; a Quant that has never held the lead flag has no Quant Ledger. Agent is a running reasoning or execution instance, and a Subagent is an Agent spawned by an Agent with capabilities no wider than its parent and is a leaf that spawns none because AD-16 blocks it from delegation tools. Session is the run container and Worker is an addressable execution slot deliberately not an ontology object. Role:Quant and Desk:Quant are both one-to-many; exactly one Quant per Desk carries the lead flag and its mailbox is the address for desk-scoped inbound, and a mailbox Envelope whose more specific recipient no longer exists resolves to dead_letter (AD-20) until the operator rules on the catch-all (Deferred). ActorId grammar is quant:<desk_slug>/<quant_slug>, each slug lower-case and 2 to 32 characters, minted only by the desk.create and quant.create wire commands from an operator principal, and the daemon refuses with the typed refusal SlugUnavailable any quant_slug that case-folds onto a current or retired slug, a Role name or a reserved desk prefix token and any desk_slug beyond the five that case-folds onto a current or retired slug or a Role name. The five desk_slug values are exactly research, trading, dev, analysis and pm, identical to the plugin prefix tokens research-*, trading-*, dev-*, analysis-* and pm-*, minted once at bootstrap and exempt from the reserved-prefix-token clause, and never reused. An ActorId is stable, never a Role name and never reused, and opaque to every consumer: desk membership is a field on the Quant record resolved through the daemon's definition store, never through qmf-registry and never parsed from the slug substring, no index, view, filter, permission check or route reads the slug, desk membership is mutable by an operator command recording a desk.moved journal event while the ActorId never changes, and a retired desk or Quant keeps a tombstone record reserving its slug forever and carrying its alias. A desk consolidation is a Profile-level collapse only and never renames or retires a desk_slug, ActorId, plugin prefix, memory scope or ledger index key. Agents and Subagents have no mailbox and are never a to address. The work vocabulary is Goal (informal intent) to Mission (an executable organizational contract owned by one Quant, the desk derived from the Quant record) to Task. The five Roles are Researcher, Trader, Developer, Analyst and Product Manager and the five Desks are Research, Trading, Development, Analysis and PM; a Role name is never used as a Desk name and quant is never used as an adjective. Bot, Seat, Book, BMS and kill switch are platform terms (L36) and never name an agentic actor or artifact, which is a naming law conferring no capability prohibition — the prohibition on acting on those nouns lives in AD-16 and AD-28."
    status: ratified
    rationale: "Adopted from the QMA spine AD-7 (FINAL 2026-08-29) with the memlog opacity, lead-flag, naming and slug fixes (L62, L63, L64, L115, L116, L133, L147, L183, L188, L226, L239, L240): the ActorId is opaque with membership on the Quant record, the desk-level lead Quant is ratified while the single-lead and catch-all mailbox are Deferred (GAP-0071), the fifth Role is Product Manager so desk_slug pm stays mintable, and desk.moved follows the noun.verb law. Carried into docs by the QMA increment under SRC-15."
    sources: [EXT-2312, EXT-2313]
    component: COMP-QMA-CORE
    tags: [architecture-spine, qma, ad-7, ontology, quant, actorid]

  - id: DEC-0307
    title: "AD-8 adopted: state ownership across the eight store classes"
    statement: "AD-8 is adopted. The eight store classes are distinct — journal, ledger, memory, knowledge, artifacts, context, telemetry and staging are each separate — and ownership and lifetime are fixed here and nowhere else, the store list itself closed by AD-6. For each store the ownership table fixes owner, who may write, the crossing rule and retention. The event journal is owned and written by the daemon only; an evidence record's only permitted reference to a journal entry is its own announcement journal_seq stamp, for which the daemon allocates the sequence before writing the record so the record stays append-only; it is kept forever, backed up under AD-27 and exempt from trim. Mission and Task Graph state is daemon-only, agents proposing transitions as commands, crossing by _ref, kept forever. Session and Agent records are daemon-only journal projections, _ref only, rebuilt from and kept as long as the journal. The Task, Quant and Experiment ledgers are a daemon store, agent-authored except AD-9's two closed exemptions, written through before_ledger_append only by the Agent holding the relevant lease — the dispatch_lease for a Task Ledger, the quant_ledger_lease for a Quant Ledger and the registering Task's dispatch_lease for an Experiment Ledger — plus the two daemon-authored exemptions reassigned and unknown_tail and the hook-returned ledger_entry, all carrying authored_by daemon, _ref only, kept forever. The ledger quarantine is daemon-only, _ref, kept forever, rebuilt from the journal and exempt from trim. The definition store is daemon-only journal projections; agents propose edits only as AD-22 RefinementProposals, with exactly one exception closed here — a mission-scoped, template-validated observe-or-deny hook an agent registers through before_hook_register (AD-11), folded under that Mission's scope, disposed with the Mission on its exit stack and never becoming a durable hook except through AD-22 — and role.base is a definition-store record written only by an operator-principal role.set_base command while role.overlay stays proposal-editable. Memory is owned by the MemoryProvider, one binding per desk with records scoped by desk and role, the agent proposing and the daemon gate admitting, recalled into Context only, provider-owned with candidates kept until admitted, superseded, invalidated, expired or contradicted. Knowledge is an external read-only corpus that nobody writes, crossed by a Citation carrying source_ref, locator and snapshot_ref with cited bytes copied into the artifact store, cited copies kept forever. Artifacts are a daemon content-addressed registry written by the producing agent through before_artifact_register (the daemon writing the AD-19 citation copy through that same gate), _ref only, kept forever with lineage. Staging is a daemon store into which an agent proposes as a command and the daemon writes, staged content never read by a runtime path, approval decisions and lineage kept forever. Mailbox and Agent Bus, the daemon-held operator approval queue included, are a daemon projection over journal message.* events, daemon-only, _ref only, the delivery projection bounded and AD-26-registered and never removing an unacked Envelope or an unanswered approval_request while the underlying journal records keep forever. Context is owned by the Context Compiler per invocation, written by nobody, never persisted and discarded with the invocation. Telemetry is daemon harness-authored, written by daemon harness code only and never an agent, a separate store sharing correlation_id, bounded and AD-26-registered with trajectories and session replay exempt."
    status: ratified
    rationale: "Adopted from the QMA spine AD-8 (FINAL 2026-08-29) with the memlog ownership-table completion and the 2026-08-29 fixes (L65, L117, L118, L168, L180, L216, L229, L266, L278, L285, L292, L296): the eight-store inequality, the definition-store single agent write exception (the AD-11 mission-scoped observe-or-deny hook), role.base written only by an operator-principal role.set_base command, and unknown_tail as the second daemon-authored Task Ledger entry kind. Carried into docs by the QMA increment under SRC-15."
    sources: [EXT-2314, EXT-2315]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-8, state-ownership, definition-store, retention]

  - id: DEC-0308
    title: "AD-9 adopted: task, quant and experiment ledgers; everything else is a view"
    statement: "AD-9 is adopted. Three ledger stores exist and everything else is a view. The Task Ledger is owned by the Task, one per Task for its whole life across every Agent that ever holds it, recording what happened, when, what failed and why, what the agent did to resolve it and which model and agent did what, persisted in the daemon store through the wire so it survives the worker; never-shared-between-agents means no ledger spans two Tasks and no Agent appends to a Task it does not hold, not that a resumed Task starts a second ledger. Append rights follow a single dispatch_lease per Task, distinct from AD-17's per-slot environment_lease and never named bare, with every entry carrying attempt_no, authored_by (an agent ref plus the owning Quant's ActorId, or daemon on a daemon-authored entry which names no model deployment) and the model deployment used; a reassignment — any change of the Agent holding the dispatch_lease, including a resume that must re-acquire it after release — is a daemon-authored entry of kind reassigned that increments attempt_no, while a resume from defer retains the dispatch_lease and writes no reassigned entry and leaves attempt_no unchanged; before_ledger_append refuses an append from a non-holder of the relevant lease, with exactly two exempt authors — the daemon for the daemon-authored kinds reassigned and unknown_tail, and a ledger_entry returned by before_task_complete or review_required recorded with authored_by daemon plus the returning hook's registry id — both still schema-validated and the exempt set closed. The Quant Ledger is a desk lead Quant's own larger work ledger with a declared entry schema (mission opened and closed, delegation, escalation and the standing decisions the Quant makes at desk level), appended only through before_ledger_append by an Agent of that Quant holding the quant_ledger_lease which the daemon grants to at most one Agent of that Quant at a time; it never restates or synthesizes another Task's ledger while Mission reports are deferred and it survives movement of the desk lead flag. The Experiment Ledger is the scientist's notebook, one per Experiment, owned by the Quant that registered it and appended by the Agent holding the dispatch_lease of the Task that registered the Experiment, so two Tasks registering against one Experiment never produce two simultaneous authors, every entry carrying authored_by and the model deployment used. Research, Trading, Development, Analysis and PM ledgers are read-time views over those three, indexed by desk, quant, agent, mission, task, experiment and date, never stores, and their desk ledger view fold contract is stream the three ledger stores' ledger.appended announcements filtered by the view's index key, ordering key the announcement journal_seq, knowledge-time bound the view's as_of over recorded_at defaulting to now, and equal instants disposed by ascending journal_seq. Entries are appended only through before_ledger_append, a validating gate and not a blocking control (AD-10, L39); a task-completion transition requires a structured ledger append — what was done, what changed, evidence and artifact refs, unresolved issues and the next recommendation — or the completion, and only the completion, is refused while the entry is still written and never discarded. Entries may carry trace_ref, artifact_ref, experiment_ref or knowledge_ref, agent-to-agent messages are logged, and ledger names are desk-scoped and never platform-prefixed."
    status: ratified
    rationale: "Adopted from the QMA spine AD-9 (FINAL 2026-08-29) with the memlog task-ledger-ownership, three-lease-writer, reassignment-versus-resume and unknown_tail fixes (L66, L67, L121, L149, L189, L248, L279, L296): one Task Ledger for a Task's whole life, the three named leases, a resume from defer that is not a reassignment, and the two closed daemon-authored exemptions reassigned and unknown_tail. Carried into docs by the QMA increment under SRC-15."
    sources: [EXT-2316, EXT-2317]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-9, task-ledger, quant-ledger, experiment-ledger, leases]

  - id: DEC-0309
    title: "AD-10 adopted: hooks are the single enforcement surface"
    statement: "AD-10 is adopted: hooks are the single enforcement and control surface, never an optional feature. Phase law: every event declares its phase in its name except the two declared phase-less blocking controls agent_stop and review_required, which fire before the act they gate; a before_* event and those two controls are the only ones that may return deny, ask or defer; block_stop is legal only on the two phase-less controls and is refused at registration on every before_* event; allow is legal on every before_* event and on after_tool and is the resolution when a hook returns nothing on those events; on the two phase-less controls a hook that returns nothing resolves to observe; updated_input and updated_output are fields of HookResult and never decisions (updated_input on before_tool only, updated_output on after_tool only) and every other after_* event may return only observe; a decision or field illegal for an event's phase is refused at registration. The v1 registry is closed-and-addable: a before_ and an after_ event for each of twenty-three daemon-owned verbs — tool, task_create, task_complete, ledger_append, memory_write, skill_write, artifact_register, experiment_register, env_create, env_remove, subagent_spawn, message_send, graph_transition, session_start, session_end, mission_start, mission_complete, plugin_activate, plugin_deactivate, routine_fire, hook_register, proposal_stage and proposal_apply — plus exactly the two phase-less blocking controls agent_stop and review_required, whose legal decisions are drawn from block_stop, deny and observe. Every new daemon-owned primitive ships a before_<verb> gate event and an after_<verb> event, omitting an after_<verb> being a spine amendment; an agent-reachable write into any daemon-owned store passes a before_* hook without exception. HookResult is one tagged union carrying decision, reason, updated_input (before_tool only), updated_output (after_tool only), injected_context (before_* events only, reaching the Context Compiler and never the Ledger), ledger_entry (before_task_complete and review_required only, and that entry still passes before_ledger_append) and verifier_ref (before_task_complete and review_required only), a field on a phase that does not permit it refused at registration; decisions have the total precedence order block_stop over deny over defer over ask over allow over observe, parallel hooks resolving most-restrictive-wins and observe never participating. Fail-closed with three carve-outs: a hook timeout resolves to deny with reason hook_timeout plus a telemetry record, but L39 binds inside QMA so before_ledger_append is a validating gate not a blocking control — it may refuse only a schema-invalid entry or one authored outside the relevant lease, a timeout resolves to allow with the entry recorded and annotated hook_timeout, an explicit deny writes the entry to the quarantine stream with its reason and never discards it, and no permission policy, precedence resolution or permissive mode may produce a deny on a well-formed evidence append from the holder of the relevant lease — an agent_stop timeout resolves to observe, and any after_* timeout resolves to observe annotated hook_timeout, while every other before_* event and review_required stay fail-closed, before_memory_write included. On agent_stop the legal decisions are block_stop (return the Agent to the next ready Task, AD-29) and observe, deny is not legal, and a nothing-returned or a timeout resolves to observe; on review_required they are deny, block_stop and observe, a nothing-returned resolves to observe and a timeout resolves to deny. ask and defer are defined here and nowhere else: ask suspends the invocation and emits exactly one approval_request into the mailbox or operator approval queue named by its Mission's approval_route when the Mission carries one and into the owning Quant's mailbox otherwise — the single human-approval channel that AD-13's approval and human gates, AD-17's UNKNOWN resolution, AD-21's forward-only migration confirmation and AD-22's admission approval all raise and one wire command answers — carrying a required ask_timeout and an on_timeout of deny or escalate; escalate re-emits the same approval_request exactly once (into the operator approval queue for the reserved route value operator, into the owning Quant's mailbox for a route naming an ActorId, into the desk lead Quant's mailbox otherwise) and restarts ask_timeout once, a second expiry resolving to deny with reason ask_escalation_exhausted and never to allow; a session whose autonomy axis is autonomous resolves ask to deny with reason no_interactive_authority unless the Mission carries an approval_route whose final hop is the reserved operator route value and a timeout, while a route whose final hop is any ActorId resolves ask to deny and a Mission with no approval_route denies every ask in an autonomous session; defer parks the work durably, releases the environment_lease and retains the dispatch_lease so resume is not a reassignment and re-runs the full hook chain on resume, and an unresolved ask or defer never holds an environment_lease. A hook's source is one of desk, role, mission or plugin and bounds the events it can ever receive — a mission hook only events whose scope_path contains that Mission, a role hook only that Role's Agents, a desk hook only that desk, a plugin hook only the scopes its manifest declares — the daemon applying the source bound before the matcher and refusing at registration a matcher that could resolve outside its bound, with injected_context and updated_input from a mission-sourced hook reaching only invocations inside that Mission. Every hook is a deterministic Python callable or subprocess with no prompt-type and no agent-type handlers, hooks run in the daemon though a worker-side tool interception may execute in the worker with the decision the daemon's, and before_task_complete and review_required are required gates running a deterministic verifier script rather than an LLM judging itself, ReviewPolicy enforcing author_family not equal reviewer_family against the optional model_family field AD-15 defines on every Deployment record (a deployment whose family is unassigned being ineligible for every comparison) and returning the typed refusal NoEligibleReviewer when no deployment qualifies."
    status: ratified
    rationale: "Adopted from the QMA spine AD-10 (FINAL 2026-08-29) with the memlog phase-law, 23-verb registry, HookResult-field, three-carve-out fail-closed, ask/defer/escalate, per-control and source-bound fixes (L68, L69, L70, L71, L72, L110, L112, L146, L159, L169, L170, L171, L190, L214, L228, L249, L267, L280, L291): every daemon-owned write passes a before_* hook, before_ledger_append fails open under L39, the three phase-less/after_* timeout carve-outs, and ReviewPolicy compares AD-15's optional model_family returning NoEligibleReviewer when none qualifies. Carried into docs by the QMA increment under SRC-15."
    sources: [EXT-2318, EXT-2319]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-10, hooks, hookresult, fail-closed, ask-defer]

  - id: DEC-0310
    title: "Mission-scoped, agent-authored hooks are observe-or-deny only (AD-11)"
    statement: "An agent may author a hook only from an approved template, only scoped to its Mission, and only as an OBSERVE-OR-DENY hook: its HookResult may carry `decision` and `reason` and nothing else. The AD-11 registration validator rejects at registration any agent-authored hook whose result type can carry any of the five non-`decision`/`reason` fields of AD-10's HookResult tagged union — `updated_input`, `updated_output`, `injected_context`, `ledger_entry` or `verifier_ref` — the list closed at exactly those five so the check is closed (`verifier_ref` added by the 2026-08-29 validation fix, without which a mission-scoped hook could name its own completion verifier). Six mechanical constraints bind, not aspirational: (1) the template is schema-validated at registration; (2) the permission set is the intersection with the Mission's own, and a hook naming a permission the Mission lacks is REFUSED, never silently narrowed; (3) registration writes a record exposed through a named `qma-wire` query and folded into the definition store's hook registrations under that Mission's scope (AD-6, AD-10) — this spine mints no separate Mission audit record, the v1 obligation stated against the wire not the deferred UI; (4) registration writes a journal entry carrying the `correlation_id`, and registration itself passes `before_hook_register` and emits `after_hook_register` like every other agent-reachable write into a daemon-owned store; (5) the disposer is pushed onto the Mission's exit stack so the hook is removed with the Mission; (6) the hook CANNOT escalate privilege — it may not register hooks, tools, plugins or contributions of any kind, may not raise its registry source above `mission`, and may not match an event whose source class is wider than `mission` (AD-10's source bound). A mission-scoped hook never becomes a durable hook except through AD-22. This mission-scoped observe-or-deny hook, registered through `before_hook_register` and disposed with the Mission, is the single agent write path into a daemon-owned definition store outside AD-22 (AD-8, 2026-08-29 fix)."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-11 at the QMA sitting (SRC-13); the validator's reject list closed at five with `verifier_ref` added is the 2026-08-29 validation-pass surgical fix (memlog xref FIXED-30), and the single-agent-write-path-outside-AD-22 framing is the paired AD-8 definition-store fix of 2026-08-29. Absorbed under DEC-0329 on SRC-15's order; the spine is FINAL and validation closed dry 2026-08-29."
    sources: [EXT-2320, EXT-2321]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-11, hooks, mission-scoped, observe-or-deny]

  - id: DEC-0311
    title: "Mission and Task Graph are deterministic daemon state (AD-12)"
    statement: "An LLM proposes the decomposition; the infrastructure owns the resulting state. The Task Graph is deterministic persisted daemon state and the only place work state lives. A Task is TRANSCRIPT-INDEPENDENT: it carries intent, inputs, refs, acceptance criteria and its Task Ledger so another Agent can be assigned or resume it without the prior Agent's transcript. A Mission is the executable organizational contract — intent, scope, constraints, evidence requirements, available capabilities, success criteria, outputs, verification, budget, escalation, termination criteria and an optional `approval_route` (either an `ActorId` whose mailbox receives this Mission's `approval_request` `Envelope`s, or the reserved route value `operator` naming the daemon-held operator approval queue that only an `operator`-principal connection may read or answer, with its own `ask_timeout` and an `on_timeout` of `deny` or `escalate`) — owned by exactly one Quant, from whose registry record the owning desk is derived and on which the desk is never separately stored; there is no global mission. A route naming a non-existent Quant is refused when the Mission is compiled, never at ask time. The Mission Compiler is deterministic daemon code, never an LLM, turning a Goal plus an optional Graph Template (AD-13) into a Mission record and its initial Task Graph; there is no separate Mission Template registry in v1. Where decomposition must be reasoned the Compiler emits a decomposition Task whose Agent acts as Mission Director — not a new ontology object, an Agent of the owning Quant running under that Mission's Task Graph with a `dispatch_lease`, Task Ledger and Role permission set — whose decomposition reaches state only as proposed transitions the daemon validates (L35). A deterministic scheduler and dispatcher decide where, when, who, dependencies, and grant the `dispatch_lease` and `environment_lease`; parallel workers synchronize through the Task Graph, never chat. Task and Mission state is a closed-and-addable vocabulary — `pending`, `ready`, `running`, `blocked`, `unknown`, `done`, `failed`, `cancelled` — of which the TERMINAL states are exactly `done`, `failed` and `cancelled`; a Task reaches exactly one terminal state. The daemon refuses any proposed terminal transition of a DISPATCHED Task not evidenced by a terminal `JobHandle` (AD-17); a never-dispatched Task carries no `JobHandle` and may reach only `cancelled`, written by the daemon; a Mission never carries a `JobHandle` and its terminal state is computed by the daemon from its Tasks. A Task whose handle is `unknown` may enter only `unknown`, holds both its `dispatch_lease` and `environment_lease`, and blocks completion until an explicit recorded resolution; a Mission containing an `unknown` Task is itself `unknown`, never `failed`. An LLM may propose a transition as a command but can never author a terminal outcome (L35)."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-12 at the QMA sitting (SRC-13); the JobHandle->Task mapping is fixed in AD-17 and the L35 propose-not-author discipline is inherited. Absorbed under DEC-0329 on SRC-15's order; spine FINAL, validation closed dry 2026-08-29."
    sources: [EXT-2322, EXT-2323]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-12, task-graph, mission, mission-compiler, state-vocabulary]

  - id: DEC-0312
    title: "Graph Template, Loop, Skill and the Task Graph name split (AD-13)"
    statement: "Three primitives stand. SKILL = reusable procedure and knowledge with progressive disclosure. LOOP = an executable control cycle whose `stopping_condition`, `budget` and `escalation` are runtime-owned; v1 loops are authored in-house in the Loop Registry, no self-invented loops, and a candidate loop reaches the registry only through AD-22. GRAPH = topology and dependencies across actors, above Loop. Name split: the authored, plugin-contributed, versioned artifact is a GRAPH TEMPLATE holding no runtime state; the daemon's TASK GRAPH is the only place work state lives; the two are never interchanged. Skill != Loop, and a Skill may invoke a Loop. A Loop is invoked as a node kind inside a Graph Template and its three runtime-owned fields attach there. Compilation law: instantiating a Graph Template emits a Task Graph of NODES; the only node kinds that emit Tasks are `task`, `agent` and `loop`; `conditional`, `parallel_branch`, `join`, `approval_gate`, `human_gate`, `deterministic_script` and `artifact_dependency` instantiate as daemon-evaluated Task Graph nodes carrying node state, hold neither a `dispatch_lease` nor an `environment_lease`, carry no ledger and never emit a Task. The full node-kind vocabulary is `task`, `conditional`, `parallel_branch`, `join`, `approval_gate`, `human_gate`, `deterministic_script`, `loop`, `agent` and `artifact_dependency`. There is no `loop` contribution point (AD-1); loops reach the registry only through AD-22. Back-edges in a template are invalid and rejected at registration; a template is never mutated by a run. ITERATION LAW: a `loop` node emits exactly one Task per iteration minted at iteration time by the daemon; iteration count, `stopping_condition` evaluation, `budget` and `escalation` are Task Graph NODE state and never Task fields; Task ids are deterministic from task-graph id, node id, iteration and `retry_index` (the number of prior Tasks in this node's `attempt_of` chain), never AD-9's `attempt_no` (which counts reassignments inside one Task and never changes a Task id). A `task` node emits one Task the dispatcher assigns; an `agent` node emits one Task pinned at compile time to the `worker_template` (AD-22) its template names, which the dispatcher may not substitute. A retry after terminal failure mints a NEW Task carrying `attempt_of`; re-dispatch of a still-open Task is a reassignment (a change of `dispatch_lease` holder, AD-9), not a retry. An `approval_gate` raises its `approval_request` through AD-10's `ask` and is subject to `ask_timeout` / `on_timeout` so it can resolve without an answer; a `human_gate` raises the same `approval_request` but never times out — it blocks its node until an `operator` principal (AD-24) answers, and a candidate flagged `money_path_relevant` (AD-14) may pass only a `human_gate`. Templates validate against a stable graph API; a graph plugin never owns the scheduler and never holds node state. v1 ships NO `graph_template` in `qma-daemon`; every named cycle — Act-Observe-Verify and Hypothesis-Test-Learn-Mutate-Gate included — arrives as a plugin-contributed `graph_template` addressed `<plugin_id>:<local_id>`. No graph-engine candidate was studied in this run; the implementation choice is carried by a Deferred row."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-13 at the QMA sitting (SRC-13); graphs, not loops, are the organizing centre (operator, T-4954), against the deleted transcript's eleven-entry loop registry (Cut). Absorbed under DEC-0329 on SRC-15's order; spine FINAL, validation closed dry 2026-08-29."
    sources: [EXT-2324, EXT-2325]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-13, graph-template, task-graph, loop, skill, node-kinds]

  - id: DEC-0313
    title: "Two runtimes, orthogonal session axes, and daemon-resolved handles (AD-14)"
    statement: "One loop-and-state contract with two implementations. The Dialogue Runtime serves every desk. The RLM Runtime v1 is scoped BY DESK to the Analysis desk (`analysis-*`), never by Role — Analyst is the Role, Analysis the desk, and 'the Analyst desk' is never written. The RLM KERNEL is a persistent Python interpreter inside the worker's Docker container reaching the host through a typed `host_request` bridge — a `qma-wire` message family, never a second channel: every host call is a wire command or query issued by the worker under the Task's `scope_path` and `correlation_id`, its verb set closed-and-addable in `qma-wire`, every verb mapping to exactly one daemon-owned primitive and running that primitive's `before_*` hook (AD-10), and a host call with no mapped primitive returns the typed refusal `UnknownHostRequest`; async spawn returns an AD-17 `JobHandle`; depth cap 2. The Analysis interactive notebook surface (Jupyter/Colab-style) is provided in-house on that worker and its RLM kernel, reached as a Tool Registry entry, never outsourced to a hosted notebook service (operator, T-4954). Session axes are orthogonal — execution model `dialogue` or `rlm`, attachment `attached` or `detached`, autonomy `interactive`, `semi` or `autonomous`; there is no separate background-session type. The durable Session record carries the execution-model and autonomy axes only; attachment is client state, never daemon state and never persisted, which is what makes closing a client harmless. Both runtimes share the model proxy, credential broker, tool and capability registry, hooks and policy, ledgers, memory, knowledge, context compiler, compaction, mission and task graph, compute router, agent bus and telemetry. HANDLES are daemon-resolved references whose contents never enter a context window, and handle kinds are a closed-and-addable vocabulary owned by `qma-core` — `BacktestHandle`, `ExperimentHandle`, `TradeLogHandle`, `StrategyHandle`, `KnowledgeHandle`, `MarketDataHandle` — extended only in that registry and never by a plugin. A handle addressing a LIVE or WRITABLE money-path record — an open order, open position, a binding, a Book, a seat, a BMS record, a control action, a kill switch or a venue session — may not be minted at all. `TradeLogHandle` and `MarketDataHandle` address recorded, closed, read-only evidence only. `StrategyHandle` is bounded (L17, L33): it may create only content-addressed candidate artifacts in the parent registry's existing `dev` zone, each carrying a QMA-owned `origin` field; no QMA unit mints or extends a zone value (AD-3); it mutates nothing, every change producing a new content-addressed candidate with a lineage edge to its predecessor. A candidate touching a risk, sizing, exit, protection, binding or priority field is flagged `money_path_relevant` at creation, and the daemon refuses to emit its `approval_request` (AD-20) unless the payload carries a field-level diff of exactly those fields under a named `qma-wire` schema; QMA never mints a value for such a field where the ancestor carries none. Strategy and Bot semantics stay QML- and `qmf-registry`-owned; QMA holds references and candidates only."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-14 at the QMA sitting (SRC-13); RLM throughput, snapshot fidelity and 800-variant cost (T-1364..1404) are carried as a Deferred measurement obligation, and the notebook-in-house ruling is the operator's (T-4954). Absorbed under DEC-0329 on SRC-15's order; spine FINAL, validation closed dry 2026-08-29."
    sources: [EXT-2326, EXT-2327]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-14, rlm-kernel, host_request, session-axes, handle-kinds, money-path]

  - id: DEC-0314
    title: "Model proxy chain ModelClass to Deployment to Credential Broker (AD-15)"
    statement: "The chain is deterministic and never an LLM: a ModelClass request resolves against a Deployment Registry whose credentials resolve through a separate Credential Broker. `ModelClass` has exactly four values — `REASONING_HIGH`, `WORKHORSE_GENERAL`, `CODING_HIGH`, `FAST_CHEAP` — a cost and difficulty tier. Selection is TWO-STAGE and never crosses a class boundary in either direction: stage one the requested `ModelClass` selects the candidate pool (the deployments registered under that class, and only those); stage two the request's `needs` flags (tools, vision, reasoning_effort, parallel_tool_calls) plus `min_context_tokens` are the sole eligibility filter. An empty filtered pool returns the typed refusal `NoEligibleDeployment` naming the class and the unmet constraint. NO SUBSTITUTION: the router never falls back to a deployment outside the requested class, nor to one that fails `min_context_tokens` or any `needs` flag — this is what makes a silent capability downgrade impossible rather than merely discouraged. Within the eligible pool the router load-balances under a routing policy of `failover`, `weighted_round_robin`, `quota_lowest` or `fill_first` and returns `ModelCapabilities` to the Context Compiler. Every Deployment additionally carries an OPTIONAL operator-assigned `model_family` field — unset at registration, never defaulted and never synthesized, independent of `ModelClass` and of the provider account (registered under AD-26); AD-10's ReviewPolicy compares that field and the daemon returns `NoEligibleReviewer` when none qualifies. A plugin-contributed `model_deployment` (AD-1) registers with no `model_family` (assigned only by an `operator`-principal command; a manifest declaring one is refused at load naming the plugin id and the field); a deployment whose family is unassigned is routable but ineligible for every ReviewPolicy comparison. OpenCodex sits behind the Deployment contract and deliberately NOT behind the Credential Broker, as the first implementation for OAuth and subscription-pool providers; QMA-owned credentials resolve THROUGH the Credential Broker (AD-24) from the OS secret store (L34), never from a third-party tool's home-directory files. LOCAL-PROXY CUSTODY: a Deployment whose implementation is a local proxy carries `auth_mode: none` on the QMA side — QMA passes it no credential and no QMA-resolved secret ever crosses into the proxy's process; the proxy's own provider credentials are its own custody outside QMA's namespace, never read, copied, migrated or referenced. LOCAL-PROXY BIND (operator ruling): the daemon permits a proxy Deployment only when it binds loopback (`127.0.0.1` or `::1`) on the daemon's host, verified at registration; any non-loopback or remote proxy is refused with `NonLoopbackProxy`; a loopback proxy accepting unauthenticated connections is permitted only by the AD-26 configurable `proxy.allow_unauthenticated_loopback` (default `true`, `ui-editable`) and refused with `UnauthenticatedProxy` when that variable is `false`; at every startup the daemon records an evidence entry naming each registered proxy Deployment and the value of that setting. MULTI-ACCOUNT POOLING (operator ruling): QMA never pools accounts itself; where pooling exists it happens inside the operator's own proxy under the operator's account terms, QMA registers each proxy target as one logical Deployment and records the true deployment honestly on every routing decision (AD-23). The harness picks the class; an agent never names a vendor."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-15 at the QMA sitting (SRC-13); `model_family` made OPTIONAL is the 2026-08-29 validation fix (memlog, AD-15/AD-10), and the loopback-bind and no-pooling clauses are operator rulings recorded in the memlog (both surfaced in the cheap-veto register). Absorbed under DEC-0329 on SRC-15's order; spine FINAL, validation closed dry 2026-08-29."
    sources: [EXT-2328, EXT-2329]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-15, model-proxy, modelclass, model_family, credential-broker, local-proxy]

  - id: DEC-0315
    title: "Tool Registry, capability ladder, and the tool that does not exist (AD-16)"
    statement: "One Tool Registry spans native, CLI, plugin, MCP-adapter, browser, computer-use and backtest tools, and everything resolves through it — MCP is an ADAPTER inside the registry, configured per desk and role by `tool_adapter` records in the definition store (AD-6). A plugin-contributed `tool_adapter` (AD-1) carries no desk-and-role binding: the binding is written and upgraded only by an `operator`-principal wire command, and a manifest declaring one is refused at load naming the plugin id and the field (the same split AD-15 applies to `model_family`). Every entry carries a `check_fn` availability preflight so a tool that cannot run is excluded before its schema reaches the model. Toolsets are named, versioned definition-store records listing fully-qualified tool ids only (`<plugin_id>:<local_id>`), contributable by a plugin and editable through AD-22. A Role grants a toolset, a Mission narrows it and never widens it, a Subagent inherits no more than its parent and is blocked from delegation and memory-write tools at the leaf. The capability ladder has six rungs and the lowest capable one wins (P-10): API or structured tool, CLI, containerized program, browser automation, visual browser or computer-use, persistent remote desktop. Trading-desk tools are read-only market data, read-only portfolio and positions, and risk calculation with no sizing authority. THERE IS NO EXECUTION TOOL AT ANY ACCOUNT ROLE, PAPER INCLUDED, and the prohibition is an enumerated ACT-LEVEL DENY-LIST, not a permission policy. The prohibited acts are: submit, amend, cancel or replace an order; open, close, reduce or hedge a position; set or amend protection; size, re-size or mint a sizing decision; create, amend, activate, stand down or delete a bot-to-book binding; set a Book mode, a seat state, a Book or BMS parameter, a priority rank or a capital floor; arm, disarm or change a kill switch or a node control action; transition any registry artifact between zones. `register_tool` refuses at registration with the typed refusal `ProhibitedMoneyPathTool` naming the plugin id, the tool id and the matched act, and that refusal is a STARTUP error, never a runtime deny. The check is a deny-list declared in `qma-core` beside the ladder, applied to every entry regardless of kind and evaluated BEFORE `check_fn`; an MCP server advertising a prohibited tool is refused WHOLE, not partially bound. No `check_fn`, permission policy, Role, Mission, hook, toolset or `tool_adapter` change can lift the refusal — the deny-list is code, not configuration (L36; paper validation is an account role on a real venue). The prohibition binds the ACT, not the tool name — AD-28 closes the reachability half. The only QMA write path toward the money path is a candidate artifact a human promotes (AD-25). The EFFECTIVE CAPABILITY SET is computed once by the daemon at Agent spawn as an ordered NARROWING — `role.base` is the ceiling, narrowed in order by `role.overlay`, then Mission, then parent — where every step after `role.base` may only remove and never add: a skill an overlay appends is knowledge, never a capability grant, and AD-22's validator refuses at application any overlay entry naming a tool or toolset outside `role.base`'s grant rather than dropping it silently. The result is recorded verbatim on the Agent record and never recomputed for a running Agent; an overlay binds only Agents spawned after it."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-16 at the QMA sitting (SRC-13); the no-execution-tool deny-list is the enumerated act-level realization of the L36 money-path barrier and the operator's standing ruling that nothing above a bot touches the market. Absorbed under DEC-0329 on SRC-15's order; spine FINAL, validation closed dry 2026-08-29."
    sources: [EXT-2330, EXT-2331]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-16, tool-registry, capability-ladder, money-path, deny-list, effective-capability-set]

  - id: DEC-0316
    title: "Execution environments, compute placement, JobHandle and the QMB door (AD-17)"
    statement: "`ExecutionEnvironment` declares a kind of `local`, `docker`, `remote_container`, `remote_host`, `browser` or `desktop`, with provider ref, image, mounts, environment allowlist, capabilities, a required `network` field of `none` or `allowlist` (AD-28) and a lifecycle of `ephemeral` or `persistent` — the environment is a declared allowlist, never a control channel. Docker-per-worker, ephemeral, is the default; there is no shared dirty filesystem. LEASE LAW: an `ExecutionEnvironment` instance grants at most one `environment_lease` per slot (distinct from AD-9's per-Task `dispatch_lease` and never named bare) unless its declaration sets `max_in_flight` (a registered AD-26 configurable, default 1); the Compute Router queues the rest; the `remote_host` and `desktop` kinds may never exceed 1; an `unknown` job holds its `environment_lease` until an explicit recorded resolution. The agent declares a `ComputeRequirement` (cpu, memory, disk, optional gpu, capabilities, timeout, max memory, isolation) and the Compute Router places it; agents never know the machine or the vendor. A `ComputeRequirement` naming a `kind` no registered environment provides returns the typed refusal `NoEnvironment` naming that kind (AD-25's unprovisioned `desktop` is the v1 case). `JobHandle` carries a job id and a state of `queued`, `running`, `done`, `failed`, `cancelled`, `aborted` or `unknown`, with `submit`, `JobHandle.attach`, `wait`, `JobHandle.reattach`, `wake`, `cancel` and `stream`; `wake` resolves to the owning Quant's mailbox at submit time and stores that owner on the handle. TERMINAL `JobHandle` states are exactly `done`, `failed`, `cancelled` and `aborted`; `queued`, `running` and `unknown` are non-terminal. `cancelled` means terminated by an explicit `cancel`; `aborted` means terminated by the environment or supervisor without a cancel where non-completion is KNOWN (OOM kill, container stop, image or mount failure); an outcome that is not known resolves to `unknown` and never to `aborted`. The mapping onto AD-12's Task states is fixed, total and daemon-applied: `queued`/`running`->`running`, `done`->`done`, `failed`->`failed`, `aborted`->`failed` with the abort reason recorded, `cancelled`->`cancelled`, `unknown`->`unknown`; no other pairing is legal and `aborted` never becomes `cancelled`. UNKNOWN IS MANDATORY: a timeout, a lost supervisor or an unreachable environment resolves to `unknown` and never to `failed`, holding one `max_in_flight` slot until an explicit recorded resolution; no component retries, assumes an outcome or invents terminal state (L35). Deploying a Quant, Mission or Worker to a remote workspace or sandbox is a first-class, UI-driven capability of the wire contract from v1, the vendor deferred. `ExperimentSpec` is content-addressed: a code ref only when code changes, a resolved-config ref for parameter and configuration changes, plus data ref, environment ref, seed, model and harness version, cost assumptions and a lineage DAG — never a git branch per parameter. QMB is the backtesting path, unchanged: agent to QMA backtest tool to the BACKTESTING SERVICE — the `analysis-backtest` plugin's daemon half: one Tool Registry entry plus the single `qmb` door, holding no scheduling authority, no parallelism and no state of its own — to the `qmb` CLI or MCP door to QMB. QMA places exactly one `qmb` job per environment; QMB owns intra-node parallelism, its own run ledger and its artifact contract, and QMA never re-specifies it. The transcript's 'QMX Backtesting Framework' names this same pre-existing product QMB; its compute leg is QMB's own, not QMA's Compute Router."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-17 at the QMA sitting (SRC-13); the mandatory-UNKNOWN discipline is inherited from parent L35, and the single-qmb-door Backtesting Service keeps QMB the sole backtesting engine (no second governor). Absorbed under DEC-0329 on SRC-15's order; spine FINAL, validation closed dry 2026-08-29."
    sources: [EXT-2332, EXT-2333]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-17, execution-environment, jobhandle, environment_lease, experimentspec, qmb-door]

  - id: DEC-0317
    title: "Memory: the MemoryProvider contract now, the engine later (AD-18)"
    statement: "QMA builds no memory engine in-house. `qma-core` owns the MemoryProvider contract: `propose`, `admit`, `recall` (token-budgeted, not result-count), `get`, `list`, `history`, `supersede`, `invalidate`, `expire`, `scopes`; `reflect` is optional and off, because cognition is QMA's. There is NO `promote` operation on this port: a candidate is ADMITTED, never promoted (Conventions). A MemoryCandidate carries provenance, supporting artifacts, `admission_confidence`, scope, proposer, occurrence time and supersession; `validation_state` is one of `proposed`, `validated`, `admitted`, `superseded`, `invalidated`, `expired`, `contradicted`. `admission_confidence` is a scalar the daemon's admission gate computes DETERMINISTICALLY from the candidate's provenance, supporting artifacts, corroboration count and validation history; a proposing agent may never set, suggest or influence it, and a `propose` call carrying the field is refused — it is a gate output, never agent input, otherwise the gate admits on a number the proposer minted about its own output (the failure AD-22 exists to prevent). Hindsight is the first backend behind the port, admitted only after a QMA-owned evaluation on real desk experience; its store dependency — a PostgreSQL-with-pgvector or Oracle 23ai database — arrives isolated inside that provider and never touches the QMA journal. SURFACED CONFLICT, not an override: the inherited no-database-server rule (DEC-0114, DEC-0117, parent AD-19) is read here as binding QMA's OWN evidence and metadata stores — journal, ledgers, artifact store, staging, telemetry — never a third-party provider's internal storage sitting behind a QMA-owned port; an admitted MemoryProvider's server is isolated inside that provider, holds no QMA evidence and is never read or folded by QMA; the narrowing is recorded for the operator and admitting the provider is his decision. Until a provider is admitted, `recall` returns the typed refusal `NoMemoryProvider` (AD-1) and candidates stage in the AD-22 staging store, each wrapped in a RefinementProposal carrying exactly one `memory` edit (staging, not memory). Once a MemoryProvider is bound, admission is the daemon's deterministic admission gate alone: the candidate is written through `before_memory_write` (AD-10), is never a RefinementProposal, and requires no `operator` principal. AD-22's `memory` edit kind governs only candidates staged while no provider is bound. Every memory write passes `before_memory_write`."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-18 at the QMA sitting (SRC-13; the memlog notes the transcript's `promote` verb is retired in favour of `admit`). The `NoMemoryProvider` typed refusal is confirmed in the spine FINAL (a validation-pass touchpoint for the empty-provider path). Absorbed under DEC-0329 on SRC-15's order; spine FINAL, validation closed dry 2026-08-29."
    sources: [EXT-2334, EXT-2335]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-18, memoryprovider, admission_confidence, nomemoryprovider, no-database-server]

  - id: DEC-0318
    title: "Knowledge: a read-only corpus and two different confidences (AD-19)"
    statement: "`qma-core` owns the Knowledge contract with a read-only plain-file library adapter. A KnowledgeSource declares kind, source id and adapter; the plain-file source is read-only and imposes no schema; `snapshot()` returns a CorpusSnapshot whose id is a content-addressed tree digest with per-file digests. QMX adapts to the library and the library is never built around QMX: no write-back, no QMX folders or fields, no hardcoded layout. Provenance carries `source_ref`, `snapshot_ref`, `locator`, an EVIDENCE LABEL (an opaque corpus-authored string QMA stores and surfaces verbatim and never parses, ranks or compares) and an `evidence_confidence` map of EXACTLY SIX entries whose keys are declared once per source by the adapter's manifest field `confidence_dimensions` and are fixed for the life of that `source_id`; the daemon validates each Citation's key set and count and refuses a mismatch with the typed refusal `ProvenanceShapeMismatch`. The six values are stored and surfaced, never averaged, compared across sources or scalarized. NAME-SPLIT LAW: Knowledge carries `evidence_confidence` (six dimensions, corpus-owned); Memory carries `admission_confidence` (one QMA-owned scalar); neither is ever derived from the other, and a memory candidate citing knowledge stores the Citation plus the six dimensions verbatim. REPRODUCIBILITY is guaranteed over bytes QMA retains, never over someone else's filesystem: on `cite` the daemon copies the cited bytes into the artifact store as a content-addressed evidence copy, registered through `before_artifact_register` (AD-10) with `authored_by` set to the citing Agent, and Citations resolve against that copy; a retrieval against a snapshot QMA never copied returns the typed refusal `StaleSnapshot` and never silently returns current bytes. A Mission pins one `snapshot_ref` at start and re-pinning is a recorded act; snapshots of one source form a linear supersedes chain. The query surface `search`, `retrieve`, `cite` is a desk-agnostic Tool Registry entry available to every Role granted retrieval; `search` is literal and locator-based over the CorpusSnapshot — grep-class semantics, no ranking and no embedding — and v1 ships NO index, any ranked or semantic retrieval unavailable until the deferred indexing row is decided. RLM is an additional programmatic path on the Analysis desk, never the only retrieval path. Agent experience never becomes Knowledge silently: a QMA report re-enters only as a distinct source kind with its own snapshot. The source corpus — the operator's STRATS plain-file library — is empty today and its folder layout, serialization and stable-id scheme are unratified upstream; indexing waits for both."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-19 at the QMA sitting (SRC-13); the two-confidences name split and the read-only, adapt-to-the-library posture derive from `research/knowledge-corpus-boundary.md` and the STRATS ground-state check of 2026-08-28. Absorbed under DEC-0329 on SRC-15's order; spine FINAL, validation closed dry 2026-08-29."
    sources: [EXT-2336, EXT-2337]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-19, knowledgesource, evidence_confidence, provenanceshapemismatch, stalesnapshot, name-split]

  - id: DEC-0319
    title: "Agent Bus: durable, addressed, non-authoritative (AD-20)"
    statement: "Each Quant owns one durable Mailbox living in the daemon's own store — no external relay. An `Envelope` carries msg id, from, to, kind, optional mission and task refs, `correlation_id`, optional `reply_to_ref` and `causation_id`, body, artifact refs, priority and creation time. `causation_id` is the `id` of the single record that caused this one — per-record, never copied verbatim down a chain the way `correlation_id` is, and (like `correlation_id`) excluded from `fp1` identity by explicit versioned declaration. `MessageKind` is one of `handoff`, `reply`, `notify`, `review_request`, `status`, `question`, `approval_request`; `approval_request` is the single human-approval channel AD-10 defines and every gate in this spine raises. `DeliveryState` is one of `delivered`, `queued`, `woke`, `deferred`, `dead_letter`. WAKEPOLICY is a field of the Quant record in the definition store (AD-6, AD-7) — operator-authored, `ui-editable` under AD-26, scope `quant` — carrying wake conditions, quiet hours (a daily interval plus its IANA zone) and max wakes per window; the deterministic scheduler EVALUATES it at delivery time and no model authors, alters or overrides it. Quiet hours suppress WAKES ONLY: a message arriving inside them is still delivered and still acked, its `DeliveryState` is `deferred`, and the wake fires at the next end of quiet hours; quiet hours never suppress a Routine firing (AD-29), never pause an in-flight run and never delay an `approval_request` reply. Delivery is at-least-once with idempotent msg-id dedup, a per-actor ack cursor and bounded retention — the bus is not institutional memory. RETENTION BOUNDARY: the Mailbox is a projection over journal `message.*` events, and this bounded retention governs the delivery projection only (queue depth, ack cursor, redelivery window) and never deletes a journal record; no journal record is ever trimmed (AD-8, AD-23). NON-AUTHORITATIVE INVARIANT: a message may request work but can never BE the work; a handoff becomes real only when it writes a Task; a reviewer's authoritative act is the task update and the message is only the ping. Every send passes `before_message_send`. External agent-to-agent transport is a later adapter behind the same `ActorId` contract; no relay or signing protocol is adopted."
    status: ratified
    rationale: "Adopted 2026-08-28 as AD-20 at the QMA sitting (SRC-13); the mailbox-as-journal-projection and non-authoritative invariant keep messages out of the record (AD-8), and an undeliverable Envelope resolving to `dead_letter` pairs with the Deferred lead-mailbox catch-all question (GAP-0071). Absorbed under DEC-0329 on SRC-15's order; spine FINAL, validation closed dry 2026-08-29."
    sources: [EXT-2338, EXT-2339]
    component: COMP-QMA-DAEMON
    tags: [architecture-spine, qma, ad-20, agent-bus, mailbox, envelope, wakepolicy, non-authoritative]

  - id: DEC-0320
    title: "Plugin model: reversible code scopes, declared-reversible data (AD-21)"
    statement: "AD-21 governs every plugin and the load flow. A PluginManifest declares id, version, supported qma_api range, desk, dependencies, provided contributions, permissions, entrypoint, migrations and rollback mode. Activation registers every contribution through a scoped plugin context honoring AD-1's cardinality; each registration returns a disposer pushed onto a per-plugin async exit stack, and unload closes the scope LIFO so every contribution disappears together. A missing dependency or a second singleton binding is a hard startup error, never a silent pending state. Reload is an explicit command; there is no file watcher and no reactive re-mount. DATA is the half LIFO cannot undo: every migration declares a `down`, or the manifest declares `rollback: forward_only`. Migrations follow parent AD-20's order in full — preflight, backup first, dry-run, migrate, verify, with a documented restore path (AD-27) — inside a daemon-held transaction preceded by a recorded journal checkpoint written as evidence with the correlation_id; the checkpoint is an ADDITION to the backup, never a substitute. The loader refuses a forward-only upgrade unless an `operator` principal (AD-24) confirms it in that session; a forward-only plugin may be disabled (scope disposed, data intact) but never rolled back; the rollback mode is returned by the install command's preflight query over qma-wire and the operator's confirmation is recorded as evidence carrying its correlation_id — the v1 obligation is stated against the wire, not the deferred UI. DAEMON-CORE MIGRATIONS follow this rule verbatim: the journal schema, the three ledger schemas, the task-graph tables, the mailbox and the staging store belong to no plugin, and each declares a `down` or `forward_only`, takes operator confirmation for forward_only, writes a checkpoint and runs AD-27's five-step order. LOAD FLOW: manifest validation, qma_api compatibility, permissions, dependencies, migrations, topological activation, publication of contributions, then clients learn the new contribution points over the wire. LOAD-TIME REFUSAL LAW: every condition the spine calls a hard startup error is a refusal of the LOAD, not of the process — at daemon startup it aborts startup naming the offending unit; on an explicit install, enable or reload command it fails that command with a typed refusal naming the same fields, disposes that plugin's scope LIFO, and leaves the running daemon, every dispatch_lease and environment_lease it holds, and every in-flight Task untouched; no load-time refusal ever terminates a running daemon or discards a pending evidence append (L39). Trust is first-party only in v1 — no trust tiers, no capability solver, no plugin store (the Cut table bars agent-protocol adapters, trust tiers/marketplace and the capability solver: DEC-0360, DEC-0361, DEC-0362). One logical plugin may span daemon, worker, UI and skills or graph templates, and its halves communicate only over the wire contract, never through shared process memory; a daemon plugin never renders. The in-house threading node (operator ruling, T-5071/T-5081, register row 72) must be accommodated by this shape rather than assumed away; its shape is unspecified, so v1 mints no contribution type for it and the manifest's contribution list stays closed-and-addable — the shape and its contribution point stay Deferred (GAP-0077)."
    status: ratified
    rationale: "Absorbs AD-21 as amended by the memlog: daemon-core migrations bound (memlog L89), the load-time refusal law minted (memlog L199), and the threading-node tag split with its Deferred row (memlog L137, L138). Ratified as rider material under the sitting's I-draft-operator-ratifies mode; the spine is FINAL and validation closed dry 2026-08-29."
    sources: [EXT-2340, EXT-2341]
    component: COMP-QMA-DAEMON
    tags: [qma, ad-21, plugin-model, reversibility, migrations, load-time-refusal, threading-node]
  - id: DEC-0321
    title: "Admission gate: nothing agent-produced becomes runtime state by itself (AD-22)"
    statement: "AD-22 discharges P-9 over memory candidates, skills, hooks, graph templates, loops, prompts, roles, toolsets and worker templates. THE PIPELINE: a RefinementProposal (summary, rationale, edits, expected outcome), where an edit is a create, update or delete over a kind of `prompt`, `memory`, `skill`, `toolset`, `worker_template`, `hook`, `graph_template`, `loop` or `role`, with id, content and reference -> deterministic validation (schema, immutable base, optimistic-concurrency conflict check) -> deterministic verification by verifier script, test or backtest replay, NEVER an LLM judging itself -> optional cross-model review under ReviewPolicy -> a staged candidate in the STAGING STORE, never live -> approval -> APPLICATION, with recorded before-and-after snapshots per applied edit for rollback. A proposal is APPLIED, never promoted: promote is reserved for L17's live-zone act (AD-25). APPROVAL PRINCIPALS: no edit kind may name a money-path record, and nothing in this pipeline reaches qmf-registry or a registry zone — AD-2 makes every zone-transition surface uncallable, and the one write AD-2 permits (a content-addressed dev-zone candidate, AD-14) is not a RefinementProposal edit and never enters this pipeline; every approval concerns QMA's own definition store only, and in v1 every application requires an `operator` principal (AD-24), which is why `before_proposal_apply` is where AD-24's operator-principal check runs. There is no policy, machine, scripted or scheduled approval path for any edit kind; adding one is a spine amendment. A candidate flagged `money_path_relevant` (AD-14) never reaches an `approval_request` whose payload lacks that field-level diff — the v1 obligation is stated against the wire. The staging store has exactly one record type, the RefinementProposal: every staged edit of every kind is one, and a MemoryCandidate (AD-18) is never written to it on its own — it enters only wrapped in a RefinementProposal carrying exactly one `memory` edit. A RefinementProposal enters through `before_proposal_stage` and is applied through `before_proposal_apply`; both fire their `after_*` siblings once the effect is durable. ROLE SPLITS: `role.base` is operator-authored and immutable to the pipeline — a definition-store record like every other (AD-6), written only by an `operator`-principal `role.set_base` wire command recording a `role.updated` journal event, never by an agent, a plugin, a hook or any other `machine` principal, and never by this pipeline, whatever a human commits upstream of that command; `role.overlay` is proposal-editable (appended prompt sections, added skills, narrowed toolsets), and the validator rejects any edit whose path resolves into a base. ONLY DEFINITIONS ARE EDIT TARGETS: no runtime-instanced object is an edit kind, so the durable definition of a spawned worker is `worker_template` — a definition-store record carrying role ref, toolset ref, ModelClass, ExecutionEnvironment ref, ComputeRequirement and permission set, contributable by a plugin as an AD-1 multi contribution — and subagent is not an edit kind. MEMORY-ADMISSION SEAM: once a MemoryProvider is bound, admission is the daemon deterministic admission gate alone — the candidate is written through `before_memory_write`, is never a RefinementProposal and requires no operator principal; the AD-22 memory edit kind governs only candidates staged while no provider is bound (AD-18). v1 ships the invariants, the staging store and the data model; the evaluation gates switch on when the Deferred self-improvement row's condition is met (GAP-0074)."
    status: ratified
    rationale: "Absorbs AD-22 as amended: edit-kind vocabulary widened to include toolset (memlog L232, L200), staging store single record type (memlog L155, L200), approval operator-only (memlog L90, L148, L200), the memory-admission seam once a provider is bound (memlog L250), and the 2026-08-29 role.set_base fix (memlog L289, L292, L296). Ratified as rider material; validation closed dry 2026-08-29."
    sources: [EXT-2342, EXT-2343, EXT-2359]
    component: COMP-QMA-DAEMON
    tags: [qma, ad-22, admission-gate, refinement-proposal, staging-store, role-set-base, worker-template]
  - id: DEC-0322
    title: "Telemetry is a separate system from the ledgers (AD-23)"
    statement: "AD-23 keeps logs, traces, metrics, trajectories and session replay off the ledger (P-12). Logs, traces, metrics and trajectories are harness-authored, never agent-authored, and live in a separate store with separate contracts from the ledgers. QMA owns its own trace and metric record types; OpenTelemetry conformance happens at the EXPORT PORT as a swappable adapter, never as an SDK imported into the daemon core; records carry the inherited correlation_id and the wire id. Routing decisions and usage, compute job and log streams, tool-call traces and agent trajectories are telemetry, not evidence; a ledger entry may carry a `trace_ref`, never the reverse. Telemetry travelling from a remote worker rides the same durable outbox as evidence (AD-6), and under back-pressure telemetry is dropped BEFORE evidence, never the reverse. A telemetry append emits NO journal announcement — the telemetry store is the one declared store the announcement law exempts — so a telemetry record carries occurred_at and recorded_at, no journal_seq, and is ordered by recorded_at and its correlation_id alone. RETENTION EXEMPTION: the AD-6 event journal is evidence and is kept forever (AD-8) — no policy, cadence or job trims it, ever, and it mints no trim threshold. Agent trajectories, which session replay reads alongside it, are retention-exempt and may not be trimmed by any policy until the deferred rows that revisit on them — external memory backend (GAP-0072), self-improvement evaluation gates (GAP-0074) and RLM beyond the Analysis desk (GAP-0080) — have been evaluated and recorded. TRIM MECHANISM: only the two bounded non-evidence streams — the mailbox delivery projection (AD-20) and the telemetry store — may be trimmed by a daemon job, and only inside their registered AD-26 retention windows, each trim recorded with its window, its reason and its correlation_id (a daemon-internal lifecycle act under AD-5's third correlation_id origin). A trim of the mailbox delivery projection may never remove an unacked `Envelope` or an unanswered `approval_request` — the daemon-held operator approval queue (AD-6) included: the registered window applies only to entries already acked, answered or `dead_letter`, which is what keeps an AD-13 human_gate (which never times out) from being deleted. Outside those registered windows the SAME two bounded streams — and no others — may be trimmed only as a recorded, reason-carrying `operator`-principal action (AD-24), never a background job. No other store may be trimmed by any path: the event journal, the three ledger stores, the artifact store, the staging store, the ledger quarantine stream and the retention-exempt trajectory and replay streams are trimmed by neither path (AD-8 keep-forever, L18). The trim window for the two bounded non-evidence streams is Deferred (GAP-0089)."
    status: ratified
    rationale: "Absorbs AD-23 as amended: retention split (memlog L142, L91), the two-bounded-stream trim mechanism (memlog L201, L211), the trim-never-opens-a-human-gate guard (memlog L254), and the telemetry-store announcement exemption with no journal_seq (memlog L265, L290). Ratified as rider material; validation closed dry 2026-08-29."
    sources: [EXT-2344, EXT-2345]
    component: COMP-QMA-DAEMON
    tags: [qma, ad-23, telemetry, otel-export-port, retention-trim, keep-forever]
  - id: DEC-0323
    title: "Permissions, principal classes and secret custody (AD-24)"
    statement: "AD-24 puts enforcement in one place over roles, missions, plugins and the credential broker. PERMISSIONS: a per-Role permission policy is part of the Role contract; a Mission narrows and never widens it; a Subagent is never wider than its parent; plugin permissions are checked at load. Hooks are the single enforcement point in the agent path — before_tool, before_task_complete, review_required, before_ledger_append, before_memory_write — under AD-10's total precedence, and a deny binds under any permissive mode. PRINCIPAL CLASSES: every authenticated wire connection carries exactly one class, `operator` or `machine`. The `operator` class comes only from an interactive human credential presented by a client a human is driving; workers, plugin worker halves, remote deployments, the scheduler, routines and cron, and every daemon-internal caller are `machine`, and no machine principal may acquire, delegate, borrow, cache or impersonate the operator class; the class is recorded verbatim on every command, journal entry and ledger entry. HUMAN-GATE COMMANDS (accepted only from an `operator` principal, refused from a `machine` principal with the typed refusal `OperatorPrincipalRequired`; the list is closed-and-addable and is the SOLE authority on which commands require that principal, extended only by a spine amendment): AD-22's admission approval; AD-21's forward-only migration confirmation; AD-17's UNKNOWN resolution; every retention trim other than the two AD-23 daemon-job trims (the mailbox delivery projection and the telemetry store, inside their registered AD-26 retention windows); plugin install, enable or reload (AD-21); `desk.create` and `quant.create` (AD-7); a `role.base` write via `role.set_base` (AD-16, AD-22); `model_family` assignment (AD-15); `tool_adapter` writes (AD-16); a restore of the live store (AD-27); a Routine catch-up (AD-29); reading or answering an `approval_request` in the daemon-held operator approval queue (AD-6, AD-10, AD-12); a `desk.moved` membership change (AD-7); a Quant record write, its `WakePolicy` included (AD-7, AD-20); a Routine record write (AD-29); an `ExecutionEnvironment` declaration write (AD-17, AD-26); a Mission `approval_route` write (AD-12, AD-26); a `variable.set` on a `registry`-homed AD-26 variable (AD-26); and an AD-13 `human_gate` answer (a `money_path_relevant` candidate may pass only that node). A plugin's own contributions are deliberately NOT on the list: they reach the definition store through activation as a `machine` principal (AD-1, AD-21), so only their operator-assigned fields — `model_family` (AD-15) and the `tool_adapter` desk-and-role binding (AD-16) — appear. QMA mints no registry-promotion or zone-transition command at all — AD-2 makes every qmf-registry zone-transition surface uncallable and AD-16 puts zone transition on the tool deny-list — so L17's promotion is performed outside QMA and QMA records only the resulting artifact ref; there is no headless, scripted, scheduled or agent-initiated path to any human-gate command, which is the mechanism L17's human gate otherwise lacks. SECRET CUSTODY: secrets follow L34 — components handle references, never values. The Credential Broker resolves references from an OS secret store behind a backend interface; Windows Credential Manager is the first and only v1 backend (L34) and a second is admitted when the host OS changes. The broker's scope is a code-declared allowlist shipped in qma-core — model and inference providers, compute and sandbox providers, corpus and knowledge sources, telemetry sinks; venue, broker, exchange, trading-node and platform-registry credentials are outside QMA's namespace and resolvable by no QMA component under any Role, Mission, plugin or permission mode, and a reference not on the allowlist returns the typed refusal `CredentialOutOfScope` naming the reference. The allowlist is source code — never settings, never a plugin contribution, never a UI-editable variable, never widened by a Mission — and the broker holds no ambient authority: exact-reference resolution only, never enumerate, search, list or glob. EGRESS RULE: a resolved secret value exists only inside the model-proxy or provider-adapter egress call frame and is never stored on, attached to or reachable from any object handed to a hook, plugin or graph; broker resolution is callable only from the adapter layer; the hook and plugin context type exposes credential reference strings exclusively; a hook needing an authenticated call makes it through a registered tool; secrets are excluded from `updated_input`, `updated_output` and `injected_context` by a schema check; a local-proxy Deployment is the outward half — `auth_mode: none`, no QMA-resolved value crosses into its process, its own provider credentials in its own custody outside QMA's namespace (AD-15). TRANSPORT CUSTODY: the daemon authenticates before protocol bytes and never offers an unauthenticated bind; the client credential is itself a broker-resolved reference; AD-5's transport posture is the matching half — loopback by default, TLS plus an explicit recorded operator configuration for any non-loopback bind, a hard startup refusal otherwise. Plaintext credential files as a source for any QMA-resolved secret are Cut (DEC-0371); a foreign-harness shim in the model proxy is Cut (DEC-0370)."
    status: ratified
    rationale: "Absorbs AD-24 as amended: principal classes minted (memlog L92), credential broker scoped with the OS backend interface (memlog L93, L94), the human-gate list completed across rounds (memlog L230, L272, L282, L213, L293) and the 2026-08-29 role.set_base gate addition (memlog L293). L34, L17 and L36 inherited. Ratified as rider material; validation closed dry 2026-08-29."
    sources: [EXT-2346, EXT-2347, EXT-2355]
    component: COMP-QMA-DAEMON
    tags: [qma, ad-24, principal-classes, human-gate-list, credential-broker, egress-rule, secret-custody]
  - id: DEC-0324
    title: "Deployment envelope and the live boundary (AD-25)"
    statement: "AD-25 fixes hosts, zones and the money path. The daemon runs on the operator's workstation by default; workers run in Docker on that host; a Quant, Mission or Worker may be deployed to a remote workspace, the research node or a sandbox through AD-17's contract. A single Windows VPS is the registered persistent provider for the single computer-use agent; the operator has said he can purchase one (T-4954) and it is PLANNED, NOT PROVISIONED — the computer-use provider is registered only when provisioned: until an `ExecutionEnvironment` of kind `desktop` is registered, every computer-use tool fails its `check_fn` and is excluded before its schema reaches the model (AD-16), and the Compute Router returns the typed refusal `NoEnvironment` for a `desktop` `ComputeRequirement` (AD-17) (Deferred GAP-0070). The trading-node VPS is untouched by QMA: no agent workload runs there. Overnight autonomy means either the workstation stays on or the mission is deployed to a workspace; mailboxes and the journal live in the daemon's store wherever it runs. QMA's access to the dev and paper zones is READ-ONLY, with exactly one exception: content-addressed candidate artifacts in the dev zone (AD-14). Paper is an account role on a REAL venue, never a sandbox: QMA may read paper market data, paper positions and paper account state and may change none of it, and no QMA rule, tool, environment, permission or test treats a paper account as a place where an act is safe because it is not live; a QMA component needing a writable trading surface uses recorded evidence and QMB replay, never an account of any role. Only a human may PROMOTE a registered artifact into the live zone (L17), and that act is performed OUTSIDE QMA: QMA mints no promotion or zone-transition command at all (AD-24) and records only the resulting artifact ref. Promotion is the only act this spine calls promotion: memory candidates are admitted (AD-18) and refinement proposals applied (AD-22). The authority order bot -> book -> BMS -> operator (L36) and the exit-preservation invariant (L39) belong to the node, and nothing in QMA may invert, shortcut or automate them; QMA's output into the money path is a candidate artifact a human promotes — never a binding, a sizing decision or an order; risk, sizing and live-trading authority remain with the GitBook and trading-node corpus, and QMA never mints them. A Trading-desk execution tool, 'paper only' included, is Cut (DEC-0375)."
    status: ratified
    rationale: "Absorbs AD-25 as amended: dev/paper read-only with the single dev-zone candidate exception (memlog L95), the live boundary with promotion performed outside QMA (memlog L202, L148, L177), and the Windows VPS resolved as planned-not-provisioned from T-4954 (memlog L202). L17, L36, L39 and the operator standing ruling 2026-08-20 inherited. Ratified as rider material; validation closed dry 2026-08-29."
    sources: [EXT-2348, EXT-2355]
    component: COMP-QMA-DAEMON
    tags: [qma, ad-25, deployment-envelope, live-boundary, paper-is-real, windows-vps, money-path]
  - id: DEC-0325
    title: "Configurable-variable registry (AD-26)"
    statement: "AD-26 binds L38 (DEC-0157) to QMA: every number any QMA subsystem mints is a registered variable in a machine-readable registry shipped in v1. Every registered variable declares name, owning subsystem, SCOPE (one of the closed vocabulary global, desk, role, quant, mission, plugin, execution_environment or routine), type, units, default, and `ui-editable` or `uneditable`. A variable marked `uneditable` is a recorded constant, not a configurable: configurable always means editable in the platform UI (L38); every recorded number attached to a configurable variable is evidence, never a ratified constant. THE WRITE PATH IS SINGLE PER VARIABLE and the row declares it: every registered variable declares a `home` of either `registry` or a named owning record type. A `registry`-homed value is set only by an `operator`-principal wire command (AD-24) recording a `variable.set` journal event; a `variable.set` naming an `uneditable` variable, or naming a record-homed variable, is refused. A RECORD-HOMED value is set only by that record's own operator-principal write command (AD-24), recording that record's own noun.verb journal event; the registry row carries its name, scope, type, units, default and editability and never its value. There is no `variable` edit kind in AD-22 and none is minted: an agent may never propose, stage or apply a variable change, and no hook, Role or Mission may set one; a plugin may carry a record-homed default inside a contribution the loader validates, and may set no registry-homed value. THE FULL VARIABLE SET the spine mints (name | scope | editability | home). RECORD-HOMED: `max_in_flight` | execution_environment | ui-editable, default 1, pinned to 1 and `uneditable` for the `remote_host` and `desktop` kinds | ExecutionEnvironment declaration (AD-17). `ask_timeout` (job-spec name `mission.ask_timeout`) | mission | ui-editable | Mission `approval_route` (AD-10, AD-12). `on_timeout` (values deny|escalate) | mission | ui-editable | Mission `approval_route`. `quant.quiet_hours` (a daily interval plus its IANA zone) | quant | ui-editable | Quant record `WakePolicy` (AD-20). `quant.max_wakes_per_window` | quant | ui-editable | Quant record `WakePolicy`. `routine.max_concurrent` (the Routine's max-concurrent cap) | routine | ui-editable | Routine record (AD-29), moved by the operator-principal Routine record write. `model_family` per-Deployment assignment | scope declared-per-subsystem (AD-26 pins no scope for it; `deployment` is not a member of the closed scope vocabulary) | optional, operator-assigned, a plugin-contributed model_deployment registers with none | Deployment record (AD-15). REGISTRY-HOMED (set by operator-principal `variable.set`): `continuation.max_consecutive` (AD-29) ui-editable; `continuation.budget` (AD-29 continuation budget ceiling) ui-editable; `continuation.escalation_target` (AD-29, the Agent's Quant mailbox) ui-editable; `rlm.depth_cap` (AD-14, the depth-2 cap) ui-editable; `rlm.fanout_cost_ceiling_usd` (AD-14/AD-26, USD per 800-variant aggregation, scope desk, distinct from `continuation.budget`) ui-editable; `hook.timeout_*` per phase (AD-10, a span from a recorded UTC instant, no zone) ui-editable; `wire.deprecation_minors` (AD-5, default 2) ui-editable; `wire.dedup_window` (AD-5/AD-6 daemon dedup cursor) ui-editable; `wire.remote_outbox_depth` (AD-6) ui-editable; `wire.remote_spool_bytes` (AD-6) ui-editable; `telemetry.retention_window` / telemetry trim thresholds (event-count and on-disk-size, AD-23) ui-editable; `mailbox.delivery_trim_*` (event-count and on-disk-size, AD-20) ui-editable; `store.backup_cadence` (AD-27) ui-editable; `store.sample_restore_test_cadence` (AD-27) ui-editable; `store.full_restore_rehearsal_cadence` (AD-27) ui-editable; `proxy.allow_unauthenticated_loopback` (AD-15, default true) ui-editable; `review_policy.families` (AD-15, the ReviewPolicy family enum) ui-editable; `deployment.model_family` values (AD-15, the closed enum of allowed family values) ui-editable; `deferred.finished_mission_trajectory_count` (default 50, the AD-23/AD-26 self-improvement gate threshold) ui-editable; `deferred.sandbox_refusal_count` (default 3, the AD-25/AD-26 sandbox NoEnvironment refusal count) ui-editable. DISCREPANCIES the registry seat must honor: the event journal is NEVER trimmed and mints NO trim threshold (AD-8, AD-23), so the job-spec name `journal.retention_*` has no spine referent and no such variable is registered; the job-spec names `bus.sticky_limit` and `routine.budget_hint` were REMOVED from AD-26 by memlog L132 as unowned (no owning AD, subsystem, units or default) and replaced by `continuation.max_consecutive`, `continuation.budget` and `rlm.depth_cap`, so they are not spine-registered variables. Where AD-26 does not pin a scope for a registry-homed variable, the spine states its editability and home but not its scope, and the registry seat records scope as declared-per-subsystem rather than inventing one."
    status: ratified
    rationale: "Absorbs AD-26 as amended: self-contradiction fixed so uneditable is a recorded constant (memlog L119), scope vocabulary widened to eight values (memlog L215), the variable rows corrected including max_in_flight and the removed journal trim threshold (memlog L203, L243), the single-write-path/home rule (memlog L281, L273), and the RLM cost ceiling registered distinct from continuation budget (memlog L252). The job-spec (SRC-15 para 15) names sticky-limit/budget-hint/journal-retention which memlog L132 and AD-26 do not mint — reconciled per authority order, not overridden. L38 inherited. Ratified as rider material; validation closed dry 2026-08-29."
    sources: [EXT-2349, EXT-2350, EXT-2355]
    component: COMP-QMA-DAEMON
    tags: [qma, ad-26, variable-registry, record-homed, registry-homed, variable-set, discrepancy]
  - id: DEC-0326
    title: "Daemon store lifecycle: versioning, migration, backup, restore (AD-27)"
    statement: "AD-27 owns every durable store the daemon holds; L18 (DEC-0045) and parent AD-20 bind here in full and nothing in the spine weakens either. MIGRATION ORDER: journal, SQLite, ledger, task-graph, mailbox, staging and artifact-store migrations follow parent AD-20's five steps verbatim — preflight -> backup first -> dry-run -> migrate -> verify — with a documented restore path, and never an in-place mutation of the only copy; AD-21's recorded journal checkpoint is an ADDITION to the backup, never a substitute (a marker inside the thing being migrated is not a copy of it). STORE VERSIONING: the journal and the SQLite store each stamp a `store_schema_version`; the daemon REFUSES TO OPEN AN UNKNOWN VERSION and returns a typed refusal naming the store and both versions, never reads a newer store optimistically and never silently upgrades one. BACKUP AND RESTORE: QMA discharges the execution half parent AD-20 assigns to the application, under the parent's already-ratified backup design — nightly, encrypted, versioned, OFF-MACHINE copies. Contents are the SEVEN daemon-owned durable stores — the event journal, the three ledger stores, the artifact store, the staging store and the telemetry store, whose retention-exempt agent-trajectory and session-replay records (AD-23) are backed up WITH the telemetry store (exempt from trimming, never exempt from backup). The eighth durable store of AD-6's list — an admitted MemoryProvider's own store (AD-18) — is provider-owned and outside this obligation. An automated SAMPLE-RESTORE TEST and the parent's periodic FULL-RESTORE REHEARSAL each run on their own registered cadence (AD-26), each restoring into an isolated scratch location that is never the live store, and each recording its verified result as evidence; only the two cadence values are deferred, never either obligation. A RESTORE OF THE LIVE STORE is a recorded `operator`-principal act (AD-24) with a documented path, never a background job. The parent's encryption-key-custody deferral is carried forward verbatim: keys are custodied as the parent ratifies and QMA mints no key policy of its own. The backup destination, the encryption-key custody, and the sample-restore-test and full-restore-rehearsal cadences are Deferred (GAP-0088), revisited before the daemon's first non-test run opens a durable store. The ledger stores backed up here carry AD-9's daemon-authored `reassigned` and `unknown_tail` entries (authored_by: daemon)."
    status: ratified
    rationale: "Absorbs AD-27 as minted at the reviewer gate (memlog L46, L47) and amended: full-restore rehearsal restored beside the sample-restore test (memlog L220), backup contents restated as the seven daemon-owned stores with the MemoryProvider store excluded (memlog L229), and the backup Deferred row made testable (memlog L223). unknown_tail as the second daemon-authored ledger entry noted from the 2026-08-29 close (memlog L296). L18 and parent AD-20 inherited. Ratified as rider material; validation closed dry 2026-08-29."
    sources: [EXT-2351, EXT-2352, EXT-2355, EXT-2359]
    component: COMP-QMA-DAEMON
    tags: [qma, ad-27, store-lifecycle, migration, store-schema-version, backup, restore-rehearsal]
  - id: DEC-0327
    title: "Money-path reachability boundary (AD-28)"
    statement: "AD-28 binds every environment, worker, browser session and computer-use session so no agent reaches the venue with any means, not just no tool named for execution. AD-16's prohibition binds the ACT, not the tool name: no QMA agent, subagent, worker, environment, browser session or computer-use session may reach a venue, broker, exchange, trading-node or platform-registry control surface by any means. NETWORK DECLARATION: `ExecutionEnvironment` carries a required `network` field with exactly two values, `none` and `allowlist` — no open default, no third value — and an environment is refused at registration unless an allowlist enumerates its reachable hosts; venue, broker, exchange and trading-node hosts sit on a code-declared DENY-LIST that no allowlist entry may name, directly or by wildcard. IMAGE AND HOST BOUNDARIES: no QMA worker image may contain, install or import `qmf-venue`, a broker or exchange SDK, or the trading node's client, and image validation refuses one that does; the `remote_host` and `desktop` kinds may not name the trading-node VPS or any host carrying a trading credential or a running node, refused BY HOST IDENTITY rather than by policy. THE COMPUTER-USE AGENT: the single computer-use agent runs on a profile whose browser carries no venue or broker session, cookie or saved credential, whose reachable-host allowlist is enumerated, and which may not be handed a venue login by any means — including one an agent reads out of Knowledge, Memory, a ledger or a tool result. Every violation of this AD is a REFUSAL AT PLACEMENT OR REGISTRATION, never a hook deny at runtime. Together with AD-16's act-level deny-list this is the money-path reachability barrier: nothing above a bot touches the market (L36)."
    status: ratified
    rationale: "Absorbs AD-28 as minted at the reviewer gate (memlog L46, L96): the act-vs-tool-name distinction, the two-valued network field with the code-declared deny-list, image validation, host-identity refusal for remote_host/desktop, and the computer-use browser-profile rule, every violation a placement/registration refusal. L36, L39 and the operator standing ruling 2026-08-20 inherited. Ratified as rider material; validation closed dry 2026-08-29."
    sources: [EXT-2353, EXT-2355]
    component: COMP-QMA-DAEMON
    tags: [qma, ad-28, money-path-barrier, network-field, deny-list, image-validation, computer-use]
  - id: DEC-0328
    title: "Routines, scheduled triggers and continuation (AD-29)"
    statement: "AD-29 gives unattended operation — the operator's first stated requirement — its owning rule so no LLM decides when work fires and no agent invents work after its budget runs out. Unattended operation is a v1 obligation, not an emergent property: the parent spine pushed cron scheduling to this layer by name and constitution L8 pushes scheduled lifecycles out of QMF. A ROUTINE is a durable, Quant-owned scheduled trigger carrying an id, the owning `ActorId`, a cron expression or interval with an explicit IANA zone (AD-6), the Goal it supplies to the Mission Compiler (AD-12) and the fully-qualified `graph_template` id `<plugin_id>:<local_id>` that the Compiler expands (AD-13), an enable flag and a max-concurrent cap; it is declarative daemon state, never agent-authored, and UI-editable under AD-26. FIRING IS DETERMINISTIC AND NEVER AN LLM DECISION: the scheduler mints a fresh correlation_id (AD-5), fires `before_routine_fire` and `after_routine_fire` (AD-10), and instantiates through the Mission Compiler with NO authority an operator command lacks — a routine is a `machine` principal (AD-24) and can answer no human gate; missed fires while the daemon is down are RECORDED, NOT REPLAYED, and catch-up is an explicit operator action (an operator-gated command, AD-24). CONTINUATION: a Task is not complete until AD-10's deterministic verifier passes; `agent_stop` returning `block_stop` returns the Agent to the next ready Task in its Mission's Task Graph rather than ending the run — this is the mechanism by which agents keep working unattended. Max consecutive continuations, the budget ceiling and the escalation target are AD-26 configurables (`continuation.max_consecutive`, `continuation.budget`, `continuation.escalation_target`); an Agent that exhausts its budget escalates to its Quant's mailbox and stops, and never invents work to fill the remainder. An eleven-entry loop registry as the organizing centre is Cut (DEC-0378); graphs, not loops, are the organizing centre (AD-13)."
    status: ratified
    rationale: "Absorbs AD-29 as minted at the reviewer gate (memlog L46, L97) and amended: the Routine record field list fixed to carry the Goal plus the fully-qualified graph_template id the Mission Compiler expands (memlog L218). The continuation configurables are registered under AD-26 (DEC-0325). Ratified as rider material; validation closed dry 2026-08-29."
    sources: [EXT-2354]
    component: COMP-QMA-DAEMON
    tags: [qma, ad-29, routines, scheduler, continuation, block-stop, unattended]

  - id: DEC-0329
    title: "QMA spine AD-1..AD-29 adopted in full; the Cut-outright table is spine law (D21); every Deferred row and every memlog assumption is operator-overridable; validation closed dry 2026-08-29"
    statement: "The QMA architecture spine — architecture-QMA-2026-08-28/ARCHITECTURE-SPINE.md, status FINAL (updated 2026-08-29), AD-1 through AD-29 with its Inherited Invariants, Consistency Conventions, Stack, Structural Seed, Capability->Architecture Map, Deferred (22 rows), Cut-outright (20 rows) and Vocabulary — is ADOPTED IN FULL as the v1 architecture of the QMX agentic system (daemon + QMA SDK + wire contract), a new application-layer consumer beside QMB and QML, on the operator's absorption order SRC-15 (2026-08-29, which outranks the sitting folder where they disagree, constitution L1). The spine was drafted under the sitting's 'I draft, operator ratifies' mode; the reviewer gate grew it from 26 to 29 ADs (AD-27 store lifecycle/backup/restore, AD-28 money-path reachability, AD-29 routines/continuation) and the multi-round validation pass closed verified=true dry=true remaining=0 on 2026-08-29 after six surgical divergence fixes (AD-6 telemetry carries no journal_seq; AD-11 validator also rejects verifier_ref; AD-22 role.base written only by an operator-principal role.set_base command + AD-24 gate; AD-9/AD-8 unknown_tail; AD-8 definition-store single agent write exception; AD-15/AD-10 model_family optional). Per D21 the Cut-outright table and the Deferred table (each with its stated revisit condition) are SPINE LAW: anything on neither table and not in D1..D23 is out of scope for v1, nothing in the Cut table is revived (DEC-0360..0379), and every Deferred row stays deferred with its stated revisit condition (GAP-0070..0091). RATIFICATION POSTURE: every absorbing ledger entry is status: ratified with authority: rider sources (the memlog and spine are rider material like every prior child spine) and every absorbing doc carries status: ratified so lint_docs --strict stays clean; yet every Deferred row and every memlog (assumption) entry — plus the five operator-flagged items (AD-15 account pooling, AD-15 loopback proxy, AD-25 planned Windows VPS, the word plugin, the AD-7 desk-level lead flag) — is OPERATOR-OVERRIDABLE in one line and surfaced in the changelog cheap-veto register (see veto-register.md). Nothing in the docs grants implementation, credential, order, promotion, live-money or destructive authority; that arrives only through the factory pipeline."
    status: ratified
    rationale: "The absorption is ordered by SRC-15 (a direct operator ruling of 2026-08-29) over a spine the sitting finalized and the validation pass closed dry on 2026-08-29; D21 makes the Deferred and Cut tables spine law, and the operator's meta-ruling of 2026-08-28 (decide, tag [ASSUMPTION], present for review — only money, vocabulary and irreversible scope reach him) is exactly why every assumption and every Deferred row is surfaced for a cheap veto rather than withheld. No ruling here authorizes implementation, which still ships only through the factory pipeline."
    sources: [EXT-2360, EXT-2361, EXT-2384, EXT-2391, EXT-2392]
    component: null
    tags: [cross-cutting, architecture-spine, qma, adoption, d21, cheap-veto]

  - id: DEC-0330
    title: "QMA = QuantMind Agents, the SDK only; the system is 'the QMX agentic system' (daemon + SDK + wire); 'Quantum Mind' retired as a dictation error"
    statement: "QMA expands to QuantMind Agents and names the SDK ONLY — never a framework and never the whole system. The system under design is 'the QMX agentic system' = the daemon + the QMA SDK + the daemon-to-UI wire contract, written in prose as 'the QMX agentic system (QMA)' where the shorthand is unambiguous. The Python namespace is qma.* (qma.core, qma.wire, qma.daemon), which the daemon and wire packages share; there is no blanket qmx. prefix anywhere, and QMX stays the platform name. 'Quantum Mind' (and 'Quantum Mind Agents') is a RETIRED name — a dictation error in older notes — and QMA as the name of the whole system is retired with it (operator correction 2026-08-28)."
    status: ratified
    rationale: "Operator ruling 2026-08-28 (memlog L10) then his explicit correction (memlog L20): QMA is the SDK's own name, QuantMind not Quantum Mind, and the abbreviation for the SYSTEM had drifted back and was re-narrowed. A vocabulary call the operator owns."
    sources: [EXT-2362]
    component: null
    tags: [cross-cutting, naming, qma, quantmind-agents, retired-name]

  - id: DEC-0331
    title: "Quant replaces Bot for the persistent named organizational actor; Steward retired; ActorId grammar quant:<desk_slug>/<quant_slug>; Bot stays the platform's trading-strategy instance"
    statement: "The persistent named organizational actor is a QUANT — a Role instantiated with a name, memory scope, missions, routines, preferences, a WakePolicy and a mailbox, plus a Quant Ledger opened only while it carries its desk's lead flag (AD-9). 'Quant' replaces the transcript's 'Bot' and the options-sheet's 'Steward' (both retired for the agentic actor). An Agent is a Quant's running instance and a Subagent is an Agent spawned by an Agent (never wider than its parent, no mailbox). The address grammar is ActorId = quant:<desk_slug>/<quant_slug>, with the five fixed desk_slug values research, trading, dev, analysis, pm; desk membership is a field on the Quant record, never parsed from the slug, and slugs are never reused. 'Bot' is never used for an agentic actor: it stays the platform's trading-strategy instance (L1 bots trade, AD-29/AD-33), and 'quant' is never used as an adjective."
    status: ratified
    rationale: "Operator ruling 2026-08-28 (memlog L24) with the options-sheet reconciliation (memlog L33) and AD-7: the operator needed a name distinct from the platform's Bot and chose the quant vocabulary; the ActorId grammar and the five desk slugs are the mechanical consequence."
    sources: [EXT-2363]
    component: null
    tags: [cross-cutting, naming, quant, actorid, bot-collision]

  - id: DEC-0332
    title: "Fresh start: workroom/agentic-system-planning deleted and NOT an input; the transcript is a seed, not a spec; the system is multi-agent by design"
    statement: "The agentic system is a FRESH START. The workroom/agentic-system-planning folder (a QMA Cordis kernel contract and paper research) was deleted by the operator to the Recycle Bin and is NOT an input; nothing may be salvaged from it, cited from it, or depended on unless the transcript says the same thing (Cut row: salvage from that folder is out). The ChatGPT design transcript is a SEED (brainstorming), not a spec — build on top of it and think, do not transcribe it. The system is MULTI-AGENT BY DESIGN: many agents at once, subagents spawned Claude-style, loops and graphs, and Task Graph coordination — group chat as the primary coordination mechanism is Cut, because parallel workers synchronize through the Task Graph, not chat."
    status: ratified
    rationale: "Operator directions 2026-08-28 (memlog L9 fresh start, L27 meta-ruling seed-not-spec / multi-agent) and the packet-delta cut of the loop re-centring; the Cut-outright table records both the salvage bar and the group-chat bar with their one reasons."
    sources: [EXT-2364, EXT-2386, EXT-2388, EXT-2392]
    component: null
    tags: [cross-cutting, fresh-start, seed-not-spec, multi-agent, scope]

  - id: DEC-0333
    title: "Build priority: daemon, data layer, wire API and DevOps first; a Quant reachable through models over the wire is the first milestone; the UI and its extension SDK are Deferred while the wire contract and the variables registry bind now"
    statement: "The build order (operator 2026-08-28, SRC-15) ships the daemon, the data layer, the wire API and DevOps FIRST, and a Quant reachable through models over the wire is the FIRST MILESTONE. The UI has not been started and is not planned soon, so the UI extension SDK, UI contribution points, UI plugin packaging and the qma-ui-contract package beyond a stub are DEFERRED to a later UI session (revisit once the daemon API is live and stable, GAP-0081). BUT the daemon-to-UI wire contract (AD-5) and the configurable-variables registry (AD-26) are NOT deferred and bind now: the API needs a client, the UI may be live by the time epics are coded, and both sides must bind to a fixed, versioned wire. The wire adopts the packet's 26-noun vocabulary (9 commands, 7 queries, 10 noun.verb events) only alongside AD-5's versioning rule (initialize handshake, semver protocolVersion additive-only within a major, wire.deprecation_minors)."
    status: ratified
    rationale: "Operator constraints 2026-08-28 (memlog L12 backend-first, L13 wire must be fixed and versioned now, L21 UI deferred with revisit condition) and SRC-15's build order; the packet-delta identified the missing wire versioning rule the spine supplies."
    sources: [EXT-2365, EXT-2385, EXT-2387]
    component: null
    tags: [cross-cutting, build-order, first-milestone, ui-deferred, wire-binds-now]

  - id: DEC-0334
    title: "One Python 3.14 asyncio daemon — L31 dispositive; the QMA stack pins"
    statement: "The daemon is ONE Python 3.14 asyncio process built WITH the QMF libraries — L31 dispositive: no second daemon runtime and no QMF contract re-implemented across a language boundary (exact money/time, fingerprints, typed refusals, registry records, correlation_id are imported, never re-derived, L31/DEC-0122); the hybrid escape hatch is language-specific workers and non-Python clients attaching over the wire, and the RLM kernel is a persistent Python interpreter inside the Analysis worker's Docker container supervised over the typed host_request bridge (AD-14), never the daemon process. The QMA stack pins (recorded in docs/architecture/stack.md, values by reference): CPython 3.14 daemon runtime; SQLite 3.50.4 bundled/WAL, below the 3.51.3 multi-writer floor BY DESIGN under AD-6's one-connection sole-writer rule (the floor binds only if sole-writer is relaxed); JSON-RPC 2.0; websockets 17.1; uv 0.12.7; ruff 0.16.5; pyright 1.1.411; pytest 9.1.1; poethepoet 0.48.0; duckdb 1.5.5 (rebuildable fold views only); Docker Engine 29.7.2 (29.6.1 installed, Docker Desktop/WSL2 host); OpenTelemetry Python SDK 1.44.0; OpenCodex 2.34.0 published / 2.31.0 installed; the JSON-Schema validator is [UNPINNED] (build-gate choice, stated not omitted); Hindsight v0.9.2 + pgvector 0.8.6 are DEFERRED (arrive only with the deferred memory provider)."
    status: ratified
    rationale: "Operator ruling 2026-08-28 D3 (memlog L36) with AD-4 and the re-verified Stack table (memlog L99, L134); L31 forbids re-implementing QMF contracts across a language boundary, which is what makes a single Python runtime dispositive rather than a preference."
    sources: [EXT-2366, EXT-2367, EXT-2389]
    component: COMP-QMA-DAEMON
    tags: [daemon, python-3.14, l31, stack, one-runtime]

  - id: DEC-0335
    title: "Contract-hub house style: definitions-only qma-core, runtime-only qma-daemon, contract-only qma-wire; every runtime concern enters through a core-defined port"
    statement: "QMA is a CONTRACT HUB in the same house style as QMF, so QMF and QMA read as one system: qma-core is DEFINITIONS-ONLY and depends only on qmf-core (its refusals are variants of qmf-core's typed base, and no parallel base is minted for anything qmf-core defines, AD-3); qma-daemon is the ONLY process that runs anything and the SOLE WRITER; qma-wire is the only cross-boundary contract package. Every runtime concern enters through a core-defined PORT, and the seven ports are MemoryProvider, ModelDeployment, ExecutionEnvironment, KnowledgeSource, ToolAdapter, ComputeProvider and ContextCompiler, each declaring a cardinality and (for singletons) a scope key at its contribution point (a second singleton binding is a hard startup error naming both plugin ids). Contributions are REVERSIBLE and SCOPED (every registration returns a disposer, AD-21). Plugins are named by desk with prefix tokens research-*, trading-*, dev-*, analysis-*, pm-* (AD-1, AD-2, options-sheet D1)."
    status: ratified
    rationale: "Operator ruling 2026-08-28 D1 (memlog L37) with AD-1/AD-2/AD-3 and the inherited platform conventions (memlog L15); the contract-hub split is the same paradigm the parent QMF spine uses, chosen so the two read as one system and no port has two owners."
    sources: [EXT-2368, EXT-2388, EXT-2389]
    component: COMP-QMA-CORE
    tags: [contract-hub, ports, house-style, reversible, paradigm]

  - id: DEC-0336
    title: "Deployment envelope: workstation-default daemon, Docker workers on host, remote deploy dialing out through AD-17, UI-driven not a QMA command line; the trading-node VPS is untouched"
    statement: "The daemon runs on the operator's WORKSTATION BY DEFAULT ('most or 90% of the time these agents are going to be working on my machine here, like most harnesses'); Docker workers run in that host by default; Quants, Missions and Workers are deployable to remote workspaces through AD-17's contract with remote workers DIALING OUT to the daemon (no inbound port on the deployed side — the daemon's own listener is the single inbound port, non-loopback only under TLS + an explicit recorded operator configuration, with an unauthenticated or plaintext non-loopback bind a hard startup refusal, AD-5). Deployment is driven from the operator's UI/wire commands, never a QMA command line: QMB's qmb CLI stays the platform's single command-line surface (DEC-0185 Ruling C). Mailboxes and the journal live in the daemon store wherever it runs; there is no external relay. The trading-node VPS is untouched (AD-28 barrier). The Windows VPS for the computer-use agent is PLANNED, registered when provisioned (GAP-0070)."
    status: ratified
    rationale: "Operator ruling 2026-08-28 D15 (memlog L38, supersedes the sheet's always-on-host lean) with AD-25/AD-5/AD-17; the daemon is authoritative and local, remote deployment is a first-class UI-driven capability of the contract, and QMB's CLI stays the sole command-line surface (DEC-0185)."
    sources: [EXT-2369]
    component: COMP-QMA-DAEMON
    tags: [deployment, workstation-default, dial-out, no-cli, live-boundary]

  - id: DEC-0337
    title: "Namespace: qma.* for the SDK, daemon and wire; no blanket qmx. prefix anywhere; plugins and ledger views named by desk"
    statement: "The SDK, daemon and wire share the qma.* namespace (qma.core, qma.wire, qma.daemon; packages qma-<name>, imports qma.<name>, PEP 420, no qma/__init__.py). There is NO blanket qmx. prefix anywhere — QMX stays the platform name and is never assumed as a subsystem prefix. Plugins and ledger views are named by DESK with the prefix tokens research-*, trading-*, dev-*, analysis-*, pm-*; the wire and ledger vocabulary is desk/domain-scoped, never blanket-prefixed."
    status: ratified
    rationale: "Operator ruling (transcript T-3968 'I don't like QMX because QMX is assuming the entire platform', register #73; memlog L18 candidate, L20/L26 ratified) with AD-1 and the Conventions Naming row; a naming call the operator owns and stated in his own words."
    sources: [EXT-2370]
    component: null
    tags: [cross-cutting, namespace, no-qmx-prefix, desk-scoped]

  - id: DEC-0338
    title: "Ledgers are task-level: no global ledger and no per-desk/per-profile ledger store; Task Ledger, a lead-Quant Quant Ledger, an Experiment Ledger; desk ledgers are read-time views; Mission reports Deferred"
    statement: "Ledgers are TASK-LEVEL. There is no global ledger and no per-desk/per-profile ledger STORE, and no remote agent appends to a desk-central ledger ('In an architectural sense, that does not make any sense'). The TASK LEDGER is one per Task for its whole life across every Agent, appended only by the Agent holding the Task's dispatch_lease through before_ledger_append and PERSISTED BY THE DAEMON (AD-6, AD-9); every entry carries attempt_no, authored_by and the model deployment; reassignment is a daemon-authored 'reassigned' entry incrementing attempt_no and 'unknown_tail' is the second daemon-authored entry kind (authored_by: daemon, no model). A QUANT LEDGER exists only for the desk's lead Quant (quant_ledger_lease), opened while the Quant carries its desk's lead flag and retained if the flag moves; it records desk-level work (missions opened/closed, delegation, escalation, standing decisions) and never restates another Task's ledger. An EXPERIMENT LEDGER is per experiment, appended by the registering Task's dispatch_lease holder. Research/Trading/Dev/Analysis/PM ledgers are read-time desk VIEWS (indexes by desk, quant, agent, mission, task, experiment, date) over the three stores, never stores. Mission reports (an agent-derived synthesis over a mission's task ledgers) are DEFERRED (GAP-0082, operator not yet certain). The daemon event journal is neither a ledger nor telemetry."
    status: ratified
    rationale: "Operator ledger rulings 2026-08-28 (memlog L22, granularity L25, follow-up L29) with AD-9; the TaskCompleted structured append (packet-delta KEEP) is what makes the task ledger the agent-authored institutional record the operator asked for."
    sources: [EXT-2371, EXT-2385]
    component: COMP-QMA-DAEMON
    tags: [ledgers, task-level, quant-ledger, desk-views, mission-reports-deferred]

  - id: DEC-0339
    title: "Hooks on every primitive: every daemon-owned primitive ships its own before/after hook events; hooks are the single enforcement surface and the control surface, never optional; closed-and-addable registry"
    statement: "Every daemon-owned PRIMITIVE ships its own before/after hook events (task create/complete, ledger append, memory write, skill write, artifact/experiment register, env create/remove, subagent spawn, message send, graph transition, session start/end, mission start/complete, plugin activate/deactivate, routine fire, tool, proposal stage/apply, hook register — twenty-three verbs paired before_<verb>/after_<verb>, plus exactly two phase-less blocking controls agent_stop and review_required). Hooks are the SINGLE ENFORCEMENT surface in the agent path and the control surface, NEVER an optional feature; the registry is CLOSED-AND-ADDABLE and every new daemon-owned primitive ships a before_<verb> gate AND an after_<verb> event (omitting an after_ is a spine amendment, never an author's judgment call). Phase law: before_* and the two controls may return deny/ask/defer/block_stop (allow is the nothing-returned resolution) while after_* returns only observe or (after_tool) updated_output; illegal decision-for-phase or an illegal HookResult field for the phase is refused AT REGISTRATION; hooks fail closed (timeout -> deny) with three carve-outs — before_ledger_append fails OPEN (L39), agent_stop resolves a timeout to observe, and every after_* timeout resolves to observe."
    status: ratified
    rationale: "Operator standing principle 2026-08-28 (memlog L30; his own words, EXT-2453: 'everything we create here, we have to have hooks for it') with the options-sheet D7 amendment (memlog L35) and AD-10/AD-11; hooks are how deterministic guards stop agents from being 'too well agentic', which is why they are the single enforcement surface rather than an optional feature."
    sources: [EXT-2372, EXT-2385]
    component: COMP-QMA-DAEMON
    tags: [hooks, enforcement-surface, every-primitive, phase-law, closed-and-addable]

  - id: DEC-0340
    title: "Three control primitives — Graph Template (authored, versioned, stateless), Loop (a node kind with runtime-owned stopping condition/budget/escalation), Skill (Skill != Loop) — with the Graph Template vs Task Graph name split; graphs, not loops, are the organizing centre; no Mission Template in v1"
    statement: "There are three control primitives: a GRAPH TEMPLATE is authored, plugin-contributed, versioned topology with NO runtime state (instantiating one emits Tasks only); a LOOP is an executable control cycle with a RUNTIME-owned stopping condition, budget and escalation, expressed as a node kind inside a Graph Template (a loop node emits exactly one Task per iteration, minted by the daemon); a SKILL is a reusable procedure/knowledge and Skill != Loop (a Skill may invoke a Loop, and a skill an overlay adds is knowledge, never a capability grant). The GRAPH TEMPLATE vs TASK GRAPH name split is load-bearing: the daemon's Task Graph is the ONLY place work state lives, so a plugin graph never holds node state beside the daemon's task state. GRAPHS, NOT LOOPS, are the organizing centre (the operator's last word, T-4954); loops are in-house and reach the registry only through AD-22; there is no Mission Template registry in v1 (GAP-0084), the Mission Compiler seeds from a Graph Template. Node kinds are closed: task, agent, loop, conditional, parallel_branch, join, approval_gate, human_gate, deterministic_script, artifact_dependency."
    status: ratified
    rationale: "Adopted by the sitting from the ChatGPT design transcript after the operator declined to re-answer D8 and directed it to the transcript (memlog L39), with AD-12/AD-13, the packet-delta cut of the 11-loop re-centring, and T-4954 ('we have to have a few graphs noted down, not loops'); the Graph Template vs Task Graph name split is the drafter's adversary fix, not an operator ruling (cheap-veto V9)."
    sources: [EXT-2373, EXT-2386]
    component: COMP-QMA-DAEMON
    tags: [graph-template, loop, skill, task-graph-split, no-mission-template]

  - id: DEC-0341
    title: "No execution tool at any account role and the money-path reachability barrier"
    statement: "There is NO execution tool at ANY account role, 'paper only' included. The Trading desk is READ-ONLY; 'paper only' is a real-venue account role and NEVER a sandbox — no rule, tool, environment, permission or test treats a paper account as a place where an act is safe because it is not live (AD-25). The act-level DENY-LIST refuses every order/binding/sizing/promotion act at the Tool Registry (order submit/amend/cancel/replace; open/close/reduce/hedge a position; set/amend protection; size/re-size/mint a sizing decision; create/amend/activate/stand-down/delete a bot-to-book binding; set a Book mode/seat state/Book/BMS parameter/priority rank/capital floor; arm/disarm a kill switch or node control action; transition any registry artifact between zones), refused at REGISTRATION with ProhibitedMoneyPathTool before check_fn, an MCP server advertising a prohibited tool refused whole, the deny-list being code not configuration (AD-16). The REACHABILITY BARRIER (AD-28) makes placement and registration refuse any environment or edge that could reach the trading node: every ExecutionEnvironment carries a required network field of none or allowlist (refused without an enumerated allowlist), venue/broker/exchange/trading-node hosts sit on a code-declared deny-list no allowlist may name, no worker image may contain or import qmf-venue or a broker/exchange SDK, remote_host and desktop may not name the trading-node VPS or any host carrying a trading credential, and the computer-use agent's browser profile carries no venue session or saved credential and may not be handed a venue login by any means. Nothing above a bot touches the market (L36)."
    status: ratified
    rationale: "AD-16/AD-25/AD-28 with the Cut row 16 (a Trading-desk execution tool, 'paper only' included) and L36/L39; QMA's money-path output is never an order, and the barrier is a refusal at placement or registration, never a hook deny."
    sources: [EXT-2374, EXT-2390]
    component: COMP-QMA-DAEMON
    tags: [money-path, no-execution-tool, deny-list, reachability-barrier, paper-is-real]

  - id: DEC-0342
    title: "No memory engine in-house: memory enters through the MemoryProvider port with admission-gated candidates and a typed refusal when nothing is bound; Hindsight is the deferred first backend behind an eval"
    statement: "QMA builds NO memory engine in-house. Memory enters through the qma-core MemoryProvider PORT (per-desk singleton) with admission-gated candidates: recall (token-budgeted), propose and admit, MemoryCandidate carrying a proposer ref, provenance, validation_state and the daemon-computed scalar admission_confidence (a proposing agent may never set, suggest or influence it, and a propose call carrying it is refused). Once a provider is bound, admission is the daemon's deterministic admission gate alone (the candidate written through before_memory_write, never a RefinementProposal, requiring no operator principal); with NO provider bound, recall returns the typed refusal NoMemoryProvider (AD-1) and candidates stage under AD-22 wrapped in a RefinementProposal. Hindsight (v0.9.2) is the deferred first backend admitted only behind a QMA-owned eval on real desk experience (GAP-0072; its Postgres+pgvector storage is the provider's isolated dependency, never the QMA journal). The no-database-server rule binds QMA's OWN evidence and metadata stores (journal, ledgers, artifact, staging, telemetry), never a provider's internal storage sitting behind a QMA-owned port."
    status: ratified
    rationale: "Adopted from transcript row 43 (ChatGPT-transcript row 43 adopted by the sitting, memlog L42 — no operator ruling behind it) with AD-18/AD-22 and the Deferred external-memory-backend row; prevents arbitrary agent text becoming trusted memory and memory becoming the ledger, while keeping the no-database-server rule from silently barring a provider's own storage."
    sources: [EXT-2375]
    component: COMP-QMA-DAEMON
    tags: [memory, memoryprovider, admit, no-memory-provider, hindsight-deferred]

  - id: DEC-0343
    title: "Knowledge is a read-only, provenance-carrying corpus behind the KnowledgeSource port; two confidences never conflated; hybrid indexing Deferred"
    statement: "Knowledge is a READ-ONLY, provenance-carrying corpus behind the qma-core KnowledgeSource PORT — the adapter over the STRATS plain-file library ingested unchanged, with CorpusSnapshot (a content-addressed tree digest), Citation (source_ref, snapshot_ref, locator) and Provenance (an opaque corpus-authored evidence label QMA stores and surfaces verbatim and never parses, plus a map of exactly six evidence_confidence dimensions whose keys are declared once per source in the adapter's confidence_dimensions manifest field and fixed for the source's life, a Citation key-set/count mismatch refused with ProvenanceShapeMismatch). Search is LITERAL and LOCATOR-BASED only (grep-class, no ranking, no embedding); on cite the daemon copies the cited bytes into the artifact store through before_artifact_register and Citations resolve against that copy (a retrieval against an uncopied snapshot returns StaleSnapshot). The two confidences are NEVER conflated: evidence_confidence on knowledge (six dims, never scalarized) vs admission_confidence on memory (one scalar), neither derived from the other. Hybrid/semantic indexing is DEFERRED (GAP-0073) until the corpus holds an ingestible file and STRATS layout/serialization/stable-id are ratified upstream."
    status: ratified
    rationale: "Adopted from transcript rows 47-48 (operator doubt resolved by the answer he did not refuse, memlog L43) with AD-19 and the Deferred knowledge-indexing row; the name-split law keeps knowledge from silently becoming memory and keeps QMX fields out of the STRATS library."
    sources: [EXT-2376]
    component: COMP-QMA-DAEMON
    tags: [knowledge, knowledgesource, read-only, evidence-confidence, indexing-deferred]

  - id: DEC-0344
    title: "Model proxy chain ModelClass -> Deployment -> Credential Broker, OpenCodex behind the Deployment contract with auth_mode none + loopback bind, QMA never pools accounts, local-proxy credentials outside QMA's namespace"
    statement: "The model proxy is the deterministic chain ModelClass -> Deployment -> Credential Broker (a load balancer, 'not another LLM deciding where prompts go'). The four ModelClass values are REASONING_HIGH, WORKHORSE_GENERAL, CODING_HIGH, FAST_CHEAP (SCREAMING_SNAKE); the requested class selects the candidate pool and the router never crosses a class boundary (needs{} plus min_context_tokens are the sole further filter; an empty pool returns NoEligibleDeployment naming the class and the unmet constraint). OpenCodex is the FIRST ModelDeployment implementation sitting BEHIND the Deployment contract, NOT behind the Broker. A local-proxy Deployment carries auth_mode none (no QMA secret value ever crosses into the proxy) and must bind LOOPBACK on the daemon host (NonLoopbackProxy otherwise); an unauthenticated loopback proxy is governed by the AD-26 configurable proxy.allow_unauthenticated_loopback (default true, ui-editable, a memlog assumption and operator-overridable, refused with UnauthenticatedProxy when false). QMA NEVER pools accounts: where pooling exists it is the operator's own proxy under his own account terms, QMA registers each proxy target as one logical Deployment and records the true deployment honestly. model_family is OPTIONAL on the Deployment record (assigned only by an operator command; an unassigned family is routable but ineligible for every ReviewPolicy comparison, NoEligibleReviewer). A local proxy's own provider credentials stay outside QMA's namespace, never read, copied, migrated or referenced by QMA; QMA-owned credentials resolve from Windows Credential Manager through the Credential Broker (L34), never ~/.opencodex."
    status: ratified
    rationale: "Adopted from transcript rows 51-56 with sheet lean A (memlog L41) and the validation-pass resolutions of the two assumption tags (memlog L105 local-proxy custody, L194 pooling, loopback default and optional model_family) — resolved from sources under the meta-ruling and surfaced as cheap vetoes V3/V4/V5 with AD-15/AD-24; OpenCodex sits behind the Deployment contract deliberately not the Broker, and the loopback-unauthenticated default is a surfaced assumption the operator can veto."
    sources: [EXT-2377]
    component: COMP-QMA-DAEMON
    tags: [model-proxy, opencodex, modelclass, credential-broker, no-pooling]

  - id: DEC-0345
    title: "'promote' is reserved for the L17 live-zone act performed by a human outside QMA; memory candidates are admitted, RefinementProposals are applied; QMA mints no promotion or zone-transition command"
    statement: "The three closed verbs are one act each, never interchanged. A memory candidate is ADMITTED — MemoryProvider operation admit, validation_state value admitted, scalar admission_confidence (AD-18). A RefinementProposal is APPLIED out of the staging store through before_proposal_apply, where AD-24's operator-principal check runs (AD-22). Only a registered artifact is PROMOTED into the live zone, by a HUMAN and OUTSIDE QMA (L17, AD-24, AD-25): QMA mints NO promotion or zone-transition command at all (AD-2 makes every qmf-registry zone-transition surface uncallable and AD-16 puts zone transition on the tool deny-list), and records only the resulting artifact ref. 'Promote' and 'promotion' never appear for memory or refinement anywhere in the spine or its projections."
    status: ratified
    rationale: "Resolved from sources under the operator's meta-ruling delegation 2026-08-28 (memlog L104, one of the three findings withheld at L102; a vocabulary call the operator owns and can overturn in one line, cheap-veto V7) with the Conventions 'Closed verbs' row and AD-18/AD-22/AD-24/AD-25; vocabulary the operator cares about, reserving one verb from carrying three meanings."
    sources: [EXT-2378]
    component: null
    tags: [cross-cutting, closed-verbs, admit, apply, promote]

  - id: DEC-0346
    title: "Vocabulary adoption and scope reconciliation: 'plugin' and the qualified 'RLM kernel' adopted for QMA prose; the parent ban stays in force for QMF/QMB/node prose"
    statement: "'plugin' (agentic sense) is the transcript's and the operator's own word for a desk extension package (AD-21) and is ADOPTED for QMA prose; 'kernel' appears only in the qualified phrase 'RLM kernel' — the Analysis worker's persistent Python interpreter (AD-14) — never bare, never for qmf-core and never for the Trading Node. The parent's ban STAYS IN FORCE for QMF/QMB/node prose: 'engine' stays banned for backtesting, 'exam' stays banned outright, and 'kernel' is a retired name for qmf-core/the Trading Node ('QMB is a library and a CLI, never an engine or kernel', docs/glossary.md); no constitution law bans 'plugin'. The adoption is recorded [ADOPTED 2026-08-28 - transcript vocabulary; parent ban is QMB-scoped]; QMA's adoption is NEVER presented as lifting the parent ban. The glossary and AGENTS.md carry the scoped note."
    status: ratified
    rationale: "SRC-15 settles memlog L102/L140/L182 (a withheld finding) and the operator meta-ruling closed it from sources (memlog L103, L205): the operator uses the word himself, the parent ban is QMB/QMF/node-scoped in docs/glossary.md, and the adoption is reversible if refused. A vocabulary call the operator owns."
    sources: [EXT-2379]
    component: null
    tags: [cross-cutting, plugin, rlm-kernel, scope-reconciliation, parent-ban]

  - id: DEC-0347
    title: "Dependency direction for QMA: AD-2's diagram is the whole rule (undrawn edge = default-deny); qma-daemon reads-and-calculates qmf-registry and qmf-risk with an enumerated surface; qmf-venue importable by none; plugin halves meet only at qma-wire"
    statement: "AD-2's dependency diagram is the WHOLE rule and an undrawn edge is DEFAULT-DENY. qma-daemon -> qmf-registry and qma-daemon -> qmf-risk are READ-AND-CALCULATE only, the permitted surfaces enumerated default-deny in qma-core; QMA may write only content-addressed dev-zone candidates through qmf-registry (AD-14) and may never construct a binding, Book, BMS, seat, control-action, exit/protection, priority-rank or promotion record, nor call a zone-transition surface. qmf-venue is importable by NO QMA package, worker or plugin. A plugin's daemon-half and worker-half meet ONLY at qma-wire (the daemon-half may depend on qma-wire and qma-core and never on qma-daemon; a non-plugin worker depends on qma-wire alone). L30's 2026-08-21 roster-scope annotation makes these APPLICATION dependencies under L31 (DEC-0171/DEC-0184 precedent), so QMA's read-and-calculate edges stand rather than being removed."
    status: ratified
    rationale: "AD-2 with the constitution L30 annotation and the memlog edge-narrowing (L60) and banned-vocabulary close (L103); L30 read as roster-internal keeps the read-and-calculate edges legal under L31, following the DEC-0171/DEC-0184 precedent, and default-deny makes qmf-venue and every undrawn edge unreachable."
    sources: [EXT-2380, EXT-2389]
    component: COMP-QMA-CORE
    tags: [dependency-direction, default-deny, read-and-calculate, l30, qmf-venue]

  - id: DEC-0348
    title: "Retired names recorded; Backtesting Service is the analysis-backtest plugin's daemon-half adapter, never a second backtesting engine"
    statement: "Retired names recorded (spine Vocabulary table): 'Quantum Mind' (dictation error) -> QuantMind Agents; 'Steward' (options-sheet draft) -> Quant; 'QMX Backtesting Framework' -> QMB; 'QMX Event Ledger' -> the event journal; 'Bot' in the agentic sense -> Quant (Bot stays the platform's trading-strategy instance); 'Context Engine' -> Context Compiler; 'Knowledge Base' -> Knowledge / KnowledgeSource; 'Kanban' -> Task Graph. The BACKTESTING SERVICE is the analysis-backtest plugin's daemon-half adapter that places one qmb job per environment and returns BacktestHandles, owning no scheduler, no parallelism and no run ledger — never a second backtesting engine and never QMA re-specifying QMB (which is owned elsewhere)."
    status: ratified
    rationale: "Spine Vocabulary table (Replaces column) with the Backtesting Service definition (memlog L128); recording the retired names keeps the projections from re-using a name the spine bars from interchange."
    sources: [EXT-2381]
    component: null
    tags: [cross-cutting, retired-names, vocabulary, backtesting-service]

  - id: DEC-0349
    title: "The desk-level lead Quant is a persistent actor keeping a Quant Ledger; one lead flag per desk and the lead's mailbox as catch-all were inferred, never ruled, and are Deferred"
    statement: "The desk-level lead Quant is a PERSISTENT ACTOR that keeps a Quant Ledger (opened while it carries its desk's lead flag and retained if the flag moves; a Quant that has never held the flag has no Quant Ledger) — ratified by reading the operator's follow-up ruling 'task-level ledgers CONFIRMED correct; desk-level quant ledgers OK' against the ledger-granularity item 'a desk-level lead quant keeps its own larger work ledger', plus his hierarchy words (memlog 2026-08-28). But ONE lead flag per desk and the lead's mailbox as the catch-all for undeliverable Envelopes were INFERRED, never ruled, and are DEFERRED (GAP-0071): until the operator rules both, a second lead flag on a desk is a HARD STARTUP ERROR and an undeliverable Envelope resolves to dead_letter (AD-20) rather than to the lead."
    status: ratified
    rationale: "Memlog L28 (open question), L29 (follow-up ruling), L63 (the [ASSUMPTION] tag), L133 (resolution: lead Quant exists) and L183 (narrowing: one-flag and catch-all inferred, moved to Deferred) with AD-7/AD-20; the persistent-actor existence is ratified while the two inferred details carry a cheap veto through GAP-0071."
    sources: [EXT-2382]
    component: COMP-QMA-CORE
    tags: [lead-quant, lead-flag, dead-letter, gap-0071, inferred]

  - id: DEC-0350
    title: "Constitution touchpoints binding QMA (read-only, recorded in traceability)"
    statement: "The constitution laws binding QMA read-only, recorded in traceability, are L17 (human live-zone promotion — AD-24 mechanism, AD-25 act outside QMA), L18 (raw evidence retained locally AND an off-machine backup — AD-27), L30 (roster scope annotation of 2026-08-21 — AD-2 read-and-calculate edges), L31 (built with QMF, no contract re-implemented across a language boundary — AD-4, AD-2), L33, L34 (OS secret store / Windows Credential Manager — AD-24), L35 (ADOPTED — a proposed transition may not write over an UNKNOWN job/task, its stream blocked until resolved, AD-12/AD-17), L36 (nothing above a bot touches the market — AD-16/AD-28), L38 (configurable = UI-editable — AD-26) and L39 (no hook decision blocks the recording of evidence — AD-5, AD-6, AD-9, AD-10, AD-21, AD-25, Conventions); plus the parent conventions rows of the Inherited Invariants table. QMA may not amend a parent by assertion — the only parent-facing records this pass writes are the L30 roster-scope reading re-applied to QMA (annotated at source 2026-08-21, cited not re-annotated), the vocabulary-scope reconciliation note for plugin / 'RLM kernel', and these constitution touchpoints in traceability."
    status: ratified
    rationale: "Spine Inherited Invariants table with the traceability fixes (memlog L274); the constitution binds QMA read-only and every touchpoint names the AD that discharges it, so a builder reading either the invariant or the AD finds the other."
    sources: [EXT-2383]
    component: null
    tags: [cross-cutting, constitution-touchpoints, inherited, read-only, traceability]

