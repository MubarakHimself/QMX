without fresh ratification. TN-18/TN-22: extensibility sentence - adding a Book, BMS, bot or a new version of any is registry + roster config + restart-at-safe-point, never code. TN-20: promotion wording per Q3. The open-questions section becomes 'Operator rulings 2026-08-28'; assumption register A1/A10/A17/A26 marked RULED; A39 added."
