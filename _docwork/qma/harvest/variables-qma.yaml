# variables-qma.yaml — AD-26 configurable-variable registry rows for the QMX agentic system (QMA).
# Seat D9. Source: SRC-13 ARCHITECTURE-SPINE.md#AD-26 and DEC-0325 (the full AD-26 variable set).
# generated 2026-08-29, verified 2026-08-29. Row shape mirrors docs/registry/variables.yaml
# `qmb_governor_cpu_budget`: name, symbol, value, formula, units, type, component, decision,
# configurable, notes. Every AD-26 variable is ui-editable, so configurable: true (DEC-0325);
# a variable's SCOPE (AD-26 closed vocabulary) and its home (registry | named record type) are
# recorded in notes, since the registry row shape carries no scope column. A spine default is the
# value; a registry-homed value with no spine default uses the house declared-per-installation
# descriptor and a record-homed value uses declared-per-<scope>. Appended into
# docs/registry/variables.yaml by fragment registry-variables.yaml (op yaml_append_items).
