[project]
name = "qmf-registry"
version = "0.1.0"
description = "Per-kind records, fingerprint-derived ids, append-only typed lineage edges, and the human-signed promotion skeleton."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "qmf-core",
    "qmf-data",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace submodule. Dot notation tells uv_build the module lives at
# src/qmf/registry/ with NO src/qmf/__init__.py anywhere in the distribution.
module-name = "qmf.registry"

[tool.uv.sources]
qmf-core = { workspace = true }
qmf-data = { workspace = true }
