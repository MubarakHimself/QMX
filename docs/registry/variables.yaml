    notes: "Node re-point (DEC-0256, DEC-0203): configurable bot-scoped, kept separate from the money-ladder divisor seat_loss_run_allowance; value-status-bearing on the node-config artifact; blank or provisional-evidence blocks role=live and is soak-blocking (TN-8/DEC-0193, TN-18/DEC-0203). Leash_grammar variable, keyed per bot or bot family, minted by the B split (DEC-0154, AD-40) and given its bench semantics by DEC-0155 (AD-41): the count of consecutive qualifying_loss_exit closes at which a seat is benched. A qualifying_loss_exit is a virtual-position close whose realized_r <= -q (see qualifying_loss_threshold). Read as a read-time fold over the exit-record stream bounded by the binding epoch, never a mutable counter. Configurable UI-editable and strategy-family-dependent (DEC-0157). The recorded value of two for a scalper is evidence — non-authoritative, never a ratified spine constant."

