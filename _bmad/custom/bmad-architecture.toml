# Team override (committed) — QMX planning-only pipeline.
# Architecture is the last BMad step; the project exits BMad afterwards.

[workflow]
persistent_facts = [
  "QMX override: BMad handles planning ONLY in this project — implementation ships through the external software factory, never through BMad. Pipeline: brainstorming as needed, PRD (bmad-prd), and Architecture (bmad-architecture) in whatever order the work needs — operator ruling 2026-08-19: architecture MAY run before the PRD, grounded on the existing docs/ corpus as the requirements body (do not demand or wait on a PRD); the PRD absorbs architecture output later. Both PRD and Architecture must exist before the project exits BMad. After that exit: /documentation-factory turns the ratified plan into the docs/ knowledge base, then bmad-create-epics-and-stories breaks it into epics and stories (re-enabled by operator ruling 2026-08-20) - epics feed the epic-factory plugin (attended lane, dynamic workflows in worktrees) or /queue-publish + to-kanban queue cards (unattended lane); implementation always happens in those factory lanes, never inside BMad. Never recommend, require, or gate on bmad-sprint-planning, bmad-build, or any bmad-testarch-* skill.",
]
on_complete = "Tell the user the architecture step is done. Next: /documentation-factory to fold the ratified plan into the docs/ knowledge base, then bmad-create-epics-and-stories to break it into epics and stories. After that, implementation runs in the factory lanes (epic-factory plugin, or queue cards for the unattended lane) — never through BMad build skills."
