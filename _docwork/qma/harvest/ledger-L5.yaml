  - id: DEC-0374
    title: "Cut: permanent named specialist rosters"
    statement: "QMA would keep permanent named specialist rosters (a fixed cast of always-on named worker agents). This is CUT: the operator flagged the overcooking himself, and QMA spawns worker templates on demand instead (AD-22 worker_template). Quants are the persistent named actors (AD-7); Workers are addressable execution slots, not a standing roster."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
    sources: [EXT-2400, EXT-2415]
    component: null
