  - id: DEC-0373
    title: "Cut: cloud service tiers, telemetry to a vendor, account slots, mobile clients"
    statement: "QMA would offer cloud service tiers, vendor telemetry, account slots and mobile clients. This is CUT: the daemon is authoritative and local (AD-6, AD-25); there is no service tier, and telemetry stays behind the QMA-owned OTel export port (AD-23) rather than being shipped to a vendor sink."
    status: dead
