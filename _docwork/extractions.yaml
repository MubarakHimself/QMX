    type: death
    summary: "The name 'Broker Exam' is rejected because exam already has incompatible meanings in QMX."
    quote: "I think I've already said I don't like the term. Maybe broker adapter or something. An exam might confuse some people, even me, or even the thing, the agents coding. Because an exam, if you look at the old systems of QMX, means something very different"
    cite: SRC-01-C0011
    topics: [vocabulary, broker, exam]
    authority: source
  - id: EXT-0141
    type: decision
    summary: "cTrader integration should use its Open API from Python, not MQL."
    quote: "CTrader has OpenAPI, I believe it uses OpenAPI"
    cite: SRC-01-C0011
    topics: [ctrader, open-api, python]
    authority: source
  - id: EXT-0142
    type: constraint
    summary: "The venue seam must support multiple platforms because crypto has many trading venues and modes."
    quote: "crypto is a whole thing because there are so many ways to trade in crypto"
    cite: SRC-01-C0011
    topics: [crypto, venues, extensibility]
    authority: source
  - id: EXT-0143
    type: death
    summary: "Lock 2 was rejected as a bundled broker-connection/backtesting-parity decision."
    quote: "now I think I'm going to deny the broker exam"
    cite: SRC-01-C0011
    topics: [five-locks, broker, dead]
    authority: source
  - id: EXT-0144
    type: decision
    summary: "Backtesting deserves a dedicated, deeper session rather than being resolved inside a broker checklist."
    quote: "the backtesting system or framework rather, this one might not. I feel like, I don't know why, but I feel like even it deserves a longer session than a simple write-off like this."
    cite: SRC-01-C0011
    topics: [backtesting, scope, session]
    authority: source
