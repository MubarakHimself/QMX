    type: open
    summary: "DEFERRED (GAP-0081): UI presentation — architecture, Rust extension technology, UI SDK surfaces, contribution points, UI plugin packaging, and the qma-ui-contract package beyond a stub. Revisit in its own session, once the daemon API is live and stable; the operator has not started the UI and does not plan to soon. The wire contract (AD-5) and the variables registry (AD-26) are NOT deferred and bind now. Profile records are client state, specified in that session; nothing in the daemon reads or stores one (AD-7). Carried forward: the UI reads as a trading/research terminal, not a generic agent dashboard, and surfaces live remote-agent activity — status, current task, tool calls, outputs, progress, failures, attach and observe (operator, T-5071, T-5082-5084)."
