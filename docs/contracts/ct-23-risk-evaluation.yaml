id: CT-23
name: Risk-evaluation door contract (bot-to-Book intent port)
status: provisional
version: 1  # first minted format version; the shape is spine-ratified (AD-33, DEC-0147), the doc stays provisional pending corpus re-ratification. GAP-0005 (version gap) answered by minting version 1
owner: COMP-QMF-RISK
consumers: []  # consumer-blind by design: the caller is the node/bot layer, which lives outside QMF and imports nothing under default-deny; the composition root mediates, so no package import edge exists (DEC-0147, DEC-0142)
active_consumers: []
intended_consumers: []  # the Book (qmf-risk) is the RECEIVER and owner of this inbound door; the caller (the node/bot layer) is a node-boundary pointer, never named here — see tracker/trading-node-notes.md (DEC-0142)
caller_status: unassigned  # the bot/node layer calls the door; its assignment is node runtime matter and unassigned in QMF (DEC-0147, DEC-0142)
wiring_status: defined-unwired  # AD-33 ratified the door shape; no code exists and no wiring is authorized from this doc — composition-root mediated until the software factory ships it (DEC-0147, DEC-0158)
layer_from: backend
layer_to: backend
decisions: [DEC-0143, DEC-0145, DEC-0147, DEC-0148, DEC-0149, DEC-0153, DEC-0154, DEC-0157, DEC-0158]
gaps: [GAP-0047]  # ExitLogicRef and the intent/close-reason taxonomy are QML donor atoms adopted by dated sitting decision, open to revision by the QML sitting (GAP-0047). GAP-0039/0040 are ANSWERED (DEC-0143..0155) and removed
purpose: "Define the single bot-to-Book inbound risk-evaluation door: two typed intent families — entry intent and exit intent — plus declared evidence slots, through which a Bot proposes and the Book resolves, sizes, admits, or refuses with a recorded, journal-bearing reason; minted once (AD-33) and read one way everywhere, with requested_r Book-resolved and every intent risk-monotonic by construction (DEC-0147)."
invariants:
  - "CT-23 is the one bot-to-Book inbound port, minted once and read one way everywhere; it carries exactly two typed intent families — entry intent and exit intent — plus declared evidence slots, and nothing else enters the Book through it (DEC-0147)."
  - "The door is defined-unwired ratified surface: qmf-risk exposes it and the composition root wires the caller; no wiring is authorized from this doc, and the caller (the node/bot layer) is unassigned in QMF and stays a node-boundary pointer, never named here (DEC-0147, DEC-0158, DEC-0142)."
  - "requested_r is Book-resolved, never bot-supplied: a Bot proposes, the Book resolves requested_r and sizes, and only the Book-resolved value enters the command record's identity — a bot that sized itself would invert the authority order 'bot -> book -> BMS -> operator' the spine quotes verbatim, which is why the QML donor's TradeIntent omitted volume (DEC-0147, DEC-0154, DEC-0143)."
  - "Entry intent carries: the instrument, the direction, the declared full-loss price, an advisory proposed_r, a typed reason code, and the per-intent execution target resolved per AD-35; proposed_r is advisory only and never becomes requested_r without Book resolution (DEC-0147, DEC-0154, DEC-0149)."
  - "No declared full-loss price is an invalid-input refusal at admission: no price -> no original_risk_distance -> no admission — a strategy that deliberately runs with no planned loss point cannot trade in QMX (DEC-0154)."
  - "Exit intents are risk-monotonic by construction. The only V1 exit kinds are close_full and tighten_protective_stop, each carrying a typed reason_code (versioned per Book family — the evidence half of fast invalidation and the field by which the AD-37 rank-3 fast-invalidation class is recognised) (DEC-0147)."
  - "close_partial is NOT a V1 kind: the command vocabulary is exactly the five ratified kinds and none expresses a fractional close, so a partial exit could only be emulated by close-then-replace — the unprotected window AD-34 forbids — and is an unsupported-capability refusal in V1; partial-close stays a Deferred later mint on CT-19 and this vocabulary widens only when the command does (DEC-0147, DEC-0148)."
  - "A tighten_protective_stop names a direction and a bound, never a price; the Book's policy resolves the level, which keeps R single-authored, and enacts the move through the CT-19 amend_protection command, risk-non-increasing measured against the frozen original_risk_distance (DEC-0147, DEC-0148, DEC-0154)."
  - "An intent may never widen a stop, extend a target beyond the Book's declared envelope, re-open a closed position, or increase size — each is a policy rejection (DEC-0147)."
  - "Evidence slots are labeled declared input shapes carrying a stated as-of knowledge time, never second contracts: the SQS reading (a CT-16 configured-producer value per AD-39) and cohort-correlation evidence (an AD-31 declared slot), each carried by reference/label and never re-specified inside CT-23; cohort-correlation evidence is named apart from the fill-attribution label and from correlation_id (DEC-0153, DEC-0145)."
  - "The Book owns exit policy for the life of a position; a Bot may only propose through this door, and the Book executes or refuses with a recorded, journal-bearing reason — fast invalidation is preserved as a risk-reducing proposal path, never deleted (DEC-0147, DEC-0145)."
  - "The execution target is resolved once, at intent mint, from (Book mode, seat state, active-control set) and enters the command record's identity; role rides the execution-target record, never the AD-29 binding tuple, so one intent can never produce two submissions and a mode flip never replays a command (DEC-0149)."
  - "A Book may declare zero permitted bot-intent kinds — a static-protective-stop-only Book is the honest V1 default; later Book versions may delegate specific exit organs to specific bot families as a version change, not a rule break. ExitLogicRef and the intent/close-reason taxonomy are QML donor atoms adopted by dated sitting decision, open to QML-sitting revision (GAP-0047) (DEC-0147)."
  - "Every intent and every door decision mints a risk-authored record (AD-16 record kinds) carrying the Book-definition fingerprint, the binding identity, and — where the act concerns one bot — the Bot identity plus seat binding as identity fields; entity journals are read-time projections joined through the versioned CT-25 surface, never additional writers (DEC-0158, DEC-0145)."
  - "The door may never do the Bot's sizing, may never widen risk, and may never learn a value from absence; refusals are typed CT-04 values from registry:typed_refusal_codes — invalid input, unsupported capability, and policy rejection are this door's paths (DEC-0147, DEC-0154)."
schema:
  type: "RiskEvaluationRequest — a bot-to-Book inbound intent carried in one of two typed families (entry | exit) plus declared evidence slots; the Book resolves it to an admission, a command, or a typed refusal, never mutating the caller's declaration (DEC-0147)."
  fields:
    - "intent_family: entry | exit — the discriminant; exactly one family per request (DEC-0147)"
    - "entry.instrument: the instrument identity (CT-03) the position opens on (DEC-0147)"
    - "entry.direction: long | short (DEC-0147)"
    - "entry.declared_full_loss_price: Price(instrument), the position's planned original full-loss price; mandatory — its absence is an invalid-input refusal at admission, and it is the sole source of original_risk_distance (DEC-0154, DEC-0147)"
    - "entry.proposed_r: an advisory r-multiple, a Bot proposal only; never the sized value — the Book resolves requested_r and only the Book-resolved value enters the command record's identity (DEC-0147, DEC-0154)"
    - "entry.reason_code: a typed reason code (versioned per Book family) naming why the entry is proposed (DEC-0147)"
    - "entry.execution_target: the per-intent execution target resolved once at intent mint from (Book mode, seat state, active-control set), entering the command record's identity; role rides this record, never the binding tuple (DEC-0149)"
    - "exit.kind: close_full | tighten_protective_stop — the only two V1 exit kinds; close_partial is not a kind and is an unsupported-capability refusal (DEC-0147)"
    - "exit.reason_code: a typed reason_code versioned per Book family — the evidence half of fast invalidation and the field by which the AD-37 rank-3 fast-invalidation class is recognised (DEC-0147)"
    - "exit.virtual_position_ref: the virtual (Book) position the exit targets — the AD-40 noun (binding-scoped, Bot-attributed), never the venue position (DEC-0154, DEC-0147)"
    - "exit.tighten_direction_and_bound: on a tighten_protective_stop only — a direction and a bound, never a price; the Book's policy resolves the level and enacts it through CT-19 amend_protection, risk-non-increasing against the frozen original_risk_distance (DEC-0147, DEC-0148, DEC-0154)"
    - "evidence.sqs_reading: a labeled declared input shape carrying the SQS value (a CT-16 configured-producer value per AD-39) with its as-of knowledge time; a reference/label, never a second contract embedded in CT-23 (DEC-0153)"
    - "evidence.cohort_correlation: a labeled declared input shape carrying cohort-correlation evidence (AD-31) with its as-of knowledge time; named apart from the fill-attribution label and from correlation_id (DEC-0145)"
    - "requested_r: Book-resolved r-multiple — computed by the Book, never carried inbound; recorded here to mark that it is the only R value that sizes and enters the command record's identity (DEC-0147, DEC-0154)"
  enums:
    - "intent_family: entry | exit (DEC-0147)"
    - "entry.direction: long | short (DEC-0147)"
    - "exit.kind: close_full | tighten_protective_stop — a closed set for V1, addable never redefined; close_partial excluded (DEC-0147)"
    - "risk-monotonic violation classes, each a policy rejection: widen-stop | extend-target-beyond-envelope | re-open | increase-size (DEC-0147)"
    - "reason_code (entry.reason_code and exit.reason_code): a typed, per-Book-family-versioned code space, not enumerated at contract level because the Book family owns it — the door requires the field present and typed, not a fixed member set (DEC-0147)"
    - "refusal categories on this door's paths, per registry:typed_refusal_codes: invalid input (an absent full-loss price, an inbound requested_r, an evidence slot without its as-of time), unsupported capability (close_partial or an unpermitted intent kind), policy rejection (a risk-monotonic violation, a mismatched cohort) (DEC-0147, DEC-0154)"
  units:
    - "proposed_r, requested_r: r-multiple (dimensionless exact rational) per the AD-40 unit-kind vocabulary; proposed_r advisory, requested_r Book-resolved (DEC-0154, DEC-0147)"
    - "declared_full_loss_price: Price(instrument) as a scaled integer at the instrument's declared digits; original_risk_distance = PriceDelta(instrument) from entry to this price (DEC-0154)"
    - "evidence as-of knowledge time: int64 UTC ns (Consistency Conventions), carried on every evidence slot (DEC-0145, DEC-0153)"
  nullability:
    - "intent_family is required and non-null; exactly the fields of the named family are present, the other family's fields absent (DEC-0147)"
    - "entry.declared_full_loss_price is mandatory on an entry intent — absent is an invalid-input refusal, never a default (DEC-0154)"
    - "entry.proposed_r is optional and advisory; its absence never blocks admission and its presence never sizes (DEC-0147)"
    - "exit.tighten_direction_and_bound is present only on a tighten_protective_stop and absent on a close_full; a price in place of a direction-and-bound is an invalid-input refusal (DEC-0147)"
    - "evidence slots are optional labeled inputs; a slot present without its as-of knowledge time is an invalid-input refusal, and a stale reading is governed by the producer's declared freshness bound, never defaulted (DEC-0153, DEC-0145)"
    - "requested_r is never carried inbound; an inbound requested_r is an invalid-input refusal — the bot may not size (DEC-0147, DEC-0154)"
