  - id: EXT-2139
    type: decision
    summary: "GATE-2 RULINGS 1-17 (orchestrator; applied by residual fix pass 2; TN ids stable). (1) AD-27's per-command UNKNOWN block is NOT entry-side - it is the one non-control block (AD-36): every command on that (VenueId, account) stream is refused, protection included; a refused protective act stands as a standing protection intent journaled before dispatch and re-decided on resolution; only resolve_unknown clears it; TN-23 and TN-24(c) corrected. (2) Protective-stop ATTACHMENT at placement is written into the order path (AD-33/AD-34: entry-relative form for MARKET orders; undeclared capability plus required attachment = unsupported capability refusal; the resting protective order may differ by slippage - AD-40's declaration stays the plan). (3) Node stand-down refuses ENTRY intents only, whatever the author; every risk-non-increasing act passes (Book force-flats, ExitLogicModule exits, bot tightens, standing intents, operator commands). (4) resurrect is a node LIFECYCLE act journaled as an AD-21 control action EVENT under the declared node subtype node_resurrect (operator signer, global scope), not a CT-30 kind - proposed as a doc-factory subtype mint. (5) A detected preflight REFUSAL never exits (stand-down alive, doors serving); the crash-loop fold counts only failures that DO exit (door-binding failure, unhandled death after boot); StartLimitBurst above K, StartLimitIntervalSec at or above T; a requested restart exits code 75 with RestartForceExitStatus=75/SuccessExitStatus=75 and never advances (K,T). (6) VenueClientPort implementation selected by (world, VenueId): world=replay selects the replay implementation for every venue; a replay composition resolves no credential, holds no venue secret, opens no socket (preflight proves it); a replay run is a stdlib process-per-job OUTSIDE the node process with disjoint replay WriterIds; the port has THREE V1 implementations (cTrader client, replay adapter, the FEAT-0023 conformance double). (7) News-calendar revisions may only WIDEN or ADD an in-force or same-day window automatically; narrowing, downgrading or removing one takes effect no earlier than the superseded window's end and is otherwise an operator act; calendar CODE identity is sealed into composition_fp, news-calendar DATA snapshots are frontier-read observations; news_calendar_max_staleness minted (per-decision-cycle precondition, fail-closed); recorder retry policy declared within the provider budget. (8) Retry-after-refresh applies ONLY to requests without a command identity (auth, subscription, heartbeat, gap replay, read-back); commands are never retried (UNKNOWN past wire handoff, veto-path refusal before). (9) Delegated impurity clause: qmf-venue's ConnectionManager holds the socket, session and the single venue secret value on the loop, Clock and SecretStore the node injects; owns no loop, schedules nothing itself; the QMF async conformance test is amended in the same increment to exempt qmf.venue.connection by name (parent annotation); if refused at the parent the increment lands in qmn.venue.ctrader - epics may not choose. The sanctioned qmf-venue import boundary is the qmn.venue subpackage. (10) Reconciliation compares TWO residuals separately - QUANTITY (virtual positions versus venue position picture per instrument, exact units, under netting or hedging) and CASH (venue realized balance versus virtual realized cash plus named components, exact integers at the account exponent); unrealized P&L is a mark and is NEVER reconciled; the two equity series are reported side by side with their mark instants; only a residual in quantity or cash sets operator_review. (11) Powers socket /run/qmn/powers.sock, owner qmx:qmxops, mode 0660, RuntimeDirectory; TWO declared peer principals by uid, neither the qmx service account: the operator principal (every power) and the ops principal (notify_test, restore_drill_run, config_validate, hub_publish, evidence reads only); every trading, protection, promotion, activation, settings, resurrect, attest and countersign power is refused for the ops principal by the transport; preflight refuses to boot if any unit runs under an operator-principal uid; SO_PEERCRED proves an account, not a human - a named residual risk (A32). The powers list is CLOSED and gains restore_drill_run, config_version_activate, seat_reinstate, hub_publish (also a just node-hub-publish recipe calling that power; refuses provenance=sandbox at publish AND at pull). (12) /opt/qmx = immutable per-commit trees plus a current symlink flipped atomically at the restart; a deployment record on the version graph carries commit plus config version; old trees pruned by a declared depth. (13) The observability stack: own unit qmx-observability.service under a distinct non-qmx account, storage under /var/lib/qmx-observability as a named line item of vps_disk_budget with its own quota, network_mode host with every port bound to 127.0.0.1, scraping /metrics only, reading the node's logs through a dedicated read-only journal namespace, its own credentials a DECLARED FOURTH secret holder (holding nothing the node holds); provisioning installs and pins a container runtime for this stack only; the egress allow-list gains the image registry or a vendored image source; the node runs and passes without the stack. (14) Shadow lane: candidate labelers enter a separate shadow_composition_fp, never the governed composition_fp; candidates are heavy by construction, computed off the trading path from frontier-stamped inputs, never counted toward max_slice_latency, dropped with a data-quality record on their own bound; bound by every governed-labeler rule. (15) Attribution declarations on a netted account must be jointly exhaustive and disjoint - a partition proved at compile, else invalid input. (16) Timer units compose from the config version the RUNNING node sealed (read over the evidence channel); node-absent means compose from current and stamp node-absent; neither readable means refuse and alarm. Two restore timers: qmn-restore-sample.timer (nightly) and qmn-restore-full.timer (monthly); host-loss rehearsal = the restore_drill_run power; qmn-news-calendar.timer renamed. Unit count stated accordingly. (17) The benchmark harness never runs concurrently with a slice-driving node (before the doors open, or from stand-down); governor budgets are soak-blocking; the heavy snapshot's maximum age IS decision_freshness_bound (no second bound); a labeler that cannot publish inside it publishes not_ready."
    cite: SRC-11:.memlog.md#line-51
    topics: [trading-node, gate-2-rulings, unknown-block, resurrect, venue-port, reconciliation, powers-channel, observability-stack, shadow-lane]
    authority: rider

  - id: EXT-2140
    type: decision
    summary: "GATE-2 RULINGS 18-34 and the closing clause. (18) The workstation installation is provisioning-only and ENFORCED: the composition root refuses to compose off the roster's VPS machine tuple; the SecretStore refuses a venue-session holder off that host; a tier-1 check proves the wizard module imports neither the connection manager nor the refresh duty; a tier-1 check proves no console-script entry point and no publishable target. (19) No float on the money path at all: venue money and volume decode from wire integers at their declared exponent; a money field arriving as a float is refused; the sanctioned float crossings are non-money wire floats (execution prices per CT-18's declared class) and the declared comparison-rule quantize. (20) BLANKS PARTITION into three effects tagged per mint-table row: blocks-boot (a mechanism cannot run without it: submission_deadline, accumulator_bound, max_slice_latency, local_queue_bound, crash-loop K/T, drain_window, watchdog_interval), blocks-role-live (money gates), blocks-soak (any variable a TN-23 checklist item exercises - a GENERATED rule, not a list; the soak gate refuses to start otherwise). (21) A protection intent that cannot be journaled because the journal room is unpersistable is written to a small reserved protection-intent extent under /var/lib/qmx/state sized by disk_headroom_min (the headroom block trips first); if even that fails the intent is recorded UNDELIVERABLE, alarmed on the silent-degradation class, and the venue-resident protective order carries the position - never 'held in memory'. (22) value-status lives on the resolved config artifact's row for every value (Book-declared values included; the compiler propagates it onto generated fragments); the registry declares value_status_required as schema; a countersign mints a new config version like any settings edit, journaled, and is refused without the variable's EVIDENCE CITATION by fp1 (one variable per call). (23) Seat containment: a slice-progress watch in the door layer stops the WATCHDOG keepalive when now minus slice_start exceeds the callback deadline by a declared factor, pushes on the silent-degradation class and lets systemd restart (safe: restarts never flatten); V1 cannot interrupt a non-cooperative callback - stated; leaving quarantined = the operator-signed seat_reinstate power (its own CT-24 transition). (24) The KSA level is folded PER ENFORCEMENT SCOPE (global plus per (VenueId, account) stream), scope part of the level identity and level epoch; effective level = most restrictive covering scope; an operator resume names the scope it reopens; connectivity and unknown_state escalations on the live connection do NOT block paper routing to the paired demo stream (distinct streams, AD-35) - they block that stream. (25) A reserved SUPERVISOR WriterId (constant of the unit role, never re-issued by Compose) owns the boot-attempt and lifecycle stream, placed under /var/lib/qmx/state. (26) The evidence tier instantiates a named sealed-archive room role per world for synced observation and journal content (plus the research door and registry room); the replay import port and the backup read that role; hot-room purge precondition = a verified copy in sealed-archive AND a verified off-host copy. (27) Position and balance read-back observations are CT-20 observation kinds journaled under the existing seven AD-21 types through CT-20's mapping table - a proposed CT-20 mapping-row addition (parent annotation), never a new journal type. (28) drain_window and watchdog_interval minted (duration, configurable); TimeoutStopSec and WatchdogSec are RENDERED into the unit file from the config artifact by node-install. (29) just pinned and registered as an external tool; the bootstrap script installs uv, CPython, just, the container runtime for the stack, and clones at the pinned commit. (30) TN-18's config compile has FOUR layers (roster, BMS fragment, Book fragment, node defaults) - the invocation layer is deleted. (31) PRD section 3 allow-list widening (silent-degradation class plus dead-man's switch plus liveness digest) is recorded as a PROPOSED PRD AMENDMENT in the parent-annotations section, surfaced not settled. (32) The soak runs on the demo binding; the live connection is opened for SENSING AND RECORDING ONLY as soon as live credentials exist (no live binding, no command stream) so the live-environment SQS baseline and rung baseline accumulate; the live binding waits on its own baselines - a precondition stated in TN-9/TN-23, so a late Spotware approval delays go-live, never the soak; SessionTopology's connection count is derived from the roster (a qmf-venue increment item relaxing the ClassVar). (33) No scale-in refusal at the door over VIRTUAL positions (AD-40); close_partial refused (AD-33); absent-or-terminal subject resolves without submission (AD-27); arbitration strictly by rank with no arrival-order input and Tier 1 venue-resident actions outside the ordering (AD-37); no-pending-orders-at-reconciled-verdict expressible in the matrix cell. (34) FAILURES.md's notification-tier column is the SOLE home of alert-class membership (the registry membership row withdrawn). CLOSING CLAUSE: every other re-gate finding of every severity is applied as its review states it; the Inherited Invariants shadow-lane row is corrected to 'seam built now, ML half deferred'; the memlog authority line in the assumption register points at the ruling entries as amended."
    cite: SRC-11:.memlog.md#line-51
    topics: [trading-node, gate-2-rulings, blank-effect, value-status, ksa-scope, sealed-archive, ct-20, prd-amendment, failures-md]
    authority: rider

