  - id: EXT-2418
    type: death
    summary: "CUT (DEC-0377): group chat as the primary coordination mechanism. Parallel workers synchronize through the Task Graph (AD-12), not chat; the Agent Bus (AD-20) is durable and addressed but non-authoritative."
    quote: "parallel workers synchronize through the Task Graph, not chat"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: Group chat as the primary coordination mechanism)"
    topics: [cut, dead, group-chat, coordination, task-graph]
    authority: rider
  - id: EXT-2419
    type: death
    summary: "CUT (DEC-0378): an eleven-entry loop registry as the organizing centre. The operator's last word (T-4954) enumerates graphs, not loops; the named cycles become authored, plugin-contributed Graph Templates (AD-13), with Loop reduced to a node kind inside a Graph Template."
    quote: "the operator's last word enumerates graphs, not loops; the named cycles become authored Graph Templates"
    cite: "SRC-13:ARCHITECTURE-SPINE.md#cut-outright (row: An eleven-entry loop registry as the organizing centre)"
