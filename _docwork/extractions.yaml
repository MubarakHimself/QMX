  - id: EXT-1157
    type: open
    summary: "A three-tier extension model for open agent workspaces, reviewed app composition, and a sealed live node remained an unratified recommendation."
    quote: >-
      Agent workspaces are fully open — agents extend freely, and they're safe not by restriction but by absence: no live-trading provider even exists in that environment. The app tier is reviewed. The live node is composed once at boot, fingerprinted, then sealed — and promotion from tier to tier is only ever a human edit.
    cite: SRC-02-C0038
