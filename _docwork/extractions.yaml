  - id: EXT-2447
    type: decision
    summary: "LEDGER GRANULARITY (dictation) — the operator ruled there is no single global ledger and no one-ledger-per-desk/profile: a remote agent on another machine appending to a desk-central ledger 'makes no architectural sense'. Ledgers are event/work ledgers attached to the unit of work, hierarchical (a main lead, the workers, their subagents), answering what happened, when, why it failed and how the agent resolved it; plus an experiment ledger modelled on a scientist's notebook. Source of the task/quant/experiment-ledger split with desk ledgers as read-time views."
    quote: "we really can't have one profile or one desk having one singular ledger. That does not make sense at all. [...] you are going to have agents on another machine trying to access this very ledger. In an architectural sense, that does not make any sense. [...] an event ledger or a work ledger, whichever you want to call it [...] I said something the lines of an experimental ledger. If a scientist is carrying out an experiment, they have to have a notebook to note down what happened [...] Because we can't have one ledger globally. That makes zero sense."
    cite: "SRC-14:agentic-spine.txt:L238-269"
    topics: [qma, ledgers, no-global-ledger, experiment-ledger, hierarchy]
    authority: rider
