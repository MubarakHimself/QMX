    type: constraint
    summary: "Broker-adapter work must be grounded in proper documentation, especially the trading-node documentation."
    quote: "broker adapter, this one is you read proper documentation, please. Please, please, please, please. It's not even funny. Read proper documentation, and this goes to mostly that reading node."
    cite: SRC-01-C0010
    topics: [broker, documentation, trading-node]
    authority: source
  - id: EXT-0130
    type: value
    summary: "Books and BMS are the operator's risk-management and position-sizing system."
    quote: "books and the BMS is our okay, it's my own version of what I would consider as risk management and position sizing"
    cite: SRC-01-C0010
    topics: [book, bms, risk]
    authority: source
  - id: EXT-0131
    type: decision
    summary: "Book types and variants need lineage and categorization, including multiple scalping Books and later prop-firm Books."
    quote: "we can have another version of a scalping book, yeah, which means we can, which means there is that lineage, there is that types. I don't know if you get what I mean, categorization and whatnot. Then, the same logic with prop firms."
    cite: SRC-01-C0010
    topics: [book, lineage, variants]
    authority: source
  - id: EXT-0132
    type: open
    summary: "There may eventually be multiple BMS implementations, particularly for crypto."
    quote: "there is a scenario where we shall have more than one BMS. I don't know, because the crypto system is, I don't think, will use exactly this, it might have standalone versions or something like that."
    cite: SRC-01-C0010
    topics: [bms, crypto, open]
    authority: source
  - id: EXT-0133
    type: constraint
    summary: "Metrics and reports should reveal whether a strategy works without bias and expose internal failure causes."
    quote: "what shows if our strategy is right, what shows if a strategy is wrong, but at the same time, being unbiased overall"
    cite: SRC-01-C0010
    topics: [metrics, reports, strategy]
    authority: source
  - id: EXT-0134
    type: decision
    summary: "Failed strategies should be diagnosable so they can be improved or deliberately cut loose."
    quote: "those that fail, we need to understand why they failed. Can we improve them or do we cut them loose?"
    cite: SRC-01-C0011
    topics: [strategy, diagnostics, research]
    authority: source
  - id: EXT-0135
    type: constraint
    summary: "Book/BMS calculations have many variables with differing editability and defaults and must be modeled surgically."
    quote: "There are so many calculations in the book and the BMS, so many that you need to consider. Very many variables. Don't just take them for granted. Some are already defined, some are defaults, some are editable, others are not. So be careful, it's very surgical."
    cite: SRC-01-C0011
    topics: [book, bms, variables]
    authority: source
  - id: EXT-0136
    type: context
    summary: "Trading-node exit mechanics include fast invalidation and dynamic stop-loss/take-profit behavior."
    quote: "for exit mechanisms, you have things like fast invalidation, you have the dynamic SL and TP system. It's a whole world down there."
    cite: SRC-01-C0011
    topics: [exits, stop-loss, trading-node]
    authority: source
  - id: EXT-0137
    type: context
    summary: "The previous trading-node design included a correlation ledger."
    quote: "we had something like a correlation ledger"
    cite: SRC-01-C0011
    topics: [correlation, ledger, trading-node]
    authority: source
  - id: EXT-0138
    type: decision
    summary: "News kill-switch scope is pair-specific; unaffected pairs keep trading."
