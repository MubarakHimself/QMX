  - id: GAP-0015
    question: "What lineage edge types, revision rules, append format, indexing strategy, and compaction policy implement graph-shaped registry history without a graph database?"
    needed_by: [COMP-QMF-REGISTRY, COMP-QMF-DATA]
    blocking: false
