    status: answered
    answer: "At-birth parent references live in the record header; lineage accruing after birth lives exclusively in append-only typed edge records (supersedes, promoted-from, occurrence-of, corroborates, disagrees-with) referencing fingerprints; edge files are pinned JSONL — one fp1-canonical object per line, LF-terminated, append-with-fsync, no rewrite, size-rotated with monotonic ordinals; indexes are local and rebuildable; no database server (DEC-0114, AD-16)."
    answered_by: operator (architecture sitting 2026-08-20)
    date: 2026-08-20

