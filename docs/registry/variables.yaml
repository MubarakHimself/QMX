    decision: DEC-0154
    configurable: true
    notes: "The Money-per-r_multiple rate that prices one R (DEC-0154, AD-40): position_risk_amount = requested_r x r_unit_price, frozen at admission. r_unit_price = period_loss_budget / seat_loss_run_allowance supersedes FORM-0004, which was dimensionally coherent but mis-named — it computed a rate, not an amount (a derived reading, not corpus text, verified this sitting against SCN-0001's own checksum). Fixed at period start and not recomputed as the budget drains intraday, unless the Book declares another cadence (it must declare one). A money-to-R crossing must name this rate; an implicit crossing refuses. Configurable UI-editable cadence (DEC-0157); no ratified spine value."

  - name: numeraire
    symbol: null
    value: USD
    formula: null
    units: null
    type: enum
    component: COMP-QMF-RISK
    decision: DEC-0154
    configurable: false
    notes: "The numeraire is USD system-wide in V1 (DEC-0154, AD-40; operator ruling reconfirmed post-close). The Book charter still declares accounting_currency so a later currency is a version change; binding a Book to an account in another currency is a policy rejection. No rate source is ratified and a silent conversion is the one error no report shows; the conversion seam ships and switches on only when a source is ruled. A venue-derived figure the venue itself converted is legal settlement evidence under a declared converted_by = venue provenance flag (DEC-0158, AD-28), outside the unratified-rate clause. configurable:false — the numeraire is not a UI knob; it is a per-Book accounting declaration."

