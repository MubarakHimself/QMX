  - id: DEC-0370
    title: "Cut: a foreign-harness shim in the model proxy (masquerading, model-identity spoofing)"
    statement: "QMA's model proxy would carry a foreign-harness shim that masquerades or spoofs a model identity so a call appears to originate from a different harness. This is CUT: QMA owns its caller and records the true Deployment honestly (AD-15); it never spoofs a model identity. This Cut is paired with DEC-0360 (no foreign runtimes hosted)."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329)."
    sources: [EXT-2400, EXT-2411]
    component: null
