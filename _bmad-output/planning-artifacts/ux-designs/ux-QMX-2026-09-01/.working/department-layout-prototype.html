<script>
const labels={A:'Department room',B:'Conversation + tools',C:'Evidence workbench'};
const initialVariant=new URLSearchParams(location.search).get('variant');
const state={variant:labels[initialVariant]?initialVariant:'A',world:'research',asset:'EUR/USD',tool:'performance',toolOpen:true,connected:true,chat:false,mandate:'crypto',draft:'',messages:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(s,type='')=>`<span class="badge ${type}"><i class="dot"></i>${s}</span>`;
function locationBadge(){return badge(state.connected?'Remote · research-node':'Remote · connection lost',state.connected?'':'wait')}
function assetTabs(){return `<div class="asset-tabs" role="group" aria-label="Linked instrument">${['BTC','EUR/USD','SPY'].map(a=>`<button data-asset="${a}" class="${state.asset===a?'active':''}" aria-pressed="${state.asset===a}">${a}</button>`).join('')}</div>`}

if(b.dataset.openTool){state.tool=b.dataset.openTool;state.toolOpen=true;$('#modal').close();if(state.world==='portfolio'||state.variant==='A')changeVariant('B');else render();return}
if(b.dataset.member){let n=b.dataset.member,atlas=n==='Atlas',lyra=n==='Lyra';modal(n+' · persistent member',`<dl class="dialog-grid"><dt>Desk / role</dt><dd>${lyra?'Analysis / Analyst':'Research / Researcher'}</dd><dt>Current work</dt><dd>${atlas?'M-031 · Funding carry':lyra?'M-024 · FX cost review':'M-024 · Cost sensitivity; M-018 · Regime robustness'}</dd><dt>Memory scope</dt><dd>${lyra?'analysis':'research'} / ${n.toLowerCase()} · persistent across sessions</dd><dt>Mailbox</dt><dd>${atlas?'1 dependency update pending':'1 review request; 1 handoff'}</dd><dt>Current execution</dt><dd>${atlas?'Local · waiting on corrected inputs':lyra?'Remote · analysis-node · analyst worker':'Remote · research-node · agent-024 / worker-04'}</dd><dt>Responsibility</dt><dd>${atlas?'Validate funding carry evidence':lyra?'Review assumptions and statistical evidence':'Own research investigations and their evidence'}</dd></dl><p class="note" style="margin-top:18px">A member is not a process. Inspecting this profile does not create a new session.</p>`);return}
if(b.dataset.task){let id=b.dataset.task;modal('Task '+id+' · execution detail',`<dl class="dialog-grid"><dt>Parent work</dt><dd>M-024 · durable investigation</dd><dt>Task state</dt><dd>${({ '01':'Done','02':'Running','03':'Running','04':'Pending — requires tasks 02 and 03'})[id]}</dd><dt>Owner</dt><dd>${id==='03'?'Lyra · Analysis':'Hermes · Research'}</dd><dt>Agent</dt><dd>${id==='04'?'Not dispatched':id==='03'?'analyst-011 · active execution instance':'agent-024 · execution instance'}</dd><dt>Environment</dt><dd>${id==='04'?'Not assigned':id==='03'?'Remote container · analysis-node':'Remote host · research-node'}</dd><dt>Evidence</dt><dd>${id==='02'?'18 / 36 cases recorded in run R-024':id==='03'?'Review request linked to FX cost evidence':'Inputs and outputs remain attached to the task record'}</dd></dl>${id==='03'?'<p class="note">Possible expanded inspector: analysis kernel state, context references and requests. RLM-specific interactions are not designed in this slice.</p>':''}<p class="note" style="margin-top:15px">${state.connected?'Illustrative execution snapshot.':'Connection lost: this is the last confirmed snapshot, not current verification.'}</p>`);return}
const a=b.dataset.action;
if(a==='close-dialog')$('#modal').close();
else if(a==='connection'){state.connected=!state.connected;render();feedback(state.connected?'Sample connection restored. No work was restarted.':'Connection lost in the simulation. The last confirmed job state remains visible. No cancellation occurred.')}
else if(a==='open-work')changeVariant(state.variant==='C'?'C':'B');
else if(a==='chat'){state.chat=!state.chat;render()}
else if(a==='hide-tool'){state.toolOpen=false;render()}
else if(a==='restore-tool'){state.toolOpen=true;render()}
else if(a==='catalog')catalog();
else if(a==='environment')environment();
else if(a==='graph'){state.tool='graph';state.toolOpen=true;render()}
else if(a==='review')review();
else if(a==='review-evidence'){state.asset='EUR/USD';state.tool='performance';state.toolOpen=true;$('#modal').close();changeVariant('B')}
else if(a==='mailbox')modal('Handoffs across departments',`<div class="catalog-item"><div><span class="eyebrow">Delivered · review_request</span><h3>Lyra → Hermes / FX assumptions</h3><p>Linked work: M-024, task 03. Message delivery is separate from task completion.</p></div><button class="btn" data-action="review">Inspect</button></div><div class="catalog-item"><div><span class="eyebrow">Queued · handoff</span><h3>Hermes → Lyra / Regime evidence</h3><p>M-018 is done. The receiving analysis task has not been created in this sample.</p></div></div><p class="note">A department-wide mailbox here is a proposed aggregated view of member mailboxes. Department message routing remains unresolved.</p>`);
else if(a==='routines')modal('Scheduled work · Research',`<div class="catalog-item"><div><h3>Daily data quality review</h3><p>Owner: Atlas · next 18:00 UTC · creates a fresh review task.</p></div>${badge('Scheduled','neutral')}</div><div class="catalog-item"><div><h3>Weekly research digest</h3><p>Owner: Hermes · next Friday · gathers evidence references.</p></div>${badge('Scheduled','neutral')}</div><p class="note">Schedule, owner and work created should be distinct. This study does not implement routine execution or editing.</p>`);
else if(a==='library'||a==='completed')modal('Evidence survives the conversation',`<span class="eyebrow">Shared artifact references</span><div class="catalog-item"><div><h3>Momentum / v12</h3><p>Strategy definition used in M-018 and M-024.</p></div></div><div class="catalog-item"><div><h3>R-024 / Cost sensitivity</h3><p>Research-owned evidence, linked from the portfolio world.</p></div><button class="btn" data-action="review-evidence">Open</button></div><div class="catalog-item"><div><h3>M-018 / Regime study</h3><p>Completed investigation · 6 sample artifacts · queued handoff to Analysis.</p></div></div><p class="note">An artifact can appear in several worlds without becoming several independent copies.</p>`);
else if(a==='funding')modal('Funding carry · blocked investigation',`<span class="eyebrow">M-031 / Atlas / Research</span><h3>Waiting on timestamp correction</h3><p>A venue dataset has mismatched timestamps. No further comparisons should appear as completed until the corrected input is supplied.</p><dl class="dialog-grid"><dt>Task state</dt><dd>Blocked</dd><dt>Owner</dt><dd>Atlas</dd><dt>Execution</dt><dd>Local · no active computation in this snapshot</dd><dt>Dependency</dt><dd>Corrected data snapshot from data review</dd></dl><p class="note">Blocked is different from running remotely or losing a client connection.</p>`);
else if(a==='portfolio-evidence'){state.asset=state.mandate==='crypto'?'BTC':'EUR/USD';state.tool='performance';state.toolOpen=true;changeVariant('C')}
else if(a==='portfolio-assumptions')modal('Portfolio assumptions',`<dl class="dialog-grid"><dt>Mandate</dt><dd>${state.mandate==='crypto'?'Crypto systematic':'FX diversified'}</dd><dt>Reporting currency</dt><dd>USD</dd><dt>Weights shown</dt><dd>Targets only, sum to 100%. No holdings connected.</dd><dt>Needed context</dt><dd>Valuation timestamp, sources, fees, funding or rollover, currency conversion and exposure basis.</dd><dt>Comparability</dt><dd>Do not combine figures with incompatible timestamps or valuation assumptions.</dd></dl><p class="note">Mandate-specific views are a product proposition, not backend implementation evidence.</p>`);
else if(a==='portfolio-model')modal('Books, risk and the portfolio view',`<p>A portfolio view may draw on Books, BMS, risk and research evidence. It does not replace their operational ownership.</p><p style="margin-top:15px">The interface should reveal which Book or strategy supports each figure. This study deliberately uses target allocations rather than implying a connected trading account.</p><p class="note" style="margin-top:15px">The Portfolio Manager UX lens and the documented Product Manager role remain different, unresolved concepts.</p>`);
else if(a==='guide')modal('What this study is testing',`<p><strong>A:</strong> Can a department feel like a place to coordinate work rather than a list of chats?</p><p style="margin-top:12px"><strong>B:</strong> Is there enough room for both discussion and substantial evidence?</p><p style="margin-top:12px"><strong>C:</strong> Can tool-heavy research keep its agent context without a permanent chat column?</p><p style="margin-top:18px">Try EUR/USD → SPY, hide/reopen a tool, inspect a task, simulate connection loss, then visit Portfolios and open linked research.</p><p class="note" style="margin-top:18px">A can be a department landing view with B or C as working modes; these are not necessarily mutually exclusive products. Layout colors are provisional. MCP surfaces are simulated local HTML, not protocol implementations. Nothing is sent or traded. State resets on refresh except the selected layout in the URL. Left/right arrows switch variants when focus is outside an input.</p>`);
});
document.addEventListener('input',e=>{if(e.target.matches('#composer textarea'))state.draft=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='composer')return;e.preventDefault();const t=state.draft.trim();if(!t){feedback('Write a local draft first.');return}state.messages.push(t);state.draft='';render();feedback('Added locally for the layout study. No message was sent.')});
document.addEventListener('keydown',e=>{if($('#modal').open||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
render();
</script></body></html>
