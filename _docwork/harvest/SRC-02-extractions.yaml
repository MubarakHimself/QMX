extractions:
  - id: EXT-1001
    type: context
    summary: "QMX is the operator's custom algorithmic-trading platform, with a later ambition to become fully quantitative."
    quote: >-
      what I'm building is a project called QMX. Now, that project is meant to be my own custom quantitative trading platform, I would call it. Okay, it's actually not quantitative, but algorithmic. Later, we shall switch fully to quantitative
    cite: SRC-02-C0001
    topics: [qmx, product-vision, trading]
    authority: source
  - id: EXT-1002
    type: context
    summary: "The initial deployment picture contained a trading node, a debatable backend/middle node, and an agentic node."
    quote: >-
      the second thing was going to be a back-end server. Now, this is very debatable because depending on how we see things, we might not need it or we might. It depends on things, yeah. Then, the third thing would have been the agentic node
    cite: SRC-02-C0001
    topics: [topology, trading-node, backend, agentic-system]
    authority: source
  - id: EXT-1003
    type: decision
    summary: "The trading node owns most live-trading work and must be precise, surgical, and efficient."
    quote: >-
      the trading node handles most of the things that deal with live trading. Alright, so that right there is very crucial. You know, the core concepts need to be precise, surgical, and efficient.
    cite: SRC-02-C0001
    topics: [trading-node, live-trading, quality]
    authority: source
  - id: EXT-1004
    type: context
    summary: "The original middle layer was imagined for persistence and longer-running computation such as synchronization and model training."
    quote: >-
      that middle pass is meant to be like, think of it like a database, I would call it. It handles longer-running tasks, syncing, machine learning, model training, and whatnot.
    cite: SRC-02-C0001
    topics: [backend, data, machine-learning, topology]
    authority: source
  - id: EXT-1005
    type: context
    summary: "QML began as an internal bot library and QMA was floated as a future agent-oriented counterpart."
    quote: >-
      QML, which is the quant mind library. Okay, now I don't know if we can have, I don't know if they are called modules, yeah, so small sort of features that form up the library. So, for at first, QML was made for only you know bots like the trading bots. However, it has occurred to me that we might also need something called I'm calling it QMA
    cite: SRC-02-C0001
    topics: [qml, qma, bots, agentic-system]
    authority: source
  - id: EXT-1006
    type: open
    summary: "At the start of the session, whether the node or QML should be designed first was unresolved."
    quote: >-
      Are we first building the agents? Sorry, are we first building the library? Not the agents, but the library, are we first building the node? What do you propose?
    cite: SRC-02-C0001
    topics: [build-order, qml, trading-node]
    authority: source
  - id: EXT-1007
    type: correction
    summary: "The old QMX version and recovery material are evidence only and must not become the foundation of the restart."
    quote: >-
      What you are seeing in the old version of QMX, please don't take it as core. Okay, what we did with GPT was try to recover and whatnot, but don't take it as something core for you to build this new system on top of. Otherwise, you'll poison the entire state
    cite: SRC-02-C0002
    topics: [source-authority, clean-start, legacy]
    authority: source
  - id: EXT-1008
    type: decision
    summary: "The new project is a deliberate clean restart away from the previous design state."
    quote: >-
      The whole reason of me restarting this is because I want to run away from the other poisonous thing
    cite: SRC-02-C0002
    topics: [clean-start, legacy, project-reset]
    authority: source
  - id: EXT-1009
    type: context
    summary: "The trading-node domain includes MIS, SQS, news, kill switch, Books, BMS, and bots."
    quote: >-
      the node we have the MIS, we have SQS, we have the news, the kill switch and whatnot, we have the book, the BMS. Well, the books rather, the BMS and the bots.
    cite: SRC-02-C0002
    topics: [trading-node, mis, sqs, books, bms, bots]
    authority: source
  - id: EXT-1010
    type: decision
    summary: "QML's purpose is to give coding agents a uniform, constrained way to author bots instead of unconstrained generic Python."
    quote: >-
      bots we wanted to provide one uniform way for agents because agents were mostly the ones going to be coding this thing out. So, in other words, instead of using Python and making everything too generic, which later down the road can cause issues
    cite: SRC-02-C0002
    topics: [qml, agents, authoring-surface, uniformity]
    authority: source
  - id: EXT-1011
    type: decision
    summary: "Reusable internal components such as market engines, data tools, and indicators are a primary reason for the framework."
    quote: >-
      wanted to have reusable components inbuilt in-house. We wanted to have, for example, what I'm trying to say by usable components. For example, if we manage to build like certain market engines or certain data, stuff like that, okay, or certain indicators. We would like them to be reusable across.
    cite: SRC-02-C0002
    topics: [qml, reuse, market-data, indicators]
    authority: source
  - id: EXT-1012
    type: constraint
    summary: "The design order must avoid building the node in a way that will later require a framework-driven rewrite."
    quote: >-
      I feel like certain things will have to be rebuilt with the library
    cite: SRC-02-C0002
    topics: [build-order, rebuild-risk, qml]
    authority: source
  - id: EXT-1013
    type: decision
    summary: "cTrader is the initial broker platform."
    quote: >-
      for the broker, yes, for now, we shall use C trader.
    cite: SRC-02-C0003
    topics: [broker, ctrader, venue]
    authority: source
  - id: EXT-1014
    type: constraint
    summary: "The operator prefers pure Python where cTrader permits it."
    quote: >-
      I would prefer at times using pure Python, which by the way, C Trader does allow
    cite: SRC-02-C0003
    topics: [python, ctrader, implementation]
    authority: source
  - id: EXT-1015
    type: decision
    summary: "The recurring delivery workflow is transcript and accepted artifacts to documentation factory, then Kanban, software factory, and later review."
    quote: >-
      I will export the transcript together with the artifacts for that session. Then we parse them to the documentation factory skill. Then, after documentation factory works its magic, we pass it to the Kanban skill, which just updates the Kanban for the factory. And the factory, the software factory, does the shipping. And we shall do review down the road
    cite: SRC-02-C0003
    topics: [workflow, documentation-factory, kanban, software-factory]
    authority: source
  - id: EXT-1016
    type: constraint
    summary: "Sessions should understand, agree, and decompose concepts into verifiable or accepted artifacts before implementation."
    quote: >-
      we are going to try as much as possible to break down and not even just break down, but understand, agree, and break down a lot of concepts. Once we produce, you know, the verifiable or accepted artifacts
    cite: SRC-02-C0003
    topics: [workflow, ratification, artifacts]
    authority: source
  - id: EXT-1017
    type: decision
    summary: "The framework should come before the node because a solo operator needs organization and cannot safely retrofit an exponentially growing bot estate."
    quote: >-
      I'm a one-man army, okay? So, which means if I try to be very disorganized, I'm going to be burnt out very quickly. Alright, that's why I'm pushing more for the library first so that things are more organized and simpler to run.
    cite: SRC-02-C0004
    topics: [build-order, solo-operator, qml, maintainability]
    authority: source
  - id: EXT-1018
    type: constraint
    summary: "The framework must do upstream containment so agents can work with less babysitting."
    quote: >-
      we are trying to build something that makes work for agents very, very simple. Okay, in other words, you don't have to contain them so much. We already did the containment upstream.
    cite: SRC-02-C0004
    topics: [agents, safety, authoring-surface, framework]
    authority: source
  - id: EXT-1019
    type: constraint
    summary: "Agents should receive the right tool for each job, with the framework functioning as a safety layer."
    quote: >-
      We are not going to have to babysit them so much because we know, like, the library will do the talking. I don't know if you understand me. So, we are trying so much to give them that right tool for the right jobs that we are giving them.
    cite: SRC-02-C0004
    topics: [agents, tooling, safety, framework]
    authority: source
  - id: EXT-1020
    type: open
    summary: "Genetic algorithms were only a hypothesis and were not adopted."
    quote: >-
      these are hypotheses. For example, genetic algorithm, we might or might not use it.
    cite: SRC-02-C0004
    topics: [genetic-algorithms, experimentation, open]
    authority: source
  - id: EXT-1021
    type: decision
    summary: "Forex is the first supported market; crypto remains a considered later version."
    quote: >-
      at the core yes crypto should be considered yes other things will come in yes but now okay the problem I think we might miss some stuff for crypto so maybe no let's do forex first maybe that will come in another version of QML
    cite: SRC-02-C0004
    topics: [forex, crypto, scope, roadmap]
    authority: source
  - id: EXT-1022
    type: decision
    summary: "Prop-firm Book design needs its own long session and must not be casually specified."
    quote: >-
      the prop firm book that is a whole long session because it needs me to think through a lot of things
    cite: SRC-02-C0004
    topics: [prop-firm, books, deferred]
    authority: source
  - id: EXT-1023
    type: context
    summary: "The envisioned agentic system may create and manage Books and update BMS values."
    quote: >-
      i might actually create the book in the agentic section or the agentic system of this QMX platform okay so yeah that's why we have agents creating books managing them updating BMS values and whatnot
    cite: SRC-02-C0004
    topics: [agentic-system, books, bms]
    authority: source
  - id: EXT-1024
    type: correction
    summary: "The Cordiverse paper is for the agentic harness, not QMF or the trading node."
    quote: >-
      I don't think the paper is producing something genuinely new. It is producing something genuinely new in the identic harness, but in normal coding standards, oh my god, you the agentic harness is what I'm talking about.
    cite: SRC-02-C0005
    topics: [cordiverse, agentic-system, source-boundary]
    authority: source
  - id: EXT-1025
    type: correction
    summary: "QML was reclassified from a library to a framework and renamed QMF, with QMF engulfing QML."
    quote: >-
      QML so QML is a framework, perfect. The QML framework. That's nice. Alright, now that we have the core idea, since it's a framework, it's no longer a library. So, does it become QMF instead? That seems like it's where we are going to.
    cite: SRC-02-C0005
    topics: [qmf, qml, naming, framework]
    authority: source
  - id: EXT-1026
    type: value
    summary: "The adopted name is QMF, and QMF contains or supersedes the former QML concept."
    quote: >-
      It has now become QMF, not QML anymore. Okay, QMF engulfs QML.
    cite: SRC-02-C0005
    topics: [qmf, qml, vocabulary]
    authority: source
  - id: EXT-1027
    type: constraint
    summary: "QMF must handle very large quantities of data."
    quote: >-
      one of the things we might need to build so much in QMF or whatever you want to call it is this thing better handling. We are going to be dealing with a lot of data. It's not even funny.
    cite: SRC-02-C0005
    topics: [qmf, data, scalability]
    authority: source
  - id: EXT-1028
    type: open
    summary: "Dukascopy and other mature quant projects should be studied before choosing what QMF uses or implements."
    quote: >-
      I know it, and we can study it. Yes, I agree. We can study it.
    cite: SRC-02-C0005
    topics: [research, reference-platforms, dukascopy]
    authority: source
  - id: EXT-1029
    type: death
    summary: "The one-slice-at-a-time framework build loop was rejected as unnecessarily slow and overly dependent on operator answers."
    quote: >-
      what the proven one slice at a time, I think no, it might not work. Seriously, I'm I'm very serious here. This might not work. Because the problem is you're going to be asking me questions which you already know the answer to.
    cite: SRC-02-C0005
    topics: [delivery, build-method, autonomy]
    authority: source
  - id: EXT-1030
    type: value
    summary: "The operator targeted a two-to-three-day factory build for QMF V1 once the minimal core was understood."
    quote: >-
      That slow version is going to take days, yet we could do this within two to three days, and we have QML version one because we have the power of AI agents and my software factory.
    cite: SRC-02-C0005
    topics: [qmf-v1, delivery, estimate]
    authority: source
  - id: EXT-1031
    type: decision
    summary: "The minimal core must cover the path from strategy research to live trading, including portfolio management and analysis."
    quote: >-
      the normal day-to-day would be, you know, going from research of strategy to getting it to actual trading, so everything that is used in between. But then, if you look at actual trading, you have to now also consider the portfolio management stuff, the analysis stuff
    cite: SRC-02-C0005
    topics: [qmf-core, research, portfolio, analysis, live-trading]
    authority: source
  - id: EXT-1032
    type: constraint
    summary: "QMF should be designed primarily for agent use, while the agent answers routine technical questions without repeatedly consulting the nontechnical operator."
    quote: >-
      Most of these things are going to be used by agents under QMX.
    cite: SRC-02-C0005
    topics: [agents, qmf-core, operator-experience]
    authority: source
  - id: EXT-1033
    type: constraint
    summary: "Deep research should begin only after collecting enough context and a candidate list."
    quote: >-
      for these other open source things, I think we can research them, but let's hang on. I told you we shall first have a list because the deep research is going to take a minute, an actual actual minute. Okay, so which means we need to collect enough context
    cite: SRC-02-C0005
    topics: [research-protocol, context, reference-platforms]
    authority: source
  - id: EXT-1034
    type: decision
    summary: "The operator accepted a two-deployable foundation consisting of the QMX app and a Trading VPS, with QMF underneath."
    quote: >-
      QMX Foundations. Okay, I think yeah, the up is okay Yeah, trading VPS, that's okay QMF, yes, that's okay
    cite: SRC-02-C0006
    topics: [topology, qmx-app, trading-vps, qmf]
    authority: source
  - id: EXT-1035
    type: decision
    summary: "The Trader hat is bot-oriented rather than cTrader-specific."
    quote: >-
      the threader threader is threader is actually more bot related not just not not just you know C trader but it's more of bot related
    cite: SRC-02-C0006
    topics: [five-hats, trader, bots]
    authority: source
  - id: EXT-1036
    type: context
    summary: "Trainer, developer, researcher, and analyst responsibilities overlap and should not be treated as rigid silos."
    quote: >-
      trainer developer and researcher co kinda share a lot more because analysts can fall under researcher can fall under developer depending on any day
    cite: SRC-02-C0006
    topics: [five-hats, roles, qmf]
    authority: source
  - id: EXT-1037
    type: decision
    summary: "QMF's data capabilities should include macro, micro, pairs trading, cross-pair analysis, and pair correlation."
    quote: >-
      for data we have stuff like macro and micro we have pair trading or pairs trading we have cross okay we have cross-pair analysis especially for for forex all analysis across multiple pairs
    cite: SRC-02-C0006
    topics: [data, forex, macro, micro, pairs-trading]
    authority: source
  - id: EXT-1038
    type: decision
    summary: "Experimentation is a key feature of QMX."
    quote: >-
      experimentation is one of the key features for QMX as a whole
    cite: SRC-02-C0006
    topics: [experimentation, qmx, research]
    authority: source
  - id: EXT-1039
    type: open
    summary: "Whether MIS has global or Book-specific models, and how Books and BMS register them, remained unresolved."
    quote: >-
      even the MIS the MIS might need some better models or we might have you know book specific models and man that that is gonna make stuff a bit weird if you have book-specific models it means the BMS needs to register that also the book itself needs to be able to register that
    cite: SRC-02-C0006
    topics: [mis, models, books, bms, open]
    authority: source
  - id: EXT-1040
    type: constraint
    summary: "Research should dig deeply into forex and crypto and examine correlations across every QMF hat."
    quote: >-
      for the framework dig deep seriously dig deep i really i don't know if it's even domain modeling or even deep research but i'm going to need you to dig deep especially forex forex is something i really look under underlook at times forex then crypto
    cite: SRC-02-C0006
    topics: [research, forex, crypto, five-hats]
    authority: source
  - id: EXT-1041
    type: constraint
    summary: "Each research effort should produce an artifact and may surface novel ideas."
    quote: >-
      for today let's let's start with research and for each research you produce an artifact if you have novel ideas i'm okay with them
    cite: SRC-02-C0006
    topics: [research, artifacts, ideation]
    authority: source
  - id: EXT-1042
    type: constraint
    summary: "Dynamic workflows must not use Fable models and should mix Sonnet and Opus."
    quote: >-
      Try mixing Sonnet and Opus models, please
    cite: SRC-02-C0007
    topics: [workflow, models, operations]
    authority: source
  - id: EXT-1043
    type: context
    summary: "A per-currency knowledge-library agent fleet was floated as an agentic-system hypothesis, not a ratified design."
    quote: >-
      this is a brain dump. It's just I want an opinion. Okay, don't take it seriously.
    cite: SRC-02-C0008
    topics: [agentic-system, currency-knowledge, hypothesis]
    authority: source
  - id: EXT-1044
    type: context
    summary: "The proposed currency research fleets would collect books, repositories, papers, and web material into instrument-specific knowledge."
    quote: >-
      it does research, it does, you know, recap, it also generates as much as possible from books, repos, I don't know, research, of course, academic papers, and just information of the internet as much as possible as it can find.
    cite: SRC-02-C0008
    topics: [agentic-system, currency-knowledge, research]
    authority: source
  - id: EXT-1045
    type: decision
    summary: "The restart begins with the framework core rather than the trading node."
    quote: >-
      for this time, we aren't starting with the trading node, we are starting with the core, the actual core.
    cite: SRC-02-C0008
    topics: [build-order, qmf-core, trading-node]
    authority: source
  - id: EXT-1046
    type: constraint
    summary: "Research findings are never adopted automatically; the agent must present findings and positions for discussion and operator ratification."
    quote: >-
      For the research we shall have to discuss, this discussion is still going on, it's still very, very long, I believe. Because research is going to come back. You have to present me with what you found in the research, what you propose, what you agree with. Then I will see we agree to disagree
    cite: SRC-02-C0009
    topics: [research-protocol, ratification, authority]
    authority: source
  - id: EXT-1047
    type: correction
    summary: "Currency knowledge libraries provide hypothesis fuel and context, not control limits, and their use is optional per strategy."
    quote: >-
      the libraries are not giving us control images, just that they can help us propose new hypotheses and whatnot. Okay, and also in the agents are working, they're not working with thin air.
    cite: SRC-02-C0009
    topics: [currency-knowledge, hypotheses, agent-context]
    authority: source
  - id: EXT-1048
    type: decision
    summary: "A backtesting mechanism belongs inside QMF."
    quote: >-
      when you are building a backtesting mechanism, we can know by the way, which by the way we still need to build as part of QMF. I almost forgot. I want it to be as part
    cite: SRC-02-C0009
    topics: [backtesting, qmf, scope]
    authority: source
  - id: EXT-1049
    type: context
    summary: "Currency knowledge may help choose different pairs for prop-firm evaluation and funded phases."
    quote: >-
      it can help us narrow down, especially prop funds. I believe for prop firms, we can when you are building a backtesting mechanism, we can know by the way, which by the way we still need to build as part of QMF.
    cite: SRC-02-C0009
    topics: [currency-knowledge, prop-firm, pair-selection]
    authority: source
  - id: EXT-1050
    type: death
    summary: "Third-party libraries tied to strategy families such as ICT or SMC must not be adopted."
    quote: >-
      I would really not like using libraries for specific strategy families, I would say. For example, ICT, SMC, macros, micro, scalpers, or whatnot.
    cite: SRC-02-C0011
    topics: [dependencies, strategy-families, toolbox-principle]
    authority: source
  - id: EXT-1051
    type: decision
    summary: "QMF must provide a general toolbox from which the operator and agents can build their own strategy-family libraries."
    quote: >-
      What I would like though is having, should I say, a proper toolbox in order to replicate ideologies from those specific families or those specific hypotheses. I don't know if you get me there. Because my idea would not be me using a third-party SMC library, my idea would be having a framework that allows me to build my own custom SMC library.
    cite: SRC-02-C0011
    topics: [qmf, toolbox-principle, agents, strategy-families]
    authority: source
  - id: EXT-1052
    type: constraint
    summary: "Most strategy-specific detection and rule mechanisms are expected to be built in-house."
    quote: >-
      No maintained library detect zones, honestly, obviously. In fact, most of these are in-house.
    cite: SRC-02-C0012
    topics: [in-house, strategy-components, dependencies]
    authority: source
  - id: EXT-1053
    type: constraint
    summary: "The framework should be stable enough that attention shifts to research, bot development, and trading rather than biweekly platform rewrites."
    quote: >-
      I don't want to update this every two weeks, okay? I mean, true, it's viable, but I really want to try and focus so much on, should I say, actual research development process done of using the platform, yeah, and actual trading than this, whatever than actually like developing the platform itself.
    cite: SRC-02-C0012
    topics: [stability, maintainability, research, trading]
    authority: source
  - id: EXT-1054
    type: decision
    summary: "QMF should include alpha-decay detection that notices live performance falling below backtested expectations."
    quote: >-
      in the very first versions of QMX, we had this thing, it was meant to help detect alpha decay. Now, it was part of QML. In other words, when a stretcher defaults below it's backtested results, yeah, so in other words, the edge is decaying.
    cite: SRC-02-C0012
    topics: [alpha-decay, monitoring, qmf, backtesting]
    authority: source
  - id: EXT-1055
    type: open
    summary: "How to define edge and its baseline across multiple configurable Books remained unresolved."
    quote: >-
      defining what an edge is. Now, based off what I recall, an edge was actually defined by the book, the matrix of the book it is going to be in, or as right now we have discovered the books, not a singular book. Okay, since our system has grown.
    cite: SRC-02-C0012
    topics: [edge, books, alpha-decay, open]
    authority: source
  - id: EXT-1056
    type: constraint
    summary: "Reference repositories and catalog projects are to expand the mental-model search space, not become an adopted implementation by default."
    quote: >-
      I'm not dismissing your previous artifact. No, I feel like it is okay, but I feel like your blast radius was low. Now, I'm trying to give you a little bit more of a blast radius.
    cite: SRC-02-C0012
    topics: [research, reference-repositories, scope]
    authority: source
  - id: EXT-1057
    type: decision
    summary: "Backtesting must be modular enough for each Book to supply different testing mechanisms and for one bot to be tested against multiple Books."
    quote: >-
      I think each book might have different mechanisms of testing. I don't know if you get me, which means we are trying to be as modular as possible. I don't know if that's the right word to even use. So, which means if I'm testing a boat, I can test it against a scalp, I can test it against, you know, different types of scalpers, rather, scalping books.
    cite: SRC-02-C0012
    topics: [backtesting, books, bots, modularity]
    authority: source
  - id: EXT-1058
    type: death
    summary: "Futures and options are permanently out of scope."
    quote: >-
      **Permanent product constraint**: no futures or options,
    cite: SRC-02-C0013
    topics: [markets, futures, options, stocks, scope]
    authority: source
  - id: EXT-1059
    type: constraint
    summary: "Reference studies borrow mental models only, transplant no code, and respect licenses."
    quote: >-
      That's why I said we are borrowing mental models. I refused code specifically for such reasons. Not just about licenses, no.
    cite: SRC-02-C0027
    topics: [research, dependencies, licensing, code-reuse]
    authority: source
  - id: EXT-1060
    type: context
    summary: "BOCPD was recovered as an old MIS model candidate that still requires re-ratification."
    quote: >-
      BOCPD — candidates to re-ratify during the MIS session
    cite: SRC-02-C0013
    topics: [mis, kronos, bocpd, legacy]
    authority: source
  - id: EXT-1061
    type: correction
    summary: "The term simulator means a UI-driven backtest of a bot against a Book and selected conditions, not merely a fill-engine adapter."
    quote: >-
      the simulator was more of a Baptist engine, plus, also against a book or against QMX. But the problem, okay, a back test engine plus a book. So, in other words, you just wanted to see how the exact thing I've actually just explained previously: how a bot performs on a specific book, simple as that, but via a UI.
    cite: SRC-02-C0014
    topics: [simulator, backtesting, ui, books]
    authority: source
  - id: EXT-1062
    type: decision
    summary: "The simulator must support custom conditions and theoretical Books for stress testing."
    quote: >-
      we can create a specific condition or specific variables in our engine, and we just stressed. I don't know if you're getting me. So, I can create a theoretical book and then we test it out.
    cite: SRC-02-C0014
    topics: [simulator, stress-testing, books]
    authority: source
  - id: EXT-1063
    type: decision
