  # ── AD-1 — Contract-hub packages, namespaces, port cardinality ────────────
  - id: EXT-2300
    type: decision
    summary: "AD-1: the packages are qma-core (definitions only, depends only on qmf-core), qma-daemon (the only process that runs anything) and qma-wire (the only cross-boundary contract package), with qma-ui-contract a deferred stub; the Python namespace is qma.* with no blanket qmx. prefix anywhere and plugins and ledger views are named by desk. Every runtime concern enters through a port qma-core defines — MemoryProvider, ModelDeployment, ExecutionEnvironment, KnowledgeSource, ToolAdapter, ComputeProvider, ContextCompiler. qma-core also defines the plugin contribution surface in a plugins/ package beside ports/ — PluginManifest, the PluginContext protocol carrying the cardinality-typed registration methods, HookEvent and HookResult, the closed handle-kind vocabulary (AD-14) and the credential_ref string type (AD-24) — which qma-daemon implements and whose loader it owns, so a plugin imports its contribution types from qma-core and never from qma-daemon. Every contribution point declares a cardinality; every singleton additionally declares an explicit scope key and every multi point is keyed by its fully-qualified plugin_id:local_id. The singletons and their scope keys are MemoryProvider per desk, KnowledgeSource per source_id, ExecutionEnvironment per kind, ComputeProvider per kind and ContextCompiler per daemon; the multi points are tool, tool_adapter, hook, skill, graph_template, model_deployment, toolset and worker_template. There is no ui_view contribution point in v1 and a contribution point with no qma-wire schema may not be registered."
    quote: "Every runtime concern enters through a port qma-core defines: MemoryProvider, ModelDeployment, ExecutionEnvironment, KnowledgeSource, ToolAdapter, ComputeProvider, ContextCompiler"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-1
    topics: [qma, packages, namespaces, ports, cardinality, plugin-surface]
    authority: rider
  - id: EXT-2301
    type: decision
    summary: "AD-1 roster and default-binding law (spine + memlog fixes): the plugin roster is the daemon's declarative startup list of plugins, one entry per plugin_id carrying its version and enable flag — daemon configuration, never a contribution, and unrelated to the QMF package roster of parent AD-2 — and a roster entry whose cardinality OR scope key the daemon cannot resolve at startup is a startup error naming the entry and the unresolved field. The ContextCompiler singleton is a DEFAULT BINDING, not a registration: the daemon's implementation occupies the key only while no plugin binds it, exactly one plugin may bind it (replacing the default at load time as a recorded journal event, never a runtime override) and two plugins binding it is a hard startup error; every other singleton ships no default. An unbound singleton key is a startup error only when a loaded roster entry, plugin manifest or Role grant requires it (naming the port, the key and the requiring unit); an unrequired key stays unbound and its port unavailable — with no MemoryProvider bound recall returns the typed refusal NoMemoryProvider and candidates stage under AD-22, and an ExecutionEnvironment or ComputeProvider kind that no declared environment names is unbound, not an error. Two plugins binding one singleton key is a hard startup error naming both plugin ids, the port and the key — never last-write-wins — and every multi contribution is addressed plugin_id:local_id, unique daemon-wide, a duplicate the same hard startup error. The contribution surface was homed in qma-core and the Multi list closed at eight kinds, with command, ui_view and mission_template removed (memlog L58, L59, L129, L158, L161, L162, L178, L186, L217)."
    quote: "the plugin roster is the daemon's declarative startup list of plugins to load, one entry per plugin_id carrying its version and enable flag; it is daemon configuration, never a contribution"
    cite: SRC-13:.memlog.md:L186
    topics: [qma, plugin-roster, default-binding, contextcompiler, nomemoryprovider, startup-error]
    authority: rider
  # ── AD-2 — Dependency direction ───────────────────────────────────────────
  - id: EXT-2302
    type: decision
    summary: "AD-2: every arrow reads depends on, the diagram is the whole rule, and an edge not drawn is default-deny until ratified in this spine. Plugin halves (daemon, worker, UI) never share process memory and meet only at qma-wire; a plugin worker half is covered by the PLUGIN node (may depend on qma-wire and qma-core, never qma-daemon) while the WORKER node governs non-plugin workers and language adapters, which depend on qma-wire alone. Edge narrowing: the qma-daemon to qmf-risk and qma-daemon to qmf-registry edges are read-and-calculate only — QMA may import their value types, typed refusals and pure calculation surfaces and may write only content-addressed dev-zone candidate artifacts through qmf-registry (AD-14), and may not construct, write, amend or delete a binding record, a Book, BMS or seat record, a control-action record, an exit or protection record, a priority rank or a promotion record, nor call any zone-transition surface. The permitted surface of each edge is enumerated in qma-core and that enumeration is default-deny: a surface not listed is not callable and adding one is a spine amendment. qmf-venue is importable by no QMA package, worker or plugin. The drawn edges are UI to qma-wire, WORKER to qma-wire, PLUGIN to qma-wire and to qma-core, qma-daemon to qma-wire and to qma-core and to qmf-registry/qmf-data/qmf-risk, qma-wire to qma-core, qma-core to qmf-core, and the qmf libraries to qmf-core."
    quote: "The diagram is the whole rule; an edge not drawn here is default-deny until ratified in this spine"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-2
    topics: [qma, dependency-direction, default-deny, read-and-calculate, qmf-venue, diagram]
    authority: rider
  - id: EXT-2303
    type: decision
    summary: "AD-2 L30 reconciliation and diagram fixes: L30 carries a scope annotation (2026-08-21) making its default-deny roster-scoped — it governs the seven QMF roster packages internally, never applications — so QMA's read-and-calculate edge to qmf-risk and qmf-registry is an application dependency under L31, recorded as a declared reconciliation note (the operator's call to tighten rather than remove) and never an amendment of the parent by a child. The plugin worker half was assigned to the PLUGIN diagram node so under default-deny it may import qma.core while a non-plugin worker (WORKER node) may not. The container and deployment diagrams draw the three daemon-to-remote qma-wire edges as dial-out (the research node, the sandbox and the computer-use VPS each dial the daemon) and replace any negative edge to the trading node with an AD-28 barrier label, since a drawn edge with a negative label reads as the opposite of default-deny (memlog L60, L101, L113, L253)."
    quote: "L30 says nothing imports qmf-risk; this spine reads L30 as QMF-internal and narrows rather than removes - operator's call to tighten"
    cite: SRC-13:.memlog.md:L60
    topics: [qma, l30, l31, application-dependency, plugin-worker-node, dial-out]
    authority: rider
  # ── AD-3 — No parallel base for anything qmf-core defines ──────────────────
  - id: EXT-2304
    type: decision
    summary: "AD-3: QMA refusal types are variants of qmf-core's typed-refusal base, ids and correlation_id are qmf-core types, fp1 is imported and never re-derived, and money and time follow the parent's exact types. qma-core may add nouns and refusal variants but may not define a second base for anything qmf-core already defines, and no unit may re-mint one (L31, DEC-0122). Content addressing has exactly one construction: a content-addressed id is fp1 over the value's canonical JSON, and a tree digest — AD-19 corpus snapshots, AD-17's ExperimentSpec, AD-14's candidates and AD-8's artifact registry — is fp1 over a canonical manifest of per-file fp1 values. One scheme, verifiable by the single imported implementation; a second Merkle or hash construction is never defined."
    quote: "QMA refusal types are variants of qmf-core's typed-refusal base; ids and correlation_id are qmf-core types; fp1 is imported, never re-derived"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-3
    topics: [qma, no-parallel-base, fp1, content-addressing, tree-digest, typed-refusal]
    authority: rider
  - id: EXT-2305
    type: decision
    summary: "AD-3 content-addressing unification (memlog L61): four previously unreconciled hash schemes were collapsed into one construction — a content-addressed id is fp1 over canonical JSON, and a tree digest (AD-19 snapshots, AD-17 ExperimentSpec, AD-14 candidates, AD-8 registry) is fp1 over a canonical manifest of per-file fp1 values — so no unit re-mints fp1 for wire convenience and no second Merkle construction is ever defined."
    quote: "one construction only - a content-addressed id is fp1 over canonical JSON, and a tree digest is fp1 over a canonical manifest of per-file fp1 values. Four unreconciled schemes collapsed into one"
    cite: SRC-13:.memlog.md:L61
    topics: [qma, content-addressing, tree-digest, fp1, unification]
    authority: rider
  # ── AD-4 — Daemon language: one Python runtime, workers over the wire ──────
  - id: EXT-2306
    type: decision
    summary: "AD-4: the daemon is a single Python 3.14 asyncio process; hooks and verifiers run inside it, and the RLM kernel is a persistent Python interpreter inside the Analysis worker's Docker container supervised by the daemon over the typed host_request bridge (AD-14), never in the daemon process. Language-specific workers and non-Python clients — the Rust UI included — connect over qma-wire as clients and never re-implement a qmf contract, and money, time, fp1 and correlation_id never cross a language boundary. This prevents re-implementing QMF contracts across a language boundary and forbids a second daemon runtime."
    quote: "The daemon is a single Python 3.14 asyncio process. Hooks and verifiers run inside it; the RLM kernel is a persistent Python interpreter inside the Analysis worker's Docker container, supervised by the daemon over the typed host_request bridge, never in the daemon process"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-4
    topics: [qma, daemon-language, python-3.14, rlm-kernel, workers-over-wire, single-runtime]
    authority: rider
  - id: EXT-2307
    type: decision
    summary: "AD-4 RLM kernel placement fix (memlog L109): hooks and verifiers run in the daemon while the RLM kernel is a persistent Python interpreter inside the Analysis worker's Docker container, supervised over the typed host_request bridge (AD-14), never in the daemon process — resolving the AD-4 versus AD-14 versus container-diagram contradiction and settling that AD-28's image and network boundary applies to the kernel."
    quote: "hooks and verifiers run in the daemon; the RLM kernel is a persistent Python interpreter inside the Analysis worker's Docker container, supervised over the typed host_request bridge (AD-14), never in the daemon process"
    cite: SRC-13:.memlog.md:L109
    topics: [qma, rlm-kernel, host_request, ad-28-boundary, placement-fix]
    authority: rider
  # ── AD-5 — The daemon-to-UI wire contract ─────────────────────────────────
  - id: EXT-2308
    type: decision
    summary: "AD-5: daemon and UI are two products joined by one versioned contract — commands (mutate, acked immediately, side effects settle asynchronously), queries (read durable state) and a durable event stream — so closing a client never stops an agent and an overnight agent need not know a client exists. The wire envelope carries v, type, id, producer_id, correlation_id, scope_path, optional seq and payload; producer_id is the stable identity of the minting client, worker or daemon component, assigned at the initialize handshake, unchanged across reconnects, and the first half of the idempotency pair. scope_path is an ordered array of kind plus id segments in the fixed order desk, quant, mission, task, session, agent, subagent, with Session between Task and Agent because a Task outlives its session (AD-12); the order is part of canonical JSON. One seq one referent: seq is always the per-scope projection index of the scope named last in scope_path, and journal_seq never appears on the wire as seq. Transport is JSON-RPC 2.0 over WebSocket with HTTP GET for queries, an MCP-style initialize handshake negotiating a semver protocolVersion plus capabilities, and JSON-Schema-described message families; compatibility is additive-only within a major, unknown types and fields ignored by older clients, deprecations living wire.deprecation_minors (default 2) then dropped, with qma-wire the sole compatibility authority. The vocabulary seeds from the packet's 26 nouns — 9 commands, 7 queries, 10 noun.verb events — as a closed-and-addable registry."
    quote: "The wire envelope carries v, type, id, producer_id, correlation_id, scope_path, optional seq and payload"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-5
    topics: [qma, wire-envelope, scope-path, jsonrpc, protocol-version, 26-nouns]
    authority: rider
  - id: EXT-2309
    type: decision
    summary: "AD-5 transport posture, attach and correlation_id (spine + memlog): the daemon binds loopback by default; any non-loopback bind requires TLS (wss:// plus HTTPS for queries) AND an explicit recorded operator configuration, every client authenticates with a Credential-Broker-resolved credential before protocol bytes, and an unauthenticated or plaintext non-loopback bind is a hard startup refusal. A remote worker or deployed Quant dials OUT to its daemon and the daemon never dials in — no inbound port on the deployed side, no external relay (AD-20) — while the daemon's own listener is the single inbound port, non-loopback only under that TLS-plus-recorded-configuration rule. wire.attach(scope, since_seq) and wire.detach are client state only, session replay is wire.attach(since_seq=0) read-only, and a wire.attach carrying a cursor from another scope is refused with the typed refusal CursorScopeMismatch. Every wire command is idempotent on the pair producer_id plus id and the daemon keeps a dedup cursor whose window is wire.dedup_window. correlation_id has exactly three minting origins — an originating operator command, a scheduled trigger (AD-29), and a daemon-internal lifecycle act (crash recovery, the expiry of a dispatch_lease or an environment_lease, an automatic migration checkpoint, and the two AD-23 daemon-job trims of the mailbox delivery projection and the telemetry store) — is copied verbatim onto every downstream record and never regenerated, derived or truncated, and a record without one is refused at the gate except an evidence append, recorded under a daemon-minted lifecycle id annotated correlation_missing (L39). Snapshots are authoritative; progress events are explicitly not (memlog L54, L55, L56, L57, L111, L163, L164, L237, L264)."
    quote: "daemon binds loopback by default; any non-loopback bind requires TLS (wss plus HTTPS queries) AND an explicit recorded operator configuration"
    cite: SRC-13:.memlog.md:L54
    topics: [qma, transport-posture, dial-out, cursorscopemismatch, correlation-id, correlation_missing]
    authority: rider
  # ── AD-6 — One journal, one writer, one clock ─────────────────────────────
  - id: EXT-2310
    type: decision
    summary: "AD-6: persistence is JSONL append journals plus SQLite in WAL mode behind qmf-data sinks, with DuckDB holding rebuildable fold views only. A single append-only journal with a global monotonic journal_seq is the only durable append target for daemon-owned events and journal_seq is the single total order; the event journal is evidence — append-only, retained under the ledgers' law, backed up under AD-27, never trimmed — and is neither a ledger (AD-9) nor telemetry (AD-23). The closed store list separates journal-derived projections (per-scope event streams, mailboxes and delivery state, the daemon-held operator approval queue readable only by an operator-principal connection, Task Graph state, Session and Agent records, desk ledger views, the ledger quarantine stream, and the daemon's declarative registries collectively the definition store — 16 members) from declared independent stores each with one named writer and one append path: the three ledger stores, the artifact store, the telemetry store, the AD-22 staging store and an admitted MemoryProvider's own store; a store not on this list may not be created. Every append to a declared EVIDENCE store also emits a journal announcement naming the store and carrying the record's fp1 (ledger.appended, artifact.registered and siblings); the telemetry store is the one declared store that law exempts because a never-trimmed journal may not grow with a bounded stream. The sole-writer law binds processes: no process other than the daemon writes the journal, the SQLite file or the artifact store, and a read-only fold opens those files read-only on the daemon's host only and never checkpoints. The clock law: every persisted timestamp is UTC from qmf-core's clock via the daemon, every wall-clock policy carries an explicit IANA timezone resolved at evaluation time, and every duration policy is a span from a recorded UTC instant carrying no timezone."
    quote: "A single append-only journal with a global monotonic journal_seq is the only durable append target for daemon-owned events, and journal_seq is the single total order in the system"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-6
    topics: [qma, event-journal, closed-store-list, definition-store, sole-writer, clock-law]
    authority: rider
  - id: EXT-2311
    type: decision
    summary: "AD-6 record law, folds, SQLite and remote durability (spine + memlog): every durable record carries occurred_at and recorded_at (int64 UTC nanoseconds from qmf-core's clock) plus, in every store the announcement law binds, its announcement journal_seq, while a telemetry record carries occurred_at and recorded_at, NO journal_seq, and is ordered by recorded_at and its correlation_id alone (validation fix 2026-08-29, memlog L290); externally-sourced facts additionally carry source and revision. The v1 folds are exactly the desk ledger views, Task/Mission/Session/Agent state (the Session record carrying its execution-model and autonomy axes never its attachment, the Agent record carrying the effective capability set computed at spawn), mailbox delivery state and ack cursors, deployment and provider health, staging and application state, and each definition-store registry — every fold taking journal_seq as ordering key, as_of over recorded_at as knowledge-time bound and equal instants disposed by ascending journal_seq; per-scope event streams and the ledger quarantine stream are filtered projections, not folds, and a new fold is a spine amendment. On SQLite the daemon adds exactly one connection in one thread with every checkpoint on it, under which the WAL-reset bug is unreachable so 3.51.3 is not a v1 floor (the daemon asserts sqlite3.sqlite_version at startup), and 3.51.3 or the 3.50.7 backport becomes a hard floor only if a second writable connection or separate checkpointer is introduced. A remote or partitioned worker holds a durable ordered fsynced outbox (never a journal, never folded, discarded on ack) whose depth and spool bytes are registered AD-26 variables; on exhaustion it blocks dispatch of new work rather than discarding a pending evidence append (L39) and telemetry is discarded first (AD-23), and an environment lost with a non-empty outbox marks that Task's ledger unknown_tail at the last acked id (memlog L49, L50, L51, L52, L53, L134, L142, L165, L166, L167, L187, L201, L216, L227, L241, L265, L278, L284, L285, L290)."
    quote: "the announcement journal_seq stamp is required only in every store the announcement law binds; a telemetry record, whose store that law exempts, carries occurred_at and recorded_at, no journal_seq, and is ordered by recorded_at and its correlation_id alone"
    cite: SRC-13:.memlog.md:L290
    topics: [qma, record-law, v1-folds, sqlite-floor, outbox, unknown_tail, telemetry-journal-seq]
    authority: rider
  # ── AD-7 — Ontology, cardinality and address grammar ──────────────────────
  - id: EXT-2312
    type: decision
    summary: "AD-7: the chain is Desk to Role to Quant to Agent to Subagent. Desk is the organizational and workspace unit; Profile is presentation only — a client-side grouping of desk_slugs with a display name, held in client configuration, never daemon state, never a scope_path segment and never an index, filter, permission or routing key. Role is a declarative behavioral contract, close to a system prompt, and stateless. Quant is the persistent named organizational actor instantiated from a Role — name, memory scope, missions, routines, preferences, WakePolicy (AD-20) and mailbox — plus a Quant Ledger opened only while it carries its desk's lead flag and retained if the flag moves; a Quant that never held the lead flag has none. Agent is a running instance; a Subagent is an Agent spawned by an Agent with capabilities no wider than its parent and is a leaf that spawns none (AD-16 blocks it from delegation tools). Session is the run container; Worker is an addressable execution slot and deliberately not an ontology object. Role:Quant and Desk:Quant are both 1:N; exactly one Quant per Desk carries the lead flag and its mailbox is the address for desk-scoped inbound, and a mailbox Envelope whose more specific recipient no longer exists resolves to dead_letter (AD-20). ActorId grammar is quant:<desk_slug>/<quant_slug>, each slug lower-case and 2 to 32 characters, minted only by desk.create and quant.create from an operator principal, with the typed refusal SlugUnavailable on any collision with a current or retired slug, a Role name or a reserved desk prefix token. The five desk_slug values are exactly research, trading, dev, analysis, pm; the five Roles are Researcher, Trader, Developer, Analyst, Product Manager and the five Desks are Research, Trading, Development, Analysis and PM — a Role name never names a Desk and quant is never an adjective. Bot, Seat, Book, BMS and kill switch are platform terms and never name an agentic actor, a naming law that confers no capability prohibition."
    quote: "ActorId grammar is quant:<desk_slug>/<quant_slug>"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-7
    topics: [qma, ontology, quant, actorid, slugunavailable, desks-roles]
    authority: rider
  - id: EXT-2313
    type: decision
    summary: "AD-7 opacity, lead flag and naming law (spine + memlog): an ActorId is stable, never a Role name, never reused, and opaque to every consumer — desk membership is a field on the Quant record resolved through the definition store, never through qmf-registry and never parsed from the slug substring, and no index, view, filter, permission check or route reads the slug; desk membership is mutable by an operator command recording a desk.moved journal event while the ActorId never changes, and a retired desk or Quant keeps a tombstone record reserving its slug forever and carrying its alias. A desk consolidation is a Profile-level collapse only and never renames or retires a desk_slug, ActorId, plugin prefix, memory scope or ledger index key. The five desk_slug values are identical to the plugin prefix tokens research-*, trading-*, dev-*, analysis-*, pm-*, minted once at bootstrap and exempt from the reserved-prefix-token clause they would otherwise fail. The desk-level lead Quant is ratified as a persistent actor from the operator's ledger ruling and his hierarchy words; one lead flag per desk and the lead's mailbox as catch-all were inferred, not ruled, and sit in Deferred (until ruled a second lead flag is a hard startup error and an undeliverable Envelope resolves to dead_letter). The fifth Role is Product Manager not PM so the ratified desk_slug pm stays mintable, and the wire envelope versus the mailbox Envelope are never conflated (memlog L62, L63, L64, L115, L116, L133, L147, L183, L188, L226, L239, L240)."
    quote: "desk membership is a field on the Quant record, never parsed from the slug substring; membership is mutable by operator command recording desk.moved while the ActorId never changes; slugs never reused"
    cite: SRC-13:.memlog.md:L188
    topics: [qma, actorid-opaque, desk-moved, lead-flag, tombstone, naming-law]
    authority: rider
  # ── AD-8 — State ownership ─────────────────────────────────────────────────
  - id: EXT-2314
    type: decision
    summary: "AD-8: the eight store classes are distinct — journal is not ledger is not memory is not knowledge is not artifacts is not context is not telemetry is not staging — and ownership and lifetime are fixed here and nowhere else, the store list itself closed by AD-6. For each store the ownership table fixes owner, who may write, the crossing rule and retention: the event journal (daemon only; an evidence record's only permitted reference to a journal entry is its own announcement journal_seq stamp, the daemon allocating the sequence before the record write so the record stays append-only; keep forever, exempt from trim); Mission/Task Graph (daemon only, agents propose transitions as commands; keep forever); Session/Agent records (daemon-only journal projections, rebuilt from the journal); the Task/Quant/Experiment ledgers (agent-authored through before_ledger_append by the holder of the relevant lease, plus the two daemon-authored exemptions reassigned and unknown_tail and the hook-returned ledger_entry carrying authored_by daemon); the ledger quarantine (daemon only, rebuilt from the journal, exempt from trim); the definition store (daemon-only journal projections, agents propose edits only as AD-22 RefinementProposals with exactly one exception — a mission-scoped template-validated observe-or-deny hook registered through before_hook_register, disposed with the Mission, durable only via AD-22 — role.base written only by an operator-principal role.set_base command, role.overlay proposal-editable); Memory (MemoryProvider one binding per desk, agent proposes and the daemon gate admits, candidates kept until admitted, superseded, invalidated, expired or contradicted); Knowledge (external corpus, nobody writes, Citation carrying source_ref, locator and snapshot_ref, cited bytes copied into the artifact store); Artifacts (the producing agent through before_artifact_register, keep forever with lineage); Staging (agent proposes as a command, the daemon writes, staged content never read by a runtime path); Mailbox/Agent Bus including the operator approval queue (daemon projection over message.* events, a trim never removing an unacked Envelope or an unanswered approval_request); Context (Context Compiler per invocation, never persisted); and Telemetry (daemon harness code only, never an agent, bounded and AD-26-registered with trajectories and session replay exempt)."
    quote: "JOURNAL is not LEDGER is not MEMORY is not KNOWLEDGE is not ARTIFACTS is not CONTEXT is not TELEMETRY is not STAGING; ownership and lifetime are fixed here and nowhere else"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-8
    topics: [qma, state-ownership, definition-store, crossing-rule, retention, single-exception]
    authority: rider
  - id: EXT-2315
    type: decision
    summary: "AD-8 ownership-table completion and fixes (memlog): the table was completed with rows for the event journal, the AD-22 staging store and Context (per invocation, never persisted) plus a Mailbox row, the inequality corrected to the eight-store form, a retention column added to every row and the Mission/Task Graph crossing rule set to _ref only. Memory retention was restated against AD-18's closed validation_state vocabulary (admitted, superseded, invalidated, expired, contradicted), the MemoryProvider scope key aligned to one binding per desk, and the artifact write cell widened to the AD-19 citation copy written by the daemon through before_artifact_register with authored_by the citing Agent. The Telemetry write cell reads daemon harness code only, never an agent; the definition-store row names the 16-member enumeration and, after the 2026-08-29 fixes, records exactly one agent write path outside AD-22 (the AD-11 mission-scoped observe-or-deny hook), that role.base is a definition-store record written only by an operator-principal role.set_base command while role.overlay stays proposal-editable, and that unknown_tail joins reassigned as the second daemon-authored Task Ledger entry kind (memlog L65, L117, L118, L168, L180, L216, L229, L266, L278, L285, L292, L296)."
    quote: "three missing stores added as rows - event journal, AD-22 promotion staging, Context (per invocation, never persisted) - plus a Mailbox row"
    cite: SRC-13:.memlog.md:L65
    topics: [qma, ownership-table, validation-state, role-base, role-overlay, unknown_tail]
    authority: rider
  # ── AD-9 — Ledgers: task, quant, experiment; everything else is a view ─────
  - id: EXT-2316
    type: decision
    summary: "AD-9: three ledger stores exist and everything else is a view. The Task Ledger is owned by the Task — one per Task for its whole life across every Agent that ever holds it — recording what happened, when, what failed and why, what the agent did to resolve it, and which model and agent did what, persisted in the daemon store through the wire; never-shared-between-agents means no ledger spans two Tasks and no Agent appends to a Task it does not hold, not that a resumed Task starts a second ledger. Append rights follow a single dispatch_lease per Task (distinct from AD-17's per-slot environment_lease), every entry carrying attempt_no, authored_by (agent ref plus the owning Quant's ActorId, or daemon on a daemon-authored entry naming no model deployment) and the model deployment used; a reassignment — any change of the Agent holding the dispatch_lease, including a resume that must re-acquire it — is a daemon-authored entry of kind reassigned incrementing attempt_no, while a resume from defer retains the dispatch_lease and writes no reassigned entry; before_ledger_append refuses an append from a non-holder of the relevant lease, with exactly two exempt authors — the daemon for the daemon-authored kinds reassigned and unknown_tail, and a ledger_entry returned by before_task_complete or review_required — both still schema-validated. The Quant Ledger is a desk lead Quant's own larger work ledger (mission opened and closed, delegation, escalation, standing decisions), appended only through before_ledger_append by an Agent of that Quant holding the quant_ledger_lease, granted to at most one Agent at a time, and it survives movement of the desk lead flag. The Experiment Ledger is one per Experiment, owned by the registering Quant and appended by the holder of the registering Task's dispatch_lease. Research, Trading, Development, Analysis and PM ledgers are read-time views indexed by desk, quant, agent, mission, task, experiment and date, never stores."
    quote: "Task Ledger - owned by the Task: one per Task for its whole life, across every Agent that ever holds it"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-9
    topics: [qma, task-ledger, quant-ledger, experiment-ledger, dispatch-lease, desk-views]
    authority: rider
  - id: EXT-2317
    type: decision
    summary: "AD-9 ledger writers and reassignment-versus-resume (memlog): the Task Ledger is appended by the holder of that Task's dispatch_lease, the Quant Ledger by an Agent of the owning Quant under the quant_ledger_lease, and the Experiment Ledger by the holder of the registering Task's dispatch_lease — so two Tasks registering against one Experiment never produce two simultaneous authors. A reassignment (any change of the dispatch_lease holder, including a resume that must re-acquire it after release) is a daemon-written reassigned entry incrementing attempt_no, while a resume from defer retains the dispatch_lease and leaves attempt_no unchanged. The desk ledger view fold contract is stream the three ledger stores' ledger.appended announcements filtered by index key, ordering key the announcement journal_seq, knowledge-time bound as_of over recorded_at, equal instants by ascending journal_seq. unknown_tail is the second daemon-authored Task Ledger entry kind beside reassigned, the exempt author set staying exactly two (the daemon and a returning completion or review hook), and the entry shape allows authored_by daemon with no model deployment (memlog L66, L67, L121, L149, L189, L248, L279, L296)."
    quote: "a reassignment - any change of the Agent holding the dispatch_lease, including a resume that must re-acquire it after release - is a daemon-written reassigned entry incrementing attempt_no, while a resume from defer, which retains the dispatch_lease, writes no reassigned entry"
    cite: SRC-13:.memlog.md:L248
    topics: [qma, ledger-writers, reassigned, unknown_tail, dispatch-lease, fold-contract]
    authority: rider
  # ── AD-10 — Hooks are the single enforcement surface ──────────────────────
  - id: EXT-2318
    type: decision
    summary: "AD-10: hooks are the single enforcement surface. Every event declares its phase in its name except the two declared phase-less blocking controls agent_stop and review_required which fire before the act they gate; a before_* event and those two controls are the only ones that may return deny, ask or defer; block_stop is legal only on those two controls; allow is legal on every before_* event and on after_tool and is the nothing-returned resolution there; on the two controls nothing-returned resolves to observe; updated_input and updated_output are fields of HookResult (updated_input before_tool only, updated_output after_tool only), never decisions, and every other after_* event may return only observe; an illegal decision or field for a phase is refused at registration. The v1 registry is closed-and-addable: a before_ and an after_ event for each of 23 daemon-owned verbs — tool, task_create, task_complete, ledger_append, memory_write, skill_write, artifact_register, experiment_register, env_create, env_remove, subagent_spawn, message_send, graph_transition, session_start, session_end, mission_start, mission_complete, plugin_activate, plugin_deactivate, routine_fire, hook_register, proposal_stage, proposal_apply — plus exactly the two phase-less controls. Every new daemon-owned primitive ships a before_<verb> and an after_<verb> event, and an agent-reachable write into any daemon-owned store passes a before_* hook without exception. HookResult is one tagged union carrying decision, reason, updated_input, updated_output, injected_context (before_* only, reaching the Context Compiler never the Ledger), ledger_entry and verifier_ref (before_task_complete and review_required only); decisions have the total precedence block_stop over deny over defer over ask over allow over observe, parallel hooks resolving most-restrictive-wins. Fail-closed with three carve-outs: before_ledger_append fails open (a timeout resolves to allow, an explicit deny quarantines the entry and never discards it), an agent_stop timeout resolves to observe and any after_* timeout resolves to observe, while every other before_* event and review_required stay fail-closed. Every hook is a deterministic Python callable or subprocess, no prompt-type or agent-type handlers, and completion runs a deterministic verifier script with ReviewPolicy enforcing author_family not equal reviewer_family and the typed refusal NoEligibleReviewer when none qualifies."
    quote: "An agent-reachable write into any daemon-owned store passes a before_* hook without exception; a primitive whose write path has no hook event is a defect in this registry, never an exemption"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-10
    topics: [qma, hooks, phase-law, hookresult, fail-closed, verifier, noeligiblereviewer]
    authority: rider
  - id: EXT-2319
    type: decision
    summary: "AD-10 ask, defer, escalate, per-control and source bounds (spine + memlog): ask suspends the invocation and emits exactly one approval_request into the mailbox or operator approval queue named by its Mission's approval_route when the Mission carries one and into the owning Quant's mailbox otherwise — the single human-approval channel every gate in the spine raises and one wire command answers — carrying a required ask_timeout and an on_timeout of deny or escalate. escalate re-emits the same approval_request exactly once (into the operator approval queue when the route carried the reserved value operator, into the owning Quant's mailbox when it named an ActorId, into the desk lead Quant's mailbox otherwise) and restarts ask_timeout once, a second expiry resolving to deny with reason ask_escalation_exhausted; it never resolves to allow. A session whose autonomy axis is autonomous resolves ask to deny with reason no_interactive_authority unless the Mission carries an approval_route whose final hop is the reserved operator route value and a timeout, while a route whose final hop is any ActorId resolves ask to deny. defer parks the work durably, releases the environment_lease and retains the dispatch_lease so resume is not a reassignment, re-runs the full hook chain on resume, and an unresolved ask or defer never holds an environment_lease. On agent_stop the legal decisions are block_stop (return the Agent to the next ready Task, AD-29) and observe with a timeout resolving to observe; on review_required they are deny, block_stop and observe with a timeout resolving to deny. A hook's source is one of desk, role, mission, plugin and bounds the events it can ever receive, the daemon applying the bound before the matcher and refusing at registration a matcher that could resolve outside it (memlog L68, L69, L70, L71, L72, L110, L112, L146, L159, L169, L170, L171, L190, L214, L228, L249, L267, L280, L291)."
    quote: "ask suspends and emits ONE approval_request - the single human-approval channel every gate in this spine raises; defer parks durably, releases the environment_lease and retains the dispatch_lease, and re-runs the full hook chain on resume"
    cite: SRC-13:.memlog.md:L71
    topics: [qma, ask, defer, escalate, per-control, source-bounds]
    authority: rider

  # ── AD-11 — Mission-scoped, agent-authored hooks ──────────────────────────
  - id: EXT-2320
    type: decision
    summary: "AD-11: an agent may author a hook only from an approved template, only scoped to its Mission, and only as an observe-or-deny hook whose HookResult may carry decision and reason and nothing else; six mechanical constraints bind it — schema-validated template; permission set is the intersection with the Mission's own and a hook naming a permission the Mission lacks is REFUSED (never silently narrowed); registration folds into the definition store's hook registrations under that Mission's scope and is exposed through a named qma-wire query (no separate Mission audit record); registration writes a journal entry with the correlation_id and passes before_hook_register / emits after_hook_register; the disposer is pushed onto the Mission's exit stack so the hook is removed with the Mission; the hook cannot escalate privilege (may not register hooks/tools/plugins/contributions, may not raise its registry source above mission, may not match an event whose source class is wider than mission). A mission-scoped hook never becomes durable except through AD-22."
    quote: "An agent may author a hook only from an approved template, only scoped to its Mission, and only as an observe-or-deny hook: its HookResult may carry decision and reason and nothing else"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-11
    topics: [qma, hooks, mission-scoped, observe-or-deny, privilege-escalation]
    authority: rider
  - id: EXT-2321
    type: decision
    summary: "AD-11 validation fix (2026-08-29): the registration validator's reject list is CLOSED at exactly five fields — updated_input, updated_output, injected_context, ledger_entry or verifier_ref — the five non-decision/reason fields of AD-10's HookResult tagged union, enumerated here so the check is closed; verifier_ref had been omitted, which would have left a mission-scoped agent-authored hook able to name its own completion verifier (xref FIXED-30). This mission-scoped observe-or-deny hook, registered through before_hook_register and disposed with the Mission, is the single agent write path into a daemon-owned definition store outside AD-22 (AD-8 definition-store single-exception fix, 2026-08-29)."
    quote: "the registration validator's reject list is closed at five - updated_input, updated_output, injected_context, ledger_entry or verifier_ref"
    cite: SRC-13:.memlog.md:L291
    topics: [qma, hooks, validator, verifier_ref, validation-fix, ad-8-exception]
    authority: rider
  # ── AD-12 — Mission and Task Graph: deterministic daemon state ─────────────
  - id: EXT-2322
    type: decision
    summary: "AD-12: an LLM proposes the decomposition, the infrastructure owns the resulting state; the Task Graph is deterministic persisted daemon state and the only place work state lives. A Task is transcript-independent — it carries intent, inputs, refs, acceptance criteria and its Task Ledger so another Agent can be assigned or resume it without the prior Agent's transcript. A Mission is the executable organizational contract (intent, scope, constraints, evidence requirements, capabilities, success criteria, outputs, verification, budget, escalation, termination criteria and an optional approval_route — either an ActorId whose mailbox receives approval_request Envelopes or the reserved route value operator naming the daemon-held operator approval queue that only an operator-principal connection may read/answer, with its own ask_timeout and on_timeout of deny or escalate), owned by exactly one Quant from whose registry record the owning desk is derived; there is no global mission. A route naming a non-existent Quant is refused at Mission compile, never at ask time. The Mission Compiler is deterministic daemon code (never an LLM); where decomposition must be reasoned it emits a decomposition Task whose Agent acts as Mission Director (not a new ontology object) reaching state only as proposed transitions the daemon validates (L35). A deterministic scheduler/dispatcher decide where/when/who/dependencies and grant the dispatch_lease and environment_lease; parallel workers synchronize through the Task Graph, never chat."
    quote: "An LLM proposes the decomposition; the infrastructure owns the resulting state. The Task Graph is deterministic persisted daemon state and the only place work state lives."
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-12
    topics: [qma, task-graph, mission, mission-compiler, mission-director, approval-route]
    authority: rider
  - id: EXT-2323
    type: decision
    summary: "AD-12 state vocabulary: Task and Mission state is a closed-and-addable vocabulary — pending, ready, running, blocked, unknown, done, failed, cancelled — of which the terminal states are exactly done, failed and cancelled and the non-terminal are pending, ready, running, blocked, unknown; a Task reaches exactly one terminal state. The daemon refuses any proposed terminal transition of a DISPATCHED Task not evidenced by a terminal JobHandle (AD-17); a never-dispatched Task carries no JobHandle and may reach only cancelled (written by the daemon); a Mission never carries a JobHandle and its terminal state is computed by the daemon from its Tasks. The JobHandle->Task state mapping is fixed in AD-17, total, and variable by no component. A Task whose handle is unknown may enter only unknown, holds both its dispatch_lease and environment_lease, and blocks completion until an explicit recorded resolution; a Mission containing an unknown Task is itself unknown, never failed. An LLM may propose a transition as a command but can never author a terminal outcome (L35)."
    quote: "Task and Mission state is a closed-and-addable vocabulary - pending, ready, running, blocked, unknown, done, failed, cancelled - of which the terminal states are exactly done, failed and cancelled"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-12
    topics: [qma, task-state, mission-state, terminal-states, jobhandle, unknown]
    authority: rider
  # ── AD-13 — Graph Template, Loop, Skill; the Task Graph name split ─────────
  - id: EXT-2324
    type: decision
    summary: "AD-13: three primitives stand — Skill (reusable procedure and knowledge with progressive disclosure), Loop (an executable control cycle whose stopping_condition, budget and escalation are runtime-owned; v1 loops are authored in-house in the Loop Registry, no self-invented loops, a candidate loop reaches the registry only through AD-22), and Graph (topology and dependencies across actors, above Loop). Name split: the authored, plugin-contributed, versioned artifact is a Graph Template holding no runtime state; the daemon's Task Graph is the only place work state lives. A Loop is invoked as a node kind inside a Graph Template. Compilation law: instantiating a Graph Template emits a Task Graph of nodes; the only node kinds that emit Tasks are task, agent and loop; conditional, parallel_branch, join, approval_gate, human_gate, deterministic_script and artifact_dependency instantiate as daemon-evaluated Task Graph nodes carrying node state, hold neither lease, carry no ledger and never emit a Task. Node kinds are task, conditional, parallel_branch, join, approval_gate, human_gate, deterministic_script, loop, agent and artifact_dependency. There is no loop contribution point (AD-1); back-edges are invalid and rejected at registration; a template is never mutated by a run. Skill != Loop; a Skill may invoke a Loop."
    quote: "the authored, plugin-contributed, versioned artifact is a Graph Template and holds no runtime state; the daemon's Task Graph is the only place work state lives"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-13
    topics: [qma, graph-template, task-graph, loop, skill, node-kinds]
    authority: rider
  - id: EXT-2325
    type: decision
    summary: "AD-13 iteration and gate law: a loop node emits exactly one Task per iteration minted at iteration time by the daemon; iteration count, stopping_condition evaluation, budget and escalation are Task Graph NODE state and never Task fields; Task ids are deterministic from task-graph id, node id, iteration and retry_index (the number of prior Tasks in this node's attempt_of chain), never AD-9's attempt_no (which counts reassignments inside one Task and never changes a Task id). A task node emits one Task the dispatcher assigns; an agent node emits one Task pinned at compile time to the worker_template (AD-22) its template names, which the dispatcher may not substitute. A retry after terminal failure mints a NEW Task carrying attempt_of; re-dispatch of a still-open Task is a reassignment (change of dispatch_lease holder), not a retry. An approval_gate raises its approval_request through AD-10's ask and is subject to ask_timeout / on_timeout so it can resolve without an answer; a human_gate raises the same approval_request but never times out — it blocks until an operator principal (AD-24) answers, and a candidate flagged money_path_relevant (AD-14) may pass only a human_gate. v1 ships NO graph_template in qma-daemon; every named cycle (Act-Observe-Verify, Hypothesis-Test-Learn-Mutate-Gate) arrives as a plugin-contributed graph_template addressed <plugin_id>:<local_id>. No graph-engine candidate was studied; the implementation choice is carried by a Deferred row."
    quote: "a loop node emits exactly one Task per iteration, minted at iteration time by the daemon; iteration count, stopping_condition evaluation, budget and escalation are Task Graph node state and never Task fields"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-13
    topics: [qma, iteration-law, approval-gate, human-gate, graph-template, deferred-engine]
    authority: rider
  # ── AD-14 — Two runtimes, session axes, handles ───────────────────────────
  - id: EXT-2326
    type: decision
    summary: "AD-14: one loop-and-state contract with two implementations — Dialogue Runtime serves every desk; RLM Runtime v1 is scoped BY DESK to the Analysis desk (analysis-*), never by Role (Analyst is the Role, Analysis the desk; 'the Analyst desk' is never written). The RLM kernel is a persistent Python interpreter inside the worker's Docker container reaching the host through a typed host_request bridge — a qma-wire message family, never a second channel: every host call is a wire command/query issued by the worker under the Task's scope_path and correlation_id, its verb set closed-and-addable in qma-wire, every verb maps to exactly one daemon-owned primitive and runs that primitive's before_* hook (AD-10), and a host call with no mapped primitive returns the typed refusal UnknownHostRequest; async spawn returns an AD-17 JobHandle; depth cap 2. The Analysis interactive notebook surface is provided in-house on that worker and RLM kernel, reached as a Tool Registry entry, never a hosted notebook service (operator, T-4954). Session axes are orthogonal — execution model dialogue or rlm, attachment attached or detached, autonomy interactive/semi/autonomous; no separate background-session type. The durable Session record carries the execution-model and autonomy axes only; attachment is client state, never persisted, which makes closing a client harmless. Both runtimes share the model proxy, credential broker, tool/capability registry, hooks, ledgers, memory, knowledge, context compiler, compaction, mission and task graph, compute router, agent bus and telemetry."
    quote: "RLM Runtime v1 is scoped by desk to the Analysis desk, never by Role"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-14
    topics: [qma, dialogue-runtime, rlm-kernel, host_request, session-axes, unknownhostrequest]
    authority: rider
  - id: EXT-2327
    type: decision
    summary: "AD-14 handles and the money-path barrier: handles are daemon-resolved references whose contents never enter a context window, and handle kinds are a closed-and-addable vocabulary owned by qma-core — BacktestHandle, ExperimentHandle, TradeLogHandle, StrategyHandle, KnowledgeHandle, MarketDataHandle — extended only in that registry and never by a plugin. A handle addressing a live or writable money-path record (an open order, open position, binding, Book, seat, BMS record, control action, kill switch or venue session) may not be minted at all. TradeLogHandle and MarketDataHandle address recorded, closed, read-only evidence only. StrategyHandle is bounded (L17, L33): it may create only content-addressed candidate artifacts in the parent registry's existing dev zone, each carrying a QMA-owned origin field; no QMA unit mints or extends a zone value (AD-3); it mutates nothing, every change producing a new content-addressed candidate with a lineage edge to its predecessor. A candidate touching a risk, sizing, exit, protection, binding or priority field is flagged money_path_relevant at creation, and the daemon refuses to emit its approval_request (AD-20) unless the payload carries a field-level diff of exactly those fields under a named qma-wire schema; QMA never mints a value for such a field where the ancestor carries none. Strategy and Bot semantics stay QML-/qmf-registry-owned; QMA holds references and candidates only."
    quote: "handle kinds are a closed-and-addable vocabulary owned by qma-core - BacktestHandle, ExperimentHandle, TradeLogHandle, StrategyHandle, KnowledgeHandle, MarketDataHandle"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-14
    topics: [qma, handle-kinds, money-path, strategyhandle, money_path_relevant, dev-zone]
    authority: rider
  # ── AD-15 — Model proxy: ModelClass to Deployment to Credential Broker ─────
  - id: EXT-2328
    type: decision
    summary: "AD-15: the chain is deterministic and never an LLM — a ModelClass request resolves against a Deployment Registry whose credentials resolve through a separate Credential Broker. ModelClass has exactly four values — REASONING_HIGH, WORKHORSE_GENERAL, CODING_HIGH, FAST_CHEAP — a cost and difficulty tier. Selection is two-stage and never crosses a class boundary in either direction: stage one the requested ModelClass selects the candidate pool (only deployments registered under that class); stage two the request's needs flags (tools, vision, reasoning_effort, parallel_tool_calls) plus min_context_tokens are the sole eligibility filter. An empty filtered pool returns the typed refusal NoEligibleDeployment naming the class and the unmet constraint. No substitution: the router never falls back outside the requested class nor to one failing min_context_tokens or a needs flag. Within the eligible pool it load-balances under a routing policy of failover, weighted_round_robin, quota_lowest or fill_first and returns ModelCapabilities to the Context Compiler. Every Deployment carries an OPTIONAL operator-assigned model_family field — unset at registration, never defaulted or synthesized, independent of ModelClass and provider account (registered under AD-26); AD-10's ReviewPolicy compares it and the daemon returns NoEligibleReviewer when none qualifies. A plugin-contributed model_deployment registers with no model_family (assigned only by an operator-principal command; a manifest declaring one is refused at load); an unassigned family is routable but ineligible for every ReviewPolicy comparison. The harness picks the class; an agent never names a vendor."
    quote: "ModelClass has exactly four values - REASONING_HIGH, WORKHORSE_GENERAL, CODING_HIGH, FAST_CHEAP"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-15
    topics: [qma, model-proxy, modelclass, model_family, noeligibledeployment, noeligiblereviewer]
    authority: rider
  - id: EXT-2329
    type: decision
    summary: "AD-15 local-proxy custody and pooling: a Deployment whose implementation is a local proxy (OpenCodex or any other) carries auth_mode: none on the QMA side — QMA passes it no credential and no QMA-resolved secret ever crosses into the proxy's process; the proxy's own provider credentials are its own custody, outside QMA's namespace (AD-24 allowlist), never read/copied/migrated/referenced by QMA. OpenCodex sits behind the Deployment contract and deliberately NOT behind the Credential Broker, as the first implementation for OAuth and subscription-pool providers; QMA-owned credentials resolve through the Credential Broker from the OS secret store (L34), never from a third-party tool's home-directory files. Local-proxy bind (operator ruling): the daemon permits a proxy Deployment only when it binds loopback (127.0.0.1 or ::1) on the daemon's host, verified at registration; any non-loopback or remote proxy is refused with NonLoopbackProxy. A loopback proxy that accepts unauthenticated connections is permitted only by the AD-26 configurable proxy.allow_unauthenticated_loopback (default true, ui-editable) and is refused with UnauthenticatedProxy when that variable is false; at every startup the daemon records an evidence entry naming each registered proxy Deployment and the value of that setting. Multi-account pooling (operator ruling): QMA never pools accounts itself; where pooling exists it happens inside the operator's own proxy under the operator's account terms, QMA registers each proxy target as one logical Deployment and records the true deployment honestly on every routing decision (AD-23)."
    quote: "A Deployment whose implementation is a local proxy - OpenCodex or any other - carries auth_mode: none on the QMA side"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-15
    topics: [qma, local-proxy, auth_mode, nonloopbackproxy, unauthenticatedproxy, account-pooling]
    authority: rider
  # ── AD-16 — Tool Registry, capability ladder, the tool that does not exist ─
  - id: EXT-2330
    type: decision
    summary: "AD-16: one Tool Registry spans native, CLI, plugin, MCP-adapter, browser, computer-use and backtest tools, and everything resolves through it — MCP is an adapter inside the registry, configured per desk and role by tool_adapter records in the definition store. A plugin-contributed tool_adapter carries no desk-and-role binding: the binding is written and upgraded only by an operator-principal wire command, a manifest declaring one is refused at load (the same split AD-15 applies to model_family). Every entry carries a check_fn availability preflight so a tool that cannot run is excluded before its schema reaches the model. Toolsets are named, versioned definition-store records listing fully-qualified tool ids only (<plugin_id>:<local_id>), contributable by a plugin and editable through AD-22. A Role grants a toolset, a Mission narrows and never widens it, a Subagent inherits no more than its parent and is blocked from delegation and memory-write tools at the leaf. The capability ladder has six rungs and the lowest capable one wins (P-10): API or structured tool, CLI, containerized program, browser automation, visual browser or computer-use, persistent remote desktop. The effective capability set is computed once by the daemon at Agent spawn as an ordered narrowing — role.base is the ceiling, narrowed in order by role.overlay, then Mission, then parent — where every step after role.base may only remove and never add; AD-22's validator refuses at application any overlay entry naming a tool or toolset outside role.base's grant. The result is recorded verbatim on the Agent record and never recomputed for a running Agent."
    quote: "The capability ladder has six rungs and the lowest capable one wins"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-16
    topics: [qma, tool-registry, capability-ladder, toolset, effective-capability-set, role-base]
    authority: rider
  - id: EXT-2331
    type: decision
    summary: "AD-16 the tool that does not exist: Trading-desk tools are read-only market data, read-only portfolio and positions, and risk calculation with no sizing authority. There is NO execution tool at any account role, paper included, and the prohibition is an enumerated act-level deny-list, not a permission policy. The prohibited acts are: submit, amend, cancel or replace an order; open, close, reduce or hedge a position; set or amend protection; size, re-size or mint a sizing decision; create, amend, activate, stand down or delete a bot-to-book binding; set a Book mode, a seat state, a Book or BMS parameter, a priority rank or a capital floor; arm, disarm or change a kill switch or a node control action; transition any registry artifact between zones. register_tool refuses at registration with the typed refusal ProhibitedMoneyPathTool naming the plugin id, the tool id and the matched act, and that refusal is a STARTUP error, never a runtime deny. The check is a deny-list declared in qma-core beside the ladder, applied to every entry regardless of kind and evaluated BEFORE check_fn; an MCP server advertising a prohibited tool is refused WHOLE, not partially bound. No check_fn, permission policy, Role, Mission, hook, toolset or tool_adapter change can lift the refusal — the deny-list is code, not configuration (L36; paper validation is an account role on a real venue). The prohibition binds the act, not the tool name — AD-28 closes the reachability half. The only QMA write path toward the money path is a candidate artifact a human promotes (AD-25)."
    quote: "There is no execution tool at any account role, paper included, and the prohibition is an enumerated act-level deny-list, not a permission policy"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-16
    topics: [qma, money-path, deny-list, prohibitedmoneypathtool, no-execution-tool, startup-error]
    authority: rider
  # ── AD-17 — Execution environments, compute placement, JobHandle ───────────
  - id: EXT-2332
    type: decision
    summary: "AD-17: ExecutionEnvironment declares a kind of local, docker, remote_container, remote_host, browser or desktop, with provider ref, image, mounts, environment allowlist, capabilities, a required network field of none or allowlist (AD-28) and a lifecycle of ephemeral or persistent — the environment is a declared allowlist, never a control channel. Docker-per-worker, ephemeral, is the default; no shared dirty filesystem. Lease law: an ExecutionEnvironment instance grants at most one environment_lease per slot (distinct from AD-9's per-Task dispatch_lease) unless its declaration sets max_in_flight (a registered AD-26 configurable, default 1); the Compute Router queues the rest; remote_host and desktop may never exceed 1; an unknown job holds its environment_lease until an explicit recorded resolution. The agent declares a ComputeRequirement (cpu, memory, disk, optional gpu, capabilities, timeout, max memory, isolation) and the Compute Router places it; agents never know the machine or vendor. A ComputeRequirement naming a kind no registered environment provides returns the typed refusal NoEnvironment (AD-25's unprovisioned desktop is the v1 case). JobHandle carries a job id and a state of queued, running, done, failed, cancelled, aborted or unknown, with submit, JobHandle.attach, wait, JobHandle.reattach, wake, cancel and stream; wake resolves to the owning Quant's mailbox at submit time. Terminal JobHandle states are exactly done, failed, cancelled and aborted; cancelled = explicit cancel, aborted = environment/supervisor termination without a cancel where non-completion is known. The JobHandle->Task mapping is fixed, total and daemon-applied: queued/running->running, done->done, failed->failed, aborted->failed (reason recorded), cancelled->cancelled, unknown->unknown; aborted never becomes cancelled. UNKNOWN is mandatory: a timeout, lost supervisor or unreachable environment resolves to unknown and never to failed."
    quote: "UNKNOWN is mandatory: a timeout, a lost supervisor or an unreachable environment resolves to UNKNOWN and never to failed"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-17
    topics: [qma, execution-environment, environment_lease, jobhandle, noenvironment, unknown, compute-router]
    authority: rider
  - id: EXT-2333
    type: decision
    summary: "AD-17 experiments and the QMB door: deploying a Quant, a Mission or a Worker to a remote workspace or sandbox is a first-class, UI-driven capability of the wire contract from v1, the vendor deferred. ExperimentSpec is content-addressed: a code ref only when code changes, a resolved-config ref for parameter and configuration changes, plus data ref, environment ref, seed, model and harness version, cost assumptions and a lineage DAG — never a git branch per parameter. QMB is the backtesting path, unchanged: agent to QMA backtest tool to the Backtesting Service — the analysis-backtest plugin's daemon half: one Tool Registry entry plus the single qmb door, holding no scheduling authority, no parallelism and no state of its own — to the qmb CLI or MCP door to QMB. QMA places exactly one qmb job per environment; QMB owns intra-node parallelism, its own run ledger and its artifact contract, and QMA never re-specifies it. The transcript's 'QMX Backtesting Framework' (T-3011, T-3871) names this same pre-existing product QMB; its compute leg is QMB's own, not QMA's Compute Router."
    quote: "QMA places exactly one qmb job per environment; QMB owns intra-node parallelism, its own run ledger and its artifact contract"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-17
    topics: [qma, experimentspec, backtesting-service, qmb-door, analysis-backtest, remote-deploy]
    authority: rider
  # ── AD-18 — Memory: the contract now, the engine later ────────────────────
  - id: EXT-2334
    type: decision
    summary: "AD-18: QMA builds no memory engine in-house. qma-core owns the MemoryProvider contract: propose, admit, recall (token-budgeted, not result-count), get, list, history, supersede, invalidate, expire, scopes; reflect is optional and off (cognition is QMA's). There is NO promote operation on this port: a candidate is admitted, never promoted (Conventions). A MemoryCandidate carries provenance, supporting artifacts, admission_confidence, scope, proposer, occurrence time and supersession; validation_state is one of proposed, validated, admitted, superseded, invalidated, expired, contradicted. admission_confidence is a scalar the daemon's admission gate computes DETERMINISTICALLY from the candidate's provenance, supporting artifacts, corroboration count and validation history; a proposing agent may never set, suggest or influence it and a propose call carrying the field is refused — it is a gate output, never agent input. Until a provider is admitted, recall returns the typed refusal NoMemoryProvider (AD-1) and candidates stage in the AD-22 staging store, each wrapped in a RefinementProposal carrying exactly one memory edit (staging, not memory). Once a MemoryProvider is bound, admission is the daemon's deterministic admission gate alone: the candidate is written through before_memory_write, is never a RefinementProposal, and requires no operator principal. Every memory write passes before_memory_write."
    quote: "There is no promote operation on this port: a candidate is admitted, never promoted"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-18
    topics: [qma, memoryprovider, admission_confidence, nomemoryprovider, validation_state, admit-not-promote]
    authority: rider
  - id: EXT-2335
    type: decision
    summary: "AD-18 surfaced conflict, not an override: Hindsight is the first backend behind the MemoryProvider port, admitted only after a QMA-owned evaluation on real desk experience; its store dependency — a PostgreSQL-with-pgvector or Oracle 23ai database — arrives isolated inside that provider and never touches the QMA journal. The inherited no-database-server rule (DEC-0114, DEC-0117, parent AD-19) is read here as binding QMA's own evidence and metadata stores — journal, ledgers, artifact store, staging, telemetry — never a third-party provider's internal storage sitting behind a QMA-owned port. An admitted MemoryProvider's server is isolated inside that provider, holds no QMA evidence and is never read or folded by QMA. The narrowing is recorded for the operator, and admitting the provider is his decision (an overridable narrowing, not a silent parent amendment)."
    quote: "the inherited no-database-server rule ... is read here as binding QMA's own evidence and metadata stores ... never a third-party provider's internal storage sitting behind a QMA-owned port"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-18
    topics: [qma, hindsight, no-database-server, surfaced-conflict, memory-backend, deferred]
    authority: rider
  # ── AD-19 — Knowledge: a read-only corpus and two different confidences ────
  - id: EXT-2336
    type: decision
    summary: "AD-19: qma-core owns the Knowledge contract with a read-only plain-file library adapter. A KnowledgeSource declares kind, source id and adapter; the plain-file source is read-only and imposes no schema; snapshot() returns a CorpusSnapshot whose id is a content-addressed tree digest with per-file digests. QMX adapts to the library and the library is never built around QMX: no write-back, no QMX folders or fields, no hardcoded layout. Provenance carries source_ref, snapshot_ref, locator, an evidence label (an opaque corpus-authored string QMA stores and surfaces verbatim and never parses, ranks or compares) and an evidence_confidence map of exactly six entries whose keys are declared once per source by the adapter's manifest field confidence_dimensions and are fixed for the life of that source_id; the daemon validates each Citation's key set and count and refuses a mismatch with the typed refusal ProvenanceShapeMismatch. The six values are stored and surfaced, never averaged, compared across sources or scalarized. Name-split law: Knowledge carries evidence_confidence (six dimensions, corpus-owned); Memory carries admission_confidence (one QMA-owned scalar); neither is ever derived from the other, and a memory candidate citing knowledge stores the Citation plus the six dimensions verbatim."
    quote: "Knowledge carries evidence_confidence (six dimensions, corpus-owned); Memory carries admission_confidence (one QMA-owned scalar); neither is ever derived from the other"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-19
    topics: [qma, knowledgesource, corpussnapshot, evidence_confidence, provenanceshapemismatch, name-split]
    authority: rider
  - id: EXT-2337
    type: decision
    summary: "AD-19 reproducibility and search: reproducibility is guaranteed over bytes QMA retains, never over someone else's filesystem. On cite, the daemon copies the cited bytes into the artifact store as a content-addressed evidence copy, registered through before_artifact_register with authored_by set to the citing Agent, and Citations resolve against that copy; a retrieval against a snapshot QMA never copied returns the typed refusal StaleSnapshot and never silently returns current bytes. A Mission pins one snapshot_ref at start and re-pinning is a recorded act; snapshots of one source form a linear supersedes chain. The query surface search, retrieve, cite is a desk-agnostic Tool Registry entry available to every Role granted retrieval; search is literal and locator-based over the CorpusSnapshot — grep-class semantics, no ranking and no embedding — and v1 ships NO index, any ranked or semantic retrieval unavailable until the deferred indexing row is decided. RLM is an additional programmatic path on the Analysis desk, never the only retrieval path. Agent experience never becomes Knowledge silently: a QMA report re-enters only as a distinct source kind with its own snapshot. The source corpus — the operator's STRATS plain-file library — is empty today (its root holds only IDEA.md and its ground-state file) and its folder layout, serialization and stable-id scheme are unratified upstream; indexing waits for both."
    quote: "Reproducibility is guaranteed over bytes QMA retains, never over someone else's filesystem"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-19
    topics: [qma, cite, stalesnapshot, literal-search, no-index, strats, deferred-indexing]
    authority: rider
  # ── AD-20 — Agent Bus: durable, addressed, non-authoritative ──────────────
  - id: EXT-2338
    type: decision
    summary: "AD-20: each Quant owns one durable Mailbox living in the daemon's own store — no external relay. An Envelope carries msg id, from, to, kind, optional mission and task refs, correlation_id, optional reply_to_ref and causation_id, body, artifact refs, priority and creation time. causation_id is the id of the single record that caused this one — per-record, never copied verbatim down a chain the way correlation_id is, and (like correlation_id) excluded from fp1 identity by explicit versioned declaration. MessageKind is one of handoff, reply, notify, review_request, status, question, approval_request; approval_request is the single human-approval channel AD-10 defines and every gate in this spine raises. DeliveryState is one of delivered, queued, woke, deferred, dead_letter. WakePolicy is a field of the Quant record in the definition store (operator-authored, ui-editable under AD-26, scope quant) carrying wake conditions, quiet hours (a daily interval plus its IANA zone) and max wakes per window; the deterministic scheduler evaluates it at delivery time and no model authors, alters or overrides it. Quiet hours suppress wakes only: a message arriving inside them is still delivered and acked, its DeliveryState is deferred, and the wake fires at the next end of quiet hours; quiet hours never suppress a Routine firing (AD-29), never pause an in-flight run and never delay an approval_request reply. Delivery is at-least-once with idempotent msg-id dedup, a per-actor ack cursor and bounded retention."
    quote: "Each Quant owns one durable Mailbox living in the daemon's own store - no external relay"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-20
    topics: [qma, agent-bus, mailbox, envelope, messagekind, deliverystate, wakepolicy]
    authority: rider
  - id: EXT-2339
    type: decision
    summary: "AD-20 non-authoritative invariant and retention: the bus is not institutional memory. Retention boundary — the Mailbox is a projection over journal message.* events, and its bounded retention governs the delivery projection only (queue depth, ack cursor, redelivery window) and never deletes a journal record; no journal record is ever trimmed (AD-8, AD-23). Non-authoritative invariant: a message may request work but can never BE the work; a handoff becomes real only when it writes a Task; a reviewer's authoritative act is the task update and the message is only the ping. Every send passes before_message_send. External agent-to-agent transport is a later adapter behind the same ActorId contract; no relay or signing protocol is adopted."
    quote: "a message may request work but can never be the work; a handoff becomes real only when it writes a Task"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-20
    topics: [qma, non-authoritative, retention-boundary, mailbox-projection, external-transport, deferred]
    authority: rider

  # ── AD-21 — Plugin model: reversible code, declared-reversible data ────────
  - id: EXT-2340
    type: decision
    summary: "AD-21: a PluginManifest declares id, version, supported qma_api range, desk, dependencies, provided contributions, permissions, entrypoint, migrations and rollback mode. Activation registers every contribution through a scoped plugin context honoring AD-1 cardinality; each registration returns a disposer pushed onto a per-plugin async exit stack, and unload closes the scope LIFO so every contribution disappears together. A missing dependency or a second singleton binding is a hard startup error, never a silent pending state. Reload is an explicit command; there is no file watcher and no reactive re-mount. Load flow: manifest validation, qma_api compatibility, permissions, dependencies, migrations, topological activation, publication of contributions, then clients learn the new contribution points over the wire. Trust is first-party only in v1 — no trust tiers, no capability solver, no plugin store. One logical plugin may span daemon, worker, UI and skills or graph templates; its halves communicate only over the wire contract, never through shared process memory, and a daemon plugin never renders."
    quote: "each registration returns a disposer pushed onto a per-plugin async exit stack, and unload closes the scope LIFO so every contribution disappears together"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-21
    topics: [qma, plugin-model, disposers, lifo, startup-error, first-party]
    authority: rider
  - id: EXT-2341
    type: decision
    summary: "AD-21 data reversibility, daemon-core migrations, load-time refusal law, threading node. Data is the half LIFO cannot undo: every migration declares a `down`, or the manifest declares `rollback: forward_only`. Migrations follow parent AD-20's order in full — preflight, backup first, dry-run, migrate, verify, with a documented restore path (AD-27) — inside a daemon-held transaction preceded by a recorded journal checkpoint written as evidence with the correlation_id; the checkpoint is an ADDITION to the backup, never a substitute. The loader refuses a forward-only upgrade unless an `operator` principal (AD-24) confirms it in that session; a forward-only plugin may be disabled (scope disposed, data intact) but never rolled back; the rollback mode is returned by the install command's preflight query over qma-wire and the operator confirmation is recorded as evidence with its correlation_id — the v1 obligation is stated against the wire, not the deferred UI. Daemon-core migrations follow this rule verbatim: the journal schema, the three ledger schemas, the task-graph tables, the mailbox and the staging store belong to no plugin, and each declares a `down` or `forward_only`, takes operator confirmation for forward_only, writes a checkpoint and runs AD-27's five-step order. LOAD-TIME REFUSAL LAW: every condition the spine calls a hard startup error is a refusal of the load, not of the process — at startup it aborts startup naming the offending unit; on an explicit install, enable or reload command it fails that command with a typed refusal naming the same fields, disposes that plugin's scope LIFO, and leaves the running daemon, every dispatch_lease and environment_lease it holds, and every in-flight Task untouched; no load-time refusal ever terminates a running daemon or discards a pending evidence append (L39). The in-house threading node (operator, T-5071/T-5081, register row 72) must be accommodated by this shape rather than assumed away; its shape is unspecified, so v1 mints no contribution type for it and the manifest's contribution list stays closed-and-addable (Deferred GAP-0077)."
    quote: "Data is the half LIFO cannot undo: every migration declares a `down`, or the manifest declares `rollback: forward_only`"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-21
    topics: [qma, reversibility, daemon-core-migrations, load-time-refusal, threading-node]
    authority: rider
  # ── AD-22 — Admission gate: nothing agent-produced becomes state by itself ─
  - id: EXT-2342
    type: decision
    summary: "AD-22: P-9 binds. The pipeline is a RefinementProposal (summary, rationale, edits, expected outcome) where an edit is a create, update or delete over a kind of `prompt`, `memory`, `skill`, `toolset`, `worker_template`, `hook`, `graph_template`, `loop` or `role`, with id, content and reference -> deterministic validation (schema, immutable base, optimistic-concurrency conflict check) -> deterministic verification by verifier script, test or backtest replay, never an LLM judging itself -> optional cross-model review under ReviewPolicy -> a staged candidate in the STAGING STORE, never live -> approval -> APPLICATION, with recorded before-and-after snapshots per applied edit for rollback. A proposal is applied, never promoted (promote is reserved for L17's live-zone act). No edit kind may name a money-path record, and nothing reaches qmf-registry or a registry zone — AD-2 makes every zone-transition surface uncallable and the one write AD-2 permits (a content-addressed dev-zone candidate, AD-14) is not a RefinementProposal edit and never enters this pipeline. Every application requires an `operator` principal (AD-24), which is why `before_proposal_apply` runs AD-24's operator-principal check; there is no policy, machine, scripted or scheduled approval path for any edit kind, and adding one is a spine amendment. A candidate flagged `money_path_relevant` (AD-14) never reaches an `approval_request` whose payload lacks that field-level diff — stated against the wire. Enters through `before_proposal_stage`, applied through `before_proposal_apply`; both fire their `after_*` siblings once durable. v1 ships the invariants, the staging store and the data model; the evaluation gates switch on when the Deferred self-improvement row (GAP-0074) is met."
    quote: "a staged candidate in the staging store, never live -> approval -> application, with recorded before-and-after snapshots per applied edit for rollback. A proposal is applied, never promoted"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-22
    topics: [qma, admission-gate, refinement-proposal, staging-store, edit-kinds, operator-principal]
    authority: rider
  - id: EXT-2343
    type: decision
    summary: "AD-22 role splits, staging-store record type, worker_template, memory-admission seam. Role splits: `role.base` is operator-authored and immutable to the pipeline — a definition-store record like every other (AD-6), written only by an `operator`-principal `role.set_base` wire command recording a `role.updated` journal event, never by an agent, plugin, hook or any other `machine` principal, and never by this pipeline, whatever a human commits upstream; `role.overlay` is proposal-editable (appended prompt sections, added skills, narrowed toolsets). Role and prompt edits target the overlay only, and the validator rejects any edit whose path resolves into a base. Only definitions are edit targets: no runtime-instanced object is an edit kind, so the durable definition of a spawned worker is `worker_template` — a definition-store record carrying role ref, toolset ref, ModelClass, ExecutionEnvironment ref, ComputeRequirement and permission set, contributable by a plugin as an AD-1 multi contribution — and subagent is not an edit kind. The STAGING STORE has exactly one record type, the RefinementProposal: every staged edit of every kind is one, and a MemoryCandidate (AD-18) is never written to it on its own — it enters only wrapped in a RefinementProposal carrying exactly one `memory` edit. MEMORY-ADMISSION SEAM (memlog 2026-08-29): once a MemoryProvider is bound, admission is the daemon deterministic admission gate alone — the candidate is written through `before_memory_write`, is never a RefinementProposal and requires no operator principal; the AD-22 memory edit kind governs only candidates staged while no provider is bound."
    quote: "role.base ... written only by an `operator`-principal `role.set_base` wire command recording a `role.updated` journal event, never by an agent, a plugin, a hook or any other `machine` principal"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-22
    topics: [qma, role-base, role-set-base, role-overlay, worker-template, memory-admission]
    authority: rider
  # ── AD-23 — Telemetry is a separate system from the ledgers ────────────────
  - id: EXT-2344
    type: decision
    summary: "AD-23: logs, traces, metrics and trajectories are harness-authored, never agent-authored, and live in a separate store with separate contracts from the ledgers (P-12). QMA owns its own trace and metric record types; OpenTelemetry conformance happens at the EXPORT PORT as a swappable adapter, never as an SDK imported into the daemon core; records carry the inherited correlation_id and the wire id. Routing decisions and usage, compute job and log streams, tool-call traces and agent trajectories are telemetry, not evidence; a ledger entry may carry a `trace_ref`, never the reverse. Telemetry travelling from a remote worker rides the same durable outbox as evidence (AD-6), and under back-pressure telemetry is dropped BEFORE evidence, never the reverse. RETENTION EXEMPTION: the AD-6 event journal is evidence and is kept forever (AD-8) — no policy, cadence or job trims it, ever. Agent trajectories, which session replay reads alongside it, are retention-exempt and may not be trimmed by any policy until the deferred rows that revisit on them — external memory backend (GAP-0072), self-improvement evaluation gates (GAP-0074), RLM beyond the Analysis desk (GAP-0080) — have been evaluated and recorded. A telemetry append emits NO journal announcement (the telemetry store is the one declared store the announcement law exempts); a telemetry record carries occurred_at and recorded_at, no journal_seq, and is ordered by recorded_at and its correlation_id alone (memlog 2026-08-29)."
    quote: "a ledger entry may carry a `trace_ref`, never the reverse ... under back-pressure telemetry is dropped before evidence, never the reverse"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-23
    topics: [qma, telemetry, otel-export-port, retention-exempt, trajectories, back-pressure]
    authority: rider
  - id: EXT-2345
    type: decision
    summary: "AD-23 trim mechanism and its closed scope. Only the two bounded non-evidence streams — the mailbox delivery projection (AD-20) and the telemetry store — may be trimmed by a daemon job, and only inside their registered AD-26 retention windows, each trim recorded with its window, its reason and its correlation_id. A trim of the mailbox delivery projection may NEVER remove an unacked `Envelope` or an unanswered `approval_request` — the daemon-held operator approval queue (AD-6) included: the registered window applies only to entries already acked, answered or `dead_letter` (this is what keeps an AD-13 human_gate, which never times out, from being deleted). Outside those registered windows the SAME two bounded streams — and no others — may be trimmed only as a recorded, reason-carrying `operator`-principal action (AD-24), never a background job. No other store may be trimmed by any path: the event journal, the three ledger stores, the artifact store, the staging store, the ledger quarantine stream and the retention-exempt trajectory and replay streams are trimmed by neither path (AD-8 keep-forever, L18). The two daemon-job trims are daemon-internal lifecycle acts under AD-5's third correlation_id origin. (Deferred GAP-0089: the trim window for the bounded non-evidence streams.)"
    quote: "Only the two bounded non-evidence streams - the mailbox delivery projection (AD-20) and the telemetry store - may be trimmed by a daemon job, and only inside their registered AD-26 retention windows"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-23
    topics: [qma, retention-trim, bounded-streams, operator-principal, approval-queue, keep-forever]
    authority: rider
  # ── AD-24 — Permissions and secret custody ────────────────────────────────
  - id: EXT-2346
    type: decision
    summary: "AD-24 permissions and principal classes. A per-Role permission policy is part of the Role contract; a Mission narrows and never widens it; a Subagent is never wider than its parent; plugin permissions are checked at load. Hooks are the single enforcement point in the agent path — before_tool, before_task_complete, review_required, before_ledger_append, before_memory_write — under AD-10's total precedence, and a deny binds under any permissive mode. PRINCIPAL CLASSES: every authenticated wire connection carries exactly one class, `operator` or `machine`. The `operator` class comes only from an interactive human credential presented by a client a human is driving; workers, plugin worker halves, remote deployments, the scheduler, routines and cron, and every daemon-internal caller are `machine`, and no machine principal may acquire, delegate, borrow, cache or impersonate the operator class; the class is recorded verbatim on every command, journal entry and ledger entry. The HUMAN-GATE COMMAND LIST (accepted only from an operator principal, refused from machine with `OperatorPrincipalRequired`; closed-and-addable, the sole authority, extended only by a spine amendment): AD-22 admission approval; AD-21 forward-only migration confirmation; AD-17 UNKNOWN resolution; every retention trim other than the two AD-23 daemon-job trims; plugin install/enable/reload (AD-21); desk.create and quant.create (AD-7); a role.base write via role.set_base (AD-16, AD-22); model_family assignment (AD-15); tool_adapter writes (AD-16); a restore of the live store (AD-27); a Routine catch-up (AD-29); reading or answering an approval_request in the operator approval queue (AD-6, AD-10, AD-12); a desk.moved membership change (AD-7); a Quant record write incl. its WakePolicy (AD-7, AD-20); a Routine record write (AD-29); an ExecutionEnvironment declaration write (AD-17, AD-26); a Mission approval_route write (AD-12, AD-26); a variable.set on a registry-homed AD-26 variable (AD-26); and an AD-13 human_gate answer (a money_path_relevant candidate may pass only that node). A plugin's own contributions are NOT on the list — they reach the definition store through activation as a machine principal, so only their operator-assigned fields (model_family, the tool_adapter desk-and-role binding) appear. QMA mints no registry-promotion or zone-transition command at all; L17's promotion is performed outside QMA and QMA records only the resulting artifact ref."
    quote: "Every authenticated wire connection carries exactly one principal class, `operator` or `machine` ... no machine principal may acquire, delegate, borrow, cache or impersonate the operator class"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-24
    topics: [qma, principal-classes, operator, machine, human-gate-list, operator-principal-required]
    authority: rider
  - id: EXT-2347
    type: decision
    summary: "AD-24 secret custody, egress rule, transport custody. Secrets follow L34: components handle references, never values. The CREDENTIAL BROKER resolves references from an OS secret store behind a backend interface; Windows Credential Manager is the first and only v1 backend (L34) and a second is admitted when the host OS changes. The broker's scope is a code-declared allowlist shipped in qma-core — model and inference providers, compute and sandbox providers, corpus and knowledge sources, telemetry sinks. Venue, broker, exchange, trading-node and platform-registry credentials are outside QMA's namespace and resolvable by no QMA component under any Role, Mission, plugin or permission mode; a reference not on the allowlist returns the typed refusal `CredentialOutOfScope` naming the reference. The allowlist is source code — never settings, never a plugin contribution, never a UI-editable variable, never widened by a Mission; the broker holds no ambient authority — exact-reference resolution only, never enumerate, search, list or glob. EGRESS RULE: a resolved secret value exists only inside the model-proxy or provider-adapter egress call frame and is never stored on, attached to or reachable from any object handed to a hook, plugin or graph; broker resolution is callable only from the adapter layer; the hook and plugin context type exposes credential reference strings exclusively; a hook needing an authenticated call makes it through a registered tool; secrets are excluded from `updated_input`, `updated_output` and `injected_context` by a schema check. A LOCAL-PROXY Deployment is the outward half: `auth_mode: none`, no QMA-resolved value crosses into its process, and its own provider credentials stay in its custody outside QMA's namespace (AD-15). TRANSPORT CUSTODY: the daemon authenticates before protocol bytes and never offers an unauthenticated bind; the client credential is itself a broker-resolved reference; AD-5's transport posture is the matching half — loopback by default, TLS plus an explicit recorded operator configuration for any non-loopback bind, a hard startup refusal otherwise."
    quote: "a reference not on the allowlist returns the typed refusal `CredentialOutOfScope` naming the reference. The allowlist is source code - never settings, never a plugin contribution, never a UI-editable variable, never widened by a Mission"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-24
    topics: [qma, credential-broker, allowlist, credential-out-of-scope, egress-rule, auth-mode-none]
    authority: rider
  # ── AD-25 — Deployment envelope and the live boundary ──────────────────────
  - id: EXT-2348
    type: decision
    summary: "AD-25: the daemon runs on the operator's workstation by default; workers run in Docker on that host; a Quant, Mission or Worker may be deployed to a remote workspace, the research node or a sandbox through AD-17's contract. A single Windows VPS is the registered persistent provider for the single computer-use agent; the operator has said he can purchase one (T-4954) and it is PLANNED, NOT PROVISIONED (GAP-0070) — until an ExecutionEnvironment of kind `desktop` is registered, every computer-use tool fails its check_fn and is excluded before its schema reaches the model (AD-16) and the Compute Router returns the typed refusal `NoEnvironment` for a `desktop` ComputeRequirement (AD-17). The trading-node VPS is untouched by QMA: no agent workload runs there. Overnight autonomy means either the workstation stays on or the mission is deployed to a workspace; mailboxes and the journal live in the daemon's store wherever it runs. QMA's access to the dev and paper zones is READ-ONLY, with exactly one exception: content-addressed candidate artifacts in the dev zone (AD-14). Paper is an account role on a REAL venue, never a sandbox: QMA may read paper market data, paper positions and paper account state and may change none of it, and no QMA rule, tool, environment, permission or test treats a paper account as a place where an act is safe because it is not live; a QMA component needing a writable trading surface uses recorded evidence and QMB replay, never an account of any role. Only a human may PROMOTE a registered artifact into the live zone (L17), performed OUTSIDE QMA: QMA mints no promotion or zone-transition command at all (AD-24) and records only the resulting artifact ref. The authority order bot -> book -> BMS -> operator (L36) and the exit-preservation invariant (L39) belong to the node and nothing in QMA may invert, shortcut or automate them; QMA's output into the money path is a candidate artifact a human promotes — never a binding, a sizing decision or an order; risk, sizing and live-trading authority remain with the GitBook and trading-node corpus."
    quote: "Paper is an account role on a real venue, never a sandbox: QMA may read paper market data, paper positions and paper account state and may change none of it"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-25
    topics: [qma, deployment-envelope, live-boundary, paper-is-real, windows-vps, read-only]
    authority: rider
  # ── AD-26 — Configurable-variable registry ─────────────────────────────────
  - id: EXT-2349
    type: decision
    summary: "AD-26: L38 (DEC-0157) binds QMA. Every REGISTERED variable declares name, owning subsystem, scope (one of global, desk, role, quant, mission, plugin, execution_environment or routine), type, units, default, and `ui-editable` or `uneditable`, in a machine-readable registry shipped in v1. A variable marked `uneditable` is a recorded constant, not a configurable: configurable always means editable in the platform UI (L38). Every recorded number attached to a configurable variable is evidence, never a ratified constant. THE WRITE PATH IS SINGLE PER VARIABLE and the registry row declares which one it is: every registered variable declares a `home` of either `registry` or a named owning record type. A `registry`-homed value is set only by an `operator`-principal wire command (AD-24) recording a `variable.set` journal event; a `variable.set` naming an `uneditable` variable, or naming a record-homed variable, is refused. A RECORD-HOMED value is set only by that record's own operator-principal write command (AD-24), recording that record's own noun.verb journal event; the registry row carries its name, scope, type, units, default and editability and never its value. There is no `variable` edit kind in AD-22 and none is minted: an agent may never propose, stage or apply a variable change, and no hook, Role or Mission may set one; a plugin may carry a record-homed default inside a contribution the loader validates, and may set no registry-homed value."
    quote: "Every registered variable declares a `home` of either `registry` or a named owning record type ... a `variable.set` naming an `uneditable` variable, or naming a record-homed variable, is refused"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-26
    topics: [qma, variable-registry, home, variable-set, ui-editable, uneditable]
    authority: rider
  - id: EXT-2350
    type: decision
    summary: "AD-26 FULL VARIABLE ENUMERATION (name | scope | editability | home), for the registry seat. RECORD-HOMED (moved only by the owning record's operator-principal write command; the registry row carries name/scope/type/units/default/editability, never the value): max_in_flight | execution_environment | ui-editable, default 1, pinned to 1 and uneditable for the remote_host and desktop kinds | ExecutionEnvironment declaration (AD-17). ask_timeout | mission | ui-editable | Mission approval_route (AD-10, AD-12). on_timeout (deny|escalate) | mission | ui-editable | Mission approval_route. quant.quiet_hours (daily interval + IANA zone) | quant | ui-editable | Quant record WakePolicy (AD-20). quant.max_wakes_per_window | quant | ui-editable | Quant record WakePolicy. routine.max_concurrent (the Routine's max-concurrent cap) | routine | ui-editable | Routine record (AD-29). model_family per-Deployment assignment | Deployment-scoped | operator-assigned, optional, a plugin-contributed model_deployment registers with none | Deployment record (AD-15). REGISTRY-HOMED (set only by an operator-principal variable.set): continuation.max_consecutive (AD-29) ui-editable; continuation.budget (AD-29 continuation budget ceiling) ui-editable; continuation.escalation_target (AD-29, = the Agent's Quant mailbox) ui-editable; rlm.depth_cap (AD-14, depth-2) ui-editable; rlm.fanout_cost_ceiling_usd (AD-14/AD-26, USD per 800-variant aggregation, scope desk, distinct from continuation.budget) ui-editable; hook.timeout_* per phase (AD-10, a span from a recorded UTC instant, no zone) ui-editable; wire.deprecation_minors (AD-5, default 2) ui-editable; wire.dedup_window (AD-5/AD-6 dedup cursor) ui-editable; wire.remote_outbox_depth (AD-6) ui-editable; wire.remote_spool_bytes (AD-6) ui-editable; telemetry.retention_window / telemetry trim thresholds event-count + on-disk-size (AD-23) ui-editable; mailbox.delivery_trim_* event-count + on-disk-size (AD-20) ui-editable; store.backup_cadence (AD-27) ui-editable; store.sample_restore_test_cadence (AD-27) ui-editable; store.full_restore_rehearsal_cadence (AD-27) ui-editable; proxy.allow_unauthenticated_loopback (AD-15, default true) ui-editable; review_policy.families (AD-15 enum) ui-editable; deployment.model_family values (AD-15, the closed enum of allowed family values) ui-editable; deferred.finished_mission_trajectory_count (default 50, AD-23/AD-26 self-improvement gate) ui-editable; deferred.sandbox_refusal_count (default 3, AD-25/AD-26 sandbox NoEnvironment count) ui-editable. NOT REGISTERED / DISCREPANCIES: the event journal is NEVER trimmed and mints NO trim threshold (AD-8, AD-23), so the job-spec name journal.retention_* has no spine referent; the job-spec names bus.sticky_limit and routine.budget_hint were removed from AD-26 by memlog L132 as unowned (no owning AD/subsystem/units/default) and replaced by continuation.max_consecutive, continuation.budget and rlm.depth_cap — they are not spine-registered variables. Where AD-26 does not pin a scope for a registry-homed variable (continuation.*, rlm.depth_cap, hook.timeout_*, wire.*, store.*, proxy.*, telemetry.*, mailbox.*, review_policy.families, deferred.*), the spine states editability and home but not scope."
    quote: "max_in_flight, declared per `ExecutionEnvironment` (default 1, `ui-editable`) and pinned to 1 and `uneditable` for the `remote_host` and `desktop` kinds ... `proxy.allow_unauthenticated_loopback` (AD-15, default true, `ui-editable`)"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-26
    topics: [qma, variable-enumeration, record-homed, registry-homed, discrepancy, memlog-l132]
    authority: rider
  # ── AD-27 — Daemon store lifecycle: versioning, migration, backup, restore ─
  - id: EXT-2351
    type: decision
    summary: "AD-27 migration order and store versioning. L18 (DEC-0045) and parent AD-20 bind here in full and nothing weakens either. MIGRATION ORDER: journal, SQLite, ledger, task-graph, mailbox, staging and artifact-store migrations follow parent AD-20's five steps verbatim — preflight -> backup first -> dry-run -> migrate -> verify, with a documented restore path, and never an in-place mutation of the only copy; AD-21's recorded journal checkpoint is an ADDITION to the backup, never a substitute. STORE VERSIONING: the journal and the SQLite store each stamp a `store_schema_version`; the daemon REFUSES TO OPEN AN UNKNOWN VERSION and returns a typed refusal naming the store and both versions; it never reads a newer store optimistically and never silently upgrades one."
    quote: "The daemon refuses to open an unknown version and returns a typed refusal naming the store and both versions; it never reads a newer store optimistically and never silently upgrades one"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-27
    topics: [qma, store-lifecycle, migration-order, store-schema-version, backup-first]
    authority: rider
  - id: EXT-2352
    type: decision
    summary: "AD-27 backup and restore. QMA discharges the execution half parent AD-20 assigns to the application, under the parent's already-ratified backup design: nightly, encrypted, versioned, OFF-MACHINE copies. Contents are the SEVEN daemon-owned durable stores — the event journal, the three ledger stores, the artifact store, the staging store and the telemetry store, whose retention-exempt agent-trajectory and session-replay records (AD-23) are backed up WITH the telemetry store (exempt from trimming, never exempt from backup). The eighth durable store of AD-6's list — an admitted MemoryProvider's own store (AD-18) — is provider-owned and outside this obligation. An automated SAMPLE-RESTORE TEST and the parent's periodic FULL-RESTORE REHEARSAL each run on their own registered cadence (AD-26), each restoring into an isolated scratch location that is never the live store, and each recording its verified result as evidence; only the two cadence values are deferred, never either obligation. A RESTORE OF THE LIVE STORE is a recorded `operator`-principal act (AD-24) with a documented path, never a background job. The parent's encryption-key-custody deferral is carried forward verbatim: keys are custodied as the parent ratifies and QMA mints no key policy of its own. (Deferred GAP-0088: backup destination, encryption-key custody, sample-restore-test and full-restore-rehearsal cadences.)"
    quote: "Contents are the seven daemon-owned durable stores - the event journal, the three ledger stores, the artifact store, the staging store and the telemetry store ... The eighth durable store of AD-6's list, an admitted MemoryProvider's own store (AD-18), is provider-owned and outside this obligation"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-27
    topics: [qma, backup, off-machine, seven-stores, restore-rehearsal, live-store-restore]
    authority: rider
  # ── AD-28 — Money-path reachability boundary ──────────────────────────────
  - id: EXT-2353
    type: decision
    summary: "AD-28: AD-16's prohibition binds the ACT, not the tool name. No QMA agent, subagent, worker, environment, browser session or computer-use session may reach a venue, broker, exchange, trading-node or platform-registry control surface by any means. NETWORK DECLARATION: ExecutionEnvironment carries a required `network` field with exactly two values, `none` and `allowlist` — no open default, no third value — and an environment is refused at registration unless an allowlist enumerates its reachable hosts; venue, broker, exchange and trading-node hosts sit on a code-declared DENY-LIST that no allowlist entry may name, directly or by wildcard. IMAGE AND HOST BOUNDARIES: no QMA worker image may contain, install or import `qmf-venue`, a broker or exchange SDK, or the trading node's client, and image validation refuses one that does; the `remote_host` and `desktop` kinds may not name the trading-node VPS or any host carrying a trading credential or a running node, refused BY HOST IDENTITY rather than by policy. THE COMPUTER-USE AGENT runs on a profile whose browser carries no venue or broker session, cookie or saved credential, whose reachable-host allowlist is enumerated, and which may not be handed a venue login by any means — including one an agent reads out of Knowledge, Memory, a ledger or a tool result. Every violation is a REFUSAL AT PLACEMENT OR REGISTRATION, never a hook deny at runtime."
    quote: "Every violation of this AD is a refusal at placement or registration, never a hook deny at runtime"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-28
    topics: [qma, money-path-barrier, network-field, deny-list, image-validation, computer-use]
    authority: rider
  # ── AD-29 — Routines, scheduled triggers and continuation ─────────────────
  - id: EXT-2354
    type: decision
    summary: "AD-29: unattended operation is a v1 obligation, not an emergent property (the parent pushed cron scheduling to this layer by name and constitution L8 pushes scheduled lifecycles out of QMF). A ROUTINE is a durable, Quant-owned scheduled trigger carrying an id, the owning ActorId, a cron expression or interval with an explicit IANA zone (AD-6), the Goal it supplies to the Mission Compiler (AD-12) and the fully-qualified `graph_template` id `<plugin_id>:<local_id>` that Compiler expands (AD-13), an enable flag and a max-concurrent cap; it is declarative daemon state, never agent-authored, and UI-editable under AD-26. FIRING IS DETERMINISTIC AND NEVER AN LLM DECISION: the scheduler mints a fresh correlation_id (AD-5), fires `before_routine_fire` and `after_routine_fire` (AD-10), and instantiates through the Mission Compiler with no authority an operator command lacks — a routine is a `machine` principal (AD-24) and can answer no human gate; missed fires while the daemon is down are RECORDED, NOT REPLAYED and catch-up is an explicit operator action. CONTINUATION: a Task is not complete until AD-10's deterministic verifier passes; `agent_stop` returning `block_stop` returns the Agent to the next ready Task in its Mission's Task Graph rather than ending the run — the mechanism by which agents keep working unattended. Max consecutive continuations, the budget ceiling and the escalation target are AD-26 configurables; an Agent that exhausts its budget escalates to its Quant's mailbox and stops, and never invents work to fill the remainder."
    quote: "`agent_stop` returning `block_stop` returns the Agent to the next ready Task in its Mission's Task Graph rather than ending the run - this is the mechanism by which agents keep working unattended"
    cite: SRC-13:ARCHITECTURE-SPINE.md#AD-29
    topics: [qma, routines, scheduler, continuation, block-stop, machine-principal]
    authority: rider
  # ── Inherited Invariants — parent bindings for AD-21..AD-29 ───────────────
  - id: EXT-2355
    type: constraint
    summary: "Inherited Invariants binding seat L3's ADs (read-only from the parent spine, the constitution and the operator's standing rules; a local decision that would weaken one is a conflict to surface, not an override). Migrations, retention, backup discipline — preflight -> backup first -> dry-run -> migrate -> verify, with a documented restore path, never an in-place mutation of the only copy, and the application owns backup schedule and execution — parent AD-20, binds AD-27 (owner), AD-21, AD-23. Complete raw evidence retained locally AND an off-machine backup maintained — L18 (DEC-0045), binds AD-27. Only a human may promote a registered artifact into the live zone — L17 (DEC-0041), binds AD-24 (the operator-principal mechanism) and AD-25 (the act, performed outside QMA). Secret references only; values never in repos, config, journals, evidence, fingerprints or logs — L34 (DEC-0136), binds AD-24, AD-15. Authority order bot -> book -> BMS -> operator; nothing above a bot touches the market — L36 (DEC-0143), binds AD-16, AD-25. Exit-preservation invariant: no control may block a risk-reducing act or the recording of evidence — L39 (DEC-0150), binds AD-5, AD-6, AD-9, AD-10, AD-21, AD-25, Conventions. Configurable means UI-editable at platform level; recorded numbers are evidence, never constants — L38 (DEC-0157), binds AD-26. Self-improvement is gated: nothing agent-produced becomes runtime state without validation, verification and approval — P-9, binds AD-22. Observability is not the ledger — P-12, binds AD-23. Use the lowest-level capable environment — P-10, binds AD-16, AD-17. Extensibility is first-class: versioned, reusable, plugin-contributed authored artifacts — P-5, binds AD-13, AD-21. Corpus precedence for risk/sizing/live trading: GitBook + trading-node documentation authoritative — operator standing ruling 2026-08-20, binds AD-16, AD-25."
    quote: "A local decision that would weaken one is a conflict to surface, not an override"
    cite: SRC-13:ARCHITECTURE-SPINE.md#Inherited-Invariants
    topics: [qma, inherited-invariants, parent-ad-20, l17, l18, l34, l36, l38, l39, p-5, p-9, p-12]
    authority: rider
  # ── Consistency Conventions — naming ──────────────────────────────────────
  - id: EXT-2356
    type: decision
    summary: "Consistency Conventions — Naming. Packages `qma-<name>`, imports `qma.<name>` (PEP 420, no `qma/__init__.py`); no blanket `qmx.` prefix anywhere; plugins and ledger views named by desk with prefix tokens research-*, trading-*, dev-*, analysis-*, pm-*. Quant for the persistent actor — never Bot, never Steward. Graph Template (authored, stateless) vs Task Graph (daemon runtime state) never interchanged. Task Ledger / Quant Ledger / Experiment Ledger are stores, a desk ledger is a view, the event journal is neither. Worker = execution slot, Session = run container. The five Desks are Research, Trading, Development, Analysis and PM while the five Roles are Researcher, Trader, Developer, Analyst and Product Manager — a Role name never names a Desk ('the Analysis desk', never 'the Analyst desk') and 'quant' is never an adjective. No Mission Template in v1. QMB is the backtesting product, never 'QMX Backtesting Framework'. Wire events are noun.verb, hook events snake_case; ActorId is `quant:<desk_slug>/<quant_slug>` with the five desk_slug values research, trading, dev, analysis, pm. `attach` is never bare — wire.attach(scope, since_seq)/wire.detach is the client's scope subscription (AD-5, = AD-14's session attachment axis) while JobHandle.attach/JobHandle.reattach binds a caller to a running job (AD-17) and always carries its JobHandle. qualifier. `lease` is never bare — dispatch_lease (per Task, AD-9), environment_lease (per environment slot, AD-17), quant_ledger_lease (per Quant, AD-9), with one sanctioned collective form 'the relevant lease'. `envelope` is never bare — the wire envelope is AD-5's message frame and an `Envelope` is AD-20's mailbox message record; neither name is ever used for the other. QMA adopts `plugin` for a desk extension package (D1, AD-21) and the qualified phrase 'RLM kernel' for the Analysis worker's persistent Python interpreter (D3, AD-14) — never bare and never for qmf-core or the Trading Node, where kernel is a retired name; the parent's ban reaches QMB ('QMB is a library and a CLI, never an engine or kernel') and no constitution law bans plugin (parent ban is QMB-scoped); 'engine' stays banned for backtesting and 'exam' stays banned outright."
    quote: "QMA adopts `plugin` for a desk extension package (D1, AD-21) and the qualified phrase 'RLM kernel' for the Analysis worker's persistent Python interpreter (D3, AD-14) - never bare and never for `qmf-core` or the Trading Node"
    cite: SRC-13:ARCHITECTURE-SPINE.md#Consistency-Conventions
    topics: [qma, conventions, naming, attach-lease-envelope, plugin, rlm-kernel, quant]
    authority: rider
  # ── Consistency Conventions — closed vocabulary, casing, _ref, closed verbs ─
  - id: EXT-2357
    type: decision
    summary: "Consistency Conventions — closed-vocabulary tokens, casing, the _ref law and the closed verbs. Every closed-vocabulary value serializes `lower_snake_case` in every store and on the wire (e.g. unknown, aborted, delivered, queued, woke, deferred, dead_letter, parallel_branch, approval_gate, human_gate, deterministic_script, artifact_dependency, failover, weighted_round_robin, quota_lowest, fill_first, local, docker, remote_container, remote_host, browser, desktop). TWO EXCEPTIONS: ModelClass's four values are SCREAMING_SNAKE (REASONING_HIGH, WORKHORSE_GENERAL, CODING_HIGH, FAST_CHEAP) and handle kinds are CamelCase type names. Type and record names are CamelCase; hook events are before_<verb>/after_<verb>; every journal and wire event is noun.verb. THE _ref LAW: a record's own identity field is `id` or an `_id`-suffixed name; every pointer at a record owned by another store is `_ref`, with exactly TEN whitelisted exceptions the validator allows — correlation_id, causation_id, producer_id, attempt_of, approval_route, scope_path, from, to, authored_by and proposer; any other _id-suffixed or suffix-less cross-reference is rejected. Every command, query and event family is described by JSON Schema and versioned by a semver protocolVersion, additive-only within a major; every serialized artifact AND every durable record stamps its contract format version; timestamps persisted UTC through qmf-core's clock, every wall-clock policy carrying an explicit IANA zone; money as scaled integers and fingerprints fp1:sha256:... imported from the parent, never re-derived. CLOSED VERBS admit/apply/promote: a memory candidate is ADMITTED (MemoryProvider op `admit`, validation_state value `admitted`, scalar `admission_confidence`, AD-18); a RefinementProposal is APPLIED out of the staging store (AD-22); only a registered artifact is PROMOTED into the live zone, by a human and outside QMA (L17, AD-24, AD-25); 'promote'/'promotion' never appears for memory or refinement anywhere."
    quote: "exactly ten named exceptions ... `correlation_id`, `causation_id`, `producer_id`, `attempt_of`, `approval_route`, `scope_path`, `from` and `to`, `authored_by` ... and `proposer`"
    cite: SRC-13:ARCHITECTURE-SPINE.md#Consistency-Conventions
    topics: [qma, conventions, closed-vocabulary, casing, ref-whitelist, admit-apply-promote]
    authority: rider
  # ── Consistency Conventions — state & cross-cutting ───────────────────────
  - id: EXT-2358
    type: decision
    summary: "Consistency Conventions — state and cross-cutting. Evidence is append-only and every read-time fold declares its fold contract (stream, ordering key, knowledge-time bound, equal-instant disposition). Public boundaries fail only via returned typed refusals that are variants of qmf-core's base. `correlation_id` propagates across every boundary and a record without one is refused at the gate, with ONE CARVE-OUT: an evidence append arriving without one is recorded under a daemon-minted lifecycle correlation_id annotated `correlation_missing` (AD-5, L39). Hooks fail closed (timeout resolves to `deny`) and are the single enforcement point in the agent path, with THREE CARVE-OUTS: `before_ledger_append` fails OPEN because L39 forbids a control blocking the recording of evidence, `agent_stop` resolves a timeout to `observe` because a fail-closed stop control traps a run, and every `after_*` event resolves a timeout to `observe` because deny is not in an after_* event's legal set (AD-10). Vocabularies are closed-and-addable — each defined in the AD that owns it and extended only there, never locally (hook events and the two phase-less controls and six HookResult decisions AD-10; message kinds and delivery states AD-20; node kinds AD-13; ModelClass and routing policies AD-15; JobHandle states AD-17; validation states AD-18; Task and Mission states AD-12; handle kinds AD-14; ExecutionEnvironment kinds and network values AD-17/AD-28; principal classes and the human-gate command list AD-24; contribution points AD-1; RefinementProposal edit kinds AD-22; variable scopes AD-26; host_request verbs AD-14; wire command/query/event families AD-5). Every configurable variable declares `ui-editable` or `uneditable`; secrets travel as references only and never enter journals, evidence, fingerprints, logs or hook payloads; no component below the composition root reads the system clock; each component ships executable tests and reference usage (L27)."
    quote: "Hooks fail closed (timeout resolves to `deny`) ... with three carve-outs: `before_ledger_append` fails open ... `agent_stop` resolves a timeout to `observe` ... and every `after_*` event resolves a timeout to `observe`"
    cite: SRC-13:ARCHITECTURE-SPINE.md#Consistency-Conventions
    topics: [qma, conventions, typed-refusals, correlation-missing, fail-closed, closed-and-addable]
    authority: rider
  # ── 2026-08-29 validation-close amendments touching AD-21..AD-29 ───────────
  - id: EXT-2359
    type: decision
    summary: "2026-08-29 validation-close amendments touching seat L3's ADs (final full-spine divergence-only sweep returned verified=true dry=true remaining=0). AD-22/AD-24 role.set_base: role.base is a definition-store record written only by an operator-principal `role.set_base` wire command recording a `role.updated` journal event, never by the AD-22 pipeline or any machine principal (whatever a human commits upstream), and AD-24's closed human-gate list gains 'a role.base write (AD-16, AD-22)' so the capability ceiling every Agent is narrowed from can never be rewritten by a machine principal. AD-23/AD-6 telemetry: a telemetry record carries occurred_at and recorded_at but NO journal_seq (the announcement law exempts the telemetry store) and is ordered by recorded_at and its correlation_id alone. AD-9/AD-8 unknown_tail (context for the ledger stores AD-27 backs up): `unknown_tail` is the second daemon-authored Task Ledger entry kind beside `reassigned` (authored_by: daemon), written when an environment is lost with a non-empty outbox at the last acked id; before_ledger_append's lease check has exactly two closed author exemptions (reassigned/unknown_tail daemon entries, and a ledger_entry returned by before_task_complete or review_required). AD-15/AD-10 model_family is OPTIONAL on the Deployment record — unset at registration, never defaulted, assigned only by an operator-principal command; an unassigned family is routable but ineligible for every ReviewPolicy comparison (NoEligibleReviewer). These six surgical fixes (AD-6 telemetry journal_seq; AD-11 verifier_ref; AD-22 role.set_base + AD-24; AD-9/AD-8 unknown_tail; AD-8 definition-store single exception; AD-15/AD-10 model_family optional) closed the spine export-ready."
    quote: "verified=true dry=true remaining=0 - last full-spine divergence-only sweep (Opus, xhigh) returned zero findings after the six surgical fixes of 08-28/29"
    cite: SRC-13:.memlog.md:L298
    topics: [qma, validation-close, role-set-base, telemetry-no-journal-seq, unknown-tail, model-family-optional]
