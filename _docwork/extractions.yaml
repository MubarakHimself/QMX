  - id: EXT-2145
    type: decision
    summary: "SPINE SECTION 'Parent annotations and mints proposed by this sitting' (nothing amended by assertion). L30 ANNOTATION - record at source that the trading node's composition root is the one sanctioned importer and wirer of qmf-venue alongside the existing roster-scope annotation, with the writable boundary being the qmn.venue subpackage; qmb and qml keep their ban. CANDIDATE AD-28 ANNOTATION - the node mints qmn.venue.VenueClientPort over the CT-19/CT-20 shapes because qmf-venue exposes no VenuePort/OrderPort/VenueAdapter seam at ef9bb25; record as a candidate parent annotation that AD-28's 'one neutral port' is today a contract statement rather than an injectable Protocol, and that realizing the seam inside qmf-venue is the alternative - a parent amendment, never a child's call. RECORDS-STREAMS TO CT-13 BRIDGE - the five legacy Records streams veto_ledger, trade_journal, book_journal, ksa_audit_log and correlation_ledger survive as CT-25 projection names only, over AD-21's seven journal event types, through CT-25's one versioned mapping table; no second event catalog. value_status_required FIELD MINT for docs/registry/variables.yaml - the registry's SCHEMA half (whether a variable may ever stand at provisional-evidence) while the per-value value-status in blank | provisional-evidence | ratified lives on the resolved config artifact's row, Book-declared values included, the compiler propagating it onto generated fragments; value-status is a property of a resolved value, not of a schema - were it a registry field, the countersign that flips it would be a git edit plus a deploy rather than a journaled powers call revalidated at click time; a provisional-evidence value gating live money blocks role=live exactly as a blank does until an operator countersign carrying the variable's evidence citation. node_resurrect CONTROL-ACTION SUBTYPE - node stand-down is a lifecycle state, not a CT-30 control, and its exit must journal somewhere; record a declared node subtype node_resurrect under AD-21's control action EVENT type (operator signer, global scope), the pattern AD-21 already licenses for the sealed period's one final look; NO CT-30 action kind is minted because CT-30's vocabulary is addable-never-redefined and a child may not add to it by assertion. qmf-venue ASYNC-CONFORMANCE EXEMPTION - record the amendment exempting qmf.venue.connection BY NAME from the roster-wide async ban, landed in the same increment as the transport; if the parent refuses, the increment lands in qmn.venue.ctrader instead and the epics may not choose between the two. CT-20 MAPPING-ROW ADDITION - add (position read-back) to observation and (balance read-back) to observation rows to CT-20's versioned mapping table so the node adds observation KINDS and no journal type; no eighth type, no second event catalog. PROPOSED CT-20 lifecycle-stop UNKNOWN TRIGGER - AD-27's UNKNOWN trigger set is timeout | transport-error | disconnect; TN-4's shutdown contract mints an UNKNOWN per in-flight command at SIGTERM and the node orders that mint after session close so disconnect applies honestly; record lifecycle-stop as a candidate fourth trigger, and until the parent rules it TN-4's ordering stands. kill_line_capital_floor AND loss_floor ARE ONE VARIABLE - AD-40 says loss_floor 'is the same number the kill line names - one value, one name'; record that kill_line_capital_floor (variables.yaml:548) is the canonical registry key and loss_floor is AD-40's prose name for the same row; the node mints no second name. PRD SECTION 3 NOTIFICATION ALLOW-LIST - PROPOSED WIDENING, surfaced not settled: the ratified allow-list covers money boundaries and protection escalation but not SILENT DEGRADATION (an unattended node that has stopped accepting entries, or cannot persist evidence, for a non-KSA reason emits nothing); this sitting proposes a third ratified class, the external dead-man's switch and the liveness digest as a PRD amendment the documentation factory carries, because widening it by assertion is exactly the move TN-1 refused for L30 and TN-11 refused for AD-28. AD-19 sealed-archive ROOM-ROLE ADDITION - an eighth role instantiated per world in the evidence tier under the same retention, backup and migration law as the other seven, the one-way sync's named target, read by the replay import port and the backup (A44). SessionTopology CONNECTION-COUNT RELAXATION - required_connection_count = 2 ships as a ClassVar which no soak-week roster naming only the demo pair can satisfy; record the relaxation (count derived from the roster, one per (venue, environment) pair it names) as an item of the same qmf-venue increment that carries the transport (A37). STALE qmf-venue README - packages/qmf-venue/README.md:10-13 still reads 'Scaffold (Story 1.1)...' while the code carries the ConnectionManager, the in-house tag-91 compilation and the CT-18..CT-21 surface; the doc factory corrects it. KSA VOCABULARY RE-RATIFIED into docs/ from the GitBook baseline: five levels GREEN | YELLOW | ORANGE | RED | BLACK (fixed, uneditable), four trigger classes scheduled_news | black_swan | connectivity | unknown_state (addable, never redefined), escalate-only automatic transitions and A1 human-only de-escalation; the matrix SHAPE is closed by TN-7, its VALUES stay open, blank-blocking live money. THE FOUR RECONCILIATION VERDICTS become the node's vocabulary - reconciled | drift | unknown | out-of-lookback - replacing the baseline's three everywhere the node speaks."
    cite: SRC-11:ARCHITECTURE-SPINE.md#parent-annotations-and-mints-proposed-by-this-sitting
