    summary: "CUT (DEC-0376): git-branch-per-parameter-mutation as the lineage mechanism. QMA uses content-addressed resolved config for parameter lineage; git is used only when code changes, not for every parameter variant."
    quote: "content-addressed resolved config; git only when code changes"
