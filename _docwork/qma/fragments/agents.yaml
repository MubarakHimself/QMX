- op: insert_before_heading
  heading: '## Reading order'
  text: |
    - **Ratified QMA content** (build against it as the source of truth; see [`components/qma-daemon.md`](components/qma-daemon.md), [`components/qma-core.md`](components/qma-core.md), [`components/qma-wire.md`](components/qma-wire.md), and [ADR-0020](decisions/ADR-0020-qma-agentic-system.md)): the QMX agentic system is a daemon plus the QMA SDK (QuantMind Agents) plus a wire contract, an application-layer product built ON QMF, never a QMF roster package and never a framework; **QMA names the SDK only**, the Python namespace is `qma.*` with no blanket `qmx.` prefix, and the three packages are definitions-only `qma-core` (depends only on `qmf-core`), sole-writer runtime `qma-daemon`, and contract-only `qma-wire`, with `qma-ui-contract` a deferred stub (DEC-0329, DEC-0330, DEC-0335, DEC-0337). One Python 3.14 asyncio daemon is dispositive under L31 — no second runtime, no QMF contract re-implemented across a language boundary; workers and non-Python clients attach over the wire (DEC-0334). The build order is daemon, data layer, wire, and DevOps first, and a Quant reachable through models over the wire is the first milestone, while the UI extension SDK is deferred and the wire contract and variables registry bind now (DEC-0333). `qma-daemon` reaches `qmf-registry` and `qmf-risk` **read-and-calculate only** over a default-deny enumerated surface and never imports `qmf-venue`; L30 is roster-scoped, so these are application dependencies under L31 (DEC-0347). The persistent named organizational actor is the **Quant** (never Bot, never Steward) under the ontology Desk to Role to Quant to Agent to Subagent (DEC-0331). **Money path:** QMA's only output into the money path is a candidate artifact a human promotes — there is no execution tool at any account role, "paper only" included, and no environment, worker, browser, or computer-use profile may reach a venue, broker, exchange, or trading-node host; risk, sizing, and live authority stay with the GitBook and trading-node corpus (DEC-0341). `promote` is reserved for the human live-zone act outside QMA; memory candidates are **admitted** and refinement proposals **applied** (DEC-0345). Ratified under the sitting's I-draft-operator-ratifies mode with SRC-15 ordering the absorption; implementation authorization arrives only through the factory pipeline.
- op: insert_before_heading
  heading: '## Before changing anything'
  text: |
    - **QMA vocabulary scope** (DEC-0346, DEC-0337, DEC-0345). Within the QMX agentic system (QMA) — the `qma-core`, `qma-wire`, and `qma-daemon` specs, the QMA contracts, and the QMA sections of shared docs — `plugin` names a desk extension package and the qualified **"RLM kernel"** names the Analysis worker's persistent Python interpreter; both are adopted terms there, and the Python namespace is `qma.*` with no blanket `qmx.` prefix. The parent ban is unchanged for QMF, QMB, and node prose: say **extensions** not "plugins", backtesting is a **library** never an "engine", `exam` stays retired, and `kernel` stays a retired name for `qmf-core`. QMA's adoption scopes the ban's audience; it never lifts it. The three verbs stay distinct — memory candidates are **admitted**, refinement proposals **applied**, and only a human **promotes** an artifact into the live zone outside QMA.
