id: CT-30
name: Control-action contract
status: ratified
version: 1  # first minted format version; the control-action law is spine-ratified (AD-36/AD-37), corpus signed off by the operator 2026-08-21 (DEC-0150, DEC-0151); 2026-08-29 trading-node absorption: per-effect-matrix-cell satisfaction predicates, the node_resurrect AD-21 event subtype, and the seat_reinstate CT-24 pointer recorded — no format change (DEC-0249, DEC-0250)
owner: COMP-QMF-RISK
consumers: []  # consumer-blind by design: control-action records are qmf-core value types wrapped into registry records by the composition root; dispatch reaches the venue through qmf-core-defined sink protocols, so no package imports qmf-risk under default-deny (DEC-0150, DEC-0143)
active_consumers: []
intended_consumers: [COMP-QMF-VENUE, COMP-QMF-REGISTRY, COMP-QMF-DATA]  # a flatten/drain dispatches as CT-19 commands; records and journal events reach qmf-registry/qmf-data via the composition root when the factory ships; documentary until then (DEC-0150, DEC-0145)
wiring_status: defined-unwired  # AD-36/AD-37 ratify the contract surface; no code exists and no build is authorized outside the factory pipeline — composition-root mediated (DEC-0150)
caller_status: unassigned  # actions are issued by the operator, Book policy, the protection authority, a venue-delegated authority, or the adapter itself; the node owns the issuers, QMF carries the contract, the scopes, the refusals and the evidence (DEC-0150)
layer_from: backend
layer_to: backend
decisions: [DEC-0150, DEC-0151, DEC-0147, DEC-0158, DEC-0143, DEC-0149, DEC-0192, DEC-0218, DEC-0249, DEC-0250, DEC-0251, DEC-0259]
gaps: []  # AD-36 closes the flatten-authority leftover and kill-switch seam; AD-37 closes GAP-0046; no still-open gap applies. The node's trigger->level->effect severity matrix is node material, not a QMF gap (DEC-0150)
purpose: "The typed control-action contract: a bounded set of protection and lifecycle actions — suspend_new, drain, flatten, resume — each issued by a named authority at a resolved subject scope, journaled before dispatch as a standing intent, arbitrated at exactly one point per (VenueId, account) command stream by a BMS-declared rank, with the exit-preservation invariant guaranteeing no control action of any authority at any scope may ever block a risk-reducing act (DEC-0150, DEC-0151)."
invariants:
  - "The exit-preservation invariant is spine-level law (L39): no control action, of any authority, at any scope, may block a risk-reducing act — cancel_order, close_position, close_all, a risk-non-increasing amend_protection, a protection action, or the recording of evidence; the blocking half of any control is always entries only, in paper and live alike, and no CT-30 kind whose effect is a blanket command-pipe block may ever be minted (DEC-0150)."
  - "Action kinds are addable never redefined and each is defined exactly once here: suspend_new (no new entries; everything already open or resting is untouched), drain (no new entries and resting orders run to their own terminal state — nothing is force-closed; the same word is used for the CT-18 primitive and the adapter-initiated state change, and this is its one meaning), flatten (close the scope), resume (DEC-0150)."
  - "Every action carries an issuing authority and its enumerated kind: operator | book_policy | protection_authority | venue-delegated | adapter_self (DEC-0150)."
  - "The subject scope — instrument | book | binding | account | venue | global — is resolved at dispatch to AD-27 enforcement scopes through a pinned versioned CT-30 resolution table, never implementer judgment; an unresolvable scope is an unsupported-capability refusal, is never emulated at a wider scope, and where the venue's netting position model makes a narrower scope indistinguishable from a wider one (AD-29) the action refuses rather than executing wider (DEC-0150, DEC-0143)."
  - "Every action declares a mandatory satisfaction predicate from a closed vocabulary — scope-flat-at-reconciled-verdict | no-pending-orders-at-reconciled-verdict | never-auto — with suspend_new and drain never-auto by rule (clearing only by an operator resume), which is what keeps automated de-escalation forbidden rather than reachable through the satisfaction clause; flatten satisfies only on a reconciled verdict showing the scope flat, and a command outcome never satisfies an intent (otherwise a partial fill leaves residual size open with the intent silently cleared) (DEC-0150)."
  - "Standing intent, not a queue: a protection action is journaled before dispatch (the risk dispatcher must see a sink refusal — a storage failure blocks the dispatch rather than losing the intent, AD-31), so the intent exists even if nothing reaches the venue; 'is this account under a standing flatten intent?' is a read-time fold over the control-action stream under AD-36's fold contract, restart-proof by construction; on reconnect the node re-evaluates every standing intent against reconciled state and, if still unsatisfied, issues a new command with a new identity — re-deciding is not retrying (AD-27's prohibition binds the command, not the decision); the intent never time-expires (DEC-0150, DEC-0158)."
  - "Re-evaluation runs against a reconciled verdict only: drift, unknown, and out-of-lookback (AD-27) alarm and hold the intent open without dispatching, so a protection mechanism can never open a position against state it cannot see; undeliverable protection alarms loudly (AD-14) carrying the manual fallback, and the intent stays open (DEC-0150, DEC-0158)."
  - "The standing-intent machinery binds every risk-non-increasing act, not only CT-30 kinds — naming amend_protection (CT-19/AD-34), CT-23's close_full and tighten_protective_stop (AD-33), and every protective close: journaled before dispatch, resolved as a read-time fold, re-decided rather than retried, never time-expiring, alarming when undeliverable (DEC-0150, DEC-0147)."
  - "Flatten authority is assigned and closed: (1) the operator — always, at any scope, unconditional, never removable, never gated on reconciliation; (2) Book policy, only through pre-declared trigger classes — a kill-line breach flattens that binding's scope automatically, an undeclared trigger flattens nothing, ever; (3) the protection authority (kill-switch class) where the node's severity policy declares close_all for that severity; (4) nobody else — the venue adapter never initiates a flatten (its adapter_self actions are limited to suspend_new, drain, throttle and session state), a sensor emits a typed verdict and never acts, a Bot never flattens another Bot's position; every other money boundary (rollover, sweep, re-seed, paper flip) leaves positions alone (DEC-0150)."
  - "resume is operator-only — escalation automates, de-escalation does not — and a clocked mechanical clear mints a CT-24 mode transition, never a CT-30 resume (DEC-0150, DEC-0149)."
  - "The kill switch and the kill line are two different things, named apart, never merged: the kill switch is the global black-swan authority that stops all new trading everywhere (live and paper alike), is sensor-fed (MIS and SQS are inputs, never authorities), escalates automatically and de-escalates only by a human — its effect may additionally be drain or close_all, which effect a severity carries being the node's severity policy to choose; the kill line is a per-Book capital floor whose breach automatically flattens that binding's scope and stands the Book down (stood-down being a declared binding state) (DEC-0150)."
  - "Each control-action kind's rank is a declared, mandatory, non-defaultable field — its existence is QMF's, its value is not; the rank table is BMS-declared, one per (VenueId, account) command stream, matching the single arbitration point per stream (several Books share one stream, so a Book-owned table would put two rank orders at one arbiter); a Book whose control policy contradicts its BMS's table is an unsupported-capability refusal at bind time; ranks are a total order with uniqueness enforced at admission Layer 1 (two kinds may not share a rank — invalid-input), and arbitration resolves strictly by rank with no arrival-order input (DEC-0151)."
  - "Collapse rule: where two pending actions would produce the same mechanical command on the same enforcement scope, exactly one command is emitted — the rank winner supplies the authority and reason, and every loser journals as a suppressed control action; rank decides attribution, not whether the position closes (DEC-0151)."
  - "Conflict rule, scoped and compatibility-aware: where pending actions on the same enforcement scope would produce different commands whose effects are mutually exclusive, the higher rank wins outright and the lower is suppressed — never both, never queued — and a lower-ranked action may never undo a higher-ranked one; actions whose effects compose (suspend_new + flatten, drain + flatten) both execute; a higher-ranked action may never reduce the protection a lower-ranked action would have delivered (DEC-0151)."
  - "A control action that fans out is an AD-27 compound command — children individually observation- and journal-bearing, the parent outcome the meet of its children; no second outcome vocabulary is minted, and scope resolution reads CT-18 netting|hedging before dispatch to decide whether an instrument- or Book-scoped flatten is one command or a compound one (DEC-0150, DEC-0151)."
  - "Suppression is first-class evidence: the declared suppressed subtype (AD-21) carries the suppressing authority, the suppressed authority, the reason class, the would-have-been action referenced by its CT-30 control-action record fingerprint (a command identity is minted only at submission — no phantom command record may ever exist), the enforcement scope, and the arbitration record's fingerprint; enactment is linked back to intent by enacts edges (AD-16), never by correlation_id (DEC-0150, DEC-0158)."
  - "Veto accounting is symmetric to suppression accounting: a door refusal (an intent refused before it was ever authorized) stays on the veto path and mints a decision event carrying the refusing-door identity, the would-have-been action fingerprint and the controlling evidence fingerprint; CT-32 carries veto counts by door alongside suppression counts by authority, so neither our arbitration nor our doors ever read as decay (DEC-0150)."
  - "The (action kind x issuing authority) -> close-reason mapping is a pinned versioned table shared with CT-29, never per implementer: kill_line_flat is minted apart from protection_forced_flat (the kill-switch class) because AD-36 rules the kill line and the kill switch two different things, and window_forced_flat, boundary_flat, hold_time_force_flat, protection_amendment_fill and operator_close each map through the same table (DEC-0147, DEC-0150)."
  - "Which effect fires at which severity is node authority: QMF carries the contract, the scopes, the refusals and the evidence; it never carries the trigger->level->effect matrix — that severity policy lives in the trading node (tracker/trading-node-notes.md pointer) (DEC-0150)."
  - "The trading node DECLARES a satisfaction predicate PER KSA effect-matrix cell rather than leaving 'when is this control satisfied' to whichever implementation lands first: AD-36's predicates hold verbatim as the floor — suspend_new and drain are never-auto, flatten is scope-flat-at-reconciled-verdict — the no-pending-orders-at-reconciled-verdict predicate is EXPRESSIBLE in a cell so a cell that needs it can say so, and a protection transition counts as ENFORCED only after the account's connections have quiesced and drained; never-auto is the predicate any human-only action carries (DEC-0250, DEC-0192, DEC-0218)."
  - "Node stand-down is a NODE LIFECYCLE STATE and not a CT-30 control, and its operator-signed exit journals under AD-21's control action EVENT type as the declared node subtype node_resurrect (operator signer, global scope) — the pattern AD-21 already licenses for the sealed-period final look. NO CT-30 action kind is minted for it: this contract's action-kind vocabulary is addable-never-redefined and the node adds nothing to it (a real CT-30 kind would need never-auto as its satisfaction predicate and a row in the pinned (kind x authority) -> close-reason table, which this increment does not propose) (DEC-0249, DEC-0218)."
  - "Seat quarantine and its operator-signed exit seat_reinstate are each their own CT-24 binding-transition and never a CT-30 action or a CT-30 resume: a seat enters quarantined automatically on a seat-callback deadline, exception or memory-ceiling breach and leaves it ONLY by the operator-signed seat_reinstate power, never inferred from a restart, a new boot epoch, a config version or the absence of further breaches (DEC-0251)."
schema:
  type: control-action-record  # a typed action record whose outcome is an observation and a journal event; a standing intent is the read-time fold over the stream, never a stored field (DEC-0150)
  fields:
    - "action_kind: exactly one of suspend_new | drain | flatten | resume; each defined once, addable never redefined (DEC-0150)"
    - "authority: the issuing authority instance, always recorded so the act has an issuer and a rank (DEC-0150)"
    - "authority_kind: operator | book_policy | protection_authority | venue-delegated | adapter_self (DEC-0150)"
    - "subject_scope: instrument | book | binding | account | venue | global; resolved at dispatch to AD-27 enforcement scopes through the pinned versioned resolution table (DEC-0150)"
    - "satisfaction_predicate: scope-flat-at-reconciled-verdict | no-pending-orders-at-reconciled-verdict | never-auto; suspend_new and drain are never-auto by rule (DEC-0150)"
    - "rank: mandatory, non-defaultable; the value is BMS-declared, one table per (VenueId, account) command stream, a total order unique at admission Layer 1 (DEC-0151)"
    - "reason_class: the typed reason for the action plus its evidence references (DEC-0150)"
    - "close_reason_ref: the close reason this action maps to through the pinned versioned (kind x authority) -> close-reason table shared with CT-29, where the action closes a position (DEC-0147)"
    - "compound_children: for a fan-out, each child's derived identity (parent fp1 + declared ordinal), individually observation- and journal-bearing; the parent outcome is the meet of its children (DEC-0150, DEC-0151)"
    - "suppressed_record: the suppressed subtype — suppressing authority, suppressed authority, reason class, the would-have-been action referenced by its CT-30 record fingerprint, enforcement scope, and the arbitration record fingerprint (DEC-0158)"
    - "enacts_edge: the AD-16 edge from a command record or outcome observation to the control-action or standing-intent record it enacts; arbitration, suppression accounting and standing-intent folds resolve through enacts, never correlation_id (DEC-0158)"
    - "evidence_record: the observation and journal event every control action mints, written before dispatch (DEC-0150)"
  enums:
    - "action kind: suspend_new | drain | flatten | resume; addable never redefined, each defined once (DEC-0150)"
    - "authority kind: operator | book_policy | protection_authority | venue-delegated | adapter_self (DEC-0150)"
    - "subject scope: instrument | book | binding | account | venue | global (DEC-0150)"
    - "satisfaction predicate: scope-flat-at-reconciled-verdict | no-pending-orders-at-reconciled-verdict | never-auto (DEC-0150)"
    - "reconciliation verdict the predicate reads (AD-27): reconciled | drift | unknown | out-of-lookback; re-evaluation runs against reconciled only, the other three alarm and hold the intent open (DEC-0158, DEC-0150)"
    - "binding state a stand-down sets: live | paper | stood-down — a stand-down is an authority-imposed halt on new entries at that binding, cleared only by an operator resume (DEC-0150)"
    - "close reasons this contract's mapping targets (a subset of the CT-29/AD-33 close-reason taxonomy, addable never redefined): protection_forced_flat | kill_line_flat | window_forced_flat | boundary_flat | hold_time_force_flat | protection_amendment_fill | operator_close (DEC-0147, DEC-0150)"
    - "refusal categories in this contract's paths: unsupported-capability (an unresolvable or netting-indistinguishable scope, or a control policy contradicting its BMS rank table at bind time), invalid-input (two kinds sharing a rank), storage-failure (an unpersistable journal event blocking dispatch) per registry:typed_refusal_codes (DEC-0150, DEC-0151)"
  units:
    - "rank: an integer ordinal; a total order with uniqueness enforced at admission Layer 1; no rank value is ever supplied by QMF (DEC-0151)"
    - "instants: int64 UTC nanoseconds; a standing intent never time-expires — a timeout would be an invented number (DEC-0150)"
  nullability:
    - "compound_children is present only for a fan-out command; a single-scope action omits the key, never null (DEC-0150)"
    - "suppressed_record is present only on the suppressed subtype; its would-have-been action is always referenced by a real CT-30 record fingerprint, never a phantom command record (DEC-0158)"
    - "close_reason_ref is present only where the action closes a position; suspend_new, drain and resume that close nothing omit the key (DEC-0147, DEC-0150)"
    - "the current standing-intent status is never stored — it is the read-time fold over the control-action stream and has no field (DEC-0150)"
