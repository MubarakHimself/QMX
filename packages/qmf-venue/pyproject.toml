[project]
name = "qmf-venue"
version = "0.1.0"
description = "The venue-neutral seam and cTrader translation. An edge module: nothing imports it."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "qmf-core",
    # The Protobuf RUNTIME for the venue transport (Story 8.2; AR-43, DEC-0141).
    # qmf-venue owns its own transport: the Spotware openapi-proto-messages release
    # is compiled IN-HOUSE and only its proto MESSAGE DEFINITIONS are consumed as
    # data — zero Spotware code runs (the OpenApiPy SDK is reference-only; its pinned
    # Twisted reactor is platform-imposing and rejected in DEPENDENCIES.md). Declared
    # HERE ONLY — never in qmf-core, never at a boundary signature; a compiled proto
    # message never leaks into qmf-core (AR-06/AR-42, L30). Pinned for byte-identical
    # results; registered in DEPENDENCIES.md with licence + why.
    "protobuf==7.36.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace submodule. Dot notation tells uv_build the module lives at
# src/qmf/venue/ with NO src/qmf/__init__.py anywhere in the distribution.
module-name = "qmf.venue"

[tool.uv.sources]
qmf-core = { workspace = true }
