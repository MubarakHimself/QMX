  - id: GAP-0007
    question: "What decimal precision, currency metadata, quantity scale, rounding mode, and quantization boundary define exact money?"
    needed_by: [COMP-QMF-CORE, COMP-QMF-VENUE, COMP-QMF-RISK]
    blocking: false
    recommendation: "Represent amounts as decimal or scaled integers with currency and venue precision metadata; allow rounding only at named venue or accounting boundaries."
    status: answered
    answer: "Money/Price/Quantity are whole-number integer counts at a declared per-value scale; Price is instrument-tagged; mixed-scale arithmetic auto-promotes losslessly or refuses; binary float is banned on the money path (a taint rule), crossed only at named conversion boundaries with an explicit rounding mode; foreign money is stored verbatim as evidence (DEC-0105, AD-7)."
    answered_by: operator (architecture sitting 2026-08-19)
    date: 2026-08-19

  - id: GAP-0008
    question: "What exact instant encoding, timezone rules, trading-day identity, session calendar, DST behavior, and Forex rollover semantics does qmf-core expose?"
    needed_by: [COMP-QMF-CORE, COMP-QMF-DATA, COMP-QMF-RISK]
    blocking: false
    recommendation: "Use an unambiguous UTC instant plus an explicit venue/session calendar and separate civil date from trading date; keep Forex rollover in a Forex calendar extension rather than the universal primitive."
    status: answered
    answer: "int64 UTC nanoseconds (POSIX no-leap-second, 1677–2262, checked arithmetic); CivilDate/TradingDate as distinct types with calendar identity carried in-band; Duration and half-open Interval in core; wall vs monotonic clocks type-separated; Clock protocol injected at the composition root; (instant, writer, sequence) replay ordering; calendar identity is the rule set (rollover vs session schedule split; day-boundary calendars account-scoped; tzdata pinned in extensions and fingerprint-participating); forex market-hours calendar ships first with 17:00 America/New_York rollover, weekend gaps, holidays in scope, swap-Wednesday dropped (DEC-0106, AD-8)."
    answered_by: operator (architecture sitting 2026-08-19, two-lens audited)
    date: 2026-08-19

  - id: GAP-0009
    question: "Is Instrument identity venue-plus-opaque-symbol, and how are aliases, symbol changes, asset class, and contract metadata represented?"
    needed_by: [COMP-QMF-CORE, COMP-QMF-REGISTRY, COMP-QMF-DATA, COMP-QMF-VENUE]
    blocking: false
    recommendation: "Adopt venue plus opaque symbol as the stable identity seed and store aliases and mutable metadata separately so renames do not rewrite evidence."
    status: answered
    answer: "Yes: instrument identity is (venue, venue's own symbol) with the symbol opaque and never parsed; VenueId is operator-minted, opaque, and stable (a white-label broker is its own venue); aliases, renames, asset class, and mutable metadata are separate dated records; Venue and Account are first-class nouns — defined in qmf-core, records owned by qmf-registry — with accounts carrying roles and Books binding to accounts (DEC-0107, AD-9)."
    answered_by: operator (architecture sitting 2026-08-19)
    date: 2026-08-19

  - id: GAP-0010
    question: "What canonical serialization, normalization, hash algorithm, fingerprint version, and collision policy define deterministic identity?"
    needed_by: [COMP-QMF-CORE, COMP-QMF-REGISTRY, COMP-QMF-DATA]
    blocking: false
    recommendation: "Define a versioned canonical byte representation before hashing, exclude presentation-only fields, and make the algorithm identifier part of every fingerprint."
    status: answered
    answer: "The pinned fp1 recipe: UTF-8 JSON, keys sorted at every depth, NFC strings, integer-only identity numerics (floats refused in identity), null prohibited, order-significant arrays; SHA-256; emitted fp1:sha256:<hex>; one implementation in qmf-core only; display-only exclusions are explicit versioned contract declarations; idempotent re-writes accepted, true collisions refused and alarmed (DEC-0108, AD-10)."
    answered_by: operator (architecture sitting 2026-08-19)
    date: 2026-08-19

