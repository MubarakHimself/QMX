    summary: "Crypto capability is deferred until QMX is a platform and will extend QMX rather than create a separate crypto edition."
    quote: "when QMX is a platform. So, we can extend QMX itself to build a crypto version of it. Okay, not a crypto version, but to extend its crypto capabilities."
    cite: SRC-01-C0010
    topics: [crypto, qmx, scope]
    authority: source
