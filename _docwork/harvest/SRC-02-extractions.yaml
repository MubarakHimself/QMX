  - id: EXT-1126
    type: open
    summary: "The preliminary Bot definition is a confluence plus an as-yet-unnamed binding contract to a Book."
    quote: >-
      the boat, actually, it's not direct literal confluence, but the confluence is part of the boat. It makes up a huge chunk of the bot. The only difference is the boat now contains another, should I say, contract? Is it even a contract? I don't even know what to call it, but it contains the thing that links the recipe card together with the book.
    cite: SRC-02-C0030
    topics: [bots, confluence, books, binding, open]
    authority: source
  - id: EXT-1127
    type: constraint
    summary: "Book, BMS, and trading-node semantics must be understood before QMF primitives are frozen."
    quote: >-
      you should really understand what is a trading node before you try to build anything. I hope you did. It wasn't just for shock, you really need to understand it because I have a very, very good idea that you might build something we don't need.
    cite: SRC-02-C0030
    topics: [books, bms, trading-node, prerequisites]
    authority: source
  - id: EXT-1128
    type: constraint
    summary: "No factory shipping or project update was authorized until concepts were clarified and reusable artifacts were produced."
    quote: >-
      So, should I say go? Well, you are not the factory, you don't even know what the factory is, neither do you understand anything. So, you first clarify everything, then we are going to produce reusable artifacts and then update everything so that I can start other sessions based off.
    cite: SRC-02-C0030
    topics: [factory, authorization, artifacts, workflow]
    authority: source
  - id: EXT-1129
    type: constraint
    summary: "QMF may borrow architectures and mental models but is not intended to use other projects' code."
    quote: >-
      I'm not intending to use anyone's code. I can use mental models, I can use architecture, I'm okay with that.
    cite: SRC-02-C0030
    topics: [in-house, code-reuse, architecture, mental-models]
    authority: source
  - id: EXT-1130
    type: context
    summary: "The durability ambition is comparable to building a Bloomberg Terminal from scratch, with infrequent foundational rebuilds."
    quote: >-
      I'm not intending to also use rebuild this multiple times. This is something I intend to build at least twice a year, from now on. Think of it as if we are building Bloomberg Terminal from scratch
    cite: SRC-02-C0030
    topics: [product-vision, durability, rebuild-cadence]
    authority: source
  - id: EXT-1131
    type: decision
    summary: "qmf-core is the first foundational library and must contain definitions only, with no loop, broker, backtest, or downloads."
    quote: >-
      One: qmf-core, the language. Exact money (no floats ever), exact time (including "which trading day is this" and the two-dates stamp: happened / knowable), the nouns everything shares — Instrument, Bar, Tick, Order, Fill, Position, Account, defined style-agnostic from scalp to long hold — typed refusals, and the fingerprint machinery your recipe cards will use later. No loop, no broker, no backtest, no downloads.
    cite: SRC-02-C0031
    topics: [qmf-core, foundation, primitives]
    authority: source
  - id: EXT-1132
    type: constraint
    summary: "qmf-core nouns must anticipate order flow, DOM, tape, market structure, technical analysis, and level-three data so crypto does not force a rebuild."
    quote: >-
      the nouns I've just looked at, I think we might need to consider something like order flow. I think that's DOM DOM, yeah, it's dom,Remember, we are also considering crypto. So, crypto has a lot of DOM and like tepper. You know what I'm talking about. So, order flow and all that. So, most order flow components or concepts. I hope you understand me. So, market structure, technical analysis, you know, level three data.
    cite: SRC-02-C0031
    topics: [qmf-core, order-flow, dom, crypto, market-structure]
    authority: source
  - id: EXT-1133
    type: constraint
    summary: "QMF code and documentation must be comprehensible to both human operators and agents."
    quote: >-
      remember, human, I might also need to understand this code. Don't underestimate that. So, write for both humans and agents. Okay, this should be for both humans and agents. This framework.
    cite: SRC-02-C0031
    topics: [documentation, human-readable, agent-readable, qmf]
    authority: source
  - id: EXT-1134
    type: decision
    summary: "Versioning discipline is an accepted foundational QMF concern."
    quote: >-
      Oh, yeah, versioning discipline. Thank you for that. Actually, I've forgotten about it. Seems like it's viable.
    cite: SRC-02-C0031
    topics: [versioning, qmf-core, compatibility]
    authority: source
  - id: EXT-1135
    type: decision
    summary: "Bots accumulate lineage and first-class variants as pair choice or component variables change."
    quote: >-
      some bots might, okay, there is this idea we had whereby some bots can have variants of themselves. In other words, the logic behind that is that a bot can fail, for example, on a specific pair but work on another, or you know, if we change one variable, for example, a trigger it can pass
    cite: SRC-02-C0032
    topics: [bots, lineage, variants, genealogy]
    authority: source
  - id: EXT-1136
    type: open
    summary: "Forex sessions and their relationship to pairs and multi-session bots require explicit modeling; crypto must remain distinct."
    quote: >-
      things like which session. I think that's going to be very necessary, especially for Forex. You also need to draw a clear line between Forex and crypto. For Forex, we may need sessions because some bots can trade multiple sessions, but I believe a session is corresponding to a pair. Yeah, those are, I think, my opinions.
    cite: SRC-02-C0032
    topics: [forex, crypto, sessions, pairs, open]
    authority: source
  - id: EXT-1137
    type: decision
    summary: "The documentation restart precedes implementation and documents QMF before the trading node."
    quote: >-
      we need to first document before we feed it to the factory. So, we are going to restart documentation of QMX. Okay, so we are starting with the framework before I even document the trading node.
    cite: SRC-02-C0032
    topics: [documentation, qmf, trading-node, build-order]
    authority: source
  - id: EXT-1138
    type: correction
    summary: "SQS expands to Spread Quality Sensor."
    quote: >-
      the SQS, which is the spread quality sensor.
    cite: SRC-02-C0032
    topics: [sqs, spread-quality, vocabulary]
    authority: source
  - id: EXT-1139
    type: correction
    summary: "The recovered Book baseline is specifically a Scalping Book, not a universal Book design."
    quote: >-
      Specifically, the book you are looking at is a scalping book. Please note that, okay, and it has a repeatable pattern which we are going to be using for book, which we are going to be using for books across QRMX.
    cite: SRC-02-C0032
    topics: [books, scalping, legacy, correction]
    authority: source
  - id: EXT-1140
    type: decision
    summary: "Other Book types will vary from the Scalping Book template and are expected to be formed with the agentic system."
    quote: >-
      But there are other books we're going to form, and the identic system of QMX will be helping me do that.
    cite: SRC-02-C0032
    topics: [books, agentic-system, templates]
    authority: source
  - id: EXT-1141
    type: constraint
    summary: "The existing Book vocabulary contains uncertainties such as seat, R, and ACID that must be reconciled before documentation hardens them."
    quote: >-
      Then R, I don't know what R is. I think R is part of risk. Okay, we have a problem. What you're looking at can vary, very much consistently. Let me try to see if GPT can try to solve this
    cite: SRC-02-C0032
    topics: [books, vocabulary, legacy, open]
    authority: source
  - id: EXT-1142
    type: constraint
    summary: "The agent must not initialize a project or codebase; specialized user skills own initialization."
    quote: >-
      don't initialize anything, please. I'm seeing you creating a new project. Don't. I have skills, specific skills that are meant to do what you are trying to do. Don't initialize anything, please.
    cite: SRC-02-C0035
    topics: [authorization, initialization, skills, workflow]
    authority: source
  - id: EXT-1143
    type: decision
    summary: "Current operator rulings outrank all historical sources."
    quote: >-
      current operator rulings as highest authority.
    cite: SRC-02-C0035
    topics: [source-authority, operator, precedence]
    authority: source
  - id: EXT-1144
    type: correction
    summary: "GitBook is primarily the Book/BMS authority rewrite, not the complete authority for every surviving mechanic."
    quote: >-
      The primer is a faithful GitBook baseline, but GitBook is primarily the Book/BMS authority rewrite—not the complete source for every surviving mechanic.
    cite: SRC-02-C0035
    topics: [gitbook, source-authority, books, bms]
    authority: source
  - id: EXT-1145
    type: constraint
    summary: "Unchanged mechanics may be recovered from the legacy QMX-discussion corpus, while BMAD claims are evaluated individually."
    quote: >-
      Use the legacy QMX-discussion corpus for unchanged mechanics, BMAD claim by claim
    cite: SRC-02-C0035
    topics: [legacy, bmad, source-authority, mechanics]
    authority: source
  - id: EXT-1146
    type: correction
    summary: "The later Snapshot Quality interpretation of SQS is semantic drift and must not replace Spread Quality Sensor."
    quote: >-
      SQS means Spread Quality Sensor; the later snapshot-quality aggregate is semantic drift.
    cite: SRC-02-C0035
    topics: [sqs, snapshot-quality, spread-quality, correction]
    authority: source
  - id: EXT-1147
    type: constraint
    summary: "Because QMF is genuinely new, historical sources may supply semantics and contracts but not an old module graph."
    quote: >-
      QMF is genuinely new, so recover semantics and contracts—not the old module graph.
    cite: SRC-02-C0035
    topics: [qmf, legacy, module-graph, clean-start]
    authority: source
  - id: EXT-1148
    type: constraint
    summary: "qmf-core may proceed only with framework-neutral primitives and must not freeze trading-node application decisions."
    quote: >-
      qmf-core may proceed only with framework-neutral primitives; do not freeze Trading Node application decisions yet.
    cite: SRC-02-C0035
    topics: [qmf-core, trading-node, framework-neutral, constraint]
    authority: source
  - id: EXT-1149
    type: context
    summary: "Recovered legacy evidence defines R by loss at the original stop, while FORM-0006 must not be implemented as-is."
    quote: >-
      R = loss at the original stop (with the FORM-0006 "never implement as-is" warning)
    cite: SRC-02-C0037
    topics: [r, risk, formula, legacy]
    authority: source
  - id: EXT-1150
    type: context
    summary: "Recovered evidence distinguishes roster seat, risk seat, and a legacy capital slot rather than collapsing them into one concept."
    quote: >-
      roster seat / risk seat / legacy capital slot kept firmly separate
    cite: SRC-02-C0037
    topics: [seat, books, risk, legacy]
    authority: source
  - id: EXT-1151
    type: death
    summary: "Legacy capital-slot machinery such as auctions, DPR, and slot tables does not survive."
    quote: >-
      slot machinery marked donor-only.
    cite: SRC-02-C0037
    topics: [capital-slot, auctions, dpr, legacy, death]
    authority: source
  - id: EXT-1152
    type: open
    summary: "The proposed Spread Quality Sensor formula remained unratified."
    quote: >-
      the candidate formula flagged as unratified.
    cite: SRC-02-C0037
    topics: [sqs, formula, thresholds, open]
    authority: source
  - id: EXT-1153
    type: decision
    summary: "QMX should be fully extensible because the operator cannot yet predict every future use."
    quote: >-
      since, okay, not we, but I'm not certain on how I'm going to be using this fully, but I want it to be okay, QMX rather, what I want QMX to be able to do is be fully extensible.
    cite: SRC-02-C0037
    topics: [qmx, extensibility, product-vision]
    authority: source
  - id: EXT-1154
    type: decision
    summary: "Agents should be able to extend the harness themselves for experiments such as machine learning and other future work."
    quote: >-
      I want this thing to be very extensible in that the agents can build, I won't call them plugins, but they can extend the harness on themselves. So, which means if we want to, you know, experiment with ML, we go ahead and do it. If we want to experiment with anything else, we go ahead and do it.
    cite: SRC-02-C0037
    topics: [agents, extensibility, experiments, machine-learning]
    authority: source
  - id: EXT-1155
    type: decision
    summary: "The data layer should build plumbing now and perform actual downloads during first installation."
    quote: >-
      for the data, the data layer, rather, I don't think it's even the data layer. The other thing we were talking about, the onloading and storage of data. I believe let's just do the plumbing. The downloading will come in during the, like, for example, the first install or something.
    cite: SRC-02-C0037
    topics: [data, plumbing, installation, acquisition]
    authority: source
  - id: EXT-1156
    type: open
    summary: "Context, reversible disposers, and a typed event bus were proposed from the DeepSeek/Cordis study but never ratified in this session."
    quote: >-
      The genuinely new build is seven items, of which three belong in qmf-core: the Context (the container extensions plug into), the disposer discipline (everything undoable), and a typed event bus.
    cite: SRC-02-C0038
    topics: [extensibility, context, disposers, event-bus, open]
    authority: source
  - id: EXT-1157
    type: open
    summary: "A three-tier extension model for open agent workspaces, reviewed app composition, and a sealed live node remained an unratified recommendation."
    quote: >-
      Agent workspaces are fully open — agents extend freely, and they're safe not by restriction but by absence: no live-trading provider even exists in that environment. The app tier is reviewed. The live node is composed once at boot, fingerprinted, then sealed — and promotion from tier to tier is only ever a human edit.
    cite: SRC-02-C0038
    topics: [extensibility, agent-workspaces, app, live-node, open]
    authority: source
  - id: EXT-1158
    type: open
    summary: "Deny-only guards, fail-closed approval, and rejection of hot reload, auto reload, and install-time execution were research proposals rather than operator-ratified rules."
    quote: >-
      Explicitly refused imports: hot-module-reload, auto-reload when a service vanishes, and install-time code execution — all fine for a chat harness, all wrong for money.
    cite: SRC-02-C0038
    topics: [extensibility, safety, hot-reload, open]
    authority: source
  - id: EXT-1159
    type: context
    summary: "The session ended before the operator answered the proposed qmf-core extensibility additions."
    quote: >-
      the idea right now is: let me try to start a fresh session in order to get a better opinion.
    cite: SRC-02-C0038
    topics: [session-handoff, open, extensibility]
    authority: source
  - id: EXT-1160
    type: open
    summary: "Book/BMS design, bot binding, backtesting, sessions, agentic architecture, UI, prop-firm Books, and several risk-priority questions remained explicitly open."
    quote: >-
      Parked with owners: backtesting session (your staged funnel — still waiting on that GPT brainstorm markdown whenever you find it), Book/BMS session (primer ready), bot session, agentic (five papers), UI.
    cite: SRC-02-C0037
    topics: [open, books, bms, backtesting, agentic-system, ui]
