    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-18
    topics: [promotion, registry, live-money-gate]
    authority: rider

  - id: EXT-2019
    type: decision
    summary: "AD-19 data rooms and stores: seven room-roles (ingest door, immutable raw archive, processed, journal, split-governed research door, backup, registry room) instantiated per world with cross-world reads refused; Parquet, DuckDB, SQLite, JSONL behind QMF-owned stdlib-typed contracts; only raw-archive and journal formats are evidence-bearing; rebuild-only deletion licensed solely for uncited artifacts; every external fact carries event-time, known-at, source, revision with source a provenance noun orthogonal to VenueId; corrections append."
    cite: SRC-03:ARCHITECTURE-SPINE.md#AD-19
    topics: [data, rooms, stores, bitemporal]
    authority: rider

