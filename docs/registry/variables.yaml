  - name: original_risk_unit
    symbol: R
    value: 1
    formula: null
    units: pre-trade-risk-unit
    type: ratio
    component: COMP-QMF-RISK
    decision: DEC-0076
    configurable: false
    notes: "R is exactly one unit of original pre-trade risk; it is not profit, equity, or post-trade return (DEC-0076). DEC-0154 (AD-40) elaborates R as one relationship with three typed faces, all frozen at admission: original_risk_distance [price-delta(instrument), entry to the declared original full-loss price], original_risk_amount [money(numeraire), the cost of a full-loss fill at the admitted quantity], and r_multiple [dimensionless exact rational, realized result / original_risk_amount, where -1 is a full original loss and 0 is breakeven]. Both money-bearing faces are frozen at admission and never re-based by a stop move, a protection amendment, or an intraday budget re-derivation; the sole ruled exception is a one-time re-base of original_risk_amount at an entry's first terminal state where the entry filled partially, the admission-time value retained as the declared plan under a lineage edge (DEC-0076 elaborated by DEC-0154, AD-40)."

  - name: news_blackout_before
    symbol: null
    value: declared-per-window-kind
    formula: null
    units: minutes
    type: duration
    component: COMP-QMF-RISK
    decision: DEC-0152
    configurable: true
    notes: "The lead width of a news protection window is a configurable UI-editable CT-31 window variable with no spine value (DEC-0152, DEC-0157, AD-38). A window record is carried as two instants, never as this offset; the offset exists only as configuration the operator sets between sessions. The plus-or-minus-15-minute news buffer is on record as withdrawn — recorded evidence, non-authoritative, never a ratified constant. Supersedes the pair-scoped DEC-0072 framing: the instrument scoping survives, re-mechanised through per-instrument currency-exposure records, while the keep-paper-flowing lead is overridden — a news window blocks live and paper entries alike."

  - name: news_blackout_after
    symbol: null
    value: declared-per-window-kind
    formula: null
    units: minutes
    type: duration
    component: COMP-QMF-RISK
    decision: DEC-0152
    configurable: true
    notes: "The trailing width of a news protection window is a configurable UI-editable CT-31 window variable with no spine value (DEC-0152, DEC-0157, AD-38). A window record is carried as two instants, never as this offset; the offset exists only as configuration the operator sets between sessions. The plus-or-minus-15-minute news buffer is on record as withdrawn — recorded evidence, non-authoritative, never a ratified constant. Supersedes the pair-scoped DEC-0072 framing: the instrument scoping survives, re-mechanised through per-instrument currency-exposure records, while the keep-paper-flowing lead is overridden — a news window blocks live and paper entries alike."

  - name: spread_quality_sensor_formula
    symbol: SQS
    value: 'historical-avg-spread(session-window) / current-live-spread'
    formula: null
    units: null
    type: formula
    component: COMP-QMF-RISK
    decision: DEC-0153
    configurable: false
    notes: "SQS means Spread Quality Sensor. The V1 formula is ratified (DEC-0153, AD-39, supersedes DEC-0075): score = the instrument's historical average spread for a named session window divided by its current live spread — 1 means baseline, above 1 tighter, below 1 wider; a ratio against the instrument's own normal, which lets one sensor serve a book of instruments. The score is an exact rational over the two scaled-integer spreads, so no analytic crossing sits between a measurement and a live-money verdict; the comparison boundary is declared — at or above threshold passes, strictly below blocks. configurable:false marks the formula itself as fixed contract surface; its parameters (thresholds, band, cadence, baseline conditioning, refit schedule, staleness horizon) are separate configurable UI-editable rows. Conditioning is declared, never inferred: the session window is a named market-hours calendar identity plus session id, identity-bearing and entering the baseline's fingerprint; the baseline statistic (mean, median, or a stated quantile) is fingerprinted contract surface, never the bare word 'average'; the baseline is a fingerprinted INPUT artifact carrying a refit-series identity. Operator caveat recorded verbatim and non-authoritative: 'it was some agent's idea, not mine — go with it' — adopted by ruling, not corpus authority (DEC-0153, AD-39)."

  - name: bench_stopout_threshold
    symbol: null
    value: superseded
    formula: null
    units: consecutive-stop-outs
    type: count
    component: COMP-QMF-RISK
    decision: DEC-0155
    configurable: true
    notes: "SUPERSEDED by bench_consecutive_loss_threshold (DEC-0155, AD-41). The overloaded 'stop-out' vocabulary is retired: the bare word 'stop-out' is banned, venue_liquidation names venue margin liquidation, and qualifying_loss_exit names the breaker's input. Row retained as history only; do not read as a live variable. The reported value of two was previously recorded as unusable until stop-out and BENCHED semantics were reconciled; those semantics are now settled in bench_consecutive_loss_threshold plus qualifying_loss_threshold (DEC-0155)."

  - name: bench_reset_boundary
    symbol: null
    value: superseded
    formula: null
    units: null
    type: enum
    component: COMP-QMF-RISK
    decision: DEC-0155
    configurable: true
    notes: "SUPERSEDED (DEC-0155, AD-41). The bench counter is a read-time fold over the exit-record stream, never a mutable counter with a reset boundary; its stream boundary is the binding epoch — a new epoch starts the count at zero unless a signed carries-ledger edge spans it. The reported next-open reset is not a ratified V1 contract; next-open clearing semantics live in the seat-record clearing rules, where clocked mechanical clears are CT-24 binding transitions. Row retained as history only."

  - name: bench_consecutive_loss_threshold
    symbol: null
    value: declared-per-bot
    formula: null
    units: consecutive-qualifying-loss-exits
    type: count
    component: COMP-QMF-RISK
    decision: DEC-0154
    configurable: true
    notes: "Leash_grammar variable, keyed per bot or bot family, minted by the B split (DEC-0154, AD-40) and given its bench semantics by DEC-0155 (AD-41): the count of consecutive qualifying_loss_exit closes at which a seat is benched. A qualifying_loss_exit is a virtual-position close whose realized_r <= -q (see qualifying_loss_threshold). Read as a read-time fold over the exit-record stream bounded by the binding epoch, never a mutable counter. Configurable UI-editable and strategy-family-dependent (DEC-0157). The recorded value of two for a scalper is evidence — non-authoritative, never a ratified spine constant."

  - name: qualifying_loss_threshold
    symbol: q
    value: declared-per-family
    formula: null
    units: r-multiple
    type: ratio
    component: COMP-QMF-RISK
    decision: DEC-0155
    configurable: true
    notes: "The bench predicate threshold (DEC-0155, AD-41): a virtual-position close counts toward the bench only where realized_r <= -q. Per-family template variable, configurable UI-editable (DEC-0157). Breakevens never count under any q and are recorded as their own clustering-watch metric; scratches and partial losses do not count by default (a -0.15R scratch is not the damage the leash exists to stop); a forced flat or boundary flat counts only if it realized a qualifying loss. The default of approximately one R is recorded evidence honouring the operator's 'we only count losses at negative 1R' ruling — non-authoritative, a configuration the operator sets, never a number the spine invents."

  - name: seat_loss_run_allowance
    symbol: null
    value: declared-per-book
    formula: null
    units: r-multiple
    type: ratio
    component: COMP-QMF-RISK
    decision: DEC-0154
    configurable: true
    notes: "Money_rules variable [r-multiple] minted by the B split (DEC-0154, AD-40); the divisor in the money ladder (r_unit_price = period_loss_budget / seat_loss_run_allowance). A Book may declare it derived from bench_consecutive_loss_threshold as declared fingerprinted data (threshold x safety multiple x measured mean loss), never a hardcoded identity — the unit-kind checker enforces the split, since a count cannot stand where an r_multiple is declared. Configurable UI-editable (DEC-0157); no ratified spine value."

  - name: seat_r_ceiling
    symbol: null
    value: declared-per-book
    formula: null
    units: r-multiple
    type: ratio
    component: COMP-QMF-RISK
    decision: DEC-0154
    configurable: true
    notes: "A seat's R ceiling; the constraint seat_r_ceiling <= seat_loss_run_allowance supersedes FORM-0006 in pure R-space, with no money on either side (DEC-0154, AD-40). FORM-0006 stays dead (DEC-0077) and is retained as the dimensional suite's permanent negative test — a dead formula that can still be typed is a dead formula that comes back. Configurable UI-editable (DEC-0157); no ratified spine value."

  - name: runway_periods
    symbol: null
    value: declared-per-book
    formula: null
    units: periods
    type: count
    component: COMP-QMF-RISK
    decision: DEC-0154
    configurable: true
    notes: "The divisor in period_loss_budget = loss_runway / runway_periods (DEC-0154, AD-40); the number of periods the loss runway is spread across. A period is named by an AD-8 market-hours calendar identity, never a bare clock duration. Configurable UI-editable (DEC-0157); no ratified spine value."

  - name: kill_line_capital_floor
    symbol: null
    value: declared-per-book
    formula: null
    units: "money(numeraire)"
    type: money
    component: COMP-QMF-RISK
    decision: DEC-0150
    configurable: true
    notes: "The kill line: a per-Book capital floor whose breach automatically flattens that binding's scope and stands the Book down — a 3am breach never waits for the operator (DEC-0150, AD-36). It is THE SAME NUMBER as loss_floor in the sizing shape (loss_runway = book_capital - loss_floor): one value, one name, read by both the kill-line control and the R sizing ladder, never two floors that can drift apart (DEC-0154, AD-40). Money(numeraire) = USD in V1. Configurable UI-editable (DEC-0157); no ratified spine value. Distinct from the kill switch (the global black-swan authority) — the two are named apart and never interchanged."

