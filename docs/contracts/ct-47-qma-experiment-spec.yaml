id: CT-47
name: QMA ExperimentSpec and the QMB door contract
status: ratified
version: 1  # first minted format version; CT-47 realizes the QMA sitting's AD-17 (ExperimentSpec content-addressing, the single qmb door) with AD-14's Analysis-desk handles and candidate lineage and AD-9's Experiment Ledger (DEC-0316, DEC-0313, DEC-0308); validation closed dry 2026-08-29
owner: COMP-QMA-CORE  # a core definition (AD-1): ExperimentSpec, BacktestHandle and StrategyHandle are qma-core-owned handle kinds and content-addressed records; the daemon and the analysis-backtest plugin's daemon half realize them at runtime (DEC-0313, DEC-0316, DEC-0335)
consumers: []  # defined-unwired: no code exists; the daemon's Compute Router and the analysis-backtest plugin's daemon half realize this contract through core-defined ports (DEC-0316, DEC-0335)
active_consumers: []
intended_consumers: [COMP-QMA-DAEMON]  # the daemon places exactly one qmb job per environment through the analysis-backtest plugin's daemon half, records the Experiment Ledger and mints the content-addressed candidate artifacts and their lineage edges; QMB owns intra-node parallelism, its own run ledger and its artifact contract and QMA never re-specifies it (DEC-0316)
wiring_status: defined-unwired  # ratified surface; no code exists; ExperimentSpecs, candidates and lineage edges reach the daemon store through the AD-6 journal under the AD-1 port pattern; no wiring is authorized from this doc (DEC-0316, DEC-0335)
layer_from: backend
layer_to: backend
decisions: [DEC-0316, DEC-0313, DEC-0308]
gaps: [GAP-0076, GAP-0085]  # GAP-0076 the RLM kernel performance envelope (fan-out throughput and cost per 800-variant aggregation); GAP-0085 the typed strategy-mechanism decomposition QML and qmf-registry own — StrategyHandle and ExperimentSpec are already shaped to carry the result
purpose: >-
  One contract for a reproducible QMA experiment and the single door to QMB: the
  content-addressed `ExperimentSpec` (a code ref only when code changes, a
  resolved-config ref for parameter and configuration changes, plus data ref,
  environment ref, seed, model and harness version, cost assumptions and a
  lineage DAG — never a git branch per parameter), the `BacktestHandle` and
  `StrategyHandle` qma-core handle kinds through which the Analysis desk reads
  recorded evidence and mints content-addressed candidate artifacts, the link to
  the AD-9 Experiment Ledger, and the QMB door — the `analysis-backtest` plugin's
  daemon half exposing one Tool Registry entry plus the single `qmb` door, where
  QMA places exactly one `qmb` job per environment and QMB owns intra-node
  parallelism, its own run ledger and its artifact contract. QMA holds references
  and content-addressed candidates only; Strategy and Bot semantics stay QML- and
  qmf-registry-owned and no QMA contract redefines either noun.
invariants:
  - "CT-47 realizes AD-17's `ExperimentSpec` and single-`qmb`-door path with AD-14's Analysis-desk handles: `ExperimentSpec`, `BacktestHandle` and `StrategyHandle` are qma-core-owned records and handle kinds, and the daemon plus the `analysis-backtest` plugin's daemon half realize them; QMA holds references and content-addressed candidates only and no QMA contract redefines Strategy or Bot, whose semantics stay QML- and qmf-registry-owned (DEC-0316, DEC-0313)."
  - "An `ExperimentSpec` is content-addressed: a code ref ONLY when code changes, a resolved-config ref for parameter and configuration changes, plus a data ref, an environment ref, a seed, the model and harness version, cost assumptions and a lineage DAG — never a git branch per parameter (git-branch-per-parameter-mutation lineage is Cut, DEC-0376); content-addressing is over an fp1 fingerprint (CT-05) so two identical specs collapse to one identity (DEC-0316)."
  - "The lineage DAG is expressed as CT-07 append-only typed lineage edges referencing records by their fp1 fingerprint, never by a mutable or minted id, and edge types are addable in later versions and never redefined; every change produces a new content-addressed record with a lineage edge back to its predecessor and nothing is mutated in place (CT-07 edge law) (DEC-0316, DEC-0313)."
  - "`BacktestHandle` and `StrategyHandle` are members of qma-core's closed-and-addable handle-kind vocabulary, extended only in that registry and never by a plugin; a handle is a daemon-resolved reference whose contents never enter a context window, and no handle addressing a live or writable money-path record — an open order, an open position, a binding, a Book, a seat, a BMS record, a control action, a kill switch or a venue session — may be minted at all (DEC-0313)."
  - "`StrategyHandle` is bounded (L17, L33): it may create only content-addressed candidate artifacts in the parent registry's existing `dev` zone, each carrying a QMA-owned `origin` field; no QMA unit mints or extends a zone value (AD-3); it mutates nothing, candidates included, every change producing a new content-addressed candidate with a lineage edge back to its predecessor (DEC-0313)."
  - "A candidate touching a risk, sizing, exit, protection, binding or priority field is flagged `money_path_relevant` at creation, and the daemon refuses to emit its `approval_request` (AD-20) unless the request payload carries a field-level diff of exactly those fields against the artifact it descends from, under a named `qma-wire` schema; QMA never mints a value for such a field where the ancestor carries none — an unset money-path field stays unset and is filled only by a human (DEC-0313)."
  - "The `ExperimentSpec` links to the AD-9 Experiment Ledger — the scientist's notebook, one per Experiment, owned by the Quant that registered it and appended by the Agent holding the `dispatch_lease` (AD-9) of the Task that registered the Experiment, so two Tasks registering against one Experiment never produce two simultaneous authors; every ledger entry carries `authored_by` and the model deployment used (DEC-0308, DEC-0316)."
  - "QMB is the backtesting path, unchanged: agent to QMA backtest tool to the Backtesting Service — the `analysis-backtest` plugin's daemon half, one Tool Registry entry plus the single `qmb` door, holding no scheduling authority, no parallelism and no state of its own — to the `qmb` CLI or MCP door to QMB; QMA places exactly one `qmb` job per environment and QMB owns intra-node parallelism, its own run ledger and its artifact contract, and QMA never re-specifies it (DEC-0316)."
  - "The Backtesting Service's compute leg is QMB's own, not QMA's Compute Router; the transcript's 'QMX Backtesting Framework' names this same pre-existing product QMB (a retired name recorded in the glossary), and no second backtest governor exists — placing more than one `qmb` job per environment is refused (DEC-0316, DEC-0348)."
  - "This contract mints no execution act: an `ExperimentSpec` runs against recorded evidence and QMB replay only, never an account of any role — paper included — and a `StrategyHandle` candidate reaches the money path only as an artifact a human promotes outside QMA (L17); QMA records only the resulting artifact ref and mints no promotion, order, binding or sizing (DEC-0313, DEC-0341)."
schema:
  type: qma-experiment-spec-and-qmb-door  # a qma-core surface: the content-addressed ExperimentSpec record, the BacktestHandle and StrategyHandle handle kinds, the Experiment Ledger link and the single qmb-door placement (DEC-0316, DEC-0313)
  fields:
    - "experiment_spec.code_ref: a reference to the experiment's code, present ONLY when code changes (DEC-0316)"
    - "experiment_spec.resolved_config_ref: a reference to the resolved configuration, carrying parameter and configuration changes — the identity axis for a parameter sweep (DEC-0316)"
    - "experiment_spec.data_ref: a reference to the input data the experiment consumes (DEC-0316)"
    - "experiment_spec.environment_ref: a reference to the ExecutionEnvironment (CT-46) the experiment runs in (DEC-0316)"
    - "experiment_spec.seed: the random seed making the run reproducible (DEC-0316)"
    - "experiment_spec.model_and_harness_version: the model and harness version stamped on the spec (DEC-0316)"
    - "experiment_spec.cost_assumptions: the declared cost assumptions for the run (DEC-0316)"
    - "experiment_spec.lineage_dag: CT-07 append-only typed lineage edges referencing predecessor records by fp1; never a git branch per parameter (DEC-0316)"
    - "experiment_spec.experiment_ledger_ref: the link to the AD-9 Experiment Ledger for this Experiment, appended by the Agent holding the dispatch_lease of the registering Task (DEC-0308)"
    - "backtest_handle: a qma-core handle kind — a daemon-resolved reference to a backtest whose contents never enter a context window; addresses recorded evidence only (DEC-0313)"
    - "strategy_handle: a qma-core handle kind bounded to creating content-addressed candidate artifacts in the dev zone, each with a QMA-owned origin field and a lineage edge to its predecessor; mutates nothing (DEC-0313)"
    - "strategy_handle.candidate.origin: the QMA-owned origin field every candidate artifact carries in the parent registry's dev zone (DEC-0313)"
    - "strategy_handle.candidate.money_path_relevant: a flag set at creation when a candidate touches a risk, sizing, exit, protection, binding or priority field, gating the approval_request field-level diff (DEC-0313)"
  enums:
    - "handle kinds realized by this contract (a subset of qma-core's closed-and-addable handle-kind vocabulary): BacktestHandle | StrategyHandle — extended only in the qma-core registry and never by a plugin; the full vocabulary also holds ExperimentHandle, TradeLogHandle, KnowledgeHandle and MarketDataHandle (DEC-0313)"
    - "ExperimentSpec identity axes: code_ref (present only on code change) | resolved_config_ref (parameter and configuration changes) — content-addressed over fp1 (CT-05); no git branch per parameter (DEC-0316)"
    - "candidate zone: the parent registry's existing dev zone only — StrategyHandle mints no zone value and extends none (AD-3); promotion into the live zone is a human act outside QMA (L17) (DEC-0313)"
    - "typed refusals on this contract's paths, variants of `qmf-core`'s base (CT-04): this contract mints no new variant; both refusals carry the parent category `policy rejection` per registry:typed_refusal_codes — a second `qmb` job placed into one environment (the single `qmb` door) and an `approval_request` for a `money_path_relevant` candidate whose payload lacks the field-level diff (DEC-0316, DEC-0313)"
  units:
    - "experiment_spec content addresses resolve to fp1 strings (fp1:sha256:<hex>) over the canonical spec content (CT-05); the seed is an integer and cost assumptions are USD-denominated declarations (DEC-0316)"
    - "the RLM fan-out cost ceiling for one 800-variant aggregation is registry:rlm.fanout_cost_ceiling_usd (USD, scope desk); exceeding it re-opens RLM-in-Docker (GAP-0076) (DEC-0313)"
    - "an ExperimentSpec carries references, a seed, versions and cost assumptions only — never a money value, an R value, an order or a sizing decision (DEC-0313)"
  nullability:
    - "code_ref is present ONLY when code changes; an unchanged-code experiment carries no code_ref and is identified by its resolved_config_ref, data_ref, environment_ref, seed and versions (DEC-0316)"
    - "every candidate artifact carries a non-null QMA-owned origin field and at least one lineage edge to its predecessor once a predecessor exists; a first candidate has an origin and no predecessor edge (DEC-0313)"
    - "a money_path_relevant candidate whose approval_request payload lacks the field-level diff of exactly the touched risk/sizing/exit/protection/binding/priority fields is refused, never admitted with the diff absent (DEC-0313)"
    - "the experiment_ledger_ref is mandatory for a registered Experiment; an ExperimentSpec with no resolvable Experiment Ledger is a registration defect (DEC-0308)"
provenance_note: "CT-47 is newly minted by the 2026-08-28 QMX agentic-system (QMA) architecture sitting, realizing AD-17's content-addressed `ExperimentSpec` and single-`qmb`-door Backtesting Service with AD-14's Analysis-desk `BacktestHandle`/`StrategyHandle` and candidate lineage and AD-9's Experiment Ledger (DEC-0316, DEC-0313, DEC-0308). The lineage DAG uses CT-07's append-only typed-edge law and content-addressing uses CT-05's fp1 fingerprints; git-branch-per-parameter-mutation lineage is Cut (DEC-0376) and 'QMX Backtesting Framework' is a retired name for QMB (DEC-0348). The contract is `defined-unwired`: no code exists; QMA holds references and content-addressed candidates only, runs against recorded evidence and QMB replay never an account of any role, and mints no promotion, order, binding or sizing. Ratified as rider material under SRC-15; spine FINAL, validation closed dry 2026-08-29; implementation authorization arrives only through the factory pipeline."
