id: CT-42
name: QMA plugin manifest and plugin context contract
status: ratified
version: 1  # first minted format version; the plugin contribution surface of the QMX agentic system, minted by the 2026-08-28/29 QMA architecture sitting (spine AD-1 port cardinality and the plugin contribution surface, AD-21 the reversible plugin model), validation closed dry 2026-08-29 (DEC-0300, DEC-0320, DEC-0335)
owner: COMP-QMA-CORE  # `PluginManifest` and the `PluginContext` protocol are defined in `qma-core`'s `plugins/` package beside `ports/` (AD-1); the daemon implements the context and owns the loader (DEC-0300, DEC-0335)
consumers: []  # consumer-blind by design: `PluginManifest`/`PluginContext` are qma-core definitions imported by the daemon's plugin loader (the implementer) and by every desk plugin, so no runtime import edge is drawn to the definition from its authors — a plugin imports its contribution types from qma-core and never from qma-daemon (DEC-0300, DEC-0335)
active_consumers: []
intended_consumers: [COMP-QMA-DAEMON]  # the daemon implements the `PluginContext`, owns the loader and holds the plugin roster; the five desk plugin packs (research-*, trading-*, dev-*, analysis-*, pm-*) author manifests against the qma-core types (DEC-0300, DEC-0320, DEC-0337)
wiring_status: defined-unwired  # ratified surface; no code exists; the plugin loader is built in qma-daemon and the desk plugin packs land last in the build order (DEC-0320)
layer_from: backend
layer_to: backend
decisions: [DEC-0300, DEC-0320, DEC-0335, DEC-0337]
gaps: [GAP-0077]  # the in-house threading node's shape and its PluginManifest contribution point — no contribution type is minted and no plugin may declare one until the operator supplies the spec or code
purpose: >-
  The plugin contribution surface of the QMX agentic system: how a desk extension package
  declares itself and registers its contributions reversibly. It fixes the `PluginManifest`
  (id, version, supported `qma_api` range, desk, dependencies, provided contributions with
  their cardinality and scope keys, permissions, entrypoint, migrations and rollback mode),
  the `PluginContext` protocol (the cardinality-typed registration methods, each returning a
  disposer pushed onto a per-plugin async exit stack, and the `credential_ref` reference-only
  string type), the plugin roster entry (the daemon's declarative startup list), and the
  load-refusal law (every hard startup error is a refusal of the LOAD, not of the process).
  Activation registers every contribution through a scoped context honoring AD-1's cardinality;
  unload closes the scope LIFO so every contribution disappears together; data is the half
  LIFO cannot undo, so every migration declares a `down` or the manifest declares
  `rollback: forward_only`. Trust is first-party only in v1 — no trust tiers, no capability
  solver, no plugin store.
invariants:
  - "`qma-core` defines, `qma-daemon` implements: `qma-core` defines the plugin contribution surface — `PluginManifest`, the `PluginContext` protocol carrying the cardinality-typed registration methods, `HookEvent` and `HookResult` (CT-41), the closed handle-kind vocabulary (AD-14) and the `credential_ref` string type AD-24 requires — in a `plugins/` package beside `ports/`; `qma-daemon` implements the context and owns the loader, so a plugin imports its contribution types from `qma-core` and never from `qma-daemon` and AD-2's diagram needs no new edge (DEC-0300, DEC-0335)."
  - "A `PluginManifest` declares id, version, supported `qma_api` range, desk, dependencies, provided contributions, permissions, entrypoint, migrations and rollback mode; the desk is one of the five desk prefix tokens `research-*`, `trading-*`, `dev-*`, `analysis-*`, `pm-*`, and plugins and ledger views are named by desk with no blanket `qmx.` prefix anywhere (DEC-0320, DEC-0337)."
  - "Every contribution point declares a cardinality: every SINGLETON additionally declares an explicit scope key and every MULTI point is keyed by its fully-qualified `<plugin_id>:<local_id>` id; the singletons are MemoryProvider (per desk), KnowledgeSource (per source_id), ExecutionEnvironment (per kind), ComputeProvider (per kind) and ContextCompiler (per daemon); the multi points are tool, tool_adapter, hook, skill, graph_template, model_deployment, toolset and worker_template; there is no `ui_view` contribution point in v1 and a contribution point with no `qma-wire` schema may not be registered (DEC-0300)."
  - "Activation registers every contribution through a scoped `PluginContext` honoring AD-1's cardinality; each cardinality-typed registration method returns a disposer pushed onto a per-plugin async exit stack, and unload closes the scope LIFO so every contribution disappears together — the reversible scoped contribution that lets deactivation replay the inverses (DEC-0300, DEC-0335)."
  - "The daemon's ContextCompiler implementation is a DEFAULT BINDING, not a registration: it occupies the per-daemon key only while no plugin binds it; exactly one plugin may bind the key, which replaces the default at load time and is recorded as a journal event, never as a runtime override; two plugins binding it is a hard startup error; every other singleton key ships no default (DEC-0300)."
  - "Two plugins binding one singleton key is a hard startup error naming both plugin ids, the port and the key — never last-write-wins, never a runtime override; every multi contribution is addressed `<plugin_id>:<local_id>`, unique daemon-wide, and a duplicate is the same hard startup error; toolsets, templates and Role grants reference fully-qualified ids only (DEC-0300)."
  - "The plugin roster is the daemon's declarative startup list of plugins to load, one entry per `plugin_id` carrying its version and enable flag; it is daemon configuration, never a contribution, and it is unrelated to the QMF package roster of parent AD-2; a roster entry whose cardinality or scope key the daemon cannot resolve at startup is a startup error naming the entry and the unresolved field, never a silent absence (DEC-0300)."
  - "An unbound singleton key is a startup error only when a loaded roster entry, plugin manifest or Role grant requires it, and that error names the port, the key and the requiring unit; a key nothing loaded requires stays unbound and its port is unavailable — with no MemoryProvider bound `recall` returns the typed refusal `NoMemoryProvider` and candidates stage under AD-22, and an ExecutionEnvironment or ComputeProvider `kind` no declared environment names is unbound, not an error (DEC-0300)."
  - "Data is the half LIFO cannot undo: every migration declares a `down`, or the manifest declares `rollback: forward_only`; migrations follow parent AD-20's order in full — preflight, backup first, dry-run, migrate, verify, with a documented restore path (AD-27) — and run inside a daemon-held transaction preceded by a recorded journal checkpoint written as evidence with the `correlation_id`; the checkpoint is an ADDITION to the backup, never a substitute, because a marker inside the thing being migrated is not a copy of it (DEC-0320)."
  - "The loader refuses a forward-only upgrade unless an `operator` principal confirms it in that session; a forward-only plugin may be disabled (scope disposed, data intact) but never rolled back; the rollback mode is returned by the install command's preflight query over `qma-wire`, with the operator's confirmation recorded as evidence carrying its `correlation_id` (DEC-0320)."
  - "Load flow: manifest validation, `qma_api` compatibility, permissions, dependencies, migrations, topological activation, publication of contributions, then clients learn the new contribution points over the wire. Load-time refusal law: every condition the spine calls a hard startup error is a refusal of the LOAD, not of the process — at daemon startup it aborts startup naming the offending unit; on an explicit install, enable or reload command it fails that command with a typed refusal naming the same fields, disposes that plugin's scope LIFO, and leaves the running daemon, every `dispatch_lease` and `environment_lease` it holds and every currently running Task untouched; no load-time refusal ever terminates a running daemon or discards a pending evidence append (L39) (DEC-0320)."
  - "Trust is first-party only in v1 — no trust tiers, no capability solver, no plugin store; one logical plugin may span daemon, worker, UI and skills or graph templates, and its halves communicate only over the wire contract, never through shared process memory, and a daemon plugin never renders; reload is an explicit command with no file watcher and no reactive re-mount (DEC-0320)."
  - "A plugin's own contributions reach the definition store through activation as a `machine` principal, so its operator-assigned fields are not set at load: a manifest declaring a `model_family` (AD-15) or a `tool_adapter` desk-and-role binding (AD-16) is refused at load naming the plugin id and the field; those fields are written only by an `operator`-principal wire command (DEC-0320, DEC-0323)."
  - "Existing in-house primitives — the operator names the threading node — must be accommodated by this plugin shape rather than assumed away; its shape is unspecified, so v1 mints no contribution type for it and no plugin may declare one until the operator supplies the spec or code, and the manifest's contribution list stays closed-and-addable (DEC-0320, GAP-0077)."
schema:
  type: plugin-manifest-and-context  # the `PluginManifest` declaration, the `PluginContext` protocol's cardinality-typed registration methods, and the plugin roster entry (DEC-0300, DEC-0320)
  fields:
    - "id (manifest): the `plugin_id`, unique daemon-wide; the roster and every `<plugin_id>:<local_id>` multi contribution key off it (DEC-0320)"
    - "version (manifest): the plugin version, semver (DEC-0320)"
    - "qma_api (manifest): the supported `qma_api` semver range, checked at load for compatibility, additive-only within a major (DEC-0320)"
    - "desk (manifest): the owning desk, one of the five desk prefix tokens; plugins are named by desk (DEC-0337)"
    - "dependencies (manifest): the other `plugin_id`s this plugin requires; a missing dependency is a hard startup error, never a silent pending state (DEC-0320)"
    - "contributions (manifest): the provided contributions, each a cardinality-declared point — a singleton carrying its explicit scope key or a multi point addressed `<plugin_id>:<local_id>`; a contribution point with no `qma-wire` schema may not be registered (DEC-0300)"
    - "permissions (manifest): the plugin's permission set, checked at load (DEC-0320)"
    - "entrypoint (manifest): the activation entrypoint (DEC-0320)"
    - "migrations (manifest): the migration set, each declaring a `down` unless the manifest declares `rollback: forward_only`; each follows parent AD-20's five-step order (DEC-0320)"
    - "rollback (manifest): the rollback mode — `forward_only` (declared by the manifest; operator confirmation required at load) or, absent that declaration, reversible-by-`down` (every migration carries a `down`); the spine names only the `forward_only` token, so the field is present only to declare `forward_only` (DEC-0320)"
    - "registration methods (context): the cardinality-typed registration methods of the `PluginContext` protocol, each returning a disposer pushed onto the per-plugin async exit stack (DEC-0300, DEC-0320)"
    - "credential_ref (context): the credential reference string type the context exposes; the context exposes reference strings only and never a resolved secret value (DEC-0323)"
    - "roster entry: one entry per `plugin_id` carrying its version and enable flag; daemon configuration, never a contribution (DEC-0300)"
  enums:
    - "contribution cardinality: singleton | multi (DEC-0300)"
    - "singleton contribution points and their scope keys: MemoryProvider (per desk) | KnowledgeSource (per source_id) | ExecutionEnvironment (per kind) | ComputeProvider (per kind) | ContextCompiler (per daemon, a default binding replaceable by exactly one plugin) (DEC-0300)"
    - "multi contribution points, each addressed `<plugin_id>:<local_id>`: tool | tool_adapter | hook | skill | graph_template | model_deployment | toolset | worker_template (DEC-0300)"
    - "there is no `ui_view` contribution point in v1: a contribution point with no `qma-wire` schema may not be registered (DEC-0300)"
    - "desk prefix tokens (the manifest desk): research-* | trading-* | dev-* | analysis-* | pm-* (DEC-0337)"
    - "rollback mode: forward_only (the manifest declares it; the loader takes `operator`-principal confirmation at load and the plugin may be disabled but never rolled back) — the spine names only this token; absent the declaration the default is reversible-by-`down` (every migration declares a `down`) (DEC-0320)"
    - "load flow phases (in order): manifest validation | qma_api compatibility | permissions | dependencies | migrations | topological activation | publication of contributions (DEC-0320)"
    - "migration order (parent AD-20, verbatim): preflight | backup first | dry-run | migrate | verify (DEC-0320)"
    - "load-time hard-startup-error conditions, each a refusal of the load naming the offending unit: a missing dependency; a second plugin binding one singleton key (naming both plugin ids, the port and the key); a duplicate `<plugin_id>:<local_id>` multi contribution; a roster entry whose cardinality or scope key is unresolvable; a required-but-unbound singleton key (naming the port, the key and the requiring unit); a manifest declaring an operator-assigned field (`model_family` per AD-15 or a `tool_adapter` desk-and-role binding per AD-16); a forward-only upgrade without `operator` confirmation (DEC-0300, DEC-0320)"
    - "typed refusals reachable through this surface, variants of `qmf-core`'s base: `NoMemoryProvider` (recall with no MemoryProvider bound); `ProhibitedMoneyPathTool` (a contributed tool or a `tool_adapter`-advertised tool matching the AD-16 money-path deny-list, refused at registration) (DEC-0300)"
  units:
    - "`version` and `qma_api` are semver; `qma_api` compatibility is checked at load and additive-only within a major (DEC-0320)"
    - "the migration journal checkpoint is `fp1`-stamped evidence carrying the `correlation_id`, an addition to the AD-27 backup and never a substitute for it (DEC-0320)"
    - "fingerprints (contribution ids resolved to records, the checkpoint): `fp1:sha256:<hex>` imported from the parent, never re-derived (DEC-0300)"
  nullability:
    - "`id`, `version`, `qma_api`, `desk` and `entrypoint` are always present; `rollback` is present only when the manifest declares `forward_only` — absent that declaration the default is reversible-by-`down` and the key is omitted; per `fp1` null is prohibited and an absent value is an omitted key (DEC-0300)"
    - "`dependencies`, `contributions`, `permissions` and `migrations` may be empty — an empty declared value, never null; a plugin providing no migrations declares an empty migration set and omits the `rollback` key, defaulting to reversible-by-`down` (DEC-0320)"
    - "a manifest that declares an operator-assigned field (`model_family`, a `tool_adapter` desk-and-role binding) is refused at load naming the plugin id and the field, never silently accepted (DEC-0320)"
    - "the roster entry's enable flag is always present; a roster entry whose cardinality or scope key the daemon cannot resolve is a startup error naming the entry and the unresolved field, never a silent absence (DEC-0300)"
provenance_note: "CT-42 is newly minted by the 2026-08-28/29 QMA architecture sitting: the plugin contribution surface of the QMX agentic system, realizing AD-1 (contract-hub packages, the plugin contribution surface defined in `qma-core`, port cardinality and scope keys, the plugin roster and the singleton/multi discipline) and AD-21 (the reversible plugin model — `PluginManifest`, the scoped `PluginContext` returning disposers, LIFO unload, declared-reversible data migrations, forward-only confirmation, the load flow and the load-time refusal law) (DEC-0300, DEC-0320, DEC-0335). Namespacing and desk-prefix naming follow DEC-0337. Defined in `qma-core` beside the ports and implemented by the daemon's loader; the contract is `defined-unwired` and no code exists, the desk plugin packs landing last in the build order. The in-house threading node's shape and its contribution point are Deferred (GAP-0077): no contribution type is minted and no plugin may declare one until the operator supplies the spec or code. Implementation authorization arrives only through the factory pipeline."
