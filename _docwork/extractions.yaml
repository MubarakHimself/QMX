    summary: "ALSO RULED FROM THE SAME 2026-08-28 OPERATOR ROUND (dictated dumps): (a) the UI WILL exist and the node must be designed with it in mind everywhere - walk every operator moment (kill switch pressed, news window seen, stuck UNKNOWN, promotion) as a UI story later; for now back end plus data plus DevOps only; (b) MIS MODELS DO NOT EXIST AND MUST BE TRAINED - download, clean, train, shadow-roll - 'the last part should be about the MIS'; either agents train them in a sandbox (hours) or a script the operator runs on his laptop; Kronos-class pretrained models are candidates only (a recovered or pre-trained model carries no authority without fresh ratification); shadow rollout is required, not overruled; (c) extensibility is a requirement: adding Books, BMSs, bots and new versions of each must be registry plus config, never code; (d) alpha decay - 'if we haven't, leave it for now' - AD-41 primitives only; (e) 'QMF is portable' - not this layer's concern."
