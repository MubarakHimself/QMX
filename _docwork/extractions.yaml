  - id: EXT-2152
    type: decision
    summary: "PARTS-BIN VERDICT (Opus seat over the ground-truth inventory of integration@ef9bb25, inputs/parts-bin.md): 154 node capabilities = 78 exists-as-is / 24 exists-needs-live-adapter / 52 does-not-exist. Capability count 58-66 per cent; node-effort-weighted 48.5 per cent; band 45-60 per cent - 'about half, not about 60 per cent'. The operator's roughly 60 per cent is the top of the band and its SHAPE is wrong: roughly 60-80 per cent full where the problem is LAW (risk, control, paper and venue-uncertainty law is finished and tested - qmf-risk 16,905 LOC and 613 tests; qmf-venue 9,180 LOC and 407 tests) and roughly 25-35 per cent full where the problem is RUNTIME (async driver 33 per cent, logging/metrics/health 33 per cent, operator doors and config 26 per cent, deployment and CI 38 per cent). The node is 100 per cent of a runtime plus the wiring of a very complete rulebook. Three does-not-exist clusters: the continuously-running node; operator doors plus supervision plus observability; a real cTrader transport and live market-data path plus the cents and volume decoder and EQUITY DERIVATION. Red flags R1-R15 recorded, every one answered by a TN."
