[project]
name = "qmb"
version = "0.1.0"
description = "QMX experimentation/backtesting library plus the qmb CLI. Application-layer product built on QMF; never a roster package."
requires-python = ">=3.14,<3.15"
# SemVer is display-only provenance (DEC-0167) — the resolved run-config fingerprint
# is identity. Pins are registry:qmb_cli_pin and registry:qmb_sampler_pin (DEC-0168).
dependencies = [
    "qmf-core",
    "qmf-registry",
    "qmf-data",
    "qmf-indicators",
    "qmf-structure",
    "qmf-risk",
    "qml",
    "click==8.4.2",
    "optuna==4.9.0",
]

[project.scripts]
qmb = "qmb.doors.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Top-level import qmb — not a qmf.* PEP 420 namespace submodule.
module-name = "qmb"

[tool.uv.sources]
qmf-core = { workspace = true }
qmf-registry = { workspace = true }
qmf-data = { workspace = true }
qmf-indicators = { workspace = true }
qmf-structure = { workspace = true }
qmf-risk = { workspace = true }
qml = { workspace = true }
