extractions:
  - id: EXT-2126
    type: decision
    summary: "OPERATOR RULING R1 (2026-08-28, dictated brain dump, quoted faithfully): NO OPERATOR COMMAND LINE for the trading node. 'There is nothing like commands or anything... it's a user interface on the desktop application as per the overall architecture.' Killing, status, resolving a stuck order and promotion are UI actions over the node's API door, running the same connection logic the agentic system will use ('the same setting or the same logic behind even the agentic system'); the node is one surface inside that UI, which 'might have its own page... I'm not certain yet'. Priority stated plainly: 'first, make the trading node work, make sure it can execute'. CONSEQUENCE: Door 2 (an operator qmn command line) is DELETED; the control surface is the Python API in-process plus the localhost HTTP evidence channel and the unix-socket powers channel, UI-consumed later; the closed PRD row (qmb = the platform's single command-line surface, FR-046 / DEC-0185 Ruling C) is honored and no reconciliation note is needed. Deployment and provisioning tooling (install, switch/rollback, secrets wizard, data bootstrap, replay, config init/validate/explain, notify test) is an OPERATIONS TOOLKIT exposed as just node-... recipes in the repo's existing justfile, never a product command line and never a trading control - DevOps tooling, which the operator ruled is 'a very separate system, like how big tech teams work'. The package and import name stays qmn as a CODE NAME; the operator declined to rule naming: 'that question is not for this layer'."
    cite: SRC-11:.memlog.md#line-48
    topics: [trading-node, operator-ruling, r1, doors, operations-toolkit, naming]
    authority: rider

  - id: EXT-2127
    type: decision
    summary: "OPERATOR RULING R2 (2026-08-28): SOAK = ONE FULL WEEK unattended on the demo account - 'two days to a week... I think a week is enough and sufficient' - coinciding with the ratified first-deploy warm-up week; live binding at its end; tracking mandatory throughout. On a Prometheus/Grafana-class stack the operator said 'I know what you're talking about': the OBSERVABILITY STACK is a SEPARATE zero-authority system (Prometheus + Grafana + Loki/Promtail-class), containers allowed for THIS stack only, compose file shipped under qmn/deploy/observability/, scanned by Skylos, consuming the node's exported metrics and JSON logs; the node ships the exporters plus dashboard-as-code seeds. A dedicated monitoring agent (the operator's 'Hammers agent') plugs into that stack later - not this sitting's concern."
    cite: SRC-11:.memlog.md#line-48
    topics: [trading-node, operator-ruling, r2, soak, observability-stack]
    authority: rider

  - id: EXT-2128
    type: decision
    summary: "OPERATOR RULING R3 (2026-08-28): PROMOTION = 'a simple click on the user interface... two separate acts' - sign (promote) then activate. Promotion presupposes reviewed backtest evidence (QMB) and, later, the agentic system's own paper-trading period before a bot even returns for promotion ('doesn't concern you... focus on live trading'). The node ships the API for both acts and runs the precondition battery SILENTLY, server-side, against fresh state; the operator sees results, never machinery."
    cite: SRC-11:.memlog.md#line-48
    topics: [trading-node, operator-ruling, r3, promotion, activation]
    authority: rider

  - id: EXT-2129
    type: decision
    summary: "OPERATOR RULING R4 (2026-08-28): NEWS - 'I will not pay for news.' Forex Factory's free weekly file is the SOLE V1 source; NO paid fallback slot, ever. A second FREE source or an agent-scraped JSON in the same CT-15 intake shape is the later fallback path ('later versions, yes, we're going to iterate'). All three sessions are traded, so timeliness matters: the refresh cadence becomes a configurable variable (evidence: every 2 h and before each session open, respecting the free feed's roughly 2 downloads per 5 minutes limit); fail-closed on a failed refresh stands. The legal archiving posture stays an open operator item recorded as personal use."
    cite: SRC-11:.memlog.md#line-48
    topics: [trading-node, operator-ruling, r4, news-calendar, forex-factory]
    authority: rider

  - id: EXT-2130
    type: decision
    summary: "ALSO RULED FROM THE SAME 2026-08-28 OPERATOR ROUND (dictated dumps): (a) the UI WILL exist and the node must be designed with it in mind everywhere - walk every operator moment (kill switch pressed, news window seen, stuck UNKNOWN, promotion) as a UI story later; for now back end plus data plus DevOps only; (b) MIS MODELS DO NOT EXIST AND MUST BE TRAINED - download, clean, train, shadow-roll - 'the last part should be about the MIS'; either agents train them in a sandbox (hours) or a script the operator runs on his laptop; Kronos-class pretrained models are candidates only (a recovered or pre-trained model carries no authority without fresh ratification); shadow rollout is required, not overruled; (c) extensibility is a requirement: adding Books, BMSs, bots and new versions of each must be registry plus config, never code; (d) alpha decay - 'if we haven't, leave it for now' - AD-41 primitives only; (e) 'QMF is portable' - not this layer's concern."
    cite: SRC-11:.memlog.md#line-48
    topics: [trading-node, operator-ruling, ui, mis, extensibility, alpha-decay]
    authority: rider

  - id: EXT-2131
    type: decision
    summary: "AMENDMENTS FROM THE OPERATOR ROUND, applied at desk, TN ids stable (2026-08-28). TN-1: no operator command line; qmn = code and import name only; the operations toolkit = just node-... recipes under qmn/deploy, never a trading control; the command-line reconciliation note WITHDRAWN (no conflict remains with PRD FR-046). TN-17: Door 2 deleted; doors = Python API + localhost HTTP evidence channel + unix-socket powers channel (SO_PEERCRED), consumed by the desktop UI over an SSH tunnel later and by the operations toolkit's few read and act calls during the soak; the wire vocabulary is versioned and will align with the QMA daemon-to-UI wire-contract conventions once that spine fixes them (coordination note, cheap veto A39). TN-9: the soak is the full first-deploy warm-up week, unattended, on the demo account; live binding at its end; acceptance checklist unchanged. TN-13: Forex Factory free weekly file the sole source; no paid slot; news_calendar_refresh_cadence minted configurable (evidence 2 h + pre-session); a second free source or agent-scraped JSON in CT-15 shape the named later fallback. TN-15: the observability stack is a SEPARATE zero-authority system shipped as a compose file under qmn/deploy/observability/ (containers permitted for this stack only; versions pinned at the implementation gate and registered as external tools); the node ships exporters and dashboard seeds; the external dead-man's switch and the push channel stay. TN-19 + Deferred: the SHADOW-LANE SEAM is V1 node work (candidate labeler registration at the root, a shadow snapshot stream to its own manifest prefix, a comparison read model, never a live consumer); MIS TRAINING + SHADOW ROLLOUT = a named follow-on epic after the paper milestone (offline job in a sandbox or on the operator's laptop; data window + seed + code fp1 recorded; versioned model artifacts registered; promotion = ratification, version bump, re-certification); Kronos-class pretrained candidates carry no authority without fresh ratification. TN-18/TN-22: extensibility sentence - adding a Book, BMS, bot or a new version of any is registry + roster config + restart-at-safe-point, never code. TN-20: promotion wording per Q3. The open-questions section becomes 'Operator rulings 2026-08-28'; assumption register A1/A10/A17/A26 marked RULED; A39 added."
    cite: SRC-11:.memlog.md#line-49
    topics: [trading-node, operator-ruling, amendments, tn-1, tn-9, tn-13, tn-15, tn-17, tn-19, tn-20]
    authority: rider

  - id: EXT-2132
    type: decision
    summary: "SPINE SECTION 'Operator rulings 2026-08-28' (FINAL): the four calls the sitting flagged as cheap to overturn were put to the operator and ruled, each applied in the rule text, the operator's decisive words quoted as the memlog records them. R1 - the trading node has NO operator command line; the typed command-line door is deleted (TN-17); the command-line reconciliation note is withdrawn because PRD FR-046 now stands unchallenged (TN-1); deployment and provisioning become an operations toolkit of just node-... recipes, DevOps tooling, never a trading control; the operator declined to rule the name so qmn stays the package and import code name and a rename is mechanical. R2 - the soak IS the ratified first-deploy warm-up week rather than its first two days, unattended, live binding at its end, TN-23 acceptance checklist unchanged (TN-9); TN-15 now ships the observability stack as a separate zero-authority system under qmn/deploy/observability/ with the node's exporters and dashboard seeds as the node's own half. R3 - the precondition battery runs silently, server-side, against fresh state and against reviewed backtest evidence the operator never has to assemble; activation stays a separate act; 'the operator sees results, never machinery' is written into TN-20. R4 - Forex Factory's free weekly file is the SOLE V1 source and the paid fallback slot is deleted everywhere (TN-13); news_calendar_refresh_cadence minted configurable; fail-closed on a failed refresh stands; the later fallback path is a second free source or an agent-scraped JSON in the same CT-15 intake shape; the legal archiving posture stays an open operator item recorded as personal use, exactly as Dukascopy was. ALSO RULED: the UI will exist and every operator moment is a later behaviour-driven UI story; MIS models do not exist and must be trained so the shadow-lane seam is V1 node work and the training itself a named follow-on epic; extensibility is registry plus roster config plus a restart at a safe point, never code; alpha decay stays at AD-41 primitives; 'QMF is portable' is not this layer's concern."
    cite: SRC-11:ARCHITECTURE-SPINE.md#operator-rulings-2026-08-28
    topics: [trading-node, operator-ruling, spine, r1, r2, r3, r4]
    authority: rider

  - id: EXT-2133
    type: decision
    summary: "FIRST-GATE RULINGS 1-5 (orchestrator, applied at desk by fix pass 1; TN ids stable). (1) KILL LINE SERIES - declared by the Book definition, evaluated PER BINDING against that binding's virtual-ledger equity marked to the latest observed price of its virtual positions (realized plus unrealized of its own virtual positions), on every slice carrying a fill or a price update on an instrument the binding holds and at each accounting rollover; venue equity (balance plus unrealized, converted_by=venue, exact integers at the account money exponent) is the BMS/account view and the reconciliation counterpart, never the per-Book breach series; book_capital (period-open, excluding unrealized) is the sizing ladder's input only; ONE variable - the ratified registry key kill_line_capital_floor IS AD-40's loss_floor, the node mints no second name; a breach flattens and stands down that binding only. (2) BACKUP KEY CUSTODY - the CT-14 payload key is generated at provisioning on the workstation, escrowed in Credential Manager qmx/backup-payload-key plus one operator-held offline copy, delivered to the VPS as a bootstrap credential; the VPS-minted KEK protects rotated session material only; a host-loss restore rehearsal (clean host plus escrowed key only) runs once before the live milestone and after every rebuild and is what measures the recovery time objective; a VPS-loss runbook is minted (procure, bootstrap, provision, cTrader re-authorization because the stored refresh token is spent, restore with the escrowed key, replay check). (3) NEVER-AUTO - AD-36 predicates verbatim (suspend_new and drain never-auto, flatten scope-flat-at-reconciled); the SIGTERM stop is a boot-epoch LIFECYCLE state, not a CT-30 action; the clock no-new-entry band is a per-decision-cycle precondition, never a standing action; node STAND-DOWN (crash loop, halt band, preflight failure) is a node lifecycle state entered automatically and left ONLY by an operator resurrect act through the powers door (journaled as an operator control action at global scope); the KSA fold is monotone within a level epoch and lowers only on an operator resume; the standing-intent machinery covers amend_protection and the CT-23 protective closes. (4) NETTING-OR-HEDGING - measured-at-connection CT-18 field; bind-time shared-flatten signature and one-Book-per-netted-account default; scope resolution reads the position model before dispatch and REFUSES rather than widens; fill-to-virtual-position attribution declaration mandatory on netted accounts. (5) SECOND CLI - restated as a declared reconciliation note in TN-1's L30 shape (PRD FR-046 / DEC-0185 Ruling C name qmb the single command-line surface; the node appeared to need an operator-typed door on the VPS; conflict surfaced, never settled at the gate); operator Q1 rewritten to ask whether a second command may exist at all: (a, recommended) qmn as the node's own command on the VPS, (b) a qmb node group via a separate proxy distribution over the HTTP door, (c) API plus HTTP doors only, no command line. Blast radius: /opt/qmx and the qmx/* credential labels are platform names and stay; the command and import name and the qmn_ metric prefix move together."
    cite: SRC-11:.memlog.md#line-46
    topics: [trading-node, gate-rulings, kill-line, backup-key, never-auto, netting, command-line]
    authority: rider

  - id: EXT-2134
    type: decision
    summary: "FIRST-GATE RULINGS 6-10. (6) ENTRY-SIDE-ONLY BLOCKS - every block the node can raise on a command stream (startup gating, rotation-store failure, unpersistable sink, partial write, outstanding UNKNOWN, stand-down) refuses place_order and risk-increasing amend_protection only and never a cancel, close, close_all or risk-non-increasing amend; where the venue path is unavailable a protective command becomes a standing intent; in stand-down operator protective commands and the standing-intent dispatcher always pass ('reachable' means enactable). (7) REFRESH BY CREDENTIAL REFERENCE - at most one refresh in flight per credential reference, owned by the connection manager as a whole; the roster declares whether demo and live share one cTID credential; an auth failure attributable to a rotation in flight is retry-after-refresh, never UNKNOWN. (8) CONFIG = ELIGIBILITY AND IDENTITY ONLY - the resolved node-config never carries runtime state; Book mode, binding state, seat state, standing intents, KSA level, bench counts, exposure and budgets are folds; paper flip, activation and benching mint records, never config versions; docs/registry/variables.yaml declares schema only (unit-kind, flags, owner scope, admission_impact, evidence values) and the config artifact is the sole home of resolved values. (9) COUNTERS - the command ordinal (monotone, never reused across the life of a (VenueId, account) stream, durable high-water mark recovered before the sequencers open) is distinct from the journal sequence (gapless per writer and boot epoch); clientMsgId is carried by a durable command-id-binding record persisted BEFORE submission (the V1 path; 100 chars cannot be a total injection); the submission deadline starts at wire handoff, never at mint; pacer wait is a local queue with its own bound and a veto-path refusal, never UNKNOWN. (10) EQUITY/DRIFT DOMAIN - exact scaled-integer arithmetic at the account money exponent; per-figure decode at its own declared exponent then exact re-scale; an unscalable or exponent-less figure refuses; epsilon 0 is a statement about that domain."
    cite: SRC-11:.memlog.md#line-46
    topics: [trading-node, gate-rulings, l39, secrets, config, counters, money-domain]
    authority: rider

  - id: EXT-2135
    type: decision
    summary: "FIRST-GATE RULINGS 11-15. (11) SUPERVISION MECHANICS - doors (evidence channel, preflight-status view, resurrect) bind BEFORE preflight; a boot-attempt record is the first durable write; the crash-loop fold counts attempts by stage; preflight failure boots into stand-down-alive; only a failure that prevents the doors from binding exits non-zero; READY=1 and WATCHDOG=1 are owned by the supervisor and door layer (raw sd_notify protocol over a stdlib AF_UNIX datagram socket, no python-systemd), never the domain loop; StartLimitBurst above K with StartLimitIntervalSec at or above T; TimeoutStopSec at or above the declared drain window; a safe point = between slices, suspend_new enforced, every command terminal or UNKNOWN-minted, sinks flushed; shutdown mints UNKNOWN for every in-flight command, bounded by the drain window, then exits non-zero if unreached. (12) SERVICE ACCOUNT - a FIXED User=qmx service account for all four units (not DynamicUser), every writable tree under /var/lib/qmx/{rooms,evidence,hub-inbox,hub-published,archive,state,staging} with ProtectSystem=strict plus ReadWritePaths=/var/lib/qmx; each unit receives only its own credentials via LoadCredentialEncrypted; systemd-creds encrypt --with-key=host pinned; three named secret holders (connection manager: venue session material; backup unit: payload key plus bucket credentials for one run; observability path: notification token). (13) VENUE PORT - the node mints its own VenueClientPort over the CT-19/CT-20 shapes with two V1 implementations (cTrader client, replay adapter); qmf-venue is not amended; realizing the seam in qmf-venue is recorded as a candidate AD-28 annotation. (14) REPLAY - a named one-way replay import port is the single sanctioned cross-world read (reads sealed live-world observations from the evidence tier, so a purge never orphans replay); replay artifacts are world=replay, never ledgered (not a B-3/B-4 governed run), the decision diff is an ungoverned diagnostic report; world is a component of the bot-state scope. (15) MIS/SQS - SQS reaches the door only inside the per-instant signal snapshot; every producer feeding it reads as of the slice frontier, never wall-now; the labelers are CT-16 configured producers under AD-24 (heavy by default until the rung baseline, then a proven light claim); until then the snapshot is fanned out with staleness stamps and consumed under a declared maximum age; the baseline is keyed (VenueId, environment, instrument) and a demo-conditioned baseline never satisfies a role=live binding."
    cite: SRC-11:.memlog.md#line-46
    topics: [trading-node, gate-rulings, supervision, service-account, venue-port, replay, sqs]
    authority: rider

  - id: EXT-2136
    type: decision
    summary: "FIRST-GATE RULINGS 16-20 and the closing clause. (16) VALUE STATUS - every node variable carries value-status in blank | provisional-evidence | ratified; a provisional value that gates live money blocks role=live exactly as a blank until an operator countersign through the powers channel; the soak requires at least provisional values for everything its checklist exercises (a pre-SOAK ruling, not pre-live). (17) TN-25 MINTED - the accounting boundary and the virtual ledger (qmn/ledger). (18) ALERT ALLOW-LIST gains one class - 'the node has stopped accepting entries or cannot persist evidence for a reason that is not a KSA escalation' (clock band no-new-entry, live-drift stand-down, failed news-calendar refresh, degraded or dead canonical feed, backup or restore-drill failure, disk headroom) - plus an EXTERNAL dead-man's switch (heartbeat to an off-VPS watcher, Healthchecks/ntfy-class, config by reference) and a liveness digest that survives go-live. (19) POWERS AUTH - the powers channel is served over a unix domain socket with SO_PEERCRED; the peer credential is recorded with the claimed signer and must be the declared operator principal (over SSH, the forwarded socket's sshd user); the evidence channel stays localhost HTTP. (20) KILL-LINE DRILL IN PAPER - the paper ledger RUNS (frozen starting balance plus realized plus unrealized of paper virtual positions) so a paper capital floor is evaluable, plus an operator-signed synthetic breach drill for the soak. CLOSING CLAUSE: every other reviewer finding, all severities across all six reviews, is applied as its review states it; parent M9 uses 'quiesced' for the session sense of drain; parent H9 is applied per ruling (1)."
    cite: SRC-11:.memlog.md#line-46
    topics: [trading-node, gate-rulings, value-status, tn-25, alerts, powers-channel, paper-ledger]
    authority: rider

  - id: EXT-2137
    type: decision
    summary: "REVIEWER GATE RUN (six parallel lenses on the draft spine; first run lost three seats to a connection drop, resumed with cache): rubric 3C/8H/13M/4L (CONDITIONAL PASS); adversarial 7C/15H/10M/4L (CONDITIONAL PASS); parent-consistency 4C/15H/24M/9L (DO NOT RATIFY AS-IS); inputs-reconcile 0C/2H/5M/8L (PASS WITH CHANGES); ops-security 1C/7H/7M/2L (CHANGES REQUESTED); currency 0C/1H/1M/4L (PASS - every pin current and primary-sourced; proto tag 91 confirmed newest). CONVERGENT CRITICALS, the reason each gate ruling changed behaviour: kill-line input series undefined; backup key VPS-minted and host-sealed (dies with the host); drain made self-clearing against AD-36 never-auto; netting-or-hedging never modelled; the second-command-line question settled locally against a CLOSED PRD row; four blanket command-pipe blocks against L39; stand-down disarms the operator's flatten; one cTID credential refreshed per connection; Book mode and seat state owned twice (sealed config versus folds); command ordinal conflated with the journal sequence; the KSA fold could decay through a clocked reconcile; equity and drift arithmetic domain undeclared under epsilon 0. All closable at desk; none needed the operator except the Q1 rewrite."
    cite: SRC-11:.memlog.md#line-45
    topics: [trading-node, reviewer-gate, criticals]
    authority: rider

  - id: EXT-2138
    type: decision
    summary: "FIX PASS 1 APPLIED (Opus seat; reviews/fix-pass-1.md, 243 rows): 150 findings from six lenses applied (rubric 29, adversarial 36, parent-consistency 45, inputs-reconcile 15, ops-security 19, currency 6); spine 936 lines, TN-1..TN-25 with TN-25 (accounting boundary plus virtual ledger) minted; lint clean; six diagrams valid. New assumptions: A31 fixed qmx service account; A32 SO_PEERCRED powers socket; A33 replay import port; A34 value-status field; A35 external dead-man's switch; A36 node-minted VenueClientPort; A37 the cTrader transport increment lands in qmf-venue completing its existing connection manager (parent locus, cheap veto, flagged); A38 seat-callback deadline plus quarantine. A8 RETIRED (the dead-zone width carries no node posture). The operator round was then held (one AskUserQuestion, four questions)."
    cite: SRC-11:.memlog.md#line-47
    topics: [trading-node, fix-pass, assumptions, tn-25]
    authority: rider

  - id: EXT-2139
    type: decision
    summary: "GATE-2 RULINGS 1-17 (orchestrator; applied by residual fix pass 2; TN ids stable). (1) AD-27's per-command UNKNOWN block is NOT entry-side - it is the one non-control block (AD-36): every command on that (VenueId, account) stream is refused, protection included; a refused protective act stands as a standing protection intent journaled before dispatch and re-decided on resolution; only resolve_unknown clears it; TN-23 and TN-24(c) corrected. (2) Protective-stop ATTACHMENT at placement is written into the order path (AD-33/AD-34: entry-relative form for MARKET orders; undeclared capability plus required attachment = unsupported capability refusal; the resting protective order may differ by slippage - AD-40's declaration stays the plan). (3) Node stand-down refuses ENTRY intents only, whatever the author; every risk-non-increasing act passes (Book force-flats, ExitLogicModule exits, bot tightens, standing intents, operator commands). (4) resurrect is a node LIFECYCLE act journaled as an AD-21 control action EVENT under the declared node subtype node_resurrect (operator signer, global scope), not a CT-30 kind - proposed as a doc-factory subtype mint. (5) A detected preflight REFUSAL never exits (stand-down alive, doors serving); the crash-loop fold counts only failures that DO exit (door-binding failure, unhandled death after boot); StartLimitBurst above K, StartLimitIntervalSec at or above T; a requested restart exits code 75 with RestartForceExitStatus=75/SuccessExitStatus=75 and never advances (K,T). (6) VenueClientPort implementation selected by (world, VenueId): world=replay selects the replay implementation for every venue; a replay composition resolves no credential, holds no venue secret, opens no socket (preflight proves it); a replay run is a stdlib process-per-job OUTSIDE the node process with disjoint replay WriterIds; the port has THREE V1 implementations (cTrader client, replay adapter, the FEAT-0023 conformance double). (7) News-calendar revisions may only WIDEN or ADD an in-force or same-day window automatically; narrowing, downgrading or removing one takes effect no earlier than the superseded window's end and is otherwise an operator act; calendar CODE identity is sealed into composition_fp, news-calendar DATA snapshots are frontier-read observations; news_calendar_max_staleness minted (per-decision-cycle precondition, fail-closed); recorder retry policy declared within the provider budget. (8) Retry-after-refresh applies ONLY to requests without a command identity (auth, subscription, heartbeat, gap replay, read-back); commands are never retried (UNKNOWN past wire handoff, veto-path refusal before). (9) Delegated impurity clause: qmf-venue's ConnectionManager holds the socket, session and the single venue secret value on the loop, Clock and SecretStore the node injects; owns no loop, schedules nothing itself; the QMF async conformance test is amended in the same increment to exempt qmf.venue.connection by name (parent annotation); if refused at the parent the increment lands in qmn.venue.ctrader - epics may not choose. The sanctioned qmf-venue import boundary is the qmn.venue subpackage. (10) Reconciliation compares TWO residuals separately - QUANTITY (virtual positions versus venue position picture per instrument, exact units, under netting or hedging) and CASH (venue realized balance versus virtual realized cash plus named components, exact integers at the account exponent); unrealized P&L is a mark and is NEVER reconciled; the two equity series are reported side by side with their mark instants; only a residual in quantity or cash sets operator_review. (11) Powers socket /run/qmn/powers.sock, owner qmx:qmxops, mode 0660, RuntimeDirectory; TWO declared peer principals by uid, neither the qmx service account: the operator principal (every power) and the ops principal (notify_test, restore_drill_run, config_validate, hub_publish, evidence reads only); every trading, protection, promotion, activation, settings, resurrect, attest and countersign power is refused for the ops principal by the transport; preflight refuses to boot if any unit runs under an operator-principal uid; SO_PEERCRED proves an account, not a human - a named residual risk (A32). The powers list is CLOSED and gains restore_drill_run, config_version_activate, seat_reinstate, hub_publish (also a just node-hub-publish recipe calling that power; refuses provenance=sandbox at publish AND at pull). (12) /opt/qmx = immutable per-commit trees plus a current symlink flipped atomically at the restart; a deployment record on the version graph carries commit plus config version; old trees pruned by a declared depth. (13) The observability stack: own unit qmx-observability.service under a distinct non-qmx account, storage under /var/lib/qmx-observability as a named line item of vps_disk_budget with its own quota, network_mode host with every port bound to 127.0.0.1, scraping /metrics only, reading the node's logs through a dedicated read-only journal namespace, its own credentials a DECLARED FOURTH secret holder (holding nothing the node holds); provisioning installs and pins a container runtime for this stack only; the egress allow-list gains the image registry or a vendored image source; the node runs and passes without the stack. (14) Shadow lane: candidate labelers enter a separate shadow_composition_fp, never the governed composition_fp; candidates are heavy by construction, computed off the trading path from frontier-stamped inputs, never counted toward max_slice_latency, dropped with a data-quality record on their own bound; bound by every governed-labeler rule. (15) Attribution declarations on a netted account must be jointly exhaustive and disjoint - a partition proved at compile, else invalid input. (16) Timer units compose from the config version the RUNNING node sealed (read over the evidence channel); node-absent means compose from current and stamp node-absent; neither readable means refuse and alarm. Two restore timers: qmn-restore-sample.timer (nightly) and qmn-restore-full.timer (monthly); host-loss rehearsal = the restore_drill_run power; qmn-news-calendar.timer renamed. Unit count stated accordingly. (17) The benchmark harness never runs concurrently with a slice-driving node (before the doors open, or from stand-down); governor budgets are soak-blocking; the heavy snapshot's maximum age IS decision_freshness_bound (no second bound); a labeler that cannot publish inside it publishes not_ready."
    cite: SRC-11:.memlog.md#line-51
    topics: [trading-node, gate-2-rulings, unknown-block, resurrect, venue-port, reconciliation, powers-channel, observability-stack, shadow-lane]
    authority: rider

  - id: EXT-2140
    type: decision
    summary: "GATE-2 RULINGS 18-34 and the closing clause. (18) The workstation installation is provisioning-only and ENFORCED: the composition root refuses to compose off the roster's VPS machine tuple; the SecretStore refuses a venue-session holder off that host; a tier-1 check proves the wizard module imports neither the connection manager nor the refresh duty; a tier-1 check proves no console-script entry point and no publishable target. (19) No float on the money path at all: venue money and volume decode from wire integers at their declared exponent; a money field arriving as a float is refused; the sanctioned float crossings are non-money wire floats (execution prices per CT-18's declared class) and the declared comparison-rule quantize. (20) BLANKS PARTITION into three effects tagged per mint-table row: blocks-boot (a mechanism cannot run without it: submission_deadline, accumulator_bound, max_slice_latency, local_queue_bound, crash-loop K/T, drain_window, watchdog_interval), blocks-role-live (money gates), blocks-soak (any variable a TN-23 checklist item exercises - a GENERATED rule, not a list; the soak gate refuses to start otherwise). (21) A protection intent that cannot be journaled because the journal room is unpersistable is written to a small reserved protection-intent extent under /var/lib/qmx/state sized by disk_headroom_min (the headroom block trips first); if even that fails the intent is recorded UNDELIVERABLE, alarmed on the silent-degradation class, and the venue-resident protective order carries the position - never 'held in memory'. (22) value-status lives on the resolved config artifact's row for every value (Book-declared values included; the compiler propagates it onto generated fragments); the registry declares value_status_required as schema; a countersign mints a new config version like any settings edit, journaled, and is refused without the variable's EVIDENCE CITATION by fp1 (one variable per call). (23) Seat containment: a slice-progress watch in the door layer stops the WATCHDOG keepalive when now minus slice_start exceeds the callback deadline by a declared factor, pushes on the silent-degradation class and lets systemd restart (safe: restarts never flatten); V1 cannot interrupt a non-cooperative callback - stated; leaving quarantined = the operator-signed seat_reinstate power (its own CT-24 transition). (24) The KSA level is folded PER ENFORCEMENT SCOPE (global plus per (VenueId, account) stream), scope part of the level identity and level epoch; effective level = most restrictive covering scope; an operator resume names the scope it reopens; connectivity and unknown_state escalations on the live connection do NOT block paper routing to the paired demo stream (distinct streams, AD-35) - they block that stream. (25) A reserved SUPERVISOR WriterId (constant of the unit role, never re-issued by Compose) owns the boot-attempt and lifecycle stream, placed under /var/lib/qmx/state. (26) The evidence tier instantiates a named sealed-archive room role per world for synced observation and journal content (plus the research door and registry room); the replay import port and the backup read that role; hot-room purge precondition = a verified copy in sealed-archive AND a verified off-host copy. (27) Position and balance read-back observations are CT-20 observation kinds journaled under the existing seven AD-21 types through CT-20's mapping table - a proposed CT-20 mapping-row addition (parent annotation), never a new journal type. (28) drain_window and watchdog_interval minted (duration, configurable); TimeoutStopSec and WatchdogSec are RENDERED into the unit file from the config artifact by node-install. (29) just pinned and registered as an external tool; the bootstrap script installs uv, CPython, just, the container runtime for the stack, and clones at the pinned commit. (30) TN-18's config compile has FOUR layers (roster, BMS fragment, Book fragment, node defaults) - the invocation layer is deleted. (31) PRD section 3 allow-list widening (silent-degradation class plus dead-man's switch plus liveness digest) is recorded as a PROPOSED PRD AMENDMENT in the parent-annotations section, surfaced not settled. (32) The soak runs on the demo binding; the live connection is opened for SENSING AND RECORDING ONLY as soon as live credentials exist (no live binding, no command stream) so the live-environment SQS baseline and rung baseline accumulate; the live binding waits on its own baselines - a precondition stated in TN-9/TN-23, so a late Spotware approval delays go-live, never the soak; SessionTopology's connection count is derived from the roster (a qmf-venue increment item relaxing the ClassVar). (33) No scale-in refusal at the door over VIRTUAL positions (AD-40); close_partial refused (AD-33); absent-or-terminal subject resolves without submission (AD-27); arbitration strictly by rank with no arrival-order input and Tier 1 venue-resident actions outside the ordering (AD-37); no-pending-orders-at-reconciled-verdict expressible in the matrix cell. (34) FAILURES.md's notification-tier column is the SOLE home of alert-class membership (the registry membership row withdrawn). CLOSING CLAUSE: every other re-gate finding of every severity is applied as its review states it; the Inherited Invariants shadow-lane row is corrected to 'seam built now, ML half deferred'; the memlog authority line in the assumption register points at the ruling entries as amended."
