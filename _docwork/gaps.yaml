  - id: GAP-0023
    question: "What canonical bitemporal fact shape preserves event time, knowledge time, source, revision, and late correction semantics?"
    needed_by: [COMP-QMF-DATA, COMP-QMF-REGISTRY]
    blocking: false
    recommendation: "Make event_time and known_at mandatory for mutable external facts, attach immutable source and revision identity, and append corrections instead of overwriting evidence."
