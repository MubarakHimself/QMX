# Drop-in notes for the dedicated read-only journal namespace (DEC-0200).
# Installed by `just node-install` onto the VPS — not applied from CI.
#
# Node unit qmn.service sets LogNamespace=qmn so operator JSON-lines logs land
# in /var/log/journal/<machine-id>.qmn/ rather than the system journal.
# Promtail (qmxobs) is granted read-only access to that namespace only; a
# system-wide shipper is forbidden because it would see provisioning and
# other secret-holder units.
#
# Example ACL applied by node-install (ops-principal sudo on the VPS):
#   setfacl -R -m u:qmxobs:rx /var/log/journal/<machine-id>.qmn
#   setfacl -R -d -m u:qmxobs:rx /var/log/journal/<machine-id>.qmn
#
# journald size cap remains a named registry:vps_disk_budget line item
# (SystemMaxUse); this file does not invent a numeric cap.

[Journal]
# Storage and SystemMaxUse are host-level; values come from the resolved
# node-config artifact at install time. Left unset here on purpose.
