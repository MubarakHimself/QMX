  - id: DEC-0371
    title: "Cut: plaintext credential files as a source for any QMA-resolved secret"
    statement: "QMA would read plaintext credential files in a home directory as a source for a QMA-resolved secret. This is CUT under L34: QMA handles references only, with values kept in the OS store through the Credential Broker (AD-24). A local-proxy Deployment's own provider credentials stay that proxy's custody outside QMA's namespace and are never read, copied, migrated or referenced by QMA (AD-15, AD-24)."
    status: dead
    rationale: "Cut outright at the QMA sitting under D21 spine law (DEC-0329); binds L34 and pairs with DEC-0344 (a local proxy's own credentials stay outside QMA's namespace)."
    sources: [EXT-2400, EXT-2412]
    component: null
    tags: [cut, dead]
    reason: "L34: QMA handles references only, values in the OS store through the Credential Broker; a local-proxy Deployment's own provider credentials remain that proxy's custody outside QMA's namespace, never read, copied, migrated or referenced by QMA (AD-15, AD-24)"
  - id: DEC-0372
    title: "Cut: multi-tenant memory and knowledge machinery (orgs, projects, ACLs, sharing, webhooks, billing)"
    statement: "QMA would carry multi-tenant memory and knowledge machinery — orgs, projects, ACLs, sharing, webhooks and billing. This is CUT: QMA keeps the memory/knowledge engine (AD-18, AD-19) but drops the tenancy, because there is a single operator."
    status: dead
